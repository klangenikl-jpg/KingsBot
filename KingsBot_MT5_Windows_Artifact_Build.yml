name: King's Bot Build - MT5 Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'KingsBot/**'
      - '.github/workflows/KingsBot_build_MT5_Windows.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20

    steps:

      - name: Get King's Bot source
        uses: actions/checkout@v4

      - name: Download MetaTrader 5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'

          Write-Host '======================================'
          Write-Host 'DOWNLOADING METATRADER 5'
          Write-Host '======================================'

          Invoke-WebRequest `
            -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' `
            -OutFile $installer

          if (!(Test-Path $installer)) {
            throw 'MetaTrader 5 installer download failed.'
          }

          Write-Host "Installer downloaded: $installer"

      - name: Install MetaTrader 5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          $mt5Dir = 'C:\MT5'

          Write-Host '======================================'
          Write-Host 'INSTALLING METATRADER 5'
          Write-Host '======================================'

          if (Test-Path $mt5Dir) {
            Remove-Item $mt5Dir -Recurse -Force
          }

          New-Item -ItemType Directory -Path $mt5Dir -Force | Out-Null

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList '/auto', "/path:$mt5Dir" `
            -Wait `
            -PassThru

          Write-Host "Installer exit code: $($process.ExitCode)"

          Write-Host 'Searching for MetaEditor...'

          $editor = Get-ChildItem `
            -Path 'C:\MT5' `
            -Filter 'metaeditor64.exe' `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (!$editor) {
            Write-Host 'MetaEditor was not found in C:\MT5.'
            Write-Host 'Searching the runner for MetaEditor...'

            $editor = Get-ChildItem `
              -Path 'C:\Program Files','C:\Program Files (x86)' `
              -Filter 'metaeditor64.exe' `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }

          if (!$editor) {
            throw 'MetaEditor64.exe could not be located after MetaTrader 5 installation.'
          }

          Write-Host "MetaEditor found:"
          Write-Host $editor.FullName

          "METAEDITOR=$($editor.FullName)" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append

      - name: Locate King's Bot source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host '======================================'
          Write-Host 'LOCATING KING''S BOT SOURCE'
          Write-Host '======================================'

          $sourceRoot = Join-Path $env:GITHUB_WORKSPACE 'KingsBot'

          if (!(Test-Path $sourceRoot)) {
            throw "KingsBot directory was not found: $sourceRoot"
          }

          $source = Join-Path `
            $sourceRoot `
            'KingsBot_Phase6_Integration.mq5'

          if (!(Test-Path $source)) {
            Write-Host 'Expected file was not found.'
            Write-Host 'Available MQ5 files:'

            Get-ChildItem `
              -Path $sourceRoot `
              -Filter '*.mq5' `
              -Recurse |
              Select-Object FullName

            throw "KingsBot_Phase6_Integration.mq5 was not found."
          }

          Write-Host "Source found:"
          Write-Host $source

          "KING_SOURCE=$source" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append

      - name: Stage King's Bot into MT5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host '======================================'
          Write-Host 'STAGING KING''S BOT'
          Write-Host '======================================'

          $sourceRoot = Join-Path $env:GITHUB_WORKSPACE 'KingsBot'
          $mqlRoot = 'C:\MT5\MQL5'
          $target = Join-Path $mqlRoot 'KingsBot'

          New-Item `
            -ItemType Directory `
            -Path $target `
            -Force |
            Out-Null

          Copy-Item `
            -Path (Join-Path $sourceRoot '*') `
            -Destination $target `
            -Recurse `
            -Force

          Write-Host "King's Bot staged at:"
          Write-Host $target

          Write-Host 'MQ5/MQH files:'

          Get-ChildItem `
            -Path $target `
            -Recurse `
            -File |
            Where-Object {
              $_.Extension -eq '.mq5' -or
              $_.Extension -eq '.mqh'
            } |
            Select-Object FullName

      - name: Compile King's Bot
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host '======================================'
          Write-Host 'COMPILING KING''S BOT'
          Write-Host '======================================'

          $source = 'C:\MT5\MQL5\KingsBot\KingsBot_Phase6_Integration.mq5'
          $include = 'C:\MT5\MQL5'

          if (!(Test-Path $source)) {
            throw "Compile source not found: $source"
          }

          if (!(Test-Path $env:METAEDITOR)) {
            throw "MetaEditor not found: $env:METAEDITOR"
          }

          Write-Host "MetaEditor:"
          Write-Host $env:METAEDITOR

          Write-Host "Source:"
          Write-Host $source

          Write-Host 'Starting MetaEditor compiler...'

          & $env:METAEDITOR `
            "/compile:$source" `
            "/include:$include" `
            /log

          $log = [System.IO.Path]::ChangeExtension(
            $source,
            '.log'
          )

          $ex5 = [System.IO.Path]::ChangeExtension(
            $source,
            '.ex5'
          )

          Write-Host '======================================'
          Write-Host 'COMPILER OUTPUT'
          Write-Host '======================================'

          if (Test-Path $log) {
            Get-Content $log
          }
          else {
            Write-Host 'MetaEditor log was not created.'
          }

          Write-Host '======================================'

          if (!(Test-Path $ex5)) {
            throw "COMPILATION FAILED: EX5 was not produced: $ex5"
          }

          Write-Host '======================================'
          Write-Host 'COMPILATION SUCCESSFUL'
          Write-Host '======================================'

          Write-Host "EX5:"
          Write-Host $ex5

      - name: Verify EX5 artifact
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host '======================================'
          Write-Host 'VERIFYING BUILD ARTIFACT'
          Write-Host '======================================'

          $files = Get-ChildItem `
            -Path 'C:\MT5\MQL5\KingsBot' `
            -Filter '*.ex5' `
            -Recurse `
            -ErrorAction SilentlyContinue

          if (!$files) {
            throw 'VERIFICATION FAILED: No EX5 file exists.'
          }

          foreach ($file in $files) {
            Write-Host "FOUND: $($file.FullName)"
            Write-Host "SIZE: $($file.Length) bytes"

            if ($file.Length -le 0) {
              throw "Invalid zero-byte EX5 file: $($file.FullName)"
            }
          }

          Write-Host 'EX5 verification passed.'

      - name: Prepare build artifacts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host '======================================'
          Write-Host 'PREPARING ARTIFACTS'
          Write-Host '======================================'

          New-Item `
            -ItemType Directory `
            -Path 'artifacts' `
            -Force |
            Out-Null

          $ex5Files = Get-ChildItem `
            -Path 'C:\MT5\MQL5\KingsBot' `
            -Filter '*.ex5' `
            -Recurse

          foreach ($file in $ex5Files) {
            Copy-Item `
              -Path $file.FullName `
              -Destination 'artifacts' `
              -Force
          }

          $logFiles = Get-ChildItem `
            -Path 'C:\MT5\MQL5\KingsBot' `
            -Filter '*.log' `
            -Recurse `
            -ErrorAction SilentlyContinue

          foreach ($log in $logFiles) {
            Copy-Item `
              -Path $log.FullName `
              -Destination 'artifacts' `
              -Force
          }

          Write-Host 'Artifacts prepared:'

          Get-ChildItem `
            -Path 'artifacts' `
            -File |
            Select-Object Name, Length

          if (!(Get-ChildItem 'artifacts' -File)) {
            throw 'Artifacts directory is empty.'
          }

      - name: Upload King's Bot build
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-MT5-Build
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
