name: KingsBot MQL5 Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Get KingsBot source
        uses: actions/checkout@v4

      - name: Install MetaTrader 5
        shell: powershell
        run: |
          $installer = "$env:RUNNER_TEMP\mt5setup.exe"
          Invoke-WebRequest -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" -OutFile $installer
          Start-Process $installer -ArgumentList "/auto" -Wait

      - name: Find MetaEditor
        id: metaeditor
        shell: powershell
        run: |
          $paths = @(
            "$env:ProgramFiles\MetaTrader 5\metaeditor64.exe",
            "${env:ProgramFiles(x86)}\MetaTrader 5\metaeditor64.exe"
          )

          $found = $paths | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $found) {
            Write-Error "MetaEditor not found"
            exit 1
          }

          "path=$found" >> $env:GITHUB_OUTPUT

      - name: Compile Phase 6
        shell: powershell
        run: |
          $editor = "${{ steps.metaeditor.outputs.path }}"
          $source = Join-Path $env:GITHUB_WORKSPACE "KingsBot.mq5"
          $log = Join-Path $env:GITHUB_WORKSPACE "compile.log"

          if (-not (Test-Path $source)) {
            Write-Error "Source file not found: $source"
            exit 1
          }

          & $editor /compile:"$source" /log:"$log"

          if (Test-Path $log) {
            Get-Content $log
          } else {
            Write-Error "MetaEditor did not create compile.log"
            exit 1
          }

      - name: Verify Phase 6 build
        shell: powershell
        run: |
          Write-Host "=== EX5 FILES ==="
          Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter *.ex5 |
            Select-Object FullName, Length, LastWriteTime

          Write-Host "=== COMPILE LOG ==="
          $log = Join-Path $env:GITHUB_WORKSPACE "compile.log"

          if (Test-Path $log) {
            Get-Content $log
          } else {
            Write-Error "compile.log was not created"
            exit 1
          }

      - name: Upload build results
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-Phase6-Build
          path: |
            compile.log
            **/*.ex5
          if-no-files-found: warn
