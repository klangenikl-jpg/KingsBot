name: KingsBot MQL5 Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Get KingsBot source
        uses: actions/checkout@v4

      - name: Find MetaEditor
        shell: powershell
        run: |
          $paths = @(
            "$env:ProgramFiles\MetaTrader 5\metaeditor64.exe",
            "${env:ProgramFiles(x86)}\MetaTrader 5\metaeditor64.exe"
          )

          $found = $paths | Where-Object { Test-Path $_ }

          if (-not $found) {
            Write-Host "MetaEditor is not installed on this runner."
            exit 1
          }

          Write-Host "MetaEditor found at: $found"
