name: King's Bot - Phase 6 Final Validation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase6-validation:
    name: Phase 6 Final Build and MT5 Validation
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout King's Bot
        uses: actions/checkout@v5

      - name: Locate Phase 6 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Recurse `
            -File `
            -Filter 'KingsBot_Phase6_Integration.mq5' |
            Select-Object -First 1

          if (-not $source) {
            throw "KingsBot_Phase6_Integration.mq5 was not found."
          }

          "KB_SOURCE=$($source.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "KB_SOURCE_ROOT=$($source.Directory.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "SOURCE:"
          Write-Host $source.FullName

      - name: Install and verify MetaTrader 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'

          Write-Host "Downloading official MetaTrader 5 installer..."

          Invoke-WebRequest `
            -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' `
            -OutFile $installer

          if (-not (Test-Path $installer)) {
            throw "MetaTrader 5 installer was not downloaded."
          }

          Write-Host "Installer downloaded:"
          Write-Host $installer
          Write-Host "Installer size: $((Get-Item $installer).Length) bytes"

          Write-Host "Starting MetaTrader 5 unattended installation..."

          $install = Start-Process `
            -FilePath $installer `
            -ArgumentList '/auto' `
            -Wait `
            -PassThru

          $installerExitCode = $install.ExitCode

          Write-Host "MetaTrader 5 installer exit code: $installerExitCode"

          # The installer exit code is NOT treated as the final installation test.
          # We verify the actual platform executables below.

          $searchRoots = @(
            'C:\Program Files\MetaTrader 5',
            'C:\Program Files (x86)\MetaTrader 5',
            'C:\Program Files',
            'C:\Program Files (x86)',
            $env:LOCALAPPDATA
          )

          $terminal = $null
          $editor = $null

          Write-Host "Searching for terminal64.exe and metaeditor64.exe..."

          foreach ($root in $searchRoots) {
            if (-not (Test-Path $root)) {
              continue
            }

            if (-not $terminal) {
              $terminal = Get-ChildItem `
                -Path $root `
                -Recurse `
                -File `
                -Filter 'terminal64.exe' `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1
            }

            if (-not $editor) {
              $editor = Get-ChildItem `
                -Path $root `
                -Recurse `
                -File `
                -Filter 'metaeditor64.exe' `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1
            }

            if ($terminal -and $editor) {
              break
            }
          }

          if (-not $terminal -or -not $editor) {
            Write-Host ""
            Write-Host "MT5 executable verification FAILED."
            Write-Host "Installer exit code: $installerExitCode"

            if ($terminal) {
              Write-Host "terminal64.exe found at:"
              Write-Host $terminal.FullName
            }
            else {
              Write-Host "terminal64.exe NOT FOUND."
            }

            if ($editor) {
              Write-Host "metaeditor64.exe found at:"
              Write-Host $editor.FullName
            }
            else {
              Write-Host "metaeditor64.exe NOT FOUND."
            }

            throw "MetaTrader 5 installation could not be verified."
          }

          Write-Host ""
          Write-Host "MT5 INSTALLATION VERIFIED"
          Write-Host "Installer exit code: $installerExitCode"
          Write-Host "Terminal: $($terminal.FullName)"
          Write-Host "MetaEditor: $($editor.FullName)"

          $installedRoot = $terminal.Directory.FullName

          if (-not (Test-Path 'C:\MT5')) {
            New-Item -ItemType Directory -Path 'C:\MT5' -Force | Out-Null
          }

          Write-Host "Staging MT5 to C:\MT5..."

          Copy-Item `
            -Path (Join-Path $installedRoot '*') `
            -Destination 'C:\MT5' `
            -Recurse `
            -Force

          $stagedEditor = Get-ChildItem `
            -Path 'C:\MT5' `
            -Recurse `
            -File `
            -Filter 'metaeditor64.exe' |
            Select-Object -First 1

          $stagedTerminal = Get-ChildItem `
            -Path 'C:\MT5' `
            -Recurse `
            -File `
            -Filter 'terminal64.exe' |
            Select-Object -First 1

          if (-not $stagedEditor) {
            throw "Staged MetaEditor64.exe was not found."
          }

          if (-not $stagedTerminal) {
            throw "Staged terminal64.exe was not found."
          }

          Write-Host "STAGED MT5 VERIFIED"
          Write-Host "MetaEditor: $($stagedEditor.FullName)"
          Write-Host "Terminal: $($stagedTerminal.FullName)"

          "METAEDITOR=$($stagedEditor.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "MT5_TERMINAL=$($stagedTerminal.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Prepare clean KingsBot MT5 tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $target = 'C:\MT5\MQL5\Experts\KingsBot'

          if (Test-Path $target) {
            Remove-Item $target -Recurse -Force
          }

          New-Item -ItemType Directory -Path $target -Force | Out-Null

          Copy-Item `
            -Path (Join-Path $env:KB_SOURCE_ROOT '*') `
            -Destination $target `
            -Recurse `
            -Force

          $compileSource = Join-Path $target 'KingsBot_Phase6_Integration.mq5'

          if (-not (Test-Path $compileSource)) {
            throw "Prepared Phase 6 source was not found."
          }

          "KB_COMPILE_SOURCE=$compileSource" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Compile Phase 6
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $source = $env:KB_COMPILE_SOURCE
          $log = [IO.Path]::ChangeExtension($source, '.log')
          $ex5 = [IO.Path]::ChangeExtension($source, '.ex5')

          Remove-Item $log, $ex5 -Force -ErrorAction SilentlyContinue

          $process = Start-Process `
            -FilePath $env:METAEDITOR `
            -ArgumentList @("/compile:$source", "/log") `
            -WorkingDirectory (Split-Path $source -Parent) `
            -Wait `
            -PassThru

          Write-Host "MetaEditor exit code: $($process.ExitCode)"

          if (-not (Test-Path $log)) {
            throw "Compiler log was not produced."
          }

          Get-Content $log

          if (-not (Test-Path $ex5)) {
            throw "Compilation did not produce the Phase 6 EX5."
          }

          if ((Get-Item $ex5).Length -le 0) {
            throw "Phase 6 EX5 is empty."
          }

          $compilerErrors = Select-String `
            -Path $log `
            -Pattern '(?i)\berror\b' `
            -ErrorAction SilentlyContinue

          if ($compilerErrors) {
            $compilerErrors | ForEach-Object {
              Write-Host $_.Line
            }

            throw "Compiler log contains error text."
          }

          Write-Host "PHASE 6 COMPILATION: PASS"
          Write-Host "EX5 SIZE: $((Get-Item $ex5).Length) bytes"

          "KB_EX5=$ex5" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "KB_COMPILE_LOG=$log" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Prepare Strategy Tester
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $reports = 'C:\MT5\reports'

          if (Test-Path $reports) {
            Remove-Item $reports -Recurse -Force
          }

          New-Item -ItemType Directory -Path $reports -Force | Out-Null

          $config = 'C:\MT5\KingsBot_Phase6_Tester.ini'

          $configLines = @(
            '[Common]'
            'KeepPrivate=1'
            ''
            '[Experts]'
            'AllowLiveTrading=0'
            'AllowDllImport=0'
            'Enabled=1'
            ''
            '[Tester]'
            'Expert=KingsBot\KingsBot_Phase6_Integration.ex5'
            'Symbol=EURUSD'
            'Period=M15'
            'Model=4'
            'Optimization=0'
            'ExecutionMode=0'
            'FromDate=2025.01.01'
            'ToDate=2026.08.01'
            'Deposit=10000'
            'Currency=USD'
            'Leverage=1:100'
            'UseLocal=1'
            'UseRemote=
