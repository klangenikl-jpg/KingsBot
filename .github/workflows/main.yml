name: Build King's Bot

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build King's Bot
    runs-on: windows-latest

    steps:
      - name: Checkout King's Bot
        uses: actions/checkout@v4

      - name: Locate MetaEditor
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = "Stop"

          $metaEditor = Get-ChildItem `
            -Path "C:\Program Files","C:\Program Files (x86)" `
            -Filter "metaeditor64.exe" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $metaEditor) {
            $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"

            Invoke-WebRequest `
              -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" `
              -OutFile $installer

            Start-Process `
              -FilePath $installer `
              -ArgumentList "/auto" `
              -Wait

            Start-Sleep -Seconds 5

            $metaEditor = Get-ChildItem `
              -Path "C:\Program Files","C:\Program Files (x86)" `
              -Filter "metaeditor64.exe" `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }

          if (-not $metaEditor) {
            throw "MetaEditor64.exe could not be located."
          }

          Write-Host "MetaEditor:"
          Write-Host $metaEditor.FullName

          "METAEDITOR_PATH=$($metaEditor.FullName)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      - name: Prepare King's Bot source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $workspace = $env:GITHUB_WORKSPACE
          $buildRoot = Join-Path $env:RUNNER_TEMP "KingsBotBuild"
          $expertRoot = Join-Path $buildRoot "MQL5\Experts\KingsBot"

          New-Item `
            -ItemType Directory `
            -Path $expertRoot `
            -Force |
            Out-Null

          $source = Get-ChildItem `
            -Path $workspace `
            -Filter "KingsBot_Phase6_Integration.mq5" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $source) {
            throw "KingsBot_Phase6_Integration.mq5 was not found."
          }

          Copy-Item `
            -LiteralPath $source.FullName `
            -Destination (Join-Path `
              $expertRoot `
              "KingsBot_Phase6_Integration.mq5") `
            -Force

          $headers = Get-ChildItem `
            -Path $workspace `
            -Filter "*.mqh" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue

          foreach ($file in $headers) {
            $destination = Join-Path `
              $expertRoot `
              $file.Name

            Copy-Item `
              -LiteralPath $file.FullName `
              -Destination $destination `
              -Force
          }

          Write-Host ""
          Write-Host "Build source files:"
          Get-ChildItem `
            -Path $expertRoot `
            -File |
            ForEach-Object {
              Write-Host $_.Name
            }

          "KING_BUILD_ROOT=$buildRoot" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          "KING_EXPERT_ROOT=$expertRoot" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      - name: Normalize MQL5 headers
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "NORMALIZING MQL5 SOURCE"
          Write-Host "========================================="

          $root = $env:KING_EXPERT_ROOT

          $files = Get-ChildItem `
            -Path $root `
            -Filter "*.mqh" `
            -File `
            -Recurse `
            -ErrorAction Stop

          foreach ($file in $files) {
            $content = Get-Content `
              -LiteralPath $file.FullName `
              -Raw `
              -Encoding UTF8

            $original = $content

            # Fix invalid MQL5 header guard.
            $content = [regex]::Replace(
              $content,
              '(?m)^\s*#once\s*$',
              '#pragma once'
            )

            # Fix incorrect standard Trade include path.
            $content = $content.Replace(
              '#include <Include\Trade\Trade.mqh>',
              '#include <Trade\Trade.mqh>'
            )

            if ($content -ne $original) {
              Set-Content `
                -LiteralPath $file.FullName `
                -Value $content `
                -Encoding UTF8

              Write-Host "Normalized: $($file.Name)"
            }
          }

          Write-Host ""
          Write-Host "Normalized source preview:"
          Get-ChildItem `
            -Path $root `
            -Filter "*.mqh" `
            -File |
            ForEach-Object {
              Write-Host ""
              Write-Host "----- $($_.Name) -----"
              Get-Content `
                -LiteralPath $_.FullName |
                Select-Object -First 3
            }

      - name: Compile King's Bot
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "========================================="
          Write-Host "COMPILING KING'S BOT"
          Write-Host "========================================="

          $metaEditor = $env:METAEDITOR_PATH

          $source = Join-Path `
            $env:KING_EXPERT_ROOT `
            "KingsBot_Phase6_Integration.mq5"

          if (-not (Test-Path $source)) {
            throw "Integration source not found."
          }

          $log = Join-Path `
            $env:KING_EXPERT_ROOT `
            "KingsBot_Phase6_Integration.log"

          $arguments = @(
            "/compile:$source"
            "/log"
          )

          $process = Start-Process `
            -FilePath $metaEditor `
            -ArgumentList $arguments `
            -Wait `
            -PassThru `
            -WindowStyle Hidden

          Start-Sleep -Seconds 3

          Write-Host ""
          Write-Host "========================================="
          Write-Host "COMPILER LOG"
          Write-Host "========================================="

          if (Test-Path $log) {
            Get-Content -LiteralPath $log
          }
          else {
            Write-Host "No compiler log found."
          }

          Write-Host ""
          Write-Host "Searching for EX5..."

          $ex5 = Get-ChildItem `
            -Path $env:KING_BUILD_ROOT `
            -Filter "KingsBot_Phase6_Integration.ex5" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $ex5) {
            throw "KingsBot EX5 was not created."
          }

          Write-Host ""
          Write-Host "EX5 CREATED:"
          Write-Host $ex5.FullName
          Write-Host "SIZE: $($ex5.Length) bytes"

          "EX5_PATH=$($ex5.FullName)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      - name: Stage artifacts
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $artifactRoot = Join-Path `
            $env:GITHUB_WORKSPACE `
            "build-artifacts"

          New-Item `
            -ItemType Directory `
            -Path $artifactRoot `
            -Force |
            Out-Null

          if ($env:EX5_PATH -and (Test-Path $env:EX5_PATH)) {
            Copy-Item `
              -LiteralPath $env:EX5_PATH `
              -Destination (Join-Path `
                $artifactRoot `
                "KingsBot_Phase6_Integration.ex5") `
              -Force
          }

          $log = Join-Path `
            $env:KING_EXPERT_ROOT `
            "KingsBot_Phase6_Integration.log"

          if (Test-Path $log) {
            Copy-Item `
              -LiteralPath $log `
              -Destination (Join-Path `
                $artifactRoot `
                "KingsBot_Phase6_Integration.log") `
              -Force
          }

      - name: Upload King's Bot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-build
          path: build-artifacts
          if-no-files-found: warn
          retention-days: 14

      - name: Final verification
        shell: pwsh
        run: |
          if (-not $env:EX5_PATH) {
            throw "Final verification failed: EX5 was not created."
          }

          if (-not (Test-Path $env:EX5_PATH)) {
            throw "Final verification failed: EX5 path does not exist."
          }

          Write-Host ""
          Write-Host "========================================="
          Write-Host "KING'S BOT BUILD SUCCESSFUL"
          Write-Host "========================================="
          Write-Host "EX5: $env:EX5_PATH"
          Write-Host "Size: $((Get-Item $env:EX5_PATH).Length) bytes"
