name: Build King's Bot

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Compile King's Bot
    runs-on: windows-latest

    steps:
      - name: Checkout King's Bot
        uses: actions/checkout@v4

      - name: Download MetaTrader 5 installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'

          Write-Host "Downloading MetaTrader 5 installer..."

          Invoke-WebRequest `
            -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' `
            -OutFile $installer

          if (-not (Test-Path $installer)) {
            throw "MetaTrader 5 installer was not downloaded."
          }

          Write-Host "Installer downloaded successfully."
          Write-Host "Installer: $installer"

      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          $installPath = 'C:\MT5'

          New-Item `
            -ItemType Directory `
            -Path $installPath `
            -Force |
            Out-Null

          Write-Host "Installing MetaTrader 5 into $installPath..."

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList @(
              '/auto',
              "/path:$installPath"
            ) `
            -Wait `
            -PassThru

          Write-Host "Installer exit code: $($process.ExitCode)"

          $terminal = Join-Path `
            $installPath `
            'terminal64.exe'

          $metaEditor = Join-Path `
            $installPath `
            'MetaEditor64.exe'

          $deadline = (Get-Date).AddSeconds(90)

          while (
            ((-not (Test-Path $terminal)) -or (-not (Test-Path $metaEditor))) -and
            ((Get-Date) -lt $deadline)
          ) {
            Write-Host "Waiting for MetaTrader installation..."
            Start-Sleep -Seconds 5
          }

          if (-not (Test-Path $terminal)) {
            throw "MetaTrader terminal64.exe was not found at $terminal"
          }

          if (-not (Test-Path $metaEditor)) {
            throw "MetaEditor64.exe was not found at $metaEditor"
          }

          Write-Host "MetaTrader installation verified."
          Write-Host "Terminal: $terminal"
          Write-Host "MetaEditor: $metaEditor"

          "MT5_INSTALL=$installPath" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          "METAEDITOR=$metaEditor" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      - name: Initialize MetaTrader data directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $terminal = Join-Path `
            $env:MT5_INSTALL `
            'terminal64.exe'

          Write-Host "Starting MetaTrader in portable mode..."

          $process = Start-Process `
            -FilePath $terminal `
            -ArgumentList '/portable' `
            -PassThru

          Start-Sleep -Seconds 10

          if (-not $process.HasExited) {
            Write-Host "Stopping MetaTrader after initialization..."

            Stop-Process `
              -Id $process.Id `
              -Force `
              -ErrorAction SilentlyContinue
          }

          Write-Host "MetaTrader initialization completed."

      - name: Locate MQL5 root and required standard includes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "Searching for MQL5\Include\Trade\Trade.mqh..."

          $searchRoots = @(
            $env:MT5_INSTALL,
            "$env:APPDATA\MetaQuotes\Terminal",
            "$env:LOCALAPPDATA\MetaQuotes\Terminal"
          ) |
            Where-Object {
              Test-Path $_
            } |
            Select-Object -Unique

          $tradeInclude = $null
          $metaEditor = $null

          foreach ($root in $searchRoots) {
            Write-Host "Searching: $root"

            if (-not $tradeInclude) {
              $tradeInclude = Get-ChildItem `
                -Path $root `
                -Filter 'Trade.mqh' `
                -File `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Where-Object {
                  $_.FullName -match '\\MQL5\\Include\\Trade\\Trade\.mqh$'
                } |
                Select-Object -First 1
            }

            if (-not $metaEditor) {
              $metaEditor = Get-ChildItem `
                -Path $root `
                -Filter 'MetaEditor64.exe' `
                -File `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1
            }

            if ($tradeInclude -and $metaEditor) {
              break
            }
          }

          if (-not $tradeInclude) {
            Write-Host "Trade.mqh was not found."

            Get-ChildItem `
              -Path $env:MT5_INSTALL `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
              Select-Object -First 200 FullName

            throw "Required MQL5 standard include Trade.mqh was not found."
          }

          if (-not $metaEditor) {
            throw "MetaEditor64.exe could not be located."
          }

          $tradeDirectory = Split-Path `
            $tradeInclude.FullName `
            -Parent

          $includeDirectory = Split-Path `
            $tradeDirectory `
            -Parent

          $mql5Root = Split-Path `
            $includeDirectory `
            -Parent

          $expectedTrade = Join-Path `
            $mql5Root `
            'Include\Trade\Trade.mqh'

          if (-not (Test-Path $expectedTrade)) {
            throw "Calculated MQL5 root is invalid. Expected: $expectedTrade"
          }

          Write-Host "MetaEditor: $($metaEditor.FullName)"
          Write-Host "Trade.mqh: $($tradeInclude.FullName)"
          Write-Host "MQL5 root: $mql5Root"
          Write-Host "MQL5 Include: $includeDirectory"

          "METAEDITOR=$($metaEditor.FullName)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          "MQL5_ROOT=$mql5Root" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          "MQL5_INCLUDE=$includeDirectory" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      - name: Install King's Bot source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $sourceRoot = $env:GITHUB_WORKSPACE
          $destinationRoot = $env:MQL5_ROOT

          Write-Host "Repository: $sourceRoot"
          Write-Host "MQL5 root: $destinationRoot"

          $sourceFiles = Get-ChildItem `
            -Path $sourceRoot `
            -Recurse `
            -File `
            -Include *.mq5,*.mqh |
            Where-Object {
              $_.FullName -notmatch '\\\.git\\' -and
              $_.FullName -notmatch '\\phase6-artifact\\'
            }

          if (-not $sourceFiles) {
            throw "No .mq5 or .mqh source files were found."
          }

          foreach ($file in $sourceFiles) {
            $relativePath = [System.IO.Path]::GetRelativePath(
              $sourceRoot,
              $file.FullName
            )

            $destination = Join-Path `
              $destinationRoot `
              $relativePath

            $destinationDirectory = Split-Path `
              $destination `
              -Parent

            New-Item `
              -ItemType Directory `
              -Path $destinationDirectory `
              -Force |
              Out-Null

            Copy-Item `
              -Path $file.FullName `
              -Destination $destination `
              -Force

            Write-Host "Installed: $relativePath"
          }

          $mainSource = Join-Path `
            $destinationRoot `
            'KingsBot_Phase6_Integration.mq5'

          if (-not (Test-Path $mainSource)) {
            throw "KingsBot_Phase6_Integration.mq5 was not found at $mainSource"
          }

          Write-Host "Main source verified:"
          Write-Host $mainSource

          "KINGSBOT_SOURCE=$mainSource" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      - name: Verify King's Bot standard include
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $trade = Join-Path `
            $env:MQL5_ROOT `
            'Include\Trade\Trade.mqh'

          if (-not (Test-Path $trade)) {
            throw "Trade.mqh is missing: $trade"
          }

          Write-Host "Trade.mqh verified:"
          Write-Host $trade

      - name: Compile King's Bot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $source = $env:KINGSBOT_SOURCE
          $metaEditor = $env:METAEDITOR
          $mql5Root = $env:MQL5_ROOT

          if (-not (Test-Path $source)) {
            throw "Compile source does not exist: $source"
          }

          if (-not (Test-Path $metaEditor)) {
            throw "MetaEditor does not exist: $metaEditor"
          }

          if (-not (Test-Path $mql5Root)) {
            throw "MQL5 root does not exist: $mql5Root"
          }

          $tradeInclude = Join-Path `
            $mql5Root `
            'Include\Trade\Trade.mqh'

          if (-not (Test-Path $tradeInclude)) {
            throw "Trade.mqh was not found: $tradeInclude"
          }

          $log = [System.IO.Path]::ChangeExtension(
            $source,
            '.log'
          )

          $ex5 = [System.IO.Path]::ChangeExtension(
            $source,
            '.ex5'
          )

          if (Test-Path $log) {
            Remove-Item `
              -LiteralPath $log `
              -Force `
              -ErrorAction SilentlyContinue
          }

          if (Test-Path $ex5) {
            Remove-Item `
              -LiteralPath $ex5 `
              -Force `
              -ErrorAction SilentlyContinue
          }

          Write-Host "========================================"
          Write-Host "KING'S BOT COMPILATION"
          Write-Host "========================================"
          Write-Host "Source: $source"
          Write-Host "MetaEditor: $metaEditor"
          Write-Host "MQL5 root: $mql5Root"
          Write-Host "Trade.mqh: $tradeInclude"
          Write-Host "Compiler log: $log"
          Write-Host "========================================"

          $arguments = @(
            "/compile:`"$source`"",
            "/include:`"$mql5Root`"",
            "/log"
          )

          Write-Host "Starting MetaEditor compiler..."

          $process = Start-Process `
            -FilePath $metaEditor `
            -ArgumentList $arguments `
            -Wait `
            -PassThru

          Write-Host "MetaEditor exit code: $($process.ExitCode)"

          Start-Sleep -Seconds 2

          if (Test-Path $log) {
            Write-Host ""
            Write-Host "========== COMPILER LOG =========="
            Get-Content `
              -LiteralPath $log
            Write-Host "=================================="
          }
          else {
            throw "MetaEditor did not create the expected compiler log: $log"
          }

          if (-not (Test-Path $ex5)) {
            throw "Compilation failed: EX5 file was not created."
          }

          $ex5Info = Get-Item `
            -LiteralPath $ex5

          if ($ex5Info.Length -le 0) {
            throw "Compilation produced a zero-byte EX5."
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "KING'S BOT COMPILATION SUCCEEDED"
          Write-Host "========================================"
          Write-Host "EX5: $($ex5Info.FullName)"
          Write-Host "Size: $($ex5Info.Length) bytes"

      - name: Prepare King's Bot artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $source = $env:KINGSBOT_SOURCE

          $ex5 = [System.IO.Path]::ChangeExtension(
            $source,
            '.ex5'
          )

          if (-not (Test-Path $ex5)) {
            throw "EX5 file does not exist: $ex5"
          }

          $artifactDir = Join-Path `
            $env:GITHUB_WORKSPACE `
            'phase6-artifact'

          New-Item `
            -ItemType Directory `
            -Path $artifactDir `
            -Force |
            Out-Null

          Copy-Item `
            -Path $ex5 `
            -Destination $artifactDir `
            -Force

          $artifact = Join-Path `
            $artifactDir `
            'KingsBot_Phase6_Integration.ex5'

          if (-not (Test-Path $artifact)) {
            throw "Phase 6 EX5 artifact was not prepared."
          }

          Write-Host "Artifact ready:"
          Write-Host $artifact

      - name: Upload Phase 6 EX5
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-Phase6-EX5
          path: phase6-artifact/KingsBot_Phase6_Integration.ex5
          if-no-files-found: error
