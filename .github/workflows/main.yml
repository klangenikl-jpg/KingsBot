name: Build King's Bot

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Compile King's Bot
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout King's Bot
        uses: actions/checkout@v4

      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          $mt5Root = Join-Path $env:RUNNER_TEMP 'MT5'

          Write-Host 'Downloading MetaTrader 5 installer...'

          Invoke-WebRequest `
            -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' `
            -OutFile $installer

          if (-not (Test-Path $installer)) {
            throw 'MetaTrader 5 installer was not downloaded.'
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $mt5Root |
            Out-Null

          Write-Host 'Installing MetaTrader 5...'
          Write-Host "Install path: $mt5Root"

          $arguments = '/auto /path:"' + $mt5Root + '"'

          Write-Host "Installer arguments: $arguments"

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList $arguments `
            -Wait `
            -PassThru `
            -NoNewWindow

          Write-Host "Installer exit code: $($process.ExitCode)"

          if ($process.ExitCode -ne 0) {
            Write-Host 'Installer returned a non-zero exit code.'
            Write-Host 'Checking whether MetaEditor was nevertheless installed...'
          }

          $metaEditor = Get-ChildItem `
            -Path $mt5Root `
            -Filter 'MetaEditor64.exe' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $metaEditor) {
            $metaEditor = Get-ChildItem `
              -Path $env:RUNNER_TEMP `
              -Filter 'MetaEditor64.exe' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }

          if (-not $metaEditor) {
            throw "MetaEditor64.exe was not found. Installer exit code: $($process.ExitCode)"
          }

          Write-Host 'MetaEditor found:'
          Write-Host $metaEditor.FullName

          "METAEDITOR=$($metaEditor.FullName)" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8

      - name: Locate King's Bot source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter 'KingsBot_Phase6_Integration.mq5' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $source) {
            throw 'KingsBot_Phase6_Integration.mq5 was not found.'
          }

          Write-Host 'King''s Bot source found:'
          Write-Host $source.FullName

          "SOURCE=$($source.FullName)" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8

      - name: Show MQL5 include files
        shell: pwsh
        run: |
          Write-Host 'MQL5 include files:'

          $includes = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter '*.mqh' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue

          if ($includes) {
            $includes | ForEach-Object {
              Write-Host $_.FullName
            }
          }
          else {
            Write-Host 'No MQL5 include files found.'
          }

      - name: Compile King's Bot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host '========================================'
          Write-Host 'COMPILING KING''S BOT'
          Write-Host '========================================'

          Write-Host "MetaEditor: $env:METAEDITOR"
          Write-Host "Source: $env:SOURCE"

          $arguments = '/compile:"' + $env:SOURCE + '" /log'

          Write-Host "Compile arguments: $arguments"

          $process = Start-Process `
            -FilePath $env:METAEDITOR `
            -ArgumentList $arguments `
            -Wait `
            -PassThru `
            -NoNewWindow

          Write-Host "MetaEditor exit code: $($process.ExitCode)"

          $ex5 = [System.IO.Path]::ChangeExtension(
            $env:SOURCE,
            '.ex5'
          )

          if ($process.ExitCode -ne 0) {
            throw "MetaEditor failed while compiling $($env:SOURCE)."
          }

          if (-not (Test-Path $ex5)) {
            throw "Compilation completed but EX5 file was not created: $ex5"
          }

          Write-Host 'Compilation successful.'
          Write-Host "EX5: $ex5"

      - name: Prepare King's Bot package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $package = Join-Path $env:RUNNER_TEMP 'KingsBot_Package'

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $package |
            Out-Null

          $files = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter '*.ex5' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue

          if (-not $files) {
            throw 'No EX5 files were found.'
          }

          foreach ($file in $files) {
            Copy-Item `
              -Path $file.FullName `
              -Destination $package `
              -Force
          }

          Get-ChildItem $package

      - name: Upload King's Bot package
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-Phase6
          path: ${{ runner.temp }}/KingsBot_Package
          if-no-files-found: error
