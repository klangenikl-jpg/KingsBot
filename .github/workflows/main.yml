name: Build King's Bot

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build King's Bot
    runs-on: windows-latest

    steps:
      - name: Checkout King's Bot
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install and locate MetaTrader 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========================================"
          Write-Host "       PREPARING METATRADER 5"
          Write-Host "========================================"

          $metaEditor = $null

          function Find-MetaEditor {
            $known = @(
              "C:\Program Files\MetaTrader 5\metaeditor64.exe",
              "C:\Program Files (x86)\MetaTrader 5\metaeditor64.exe"
            )

            foreach ($path in $known) {
              if (Test-Path $path) {
                return (Get-Item $path).FullName
              }
            }

            foreach ($root in @(
              "C:\Program Files",
              "C:\Program Files (x86)"
            )) {
              if (-not (Test-Path $root)) {
                continue
              }

              $found = Get-ChildItem `
                -Path $root `
                -Recurse `
                -File `
                -Filter "metaeditor64.exe" `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

              if ($found) {
                return $found.FullName
              }
            }

            return $null
          }

          $metaEditor = Find-MetaEditor

          if (-not $metaEditor) {
            $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"

            Write-Host "MetaEditor not found."
            Write-Host "Downloading the current official MetaTrader 5 installer..."

            Invoke-WebRequest `
              -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" `
              -OutFile $installer

            if (-not (Test-Path $installer)) {
              throw "The official MetaTrader 5 installer was not downloaded."
            }

            Write-Host "Installing MT5 in the STANDARD installation location."
            Write-Host "No custom /path is being used."

            $installProcess = Start-Process `
              -FilePath $installer `
              -ArgumentList "/auto" `
              -Wait `
              -PassThru

            Write-Host "Installer exit code: $($installProcess.ExitCode)"

            Start-Sleep -Seconds 15

            $metaEditor = Find-MetaEditor
          }

          if (-not $metaEditor) {
            Write-Host ""
            Write-Host "Could not locate MetaEditor after installation."
            Write-Host "Recent Program Files MetaTrader directories:"

            Get-ChildItem `
              "C:\Program Files" `
              -Directory `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Name -match "MetaTrader|MetaQuotes"
              } |
              Select-Object -ExpandProperty FullName

            throw "MetaEditor64.exe is unavailable on the GitHub runner."
          }

          $platformRoot = Split-Path $metaEditor -Parent

          $mql5Candidates = @(
            Join-Path $platformRoot "MQL5"
          )

          $mql5Root = $null

          foreach ($candidate in $mql5Candidates) {
            if (Test-Path (Join-Path $candidate "Include")) {
              $mql5Root = (Get-Item $candidate).FullName
              break
            }
          }

          if (-not $mql5Root) {
            foreach ($root in @(
              "C:\Users\runneradmin\AppData\Roaming\MetaQuotes\Terminal",
              "C:\Users\runneradmin\AppData\Roaming\MetaQuotes",
              "C:\Program Files\MetaTrader 5",
              "C:\Program Files (x86)\MetaTrader 5"
            )) {
              if (-not (Test-Path $root)) {
                continue
              }

              $found = Get-ChildItem `
                -Path $root `
                -Recurse `
                -Directory `
                -Filter "MQL5" `
                -ErrorAction SilentlyContinue |
                Where-Object {
                  Test-Path (Join-Path $_.FullName "Include")
                } |
                Select-Object -First 1

              if ($found) {
                $mql5Root = $found.FullName
                break
              }
            }
          }

          if (-not $mql5Root) {
            throw "MetaEditor was found, but an MT5 MQL5 data directory could not be located."
          }

          Write-Host ""
          Write-Host "MetaEditor:"
          Write-Host "  $metaEditor"
          Write-Host "MQL5 root:"
          Write-Host "  $mql5Root"

          "KINGSBOT_METAEDITOR=$metaEditor" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8

          "KINGSBOT_MQL5=$mql5Root" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8

      - name: Prepare King's Bot source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========================================"
          Write-Host "       PREPARING KING'S BOT SOURCE"
          Write-Host "========================================"

          $repoRoot = $env:GITHUB_WORKSPACE

          $mainCandidates = @(
            Get-ChildItem `
              -Path $repoRoot `
              -Recurse `
              -File `
              -Filter "KingsBot_Phase6_Integration.mq5" `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.FullName -notmatch '\\.git\\' -and
                $_.FullName -notmatch '\\artifact\\'
              }
          )

          if ($mainCandidates.Count -eq 0) {
            throw "KingsBot_Phase6_Integration.mq5 was not found in the repository."
          }

          $sourceMain = $mainCandidates[0].FullName
          $sourceDir = $mainCandidates[0].Directory.FullName

          $expertRoot = Join-Path `
            $env:KINGSBOT_MQL5 `
            "Experts\KingsBot"

          if (Test-Path $expertRoot) {
            Remove-Item `
              -Path $expertRoot `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $expertRoot `
            -Force |
            Out-Null

          Copy-Item `
            -Path (Join-Path $sourceDir "*") `
            -Destination $expertRoot `
            -Recurse `
            -Force

          $compileSource = Join-Path `
            $expertRoot `
            "KingsBot_Phase6_Integration.mq5"

          if (-not (Test-Path $compileSource)) {
            throw "King's Bot source was not copied to the MT5 MQL5 Experts directory."
          }

          Write-Host "Repository source:"
          Write-Host "  $sourceMain"

          Write-Host "Compile source:"
          Write-Host "  $compileSource"

          "KINGSBOT_SOURCE=$compileSource" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8

      - name: Compile King's Bot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========================================"
          Write-Host "          COMPILING KING'S BOT"
          Write-Host "========================================"

          $metaEditor = $env:KINGSBOT_METAEDITOR
          $source = $env:KINGSBOT_SOURCE
          $mql5 = $env:KINGSBOT_MQL5

          $expectedEx5 = [System.IO.Path]::ChangeExtension(
            $source,
            ".ex5"
          )

          $compileLog = [System.IO.Path]::ChangeExtension(
            $source,
            ".log"
          )

          if (Test-Path $expectedEx5) {
            Remove-Item `
              -Path $expectedEx5 `
              -Force
          }

          if (Test-Path $compileLog) {
            Remove-Item `
              -Path $compileLog `
              -Force
          }

          Write-Host "MetaEditor:"
          Write-Host "  $metaEditor"

          Write-Host "Source:"
          Write-Host "  $source"

          Write-Host "Include MQL5 root:"
          Write-Host "  $mql5"

          Write-Host ""

          & $
