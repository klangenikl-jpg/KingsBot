name: Build King's Bot

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build King's Bot
    runs-on: windows-latest

    steps:
      - name: Checkout King's Bot
        uses: actions/checkout@v4

      - name: Locate MetaEditor and MT5 MQL5 library
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "LOCATING METATRADER 5"
          Write-Host "========================================="

          $metaEditor = Get-ChildItem `
            -Path "C:\Program Files","C:\Program Files (x86)" `
            -Filter "metaeditor64.exe" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $metaEditor) {
            Write-Host "MetaEditor not found. Installing MT5..."

            $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"

            Invoke-WebRequest `
              -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" `
              -OutFile $installer

            Start-Process `
              -FilePath $installer `
              -ArgumentList "/auto" `
              -Wait

            Start-Sleep -Seconds 5

            $metaEditor = Get-ChildItem `
              -Path "C:\Program Files","C:\Program Files (x86)" `
              -Filter "metaeditor64.exe" `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }

          if (-not $metaEditor) {
            throw "MetaEditor64.exe could not be located."
          }

          Write-Host ""
          Write-Host "MetaEditor found:"
          Write-Host $metaEditor.FullName

          $metaEditorDir = Split-Path -Parent $metaEditor.FullName

          Write-Host ""
          Write-Host "Searching for standard MQL5 Trade.mqh..."

          $tradeHeader = Get-ChildItem `
            -Path "C:\Users","C:\Program Files","C:\Program Files (x86)" `
            -Filter "Trade.mqh" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FullName -match "\\MQL5\\Include\\Trade\\Trade\.mqh$"
            } |
            Select-Object -First 1

          if (-not $tradeHeader) {
            Write-Host "Trade.mqh was not found."
            Write-Host "Creating a local MQL5 standard-library location."

            $libraryRoot = Join-Path `
              $env:RUNNER_TEMP `
              "MQL5StandardLibrary"

            $tradeRoot = Join-Path `
              $libraryRoot `
              "Trade"

            New-Item `
              -ItemType Directory `
              -Path $tradeRoot `
              -Force |
              Out-Null

            $tradeFiles = @(
              "Trade.mqh",
              "SymbolInfo.mqh",
              "OrderInfo.mqh",
              "HistoryOrderInfo.mqh",
              "PositionInfo.mqh",
              "DealInfo.mqh"
            )

            foreach ($fileName in $tradeFiles) {
              $url = "https://raw.githubusercontent.com/gsemet/mt5-include/master/Trade/$fileName"
              $destination = Join-Path $tradeRoot $fileName

              Invoke-WebRequest `
                -Uri $url `
                -OutFile $destination
            }

            $objectUrl = "https://raw.githubusercontent.com/gsemet/mt5-include/master/Object.mqh"
            $objectDestination = Join-Path `
              $libraryRoot `
              "Object.mqh"

            try {
              Invoke-WebRequest `
                -Uri $objectUrl `
                -OutFile $objectDestination
            }
            catch {
              Write-Host "Object.mqh was not available from the fallback repository."
            }

            $tradeHeader = Get-Item `
              (Join-Path $tradeRoot "Trade.mqh")

            $mql5Root = $libraryRoot
          }
          else {
            $mql5Root = Split-Path `
              -Parent `
              (Split-Path `
                -Parent `
                (Split-Path `
                  -Parent `
                  $tradeHeader.FullName))
          }

          if (-not $tradeHeader) {
            throw "Standard MQL5 Trade.mqh could not be prepared."
          }

          Write-Host ""
          Write-Host "Trade.mqh found/prepared:"
          Write-Host $tradeHeader.FullName

          Write-Host ""
          Write-Host "MQL5 include root:"
          Write-Host $mql5Root

          "METAEDITOR_PATH=$($metaEditor.FullName)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          "METAEDITOR_DIR=$metaEditorDir" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          "MT5_MQL5_ROOT=$mql5Root" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          "MT5_TRADE_MQH=$($tradeHeader.FullName)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          Write-Host ""
          Write-Host "========================================="
          Write-Host "MT5 ENVIRONMENT READY"
          Write-Host "========================================="

      - name: Prepare King's Bot source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $workspace = $env:GITHUB_WORKSPACE
          $buildRoot = Join-Path $env:RUNNER_TEMP "KingsBotBuild"
          $expertRoot = Join-Path $buildRoot "MQL5\Experts\KingsBot"

          New-Item `
            -ItemType Directory `
            -Path $expertRoot `
            -Force |
            Out-Null

          $source = Get-ChildItem `
            -Path $workspace `
            -Filter "KingsBot_Phase6_Integration.mq5" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $source) {
            throw "KingsBot_Phase6_Integration.mq5 was not found."
          }

          Copy-Item `
            -LiteralPath $source.FullName `
            -Destination (Join-Path `
              $expertRoot `
              "KingsBot_Phase6_Integration.mq5") `
            -Force

          $headers = Get-ChildItem `
            -Path $workspace `
            -Filter "*.mqh" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue

          foreach ($file in $headers) {
            Copy-Item `
              -LiteralPath $file.FullName `
              -Destination (Join-Path $expertRoot $file.Name) `
              -Force
          }

          $localInclude = Join-Path $expertRoot "Include"

          New-Item `
            -ItemType Directory `
            -Path $localInclude `
            -Force |
            Out-Null

          if (Test-Path $env:MT5_MQL5_ROOT) {
            Copy-Item `
              -LiteralPath (Join-Path $env:MT5_MQL5_ROOT "*") `
              -Destination $localInclude `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue
          }

          Write-Host ""
          Write-Host "Build source files:"
          Get-ChildItem `
            -Path $expertRoot `
            -File `
            -Recurse |
            ForEach-Object {
              Write-Host $_.FullName
            }

          "KING_BUILD_ROOT=$buildRoot" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          "KING_EXPERT_ROOT=$expertRoot" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      - name: Normalize MQL5 headers
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = $env:KING_EXPERT_ROOT

          $files = Get-ChildItem `
            -Path $root `
            -Filter "*.mqh" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue

          foreach ($file in $files) {
            $content = Get-Content `
              -LiteralPath $file.FullName `
              -Raw `
              -Encoding UTF8

            $original = $content

            $content = [regex]::Replace(
              $content,
              '(?m)^\s*#once\s*$',
              '#pragma once'
            )

            $content = $content.Replace(
              '#include <Include\Trade\Trade.mqh>',
              '#include <Trade\Trade.mqh>'
            )

            if ($content -ne $original) {
              Set-Content `
                -LiteralPath $file.FullName `
                -Value $content `
                -Encoding UTF8

              Write-Host "Normalized: $($file.Name)"
            }
          }

      - name: Compile King's Bot
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "========================================="
          Write-Host "COMPILING KING'S BOT"
          Write-Host "========================================="

          $metaEditor = $env:METAEDITOR_PATH

          $source = Join-Path `
            $env:KING_EXPERT_ROOT `
            "KingsBot_Phase6_Integration.mq5"

          if (-not (Test-Path $source)) {
            throw "Integration source not found."
          }

          $log = Join-Path `
            $env:KING_EXPERT_ROOT `
            "KingsBot_Phase6_Integration.log"

          $process = Start-Process `
            -FilePath $metaEditor `
            -ArgumentList @(
              "/compile:$source",
              "/log"
            ) `
            -Wait `
            -PassThru `
            -WindowStyle Hidden

          Start-Sleep -Seconds 3

          Write-Host ""
          Write-Host "========================================="
          Write-Host "COMPILER LOG"
          Write-Host "========================================="

          if (Test-Path $log) {
            Get-Content -LiteralPath $log
          }
          else {
            Write-Host "No compiler log found."
          }

          Write-Host ""
          Write-Host "Searching for EX5..."

          $ex5 = Get-ChildItem `
            -Path $env:KING_BUILD_ROOT `
            -Filter "KingsBot_Phase6_Integration.ex5" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $ex5) {
            throw "KingsBot EX5 was not created."
          }

          Write-Host ""
          Write-Host "EX5 CREATED:"
          Write-Host $ex5.FullName
          Write-Host "SIZE: $($ex5.Length) bytes"

          "EX5_PATH=$($ex5.FullName)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      - name: Stage artifacts
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $artifactRoot = Join-Path `
            $env:GITHUB_WORKSPACE `
            "build-artifacts"

          New-Item `
            -ItemType Directory `
            -Path $artifactRoot `
            -Force |
            Out-Null

          if ($env:EX5_PATH -and (Test-Path $env:EX5_PATH)) {
            Copy-Item `
              -LiteralPath $env:EX5_PATH `
              -Destination (Join-Path `
                $artifactRoot `
                "KingsBot_Phase6_Integration.ex5") `
              -Force
          }

          if ($env:KING_EXPERT_ROOT) {
            $log = Join-Path `
              $env:KING_EXPERT_ROOT `
              "KingsBot_Phase6_Integration.log"

            if (Test-Path $log) {
              Copy-Item `
                -LiteralPath $log `
                -Destination (Join-Path `
                  $artifactRoot `
                  "KingsBot_Phase6_Integration.log") `
                -Force
            }
          }

      - name: Upload King's Bot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-build
          path: build-artifacts
          if-no-files-found: warn
          retention-days: 14

      - name: Final verification
        shell: pwsh
        run: |
          if (-not $env:EX5_PATH) {
            throw "Final verification failed: EX5 was not created."
          }

          if (-not (Test-Path $env:EX5_PATH)) {
            throw "Final verification failed: EX5 path does not exist."
          }

          Write-Host ""
          Write-Host "========================================="
          Write-Host "KING'S BOT BUILD SUCCESSFUL"
          Write-Host "========================================="
          Write-Host "EX5: $env:EX5_PATH"
          Write-Host "Size: $((Get-Item $env:EX5_PATH).Length) bytes"
