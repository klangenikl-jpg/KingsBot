name: King's Bot - Phase 6 Build

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.mq5'
      - '**/*.mqh'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build:
    name: Build King's Bot
    runs-on: windows-2022
    timeout-minutes: 30

    steps:

      - name: Get King's Bot source
        uses: actions/checkout@v4

      - name: Inspect repository
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========================================"
          Write-Host "KING'S BOT - REPOSITORY INSPECTION"
          Write-Host "========================================"

          Write-Host ""
          Write-Host "Repository:"
          Get-Location

          Write-Host ""
          Write-Host "MQL5 source files:"
          $sources = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Recurse `
            -File `
            -Include *.mq5,*.mqh `
            -ErrorAction SilentlyContinue

          if ($sources.Count -eq 0) {
            throw "No .mq5 or .mqh files were found in the repository."
          }

          $sources | ForEach-Object {
            Write-Host $_.FullName
          }

          Write-Host ""
          Write-Host "Found $($sources.Count) MQL5 source files."

      - name: Prepare MT5 directory
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $mt5Root = Join-Path $env:RUNNER_TEMP "KingsBot-MT5"

          if (Test-Path $mt5Root) {
            Remove-Item $mt5Root -Recurse -Force
          }

          New-Item -ItemType Directory -Path $mt5Root -Force | Out-Null

          "MT5_ROOT=$mt5Root" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append `
            -Encoding utf8

          Write-Host "MT5_ROOT=$mt5Root"

      - name: Download MetaTrader 5 installer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"

          $uri = "https://download.terminal.free/cdn/web/metaquotes.ltd/mt5/mt5setup.exe"

          Write-Host "Downloading official MetaTrader 5 installer..."
          Write-Host $uri

          Invoke-WebRequest `
            -Uri $uri `
            -OutFile $installer `
            -UseBasicParsing

          if (!(Test-Path $installer)) {
            throw "MetaTrader 5 installer was not downloaded."
          }

          $size = (Get-Item $installer).Length

          if ($size -lt 100000) {
            throw "Downloaded installer is unexpectedly small: $size bytes."
          }

          Write-Host "Installer downloaded successfully."
          Write-Host "Installer size: $size bytes."

          "MT5_INSTALLER=$installer" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append `
            -Encoding utf8

      - name: Install MetaTrader 5
        shell: powershell
        continue-on-error: true
        run: |
          $installer = $env:MT5_INSTALLER
          $mt5Root = $env:MT5_ROOT

          Write-Host "========================================"
          Write-Host "INSTALLING METATRADER 5"
          Write-Host "========================================"

          Write-Host "Installer: $installer"
          Write-Host "Target:    $mt5Root"

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList @(
              "/auto",
              "/path:`"$mt5Root`""
            ) `
            -Wait `
            -PassThru

          Write-Host ""
          Write-Host "Installer exit code: $($process.ExitCode)"

          if ($process.ExitCode -ne 0) {
            Write-Warning "Installer returned exit code $($process.ExitCode)."
            Write-Warning "We will verify the actual installation before failing."
          }

      - name: Locate MetaEditor
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========================================"
          Write-Host "LOCATING METAEDITOR"
          Write-Host "========================================"

          $roots = @(
            $env:MT5_ROOT,
            "C:\Program Files\MetaTrader 5",
            "C:\Program Files (x86)\MetaTrader 5",
            "$env:LOCALAPPDATA\Programs\MetaTrader 5",
            "$env:APPDATA\MetaQuotes\Terminal"
          )

          $editors = @()

          foreach ($root in $roots) {
            if (Test-Path $root) {
              Write-Host "Searching: $root"

              $found = Get-ChildItem `
                -Path $root `
                -Recurse `
                -File `
                -ErrorAction SilentlyContinue `
                | Where-Object {
                    $_.Name -in @(
                      "metaeditor64.exe",
                      "metaeditor.exe"
                    )
                  }

              if ($found) {
                $editors += $found
              }
            }
          }

          $editors = $editors | Sort-Object FullName -Unique

          if ($editors.Count -eq 0) {
            Write-Host ""
            Write-Host "No MetaEditor installation was found."

            Write-Host ""
            Write-Host "MT5 target directory contents:"
            if (Test-Path $env:MT5_ROOT) {
              Get-ChildItem $env:MT5_ROOT -Recurse -ErrorAction SilentlyContinue |
                Select-Object FullName |
                Format-Table -AutoSize
            }

            throw "MetaEditor was not found. MT5 installation did not produce a usable compiler."
          }

          $editor = $editors[0].FullName

          Write-Host ""
          Write-Host "MetaEditor found:"
          Write-Host $editor

          "METAEDITOR=$editor" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append `
            -Encoding utf8

      - name: Prepare King's Bot source tree
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========================================"
          Write-Host "PREPARING KING'S BOT SOURCE"
          Write-Host "========================================"

          $buildRoot = Join-Path $env:RUNNER_TEMP "KingsBot-MQL5"

          if (Test-Path $buildRoot) {
            Remove-Item $buildRoot -Recurse -Force
          }

          New-Item -ItemType Directory -Path $buildRoot -Force | Out-Null

          $sources = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Recurse `
            -File `
            -Include *.mq5,*.mqh `
            -ErrorAction SilentlyContinue

          foreach ($file in $sources) {

            $relative = $file.FullName.Substring(
              $env:GITHUB_WORKSPACE.Length
            ).TrimStart('\')

            $destination = Join-Path $buildRoot $relative
            $destinationDir = Split-Path $destination -Parent

            New-Item `
              -ItemType Directory `
              -Path $destinationDir `
              -Force | Out-Null

            Copy-Item `
              -Path $file.FullName `
              -Destination $destination `
              -Force
          }

          Write-Host ""
          Write-Host "Prepared source tree:"
          Get-ChildItem `
            -Path $buildRoot `
            -Recurse `
            -File `
            -Include *.mq5,*.mqh |
            Select-Object FullName |
            Format-Table -AutoSize

          "BUILD_ROOT=$buildRoot" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append `
            -Encoding utf8

      - name: Compile King's Bot
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========================================"
          Write-Host "COMPILING KING'S BOT"
          Write-Host "========================================"

          $editor = $env:METAEDITOR
          $buildRoot = $env:BUILD_ROOT

          Write-Host "MetaEditor:"
          Write-Host $editor

          Write-Host ""
          Write-Host "Source root:"
          Write-Host $buildRoot

          $mq5Files = Get-ChildItem `
            -Path $buildRoot `
            -Recurse `
            -File `
            -Filter *.mq5

          if ($mq5Files.Count -eq 0) {
            throw "No .mq5 files were found to compile."
          }

          $compiled = 0
          $failed = 0

          foreach ($source in $mq5Files) {

            Write-Host ""
            Write-Host "----------------------------------------"
            Write-Host "Compiling: $($source.FullName)"
            Write-Host "----------------------------------------"

            & $editor `
              "/compile:$($source.FullName)" `
              "/log"

            $exitCode = $LASTEXITCODE

            Write-Host "MetaEditor exit code: $exitCode"

            $logFile = [System.IO.Path]::ChangeExtension(
              $source.FullName,
              ".log"
            )

            if (Test-Path $logFile) {
              Write-Host ""
              Write-Host "Compiler log:"
              Get-Content $logFile
            }

            $ex5 = [System.IO.Path]::ChangeExtension(
              $source.FullName,
              ".ex5"
            )

            if (Test-Path $ex5) {
              Write-Host ""
              Write-Host "SUCCESS: $ex5"
              $compiled++
            }
            else {
              Write-Warning "No EX5 produced for $($source.Name)"
              $failed++
            }
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "COMPILATION SUMMARY"
          Write-Host "========================================"
          Write-Host "Successful: $compiled"
          Write-Host "Failed:     $failed"

          if ($compiled -eq 0) {
            throw "No EX5 file was produced."
          }

      - name: Prepare build artifacts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========================================"
          Write-Host "PREPARING ARTIFACTS"
          Write-Host "========================================"

          $artifactRoot = Join-Path $env:RUNNER_TEMP "KingsBot-artifacts"

          if (Test-Path $artifactRoot) {
            Remove-Item $artifactRoot -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $artifactRoot `
            -Force | Out-Null

          $ex5Files = Get-ChildItem `
            -Path $env:BUILD_ROOT `
            -Recurse `
            -File `
            -Filter *.ex5

          if ($ex5Files.Count -eq 0) {
            throw "No EX5 files exist after compilation."
          }

          foreach ($file in $ex5Files) {
            Copy-Item `
              -Path $file.FullName `
              -Destination $artifactRoot `
              -Force
          }

          Write-Host ""
          Write-Host "EX5 artifacts:"
          Get-ChildItem $artifactRoot -File |
            Select-Object Name,Length |
            Format-Table -AutoSize

          Write-Host ""
          Write-Host "Artifact preparation complete."

      - name: Upload King's Bot artifact
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-Phase6-EX5
          path: ${{ runner.temp }}/KingsBot-artifacts/*
          if-no-files-found: error
          retention-days: 14
