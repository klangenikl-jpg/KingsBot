name: Build King's Bot

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build King's Bot
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout King's Bot
        uses: actions/checkout@v4

      - name: Locate or install MetaTrader 5
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "LOCATING / INSTALLING METATRADER 5"
          Write-Host "========================================="

          $preferredRoots = @(
            "C:\Program Files\MetaTrader 5",
            "C:\Program Files (x86)\MetaTrader 5",
            "$env:RUNNER_TEMP\MT5"
          )

          $metaEditor = $null

          foreach ($root in $preferredRoots) {
            $candidate = Join-Path $root "MetaEditor64.exe"

            if (Test-Path $candidate) {
              $metaEditor = (Resolve-Path $candidate).Path
              break
            }
          }

          if (-not $metaEditor) {
            Write-Host "MetaEditor not found. Installing official MetaTrader 5..."

            $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"
            $installDir = Join-Path $env:RUNNER_TEMP "MT5"

            if (Test-Path $installDir) {
              Remove-Item $installDir -Recurse -Force
            }

            Invoke-WebRequest `
              -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" `
              -OutFile $installer

            Write-Host "Starting unattended MT5 installation..."

            $process = Start-Process `
              -FilePath $installer `
              -ArgumentList "/auto", "/path:`"$installDir`"" `
              -Wait `
              -PassThru

            Write-Host "Installer exit code: $($process.ExitCode)"

            $candidate = Join-Path $installDir "MetaEditor64.exe"

            if (Test-Path $candidate) {
              $metaEditor = (Resolve-Path $candidate).Path
            }
          }

          if (-not $metaEditor) {
            Write-Host "Searching common Windows locations..."

            $searchRoots = @(
              "C:\Program Files",
              "C:\Program Files (x86)",
              "$env:LOCALAPPDATA",
              "$env:APPDATA",
              "$env:RUNNER_TOOL_CACHE"
            ) | Where-Object {
              $_ -and (Test-Path $_)
            }

            foreach ($root in $searchRoots) {
              $found = Get-ChildItem `
                -Path $root `
                -Filter "MetaEditor64.exe" `
                -File `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

              if ($found) {
                $metaEditor = $found.FullName
                break
              }
            }
          }

          if (-not $metaEditor) {
            throw "MetaEditor64.exe could not be located or installed."
          }

          $metaEditorDir = Split-Path $metaEditor -Parent
          $mt5Root = Split-Path $metaEditorDir -Parent

          $tradeCandidates = @(
            (Join-Path $mt5Root "MQL5\Include\Trade\Trade.mqh"),
            (Join-Path $metaEditorDir "MQL5\Include\Trade\Trade.mqh")
          )

          $tradeMqh = $tradeCandidates |
            Where-Object {
              Test-Path $_
            } |
            Select-Object -First 1

          if (-not $tradeMqh) {
            Write-Host "MetaEditor exists but Trade.mqh is missing."
            Write-Host "Installing a clean MT5 copy..."

            $installer = Join-Path $env:RUNNER_TEMP "mt5setup-clean.exe"
            $cleanDir = Join-Path $env:RUNNER_TEMP "MT5-Clean"

            if (Test-Path $cleanDir) {
              Remove-Item $cleanDir -Recurse -Force
            }

            Invoke-WebRequest `
              -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" `
              -OutFile $installer

            $process = Start-Process `
              -FilePath $installer `
              -ArgumentList "/auto", "/path:`"$cleanDir`"" `
              -Wait `
              -PassThru

            Write-Host "Clean installer exit code: $($process.ExitCode)"

            $cleanEditor = Join-Path $cleanDir "MetaEditor64.exe"
            $cleanTrade = Join-Path $cleanDir "MQL5\Include\Trade\Trade.mqh"

            if ((Test-Path $cleanEditor) -and (Test-Path $cleanTrade)) {
              $metaEditor = (Resolve-Path $cleanEditor).Path
              $tradeMqh = (Resolve-Path $cleanTrade).Path
              $mt5Root = $cleanDir
            }
          }

          if (-not (Test-Path $metaEditor)) {
            throw "MetaEditor64.exe was not found after installation."
          }

          if (-not $tradeMqh -or -not (Test-Path $tradeMqh)) {
            throw "Standard MQL5 Trade.mqh was not found."
          }

          Write-Host ""
          Write-Host "MetaEditor found:"
          Write-Host $metaEditor

          Write-Host ""
          Write-Host "Standard MQL5 library found:"
          Write-Host $tradeMqh

          "METAEDITOR=$metaEditor" |
            Out-File -FilePath $env:GITHUB_ENV -Append

          "MT5_ROOT=$mt5Root" |
            Out-File -FilePath $env:GITHUB_ENV -Append

          "TRADE_MQH=$tradeMqh" |
            Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Prepare King's Bot source
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $buildRoot = Join-Path $env:RUNNER_TEMP "KingsBotBuild"
          $sourceRoot = Join-Path $buildRoot "MQL5\Experts\KingsBot"

          if (Test-Path $buildRoot) {
            Remove-Item $buildRoot -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $sourceRoot `
            -Force |
            Out-Null

          $sourcePath = "MQL5\Experts\KingsBot"

          if (-not (Test-Path $sourcePath)) {
            throw "KingsBot source directory was not found at $sourcePath"
          }

          Copy-Item `
            "$sourcePath\*" `
            $sourceRoot `
            -Recurse `
            -Force

          Write-Host "King's Bot source prepared:"
          Write-Host $sourceRoot

          "KINGSBOT_BUILD=$buildRoot" |
            Out-File -FilePath $env:GITHUB_ENV -Append

          "KINGSBOT_SOURCE=$sourceRoot" |
            Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Normalize MQL5 headers
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Normalizing MQL5 headers..."

          $files = Get-ChildItem `
            -Path $env:KINGSBOT_SOURCE `
            -Include *.mq5,*.mqh `
            -File `
            -Recurse

          foreach ($file in $files) {

            $text = Get-Content `
              $file.FullName `
              -Raw

            # Remove invalid #pragma once directives.
            $text = [regex]::Replace(
              $text,
              '(?m)^\s*#pragma\s+once\s*\r?\n?',
              ''
            )

            # Correct invalid standard-library include paths.
            $text = $text -replace `
              '(?i)#include\s*[<"]\s*Include[\\/]+Trade[\\/]+Trade\.mqh\s*[>"]',
              '#include <Trade/Trade.mqh>'

            Set-Content `
              -Path $file.FullName `
              -Value $text `
              -Encoding UTF8
          }

          Write-Host "MQL5 header normalization complete."

      - name: Verify standard MQL5 library
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $trade = $env:TRADE_MQH

          if (-not $trade -or -not (Test-Path $trade)) {
            throw "Trade.mqh is unavailable."
          }

          Write-Host "Trade.mqh:"
          Write-Host $trade

          $tradeDir = Split-Path $trade -Parent
          $includeDir = Split-Path $tradeDir -Parent

          $objectMqh = Join-Path $includeDir "Object.mqh"

          if (-not (Test-Path $objectMqh)) {
            throw "Object.mqh is missing from the standard MQL5 Include directory."
          }

          Write-Host "Standard MQL5 library verification passed."

      - name: Compile King's Bot
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "COMPILING KING'S BOT"
          Write-Host "========================================="

          $main = Join-Path `
            $env:KINGSBOT_SOURCE `
            "KingsBot_Phase6_Integration.mq5"

          if (-not (Test-Path $main)) {
            throw "Main King's Bot source file was not found: $main"
          }

          Write-Host "MetaEditor:"
          Write-Host $env:METAEDITOR

          Write-Host ""
          Write-Host "Main source:"
          Write-Host $main

          & $env:METAEDITOR "/compile:$main" "/log"

          $compileExit = $LASTEXITCODE

          Write-Host ""
          Write-Host "MetaEditor exit code: $compileExit"

          if ($compileExit -ne 0) {
            throw "MetaEditor compilation failed."
          }

          Start-Sleep -Seconds 2

          $ex5 = Get-ChildItem `
            -Path $env:KINGSBOT_SOURCE `
            -Filter "*.ex5" `
            -File `
            -Recurse |
            Select-Object -First 1

          if (-not $ex5) {
            throw "KingsBot EX5 was not created."
          }

          Write-Host ""
          Write-Host "========================================="
          Write-Host "KING'S BOT EX5 CREATED"
          Write-Host "========================================="
          Write-Host $ex5.FullName

          "KINGSBOT_EX5=$($ex5.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Find King's Bot EX5
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          if (
            -not $env:KINGSBOT_EX5 -or
            -not (Test-Path $env:KINGSBOT_EX5)
          ) {
            throw "Compiled King's Bot EX5 could not be found."
          }

          Write-Host "Verified EX5:"
          Write-Host $env:KINGSBOT_EX5

      - name: Upload King's Bot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-build
          if-no-files-found: error
          path: |
            ${{ env.KINGSBOT_EX5 }}
            ${{ env.KINGSBOT_SOURCE }}/*.mq5
            ${{ env.KINGSBOT_SOURCE }}/*.mqh

      - name: Complete job
        shell: powershell
        run: |
          Write-Host "========================================="
          Write-Host "KING'S BOT BUILD COMPLETE"
          Write-Host "========================================="
