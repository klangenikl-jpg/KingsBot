name: KingsBot MQL5 Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Get KingsBot source
        uses: actions/checkout@v4

      - name: Show source files
        shell: powershell
        run: |
          Write-Host "=== SOURCE FILES ==="
          Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -File |
            Select-Object FullName

      - name: Install MetaTrader 5
        shell: powershell
        run: |
          $installer = "$env:RUNNER_TEMP\mt5setup.exe"

          Invoke-WebRequest `
            -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" `
            -OutFile $installer

          Start-Process $installer -ArgumentList "/auto" -Wait

      - name: Find MetaEditor
        id: metaeditor
        shell: powershell
        run: |
          Write-Host "=== SEARCHING FOR METAEDITOR ==="

          $roots = @(
            "$env:ProgramFiles",
            "${env:ProgramFiles(x86)}",
            "$env:APPDATA",
            "$env:LOCALAPPDATA"
          )

          $found = $null

          foreach ($root in $roots) {
            if (Test-Path $root) {
              $found = Get-ChildItem `
                -Path $root `
                -Filter "metaeditor64.exe" `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

              if ($found) {
                break
              }
            }
          }

          if (-not $found) {
            Write-Error "MetaEditor was not found."
            exit 1
          }

          Write-Host "MetaEditor found at: $($found.FullName)"
          "path=$($found.FullName)" >> $env:GITHUB_OUTPUT

      - name: Find KingsBot source
        id: source
        shell: powershell
        run: |
          $source = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter "KingsBot.mq5" `
            -Recurse `
            -File |
            Select-Object -First 1

          if (-not $source) {
            Write-Error "KingsBot.mq5 was not found."
            exit 1
          }

          Write-Host "Source found at: $($source.FullName)"
          "path=$($source.FullName)" >> $env:GITHUB_OUTPUT

      - name: Compile KingsBot
        shell: powershell
        run: |
          $editor = "${{ steps.metaeditor.outputs.path }}"
          $source = "${{ steps.source.outputs.path }}"
          $log = Join-Path $env:GITHUB_WORKSPACE "compile.log"

          Write-Host "=== COMPILING KINGSBOT ==="
          Write-Host "MetaEditor: $editor"
          Write-Host "Source: $source"

          & $editor "/compile:$source" "/log:$log"

          if (Test-Path $log) {
            Get-Content $log
          } else {
            Write-Error "MetaEditor did not create compile.log"
            exit 1
          }

      - name: Verify build
        shell: powershell
        run: |
          Write-Host "=== EX5 FILES ==="

          $files = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Recurse `
            -Filter "*.ex5" `
            -File

          if (-not $files) {
            Write-Error "No .ex5 file was produced."
            exit 1
          }

          $files | Select-Object FullName, Length, LastWriteTime

          Write-Host "=== COMPILE LOG ==="
          Get-Content (Join-Path $env:GITHUB_WORKSPACE "compile.log")

      - name: Upload build results
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-Phase6-Build
          path: |
            compile.log
            **/*.ex5
          if-no-files-found: error
