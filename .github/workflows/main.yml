name: Build King's Bot

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build King's Bot
    runs-on: windows-latest

    steps:

      - name: Checkout King's Bot
        uses: actions/checkout@v4

      - name: Locate MetaEditor
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "LOCATING METATRADER 5 / METAEDITOR"
          Write-Host "========================================="

          $candidates = @(
            "C:\Program Files\MetaTrader 5\metaeditor64.exe",
            "C:\Program Files (x86)\MetaTrader 5\metaeditor64.exe"
          )

          $metaEditor = $null

          foreach ($candidate in $candidates) {
            if (Test-Path $candidate) {
              $metaEditor = Get-Item $candidate
              break
            }
          }

          if (-not $metaEditor) {
            $metaEditor = Get-ChildItem `
              -Path "C:\Program Files","C:\Program Files (x86)" `
              -Filter "metaeditor64.exe" `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }

          if (-not $metaEditor) {
            $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"

            Write-Host "MetaEditor not found."
            Write-Host "Downloading official MetaTrader 5 installer..."

            Invoke-WebRequest `
              -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" `
              -OutFile $installer

            Write-Host "Launching MetaTrader 5 installer..."

            $installProcess = Start-Process `
              -FilePath $installer `
              -ArgumentList "/auto" `
              -PassThru `
              -Wait

            Write-Host "Installer exit code: $($installProcess.ExitCode)"

            Start-Sleep -Seconds 10

            $metaEditor = Get-ChildItem `
              -Path "C:\Program Files","C:\Program Files (x86)" `
              -Filter "metaeditor64.exe" `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }

          if (-not $metaEditor) {
            throw "MetaEditor64.exe could not be located."
          }

          Write-Host ""
          Write-Host "MetaEditor:"
          Write-Host $metaEditor.FullName

          "METAEDITOR_PATH=$($metaEditor.FullName)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      - name: Prepare clean MQL5 workspace
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "PREPARING CLEAN MQL5 WORKSPACE"
          Write-Host "========================================="

          $workspace = $env:GITHUB_WORKSPACE
          $buildRoot = Join-Path $env:RUNNER_TEMP "KingsBot-MQL5"
          $includeRoot = Join-Path $buildRoot "Include"

          if (Test-Path $buildRoot) {
            Remove-Item `
              -LiteralPath $buildRoot `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $buildRoot `
            -Force |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Path $includeRoot `
            -Force |
            Out-Null

          $source = Get-ChildItem `
            -Path $workspace `
            -Filter "KingsBot_Phase6_Integration.mq5" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $source) {
            throw "KingsBot_Phase6_Integration.mq5 was not found."
          }

          Copy-Item `
            -LiteralPath $source.FullName `
            -Destination (Join-Path `
              $buildRoot `
              "KingsBot_Phase6_Integration.mq5") `
            -Force

          $headers = Get-ChildItem `
            -Path $workspace `
            -Filter "*.mqh" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue

          if (-not $headers) {
            throw "No MQL5 header files (*.mqh) were found."
          }

          foreach ($file in $headers) {
            Copy-Item `
              -LiteralPath $file.FullName `
              -Destination (Join-Path `
                $buildRoot `
                $file.Name) `
              -Force
          }

          Write-Host ""
          Write-Host "Source workspace:"
          Get-ChildItem `
            -Path $buildRoot `
            -File |
            Sort-Object Name |
            ForEach-Object {
              Write-Host "  $($_.Name)"
            }

          "KING_BUILD_ROOT=$buildRoot" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          "KING_INCLUDE_ROOT=$includeRoot" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      - name: Normalize King's Bot headers
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "NORMALIZING KING'S BOT HEADERS"
          Write-Host "========================================="

          $root = $env:KING_BUILD_ROOT

          $files = Get-ChildItem `
            -Path $root `
            -Filter "*.mqh" `
            -File `
            -Recurse `
            -ErrorAction Stop

          foreach ($file in $files) {

            $content = Get-Content `
              -LiteralPath $file.FullName `
              -Raw `
              -Encoding UTF8

            $original = $content

            #
            # CRITICAL FIX:
            # MQL5 does not accept "#once".
            # Remove the invalid directive completely.
            #
            $content = [regex]::Replace(
              $content,
              '(?im)^[\t ]*#once[\t ]*(?:\r?\n|$)',
              ''
            )

            #
            # Normalize accidental variants of the invalid directive.
            #
            $content = [regex]::Replace(
              $content,
              '(?im)^[\t ]*#\s*once[\t ]*(?:\r?\n|$)',
              ''
            )

            #
            # Normalize the standard Trade library include.
            #
            $content = $content.Replace(
              '#include <Include\Trade\Trade.mqh>',
              '#include <Trade\Trade.mqh>'
            )

            $content = $content.Replace(
              '#include <Include/Trade/Trade.mqh>',
              '#include <Trade/Trade.mqh>'
            )

            if ($content -ne $original) {

              Set-Content `
                -LiteralPath $file.FullName `
                -Value $content `
                -Encoding UTF8

              Write-Host "Normalized: $($file.Name)"
            }
          }

          Write-Host ""
          Write-Host "Checking for remaining #once directives..."

          $remaining = Select-String `
            -Path (Join-Path $root "*.mqh") `
            -Pattern "^\s*#\s*once\s*$" `
            -CaseSensitive:$false `
            -ErrorAction SilentlyContinue

          if ($remaining) {
            $remaining | ForEach-Object {
              Write-Host $_.Path
              Write-Host $_.Line
            }

            throw "One or more invalid #once directives remain."
          }

          Write-Host "No invalid #once directives remain."

      - name: Prepare standard MQL5 Trade library
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "PREPARING STANDARD MQL5 LIBRARY"
          Write-Host "========================================="

          $destination = Join-Path `
            $env:KING_BUILD_ROOT `
            "Include"

          New-Item `
            -ItemType Directory `
            -Path $destination `
            -Force |
            Out-Null

          $tradeCandidates = @()

          $tradeCandidates += Get-ChildItem `
            -Path "C:\Users" `
            -Filter "Trade.mqh" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue

          $tradeCandidates += Get-ChildItem `
            -Path "C:\Program Files","C:\Program Files (x86)" `
            -Filter "Trade.mqh" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue

          $trade = $tradeCandidates |
            Where-Object {
              $_.FullName -match "\\MQL5\\Include\\Trade\\Trade\.mqh$"
            } |
            Select-Object -First 1

          if (-not $trade) {
            $trade = $tradeCandidates |
              Select-Object -First 1
          }

          if (-not $trade) {
            throw "Standard MQL5 Trade.mqh could not be located."
          }

          Write-Host "Trade.mqh source:"
          Write-Host $trade.FullName

          $standardRoot = Split-Path `
            (Split-Path `
              (Split-Path $trade.FullName -Parent) `
              -Parent) `
            -Parent

          $standardMql5 = Join-Path `
            $standardRoot `
            "MQL5"

          if (-not (Test-Path $standardMql5)) {
            throw "Standard MQL5 directory could not be determined."
          }

          Write-Host "Standard MQL5 root:"
          Write-Host $standardMql5

          Copy-Item `
            -LiteralPath (Join-Path `
              $standardMql5 `
              "Include") `
            -Destination $destination `
            -Recurse `
            -Force

          $finalTrade = Join-Path `
            $destination `
            "Trade\Trade.mqh"

          if (-not (Test-Path $finalTrade)) {
            throw "Trade.mqh was not copied into the build include directory."
          }

          Write-Host ""
          Write-Host "Verified:"
          Write-Host $finalTrade

      - name: Verify source before compilation
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "PRE-COMPILATION SOURCE CHECK"
          Write-Host "========================================="

          $source = Join-Path `
            $env:KING_BUILD_ROOT `
            "KingsBot_Phase6_Integration.mq5"

          if (-not (Test-Path $source)) {
            throw "Main KingsBot source file is missing."
          }

          $trade = Join-Path `
            $env:KING_INCLUDE_ROOT `
            "Trade\Trade.mqh"

          if (-not (Test-Path $trade)) {
            throw "Trade.mqh is missing from the compiler include tree."
          }

          $invalidOnce = Get-ChildItem `
            -Path $env:KING_BUILD_ROOT `
            -Filter "*.mqh" `
            -File `
            -Recurse |
            Select-String `
              -Pattern "^\s*#\s*once\s*$" `
              -CaseSensitive:$false `
              -ErrorAction SilentlyContinue

          if ($invalidOnce) {
            throw "Invalid #once directive detected before compilation."
          }

          Write-Host "Main source: OK"
          Write-Host "Trade.mqh: OK"
          Write-Host "#once check: OK"

      - name: Compile King's Bot
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "COMPILING KING'S BOT"
          Write-Host "========================================="

          $metaEditor = $env:METAEDITOR_PATH

          $source = Join-Path `
            $env:KING_BUILD_ROOT `
            "KingsBot_Phase6_Integration.mq5"

          $log = Join-Path `
            $env:KING_BUILD_ROOT `
            "KingsBot_Phase6_Integration.log"

          Write-Host "MetaEditor:"
          Write-Host $metaEditor

          Write-Host "Source:"
          Write-Host $source

          Write-Host "Include root:"
          Write-Host $env:KING_BUILD_ROOT

          #
          # /inc points at the directory containing Include.
          # The source tree therefore resolves:
          # <Trade\Trade.mqh>
          # against:
          # <build>\Include\Trade\Trade.mqh
          #
          $arguments = @(
            "/compile:$source"
            "/inc:$env:KING_BUILD_ROOT"
            "/log:$log"
          )

          $process = Start-Process `
            -FilePath $metaEditor `
            -ArgumentList $arguments `
            -Wait `
            -PassThru `
            -WindowStyle Hidden

          Write-Host ""
          Write-Host "MetaEditor exit code: $($process.ExitCode)"

          Write-Host ""
          Write-Host "========== MQL5 COMPILER LOG =========="

          if (Test-Path $log) {
            Get-Content -LiteralPath $log
          }
          else {
            Write-Host "Compiler log was not created."
          }

          Write-Host ""
          Write-Host "========================================="

          if (-not (Test-Path $log)) {
            throw "Compilation failed because no compiler log was produced."
          }

          $logText = Get-Content `
            -LiteralPath $log `
            -Raw

          $errorMatches = [regex]::Matches(
            $logText,
            '(?im)\berror\s+\d+\s*:'
          )

          if ($errorMatches.Count -gt 0) {
            throw "King's Bot compilation failed with $($errorMatches.Count) compiler error(s)."
          }

          $ex5 = Get-ChildItem `
            -Path $env:KING_BUILD_ROOT `
            -Filter "KingsBot_Phase6_Integration.ex5" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $ex5) {
            throw "Compilation produced no KingsBot EX5."
          }

          if ($ex5.Length -le 0) {
            throw "KingsBot EX5 exists but is empty."
          }

          Write-Host ""
          Write-Host "========================================="
          Write-Host "EX5 CREATED SUCCESSFULLY"
          Write-Host "========================================="
          Write-Host "Path: $($ex5.FullName)"
          Write-Host "Size: $($ex5.Length) bytes"

          "EX5_PATH=$($ex5.FullName)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      - name: Stage artifacts
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $artifactRoot = Join-Path `
            $env:GITHUB_WORKSPACE `
            "build-artifacts"

          New-Item `
            -ItemType Directory `
            -Path $artifactRoot `
            -Force |
            Out-Null

          if ($env:EX5_PATH -and (Test-Path $env:EX5_PATH)) {
            Copy-Item `
              -LiteralPath $env:EX5_PATH `
              -Destination (Join-Path `
                $artifactRoot `
                "KingsBot_Phase6_Integration.ex5") `
              -Force
          }

          $log = Join-Path `
            $env:KING_BUILD_ROOT `
            "KingsBot_Phase6_Integration.log"

          if (Test-Path $log) {
            Copy-Item `
              -LiteralPath $log `
              -Destination (Join-Path `
                $artifactRoot `
                "KingsBot_Phase6_Integration.log") `
                -Force
          }

      - name: Upload King's Bot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-build
          path: build-artifacts
          if-no-files-found: warn
          retention-days: 14

      - name: Final verification
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:EX5_PATH) {
            throw "Final verification failed: EX5 was not created."
          }

          if (-not (Test-Path $env:EX5_PATH)) {
            throw "Final verification failed: EX5 path does not exist."
          }

          $size = (Get-Item $env:EX5_PATH).Length

          if ($size -le 0) {
            throw "Final verification failed: EX5 is empty."
          }

          Write-Host ""
          Write-Host "========================================="
          Write-Host "KING'S BOT BUILD SUCCESSFUL"
          Write-Host "========================================="
          Write-Host "EX5: $env:EX5_PATH"
          Write-Host "Size: $size bytes"
          Write-Host "========================================="
