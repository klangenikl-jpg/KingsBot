name: King's Bot - Phase 6 Final Validation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase6-validation:
    name: Phase 6 Final Build and MT5 Validation
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout King's Bot
        uses: actions/checkout@v4

      - name: Build compile and diagnose MT5 Strategy Tester
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $evidence = Join-Path $env:GITHUB_WORKSPACE 'phase6-validation-evidence'
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null

          Write-Host '=== LOCATE PHASE 6 SOURCE ==='

          $source = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Recurse `
            -File `
            -Filter 'KingsBot_Phase6_Integration.mq5' |
            Select-Object -First 1

          if (-not $source) {
            throw 'KingsBot_Phase6_Integration.mq5 was not found.'
          }

          $sourceRoot = $source.Directory.FullName

          Write-Host "SOURCE: $($source.FullName)"

          Write-Host '=== INSTALL METATRADER 5 ==='

          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          $mt5Root = Join-Path $env:RUNNER_TEMP 'KingsBot-MT5'

          Invoke-WebRequest `
            -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' `
            -OutFile $installer `
            -UseBasicParsing

          if (-not (Test-Path $installer)) {
            throw 'MetaTrader 5 installer was not downloaded.'
          }

          if (Test-Path $mt5Root) {
            Remove-Item $mt5Root -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $mt5Root `
            -Force | Out-Null

          $install = Start-Process `
            -FilePath $installer `
            -ArgumentList @(
              '/auto',
              "/path:`"$mt5Root`""
            ) `
            -Wait `
            -PassThru

          Write-Host "Installer exit code: $($install.ExitCode)"

          $terminal = Get-ChildItem `
            -Path $mt5Root `
            -Recurse `
            -File `
            -Filter 'terminal64.exe' `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          $editor = Get-ChildItem `
            -Path $mt5Root `
            -Recurse `
            -File `
            -Filter 'metaeditor64.exe' `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $terminal -or -not $editor) {
            throw 'MetaTrader 5 terminal or MetaEditor was not found.'
          }

          Write-Host "TERMINAL: $($terminal.FullName)"
          Write-Host "METAEDITOR: $($editor.FullName)"

          Write-Host '=== PREPARE KINGSBOT ==='

          $target = Join-Path `
            $mt5Root `
            'MQL5\Experts\KingsBot'

          if (Test-Path $target) {
            Remove-Item $target -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $target `
            -Force | Out-Null

          Copy-Item `
            -Path (Join-Path $sourceRoot '*') `
            -Destination $target `
            -Recurse `
            -Force

          $compileSource = Join-Path `
            $target `
            'KingsBot_Phase6_Integration.mq5'

          if (-not (Test-Path $compileSource)) {
            throw "Prepared source missing: $compileSource"
          }

          Write-Host "COMPILE SOURCE: $compileSource"

          Write-Host '=== COMPILE ==='

          $compileLog = [IO.Path]::ChangeExtension(
            $compileSource,
            '.log'
          )

          $ex5 = [IO.Path]::ChangeExtension(
            $compileSource,
            '.ex5'
          )

          Remove-Item `
            $compileLog,
            $ex5 `
            -Force `
            -ErrorAction SilentlyContinue

          $compile = Start-Process `
            -FilePath $editor.FullName `
            -ArgumentList @(
              "/compile:$compileSource",
              '/log'
            ) `
            -WorkingDirectory (Split-Path $compileSource -Parent) `
            -Wait `
            -PassThru

          Write-Host "MetaEditor exit code: $($compile.ExitCode)"

          if (-not (Test-Path $compileLog)) {
            throw 'Compiler log was not produced.'
          }

          Get-Content $compileLog

          if (-not (Test-Path $ex5)) {
            throw 'EX5 was not produced.'
          }

          if ((Get-Item $ex5).Length -le 0) {
            throw 'EX5 is empty.'
          }

          $compilerErrors = Select-String `
            -Path $compileLog `
            -Pattern '(?i)\berror\b' `
            -ErrorAction SilentlyContinue

          if ($compilerErrors) {
            $compilerErrors | ForEach-Object {
              Write-Host $_.Line
            }

            throw 'Compiler log contains errors.'
          }

          Write-Host "COMPILE PASS: $((Get-Item $ex5).Length) bytes"

          Copy-Item `
            $ex5 `
            $evidence `
            -Force

          Copy-Item `
            $compileLog `
            $evidence `
            -Force

          Write-Host '=== VERIFY EA LOCATION ==='

          Write-Host "Expected EA:"
          Write-Host $ex5

          if (-not (Test-Path $ex5)) {
            throw 'EA verification failed.'
          }

          Write-Host 'EA verification PASS.'

          Write-Host '=== PREPARE TESTER ==='

          $reportDir = Join-Path `
            $mt5Root `
            'reports'

          if (Test-Path $reportDir) {
            Remove-Item $reportDir -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $reportDir `
            -Force | Out-Null

          $config = Join-Path `
            $mt5Root `
            'KingsBot_Phase6_Tester.ini'

          $configLines = @(
            '[Common]'
            'KeepPrivate=1'
            ''
            '[Experts]'
            'AllowLiveTrading=0'
            'AllowDllImport=0'
            'Enabled=1'
            ''
            '[Tester]'
            'Expert=KingsBot\KingsBot_Phase6_Integration.ex5'
            'Symbol=EURUSD'
            'Period=M15'
            'Model=0'
            'Optimization=0'
            'ExecutionMode=0'
            'FromDate=2025.01.01'
            'ToDate=2026.08.01'
            'Deposit=10000'
            'Currency=USD'
            'Leverage=1:100'
            'UseLocal=1'
            'UseRemote=0'
            'UseCloud=0'
            'Visual=0'
            'Report=reports\KingsBot_Phase6_Tester.htm'
            'ReplaceReport=1'
            'ShutdownTerminal=1'
          )

          Set-Content `
            -Path $config `
            -Value ($configLines -join [Environment]::NewLine) `
            -Encoding Unicode

          Write-Host '=== TESTER CONFIG ==='
          Get-Content $config

          Copy-Item `
            $config `
            $evidence `
            -Force

          Write-Host '=== START MT5 TESTER ==='

          $tester = Start-Process `
            -FilePath $terminal.FullName `
            -ArgumentList @(
              '/portable',
              "/config:$config"
            ) `
            -WorkingDirectory $mt5Root `
            -PassThru

          Write-Host "MT5 PID: $($tester.Id)"

          $deadline = (Get-Date).AddMinutes(15)
          $report = Join-Path `
            $reportDir `
            'KingsBot_Phase6_Tester.htm'

          while ((Get-Date) -lt $deadline) {

            if (Test-Path $report) {
              Write-Host '=== TESTER REPORT FOUND ==='
              break
            }

            $running = Get-Process `
              -Id $tester.Id `
              -ErrorAction SilentlyContinue

            if (-not $running) {
              Write-Host 'MT5 exited before the tester report was created.'
              break
            }

            Start-Sleep -Seconds 5
          }

          Write-Host '=== COLLECT MT5 LOGS ==='

          $logFiles = @()

          $logFiles += Get-ChildItem `
            -Path (Join-Path $mt5Root 'Logs') `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue

          $logFiles += Get-ChildItem `
            -Path (Join-Path $mt5Root 'Tester\logs') `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue

          $logFiles += Get-ChildItem `
            -Path (Join-Path $mt5Root 'Tester') `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Extension -in @(
                '.log',
                '.xml',
                '.htm',
                '.html'
              )
            }

          $logFiles = $logFiles |
            Where-Object {
              $_ -and (Test-Path $_.FullName)
            } |
            Sort-Object FullName -Unique

          foreach ($log in $logFiles) {

            Write-Host ''
            Write-Host "===== $($log.FullName) ====="

            try {
              Get-Content `
                $log.FullName `
                -ErrorAction Stop
            }
            catch {
              Write-Host "Could not read log: $($_.Exception.Message)"
            }

            Copy-Item `
              $log.FullName `
              $evidence `
              -Force `
              -ErrorAction SilentlyContinue
          }

          Write-Host '=== TESTER DIRECTORY TREE ==='

          if (Test-Path (Join-Path $mt5Root 'Tester')) {
            Get-ChildItem `
              -Path (Join-Path $mt5Root 'Tester') `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
              Select-Object FullName, Length, LastWriteTime |
              Format-Table -AutoSize
          }

          if (Test-Path $report) {

            if ((Get-Item $report).Length -le 0) {
              throw 'Tester report exists but is empty.'
            }

            Copy-Item `
              $report `
              $evidence `
              -Force

            Write-Host "
