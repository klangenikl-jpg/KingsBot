name: King's Bot - Phase 6 Final Validation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase6-validation:
    name: Phase 6 Final Build and MT5 Validation
    runs-on: windows-latest
    timeout-minutes: 30

    steps:

      - name: Checkout King's Bot
        uses: actions/checkout@v5

      - name: Locate Phase 6 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Recurse `
            -File `
            -Filter 'KingsBot_Phase6_Integration.mq5' |
            Select-Object -First 1

          if (-not $source) {
            throw "KingsBot_Phase6_Integration.mq5 was not found."
          }

          "KB_SOURCE=$($source.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "KB_SOURCE_ROOT=$($source.Directory.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "SOURCE:"
          Write-Host $source.FullName


      - name: Install and verify MetaTrader 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'

          Write-Host "Downloading official MetaTrader 5 installer..."

          Invoke-WebRequest `
            -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' `
            -OutFile $installer

          if (-not (Test-Path $installer)) {
            throw "MetaTrader 5 installer was not downloaded."
          }

          Write-Host "Starting MetaTrader 5 unattended installation..."

          $install = Start-Process `
            -FilePath $installer `
            -ArgumentList '/auto' `
            -Wait `
            -PassThru

          Write-Host "MetaTrader 5 installer exit code: $($install.ExitCode)"

          $searchRoots = @(
            'C:\Program Files\MetaTrader 5',
            'C:\Program Files (x86)\MetaTrader 5',
            'C:\Program Files',
            'C:\Program Files (x86)',
            $env:LOCALAPPDATA
          )

          $terminal = $null
          $editor = $null

          Write-Host "Searching for terminal64.exe and metaeditor64.exe..."

          foreach ($root in $searchRoots) {
            if (-not (Test-Path $root)) {
              continue
            }

            if (-not $terminal) {
              $terminal = Get-ChildItem `
                -Path $root `
                -Recurse `
                -File `
                -Filter 'terminal64.exe' `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1
            }

            if (-not $editor) {
              $editor = Get-ChildItem `
                -Path $root `
                -Recurse `
                -File `
                -Filter 'metaeditor64.exe' `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1
            }

            if ($terminal -and $editor) {
              break
            }
          }

          if (-not $terminal -or -not $editor) {
            throw "MetaTrader 5 installation could not be verified."
          }

          Write-Host ""
          Write-Host "MT5 INSTALLATION VERIFIED"
          Write-Host "Terminal: $($terminal.FullName)"
          Write-Host "MetaEditor: $($editor.FullName)"

          $installedRoot = $terminal.Directory.FullName

          if (-not (Test-Path 'C:\MT5')) {
            New-Item -ItemType Directory -Path 'C:\MT5' -Force | Out-Null
          }

          Copy-Item `
            -Path (Join-Path $installedRoot '*') `
            -Destination 'C:\MT5' `
            -Recurse `
            -Force

          $stagedEditor = Get-ChildItem `
            -Path 'C:\MT5' `
            -Recurse `
            -File `
            -Filter 'metaeditor64.exe' |
            Select-Object -First 1

          $stagedTerminal = Get-ChildItem `
            -Path 'C:\MT5' `
            -Recurse `
            -File `
            -Filter 'terminal64.exe' |
            Select-Object -First 1

          if (-not $stagedEditor) {
            throw "Staged MetaEditor64.exe was not found."
          }

          if (-not $stagedTerminal) {
            throw "Staged terminal64.exe was not found."
          }

          "METAEDITOR=$($stagedEditor.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "MT5_TERMINAL=$($stagedTerminal.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "STAGED MT5 VERIFIED"
          Write-Host "MetaEditor: $($stagedEditor.FullName)"
          Write-Host "Terminal: $($stagedTerminal.FullName)"


      - name: Prepare clean KingsBot MT5 tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $target = 'C:\MT5\MQL5\Experts\KingsBot'

          if (Test-Path $target) {
            Remove-Item $target -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $target `
            -Force | Out-Null

          Copy-Item `
            -Path (Join-Path $env:KB_SOURCE_ROOT '*') `
            -Destination $target `
            -Recurse `
            -Force

          $compileSource = Join-Path `
            $target `
            'KingsBot_Phase6_Integration.mq5'

          if (-not (Test-Path $compileSource)) {
            throw "Prepared Phase 6 source was not found."
          }

          "KB_COMPILE_SOURCE=$compileSource" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Prepared source:"
          Write-Host $compileSource


      - name: Compile Phase 6
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $source = $env:KB_COMPILE_SOURCE
          $log = [IO.Path]::ChangeExtension($source, '.log')
          $ex5 = [IO.Path]::ChangeExtension($source, '.ex5')

          Remove-Item `
            $log,
            $ex5 `
            -Force `
            -ErrorAction SilentlyContinue

          Write-Host "========================================"
          Write-Host "KING'S BOT PHASE 6 COMPILATION"
          Write-Host "========================================"

          $process = Start-Process `
            -FilePath $env:METAEDITOR `
            -ArgumentList @(
              "/compile:$source",
              "/log"
            ) `
            -WorkingDirectory (Split-Path $source -Parent) `
            -Wait `
            -PassThru

          Write-Host "MetaEditor exit code: $($process.ExitCode)"

          if (-not (Test-Path $log)) {
            throw "Compiler log was not produced."
          }

          Get-Content $log

          if (-not (Test-Path $ex5)) {
            throw "Compilation did not produce the Phase 6 EX5."
          }

          if ((Get-Item $ex5).Length -le 0) {
            throw "Phase 6 EX5 is empty."
          }

          $compilerErrors = Select-String `
            -Path $log `
            -Pattern '(?i)\berrors?\s+[1-9][0-9]*\b|(?i)\berror\s*:' `
            -ErrorAction SilentlyContinue

          if ($compilerErrors) {
            $compilerErrors |
              ForEach-Object {
                Write-Host $_.Line
              }

            throw "Compiler log contains compilation errors."
          }

          Write-Host ""
          Write-Host "PHASE 6 COMPILATION: PASS"
          Write-Host "EX5 SIZE: $((Get-Item $ex5).Length) bytes"

          "KB_EX5=$ex5" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "KB_COMPILE_LOG=$log" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8


      - name: Prepare Strategy Tester
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $reports = 'C:\MT5\reports'

          if (Test-Path $reports) {
            Remove-Item $reports -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $reports `
            -Force | Out-Null

          $config = 'C:\MT5\KingsBot_Phase6_Tester.ini'

          @"
[Common]
KeepPrivate=1

[Experts]
AllowLiveTrading=0
AllowDllImport=0
Enabled=1

[Tester]
Expert=KingsBot\KingsBot_Phase6_Integration.ex5
Symbol=EURUSD
Period=M15
Model=4
Optimization=0
ExecutionMode=0
FromDate=2025.01.01
ToDate=2026.08.01
Deposit=10000
Currency=USD
Leverage=1:100
UseLocal=1
UseRemote=0
UseCloud=0
Visual=0
Report=reports\KingsBot_Phase6_Tester.htm
ReplaceReport=1
ShutdownTerminal=1
"@ | Set-Content `
            -Path $config `
            -Encoding Unicode

          Write-Host "Strategy Tester configuration created."

          Get-Content $config

          if (-not (Test-Path $config)) {
            throw "Strategy Tester configuration was not created."
          }

          "KB_TEST_CONFIG=$config" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8


      - name: Run MT5 Strategy Tester
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not (Test-Path $env:MT5_TERMINAL)) {
            throw "MT5 terminal was not found."
          }

          if (-not (Test-Path $env:KB_TEST_CONFIG)) {
            throw "Strategy Tester configuration was not found."
          }

          Write-Host "Starting MT5 Strategy Tester..."

          $process = Start-Process `
            -FilePath $env:MT5_TERMINAL `
            -ArgumentList @(
              '/portable',
              "/config:$env:KB_TEST_CONFIG"
            ) `
            -WorkingDirectory 'C:\MT5' `
            -PassThru

          Write-Host "Tester process ID: $($process.Id)"

          $finished = Wait-Process `
            -Id $process.Id `
            -Timeout 900 `
            -ErrorAction SilentlyContinue

          if (-not $finished) {
            Stop-Process `
              -Id $process.Id `
              -Force `
              -ErrorAction SilentlyContinue

            throw "Strategy Tester timed out after 15 minutes."
          }

          Write-Host "Strategy Tester process finished."


      - name: Verify Strategy Tester result
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $report = 'C:\MT5\reports\KingsBot_Phase6_Tester.htm'

          if (-not (Test-Path $report)) {
            Write-Host "Strategy Tester report was not found."

            Get-ChildItem `
              'C:\MT5' `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
              Select-Object FullName, Length |
              Format-Table -AutoSize

            throw "Strategy Tester did not produce a report."
          }

          if ((Get-Item $report).Length -le 0) {
            throw "Strategy Tester report is empty."
          }

          Write-Host "STRATEGY TESTER REPORT FOUND"
          Write-Host "Report size: $((Get-Item $report).Length) bytes"

          $runtimeLogs = Get-ChildItem `
            'C:\MT5' `
            -Recurse `
            -File `
            -Include '*.log' `
            -ErrorAction SilentlyContinue

          if ($runtimeLogs) {
            $critical = $runtimeLogs |
              Select-String `
                -Pattern '(?i)array out of range|zero divide|cannot load|failed to load|invalid pointer|uninit|critical error' `
                -ErrorAction SilentlyContinue

            if ($critical) {
              $critical |
                ForEach-Object {
                  Write-Host "$($_.Path): $($_.Line)"
                }

              throw "Critical runtime messages were found."
            }
          }

          Write-Host ""
          Write-Host "PHASE 6 FINAL VALIDATION: PASS"


      - name: Package validation evidence
        if: always()
        shell: pwsh
        run: |
          $evidence = Join-Path `
            $env:GITHUB_WORKSPACE `
            'phase6-validation-evidence'

          New-Item `
            -ItemType Directory `
            -Path $evidence `
            -Force | Out-Null

          if ($env:KB_EX5 -and (Test-Path $env:KB_EX5)) {
            Copy-Item `
              $env:KB_EX5 `
              $evidence `
              -Force
          }

          if ($env:KB_COMPILE_LOG -and (Test-Path $env:KB_COMPILE_LOG)) {
            Copy-Item `
              $env:KB_COMPILE_LOG `
              $evidence `
              -Force
          }

          $report = 'C:\MT5\reports\KingsBot_Phase6_Tester.htm'

          if (Test-Path $report) {
            Copy-Item `
              $report `
              $evidence `
              -Force
          }

          Get-ChildItem `
            'C:\MT5' `
            -Recurse `
            -File `
            -Include '*.log' `
            -ErrorAction SilentlyContinue |
            ForEach-Object {
              Copy-Item `
                $_.FullName `
                $evidence `
                -Force `
                -ErrorAction SilentlyContinue
            }

          Write-Host "Validation evidence prepared."

          Get-ChildItem $evidence |
            Select-Object Name, Length, LastWriteTime


      - name: Upload Phase 6 validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-Phase6-Final-Validation
          path: phase6-validation-evidence
          if-no-files-found: error
          retention-days: 14
