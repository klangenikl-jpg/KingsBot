name: Build King's Bot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Compile King's Bot
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout King's Bot
        uses: actions/checkout@v4

      - name: Download MetaTrader 5 installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          $url = 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe'

          Write-Host "Downloading MetaTrader 5..."
          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer

          if (-not (Test-Path $installer)) {
            throw "MetaTrader 5 installer was not downloaded."
          }

          Write-Host "Installer downloaded:"
          Write-Host $installer

      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'

          Write-Host ""
          Write-Host "========================================"
          Write-Host "INSTALLING METATRADER 5"
          Write-Host "========================================"
          Write-Host ""

          Write-Host "Using documented unattended installation mode:"
          Write-Host "/auto"
          Write-Host ""

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList '/auto' `
            -Wait `
            -PassThru

          Write-Host ""
          Write-Host "Installer exit code: $($process.ExitCode)"

          Write-Host ""
          Write-Host "Searching for MetaEditor64.exe..."

          $searchRoots = @(
            $env:RUNNER_TEMP,
            $env:LOCALAPPDATA,
            'C:\Program Files',
            'C:\Program Files (x86)'
          )

          $metaEditor = $null

          foreach ($root in $searchRoots) {
            if (-not (Test-Path $root)) {
              continue
            }

            Write-Host "Searching: $root"

            $found = Get-ChildItem `
              -Path $root `
              -Filter 'MetaEditor64.exe' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if ($found) {
              $metaEditor = $found
              break
            }
          }

          if (-not $metaEditor) {
            Write-Host ""
            Write-Host "MetaEditor was not found."

            if ($process.ExitCode -ne 0) {
              throw "MetaTrader 5 installation failed with exit code $($process.ExitCode), and MetaEditor64.exe was not found."
            }

            throw "Installer returned exit code 0, but MetaEditor64.exe was not found."
          }

          Write-Host ""
          Write-Host "MetaEditor found:"
          Write-Host $metaEditor.FullName

          "METAEDITOR=$($metaEditor.FullName)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      - name: Locate King's Bot source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host ""
          Write-Host "Searching for KingsBot_Phase6_Integration.mq5..."

          $source = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter 'KingsBot_Phase6_Integration.mq5' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $source) {
            throw "KingsBot_Phase6_Integration.mq5 was not found."
          }

          Write-Host "Source found:"
          Write-Host $source.FullName

          "SOURCE=$($source.FullName)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      - name: Show MQL5 include files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host ""
          Write-Host "========================================"
          Write-Host "MQL5 SOURCE AND INCLUDE FILES"
          Write-Host "========================================"

          Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Include '*.mq5','*.mqh' `
            -File `
            -Recurse |
            Sort-Object FullName |
            ForEach-Object {
              Write-Host $_.FullName
            }

      - name: Compile King's Bot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host ""
          Write-Host "========================================"
          Write-Host "COMPILING KING'S BOT"
          Write-Host "========================================"
          Write-Host ""

          Write-Host "MetaEditor:"
          Write-Host $env:METAEDITOR
          Write-Host ""

          Write-Host "Source:"
          Write-Host $env:SOURCE
          Write-Host ""

          $sourceDirectory = Split-Path `
            -Parent `
            $env:SOURCE

          Write-Host "Source directory:"
          Write-Host $sourceDirectory
          Write-Host ""

          $before = @(
            Get-ChildItem `
              -Path $env:GITHUB_WORKSPACE `
              -Filter '*.ex5' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue
          )

          Write-Host "EX5 files before compilation: $($before.Count)"

          Write-Host ""
          Write-Host "Starting MetaEditor..."

          $process = Start-Process `
            -FilePath $env:METAEDITOR `
            -ArgumentList @(
              "/compile:`"$($env:SOURCE)`"",
              '/log'
            ) `
            -WorkingDirectory $sourceDirectory `
            -Wait `
            -PassThru

          Write-Host ""
          Write-Host "MetaEditor exit code: $($process.ExitCode)"

          Start-Sleep -Seconds 3

          Write-Host ""
          Write-Host "Searching entire workspace for EX5 files..."

          $after = @(
            Get-ChildItem `
              -Path $env:GITHUB_WORKSPACE `
              -Filter '*.ex5' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue
          )

          if ($after.Count -gt 0) {
            Write-Host ""
            Write-Host "EX5 FILES FOUND:"
            $after | ForEach-Object {
              Write-Host $_.FullName
            }
          }
          else {
            Write-Host "No EX5 files found in workspace."
          }

          Write-Host ""
          Write-Host "Searching for compiler logs..."

          $logs = @(
            Get-ChildItem `
              -Path $env:GITHUB_WORKSPACE,$env:RUNNER_TEMP,$sourceDirectory `
              -Include '*.log' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending
          )

          if ($logs.Count -gt 0) {
            foreach ($log in $logs | Select-Object -First 10) {
              Write-Host ""
              Write-Host "========================================"
              Write-Host "LOG: $($log.FullName)"
              Write-Host "========================================"

              Get-Content `
                $log.FullName `
                -ErrorAction SilentlyContinue
            }
          }
          else {
            Write-Host "No compiler log files found."
          }

          if ($after.Count -eq 0) {
            if ($process.ExitCode -ne 0) {
              throw "MetaEditor failed with exit code $($process.ExitCode)."
            }

            throw "MetaEditor returned exit code 0, but no EX5 file was created. Compiler diagnostics were printed above."
          }

          $generated = $after |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          Write-Host ""
          Write-Host "========================================"
          Write-Host "SUCCESS: EX5 GENERATED"
          Write-Host "========================================"
          Write-Host $generated.FullName

          "EX5_PATH=$($generated.FullName)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      - name: Prepare King's Bot package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $package = Join-Path `
            $env:RUNNER_TEMP `
            'KingsBot_Phase6_Package'

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $package |
            Out-Null

          Copy-Item `
            -Path $env:EX5_PATH `
            -Destination $package `
            -Force

          Write-Host "Package contents:"
          Get-ChildItem `
            -Path $package `
            -File |
            ForEach-Object {
              Write-Host $_.FullName
            }

          "PACKAGE=$package" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      - name: Upload King's Bot package
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-Phase6
          path: ${{ env.PACKAGE }}
          if-no-files-found: error
