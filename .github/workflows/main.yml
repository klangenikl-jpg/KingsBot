name: King's Bot - Phase 6 Final Validation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase6-validation:
    name: Phase 6 Final Build and MT5 Validation
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout King's Bot
        uses: actions/checkout@v4

      - name: Build compile test and collect evidence
        shell: pwsh
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}

        run: |
          $ErrorActionPreference = 'Stop'

          $evidence = Join-Path `
            $env:GITHUB_WORKSPACE `
            'phase6-validation-evidence'

          New-Item `
            -ItemType Directory `
            -Path $evidence `
            -Force | Out-Null

          Write-Host '=========================================='
          Write-Host ' KING''S BOT PHASE 6 FINAL VALIDATION'
          Write-Host '=========================================='

          # ============================================================
          # 1. VALIDATE ACCOUNT SECRETS
          # ============================================================

          Write-Host ''
          Write-Host '=== VALIDATE MT5 ACCOUNT CONFIGURATION ==='

          if ([string]::IsNullOrWhiteSpace($env:MT5_LOGIN)) {
            throw 'MT5_LOGIN GitHub secret is missing.'
          }

          if ([string]::IsNullOrWhiteSpace($env:MT5_PASSWORD)) {
            throw 'MT5_PASSWORD GitHub secret is missing.'
          }

          if ([string]::IsNullOrWhiteSpace($env:MT5_SERVER)) {
            throw 'MT5_SERVER GitHub secret is missing.'
          }

          if ($env:MT5_LOGIN -notmatch '^\d+$') {
            throw 'MT5_LOGIN must contain only the numeric MT5 account number.'
          }

          Write-Host 'MT5 login: present'
          Write-Host 'MT5 password: present'
          Write-Host ('MT5 server: ' + $env:MT5_SERVER)

          # ============================================================
          # 2. LOCATE PHASE 6 SOURCE
          # ============================================================

          Write-Host ''
          Write-Host '=== LOCATE PHASE 6 SOURCE ==='

          $source = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Recurse `
            -File `
            -Filter 'KingsBot_Phase6_Integration.mq5' |
            Select-Object -First 1

          if (-not $source) {
            throw 'KingsBot_Phase6_Integration.mq5 was not found.'
          }

          $sourceRoot = $source.Directory.FullName

          Write-Host (
            'Phase 6 source: ' +
            $source.FullName
          )

          # ============================================================
          # 3. INSTALL MT5
          # ============================================================

          Write-Host ''
          Write-Host '=== INSTALL METATRADER 5 ==='

          $installer = Join-Path `
            $env:RUNNER_TEMP `
            'mt5setup.exe'

          $customRoot = Join-Path `
            $env:RUNNER_TEMP `
            'KingsBot-MT5'

          Invoke-WebRequest `
            -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' `
            -OutFile $installer `
            -UseBasicParsing

          if (-not (Test-Path $installer)) {
            throw 'MetaTrader 5 installer was not downloaded.'
          }

          if (Test-Path $customRoot) {
            Remove-Item `
              $customRoot `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $customRoot `
            -Force | Out-Null

          $install = Start-Process `
            -FilePath $installer `
            -ArgumentList @(
              '/auto',
              ('/path:"' + $customRoot + '"')
            ) `
            -Wait `
            -PassThru

          Write-Host (
            'MT5 installer exit code: ' +
            $install.ExitCode
          )

          # ============================================================
          # 4. LOCATE MT5 EXECUTABLES
          # ============================================================

          Write-Host ''
          Write-Host '=== LOCATE MT5 EXECUTABLES ==='

          $searchRoots = @(
            $customRoot,
            'C:\Program Files',
            'C:\Program Files (x86)',
            (Join-Path $env:LOCALAPPDATA 'Programs'),
            (Join-Path $env:APPDATA 'MetaQuotes')
          ) |
            Where-Object {
              $_ -and (Test-Path $_)
            } |
            Select-Object -Unique

          $terminal = $null
          $editor = $null

          foreach ($root in $searchRoots) {

            if (-not $terminal) {
              $terminal = Get-ChildItem `
                -Path $root `
                -Recurse `
                -File `
                -Filter 'terminal64.exe' `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1
            }

            if (-not $editor) {
              $editor = Get-ChildItem `
                -Path $root `
                -Recurse `
                -File `
                -Filter 'metaeditor64.exe' `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1
            }

            if ($terminal -and $editor) {
              break
            }
          }

          if (-not $terminal) {
            throw 'MetaTrader 5 terminal64.exe was not found.'
          }

          if (-not $editor) {
            throw 'MetaEditor metaeditor64.exe was not found.'
          }

          $mt5Root = Split-Path `
            $terminal.FullName `
            -Parent

          Write-Host ('MT5 root: ' + $mt5Root)
          Write-Host ('Terminal: ' + $terminal.FullName)
          Write-Host ('MetaEditor: ' + $editor.FullName)

          # ============================================================
          # 5. PREPARE EXACT EA DIRECTORY
          # ============================================================

          Write-Host ''
          Write-Host '=== PREPARE KINGSBOT EA DIRECTORY ==='

          $target = Join-Path `
            $mt5Root `
            'MQL5\Experts\KingsBot'

          if (Test-Path $target) {
            Remove-Item `
              $target `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $target `
            -Force | Out-Null

          Copy-Item `
            -Path (Join-Path $sourceRoot '*') `
            -Destination $target `
            -Recurse `
            -Force

          $compileSource = Join-Path `
            $target `
            'KingsBot_Phase6_Integration.mq5'

          if (-not (Test-Path $compileSource)) {
            throw (
              'Prepared Phase 6 source missing: ' +
              $compileSource
            )
          }

          Write-Host (
            'Prepared source: ' +
            $compileSource
          )

          # ============================================================
          # 6. COMPILE
          # ============================================================

          Write-Host ''
          Write-Host '=== COMPILE PHASE 6 ==='

          $compileLog = [IO.Path]::ChangeExtension(
            $compileSource,
            '.log'
          )

          $ex5 = [IO.Path]::ChangeExtension(
            $compileSource,
            '.ex5'
          )

          Remove-Item `
            $compileLog,
            $ex5 `
            -Force `
            -ErrorAction SilentlyContinue

          $compile = Start-Process `
            -FilePath $editor.FullName `
            -ArgumentList @(
              ('/compile:' + $compileSource),
              '/log'
            ) `
            -WorkingDirectory (
              Split-Path `
                $compileSource `
                -Parent
            ) `
            -Wait `
            -PassThru

          Write-Host (
            'MetaEditor exit code: ' +
            $compile.ExitCode
          )

          if (-not (Test-Path $compileLog)) {
            throw 'Compiler log was not produced.'
          }

          Get-Content $compileLog

          if (-not (Test-Path $ex5)) {
            throw 'Compilation did not produce KingsBot_Phase6
