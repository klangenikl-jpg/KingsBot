name: Build King's Bot

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build King's Bot
    runs-on: windows-latest

    steps:
      - name: Checkout King's Bot
        uses: actions/checkout@v4

      - name: Locate MetaEditor
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = "Stop"

          $metaEditor = $null

          $roots = @(
            "C:\Program Files",
            "C:\Program Files (x86)",
            "$env:LOCALAPPDATA"
          )

          foreach ($root in $roots) {
            if (Test-Path $root) {
              $found = Get-ChildItem `
                -Path $root `
                -Filter "metaeditor64.exe" `
                -File `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

              if ($found) {
                $metaEditor = $found.FullName
                break
              }
            }
          }

          if (-not $metaEditor) {
            $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"

            Invoke-WebRequest `
              -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" `
              -OutFile $installer

            Start-Process `
              -FilePath $installer `
              -ArgumentList "/auto" `
              -Wait

            Start-Sleep -Seconds 5

            foreach ($root in $roots) {
              if (Test-Path $root) {
                $found = Get-ChildItem `
                  -Path $root `
                  -Filter "metaeditor64.exe" `
                  -File `
                  -Recurse `
                  -ErrorAction SilentlyContinue |
                  Select-Object -First 1

                if ($found) {
                  $metaEditor = $found.FullName
                  break
                }
              }
            }
          }

          if (-not $metaEditor) {
            throw "MetaEditor64.exe could not be located."
          }

          Write-Host "MetaEditor: $metaEditor"

          "METAEDITOR_PATH=$metaEditor" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      - name: Prepare King's Bot source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $workspace = $env:GITHUB_WORKSPACE
          $buildRoot = Join-Path $env:RUNNER_TEMP "KingsBot-MT5"
          $expertRoot = Join-Path $buildRoot "MQL5\Experts\KingsBot"

          New-Item `
            -ItemType Directory `
            -Path $expertRoot `
            -Force |
            Out-Null

          $sources = @(
            Get-ChildItem `
              -Path $workspace `
              -Filter "KingsBot_Phase6_Integration.mq5" `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue
          )

          if ($sources.Count -eq 0) {
            throw "KingsBot_Phase6_Integration.mq5 was not found."
          }

          if ($sources.Count -gt 1) {
            Write-Host "Multiple Phase 6 source files found:"
            $sources | ForEach-Object {
              Write-Host $_.FullName
            }

            throw "Multiple KingsBot_Phase6_Integration.mq5 files were found."
          }

          $source = $sources[0]

          Write-Host "Using source:"
          Write-Host $source.FullName

          Copy-Item `
            -Path $source.FullName `
            -Destination (Join-Path $expertRoot $source.Name) `
            -Force

          $sourceDirectory = $source.Directory.FullName

          $includes = Get-ChildItem `
            -Path $sourceDirectory `
            -Filter "*.mqh" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue

          foreach ($file in $includes) {
            $relative = $file.FullName.Substring(
              $sourceDirectory.Length
            ).TrimStart('\')

            $destination = Join-Path $expertRoot $relative
            $destinationDirectory = Split-Path $destination -Parent

            New-Item `
              -ItemType Directory `
              -Path $destinationDirectory `
              -Force |
              Out-Null

            Copy-Item `
              -Path $file.FullName `
              -Destination $destination `
              -Force
          }

          Write-Host ""
          Write-Host "King's Bot source tree:"
          Get-ChildItem `
            -Path $expertRoot `
            -Recurse `
            -File |
            ForEach-Object {
              Write-Host $_.FullName
            }

          "KING_EXPERT_ROOT=$expertRoot" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      - name: Clean MQL5 headers
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = $env:KING_EXPERT_ROOT

          $files = Get-ChildItem `
            -Path $root `
            -Recurse `
            -File |
            Where-Object {
              $_.Extension -eq ".mq5" -or
              $_.Extension -eq ".mqh"
            }

          foreach ($file in $files) {
            $lines = Get-Content -LiteralPath $file.FullName

            $output = New-Object System.Collections.Generic.List[string]
            $changed = $false

            foreach ($line in $lines) {
              if ($line.Trim() -match '^#pragma\s+once\s*$') {
                $output.Add("// King's Bot: pragma once removed for MT5 build")
                $changed = $true
              }
              else {
                $output.Add($line)
              }
            }

            if ($changed) {
              Set-Content `
                -LiteralPath $file.FullName `
                -Value $output `
                -Encoding utf8
            }
          }

      - name: Compile King's Bot
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = "Continue"

          $metaEditor = $env:METAEDITOR_PATH

          $source = Join-Path `
            $env:KING_EXPERT_ROOT `
            "KingsBot_Phase6_Integration.mq5"

          if (-not (Test-Path $source)) {
            throw "Source not found: $source"
          }

          $compileDirectory = Split-Path $source -Parent
          $log = Join-Path `
            $compileDirectory `
            "KingsBot_Phase6_Integration.log"

          if (Test-Path $log) {
            Remove-Item $log -Force
          }

          Write-Host "========================================="
          Write-Host "KING'S BOT COMPILATION"
          Write-Host "========================================="
          Write-Host "MetaEditor: $metaEditor"
          Write-Host "Source: $source"
          Write-Host ""

          Push-Location $compileDirectory

          try {
            & $metaEditor `
              "/compile:$source" `
              "/log"

            $exitCode = $LASTEXITCODE
          }
          finally {
            Pop-Location
          }

          Write-Host ""
          Write-Host "MetaEditor exit code: $exitCode"

          Start-Sleep -Seconds 2

          Write-Host ""
          Write-Host "========================================="
          Write-Host "COMPILER OUTPUT"
          Write-Host "========================================="

          if (Test-Path $log) {
            Get-Content -LiteralPath $log
          }
          else {
            Write-Host "Compiler log not found."
          }

          $ex5 = Join-Path `
            $compileDirectory `
            "KingsBot_Phase6_Integration.ex5"

          Write-Host ""
          Write-Host "========================================="
          Write-Host "EX5 CHECK"
          Write-Host "========================================="

          if (Test-Path $ex5) {
            Write-Host "EX5 CREATED:"
            Write-Host $ex5
            Write-Host "SIZE: $((Get-Item $ex5).Length) bytes"
          }
          else {
            Write-Host "EX5 NOT CREATED."
          }

          if ($exitCode -ne 0) {
            throw "MetaEditor compilation returned exit code $exitCode."
          }

          if (-not (Test-Path $ex5)) {
            throw "Compilation completed without creating the EX5."
          }

          "EX5_PATH=$ex5" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      - name: Prepare artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $artifactRoot = Join-Path `
            $env:GITHUB_WORKSPACE `
            "build-artifacts"

          New-Item `
            -ItemType Directory `
            -Path $artifactRoot `
            -Force |
            Out-Null

          if (-not (Test-Path $env:EX5_PATH)) {
            throw "EX5 file does not exist."
          }

          Copy-Item `
            -Path $env:EX5_PATH `
            -Destination (Join-Path `
              $artifactRoot `
              "KingsBot_Phase6_Integration.ex5") `
            -Force

          $log = Join-Path `
            $env:KING_EXPERT_ROOT `
            "KingsBot_Phase6_Integration.log"

          if (Test-Path $log) {
            Copy-Item `
              -Path $log `
              -Destination (Join-Path `
                $artifactRoot `
                "KingsBot_Phase6_Integration.log") `
              -Force
          }

          Write-Host ""
          Write-Host "ARTIFACTS:"
          Get-ChildItem `
            -Path $artifactRoot `
            -File |
            ForEach-Object {
              Write-Host "$($_.Name) - $($_.Length) bytes"
            }

      - name: Upload King's Bot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-EX5
          path: build-artifacts
          if-no-files-found: error
          retention-days: 14

      - name: Build complete
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "========================================="
          Write-Host "KING'S BOT BUILD COMPLETE"
          Write-Host "========================================="
          Write-Host "Artifact: KingsBot-EX5"
          Write-Host "File: KingsBot_Phase6_Integration.ex5"
