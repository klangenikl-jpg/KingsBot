name: Build King's Bot

on:
  push:
    branches:
      - main
    paths:
      - '**/*.mq5'
      - '**/*.mqh'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Compile King's Bot
    runs-on: windows-latest
    timeout-minutes: 30

    steps:

      # ---------------------------------------------------------
      # 1. CHECK OUT KING'S BOT
      # ---------------------------------------------------------
      - name: Checkout King's Bot
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. DOWNLOAD AND INSTALL METATRADER 5
      # ---------------------------------------------------------
      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          $mt5Url = 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe'

          Write-Host "========================================"
          Write-Host "DOWNLOADING METATRADER 5"
          Write-Host "========================================"

          Invoke-WebRequest `
            -Uri $mt5Url `
            -OutFile $installer

          if (-not (Test-Path -LiteralPath $installer)) {
            throw "MetaTrader 5 installer was not downloaded."
          }

          Write-Host "Installer downloaded:"
          Write-Host $installer

          Write-Host ""
          Write-Host "========================================"
          Write-Host "INSTALLING METATRADER 5"
          Write-Host "========================================"

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList '/auto' `
            -Wait `
            -PassThru

          if ($null -eq $process) {
            throw "Failed to start MetaTrader 5 installer."
          }

          Write-Host ""
          Write-Host "Installer process ID:"
          Write-Host $process.Id

          Write-Host ""
          Write-Host "Installer exit code:"
          Write-Host $process.ExitCode

          # MetaTrader 5's installer can return exit code 1
          # even when the installation has completed normally.
          if ($process.ExitCode -notin @(0, 1)) {
            throw "MetaTrader 5 installer returned unexpected exit code $($process.ExitCode)."
          }

          Write-Host ""
          Write-Host "MetaTrader 5 installer completed."

      # ---------------------------------------------------------
      # 3. LOCATE METAEDITOR
      # ---------------------------------------------------------
      - name: Locate MetaEditor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========================================"
          Write-Host "LOCATING METAEDITOR"
          Write-Host "========================================"

          $searchRoots = @(
            $env:RUNNER_TEMP,
            $env:APPDATA,
            $env:LOCALAPPDATA,
            $env:ProgramFiles,
            ${env:ProgramFiles(x86)}
          )

          $metaEditor = $null

          foreach ($root in $searchRoots) {

            if ([string]::IsNullOrWhiteSpace($root)) {
              continue
            }

            if (-not (Test-Path -LiteralPath $root)) {
              continue
            }

            Write-Host ""
            Write-Host "Searching:"
            Write-Host $root

            $found = Get-ChildItem `
              -Path $root `
              -Filter 'metaeditor64.exe' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if ($found) {
              $metaEditor = $found
              break
            }

            $found = Get-ChildItem `
              -Path $root `
              -Filter 'metaeditor.exe' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if ($found) {
              $metaEditor = $found
              break
            }
          }

          if (-not $metaEditor) {
            Write-Host ""
            Write-Host "MetaEditor was not found."
            Write-Host ""
            Write-Host "Searching the runner for diagnostic purposes..."

            Get-ChildItem `
              -Path 'C:\Users' `
              -Filter 'metaeditor64.exe' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 20 -ExpandProperty FullName

            throw "MetaEditor executable was not found."
          }

          Write-Host ""
          Write-Host "MetaEditor found:"
          Write-Host $metaEditor.FullName

          "METAEDITOR=$($metaEditor.FullName)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append

      # ---------------------------------------------------------
      # 4. LOCATE KING'S BOT SOURCE
      # ---------------------------------------------------------
      - name: Locate King's Bot source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $workspace = $env:GITHUB_WORKSPACE

          Write-Host "========================================"
          Write-Host "LOCATING MQL5 SOURCE"
          Write-Host "========================================"

          $mq5Files = @(
            Get-ChildItem `
              -Path $workspace `
              -Filter '*.mq5' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue
          )

          if ($mq5Files.Count -eq 0) {
            Write-Host ""
            Write-Host "Repository contents:"

            Get-ChildItem `
              -Path $workspace `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName

            throw "No .mq5 source files were found."
          }

          Write-Host ""
          Write-Host "MQL5 source files found:"

          foreach ($file in $mq5Files) {
            Write-Host " - $($file.FullName)"
          }

          "SOURCE_ROOT=$workspace" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append

      # ---------------------------------------------------------
      # 5. LOCATE MQL5 INCLUDE FILES
      # ---------------------------------------------------------
      - name: Locate MQL5 include files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========================================"
          Write-Host "LOCATING MQL5 INCLUDE FILES"
          Write-Host "========================================"

          $mqhFiles = @(
            Get-ChildItem `
              -Path $env:SOURCE_ROOT `
              -Filter '*.mqh' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue
          )

          Write-Host ""
          Write-Host "MQL5 include files found: $($mqhFiles.Count)"

          foreach ($file in $mqhFiles) {
            Write-Host " - $($file.FullName)"
          }

      # ---------------------------------------------------------
      # 6. COMPILE KING'S BOT
      # ---------------------------------------------------------
      - name: Compile King's Bot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========================================"
          Write-Host "COMPILING KING'S BOT"
          Write-Host "========================================"

          $mq5Files = @(
            Get-ChildItem `
              -Path $env:SOURCE_ROOT `
              -Filter '*.mq5' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue
          )

          if ($mq5Files.Count -eq 0) {
            throw "No MQL5 files are available for compilation."
          }

          $buildFailed = $false

          foreach ($file in $mq5Files) {

            Write-Host ""
            Write-Host "----------------------------------------"
            Write-Host "Compiling:"
            Write-Host $file.FullName
            Write-Host "----------------------------------------"

            $arguments = @(
              "/compile:$($file.FullName)"
              "/log"
            )

            & $env:METAEDITOR @arguments

            $exitCode = $LASTEXITCODE

            Write-Host ""
            Write-Host "MetaEditor exit code:"
            Write-Host $exitCode

            if ($exitCode -ne 0) {
              $buildFailed = $true
              Write-Error "MetaEditor failed while compiling $($file.Name)."
            }
          }

          if ($buildFailed) {
            throw "One or more MQL5 files failed to compile."
          }

      # ---------------------------------------------------------
      # 7. LOCATE GENERATED EX5 FILES
      # ---------------------------------------------------------
      - name: Locate generated EX5 files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========================================"
          Write-Host "LOCATING GENERATED EX5 FILES"
          Write-Host "========================================"

          $ex5Files = @(
            Get-ChildItem `
              -Path $env:SOURCE_ROOT `
              -Filter '*.ex5' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue
          )

          if ($ex5Files.Count -eq 0) {
            throw "Compilation completed but no EX5 files were found."
          }

          Write-Host ""
          Write-Host "EX5 files found:"

          foreach ($file in $ex5Files) {
            Write-Host " - $($file.FullName)"
          }

      # ---------------------------------------------------------
      # 8. PREPARE BUILD ARTIFACTS
      # ---------------------------------------------------------
      - name: Prepare King's Bot package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $artifactRoot = Join-Path `
            $env:RUNNER_TEMP `
            'KingsBot-package'

          New-Item `
            -ItemType Directory `
            -Path $artifactRoot `
            -Force |
            Out-Null

          $ex5Files = @(
            Get-ChildItem `
              -Path $env:SOURCE_ROOT `
              -Filter '*.ex5' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue
          )

          if ($ex5Files.Count -eq 0) {
            throw "No EX5 files are available for packaging."
          }

          foreach ($file in $ex5Files) {

            Copy-Item `
              -LiteralPath $file.FullName `
              -Destination $artifactRoot `
              -Force

            Write-Host "Packaged: $($file.Name)"
          }

          "ARTIFACT_ROOT=$artifactRoot" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append

      # ---------------------------------------------------------
      # 9. UPLOAD KING'S BOT PACKAGE
      # ---------------------------------------------------------
      - name: Upload King's Bot package
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-MT5-Package
          path: ${{ env.ARTIFACT_ROOT }}
          if-no-files-found: error
          retention-days: 14
