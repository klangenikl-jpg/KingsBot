name: Build King's Bot

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build King's Bot
    runs-on: windows-latest

    env:
      BOT_NAME: KingsBot
      BOT_SOURCE_NAME: KingsBot_Phase6_Integration.mq5

    steps:

      - name: Checkout King's Bot
        uses: actions/checkout@v4

      - name: Locate MetaEditor
        shell: pwsh
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "LOCATING METATRADER 5 / METAEDITOR"
          Write-Host "========================================="

          $metaEditor = $null

          $roots = @(
            "$env:APPDATA\MetaQuotes\Terminal",
            "$env:LOCALAPPDATA\MetaQuotes\Terminal",
            "C:\Program Files\MetaTrader 5",
            "C:\Program Files (x86)\MetaTrader 5"
          )

          foreach ($root in $roots) {
            if (-not (Test-Path $root)) {
              continue
            }

            Write-Host "Searching: $root"

            $found = Get-ChildItem `
              -Path $root `
              -Filter "metaeditor64.exe" `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if ($found) {
              $metaEditor = $found.FullName
              break
            }
          }

          if (-not $metaEditor) {
            Write-Host "MetaEditor not found."
            Write-Host "Downloading official MetaTrader 5 installer."

            $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"

            Invoke-WebRequest `
              -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" `
              -OutFile $installer

            if (-not (Test-Path $installer)) {
              throw "MetaTrader 5 installer download failed."
            }

            Start-Process `
              -FilePath $installer `
              -ArgumentList "/auto" `
              -Wait `
              -PassThru | Out-Null

            Start-Sleep -Seconds 10

            $roots = @(
              "$env:APPDATA\MetaQuotes\Terminal",
              "$env:LOCALAPPDATA\MetaQuotes\Terminal",
              "C:\Program Files\MetaTrader 5",
              "C:\Program Files (x86)\MetaTrader 5"
            )

            foreach ($root in $roots) {
              if (-not (Test-Path $root)) {
                continue
              }

              Write-Host "Searching after installation: $root"

              $found = Get-ChildItem `
                -Path $root `
                -Filter "metaeditor64.exe" `
                -File `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

              if ($found) {
                $metaEditor = $found.FullName
                break
              }
            }
          }

          if (-not $metaEditor) {
            throw "MetaEditor64.exe could not be located."
          }

          $terminalRoot = Split-Path $metaEditor -Parent

          Write-Host ""
          Write-Host "MetaEditor found:"
          Write-Host $metaEditor
          Write-Host ""
          Write-Host "Terminal root:"
          Write-Host $terminalRoot

          "METAEDITOR_PATH=$metaEditor" >> $env:GITHUB_ENV
          "MT5_TERMINAL_ROOT=$terminalRoot" >> $env:GITHUB_ENV

      - name: Prepare King's Bot source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "PREPARING KING'S BOT SOURCE"
          Write-Host "========================================="

          $workspace = $env:GITHUB_WORKSPACE
          $terminalRoot = $env:MT5_TERMINAL_ROOT

          $mql5Root = Join-Path $terminalRoot "MQL5"
          $expertRoot = Join-Path $mql5Root "Experts\KingsBot"

          New-Item `
            -ItemType Directory `
            -Path $expertRoot `
            -Force | Out-Null

          $source = Get-ChildItem `
            -Path $workspace `
            -Filter $env:BOT_SOURCE_NAME `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $source) {
            throw "Source file '$env:BOT_SOURCE_NAME' was not found."
          }

          Write-Host "Source:"
          Write-Host $source.FullName

          Copy-Item `
            -Path $source.FullName `
            -Destination (Join-Path $expertRoot $env:BOT_SOURCE_NAME) `
            -Force

          $sourceDirectory = Split-Path $source.FullName -Parent

          $includeFiles = Get-ChildItem `
            -Path $sourceDirectory `
            -Filter "*.mqh" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue

          foreach ($file in $includeFiles) {
            Copy-Item `
              -Path $file.FullName `
              -Destination (Join-Path $expertRoot $file.Name) `
              -Force
          }

          Write-Host ""
          Write-Host "King's Bot files:"
          Get-ChildItem `
            -Path $expertRoot `
            -File |
            ForEach-Object {
              Write-Host " - $($_.Name)"
            }

          "KING_EXPERT_ROOT=$expertRoot" >> $env:GITHUB_ENV
          "KING_SOURCE_PATH=$(Join-Path $expertRoot $env:BOT_SOURCE_NAME)" >> $env:GITHUB_ENV

      - name: Validate MQL5 source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "VALIDATING MQL5 SOURCE"
          Write-Host "========================================="

          $root = $env:KING_EXPERT_ROOT

          $files = Get-ChildItem `
            -Path $root `
            -File `
            -Recurse |
            Where-Object {
              $_.Extension -eq ".mq5" -or $_.Extension -eq ".mqh"
            }

          if (-not $files) {
            throw "No MQL5 source files were found."
          }

          foreach ($file in $files) {
            Write-Host "Checking $($file.Name)"

            $content = Get-Content `
              -Path $file.FullName `
              -Raw `
              -Encoding UTF8

            if ([string]::IsNullOrWhiteSpace($content)) {
              throw "Empty MQL5 source file: $($file.FullName)"
            }
          }

          Write-Host ""
          Write-Host "MQL5 source validation completed."

      - name: Compile King's Bot
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "COMPILING KING'S BOT"
          Write-Host "========================================="

          if (-not (Test-Path $env:METAEDITOR_PATH)) {
            throw "MetaEditor was not found at $env:METAEDITOR_PATH"
          }

          if (-not (Test-Path $env:KING_SOURCE_PATH)) {
            throw "King's Bot source was not found at $env:KING_SOURCE_PATH"
          }

          $compileLog = Join-Path `
            $env:RUNNER_TEMP `
            "KingsBot_compile.log"

          Write-Host "MetaEditor:"
          Write-Host $env:METAEDITOR_PATH

          Write-Host ""
          Write-Host "Source:"
          Write-Host $env:KING_SOURCE_PATH

          Write-Host ""
          Write-Host "Compile log:"
          Write-Host $compileLog

          $arguments = @(
            "/compile:$($env:KING_SOURCE_PATH)"
            "/log:$compileLog"
          )

          $process = Start-Process `
            -FilePath $env:METAEDITOR_PATH `
            -ArgumentList $arguments `
            -Wait `
            -PassThru `
            -NoNewWindow

          Write-Host ""
          Write-Host "MetaEditor exit code: $($process.ExitCode)"

          if (Test-Path $compileLog) {
            Write-Host ""
            Write-Host "========== COMPILE LOG =========="
            Get-Content $compileLog
            Write-Host "================================="
          }
          else {
            Write-Host "MetaEditor did not create a compile log."
          }

          if ($process.ExitCode -ne 0) {
            throw "MetaEditor compilation failed with exit code $($process.ExitCode)."
          }

      - name: Verify King's Bot EX5
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "VERIFYING KING'S BOT EX5"
          Write-Host "========================================="

          $searchRoots = @(
            $env:KING_EXPERT_ROOT,
            (Split-Path $env:KING_EXPERT_ROOT -Parent),
            $env:MT5_TERMINAL_ROOT
          )

          $ex5 = $null

          foreach ($root in $searchRoots) {
            if (-not (Test-Path $root)) {
              continue
            }

            Write-Host "Searching: $root"

            $found = Get-ChildItem `
              -Path $root `
              -Filter "*.ex5" `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Name -like "*KingsBot*"
              } |
              Select-Object -First 1

            if ($found) {
              $ex5 = $found.FullName
              break
            }
          }

          if (-not $ex5) {
            Write-Host ""
            Write-Host "Available EX5 files:"

            foreach ($root in $searchRoots) {
              if (Test-Path $root) {
                Get-ChildItem `
                  -Path $root `
                  -Filter "*.ex5" `
                  -File `
                  -Recurse `
                  -ErrorAction SilentlyContinue |
                  ForEach-Object {
                    Write-Host $_.FullName
                  }
              }
            }

            throw "King's Bot EX5 was not created."
          }

          Write-Host ""
          Write-Host "EX5 FOUND:"
          Write-Host $ex5

          "KING_EX5_PATH=$ex5" >> $env:GITHUB_ENV

      - name: Prepare build artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "PREPARING BUILD ARTIFACTS"
          Write-Host "========================================="

          $artifactRoot = Join-Path `
            $env:GITHUB_WORKSPACE `
            "build\KingsBot"

          New-Item `
            -ItemType Directory `
            -Path $artifactRoot `
            -Force | Out-Null

          Copy-Item `
            -Path $env:KING_EX5_PATH `
            -Destination (Join-Path $artifactRoot "KingsBot.ex5") `
            -Force

          if (-not (Test-Path (Join-Path $artifactRoot "KingsBot.ex5"))) {
            throw "Artifact copy failed."
          }

          Write-Host "Artifact created:"
          Write-Host (Join-Path $artifactRoot "KingsBot.ex5")

      - name: Upload King's Bot build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-build
          path: build/KingsBot/
          if-no-files-found: error

      - name: Build summary
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "========================================="
          Write-Host "KING'S BOT BUILD SUCCESSFUL"
          Write-Host "========================================="
          Write-Host ""
          Write-Host "EX5:"
          Write-Host $env:KING_EX5_PATH
          Write-Host ""
          Write-Host "Artifact:"
          Write-Host "KingsBot-build"
          Write-Host ""
          Write-Host "========================================="
