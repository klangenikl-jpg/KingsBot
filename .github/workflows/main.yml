name: King's Bot - Phase 6 Build

on:
  workflow_dispatch:
  push:
    paths:
      - "**/*.mq5"
      - "**/*.mqh"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  build:
    name: Build King's Bot
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout King's Bot
        uses: actions/checkout@v4

      - name: Inspect repository
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $sources = @(
            Get-ChildItem `
              -Path $env:GITHUB_WORKSPACE `
              -Recurse `
              -File `
              -Include *.mq5,*.mqh `
              -ErrorAction SilentlyContinue
          )

          if ($sources.Count -eq 0) {
            throw "No MQL5 source files were found."
          }

          Write-Host "Found $($sources.Count) MQL5 source files."

          foreach ($source in $sources) {
            Write-Host $source.FullName
          }

      - name: Prepare clean MT5 environment
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $mt5Root = Join-Path $env:RUNNER_TEMP 'KingsBot-MT5'
          $mql5Root = Join-Path $mt5Root 'MQL5'
          $sourceRoot = Join-Path $mql5Root 'Experts\KingsBot'
          $artifactRoot = Join-Path $env:RUNNER_TEMP 'KingsBot-artifacts'

          foreach ($path in @(
            $mt5Root,
            $mql5Root,
            $sourceRoot,
            $artifactRoot
          )) {
            if (Test-Path $path) {
              Remove-Item $path -Recurse -Force
            }

            New-Item -ItemType Directory -Path $path -Force | Out-Null
          }

          "MT5_ROOT=$mt5Root" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "MQL5_ROOT=$mql5Root" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "SOURCE_ROOT=$sourceRoot" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "ARTIFACT_ROOT=$artifactRoot" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Download official MetaTrader 5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          $url = 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe'

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer `
            -UseBasicParsing

          if (!(Test-Path $installer)) {
            throw "MetaTrader 5 installer was not downloaded."
          }

          $size = (Get-Item $installer).Length

          if ($size -lt 100000) {
            throw "Downloaded installer is unexpectedly small: $size bytes."
          }

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList @(
              '/auto',
              "/path:`"$env:MT5_ROOT`""
            ) `
            -WorkingDirectory $env:RUNNER_TEMP `
            -Wait `
            -PassThru

          Write-Host "Installer exit code: $($process.ExitCode)"

          if (!(Test-Path "$env:MT5_ROOT\MetaEditor64.exe")) {
            throw "MetaEditor64.exe was not installed."
          }

      - name: Locate MetaEditor
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $editorCandidates = @(
            "$env:MT5_ROOT\MetaEditor64.exe",
            'C:\Program Files\MetaTrader 5\MetaEditor64.exe',
            'C:\Program Files (x86)\MetaTrader 5\MetaEditor64.exe',
            "$env:LOCALAPPDATA\Programs\MetaTrader 5\MetaEditor64.exe"
          )

          $editor = $editorCandidates |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (!$editor) {
            $editor = Get-ChildItem `
              -Path 'C:\Program Files',
                    'C:\Program Files (x86)',
                    $env:LOCALAPPDATA `
              -Recurse `
              -Filter MetaEditor64.exe `
              -File `
              -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName -First 1
          }

          if (!$editor) {
            throw "MetaEditor64.exe was not found."
          }

          Write-Host "MetaEditor: $editor"

          "METAEDITOR=$editor" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Stage and normalize MQL5 source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $sources = @(
            Get-ChildItem `
              -Path $env:GITHUB_WORKSPACE `
              -Recurse `
              -File `
              -Include *.mq5,*.mqh `
              -ErrorAction SilentlyContinue
          )

          foreach ($file in $sources) {
            $relative = $file.FullName.Substring(
              $env:GITHUB_WORKSPACE.Length
            ).TrimStart('\')

            $destination = Join-Path `
              $env:SOURCE_ROOT `
              $relative

            $destinationDir = Split-Path `
              $destination `
              -Parent

            New-Item `
              -ItemType Directory `
              -Path $destinationDir `
              -Force | Out-Null

            Copy-Item `
              -Path $file.FullName `
              -Destination $destination `
              -Force
          }

          $headers = @(
            Get-ChildItem `
              -Path $env:SOURCE_ROOT `
              -Recurse `
              -Filter *.mqh `
              -File
          )

          foreach ($file in $headers) {
            $lines = Get-Content -Path $file.FullName

            if ($lines.Count -eq 0) {
              continue
            }

            $first = $lines[0].Trim()

            if ($first -eq '#pragma once' -or $first -eq 'once') {
              $base = [System.IO.Path]::GetFileNameWithoutExtension(
                $file.Name
              )

              $guard = (
                $base.ToUpperInvariant() -replace '[^A-Z0-9]', '_'
              ) + '_MQH'

              $body = $lines | Select-Object -Skip 1

              $newLines = @(
                "#ifndef $guard"
                "#define $guard"
                ""
              )

              $newLines += $body

              $newLines += @(
                ""
                "#endif"
              )

              Set-Content `
                -Path $file.FullName `
                -Value $newLines `
                -Encoding utf8

              Write-Host "Normalized: $($file.Name)"
            }
          }

          $main = Get-ChildItem `
            -Path $env:SOURCE_ROOT `
            -Recurse `
            -Filter 'KingsBot_Phase6_Integration.mq5' `
            -File `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (!$main) {
            throw "KingsBot_Phase6_Integration.mq5 was not found."
          }

          "MAIN_SOURCE=$($main.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Main source: $($main.FullName)"

      - name: Verify normalized headers
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $headers = @(
            Get-ChildItem `
              -Path $env:SOURCE_ROOT `
              -Recurse `
              -Filter *.mqh `
              -File
          )

          foreach ($file in $headers) {
            $firstLines = Get-Content `
              -Path $file.FullName `
              -TotalCount 5

            Write-Host "Checking: $($file.Name)"

            if (
              $firstLines -contains 'once' -or
              $firstLines -contains '#pragma once'
            ) {
              throw "Unnormalized header detected: $($file.FullName)"
            }
          }

          Write-Host "All MQL5 headers passed normalization check."

      - name: Compile King's Bot
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $source = $env:MAIN_SOURCE

          $ex5 = [System.IO.Path]::ChangeExtension(
            $source,
            '.ex5'
          )

          $compileLog = Join-Path `
            $env:ARTIFACT_ROOT `
            'KingsBot-Compile.log'

          if (Test-Path $ex5) {
            Remove-Item $ex5 -Force
          }

          if (Test-Path $compileLog) {
            Remove-Item $compileLog -Force
          }

          $arguments = @(
            '/portable',
            "/compile:`"$source`"",
            "/inc:`"$env:MQL5_ROOT`"",
            "/log:`"$compileLog`""
          )

          Write-Host "Compiling:"
          Write-Host $source

          $process = Start-Process `
            -FilePath $env:METAEDITOR `
            -ArgumentList $arguments `
            -WorkingDirectory $env:MT5_ROOT `
            -Wait `
            -PassThru

          Write-Host "MetaEditor exit code: $($process.ExitCode)"

          Start-Sleep -Seconds 2

          if (Test-Path $compileLog) {
            Write-Host "===== COMPILER LOG ====="
            Get-Content $compileLog
          }

          if (!(Test-Path $ex5)) {
            throw "KingsBot compilation failed. No EX5 file was created."
          }

          $size = (Get-Item $ex5).Length

          if ($size -le 0) {
            throw "EX5 file was created but is empty."
          }

          Write-Host "SUCCESS: EX5 created ($size bytes)."

          Copy-Item `
            -Path $ex5 `
            -Destination $env:ARTIFACT_ROOT `
            -Force

          if (Test-Path $compileLog) {
            Copy-Item `
              -Path $compileLog `
              -Destination $env:ARTIFACT_ROOT `
              -Force
          }

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-Phase6-build
          path: ${{ runner.temp }}/KingsBot-artifacts/*
          if-no-files-found: warn
          retention-days: 14
