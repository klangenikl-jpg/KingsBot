name: Build King's Bot

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build King's Bot
    runs-on: windows-latest

    steps:
      - name: Checkout King's Bot
        uses: actions/checkout@v4

      - name: Locate MetaEditor and MT5 MQL5 library
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $metaEditor = @(
            "C:\Program Files\MetaTrader 5\MetaEditor64.exe",
            "C:\Program Files (x86)\MetaTrader 5\MetaEditor64.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $metaEditor) {
            $metaEditor = Get-ChildItem `
              -Path "C:\Program Files","C:\Program Files (x86)" `
              -Filter "MetaEditor64.exe" -File -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }

          if (-not $metaEditor) {
            throw "MetaEditor64.exe was not found."
          }

          Write-Host "MetaEditor found: $metaEditor"

          $mt5InstallDir = Split-Path $metaEditor -Parent
          $tradeFile = $null

          $directTrade = Join-Path $mt5InstallDir "MQL5\Include\Trade\Trade.mqh"

          if (Test-Path $directTrade) {
            $tradeFile = (Resolve-Path $directTrade).Path
          }

          if (-not $tradeFile) {
            $tradeFile = Get-ChildItem `
              -Path "C:\Users\runneradmin\AppData\Roaming\MetaQuotes\Terminal" `
              -Filter "Trade.mqh" -File -Recurse `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.FullName -match "\\MQL5\\Include\\Trade\\Trade\.mqh$"
              } |
              Select-Object -First 1 -ExpandProperty FullName
          }

          if (-not $tradeFile) {
            throw "Standard MQL5 Trade.mqh was not found."
          }

          $mql5Dir = Split-Path `
            (Split-Path `
              (Split-Path $tradeFile -Parent) -Parent) -Parent

          Write-Host "Trade.mqh found: $tradeFile"
          Write-Host "MQL5 directory: $mql5Dir"

          "METAEDITOR=$metaEditor" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "MT5_MQL5_DIR=$mql5Dir" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Prepare King's Bot source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $mql5Root = Join-Path $env:GITHUB_WORKSPACE "MQL5"
          $expertRoot = Join-Path $mql5Root "Experts\KingsBot"

          if (-not (Test-Path $expertRoot)) {
            throw "King's Bot source directory not found: $expertRoot"
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path (Join-Path $mql5Root "Include") |
            Out-Null

          Copy-Item `
            -Path (Join-Path $env:MT5_MQL5_DIR "Include\*") `
            -Destination (Join-Path $mql5Root "Include") `
            -Recurse `
            -Force

          $tradePath = Join-Path `
            $mql5Root "Include\Trade\Trade.mqh"

          if (-not (Test-Path $tradePath)) {
            throw "Build-tree Trade.mqh was not created: $tradePath"
          }

          Write-Host "Standard MQL5 library copied to build tree."

      - name: Normalize MQL5 headers
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $expertRoot = Join-Path `
            $env:GITHUB_WORKSPACE "MQL5\Experts\KingsBot"

          $headers = Get-ChildItem `
            $expertRoot `
            -Filter "*.mqh" `
            -File `
            -Recurse

          if (-not $headers) {
            throw "No .mqh files found under $expertRoot"
          }

          foreach ($file in $headers) {
            $text = Get-Content $file.FullName -Raw

            $text = [regex]::Replace(
              $text,
              '(?m)^\s*#\s*once\s*$',
              '#pragma once'
            )

            $text = [regex]::Replace(
              $text,
              '(?m)^\s*once\s*$',
              '#pragma once'
            )

            Set-Content `
              $file.FullName `
              $text `
              -Encoding utf8NoBOM
          }

          Write-Host "MQL5 header normalization complete."

      - name: Verify standard MQL5 library
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $tradePath = Join-Path `
            $env:GITHUB_WORKSPACE "MQL5\Include\Trade\Trade.mqh"

          if (-not (Test-Path $tradePath)) {
            throw "Standard MQL5 Trade.mqh is missing from the build tree."
          }

          Write-Host "Verified: $tradePath"

      - name: Compile King's Bot
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $expertRoot = Join-Path `
            $env:GITHUB_WORKSPACE "MQL5\Experts\KingsBot"

          $source = Join-Path `
            $expertRoot "KingsBot_Phase6_Integration.mq5"

          $artifactRoot = Join-Path `
            $env:GITHUB_WORKSPACE "build-artifacts"

          $logPath = Join-Path `
            $expertRoot "KingsBot_Phase6_Integration.log"

          if (-not (Test-Path $source)) {
            throw "Main source was not found: $source"
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $artifactRoot |
            Out-Null

          Write-Host "========================================="
          Write-Host "COMPILING KING'S BOT"
          Write-Host "========================================="

          & $env:METAEDITOR `
            "/compile:$source" `
            "/inc:$($env:GITHUB_WORKSPACE)\MQL5" `
            "/log"

          $exitCode = $LASTEXITCODE

          Write-Host "MetaEditor exit code: $exitCode"

          if (Test-Path $logPath) {
            Get-Content $logPath
          }

          $ex
