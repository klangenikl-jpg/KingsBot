name: King's Bot - Phase 6 Final Validation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase6-validation:
    name: Phase 6 Final Build and MT5 Validation
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout King's Bot
        uses: actions/checkout@v5

      - name: Locate Phase 6 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Recurse `
            -File `
            -Filter 'KingsBot_Phase6_Integration.mq5' |
            Select-Object -First 1

          if (-not $source) {
            throw "KingsBot_Phase6_Integration.mq5 was not found."
          }

          "KB_SOURCE=$($source.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "KB_SOURCE_ROOT=$($source.Directory.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "SOURCE:"
          Write-Host $source.FullName

      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          $mt5Root = 'C:\MT5'

          Invoke-WebRequest `
            -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' `
            -OutFile $installer

          if (-not (Test-Path $installer)) {
            throw "MetaTrader 5 installer was not downloaded."
          }

          if (Test-Path $mt5Root) {
            Remove-Item $mt5Root -Recurse -Force
          }

          New-Item -ItemType Directory -Path $mt5Root -Force | Out-Null

          # MetaQuotes documents /auto for unattended installation.
          # Do not pass /path to the web installer.
          $install = Start-Process `
            -FilePath $installer `
            -ArgumentList '/auto' `
            -Wait `
            -PassThru

          Write-Host "MetaTrader 5 installer exit code: $($install.ExitCode)"

          if ($install.ExitCode -ne 0) {
            throw "MetaTrader 5 installation failed. Exit code: $($install.ExitCode)"
          }

      - name: Locate and stage MetaEditor and Terminal
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $searchRoots = @(
            'C:\Program Files',
            'C:\Program Files (x86)',
            $env:LOCALAPPDATA
          )

          $terminal = $null
          $editor = $null

          foreach ($root in $searchRoots) {
            if (-not (Test-Path $root)) {
              continue
            }

            if (-not $terminal) {
              $terminal = Get-ChildItem `
                -Path $root `
                -Recurse `
                -File `
                -Filter 'terminal64.exe' `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1
            }

            if (-not $editor) {
              $editor = Get-ChildItem `
                -Path $root `
                -Recurse `
                -File `
                -Filter 'metaeditor64.exe' `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1
            }

            if ($terminal -and $editor) {
              break
            }
          }

          if (-not $terminal) {
            throw "MetaTrader 5 terminal64.exe was not found after installation."
          }

          if (-not $editor) {
            throw "MetaEditor64.exe was not found after installation."
          }

          $installedRoot = $terminal.Directory.FullName

          Write-Host "Installed MT5 root: $installedRoot"
          Write-Host "MetaEditor: $($editor.FullName)"
          Write-Host "Terminal:   $($terminal.FullName)"

          # Stage the installed terminal in a writable portable directory.
          Copy-Item `
            -Path (Join-Path $installedRoot '*') `
            -Destination 'C:\MT5' `
            -Recurse `
            -Force

          $stagedEditor = Get-ChildItem `
            -Path 'C:\MT5' `
            -Recurse `
            -File `
            -Filter 'metaeditor64.exe' |
            Select-Object -First 1

          $stagedTerminal = Get-ChildItem `
            -Path 'C:\MT5' `
            -Recurse `
            -File `
            -Filter 'terminal64.exe' |
            Select-Object -First 1

          if (-not $stagedEditor) {
            throw "Staged MetaEditor64.exe was not found."
          }

          if (-not $stagedTerminal) {
            throw "Staged terminal64.exe was not found."
          }

          "METAEDITOR=$($stagedEditor.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "MT5_TERMINAL=$($stagedTerminal.FullName)" | Out-File $env:GITHUB_ENV -Append -
