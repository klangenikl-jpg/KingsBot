name: Build King's Bot

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build King's Bot
    runs-on: windows-latest
    timeout-minutes: 20

    env:
      BOT_SOURCE_NAME: KingsBot_Phase6_Integration.mq5

    steps:
      - name: Checkout King's Bot
        uses: actions/checkout@v4

      - name: Locate MetaEditor
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "LOCATING METATRADER 5 / METAEDITOR"
          Write-Host "========================================="

          $searchRoots = @(
            "C:\Program Files",
            "C:\Program Files (x86)",
            "C:\MT5",
            "$env:LOCALAPPDATA"
          )

          $metaEditor = $null

          foreach ($root in $searchRoots) {
            if (Test-Path $root) {
              Write-Host "Searching: $root"

              $found = Get-ChildItem `
                -Path $root `
                -Filter "metaeditor64.exe" `
                -File `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

              if ($found) {
                $metaEditor = $found.FullName
                break
              }
            }
          }

          if (-not $metaEditor) {
            Write-Host "MetaEditor was not found."
            Write-Host "Downloading MetaTrader 5 installer..."

            $installer = Join-Path `
              $env:RUNNER_TEMP `
              "mt5setup.exe"

            Invoke-WebRequest `
              -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" `
              -OutFile $installer `
              -UseBasicParsing

            if (-not (Test-Path $installer)) {
              throw "MetaTrader 5 installer was not downloaded."
            }

            Write-Host "Starting MetaTrader 5 installer..."

            Start-Process `
              -FilePath $installer `
              -ArgumentList "/auto" `
              -Wait

            Start-Sleep -Seconds 5

            foreach ($root in $searchRoots) {
              if (Test-Path $root) {
                $found = Get-ChildItem `
                  -Path $root `
                  -Filter "metaeditor64.exe" `
                  -File `
                  -Recurse `
                  -ErrorAction SilentlyContinue |
                  Select-Object -First 1

                if ($found) {
                  $metaEditor = $found.FullName
                  break
                }
              }
            }
          }

          if (-not $metaEditor) {
            throw "MetaEditor64.exe could not be located."
          }

          Write-Host ""
          Write-Host "MetaEditor found:"
          Write-Host $metaEditor

          "METAEDITOR_PATH=$metaEditor" >> $env:GITHUB_ENV

      - name: Prepare King's Bot source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "PREPARING KING'S BOT SOURCE"
          Write-Host "========================================="

          $workspace = $env:GITHUB_WORKSPACE

          $source = Get-ChildItem `
            -Path $workspace `
            -Filter $env:BOT_SOURCE_NAME `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $source) {
            Write-Host ""
            Write-Host "Available MQ5 files:"

            Get-ChildItem `
              -Path $workspace `
              -Filter "*.mq5" `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              ForEach-Object {
                Write-Host $_.FullName
              }

            throw "King's Bot source '$env:BOT_SOURCE_NAME' was not found."
          }

          Write-Host "Main source found:"
          Write-Host $source.FullName

          $buildRoot = Join-Path `
            $env:RUNNER_TEMP `
            "KingsBotBuild"

          $expertRoot = Join-Path `
            $buildRoot `
            "MQL5\Experts\KingsBot"

          New-Item `
            -ItemType Directory `
            -Path $expertRoot `
            -Force |
            Out-Null

          Copy-Item `
            -Path $source.FullName `
            -Destination (Join-Path $expertRoot $source.Name) `
            -Force

          $sourceDirectory = Split-Path `
            $source.FullName `
            -Parent

          $dependencies = Get-ChildItem `
            -Path $sourceDirectory `
            -Filter "*.mqh" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue

          foreach ($file in $dependencies) {
            Copy-Item `
              -Path $file.FullName `
              -Destination (Join-Path $expertRoot $file.Name) `
              -Force
          }

          Write-Host ""
          Write-Host "Prepared source files:"

          Get-ChildItem `
            -Path $expertRoot `
            -File |
            ForEach-Object {
              Write-Host " - $($_.Name)"
            }

          "KING_BUILD_ROOT=$buildRoot" >> $env:GITHUB_ENV
          "KING_EXPERT_ROOT=$expert
