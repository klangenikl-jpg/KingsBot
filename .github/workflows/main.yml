name: Build King's Bot

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build King's Bot
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      MT5_ROOT: C:\MT5

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout King's Bot
        uses: actions/checkout@v4

      # ============================================================
      # 2. INSTALL METATRADER 5
      # ============================================================
      - name: Install and locate MetaTrader 5
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "INSTALLING METATRADER 5"
          Write-Host "========================================="

          $mt5Root = $env:MT5_ROOT
          $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"

          New-Item `
            -ItemType Directory `
            -Path $mt5Root `
            -Force |
            Out-Null

          Write-Host "Downloading official MetaTrader 5 installer..."

          Invoke-WebRequest `
            -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" `
            -OutFile $installer `
            -UseBasicParsing

          if (-not (Test-Path $installer)) {
            throw "MetaTrader 5 installer was not downloaded."
          }

          Write-Host "Installer downloaded:"
          Write-Host $installer

          Write-Host "Installer size:"
          Write-Host ((Get-Item $installer).Length)

          Write-Host "Installing MetaTrader 5 automatically..."

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList @(
              "/auto",
              "/path:$mt5Root"
            ) `
            -Wait `
            -PassThru `
            -NoNewWindow

          Write-Host "Installer exit code: $($process.ExitCode)"

          Start-Sleep -Seconds 5

          Write-Host "Searching for MetaEditor64.exe..."

          $metaEditor = Get-ChildItem `
            -Path $mt5Root, "C:\Program Files", "C:\Program Files (x86)" `
            -Filter "metaeditor64.exe" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $metaEditor) {
            Write-Host "MetaEditor64.exe was not found."
            Write-Host "Searching entire C: drive as a fallback..."

            $metaEditor = Get-ChildItem `
              -Path "C:\" `
              -Filter "metaeditor64.exe" `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }

          if (-not $metaEditor) {
            throw "MetaEditor64.exe could not be located after MetaTrader 5 installation."
          }

          $metaEditorPath = $metaEditor.FullName
          $terminalRoot = Split-Path $metaEditorPath -Parent

          Write-Host "========================================="
          Write-Host "METATRADER 5 FOUND"
          Write-Host "MetaEditor:"
          Write-Host $metaEditorPath
          Write-Host "Terminal root:"
          Write-Host $terminalRoot
          Write-Host "========================================="

          "METAEDITOR_PATH=$metaEditorPath" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8

          "MT5_ACTUAL_ROOT=$terminalRoot" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8

      # ============================================================
      # 3. PREPARE KING'S BOT SOURCE
      # ============================================================
      - name: Prepare King's Bot source
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "PREPARING KING'S BOT SOURCE"
          Write-Host "========================================="

          $workspace = $env:GITHUB_WORKSPACE
          $expertRoot = Join-Path $env:MT5_ACTUAL_ROOT "MQL5\Experts\KingsBot"

          New-Item `
            -ItemType Directory `
            -Path $expertRoot `
            -Force |
            Out-Null

          Write-Host "Target:"
          Write-Host $expertRoot

          $sourceFiles = Get-ChildItem `
            -Path $workspace `
            -Include "*.mq5","*.mqh" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue

          if (-not $sourceFiles) {
            throw "No MQL5 source files were found in the repository."
          }

          foreach ($file in $sourceFiles) {

            $relative = $file.FullName.Substring(
              $workspace.Length
            ).TrimStart('\','/')

            Write-Host "Copying:"
            Write-Host $relative

            $destination = Join-Path $expertRoot $file.Name

            Copy-Item `
              -LiteralPath $file.FullName `
              -Destination $destination `
              -Force
          }

          $mainSource = Join-Path `
            $expertRoot `
            "KingsBot_Phase6_Integration.mq5"

          if (-not (Test-Path $mainSource)) {
            throw "KingsBot_Phase6_Integration.mq5 was not found after source preparation."
          }

          Write-Host "========================================="
          Write-Host "SOURCE PREPARATION COMPLETE"
          Write-Host "Main source:"
          Write-Host $mainSource
          Write-Host "========================================="

          "KINGSBOT_SOURCE=$mainSource" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8

      # ============================================================
      # 4. COMPILE KING'S BOT
      # ============================================================
      - name: Compile King's Bot
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "COMPILING KING'S BOT"
          Write-Host "========================================="

          if (-not (Test-Path $env:METAEDITOR_PATH)) {
            throw "MetaEditor executable not found at: $env:METAEDITOR_PATH"
          }

          if (-not (Test-Path $env:KINGSBOT_SOURCE)) {
            throw "King's Bot source not found at: $env:KINGSBOT_SOURCE"
          }

          Write-Host "MetaEditor:"
          Write-Host $env:METAEDITOR_PATH

          Write-Host "Source:"
          Write-Host $env:KINGSBOT_SOURCE

          $logFile = Join-Path `
            $env:RUNNER_TEMP `
            "KingsBot_compile.log"

          Write-Host "Running MetaEditor compiler..."

          $process = Start-Process `
            -FilePath $env:METAEDITOR_PATH `
            -ArgumentList @(
              "/compile:$env:KINGSBOT_SOURCE",
              "/log:$logFile"
            ) `
            -Wait `
            -PassThru `
            -NoNewWindow

          Write-Host "MetaEditor exit code: $($process.ExitCode)"

          Write-Host "========================================="
          Write-Host "COMPILATION LOG"
          Write-Host "========================================="

          if (Test-Path $logFile) {
            Get-Content $logFile
          }
          else {
            Write-Host "No compiler log was generated."
          }

          if ($process.ExitCode -ne 0) {
            throw "MetaEditor returned exit code $($process.ExitCode)."
          }

      # ============================================================
      # 5. VERIFY EX5
      # ============================================================
      - name: Verify King's Bot EX5 artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "VERIFYING KING'S BOT EX5"
          Write-Host "========================================="

          $expertRoot = Join-Path `
            $env:MT5_ACTUAL_ROOT `
            "MQL5\Experts\KingsBot"

          $ex5 = Get-ChildItem `
            -Path $expertRoot `
            -Filter "*.ex5" `
            -File `
            -ErrorAction SilentlyContinue

          if (-not $ex5) {
            throw "No EX5 artifact was created."
          }

          foreach ($artifact in $ex5) {
            Write-Host "EX5 artifact:"
            Write-Host $artifact.FullName
            Write-Host "Size: $($artifact.Length) bytes"
          }

          Write-Host "========================================="
          Write-Host "EX5 VERIFICATION COMPLETE"
          Write-Host "========================================="

      # ============================================================
      # 6. UPLOAD BUILD ARTIFACTS
      # ============================================================
      - name: Upload King's Bot build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-build
          path: |
            C:\MT5\MQL5\Experts\KingsBot\*.ex5
            C:\MT5\MQL5\Experts\KingsBot\*.mq5
            C:\MT5\MQL5\Experts\KingsBot\*.mqh
          if-no-files-found: warn

      # ============================================================
      # 7. BUILD SUMMARY
      # ============================================================
      - name: Build summary
        if: always()
        shell: pwsh
        run: |
          Write-Host "========================================="
          Write-Host "KING'S BOT BUILD SUMMARY"
          Write-Host "========================================="
          Write-Host "MetaEditor: $env:METAEDITOR_PATH"
          Write-Host "MT5 Root:   $env:MT5_ACTUAL_ROOT"
          Write-Host "Source:     $env:KINGSBOT_SOURCE"
          Write-Host "========================================="
