name: Build King's Bot

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build King's Bot
    runs-on: windows-latest
    timeout-minutes: 25

    steps:

      # ============================================================
      # 1. SET UP
      # ============================================================
      - name: Set up job
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "KING'S BOT BUILD"
          Write-Host "========================================="
          Write-Host "Runner: $env:RUNNER_OS"
          Write-Host "Architecture: $env:PROCESSOR_ARCHITECTURE"
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"


      # ============================================================
      # 2. CHECKOUT
      # ============================================================
      - name: Checkout King's Bot
        uses: actions/checkout@v4


      # ============================================================
      # 3. INSTALL METATRADER 5
      # ============================================================
      - name: Install and locate MetaTrader 5
        shell: pwsh
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "INSTALLING METATRADER 5"
          Write-Host "========================================="

          $mt5Root = "C:\MT5"
          $installer = Join-Path $env:TEMP "mt5setup.exe"

          New-Item `
            -ItemType Directory `
            -Path $mt5Root `
            -Force |
            Out-Null

          Write-Host "Downloading official MetaTrader 5 installer..."

          Invoke-WebRequest `
            -Uri "https://download.terminal.free/cdn/web/metaquotes.ltd/mt5/mt5setup.exe" `
            -OutFile $installer `
            -UseBasicParsing

          if (-not (Test-Path -LiteralPath $installer)) {
            throw "MetaTrader 5 installer was not downloaded."
          }

          Write-Host "Installer downloaded."
          Write-Host "Installing MetaTrader 5 to $mt5Root ..."

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList "/auto", "/path:`"$mt5Root`"" `
            -Wait `
            -PassThru

          Write-Host "Installer exit code: $($process.ExitCode)"

          if ($process.ExitCode -ne 0) {
            throw "MetaTrader 5 installation failed."
          }

          Write-Host "Searching for MetaEditor64.exe..."

          $metaEditor = $null

          $knownPaths = @(
            "$mt5Root\metaeditor64.exe",
            "$mt5Root\MetaEditor64.exe",
            "$mt5Root\MetaEditor\metaeditor64.exe"
          )

          foreach ($path in $knownPaths) {
            if (Test-Path -LiteralPath $path) {
              $metaEditor = $path
              break
            }
          }

          if (-not $metaEditor) {
            $found = Get-ChildItem `
              -Path $mt5Root `
              -Filter "metaeditor64.exe" `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if ($found) {
              $metaEditor = $found.FullName
            }
          }

          if (-not $metaEditor) {
            throw "MetaEditor64.exe could not be located after MetaTrader 5 installation."
          }

          $mql5Root = Join-Path $mt5Root "MQL5"

          if (-not (Test-Path -LiteralPath $mql5Root)) {
            New-Item `
              -ItemType Directory `
              -Path $mql5Root `
              -Force |
              Out-Null
          }

          "METAEDITOR=$metaEditor" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append `
            -Encoding utf8

          "MT5_ROOT=$mt5Root" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append `
            -Encoding utf8

          Write-Host ""
          Write-Host "========================================="
          Write-Host "METATRADER 5 READY"
          Write-Host "========================================="
          Write-Host "MT5 root:   $mt5Root"
          Write-Host "MQL5 root:  $mql5Root"
          Write-Host "MetaEditor: $metaEditor"


      # ============================================================
      # 4. PREPARE KING'S BOT SOURCE
      # ============================================================
      - name: Prepare King's Bot source
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "PREPARING KING'S BOT SOURCE"
          Write-Host "========================================="

          $workspace = $env:GITHUB_WORKSPACE
          $expertRoot = Join-Path `
            $env:MT5_ROOT `
            "MQL5\Experts\KingsBot"

          New-Item `
            -ItemType Directory `
            -Path $expertRoot `
            -Force |
            Out-Null

          Write-Host "Workspace:   $workspace"
          Write-Host "Expert root: $expertRoot"

          $source = Get-ChildItem `
            -Path $workspace `
            -Filter "KingsBot_Phase6_Integration.mq5" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $source) {
            throw "KingsBot_Phase6_Integration.mq5 was not found."
          }

          Write-Host "Main source: $($source.FullName)"

          $sourceFiles = Get-ChildItem `
            -Path $workspace `
            -Recurse `
            -File |
            Where-Object {
              $_.Extension -in @(".mq5", ".mqh")
            }

          if (-not $sourceFiles) {
            throw "No MQL5 source files were found."
          }

          foreach ($file in $sourceFiles) {

            $relative = $file.FullName.Substring(
              $workspace.Length
            ).TrimStart('\','/')

            $destination = Join-Path `
              $expertRoot `
              $relative

            $destinationDirectory = Split-Path `
              -Parent `
              $destination

            New-Item `
              -ItemType Directory `
              -Path $destinationDirectory `
              -Force |
              Out-Null

            Copy-Item `
              -LiteralPath $file.FullName `
              -Destination $destination `
              -Force
          }

          Write-Host "Cleaning MQL5 source..."

          $copiedFiles = Get-ChildItem `
            -Path $expertRoot `
            -Recurse `
            -File |
            Where-Object {
              $_.Extension -in @(".mq5", ".mqh")
            }

          foreach ($file in $copiedFiles) {

            $text = Get-Content `
              -LiteralPath $file.FullName `
              -Raw `
              -Encoding UTF8

            # Remove UTF-8 BOM.
            $text = $text -replace "^\uFEFF", ""

            # MQL5 does not support #pragma once.
            $text = $text -replace `
              "(?m)^\s*#pragma\s+once\s*\r?\n?", ""

            [System.IO.File]::WriteAllText(
              $file.FullName,
              $text,
              [System.Text.UTF8Encoding]::new($false)
            )
          }

          $remainingPragma = Get-ChildItem `
            -Path $expertRoot `
            -Recurse `
            -File |
            Where-Object {
              $_.Extension -in @(".mq5", ".mqh")
            } |
            Select-String `
              -Pattern '^\s*#pragma\s+once' `
              -ErrorAction SilentlyContinue

          if ($remainingPragma) {
            throw "Unsupported #pragma once remains in the source."
          }

          $preparedSource = Join-Path `
            $expertRoot `
            "KingsBot_Phase6_Integration.mq5"

          if (-not (Test-Path -LiteralPath $preparedSource)) {
            throw "Prepared King's Bot source was not created."
          }

          Write-Host ""
          Write-Host "SOURCE PREPARATION COMPLETE"
          Write-Host "Source: $preparedSource"


      # ============================================================
      # 5. COMPILE KING'S BOT
      # ============================================================
      - name: Compile King's Bot
        shell: pwsh
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "COMPILING KING'S BOT"
          Write-Host "========================================="

          $source = Join-Path `
            $env:MT5_ROOT `
            "MQL5\Experts\KingsBot\KingsBot_Phase6_Integration.mq5"

          $ex5 = [System.IO.Path]::ChangeExtension(
            $source,
            ".ex5"
          )

          $log = [System.IO.Path]::ChangeExtension(
            $source,
            ".log"
          )

          if (-not (Test-Path -LiteralPath $source)) {
            throw "Source file not found: $source"
          }

          if (Test-Path -LiteralPath $ex5) {
            Remove-Item `
              -LiteralPath $ex5 `
              -Force
          }

          if (Test-Path -LiteralPath $log) {
            Remove-Item `
              -LiteralPath $log `
              -Force
          }

          Write-Host "MetaEditor: $env:METAEDITOR"
          Write-Host "Source:     $source"

          & $env:METAEDITOR `
            "/compile:$source" `
            "/log"

          $exitCode = $LASTEXITCODE

          Write-Host ""
          Write-Host "MetaEditor exit code: $exitCode"

          Write-Host ""
          Write-Host "========== COMPILATION LOG =========="

          if (Test-Path -LiteralPath $log) {
            Get-Content `
              -LiteralPath $log `
              -Raw |
              Write-Host
          }
          else {
            Write-Host "No compilation log was produced."
          }

          Write-Host "====================================="

          if (-not (Test-Path -LiteralPath $ex5)) {
            throw "King's Bot compilation failed: EX5 artifact was not created."
          }

          Write-Host ""
          Write-Host "EX5 ARTIFACT CREATED SUCCESSFULLY"
          Write-Host $ex5


      # ============================================================
      # 6. VERIFY EX5
      # ============================================================
      - name: Verify King's Bot EX5 artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $ex5 = Join-Path `
            $env:MT5_ROOT `
            "MQL5\Experts\KingsBot\KingsBot_Phase6_Integration.ex5"

          if (-not (Test-Path -LiteralPath $ex5)) {
            throw "EX5 verification failed."
          }

          $file = Get-Item -LiteralPath $ex5

          if ($file.Length -le 0) {
            throw "EX5 artifact is empty."
          }

          Write-Host "========================================="
          Write-Host "EX5 VERIFICATION PASSED"
          Write-Host "========================================="
          Write-Host "File: $($file.FullName)"
          Write-Host "Size: $($file.Length) bytes"


      # ============================================================
      # 7. UPLOAD BUILD ARTIFACT
      # ============================================================
      - name: Post King's Bot build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-Phase6-Build
          path: |
            ${{ env.MT5_ROOT }}\MQL5\Experts\KingsBot\KingsBot_Phase6_Integration.ex5
            ${{ env.MT5_ROOT }}\MQL5\Experts\KingsBot\*.log
          if-no-files-found: error


      # ============================================================
      # 8. BUILD SUMMARY
      # ============================================================
      - name: Build summary
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "========================================="
          Write-Host "KING'S BOT BUILD SUMMARY"
          Write-Host "========================================="
          Write-Host "STATUS: SUCCESS"
          Write-Host "EX5: KingsBot_Phase6_Integration.ex5"
          Write-Host "========================================="
