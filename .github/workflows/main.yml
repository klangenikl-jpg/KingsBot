name: Build King's Bot

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Compile King's Bot
    runs-on: windows-latest

    steps:
      - name: Checkout King's Bot
        uses: actions/checkout@v4

      - name: Download MetaTrader 5 installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'

          Write-Host "Downloading MetaTrader 5 installer..."

          Invoke-WebRequest `
            -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' `
            -OutFile $installer

          if (-not (Test-Path $installer)) {
            throw "MetaTrader 5 installer was not downloaded."
          }

          Write-Host "Installer downloaded: $installer"

      - name: Install MetaTrader 5 and locate MQL5 root
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          $installPath = 'C:\MT5'

          New-Item `
            -ItemType Directory `
            -Path $installPath `
            -Force |
            Out-Null

          Write-Host "Installing MetaTrader 5..."

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList @(
              '/auto',
              "/path:`"$installPath`""
            ) `
            -Wait `
            -PassThru

          Write-Host "Installer exit code: $($process.ExitCode)"

          Start-Sleep -Seconds 5

          $searchRoots = @(
            'C:\MT5',
            'C:\Program Files\MetaTrader 5',
            'C:\Program Files (x86)\MetaTrader 5',
            "$env:APPDATA\MetaQuotes\Terminal",
            "$env:LOCALAPPDATA\MetaQuotes\Terminal"
          ) |
            Where-Object { Test-Path $_ } |
            Select-Object -Unique

          Write-Host "Searching for MetaEditor64.exe and Trade.mqh..."

          $metaEditor = $null
          $tradeInclude = $null

          foreach ($root in $searchRoots) {

            Write-Host "Searching: $root"

            if (-not $metaEditor) {
              $metaEditor = Get-ChildItem `
                -Path $root `
                -Filter 'MetaEditor64.exe' `
                -File `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1
            }

            if (-not $tradeInclude) {
              $tradeInclude = Get-ChildItem `
                -Path $root `
                -Filter 'Trade.mqh' `
                -File `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Where-Object {
                  $_.FullName -match '\\MQL5\\Include\\Trade\\Trade\.mqh$'
                } |
                Select-Object -First 1
            }

            if ($metaEditor -and $tradeInclude) {
              break
            }
          }

          if (-not $metaEditor) {
            throw "MetaEditor64.exe was not found after MetaTrader 5 installation."
          }

          if (-not $tradeInclude) {
            throw "Required Trade.mqh include was not found after MetaTrader 5 installation."
          }

          $mql5Root = Split-Path `
            (Split-Path `
              (Split-Path $tradeInclude.FullName -Parent) -Parent) `
            -Parent

          $mql5Include = Join-Path $mql5Root 'Include'

          if (-not (Test-Path (Join-Path $mql5Include 'Trade\Trade.mqh'))) {
            $mql5Root = Split-Path `
              (Split-Path `
                (Split-Path $tradeInclude.FullName -Parent) -Parent) `
              -Parent

            $mql5Include = Join-Path $mql5Root 'Include'
          }

          Write-Host "MetaEditor: $($metaEditor.FullName)"
          Write-Host "Trade.mqh: $($tradeInclude.FullName)"
          Write-Host "MQL5 root: $mql5Root"

          "METAEDITOR=$($metaEditor.FullName)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          "MQL5_ROOT=$mql5Root" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          "MQL5_INCLUDE=$mql5Include" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      - name: Install King's Bot source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:MQL5_ROOT) {
            throw "MQL5_ROOT is not set."
          }

          $sourceRoot = $env:GITHUB_WORKSPACE

          Write-Host "Source root: $sourceRoot"
          Write-Host "MQL5 root: $env:MQL5_ROOT"

          Get-ChildItem `
            -Path $sourceRoot `
            -File `
            -Include *.mq5,*.mqh `
            -Recurse |
            Where-Object {
              $_.FullName -notmatch '\\\.git\\'
            } |
            ForEach-Object {
              Copy-Item `
                -Path $_.FullName `
                -Destination $env:MQL5_ROOT `
                -Force
            }

          $mainSource = Join-Path `
            $env:MQL5_ROOT `
            'KingsBot_Phase6_Integration.mq5'

          if (-not (Test-Path $mainSource)) {
            throw "KingsBot_Phase6_Integration.mq5 was not copied to the MQL5 root."
          }

          Write-Host "KingsBot source installed: $mainSource"

      - name: Verify required Trade include
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $trade = Join-Path `
            $env:MQL5_ROOT `
            'Include\Trade\Trade.mqh'

          if (-not (Test-Path $trade)) {
            throw "Required Trade.mqh include was not found at $trade"
          }

          Write-Host "Verified Trade.mqh: $trade"

      - name: Compile King's Bot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Join-Path `
            $env:MQL5_ROOT `
            'KingsBot_Phase6_Integration.mq5'

          $log = Join-Path `
            $env:RUNNER_TEMP `
            'KingsBot_compile.log'

          if (-not (Test-Path $source)) {
            throw "Compile source was not found: $source"
          }

          Write-Host "Compiling: $source"
          Write-Host "Using MetaEditor: $env:METAEDITOR"

          & $env:METAEDITOR `
            "/compile:$source" `
            "/log:$log" `
            "/include:$env:MQL5_INCLUDE"

          if (Test-Path $log) {
            Get-Content $log
          }

          $ex5 = [System.IO.Path]::ChangeExtension(
            $source,
            '.ex5'
          )

          if (-not (Test-Path $ex5)) {
            throw "KingsBot compilation failed. No EX5 file was created."
          }

          Write-Host "Compilation succeeded: $ex5"

      - name: Prepare King's Bot artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Join-Path `
            $env:MQL5_ROOT `
            'KingsBot_Phase6_Integration.mq5'

          $ex5 = [System.IO.Path]::ChangeExtension(
            $source,
            '.ex5'
          )

          $artifactDir = Join-Path `
            $env:GITHUB_WORKSPACE `
            'phase6-artifact'

          New-Item `
            -ItemType Directory `
            -Path $artifactDir `
            -Force |
            Out-Null

          Copy-Item `
            $ex5 `
            $artifactDir `
            -Force

          if (-not (
            Test-Path (
              Join-Path `
                $artifactDir `
                'KingsBot_Phase6_Integration.ex5'
            )
          )) {
            throw "Phase 6 EX5 artifact was not prepared."
          }

      - name: Upload Phase 6 EX5
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-Phase6-EX5
          path: phase6-artifact/KingsBot_Phase6_Integration.ex5
          if-no-files-found: error
