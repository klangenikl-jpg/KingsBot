name: King's Bot - Phase 6 Final Validation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase6-validation:
    name: Phase 6 Build, Compile, and MT5 Validation
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout King's Bot
        uses: actions/checkout@v6

      - name: Build, compile, validate, and collect evidence
        id: build
        shell: pwsh
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
        run: |
          $ErrorActionPreference = 'Stop'

          $evidence = Join-Path $env:GITHUB_WORKSPACE 'phase6-validation-evidence'
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null

          Write-Host '=========================================='
          Write-Host ' KINGS BOT PHASE 6 FINAL VALIDATION'
          Write-Host '=========================================='

          Write-Host '=== VERIFY PHASE 6 SOURCE ==='

          $source = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Recurse `
            -File `
            -Filter 'KingsBot_Phase6_Integration.mq5' `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $source) {
            Write-Error 'KingsBot_Phase6_Integration.mq5 was not found.'
            exit 1
          }

          Write-Host ('Phase 6 source: ' + $source.FullName)

          $sourceRoot = $source.Directory.FullName

          Write-Host '=== INSTALL METATRADER 5 ==='

          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          $requestedRoot = Join-Path $env:RUNNER_TEMP 'KingsBot-MT5'

          Invoke-WebRequest `
            -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' `
            -OutFile $installer `
            -UseBasicParsing

          if (-not (Test-Path $installer)) {
            Write-Error 'MetaTrader 5 installer was not downloaded.'
            exit 1
          }

          if (Test-Path $requestedRoot) {
            Remove-Item $requestedRoot -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $requestedRoot `
            -Force | Out-Null

          $install = Start-Process `
            -FilePath $installer `
            -ArgumentList @(
              '/auto',
              ('/path:"' + $requestedRoot + '"')
            ) `
            -Wait `
            -PassThru

          Write-Host ('MT5 installer exit code: ' + $install.ExitCode)

          Write-Host '=== LOCATE MT5 TERMINAL AND METAEDITOR ==='

          $terminal = Get-ChildItem `
            -Path $requestedRoot `
            -Recurse `
            -File `
            -Filter 'terminal64.exe' `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          $editor = Get-ChildItem `
            -Path $requestedRoot `
            -Recurse `
            -File `
            -Filter 'metaeditor64.exe' `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $terminal) {
            Write-Error 'MetaTrader 5 terminal64.exe was not found.'
            exit 1
          }

          if (-not $editor) {
            Write-Error 'MetaEditor metaeditor64.exe was not found.'
            exit 1
          }

          $mt5Root = $terminal.Directory.FullName

          Write-Host ('MT5 root: ' + $mt5Root)
          Write-Host ('Terminal: ' + $terminal.FullName)
          Write-Host ('MetaEditor: ' + $editor.FullName)

          Write-Host '=== PREPARE KINGSBOT SOURCE TREE ==='

          $target = Join-Path `
            $mt5Root `
            'MQL5\Experts\KingsBot'

          if (Test-Path $target) {
            Remove-Item $target -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $target `
            -Force | Out-Null

          Copy-Item `
            -Path (Join-Path $sourceRoot '*') `
            -Destination $target `
            -Recurse `
            -Force

          $compileSource = Join-Path `
            $target `
            'KingsBot_Phase6_Integration.mq5'

          $compileLog = [IO.Path]::ChangeExtension(
            $compileSource,
            '.log'
          )

          $ex5 = [IO.Path]::ChangeExtension(
            $compileSource,
            '.ex5'
          )

          if (-not (Test-Path $compileSource)) {
            Write-Error (
              'Prepared source was not found: ' +
              $compileSource
            )
            exit 1
          }

          Write-Host ('Prepared source: ' + $compileSource)

          Remove-Item `
            $compileLog `
            -Force `
            -ErrorAction SilentlyContinue

          Remove-Item `
            $ex5 `
            -Force `
            -ErrorAction SilentlyContinue

          Write-Host '=== COMPILE PHASE 6 ==='

          $compile = Start-Process `
            -FilePath $editor.FullName `
            -ArgumentList @(
              ('/compile:' + $compileSource),
              '/log'
            ) `
            -WorkingDirectory $target `
            -Wait `
            -PassThru

          Write-Host (
            'MetaEditor exit code: ' +
            $compile.ExitCode
          )

          if (-not (Test-Path $compileLog)) {
            Write-Error 'Compiler log was not produced.'
            exit 1
          }

          Get-Content $compileLog

          if (-not (Test-Path $ex5)) {
            Write-Error `
              'Compilation did not produce the EX5 file.'
            exit 1
          }

          $ex5Size = (Get-Item $ex5).Length

          if ($ex5Size -le 0) {
            Write-Error 'Compiled EX5 is empty.'
            exit 1
          }

          $compileText = Get-Content `
            $compileLog `
            -Raw

          if (
            $compileText -match `
            '(?im)^\s*Result:\s*[1-9]\d*\s+errors?'
          ) {
            Write-Error `
              'MetaEditor reported compilation errors.'
            exit 1
          }

          Write-Host (
            'COMPILE PASS - EX5 size: ' +
            $ex5Size +
            ' bytes'
          )

          Copy-Item `
            $ex5 `
            $evidence `
            -Force

          Copy-Item `
            $compileLog `
            $evidence `
            -Force

          Write-Host '=== VERIFY TESTER EX5 PATH ==='

          $testerEx5 = Join-Path `
            $mt5Root `
            'MQL5\Experts\KingsBot\KingsBot_Phase6_Integration.ex5'

          if (-not (Test-Path $testerEx5)) {
            Write-Error (
              'Tester EX5 was not found at: ' +
              $testerEx5
            )
            exit 1
          }

          Write-Host (
            'Tester EX5 confirmed: ' +
            $testerEx5
          )

          Write-Host '=== CHECK MT5 AUTHENTICATION ==='

          $hasCredentials = (
            -not [string]::IsNullOrWhiteSpace(
              $env:MT5_LOGIN
            )
            -and
            -not [string]::IsNullOrWhiteSpace(
              $env:MT5_PASSWORD
            )
            -and
            -not [string]::IsNullOrWhiteSpace(
              $env:MT5_SERVER
            )
          )

          if ($hasCredentials) {
            'available=true' |
              Out-File `
                -FilePath $env:GITHUB_OUTPUT `
                -Append `
                -Encoding utf8

            Write-Host `
              'Authenticated MT5 tester: credentials available.'
          }
          else {
            'available=false' |
              Out-File `
                -FilePath $env:GITHUB_OUTPUT `
                -Append `
                -Encoding utf8

            Write-Warning `
              'Authenticated MT5 tester skipped because MT5 credentials are not configured as GitHub Actions secrets.'
          }

          Write-Host '=== WRITE VALIDATION SUMMARY ==='

          $summary = @(
            'Phase 6 source: ' + $source.FullName
            'Compiled EX5: ' + $ex5
            'EX5 size: ' + $ex5Size + ' bytes'
            'Tester EX5: ' + $testerEx5
            'Authenticated tester available: ' + $hasCredentials
          )

          Set-Content `
            -Path (Join-Path $evidence 'validation-summary.txt') `
            -Value ($summary -join [Environment]::NewLine) `
            -Encoding utf8

      - name: Run authenticated MT5 Strategy Tester
        if: ${{ steps.build.outputs.available == 'true' }}
        shell: pwsh
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host '=== START AUTHENTICATED MT5 STRATEGY TESTER ==='

          $terminal = Get-ChildItem `
            -Path (Join-Path $env:RUNNER_TEMP 'KingsBot-MT5') `
            -Recurse `
            -File `
            -Filter 'terminal64.exe' `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $terminal) {
            Write-Error `
              'MT5 terminal64.exe was not found.'
            exit 1
          }

          $mt5Root = $terminal.Directory.FullName

          $reportDir = Join-Path `
            $mt5Root `
            'reports'

          $evidence = Join-Path `
            $env:GITHUB_WORKSPACE `
            'phase6-validation-evidence'

          $config = Join-Path `
            $mt5Root `
            'KingsBot_Phase6_Tester.ini'

          $report = Join-Path `
            $reportDir `
            'KingsBot_Phase6_Tester.htm'

          New-Item `
            -ItemType Directory `
            -Path $reportDir `
            -Force | Out-Null

          Remove-Item `
            $report `
            -Force `
            -ErrorAction SilentlyContinue

          $configLines = @(
            '[Common]'
            ('Login=' + $env:MT5_LOGIN)
            ('Password=' + $env:MT5_PASSWORD)
            ('Server=' + $env:MT5_SERVER)
            'KeepPrivate=1'
            'NewsEnable=0'
            ''
            '[Experts]'
            'AllowLiveTrading=0'
            'AllowDllImport=0'
            'Enabled=1'
            ''
            '[Tester]'
            'Expert=KingsBot\KingsBot_Phase6_Integration.ex5'
            ('Login=' + $env:MT5_LOGIN)
            'Symbol=EURUSD'
            'Period=M15'
            'Model=4'
            'Optimization=0'
            'ExecutionMode=0'
            'FromDate=2025.01.01'
            'ToDate=2026.08.01'
            'Deposit=10000'
            'Currency=USD'
            'Leverage=1:100'
            'UseLocal=1'
            'UseRemote=0'
            'UseCloud=0'
            'Visual=0'
            'Report=reports\KingsBot_Phase6_Tester.htm'
            'ReplaceReport=1'
            'ShutdownTerminal=1'
          )

          Set-Content `
            -Path $config `
            -Value ($configLines -join [Environment]::NewLine) `
            -Encoding Unicode

          Copy-Item `
            $config `
            $evidence `
            -Force

          Write-Host '=== TESTER CONFIGURATION READY ==='
          Write-Host 'Login=[hidden]'
          Write-Host 'Password=[hidden]'
          Write-Host ('Server=' + $env:MT5_SERVER)
          Write-Host `
            'Expert=KingsBot\KingsBot_Phase6_Integration.ex5'
          Write-Host 'Symbol=EURUSD'
          Write-Host 'Period=M15'

          Write-Host '=== RUN STRATEGY TESTER ==='

          $tester = Start-Process `
            -FilePath $terminal.FullName `
            -ArgumentList @(
              '/portable',
              ('/config:' + $config)
            ) `
            -WorkingDirectory $mt5Root `
            -PassThru

          Write-Host (
            'MT5 process ID: ' +
            $tester.Id
          )

          $deadline = (Get-Date).AddMinutes(15)

          while ((Get-Date) -lt $deadline) {

            if (Test-Path $report) {
              break
            }

            $running = Get-Process `
              -Id $tester.Id `
              -ErrorAction SilentlyContinue

            if (-not $running) {
              Write-Host `
                'MT5 exited before producing the report.'
              break
            }

            Start-Sleep -Seconds 10
          }

          if (-not (Test-Path $report)) {

            Write-Host '=== MT5 DIAGNOSTICS ==='

            $logRoots = @(
              (Join-Path $mt5Root 'Logs')
              (Join-Path $mt5Root 'Tester\logs')
            )

            foreach ($logRoot in $logRoots) {

              if (Test-Path $logRoot) {

                $logs = Get-ChildItem `
                  -Path $logRoot `
                  -Recurse `
                  -File `
                  -ErrorAction SilentlyContinue |
                  Where-Object {
                    $_.Extension -in @(
                      '.log',
                      '.htm',
                      '.html',
                      '.xml'
                    )
                  }

                foreach ($log in $logs) {

                  Write-Host ''
                  Write-Host (
                    '===== ' +
                    $log.FullName +
                    ' ====='
                  )

                  Get-Content `
                    $log.FullName `
                    -ErrorAction SilentlyContinue

                  Copy-Item `
                    $log.FullName `
                    $evidence `
                    -Force `
                    -ErrorAction SilentlyContinue
                }
              }
            }

            Write-Error `
              'Authenticated MT5 Strategy Tester did not produce a report.'
            exit 1
          }

          $reportSize = (Get-Item $report).Length

          if ($reportSize -le 0) {
            Write-Error `
              'MT5 Strategy Tester report is empty.'
            exit 1
          }

          Copy-Item `
            $report `
            $evidence `
            -Force

          Write-Host (
            'STRATEGY TEST PASS - report size: ' +
            $reportSize +
            ' bytes'
          )

      - name: Upload Phase 6 validation evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: KingsBot-Phase6-Final-Validation
          path: phase6-validation-evidence
          if-no-files-found: warn
          retention-days: 14
