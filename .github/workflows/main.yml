name: Build King's Bot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Compile King's Bot
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout King's Bot
        uses: actions/checkout@v4

      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          $mt5Url = 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe'

          Write-Host "Downloading official MetaTrader 5 installer..."
          Invoke-WebRequest -Uri $mt5Url -OutFile $installer

          if (-not (Test-Path $installer)) {
            throw "MetaTrader 5 installer was not downloaded."
          }

          $mt5Root = Join-Path $env:RUNNER_TEMP 'MT5'

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $mt5Root |
            Out-Null

          Write-Host "Installing MetaTrader 5..."

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList @(
              '/auto',
              "/path:`"$mt5Root`""
            ) `
            -Wait `
            -PassThru

          Write-Host "MT5 installer exit code: $($process.ExitCode)"

          if ($process.ExitCode -ne 0) {
            throw "MetaTrader 5 installation failed with exit code $($process.ExitCode)."
          }

          $metaEditor = Get-ChildItem `
            -Path $mt5Root `
            -Filter 'MetaEditor64.exe' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

