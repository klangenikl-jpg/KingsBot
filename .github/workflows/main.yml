name: Build King's Bot

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build King's Bot
    runs-on: windows-latest
    timeout-minutes: 20

    steps:

      - name: Get King's Bot source
        uses: actions/checkout@v4

      - name: Locate King's Bot source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========================================"
          Write-Host "LOCATING KING'S BOT SOURCE"
          Write-Host "========================================"

          $source = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter "KingsBot_Phase6_Integration.mq5" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $source) {
            Write-Host "Available MQ5 files:"
            Get-ChildItem `
              -Path $env:GITHUB_WORKSPACE `
              -Filter "*.mq5" `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName

            throw "KingsBot_Phase6_Integration.mq5 was not found."
          }

          Write-Host "SOURCE:"
          Write-Host $source.FullName

          "KINGSBOT_SOURCE=$($source.FullName)" |
            Out-File $env:GITHUB_ENV -Encoding utf8

          "KINGSBOT_SOURCE_DIR=$($source.Directory.FullName)" |
            Out-File $env:GITHUB_ENV -Encoding utf8

      - name: Locate MetaEditor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========================================"
          Write-Host "LOCATING METAEDITOR"
          Write-Host "========================================"

          $roots = @(
            "C:\Program Files",
            "C:\Program Files (x86)",
            "$env:LOCALAPPDATA",
            "$env:APPDATA",
            "$env:RUNNER_TEMP"
          )

          $metaEditor = $null

          foreach ($root in $roots) {

            if (-not (Test-Path $root)) {
              continue
            }

            Write-Host "Searching $root"

            $found = Get-ChildItem `
              -Path $root `
              -Filter "metaeditor64.exe" `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if ($found) {
              $metaEditor = $found.FullName
              break
            }
          }

          if (-not $metaEditor) {

            Write-Host "MetaEditor not found."
            Write-Host "Downloading MetaTrader 5 installer..."

            $installer = Join-Path `
              $env:RUNNER_TEMP `
              "mt5setup.exe"

            Invoke-WebRequest `
              -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" `
              -OutFile $installer

            if (-not (Test-Path $installer)) {
              throw "MetaTrader 5 installer download failed."
            }

            Write-Host "Starting unattended MT5 installation..."

            $process = Start-Process `
              -FilePath $installer `
              -ArgumentList "/auto" `
              -PassThru

            # Give the installer a maximum of 120 seconds.
            $finished = $process.WaitForExit(120000)

            if (-not $finished) {
              Write-Host "MT5 installer exceeded 120 seconds."
              Write-Host "Stopping installer instead of allowing the workflow to hang."

              Stop-Process `
                -Id $process.Id `
                -Force `
                -ErrorAction SilentlyContinue

              throw "MetaTrader 5 installer timed out after 120 seconds."
            }

            Write-Host "Installer exit code: $($process.ExitCode)"

            Start-Sleep -Seconds 5

            foreach ($root in $roots) {

              if (-not (Test-Path $root)) {
                continue
              }

              $found = Get-ChildItem `
                -Path $root `
                -Filter "metaeditor64.exe" `
                -File `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

              if ($found) {
                $metaEditor = $found.FullName
                break
              }
            }
          }

          if (-not $metaEditor) {
            throw "MetaEditor64.exe could not be located."
          }

          Write-Host "METAEDITOR FOUND:"
          Write-Host $metaEditor

          "METAEDITOR=$metaEditor" |
            Out-File $env:GITHUB_ENV -Encoding utf8

      - name: Prepare clean build directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $buildRoot = Join-Path `
            $env:RUNNER_TEMP `
            "KingsBot-MQL5"

          if (Test-Path $buildRoot) {
            Remove-Item `
              $buildRoot `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $buildRoot `
            -Force | Out-Null

          $buildDir = Join-Path $buildRoot "KingsBot"

          New-Item `
            -ItemType Directory `
            -Path $buildDir `
            -Force | Out-Null

          Copy-Item `
            -Path (Join-Path $env:KINGSBOT_SOURCE_DIR "*") `
            -Destination $buildDir `
            -Recurse `
            -Force

          $buildFile = Join-Path `
            $buildDir `
            "KingsBot_Phase6_Integration.mq5"

          if (-not (Test-Path $buildFile)) {
            throw "King's Bot source was not copied into the build directory."
          }

          Write-Host "BUILD FILE:"
          Write-Host $buildFile

          "KINGSBOT_BUILD_ROOT=$buildRoot" |
            Out-File $env:GITHUB_ENV -Encoding utf8

          "KINGSBOT_BUILD_FILE=$buildFile" |
            Out-File $env:GITHUB_ENV -Encoding utf8

      - name: Compile King's Bot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========================================"
          Write-Host "COMPILING KING'S BOT"
          Write-Host "========================================"

          $logFile = Join-Path `
            $env:KINGSBOT_BUILD_ROOT `
            "KingsBot_Phase6_Integration.log"

          # Remove old EX5 files.
          Get-ChildItem `
            -Path $env:KINGSBOT_BUILD_ROOT `
            -Filter "*.ex5" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Remove-Item -Force

          Write-Host "MetaEditor:"
          Write-Host $env:METAEDITOR

          Write-Host "Source:"
          Write-Host $env:KINGSBOT_BUILD_FILE

          $arguments = @(
            "/compile:`"$env:KINGSBOT_BUILD_FILE`"",
            "/log"
          )

          $compiler = Start-Process `
            -FilePath $env:METAEDITOR `
            -ArgumentList $arguments `
            -WorkingDirectory $env:KINGSBOT_BUILD_ROOT `
            -Wait `
            -PassThru

          Write-Host "MetaEditor exit code:"
          Write-Host $compiler.ExitCode

          Start-Sleep -Seconds 3

          Write-Host ""
          Write-Host "========================================"
          Write-Host "COMPILER OUTPUT"
          Write-Host "========================================"

          $logs = Get-ChildItem `
            -Path $env:KINGSBOT_BUILD_ROOT `
            -Filter "*.log" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue

          if ($logs) {
            foreach ($log in $logs) {
              Write-Host ""
              Write-Host "LOG: $($log.FullName)"
              Get-Content $log.FullName -ErrorAction SilentlyContinue
            }
          }
          else {
            Write-Host "No compiler log was found."
          }

      - name: Find compiled EX5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========================================"
          Write-Host "SEARCHING FOR EX5"
          Write-Host "========================================"

          $ex5 = Get-ChildItem `
            -Path $env:KINGSBOT_BUILD_ROOT `
            -Filter "*.ex5" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $ex5) {
            throw "No EX5 was produced by MetaEditor."
          }

          if ($ex5.Length -le 0) {
            throw "EX5 file exists but is empty."
          }

          Write-Host "EX5 FOUND:"
          Write-Host $ex5.FullName

          Write-Host "EX5 SIZE:"
          Write-Host "$($ex5.Length) bytes"

          "KINGSBOT_EX5=$($ex5.FullName)" |
            Out-File $env:GITHUB_ENV -Encoding utf8

      - name: Stage artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $artifactDir = Join-Path `
            $env:GITHUB_WORKSPACE `
            "KingsBot_Artifact"

          if (Test-Path $artifactDir) {
            Remove-Item `
              $artifactDir `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $artifactDir `
            -Force | Out-Null

          $artifactFile = Join-Path `
            $artifactDir `
            "KingsBot_Phase6_Integration.ex5"

          Copy-Item `
            -Path $env:KINGSBOT_EX5 `
            -Destination $artifactFile `
            -Force

          if (-not (Test-Path $artifactFile)) {
            throw "Failed to stage EX5 artifact."
          }

          Write-Host "ARTIFACT READY:"
          Write-Host $artifactFile

          Get-Item $artifactFile |
            Format-List FullName,Length,LastWriteTime

      - name: Upload King's Bot artifact
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-Phase6-MT5
          path: ${{ github.workspace }}/KingsBot_Artifact/KingsBot_Phase6_Integration.ex5
          if-no-files-found: error
          retention-days: 14
