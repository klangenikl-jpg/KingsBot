name: Build King's Bot

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile King's Bot
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MetaTrader 5
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $installer = "$env:RUNNER_TEMP\mt5setup.exe"

          Invoke-WebRequest `
            -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" `
            -OutFile $installer

          Start-Process `
            -FilePath $installer `
            -ArgumentList "/auto" `
            -Wait

      - name: Locate MetaEditor and MQL5 root
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $metaEditor = Get-ChildItem `
            -Path "C:\Program Files","C:\Program Files (x86)","$env:LOCALAPPDATA","$env:APPDATA" `
            -Filter "MetaEditor64.exe" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $metaEditor) {
            throw "MetaEditor64.exe was not found."
          }

          $trade = Get-ChildItem `
            -Path "C:\Program Files","C:\Program Files (x86)","$env:LOCALAPPDATA","$env:APPDATA" `
            -Filter "Trade.mqh" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FullName -match "\\MQL5\\Include\\Trade\\Trade\.mqh$"
            } |
            Select-Object -First 1

          if (-not $trade) {
            throw "MQL5 Include\Trade\Trade.mqh was not found."
          }

          $mql5Root = Split-Path `
            (Split-Path `
              (Split-Path $trade.FullName -Parent) `
              -Parent) `
            -Parent

          "METAEDITOR=$($metaEditor.FullName)" |
            Out-File $env:GITHUB_ENV -Append

          "MQL5_ROOT=$mql5Root" |
            Out-File $env:GITHUB_ENV -Append

          Write-Host "MetaEditor: $($metaEditor.FullName)"
          Write-Host "MQL5 root: $mql5Root"
          Write-Host "Trade.mqh: $($trade.FullName)"

      - name: Install KingsBot source
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $target = "$env:MQL5_ROOT\Experts\KingsBot"

          New-Item `
            -ItemType Directory `
            -Path $target `
            -Force |
            Out-Null

          Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Recurse `
            -File `
            -Include "*.mq5","*.mqh" |
            ForEach-Object {
              Copy-Item `
                $_.FullName `
                "$target\$($_.Name)" `
                -Force
            }

          $source = "$target\KingsBot_Phase6_Integration.mq5"

          if (-not (Test-Path $source)) {
            throw "KingsBot_Phase6_Integration.mq5 was not found."
          }

          "SOURCE=$source" |
            Out-File $env:GITHUB_ENV -Append

          Write-Host "Source: $source"

      - name: Compile King's Bot
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "========================================"
          Write-Host "COMPILING PHASE 6"
          Write-Host "========================================"

          & $env:METAEDITOR `
            "/compile:$env:SOURCE" `
            "/include:$env:MQL5_ROOT\Include" `
            "/log"

          $exitCode = $LASTEXITCODE

          Write-Host ""
          Write-Host "MetaEditor exit code: $exitCode"

          Start-Sleep -Seconds 3

          $ex5 = Get-ChildItem `
            -Path "$env:MQL5_ROOT\Experts\KingsBot" `
            -Filter "*.ex5" `
            -File `
            -ErrorAction SilentlyContinue

          if (-not $ex5) {
            Write-Host ""
            Write-Host "NO EX5 FILE CREATED."
            exit 1
          }

          $file = $ex5 |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          Write-Host ""
          Write-Host "EX5 CREATED:"
          Write-Host $file.FullName

          "EX5_PATH=$($file.FullName)" |
            Out-File $env:GITHUB_ENV -Append

      - name: Upload Phase 6 EX5
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-Phase6
          path: ${{ env.EX5_PATH }}
          if-no-files-found: error
