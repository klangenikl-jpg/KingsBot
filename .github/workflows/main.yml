name: KingsBot MQL5 Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Get KingsBot source
        uses: actions/checkout@v4

      - name: Show source files
        shell: powershell
        run: |
          Write-Host "=== SOURCE FILES ==="

          Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Recurse `
            -File |
            Select-Object FullName

      - name: Install MetaTrader 5
        shell: powershell
        run: |
          $installer = "$env:RUNNER_TEMP\mt5setup.exe"

          Write-Host "Downloading MetaTrader 5 installer..."

          Invoke-WebRequest `
            -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" `
            -OutFile $installer

          if (-not (Test-Path $installer)) {
            Write-Error "MetaTrader 5 installer was not downloaded."
            exit 1
          }

          Write-Host "Installing MetaTrader 5..."

          Start-Process `
            -FilePath $installer `
            -ArgumentList "/auto" `
            -Wait

          Write-Host "MetaTrader 5 installation finished."

      - name: Find MetaEditor
        id: metaeditor
        shell: powershell
        run: |
          Write-Host "=== SEARCHING FOR METAEDITOR ==="

          $roots = @(
            "$env:ProgramFiles",
            "${env:ProgramFiles(x86)}",
            "$env:APPDATA",
            "$env:LOCALAPPDATA"
          )

          $found = $null

          foreach ($root in $roots) {
            if (Test-Path $root) {
              Write-Host "Searching: $root"

              $found = Get-ChildItem `
                -Path $root `
                -Filter "metaeditor64.exe" `
                -Recurse `
                -File `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

              if ($found) {
                break
              }
            }
          }

          if (-not $found) {
            Write-Error "MetaEditor was not found."
            exit 1
          }

          Write-Host "MetaEditor found at:"
          Write-Host $found.FullName

          "path=$($found.FullName)" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Append `
              -Encoding utf8

      - name: Find KingsBot source
        id: source
        shell: powershell
        run: |
          Write-Host "=== SEARCHING FOR KINGSBOT SOURCE ==="

          $source = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter "KingsBot*.mq5" `
            -Recurse `
            -File |
            Select-Object -First 1

          if (-not $source) {
            Write-Error "No KingsBot .mq5 source file was found."
            exit 1
          }

          Write-Host "KingsBot source found at:"
          Write-Host $source.FullName

          "path=$($source.FullName)" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Append `
              -Encoding utf8

      - name: Compile KingsBot
        shell: powershell
        run: |
          $editor = "${{ steps.metaeditor.outputs.path }}"
          $source = "${{ steps.source.outputs.path }}"

          $sourceDir = Split-Path $source -Parent
          $sourceName = [System.IO.Path]::GetFileNameWithoutExtension($source)

          $log = Join-Path `
            $sourceDir `
            "$sourceName.log"

          $ex5 = Join-Path `
            $sourceDir `
            "$sourceName.ex5"

          Write-Host "=== COMPILING KINGSBOT ==="
          Write-Host "MetaEditor: $editor"
          Write-Host "Source: $source"
          Write-Host "Source directory: $sourceDir"
          Write-Host "Expected log: $log"
          Write-Host "Expected EX5: $ex5"

          if (-not (Test-Path $editor)) {
            Write-Error "MetaEditor executable does not exist."
            exit 1
          }

          if (-not (Test-Path $source)) {
            Write-Error "KingsBot source file does not exist."
            exit 1
          }

          if (Test-Path $log) {
            Remove-Item `
              -Path $log `
              -Force `
              -ErrorAction SilentlyContinue
          }

          if (Test-Path $ex5) {
            Remove-Item `
              -Path $ex5 `
              -Force `
              -ErrorAction SilentlyContinue
          }

          Write-Host "Starting MetaEditor..."

          & $editor "/compile:$source" "/log"

          $metaEditorExitCode = $LASTEXITCODE

          Write-Host "MetaEditor exit code: $metaEditorExitCode"

          Start-Sleep -Seconds 3

          Write-Host "=== SEARCHING FOR COMPILE OUTPUT ==="

          if (Test-Path $log) {
            Write-Host "=== COMPILE LOG ==="
            Get-Content $log
          }
          else {
            Write-Host "Expected log was not found at:"
            Write-Host $log

            Write-Host "Searching source directory for log files..."

            Get-ChildItem `
              -Path $sourceDir `
              -Filter "*.log" `
              -File `
              -ErrorAction SilentlyContinue |
              ForEach-Object {
                Write-Host "Found log:"
                Write-Host $_.FullName
                Get-Content $_.FullName
              }
          }

          if (Test-Path $ex5) {
            Write-Host "=== BUILD SUCCESS ==="
            Write-Host "EX5 file created:"
            Write-Host $ex5
          }
          else {
            Write-Error "Compilation did not produce an EX5 file."
            exit 1
          }

      - name: Verify build
        shell: powershell
        run: |
          Write-Host "=== EX5 FILES ==="

          $files = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Recurse `
            -Filter "*.ex5" `
            -File `
            -ErrorAction SilentlyContinue

          if (-not $files) {
            Write-Error "No .ex5 file was found."
            exit 1
          }

          $files |
            Select-Object FullName, Length, LastWriteTime

          Write-Host "Build verification successful."

      - name: Upload build results
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-Build
          path: |
            **/*.ex5
            **/*.log
          if-no-files-found: error
