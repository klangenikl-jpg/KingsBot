- name: Install MetaTrader 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          $installPath = 'C:\MT5'

          New-Item `
            -ItemType Directory `
            -Path $installPath `
            -Force |
            Out-Null

          Write-Host "Installing MetaTrader 5 to:"
          Write-Host $installPath

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList @(
              '/auto',
              "/path:`"$installPath`""
            ) `
            -Wait `
            -PassThru

          Write-Host "Installer exit code: $($process.ExitCode)"

          Start-Sleep -Seconds 5

          $metaEditor = Join-Path `
            $installPath `
            'MetaEditor64.exe'

          if (-not (Test-Path $metaEditor)) {
            Write-Host "MetaEditor not found at expected path."
            Write-Host "Searching C:\MT5..."

            $metaEditor = Get-ChildItem `
              -Path $installPath `
              -Filter 'MetaEditor64.exe' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1 |
              Select-Object -ExpandProperty FullName
          }

          if (-not $metaEditor) {
            throw "MetaTrader 5 installation failed. Installer exit code: $($process.ExitCode). MetaEditor64.exe was not found."
          }

          Write-Host "MetaEditor found:"
          Write-Host $metaEditor

          "METAEDITOR=$metaEditor" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8
