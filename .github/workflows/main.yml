name: Build King's Bot

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build King's Bot
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      MT5_ROOT: C:\MT5

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout King's Bot
        uses: actions/checkout@v4

      # ============================================================
      # 2. INSTALL AND LOCATE METATRADER 5
      # ============================================================
      - name: Install and locate MetaTrader 5
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "INSTALLING METATRADER 5"
          Write-Host "========================================="

          $mt5Root = $env:MT5_ROOT
          $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"

          New-Item -ItemType Directory -Path $mt5Root -Force | Out-Null

          Write-Host "Downloading official MetaTrader 5 installer..."

          Invoke-WebRequest `
            -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" `
            -OutFile $installer `
            -UseBasicParsing

          if (-not (Test-Path $installer)) {
            throw "MetaTrader 5 installer was not downloaded."
          }

          Write-Host "Installer downloaded."

          Write-Host "Installing MetaTrader 5..."

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList "/auto", "/path:$mt5Root" `
            -Wait `
            -PassThru `
            -NoNewWindow

          Write-Host "Installer exit code: $($process.ExitCode)"

          Start-Sleep -Seconds 5

          Write-Host "Searching for MetaEditor64.exe..."

          $metaEditor = Get-ChildItem `
            -Path "C:\MT5","C:\Program Files","C:\Program Files (x86)" `
            -Filter "metaeditor64.exe" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $metaEditor) {
            Write-Host "MetaEditor not found in standard locations."
            Write-Host "Performing full C:\ search..."

            $metaEditor = Get-ChildItem `
              -Path "C:\" `
              -Filter "metaeditor64.exe" `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }

          if (-not $metaEditor) {
            throw "MetaEditor64.exe could not be located."
          }

          Write-Host "========================================="
          Write-Host "METATRADER 5 FOUND"
          Write-Host "========================================="
          Write-Host "MetaEditor:"
          Write-Host $metaEditor.FullName
          Write-Host "========================================="

      # ============================================================
      # 3. PREPARE KING'S BOT SOURCE
      # ============================================================
      - name: Prepare King's Bot source
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "PREPARING KING'S BOT SOURCE"
          Write-Host "========================================="

          $workspace = $env:GITHUB_WORKSPACE

          $metaEditor = Get-ChildItem `
            -Path "C:\MT5","C:\Program Files","C:\Program Files (x86)" `
            -Filter "metaeditor64.exe" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $metaEditor) {
            throw "MetaEditor64.exe could not be located."
          }

          $mt5ActualRoot = Split-Path $metaEditor.FullName -Parent

          while ((Split-Path $mt5ActualRoot -Leaf) -ne "MQL5") {
            $parent = Split-Path $mt5ActualRoot -Parent

            if ($parent -eq $mt5ActualRoot) {
              break
            }

            $mt5ActualRoot = $parent

            if (Test-Path (Join-Path $mt5ActualRoot "MQL5")) {
              break
            }
          }

          if (-not (Test-Path (Join-Path $mt5ActualRoot "MQL5"))) {
            $mt5ActualRoot = $env:MT5_ROOT
          }

          $expertRoot = Join-Path `
            $mt5ActualRoot `
            "MQL5\Experts\KingsBot"

          New-Item `
            -ItemType Directory `
            -Path $expertRoot `
            -Force |
            Out-Null

          Write-Host "KingsBot destination:"
          Write-Host $expertRoot

          $sourceFiles = Get-ChildItem `
            -Path $workspace `
            -Include "*.mq5","*.mqh" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue

          if (-not $sourceFiles) {
            throw "No MQL5 source files were found."
          }

          foreach ($file in $sourceFiles) {

            Write-Host "Copying $($file.Name)"

            Copy-Item `
              -LiteralPath $file.FullName `
              -Destination (Join-Path $expertRoot $file.Name) `
              -Force
          }

          $mainSource = Join-Path `
            $expertRoot `
            "KingsBot_Phase6_Integration.mq5"

          if (-not (Test-Path $mainSource)) {
            throw "KingsBot_Phase6_Integration.mq5 was not found."
          }

          Write-Host "========================================="
          Write-Host "SOURCE PREPARATION COMPLETE"
          Write-Host "========================================="

      # ============================================================
      # 4. COMPILE KING'S BOT
      # ============================================================
      - name: Compile King's Bot
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "COMPILING KING'S BOT"
          Write-Host "========================================="

          Write-Host "Locating MetaEditor64.exe..."

          $metaEditor = Get-ChildItem `
            -Path "C:\MT5","C:\Program Files","C:\Program Files (x86)" `
            -Filter "metaeditor64.exe" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $metaEditor) {
            throw "MetaEditor64.exe could not be located."
          }

          $metaEditorPath = $metaEditor.FullName

          Write-Host "MetaEditor:"
          Write-Host $metaEditorPath

          Write-Host "Locating King's Bot source..."

          $source = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter "KingsBot_Phase6_Integration.mq5" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $source) {
            throw "KingsBot_Phase6_Integration.mq5 could not be located."
          }

          Write-Host "Source:"
          Write-Host $source.FullName

          $logFile = Join-Path `
            $env:RUNNER_TEMP `
            "KingsBot_compile.log"

          Write-Host "Running MetaEditor compiler..."

          $process = Start-Process `
            -FilePath $metaEditorPath `
            -ArgumentList "/compile:$($source.FullName)", "/log:$logFile" `
            -Wait `
            -PassThru `
            -NoNewWindow

          Write-Host "MetaEditor exit code: $($process.ExitCode)"

          Write-Host "========================================="
          Write-Host "COMPILATION LOG"
          Write-Host "========================================="

          if (Test-Path $logFile) {
            Get-Content $logFile
          }
          else {
            Write-Host "No compilation log was generated."
          }

          if ($process.ExitCode -ne 0) {
            throw "King's Bot compilation failed."
          }

      # ============================================================
      # 5. VERIFY EX5
      # ============================================================
      - name: Verify King's Bot EX5 artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "VERIFYING KING'S BOT EX5"
          Write-Host "========================================="

          $ex5 = Get-ChildItem `
            -Path "C:\MT5" `
            -Filter "*.ex5" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue

          if (-not $ex5) {
            throw "No EX5 artifact was created."
          }

          foreach ($file in $ex5) {
            Write-Host "EX5:"
            Write-Host $file.FullName
            Write-Host "Size: $($file.Length) bytes"
          }

          Write-Host "EX5 verification successful."

      # ============================================================
      # 6. UPLOAD BUILD ARTIFACTS
      # ============================================================
      - name: Upload King's Bot build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-build
          path: |
            C:\MT5\**\*.ex5
            C:\MT5\**\*.mq5
            C:\MT5\**\*.mqh
          if-no-files-found: warn

      # ============================================================
      # 7. BUILD SUMMARY
      # ============================================================
      - name: Build summary
        if: always()
        shell: pwsh
        run: |
          Write-Host "========================================="
          Write-Host "KING'S BOT BUILD SUMMARY"
          Write-Host "========================================="
          Write-Host "Build workflow completed."
          Write-Host "========================================="
