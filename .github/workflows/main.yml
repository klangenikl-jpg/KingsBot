name: Build King's Bot

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build King's Bot
    runs-on: windows-latest
    timeout-minutes: 30

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout King's Bot
        uses: actions/checkout@v4


      # ============================================================
      # 2. INSTALL / LOCATE METATRADER 5
      # ============================================================
      - name: Install and locate MetaTrader 5
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "INSTALLING / LOCATING METATRADER 5"
          Write-Host "========================================="

          $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"

          Write-Host "Downloading official MetaTrader 5 installer..."

          Invoke-WebRequest `
            -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" `
            -OutFile $installer `
            -UseBasicParsing

          if (-not (Test-Path $installer)) {
              throw "MetaTrader 5 installer was not downloaded."
          }

          Write-Host "Installer downloaded."
          Write-Host "Starting unattended installation..."

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList "/auto" `
            -Wait `
            -PassThru

          Write-Host "Installer exit code: $($process.ExitCode)"

          Write-Host ""
          Write-Host "IMPORTANT:"
          Write-Host "The installer exit code is NOT being treated as proof"
          Write-Host "that installation failed."
          Write-Host "We will now locate MetaEditor."

          # --------------------------------------------------------
          # Search known MT5 locations first
          # --------------------------------------------------------
          $searchRoots = @(
              "C:\Program Files\MetaTrader 5",
              "C:\Program Files (x86)\MetaTrader 5",
              "C:\MT5",
              "$env:LOCALAPPDATA\Programs",
              "$env:LOCALAPPDATA\MetaQuotes",
              "$env:APPDATA\MetaQuotes",
              "$env:USERPROFILE\AppData\Local",
              "$env:USERPROFILE\AppData\Roaming"
          )

          $metaEditor = $null

          foreach ($root in $searchRoots) {

              if (-not (Test-Path $root)) {
                  continue
              }

              Write-Host "Searching: $root"

              $found = Get-ChildItem `
                -Path $root `
                -Filter "metaeditor64.exe" `
                -File `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

              if ($found) {
                  $metaEditor = $found.FullName
                  break
              }
          }

          # --------------------------------------------------------
          # PATH fallback
          # --------------------------------------------------------
          if (-not $metaEditor) {

              Write-Host ""
              Write-Host "MetaEditor not found in known locations."
              Write-Host "Checking Windows PATH..."

              $pathResult = Get-Command `
                "metaeditor64.exe" `
                -ErrorAction SilentlyContinue

              if ($pathResult) {
                  $metaEditor = $pathResult.Source
              }
          }

          # --------------------------------------------------------
          # Final C:\ search
          # --------------------------------------------------------
          if (-not $metaEditor) {

              Write-Host ""
              Write-Host "MetaEditor still not found."
              Write-Host "Performing final C:\ search..."

              $found = Get-ChildItem `
                -Path "C:\" `
                -Filter "metaeditor64.exe" `
                -File `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

              if ($found) {
                  $metaEditor = $found.FullName
              }
          }

          # --------------------------------------------------------
          # FINAL VALIDATION
          # --------------------------------------------------------
          if (-not $metaEditor) {

              Write-Host ""
              Write-Host "========================================="
              Write-Host "METATRADER 5 NOT FOUND"
              Write-Host "========================================="

              throw "MetaEditor64.exe could not be located after MT5 installation."
          }

          $metaEditorDir = Split-Path `
            $metaEditor `
            -Parent

          $mt5Root = $metaEditorDir

          Write-Host ""
          Write-Host "========================================="
          Write-Host "METATRADER 5 FOUND"
          Write-Host "========================================="
          Write-Host "MetaEditor: $metaEditor"
          Write-Host "MT5 root:   $mt5Root"

          "METAEDITOR_PATH=$metaEditor" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append `
            -Encoding utf8

          "MT5_ROOT=$mt5Root" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append `
            -Encoding utf8


      # ============================================================
      # 3. PREPARE KING'S BOT SOURCE
      # ============================================================
      - name: Prepare King's Bot source
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "PREPARING KING'S BOT SOURCE"
          Write-Host "========================================="

          if ([string]::IsNullOrWhiteSpace($env:MT5_ROOT)) {
              throw "MT5_ROOT is empty."
          }

          if (-not (Test-Path $env:MT5_ROOT)) {
              throw "MT5_ROOT does not exist: $env:MT5_ROOT"
          }

          $mql5Root = Join-Path `
            $env:MT5_ROOT `
            "MQL5"

          $expertRoot = Join-Path `
            $mql5Root `
            "Experts\KingsBot"

          New-Item `
            -ItemType Directory `
            -Path $expertRoot `
            -Force |
            Out-Null

          Write-Host "MQL5 root:"
          Write-Host $mql5Root

          Write-Host "KingsBot root:"
          Write-Host $expertRoot

          # --------------------------------------------------------
          # Find main integration source
          # --------------------------------------------------------
          $mainSource = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter "KingsBot_Phase6_Integration.mq5" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $mainSource) {
              throw "KingsBot_Phase6_Integration.mq5 was not found."
          }

          Write-Host ""
          Write-Host "Main source found:"
          Write-Host $mainSource.FullName

          # --------------------------------------------------------
          # Copy all MQL5 source files
          # --------------------------------------------------------
          $sourceFiles = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Recurse `
            -File |
            Where-Object {
              $_.Extension -in @(".mq5",".mqh") -and
              $_.FullName -notlike "*\.git\*" -and
              $_.FullName -notlike "*\.github\*"
            }

          if (-not $sourceFiles) {
              throw "No MQL5 source files were found."
          }

          foreach ($file in $sourceFiles) {

              $relativePath = $file.FullName.Substring(
                $env:GITHUB_WORKSPACE.Length
              ).TrimStart('\','/')

              $destination = Join-Path `
                $expertRoot `
                $relativePath

              $destinationDirectory = Split-Path `
                $destination `
                -Parent

              New-Item `
                -ItemType Directory `
                -Path $destinationDirectory `
                -Force |
                Out-Null

              Copy-Item `
                -Path $file.FullName `
                -Destination $destination `
                -Force

              Write-Host "Copied: $relativePath"
          }

          $finalSource = Join-Path `
            $expertRoot `
            "KingsBot_Phase6_Integration.mq5"

          if (-not (Test-Path $finalSource)) {
              throw "Main King's Bot source was not copied."
          }

          Write-Host ""
          Write-Host "FINAL SOURCE:"
          Write-Host $finalSource

          "KING_SOURCE=$finalSource" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append `
            -Encoding utf8

          "KING_MQL5_ROOT=$mql5Root" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append `
            -Encoding utf8


      # ============================================================
      # 4. COMPILE KING'S BOT
      # ============================================================
      - name: Compile King's Bot
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "COMPILING KING'S BOT"
          Write-Host "========================================="

          if (-not (Test-Path $env:METAEDITOR_PATH)) {
              throw "MetaEditor not found: $env:METAEDITOR_PATH"
          }

          if (-not (Test-Path $env:KING_SOURCE)) {
              throw "King's Bot source not found: $env:KING_SOURCE"
          }

          Write-Host "MetaEditor:"
          Write-Host $env:METAEDITOR_PATH

          Write-Host ""
          Write-Host "Source:"
          Write-Host $env:KING_SOURCE

          Write-Host ""
          Write-Host "MQL5 root:"
          Write-Host $env:KING_MQL5_ROOT

          $logFile = [System.IO.Path]::ChangeExtension(
            $env:KING_SOURCE,
            ".log"
          )

          $ex5File = [System.IO.Path]::ChangeExtension(
            $env:KING_SOURCE,
            ".ex5"
          )

          if (Test-Path $logFile) {
              Remove-Item $logFile -Force
          }

          if (Test-Path $ex5File) {
              Remove-Item $ex5File -Force
          }

          Write-Host ""
          Write-Host "Starting MetaEditor compiler..."

          $arguments = @(
            "/compile:`"$($env:KING_SOURCE)`"",
            "/include:`"$($env:KING_MQL5_ROOT)`"",
            "/log"
          )

          $compileProcess = Start-Process `
            -FilePath $env:METAEDITOR_PATH `
            -ArgumentList $arguments `
            -Wait `
            -PassThru `
            -NoNewWindow

          Write-Host ""
          Write-Host "MetaEditor exit code:"
          Write-Host $compileProcess.ExitCode

          Write-Host ""
          Write-Host "========================================="
          Write-Host "COMPILATION LOG"
          Write-Host "========================================="

          if (Test-Path $logFile) {
              Get-Content $logFile
          }
          else {
              Write-Host "No compiler log generated."
          }

          Write-Host ""
          Write-Host "Checking EX5..."

          if (-not (Test-Path $ex5File)) {
              throw "EX5 artifact was NOT created."
          }

          $ex5 = Get-Item $ex5File

          if ($ex5.Length -le 0) {
              throw "EX5 artifact exists but is empty."
          }

          Write-Host ""
          Write-Host "========================================="
          Write-Host "EX5 CREATED SUCCESSFULLY"
          Write-Host "========================================="
          Write-Host $ex5.FullName
          Write-Host "$($ex5.Length) bytes"

          "KING_EX5=$ex5File" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append `
            -Encoding utf8


      # ============================================================
      # 5. VERIFY EX5
      # ============================================================
      - name: Verify King's Bot EX5 artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "VERIFYING EX5 ARTIFACT"
          Write-Host "========================================="

          if ([string]::IsNullOrWhiteSpace($env:KING_EX5)) {
              throw "KING_EX5 is empty."
          }

          if (-not (Test-Path $env:KING_EX5)) {
              throw "EX5 artifact does not exist."
          }

          $file = Get-Item $env:KING_EX5

          if ($file.Length -le 0) {
              throw "EX5 artifact is empty."
          }

          Write-Host "Verified:"
          Write-Host $file.FullName
          Write-Host "Size: $($file.Length) bytes"


      # ============================================================
      # 6. PREPARE ARTIFACT PACKAGE
      # ============================================================
      - name: Prepare build artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "PREPARING BUILD ARTIFACTS"
          Write-Host "========================================="

          $artifactRoot = Join-Path `
            $env:GITHUB_WORKSPACE `
            "build-artifacts"

          New-Item `
            -ItemType Directory `
            -Path $artifactRoot `
            -Force |
            Out-Null

          Copy-Item `
            -Path $env:KING_EX5 `
            -Destination $artifactRoot `
            -Force

          Copy-Item `
            -Path $env:KING_SOURCE `
            -Destination $artifactRoot `
            -Force

          $logFile = [System.IO.Path]::ChangeExtension(
            $env:KING_SOURCE,
            ".log"
          )

          if (Test-Path $logFile) {
              Copy-Item `
                -Path $logFile `
                -Destination $artifactRoot `
                -Force
          }

          Write-Host ""
          Write-Host "Artifact contents:"

          Get-ChildItem `
            -Path $artifactRoot `
            -File |
            ForEach-Object {
              Write-Host "$($_.Name) - $($_.Length) bytes"
            }

          $files = Get-ChildItem `
            -Path $artifactRoot `
            -File

          if (-not $files) {
              throw "Artifact directory is empty."
          }


      # ============================================================
      # 7. UPLOAD ARTIFACT
      # ============================================================
      - name: Upload King's Bot build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-build
          path: build-artifacts
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 8. FINAL SUCCESS
      # ============================================================
      - name: Build summary
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "========================================="
          Write-Host "KING'S BOT BUILD COMPLETE"
          Write-Host "========================================="
          Write-Host ""
          Write-Host "EX5:"
          Write-Host $env:KING_EX5
          Write-Host ""
          Write-Host "Artifact:"
          Write-Host "KingsBot-build"
          Write-Host ""
          Write-Host "========================================="
