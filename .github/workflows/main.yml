name: Build King's Bot

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build King's Bot
    runs-on: windows-latest
    timeout-minutes: 20

    steps:

      - name: Set up job
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "KING'S BOT BUILD"
          Write-Host "========================================="
          Write-Host "Runner: $env:RUNNER_OS"
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"

      - name: Checkout King's Bot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install and locate MetaTrader 5
        shell: pwsh
        timeout-minutes: 7
        run: |
          $ErrorActionPreference = "Stop"

          $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"
          $mt5Root = "C:\MT5"

          Write-Host "========================================="
          Write-Host "PREPARING METATRADER 5"
          Write-Host "========================================="

          if (Test-Path $mt5Root) {
              Remove-Item $mt5Root -Recurse -Force -ErrorAction SilentlyContinue
          }

          New-Item -ItemType Directory -Path $mt5Root -Force | Out-Null

          $mt5Url = "https://download.terminal.free/cdn/web/metaquotes.ltd/mt5/mt5setup.exe"

          Write-Host "Downloading MT5 installer..."

          Invoke-WebRequest `
            -Uri $mt5Url `
            -OutFile $installer `
            -UseBasicParsing `
            -TimeoutSec 120

          if (-not (Test-Path $installer)) {
              throw "MT5 installer was not downloaded."
          }

          $size = (Get-Item $installer).Length

          if ($size -lt 100000) {
              throw "MT5 installer appears invalid or incomplete. Size: $size bytes"
          }

          Write-Host "Installer downloaded: $size bytes"

          Write-Host "Starting MT5 installer..."

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList @(
              "/auto",
              "/path:`"$mt5Root`""
            ) `
            -PassThru

          $deadline = (Get-Date).AddMinutes(5)
          $metaEditor = $null

          Write-Host "Waiting for MetaEditor..."

          while ((Get-Date) -lt $deadline) {

              $candidate = Get-ChildItem `
                -Path $mt5Root `
                -Filter "metaeditor64.exe" `
                -File `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

              if ($candidate) {
                  $metaEditor = $candidate.FullName
                  break
              }

              $direct = Join-Path $mt5Root "metaeditor64.exe"

              if (Test-Path $direct) {
                  $metaEditor = $direct
                  break
              }

              Start-Sleep -Seconds 3
          }

          if (-not $metaEditor) {

              if ($process -and -not $process.HasExited) {
                  Stop-Process `
                    -Id $process.Id `
                    -Force `
                    -ErrorAction SilentlyContinue
              }

              throw "MetaEditor was not found within the installation timeout."
          }

          Write-Host "MetaEditor found:"
          Write-Host $metaEditor

          if ($process -and -not $process.HasExited) {
              $process.WaitForExit(30000) | Out-Null
          }

          if ($process -and -not $process.HasExited) {
              Stop-Process `
                -Id $process.Id `
                -Force `
                -ErrorAction SilentlyContinue
          }

          if (-not (Test-Path $metaEditor)) {
              throw "MetaEditor disappeared after installation."
          }

          $metaEditorDir = Split-Path $metaEditor -Parent

          "$metaEditorDir" >> $env:GITHUB_PATH
          "METAEDITOR=$metaEditor" >> $env:GITHUB_ENV
          "MT5_ROOT=$mt5Root" >> $env:GITHUB_ENV

          Write-Host "MT5 installation verified."

      - name: Prepare King's Bot source
        shell: pwsh
        timeout-minutes: 4
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "PREPARING KING'S BOT SOURCE"
          Write-Host "========================================="

          $workspace = $env:GITHUB_WORKSPACE
          $mql5Root = Join-Path $env:MT5_ROOT "MQL5"
          $expertRoot = Join-Path $mql5Root "Experts\KingsBot"

          New-Item `
            -ItemType Directory `
            -Path $expertRoot `
            -Force |
            Out-Null

          $source = Get-ChildItem `
            -Path $workspace `
            -Filter "KingsBot_Phase6_Integration.mq5" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $source) {
              throw "KingsBot_Phase6_Integration.mq5 was not found."
          }

          Write-Host "Main source:"
          Write-Host $source.FullName

          $sourceFiles = Get-ChildItem `
            -Path $workspace `
            -Recurse `
            -File |
            Where-Object {
              $_.Extension -in @(".mq5", ".mqh")
            }

          foreach ($file in $sourceFiles) {

              $relative = $file.FullName.Substring($workspace.Length).TrimStart("\","/")

              $destination = Join-Path $expertRoot $relative
              $destinationDir = Split-Path $destination -Parent

              New-Item `
                -ItemType Directory `
                -Path $destinationDir `
                -Force |
                Out-Null

              Copy-Item `
                -LiteralPath $file.FullName `
                -Destination $destination `
                -Force
          }

          Write-Host ""
          Write-Host "Normalizing MQL5 source headers..."

          $preparedFiles = Get-ChildItem `
            -Path $expertRoot `
            -Recurse `
            -File |
            Where-Object {
              $_.Extension -in @(".mq5", ".mqh")
            }

          foreach ($file in $preparedFiles) {

              $text = Get-Content `
                -LiteralPath $file.FullName `
                -Raw

              if ($null -eq $text) {
                  $text = ""
              }

              # Remove UTF-8 BOM if present.
              $text = $text -replace "^\uFEFF", ""

              # Repair invalid MQL5 preprocessor header '#once'.
              $text = $text -replace "(?m)^\s*#once\s*$", "#pragma once"

              # Repair accidental bare 'once' header.
              $text = $text -replace "(?m)^\s*once\s*$", "#pragma once"

              # Repair '# once' if present.
              $text = $text -replace "(?m)^\s*#\s+once\s*$", "#pragma once"

              [System.IO.File]::WriteAllText(
                $file.FullName,
                $text,
                [System.Text.UTF8Encoding]::new($false)
              )
          }

          Write-Host "Source normalization complete."

          # Locate the standard MT5 Trade library.
          Write-Host ""
          Write-Host "Locating standard Trade.mqh..."

          $tradeCandidates = @(
              (Join-Path $env:MT5_ROOT "MQL5\Include\Trade\Trade.mqh"),
              (Join-Path $env:MT5_ROOT "MQL5\Include\Trade.mqh")
          )

          $tradeSource = $null

          foreach ($candidate in $tradeCandidates) {
              if (Test-Path $candidate) {
                  $tradeSource = $candidate
                  break
              }
          }

          if (-not $tradeSource) {
              $tradeSource = Get-ChildItem `
                -Path $env:MT5_ROOT `
                -Filter "Trade.mqh" `
                -File `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1 |
                ForEach-Object { $_.FullName }
          }

          if ($tradeSource) {
              Write-Host "Trade.mqh found:"
              Write-Host $tradeSource
          }
          else {
              Write-Host "Trade.mqh was not found in the MT5 installation."
              Write-Host "The compiler will report this separately if the source requires it."
          }

          $compileSource = Join-Path `
            $expertRoot `
            "KingsBot_Phase6_Integration.mq5"

          if (-not (Test-Path $compileSource)) {
              throw "Prepared King's Bot source was not found."
          }

          "KINGSBOT_SOURCE=$compileSource" >> $env:GITHUB_ENV

          Write-Host ""
          Write-Host "Prepared source:"
          Write-Host $compileSource

          Write-Host ""
          Write-Host "MQL5 files prepared: $($preparedFiles.Count)"

      - name: Compile King's Bot
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "COMPILING KING'S BOT"
          Write-Host "========================================="

          $metaEditor = $env:METAEDITOR
          $source = $env:KINGSBOT_SOURCE

          if (-not (Test-Path $metaEditor)) {
              throw "MetaEditor not found: $metaEditor"
          }

          if (-not (Test-Path $source)) {
              throw "King's Bot source not found: $source"
          }

          $sourceDirectory = Split-Path $source -Parent

          $logFile = Join-Path `
            $sourceDirectory `
            "KingsBot_Phase6_Integration.log"

          $ex5File = [System.IO.Path]::ChangeExtension(
            $source,
            ".ex5"
          )

          Remove-Item `
            $ex5File `
            -Force `
            -ErrorAction SilentlyContinue

          Remove-Item `
            $logFile `
            -Force `
            -ErrorAction SilentlyContinue

          Write-Host "MetaEditor:"
          Write-Host $metaEditor

          Write-Host ""
          Write-Host "Source:"
          Write-Host $source

          Write-Host ""
          Write-Host "Running MetaEditor compiler..."

          $arguments = @(
            "/compile:`"$source`"",
            "/log:`"$logFile`""
          )

          $compileProcess = Start-Process `
            -FilePath $metaEditor `
            -ArgumentList $arguments `
            -PassThru

          if (-not $compileProcess.WaitForExit(240000)) {

              Stop-Process `
                -Id $compileProcess.Id `
                -Force `
                -ErrorAction SilentlyContinue

              throw "King's Bot compilation timed out."
          }

          Write-Host ""
          Write-Host "MetaEditor exit code: $($compileProcess.ExitCode)"

          if (Test-Path $logFile) {

              Write-Host ""
              Write-Host "========== COMPILATION LOG =========="

              Get-Content `
               
