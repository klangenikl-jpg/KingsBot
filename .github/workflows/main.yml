          # ------------------------------------------------------------
          # 5. Compile with MetaEditor and capture ALL compiler output.
          # ------------------------------------------------------------
          $expectedEx5 = [System.IO.Path]::ChangeExtension($stagedMain, ".ex5")

          if (Test-Path $expectedEx5) {
            Remove-Item -Path $expectedEx5 -Force
          }

          Write-Host "========================================"
          Write-Host "           COMPILING KING'S BOT"
          Write-Host "========================================"
          Write-Host "MetaEditor:"
          Write-Host "  $metaEditor"
          Write-Host "Source:"
          Write-Host "  $stagedMain"
          Write-Host ""

          $arguments = @(
            "/compile:`"$stagedMain`"",
            "/include:`"$platformMql5`"",
            "/log"
          )

          Write-Host "MetaEditor arguments:"
          $arguments | ForEach-Object {
            Write-Host "  $_"
          }

          Write-Host ""
          Write-Host "Starting MetaEditor compiler..."

          $compileProcess = Start-Process `
            -FilePath $metaEditor `
            -ArgumentList $arguments `
            -Wait `
            -PassThru

          Write-Host ""
          Write-Host "MetaEditor process finished."
          Write-Host "MetaEditor exit code:"
          Write-Host $compileProcess.ExitCode
          Write-Host ""

          # ------------------------------------------------------------
          # Search for compiler logs produced by MetaEditor.
          # ------------------------------------------------------------
          Write-Host "========================================"
          Write-Host "           SEARCHING COMPILER LOGS"
          Write-Host "========================================"

          $logCandidates = @()

          $logCandidates += Get-ChildItem `
            -Path $expertRoot `
            -Filter "*.log" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue

          $logCandidates += Get-ChildItem `
            -Path $env:RUNNER_TEMP `
            -Filter "*.log" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue

          $logCandidates = @(
            $logCandidates |
              Sort-Object FullName -Unique
          )

          if ($logCandidates.Count -gt 0) {

            Write-Host ""
            Write-Host "Compiler log files found:"

            foreach ($log in $logCandidates) {

              Write-Host ""
              Write-Host "----------------------------------------"
              Write-Host "LOG: $($log.FullName)"
              Write-Host "----------------------------------------"

              Get-Content `
                -Path $log.FullName `
                -ErrorAction SilentlyContinue

              Write-Host ""
            }

          }
          else {
            Write-Host ""
            Write-Host "NO .LOG FILE WAS FOUND."
            Write-Host ""
          }

          # ------------------------------------------------------------
          # Also show the generated files in the source directory.
          # ------------------------------------------------------------
          Write-Host "========================================"
          Write-Host "       BUILD DIRECTORY AFTER COMPILE"
          Write-Host "========================================"

          Get-ChildItem `
            -Path $expertRoot `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Select-Object FullName, Length |
            Format-Table -AutoSize

          Write-Host ""

          # ------------------------------------------------------------
          # Do NOT trust the MetaEditor exit code alone.
          # The real success condition is the generated EX5.
          # ------------------------------------------------------------
          if (-not (Test-Path $expectedEx5)) {

            Write-Host ""
            Write-Host "========================================"
            Write-Host "          COMPILATION FAILED"
            Write-Host "========================================"
            Write-Host ""
            Write-Host "Expected EX5 was not generated:"
            Write-Host $expectedEx5
            Write-Host ""

            throw "MetaEditor did not generate the expected EX5 file. See compiler output above."

          }

          $ex5Info = Get-Item $expectedEx5

          if ($ex5Info.Length -le 0) {
            throw "The generated EX5 exists but is empty."
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "           COMPILATION SUCCESS"
          Write-Host "========================================"
          Write-Host "EX5:"
          Write-Host "  $expectedEx5"
          Write-Host "Size:"
          Write-Host "  $($ex5Info.Length) bytes"
          Write-Host ""

          "KINGSBOT_EX5=$expectedEx5" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8
