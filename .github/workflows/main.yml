name: Build King's Bot

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build King's Bot
    runs-on: windows-latest

    steps:
      - name: Get King's Bot source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare clean build directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $repoRoot = $env:GITHUB_WORKSPACE
          $buildRoot = Join-Path $env:RUNNER_TEMP "KingsBot-Build"
          $expertRoot = Join-Path $buildRoot "MQL5\Experts\KingsBot"

          if (Test-Path $buildRoot) {
            Remove-Item $buildRoot -Recurse -Force
          }

          New-Item -ItemType Directory -Path $expertRoot -Force | Out-Null

          $source = Get-ChildItem `
            -Path $repoRoot `
            -Recurse `
            -File `
            -Filter "KingsBot_Phase6_Integration.mq5" `
            -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '\\.git\\' } |
            Select-Object -First 1

          if (-not $source) {
            throw "KingsBot_Phase6_Integration.mq5 was not found."
          }

          Write-Host "Source: $($source.FullName)"

          Copy-Item `
            -Path (Join-Path $source.Directory.FullName "*") `
            -Destination $expertRoot `
            -Recurse `
            -Force

          $mainFile = Join-Path `
            $expertRoot `
            "KingsBot_Phase6_Integration.mq5"

          if (-not (Test-Path $mainFile)) {
            throw "Main Phase 6 source was not copied."
          }

          "KINGSBOT_BUILD_ROOT=$buildRoot" | Out-File `
            $env:GITHUB_ENV `
            -Encoding utf8

          "KINGSBOT_MAIN=$mainFile" | Out-File `
            $env:GITHUB_ENV `
            -Encoding utf8

      - name: Locate or install MetaTrader 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $metaEditor = $null

          $searchRoots = @(
            "C:\Program Files",
            "C:\Program Files (x86)",
            "$env:LOCALAPPDATA",
            "$env:APPDATA"
          )

          foreach ($root in $searchRoots) {
            if (-not (Test-Path $root)) {
              continue
            }

            $found = Get-ChildItem `
              -Path $root `
              -Recurse `
              -File `
              -Filter "metaeditor64.exe" `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if ($found) {
              $metaEditor = $found.FullName
              break
            }
          }

          if (-not $metaEditor) {
            Write-Host "MetaEditor not found."
            Write-Host "Downloading official MetaTrader 5 installer..."

            $installer = Join-Path `
              $env:RUNNER_TEMP `
              "mt5setup.exe"

            Invoke-WebRequest `
              -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" `
              -OutFile $installer

            if (-not (Test-Path $installer)) {
              throw "MT5 installer download failed."
            }

            Write-Host "Starting MT5 automatic installation..."

            $process = Start-Process `
              -FilePath $installer `
              -ArgumentList "/auto" `
              -PassThru

            Write-Host "Installer process started: PID $($process.Id)"

            # Do not fail solely on the installer's immediate exit code.
            # The web installer can continue its installation/update work.
            $deadline = (Get-Date).AddMinutes(8)

            while ((Get-Date) -lt $deadline) {

              foreach ($root in $searchRoots) {
                if (-not (Test-Path $root)) {
                  continue
                }

                $found = Get-ChildItem `
                  -Path $root `
                  -Recurse `
                  -File `
                  -Filter "metaeditor64.exe" `
                  -ErrorAction SilentlyContinue |
                  Select-Object -First 1

                if ($found) {
                  $metaEditor = $found.FullName
                  break
                }
              }

              if ($metaEditor) {
                break
              }

              Start-Sleep -Seconds 10
            }
          }

          if (-not $metaEditor) {
            Write-Host ""
            Write-Host "MetaEditor was not found."
            Write-Host "Searching the runner one final time..."

            $finalSearch = @(
              "C:\Program Files",
              "C:\Program Files (x86)",
              "C:\Users"
            )

            foreach ($root in $finalSearch) {
              if (-not (Test-Path $root)) {
                continue
              }

              $found = Get-ChildItem `
                -Path $root `
                -Recurse `
                -File `
                -Filter "metaeditor64.exe" `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

              if ($found) {
                $metaEditor = $found.FullName
                break
              }
            }
          }

          if (-not $metaEditor) {
            throw "MetaEditor64.exe could not be located."
          }

          Write-Host ""
          Write-Host "MetaEditor found:"
          Write-Host $metaEditor

          "METAEDITOR=$metaEditor" | Out-File `
            $env:GITHUB_ENV `
            -Encoding utf8

          # Locate the corresponding MQL5 directory.
          $mql5Root = Split-Path `
            (Split-Path $metaEditor -Parent) `
            -Parent

          $possibleMql5 = @(
            (Join-Path $mql5Root "MQL5")
          )

          $mql5 = $null

          foreach ($candidate in $possibleMql5) {
            if (
              (Test-Path $candidate) -and
              (Test-Path (Join-Path $candidate "Include"))
            ) {
              $mql5 = $candidate
              break
            }
          }

          if (-not $mql5) {
            $mql5 = Get-ChildItem `
              -Path (Split-Path $metaEditor -Parent) `
              -Directory `
              -Filter "MQL5" `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Where-Object {
                Test-Path (Join-Path $_.FullName "Include")
              } |
              Select-Object -First 1 |
              Select-Object -ExpandProperty FullName
          }

          if (-not $mql5) {
            throw "MQL5 directory with Include folder could not be located."
          }

          Write-Host "MQL5 root:"
          Write-Host $mql5

          "MQL5_ROOT=$mql5" | Out-File `
            $env:GITHUB_ENV `
            -Encoding utf8

      - name: Compile King's Bot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host ""
          Write-Host "========================================"
          Write-Host "        COMPILING KING'S BOT"
          Write-Host "========================================"
          Write-Host ""

          $mainFile = $env:KINGSBOT_MAIN
          $metaEditor = $env:METAEDITOR
          $mql5Root = $env:MQL5_ROOT

          if (-not (Test-Path $mainFile)) {
            throw "Source file does not exist: $mainFile"
          }

          if (-not (Test-Path $metaEditor)) {
            throw "MetaEditor does not exist: $metaEditor"
          }

          $ex5 = [System.IO.Path]::ChangeExtension(
            $mainFile,
            ".ex5"
          )

          $log = [System.IO.Path]::ChangeExtension(
            $mainFile,
            ".log"
          )

          if (Test-Path $ex5) {
            Remove-Item $ex5 -Force
          }

          if (Test-Path $log) {
            Remove-Item $log -Force
          }

          $arguments = @(
            "/compile:`"$mainFile`"",
            "/include:`"$mql5Root`"",
            "/log"
          )

          $compile = Start-Process `
            -FilePath $metaEditor `
            -ArgumentList $arguments `
            -Wait `
            -PassThru

          Write-Host ""
          Write-Host "MetaEditor exit code: $($compile.ExitCode)"
          Write-Host ""

          if (Test-Path $log) {
            Write-Host "========================================"
            Write-Host "             COMPILER LOG"
            Write-Host "========================================"
            Get-Content $log
            Write-Host ""
          }

          if (-not (Test-Path $ex5)) {
            throw "Compilation failed: EX5 was not created."
          }

          $info = Get-Item $ex5

          if ($info.Length -le 0) {
            throw "EX5 was created but is empty."
          }

          Write-Host "========================================"
          Write-Host "          COMPILATION SUCCESS"
          Write-Host "========================================"
          Write-Host "EX5: $ex5"
          Write-Host "Size: $($info.Length) bytes"

          "KINGSBOT_EX5=$ex5" | Out-File `
            $env:GITHUB_ENV `
            -Encoding utf8

      - name: Stage artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $artifact = Join-Path `
            $env:GITHUB_WORKSPACE `
            "artifact"

          if (Test-Path $artifact) {
            Remove-Item $artifact -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $artifact `
            -Force | Out-Null

          if (-not $env:KINGSBOT_EX5) {
            throw "KINGSBOT_EX5 is missing."
          }

          Copy-Item `
            $env:KINGSBOT_EX5 `
            (Join-Path `
              $artifact `
              "KingsBot_Phase6_Integration.ex5") `
            -Force

          Get-ChildItem $artifact

      - name: Upload King's Bot artifact
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-Phase6-EX5
          path: artifact/KingsBot_Phase6_Integration.ex5
          if-no-files-found: error
          overwrite: true
