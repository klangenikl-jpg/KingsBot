name: King's Bot

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.mq5'
      - '**/*.mqh'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build:
    name: Build King's Bot
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout King's Bot
        uses: actions/checkout@v4

      - name: Locate MetaEditor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $paths = @(
            'C:\Program Files\MetaTrader 5\MetaEditor64.exe',
            'C:\Program Files (x86)\MetaTrader 5\MetaEditor64.exe'
          )

          $metaEditor = $null

          foreach ($path in $paths) {
            if (Test-Path -LiteralPath $path) {
              $metaEditor = $path
              break
            }
          }

          if (-not $metaEditor) {
            $metaEditor = Get-ChildItem `
              -Path 'C:\Program Files','C:\Program Files (x86)' `
              -Filter 'MetaEditor64.exe' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }

          if (-not $metaEditor) {
            throw 'MetaEditor64.exe was not found on the runner.'
          }

          $metaEditor = (Resolve-Path -LiteralPath $metaEditor).Path
          $metaDir = Split-Path -Parent $metaEditor

          Write-Host "MetaEditor: $metaEditor"
          Write-Host "Directory:   $metaDir"

          $version = (Get-Item -LiteralPath $metaEditor).VersionInfo.FileVersion

          Write-Host "Version:     $version"

          "METAEDITOR=$metaEditor" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

          "METAEDITOR_DIR=$metaDir" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

      - name: Prepare King's Bot source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $root = Join-Path $env:RUNNER_TEMP 'KingsBot-MQL5'
          $experts = Join-Path $root 'Experts\KingsBot'
          $include = Join-Path $root 'Include'
          $artifacts = Join-Path $env:RUNNER_TEMP 'KingsBot-artifacts'

          New-Item `
            -ItemType Directory `
            -Path $experts `
            -Force | Out-Null

          New-Item `
            -ItemType Directory `
            -Path $include `
            -Force | Out-Null

          New-Item `
            -ItemType Directory `
            -Path $artifacts `
            -Force | Out-Null

          $files = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Recurse `
            -File `
            -Include '*.mq5','*.mqh' `
            -ErrorAction SilentlyContinue

          if (-not $files) {
            throw 'No MQL5 source files were found in the repository.'
          }

          foreach ($file in $files) {
            $relative = $file.FullName.Substring(
              $env:GITHUB_WORKSPACE.Length
            ).TrimStart('\')

            $destination = Join-Path $experts $relative
            $destinationDir = Split-Path -Parent $destination

            New-Item `
              -ItemType Directory `
              -Path $destinationDir `
              -Force | Out-Null

            Copy-Item `
              -LiteralPath $file.FullName `
              -Destination $destination `
              -Force
          }

          $main = Get-ChildItem `
            -Path $experts `
            -Recurse `
            -Filter 'KingsBot_Phase6_Integration.mq5' `
            -File `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $main) {
            throw 'KingsBot_Phase6_Integration.mq5 was not found.'
          }

          "MQL5_ROOT=$root" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

          "KINGSBOT_SOURCE=$($main.FullName)" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

          "ARTIFACT_DIR=$artifacts" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

          Write-Host "MQL5 root: $root"
          Write-Host "Source:    $($main.FullName)"

      - name: Locate standard MQL5 library
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $targetInclude = Join-Path `
            $env:MQL5_ROOT `
            'Include'

          $targetTrade = Join-Path `
            $targetInclude `
            'Trade\Trade.mqh'

          New-Item `
            -ItemType Directory `
            -Path $targetInclude `
            -Force | Out-Null

          $roots = @(
            (Join-Path $env:METAEDITOR_DIR 'MQL5\Include'),
            'C:\Program Files\MetaTrader 5\MQL5\Include',
            'C:\Program Files (x86)\MetaTrader 5\MQL5\Include'
          )

          $sourceInclude = $null

          foreach ($root in $roots) {
            if (Test-Path -LiteralPath $root) {
              $candidate = Join-Path `
                $root `
                'Trade\Trade.mqh'

              if (Test-Path -LiteralPath $candidate) {
                $sourceInclude = $root
                break
              }
            }
          }

          if (-not $sourceInclude) {
            $candidate = Get-ChildItem `
              -Path 'C:\Program Files','C:\Program Files (x86)' `
              -Filter 'Trade.mqh' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.FullName -match '\\MQL5\\Include\\Trade\\Trade\.mqh$'
              } |
              Select-Object -First 1

            if ($candidate) {
              $sourceInclude = Split-Path `
                -Parent `
                (Split-Path -Parent $candidate.FullName)
            }
          }

          if (-not $sourceInclude) {
            throw 'Standard MQL5 Include\Trade\Trade.mqh was not found.'
          }

          Write-Host "Standard include: $sourceInclude"

          Copy-Item `
            -Path (Join-Path $sourceInclude '*') `
            -Destination $targetInclude `
            -Recurse `
            -Force

          if (-not (Test-Path -LiteralPath $targetTrade)) {
            throw 'Trade.mqh was not copied into the build include tree.'
          }

          Write-Host "Trade.mqh verified:"
          Write-Host $targetTrade

      - name: Compile King's Bot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $source = $env:KINGSBOT_SOURCE
          $sourceDir = Split-Path -Parent $source

          $log = Join-Path `
            $sourceDir `
            'KingsBot_compile.log'

          $expectedEx5 = [System.IO.Path]::ChangeExtension(
            $source,
            '.ex5'
          )

          if (Test-Path -LiteralPath $log) {
            Remove-Item -LiteralPath $log -Force
          }

          if (Test-Path -LiteralPath $expectedEx5) {
            Remove-Item -LiteralPath $expectedEx5 -Force
          }

          $arguments = @(
            '/portable',
            "/compile:$source",
            "/inc:$env:MQL5_ROOT",
            "/log:$log"
          )

          Write-Host "MetaEditor: $env:METAEDITOR"
          Write-Host "Source:     $source"
          Write-Host "Include:    $env:MQL5_ROOT"
          Write-Host "Log:        $log"

          $process = Start-Process `
            -FilePath $env:METAEDITOR `
            -ArgumentList $arguments `
            -WorkingDirectory $env:METAEDITOR_DIR `
            -Wait `
            -PassThru

          Write-Host "MetaEditor exit code: $($process.ExitCode)"

          Start-Sleep -Seconds 2

          if (Test-Path -LiteralPath $log) {
            Write-Host '===== COMPILER LOG ====='
            Get-Content -LiteralPath $log
          }
          else {
            Write-Warning 'MetaEditor did not create a compiler log.'
          }

          if (-not (Test-Path -LiteralPath $expectedEx5)) {
            throw "King's Bot compilation failed. No EX5 was produced."
          }

          Copy-Item `
            -LiteralPath $expectedEx5 `
            -
