name: Build King's Bot

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build King's Bot
    runs-on: windows-latest

    steps:
      - name: Checkout King's Bot
        uses: actions/checkout@v4

      - name: Locate MetaEditor
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "LOCATING METATRADER 5"
          Write-Host "========================================="

          $searchRoots = @(
            "C:\Program Files",
            "C:\Program Files (x86)",
            "$env:LOCALAPPDATA"
          )

          $metaEditor = $null

          foreach ($root in $searchRoots) {
            if (-not (Test-Path $root)) {
              continue
            }

            Write-Host "Searching: $root"

            $found = Get-ChildItem `
              -Path $root `
              -Filter "metaeditor64.exe" `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if ($found) {
              $metaEditor = $found.FullName
              break
            }
          }

          if (-not $metaEditor) {
            Write-Host "MetaEditor not found."
            Write-Host "Downloading MetaTrader 5..."

            $installer = Join-Path `
              $env:RUNNER_TEMP `
              "mt5setup.exe"

            Invoke-WebRequest `
              -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" `
              -OutFile $installer

            if (-not (Test-Path $installer)) {
              throw "MetaTrader 5 installer was not downloaded."
            }

            $process = Start-Process `
              -FilePath $installer `
              -ArgumentList "/auto" `
              -Wait `
              -PassThru

            Write-Host "Installer exit code: $($process.ExitCode)"

            Start-Sleep -Seconds 5

            foreach ($root in $searchRoots) {
              if (-not (Test-Path $root)) {
                continue
              }

              $found = Get-ChildItem `
                -Path $root `
                -Filter "metaeditor64.exe" `
                -File `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

              if ($found) {
                $metaEditor = $found.FullName
                break
              }
            }
          }

          if (-not $metaEditor) {
            throw "MetaEditor64.exe could not be located."
          }

          Write-Host ""
          Write-Host "MetaEditor:"
          Write-Host $metaEditor

          "METAEDITOR_PATH=$metaEditor" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      - name: Prepare King's Bot source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "PREPARING KING'S BOT SOURCE"
          Write-Host "========================================="

          $workspace = $env:GITHUB_WORKSPACE
          $buildRoot = Join-Path `
            $env:RUNNER_TEMP `
            "KingsBot-MT5"

          $expertRoot = Join-Path `
            $buildRoot `
            "MQL5\Experts\KingsBot"

          New-Item `
            -ItemType Directory `
            -Path $expertRoot `
            -Force |
            Out-Null

          $source = Get-ChildItem `
            -Path $workspace `
            -Filter "KingsBot_Phase6_Integration.mq5" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $source) {
            throw "KingsBot_Phase6_Integration.mq5 was not found."
          }

          Write-Host ""
          Write-Host "Source found:"
          Write-Host $source.FullName

          Copy-Item `
            -Path $source.FullName `
            -Destination (Join-Path $expertRoot $source.Name) `
            -Force

          $sourceDirectory = $source.Directory.FullName

          $includeFiles = Get-ChildItem `
            -Path $sourceDirectory `
            -Filter "*.mqh" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue

          foreach ($file in $includeFiles) {
            $relative = $file.FullName.Substring(
              $sourceDirectory.Length
            ).TrimStart('\')

            $destination = Join-Path `
              $expertRoot `
              $relative

            $destinationDirectory = Split-Path `
              $destination `
              -Parent

            New-Item `
              -ItemType Directory `
              -Path $destinationDirectory `
              -Force |
              Out-Null

            Copy-Item `
              -Path $file.FullName `
              -Destination $destination `
              -Force
          }

          Write-Host ""
          Write-Host "Prepared source tree:"
          Get-ChildItem `
            -Path $expertRoot `
            -Recurse `
            -File |
            ForEach-Object {
              Write-Host " - $($_.FullName)"
            }

          "KING_BUILD_ROOT=$buildRoot" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          "KING_EXPERT_ROOT=$expertRoot" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      - name: Remove unsupported MQL5 preprocessor directives
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = $env:KING_EXPERT_ROOT

          if (-not (Test-Path $root)) {
            throw "King's Bot source directory was not found."
          }

          Write-Host "========================================="
          Write-Host "CLEANING MQL5 PREPROCESSOR DIRECTIVES"
          Write-Host "========================================="

          $files = Get-ChildItem `
            -Path $root `
            -Recurse `
            -File |
            Where-Object {
              $_.Extension -eq ".mq5" -or
              $_.Extension -eq ".mqh"
            }

          foreach ($file in $files) {
            $lines = Get-Content `
              -LiteralPath $file.FullName

            $changed = $false
            $output = New-Object System.Collections.Generic.List[string]

            foreach ($line in $lines) {
              if ($line.Trim() -match '^#pragma\s+once\s*$') {
                Write-Host "Removing #pragma once:"
                Write-Host $file.FullName
                $changed = $true
                continue
              }

              $output.Add($line)
            }

            if ($changed) {
              Set-Content `
                -LiteralPath $file.FullName `
                -Value $output `
                -Encoding utf8
            }
          }

          Write-Host ""
          Write-Host "Preprocessor cleanup completed."

      - name: Compile King's Bot
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "COMPILING KING'S BOT"
          Write-Host "========================================="

          $metaEditor = $env:METAEDITOR_PATH

          $source = Join-Path `
            $env:KING_EXPERT_ROOT `
            "KingsBot_Phase6_Integration.mq5"

          if (-not (Test-Path $metaEditor)) {
            throw "MetaEditor was not found: $metaEditor"
          }

          if (-not (Test-Path $source)) {
            throw "King's Bot source was not found: $source"
          }

          $sourceDirectory = Split-Path `
            $source `
            -Parent

          $compileLog = Join-Path `
            $env:RUNNER_TEMP `
            "KingsBot_compile.log"

          if (Test-Path $compileLog) {
            Remove-Item `
              -Path $compileLog `
              -Force
          }

          Write-Host ""
          Write-Host "MetaEditor:"
          Write-Host $metaEditor

          Write-Host ""
          Write-Host "Source:"
          Write-Host $source

          Write-Host ""
          Write-Host "Source directory:"
          Write-Host $sourceDirectory

          Write-Host ""
          Write-Host "Starting MetaEditor compiler..."

          & $metaEditor `
            "/portable" `
            "/compile:$source" `
            "/log"

          $exitCode = $LASTEXITCODE

          Write-Host ""
          Write-Host "MetaEditor exit code: $exitCode"

          Start-Sleep -Seconds 3

          Write-Host ""
          Write-Host "========================================="
          Write-Host "SEARCHING FOR COMPILER LOGS"
          Write-Host "========================================="

          $logs = Get-ChildItem `
            -Path $env:RUNNER_TEMP `
            -Filter "*.log" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue

          if ($logs) {
            foreach ($log in $logs) {
              Write-Host ""
              Write-Host "LOG: $($log.FullName)"
              Write-Host "-----------------------------------------"
              Get-Content -LiteralPath $log.FullName
            }
          }
          else {
            Write-Host "No compiler log found in RUNNER_TEMP."
          }

          Write-Host ""
          Write-Host "========================================="
          Write-Host "SEARCHING FOR EX5 FILES"
          Write-Host "========================================="

          $ex5Files = Get-ChildItem `
            -Path $env:RUNNER_TEMP `
            -Filter "*.ex5" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue

          if ($ex5Files) {
            foreach ($file in $ex5Files) {
              Write-Host ""
              Write-Host "EX5 FOUND:"
              Write-Host $file.FullName
              Write-Host "Size: $($file.Length) bytes"
            }
          }
          else {
            Write-Host "No EX5 files found in RUNNER_TEMP."
          }

          if ($exitCode -ne 0) {
            throw "MetaEditor process returned exit code $exitCode."
          }

      - name: Locate compiled King's Bot EX5
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "LOCATING COMPILED KING'S BOT EX5"
          Write-Host "========================================="

          $targetName = "KingsBot_Phase6_Integration.ex5"

          $searchRoots = @(
            $env:KING_BUILD_ROOT,
            $env:RUNNER_TEMP,
            $env:GITHUB_WORKSPACE
          )

          $matches = @()

          foreach ($root in $searchRoots) {
            if (-not $root) {
              continue
            }

            if (-not (Test-Path $root)) {
              continue
            }

            Write-Host ""
            Write-Host "Searching:"
            Write-Host $root

            $found = Get-ChildItem `
              -Path $root `
              -Filter $targetName `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue

            if ($found) {
              $matches += $found
            }
          }

          $ex5 = $matches |
            Sort-Object FullName -Unique |
            Select-Object -First 1

          if (-not $ex5) {
            Write-Host ""
            Write-Host "========================================="
            Write-Host "NO KING'S BOT EX5 FOUND"
            Write-Host "========================================="

            Write-Host ""
            Write-Host "All EX5 files found anywhere in runner temp:"

            Get-ChildItem `
              -Path $env:RUNNER_TEMP `
              -Filter "*.ex5" `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              ForEach-Object {
                Write-Host $_.FullName
              }

            throw "KingsBot_Phase6_Integration.ex5 was not found."
          }

          if ($ex5.Length -le 0) {
            throw "The EX5 file was found but is empty."
          }

          Write-Host ""
          Write-Host "========================================="
          Write-Host "KING'S BOT EX5 FOUND"
          Write-Host "========================================="

          Write-Host "Path:"
          Write-Host $ex5.FullName

          Write-Host ""
          Write-Host "Size:"
          Write-Host "$($ex5.Length) bytes"

          $artifactRoot = Join-Path `
            $env:GITHUB_WORKSPACE `
            "build-artifacts"

          New-Item `
            -ItemType Directory `
            -Path $artifactRoot `
            -Force |
            Out-Null

          $artifactEx5 = Join-Path `
            $artifactRoot `
            "KingsBot_Phase6_Integration.ex5"

          Copy-Item `
            -Path $ex5.FullName `
            -Destination $artifactEx5 `
            -Force

          "EX5_PATH=$artifactEx5" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          Write-Host ""
          Write-Host "Artifact prepared:"
          Write-Host $artifactEx5

      - name: Copy compilation logs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $artifactRoot = Join-Path `
            $env:GITHUB_WORKSPACE `
            "build-artifacts"

          if (-not (Test-Path $artifactRoot)) {
            throw "Artifact directory was not created."
          }

          $logs = Get-ChildItem `
            -Path $env:RUNNER_TEMP `
            -Filter "*.log" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue

          foreach ($log in $logs) {
            $destination = Join-Path `
              $artifactRoot `
              $log.Name

            Copy-Item `
              -Path $log.FullName `
              -Destination $destination `
              -Force
          }

          Write-Host ""
          Write-Host "Final artifact contents:"

          Get-ChildItem `
            -Path $artifactRoot `
            -File |
            ForEach-Object {
              Write-Host " - $($_.Name) : $($_.Length) bytes"
            }

      - name: Upload King's Bot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-EX5
          path: build-artifacts
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "========================================="
          Write-Host "KING'S BOT BUILD COMPLETE"
          Write-Host "========================================="
          Write-Host ""
          Write-Host "Artifact: KingsBot-EX5"
          Write-Host "Expected file: KingsBot_Phase6_Integration.ex5"
          Write-Host ""
          Write-Host "BUILD SUCCESSFUL"
