name: Build King's Bot

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build King's Bot
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Checkout King's Bot
        uses: actions/checkout@v4

      - name: Locate or install MetaEditor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host '========================================='
          Write-Host 'LOCATING METATRADER 5 / METAEDITOR'
          Write-Host '========================================='

          $knownPaths = @(
            'C:\Program Files\MetaTrader 5\MetaEditor64.exe',
            'C:\Program Files (x86)\MetaTrader 5\MetaEditor64.exe',
            'C:\Program Files\MetaTrader 5\MetaEditor.exe',
            'C:\Program Files (x86)\MetaTrader 5\MetaEditor.exe'
          )

          $metaEditorPath = $null

          foreach ($path in $knownPaths) {
            if (Test-Path $path) {
              $metaEditorPath = $path
              break
            }
          }

          if (-not $metaEditorPath) {
            Write-Host 'MetaEditor not found in standard locations.'
            Write-Host 'Downloading official MetaTrader 5 installer...'

            $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'

            Invoke-WebRequest `
              -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' `
              -OutFile $installer `
              -UseBasicParsing

            if (-not (Test-Path $installer)) {
              throw 'MetaTrader 5 installer download failed.'
            }

            Write-Host 'Starting MT5 installer...'

            $job = Start-Job -ScriptBlock {
              param($installerPath)
              & $installerPath /auto
            } -ArgumentList $installer

            $finished = Wait-Job $job -Timeout 90

            if (-not $finished) {
              Stop-Job $job -ErrorAction SilentlyContinue
              Remove-Job $job -Force -ErrorAction SilentlyContinue
              throw 'MetaTrader 5 installer exceeded the 90-second timeout.'
            }

            Receive-Job $job -ErrorAction SilentlyContinue
            Remove-Job $job -Force -ErrorAction SilentlyContinue

            Start-Sleep -Seconds 5

            foreach ($path in $knownPaths) {
              if (Test-Path $path) {
                $metaEditorPath = $path
                break
              }
            }
          }

          if (-not $metaEditorPath) {
            throw 'MetaEditor64.exe was not found after MT5 installation.'
          }

          Write-Host "MetaEditor found:"
          Write-Host $metaEditorPath

          $metaEditorDir = Split-Path $metaEditorPath -Parent

          $mt5Root = Join-Path $metaEditorDir 'MQL5'

          if (-not (Test-Path $mt5Root)) {
            throw "MQL5 directory was not found beside MetaEditor: $mt5Root"
          }

          Write-Host "MQL5 root:"
          Write-Host $mt5Root

          "METAEDITOR_PATH=$metaEditorPath" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "MT5_MQL5_ROOT=$mt5Root" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Prepare King's Bot source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host '========================================='
          Write-Host "PREPARING KING'S BOT SOURCE"
          Write-Host '========================================='

          $source = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter 'KingsBot_Phase6_Integration.mq5' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $source) {
            throw 'KingsBot_Phase6_Integration.mq5 was not found.'
          }

          $expertsDir = Join-Path `
            $env:MT5_MQL5_ROOT `
            'Experts\KingsBot'

          New-Item `
            -ItemType Directory `
            -Path $expertsDir `
            -Force |
            Out-Null

          $targetSource = Join-Path `
            $expertsDir `
            'KingsBot_Phase6_Integration.mq5'

          Copy-Item `
            -Path $source.FullName `
            -Destination $targetSource `
            -Force

          Write-Host "Source copied to:"
          Write-Host $targetSource

          $repoMql5 = Join-Path `
            $env:GITHUB_WORKSPACE `
            'KingsBot-MQL5'

          if (Test-Path $repoMql5) {
            Write-Host 'Copying project MQL5 files...'

            Get-ChildItem `
              -Path $repoMql5 `
              -File `
              -Recurse |
              ForEach-Object {

                $relative = $_.FullName.Substring(
                  $repoMql5.Length
                ).TrimStart('\')

                $destination = Join-Path `
                  $env:MT5_MQL5_ROOT `
                  $relative

                $parent = Split-Path `
                  $destination `
                  -Parent

                New-Item `
                  -ItemType Directory `
                  -Path $parent `
                  -Force |
                  Out-Null

                Copy-Item `
                  -Path $_.FullName `
                  -Destination $destination `
                  -Force
              }
          }

          "KINGSBOT_SOURCE=$targetSource" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify standard MQL5 library
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host '========================================='
          Write-Host 'VERIFYING STANDARD MQL5 LIBRARY'
          Write-Host '========================================='

          $trade = Join-Path `
            $env:MT5_MQL5_ROOT `
            'Include\Trade\Trade.mqh'

          if (Test-Path $trade) {
            Write-Host "Trade.mqh found:"
            Write-Host $trade
          }
          else {
            Write-Host 'Trade.mqh was not found in the installed MT5 MQL5 tree.'

            Write-Host 'Searching only standard MT5 installation locations...'

            $tradeCandidates = @(
              'C:\Program Files\MetaTrader 5\MQL5\Include\Trade\Trade.mqh',
              'C:\Program Files (x86)\MetaTrader 5\MQL5\Include\Trade\Trade.mqh'
            )

            foreach ($candidate in $tradeCandidates) {
              if (Test-Path $candidate) {
                $trade = $candidate
                break
              }
            }

            if (-not (Test-Path $trade)) {
              throw 'Standard MQL5 Include\Trade\Trade.mqh was not found.'
            }
          }

          Write-Host "Verified Trade.mqh:"
          Write-Host $trade

      - name: Compile King's Bot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host '========================================='
          Write-Host "COMPILING KING'S BOT"
          Write-Host '========================================='

          $source = $env:KINGSBOT_SOURCE
          $sourceDir = Split-Path $source -Parent
          $log = [System.IO.Path]::ChangeExtension(
            $source,
            '.log'
          )
          $ex5 = [System.IO.Path]::ChangeExtension(
            $source,
            '.ex5'
          )

          if (-not (Test-Path $source)) {
            throw "Source file does not exist: $source"
          }

          if (Test-Path $log) {
            Remove-Item $log -Force
          }

          if (Test-Path $ex5) {
            Remove-Item $ex5 -Force
          }

          Write-Host "MetaEditor:"
          Write-Host $env:METAEDITOR_PATH

          Write-Host "Source:"
          Write-Host $source

          Write-Host "MQL5 root:"
          Write-Host $env:MT5_MQL5_ROOT

          Write-Host 'Starting MetaEditor compiler...'

          Push-Location $sourceDir

          try {
            & $env:METAEDITOR_PATH `
              "/compile:$source" `
              "/include:$env:MT5_MQL5_ROOT" `
              '/log'

            $metaExit = $LASTEXITCODE
          }
          finally {
            Pop-Location
          }

          Write-Host "MetaEditor exit code: $metaExit"

          Start-Sleep -Seconds 3

          Write-Host 'Checking compiler output...'

          if (Test-Path $log) {
            Write-Host '========================================='
            Write-Host 'COMPILER LOG'
            Write-Host '========================================='
            Get-Content $log
            Write-Host '========================================='
          }
          else {
            Write-Host 'No source-side compiler log was produced.'
          }

          if (Test-Path $ex5) {
            Write-Host "EX5 successfully produced:"
            Write-Host $ex5

            "EX5_PATH=$ex5" |
              Out-File $env:GITHUB_ENV -Append -Encoding utf8
          }
          else {
            Write-Host 'No EX5 was produced.'

            $nearbyLogs = Get-ChildItem `
              -Path $sourceDir `
              -Filter '*.log' `
              -File `
              -ErrorAction SilentlyContinue

            if ($nearbyLogs) {
              Write-Host 'Available compiler logs:'

              foreach ($file in $nearbyLogs) {
                Write-Host $file.FullName
                Get-Content $file.FullName
              }
            }

            throw "King's Bot compilation did not produce an EX5. MetaEditor exit code: $metaExit"
          }

      - name: Prepare King's Bot artifact
        if: success()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $artifactDir = Join-Path `
            $env:RUNNER_TEMP `
            'KingsBot-artifact'

          New-Item `
            -ItemType Directory `
            -Path $artifactDir `
            -Force |
            Out-Null

          Copy-Item `
            -Path $env:EX5_PATH `
            -Destination $artifactDir `
            -Force

          Copy-Item `
            -Path $env:KINGSBOT_SOURCE `
            -Destination $artifactDir `
            -Force

          "ARTIFACT_DIR=$artifactDir" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload King's Bot artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-build
          path: ${{ env.ARTIFACT_DIR }}
          if-no-files-found: error
          retention-days: 14
