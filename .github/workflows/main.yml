name: Build King's Bot

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build King's Bot
    runs-on: windows-latest

    steps:
      - name: Checkout King's Bot
        uses: actions/checkout@v4

      - name: Locate or install MetaEditor
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "LOCATING METAEDITOR"
          Write-Host "========================================="

          $metaEditor = $null

          $searchRoots = @(
            "C:\Program Files",
            "C:\Program Files (x86)",
            "C:\MT5",
            "$env:LOCALAPPDATA",
            "$env:APPDATA"
          )

          foreach ($root in $searchRoots) {
            if (-not (Test-Path $root)) {
              continue
            }

            Write-Host "Searching: $root"

            $found = Get-ChildItem `
              -Path $root `
              -Filter "metaeditor64.exe" `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if ($found) {
              $metaEditor = $found.FullName
              break
            }
          }

          if (-not $metaEditor) {
            Write-Host "MetaEditor not found."
            Write-Host "Downloading official MetaTrader 5 installer."

            $installer = Join-Path `
              $env:RUNNER_TEMP `
              "mt5setup.exe"

            Invoke-WebRequest `
              -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" `
              -OutFile $installer

            if (-not (Test-Path $installer)) {
              throw "MetaTrader 5 installer download failed."
            }

            $process = Start-Process `
              -FilePath $installer `
              -ArgumentList "/auto" `
              -Wait `
              -PassThru

            Write-Host "Installer exit code: $($process.ExitCode)"

            Start-Sleep -Seconds 5

            foreach ($root in $searchRoots) {
              if (-not (Test-Path $root)) {
                continue
              }

              $found = Get-ChildItem `
                -Path $root `
                -Filter "metaeditor64.exe" `
                -File `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

              if ($found) {
                $metaEditor = $found.FullName
                break
              }
            }
          }

          if (-not $metaEditor) {
            throw "MetaEditor64.exe could not be located."
          }

          Write-Host ""
          Write-Host "METAEDITOR FOUND:"
          Write-Host $metaEditor

          "METAEDITOR_PATH=$metaEditor" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      - name: Prepare King's Bot build tree
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "PREPARING KING'S BOT BUILD TREE"
          Write-Host "========================================="

          $workspace = $env:GITHUB_WORKSPACE
          $buildRoot = Join-Path `
            $env:RUNNER_TEMP `
            "KingsBotBuild"

          $expertRoot = Join-Path `
            $buildRoot `
            "MQL5\Experts\KingsBot"

          New-Item `
            -ItemType Directory `
            -Path $expertRoot `
            -Force |
            Out-Null

          $source = Get-ChildItem `
            -Path $workspace `
            -Filter "KingsBot_Phase6_Integration.mq5" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $source) {
            throw "KingsBot_Phase6_Integration.mq5 was not found in the repository."
          }

          Write-Host ""
          Write-Host "SOURCE:"
          Write-Host $source.FullName

          Copy-Item `
            -LiteralPath $source.FullName `
            -Destination (Join-Path `
              $expertRoot `
              "KingsBot_Phase6_Integration.mq5") `
            -Force

          $repoMqhFiles = Get-ChildItem `
            -Path $workspace `
            -Filter "*.mqh" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue

          if (-not $repoMqhFiles) {
            Write-Host "No MQH files found."
          }

          foreach ($file in $repoMqhFiles) {
            $relative = $file.FullName.Substring(
              $workspace.Length
            ).TrimStart('\')

            $destination = Join-Path `
              $expertRoot `
              $relative

            $destinationDirectory = Split-Path `
              $destination `
              -Parent

            New-Item `
              -ItemType Directory `
              -Path $destinationDirectory `
              -Force |
              Out-Null

            Copy-Item `
              -LiteralPath $file.FullName `
              -Destination $destination `
              -Force
          }

          Write-Host ""
          Write-Host "BUILD TREE:"
          Get-ChildItem `
            -Path $buildRoot `
            -Recurse `
            -File |
            ForEach-Object {
              Write-Host $_.FullName
            }

          "KING_BUILD_ROOT=$buildRoot" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          "KING_EXPERT_ROOT=$expertRoot" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      - name: Compile King's Bot
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "========================================="
          Write-Host "COMPILING KING'S BOT"
          Write-Host "========================================="

          $metaEditor = $env:METAEDITOR_PATH

          $source = Join-Path `
            $env:KING_EXPERT_ROOT `
            "KingsBot_Phase6_Integration.mq5"

          $log = Join-Path `
            $env:KING_EXPERT_ROOT `
            "KingsBot_Phase6_Integration.log"

          if (-not (Test-Path $source)) {
            throw "Source file not found: $source"
          }

          if (Test-Path $log) {
            Remove-Item `
              -LiteralPath $log `
              -Force
          }

          Write-Host ""
          Write-Host "MetaEditor:"
          Write-Host $metaEditor

          Write-Host ""
          Write-Host "Source:"
          Write-Host $source

          Write-Host ""
          Write-Host "Starting MetaEditor compiler..."

          $arguments = @(
            "/compile:$source"
            "/log"
          )

          $process = Start-Process `
            -FilePath $metaEditor `
            -ArgumentList $arguments `
            -Wait `
            -PassThru `
            -WindowStyle Hidden

          Write-Host ""
          Write-Host "MetaEditor process exit code: $($process.ExitCode)"

          Start-Sleep -Seconds 3

          Write-Host ""
          Write-Host "========================================="
          Write-Host "COMPILER LOG"
          Write-Host "========================================="

          if (Test-Path $log) {
            Get-Content `
              -LiteralPath $log |
              ForEach-Object {
                Write-Host $_
              }
          }
          else {
            Write-Host "Compiler log was not created."
          }

          Write-Host ""
          Write-Host "========================================="
          Write-Host "SEARCHING FOR EX5"
          Write-Host "========================================="

          $ex5 = Get-ChildItem `
            -Path $env:KING_BUILD_ROOT `
            -Filter "KingsBot_Phase6_Integration.ex5" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($ex5) {
            Write-Host ""
            Write-Host "EX5 CREATED:"
            Write-Host $ex5.FullName
            Write-Host "SIZE: $($ex5.Length) bytes"

            "EX5_PATH=$($ex5.FullName)" |
              Out-File `
                -FilePath $env:GITHUB_ENV `
                -Append `
                -Encoding utf8
          }
          else {
            Write-Host ""
            Write-Host "EX5 WAS NOT CREATED."

            Write-Host ""
            Write-Host "ALL FILES IN BUILD TREE:"

            Get-ChildItem `
              -Path $env:KING_BUILD_ROOT `
              -Recurse `
              -File |
              ForEach-Object {
                Write-Host $_.FullName
              }

            exit 1
          }

      - name: Stage King's Bot artifacts
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "STAGING BUILD ARTIFACTS"
          Write-Host "========================================="

          $artifactRoot = Join-Path `
            $env:GITHUB_WORKSPACE `
            "build-artifacts"

          New-Item `
            -ItemType Directory `
            -Path $artifactRoot `
            -Force |
            Out-Null

          if ($env:EX5_PATH -and (Test-Path $env:EX5_PATH)) {
            Copy-Item `
              -LiteralPath $env:EX5_PATH `
              -Destination (Join-Path `
                $artifactRoot `
                "KingsBot_Phase6_Integration.ex5") `
              -Force
          }

          $log = Join-Path `
            $env:KING_EXPERT_ROOT `
            "KingsBot_Phase6_Integration.log"

          if (Test-Path $log) {
            Copy-Item `
              -LiteralPath $log `
              -Destination (Join-Path `
                $artifactRoot `
                "KingsBot_Phase6_Integration.log") `
              -Force
          }

          Write-Host ""
          Write-Host "ARTIFACT DIRECTORY:"

          Get-ChildItem `
            -Path $artifactRoot `
            -File |
            ForEach-Object {
              Write-Host "$($_.Name) - $($_.Length) bytes"
            }

      - name: Upload King's Bot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-build
          path: build-artifacts
          if-no-files-found: warn
          retention-days: 14

      - name: Final build verification
        shell: pwsh
        run: |
          if (-not $env:EX5_PATH) {
            throw "King's Bot EX5 was not created."
          }

          if (-not (Test-Path $env:EX5_PATH)) {
            throw "King's Bot EX5 path is invalid."
          }

          Write-Host ""
          Write-Host "========================================="
          Write-Host "KING'S BOT BUILD VERIFIED"
          Write-Host "========================================="
          Write-Host "EX5: $env:EX5_PATH"
          Write-Host "Size: $((Get-Item $env:EX5_PATH).Length) bytes"
          Write-Host ""
          Write-Host "Artifact: KingsBot-build"
