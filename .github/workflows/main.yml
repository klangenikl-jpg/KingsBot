name: King's Bot - Phase 6 Final Validation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase6-validation:
    name: Phase 6 Final Build and MT5 Validation
    runs-on: windows-latest
    timeout-minutes: 45

    env:
      SOURCE_NAME: KingsBot_Phase6_Integration.mq5
      MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
      MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
      MT5_SERVER: ${{ secrets.MT5_SERVER }}

    steps:

      - name: Checkout King's Bot
        uses: actions/checkout@v6

      - name: Build compile test and collect evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $evidence = Join-Path $env:GITHUB_WORKSPACE 'phase6-validation-evidence'

          New-Item `
            -ItemType Directory `
            -Path $evidence `
            -Force | Out-Null

          Write-Host '=========================================='
          Write-Host " KINGS BOT PHASE 6 FINAL VALIDATION"
          Write-Host '=========================================='

          # ------------------------------------------------------------
          # 1. LOCATE SOURCE
          # ------------------------------------------------------------

          Write-Host '=== VERIFY PHASE 6 SOURCE ==='

          $source = Join-Path `
            $env:GITHUB_WORKSPACE `
            $env:SOURCE_NAME

          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {

            $source = Get-ChildItem `
              -Path $env:GITHUB_WORKSPACE `
              -Recurse `
              -File `
              -Filter $env:SOURCE_NAME `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }

          if (-not $source) {
            throw "Required source file '$env:SOURCE_NAME' was not found."
          }

          Write-Host "Phase 6 source: $source"

          Copy-Item `
            -LiteralPath $source `
            -Destination $evidence `
            -Force

          # ------------------------------------------------------------
          # 2. VERIFY MT5 ACCOUNT SECRETS
          # ------------------------------------------------------------

          Write-Host '=== VERIFY MT5 ACCOUNT CONFIGURATION ==='

          if ([string]::IsNullOrWhiteSpace($env:MT5_LOGIN)) {
            throw 'MT5_LOGIN GitHub secret is missing.'
          }

          if ([string]::IsNullOrWhiteSpace($env:MT5_PASSWORD)) {
            throw 'MT5_PASSWORD GitHub secret is missing.'
          }

          if ([string]::IsNullOrWhiteSpace($env:MT5_SERVER)) {
            throw 'MT5_SERVER GitHub secret is missing.'
          }

          Write-Host 'MT5 account configuration is present.'
          Write-Host 'Password will not be printed.'

          # ------------------------------------------------------------
          # 3. INSTALL MT5
          # ------------------------------------------------------------

          Write-Host '=== INSTALL METATRADER 5 ==='

          $installer = Join-Path `
            $env:RUNNER_TEMP `
            'mt5setup.exe'

          $mt5InstallRoot = Join-Path `
            $env:RUNNER_TEMP `
            'KingsBot-MT5'

          Invoke-WebRequest `
            -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' `
            -OutFile $installer

          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw 'MetaTrader 5 installer was not downloaded.'
          }

          if (Test-Path -LiteralPath $mt5InstallRoot) {

            Remove-Item `
              -LiteralPath $mt5InstallRoot `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $mt5InstallRoot `
            -Force | Out-Null

          $install = Start-Process `
            -FilePath $installer `
            -ArgumentList @(
              '/auto'
              "/path:$mt5InstallRoot"
            ) `
            -Wait `
            -PassThru

          Write-Host "MT5 installer exit code: $($install.ExitCode)"

          if ($install.ExitCode -ne 0) {
            throw "MetaTrader 5 installer failed with exit code $($install.ExitCode)."
          }

          # ------------------------------------------------------------
          # 4. LOCATE MT5 EXECUTABLES
          # ------------------------------------------------------------

          Write-Host '=== LOCATE MT5 TERMINAL AND METAEDITOR ==='

          $searchRoots = @(
            $mt5InstallRoot
            'C:\Program Files'
            'C:\Program Files (x86)'
            (Join-Path $env:LOCALAPPDATA 'Programs')
          ) |
          Where-Object {
            $_ -and (Test-Path -LiteralPath $_)
          } |
          Select-Object -Unique

          $terminal = $null
          $editor = $null

          foreach ($root in $searchRoots) {

            if (-not $terminal) {

              $terminal = Get-ChildItem `
                -Path $root `
                -Recurse `
                -File `
                -Filter 'terminal64.exe' `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1
            }

            if (-not $editor) {

              $editor = Get-ChildItem `
                -Path $root `
                -Recurse `
                -File `
                -Filter 'metaeditor64.exe' `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1
            }

            if ($terminal -and $editor) {
              break
            }
          }

          if (-not $terminal) {
            throw 'MetaTrader 5 terminal64.exe was not found.'
          }

          if (-not $editor) {
            throw 'MetaEditor metaeditor64.exe was not found.'
          }

          $terminalPath = $terminal.FullName
          $editorPath = $editor.FullName

          $mt5Root = Split-Path `
            $terminalPath `
            -Parent

          Write-Host "MT5 root: $mt5Root"
          Write-Host "Terminal: $terminalPath"
          Write-Host "MetaEditor: $editorPath"

          # ------------------------------------------------------------
          # 5. PREPARE EXACT EA LOCATION
          # ------------------------------------------------------------

          Write-Host '=== PREPARE KINGSBOT EXPERT TREE ==='

          $target = Join-Path `
            $mt5Root `
            'MQL5\Experts\KingsBot'

          if (Test-Path -LiteralPath $target) {

            Remove-Item `
              -LiteralPath $target `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $target `
            -Force | Out-Null

          $sourceRoot = Split-Path `
            $source `
            -Parent

          Copy-Item `
            -Path (Join-Path $sourceRoot '*') `
            -Destination $target `
            -Recurse `
            -Force

          $compileSource = Join-Path `
            $target `
            $env:SOURCE_NAME

          if (-not (Test-Path -LiteralPath $compileSource -PathType Leaf)) {
            throw "Prepared source was not found: $compileSource"
          }

          Write-Host "Prepared source: $compileSource"

          # ------------------------------------------------------------
          # 6. COMPILE
          # ------------------------------------------------------------

          Write-Host '=== COMPILE PHASE 6 ==='

          $compileLog = [IO.Path]::ChangeExtension(
            $compileSource,
            '.log'
          )

          $ex5 = [IO.Path]::ChangeExtension(
            $compileSource,
            '.ex5'
          )

          Remove-Item `
            -LiteralPath $compileLog,$ex5 `
            -Force `
            -ErrorAction SilentlyContinue

          $compile = Start-Process `
            -FilePath $editorPath `
            -ArgumentList @(
              "/compile:$compileSource"
              '/log'
            ) `
            -WorkingDirectory (Split-Path $compileSource -Parent) `
            -Wait `
            -PassThru

          Write-Host "MetaEditor exit code: $($compile.ExitCode)"

          if (-not (Test-Path -LiteralPath $compileLog -PathType Leaf)) {
            throw 'Compiler log was not produced.'
          }

          Get-Content `
            -LiteralPath $compileLog

          if (-not (Test-Path -LiteralPath $ex5 -PathType Leaf)) {
            throw 'Compilation did not produce KingsBot_Phase6_Integration.ex5.'
          }

          if ((Get-Item -LiteralPath $ex5).Length -le 0) {
            throw 'Compiled EX5 is empty.'
          }

          $logText = Get-Content `
            -LiteralPath $compileLog `
            -Raw

          if ($logText -match '(?i)\b[1-9]\d*\s+errors?\b') {

            throw 'MetaEditor reported compilation errors.'
          }

          Write-Host ''
          Write-Host "COMPILE PASS - EX5 size: $((Get-Item -LiteralPath $ex5).Length) bytes"

          Copy-Item `
            -LiteralPath $ex5 `
            -Destination $evidence `
            -Force

          Copy-Item `
            -LiteralPath $compileLog `
            -Destination (Join-Path $evidence 'compiler.log') `
            -Force

          # ------------------------------------------------------------
          # 7. VERIFY EX5 PATH
          # ------------------------------------------------------------

          Write-Host '=== VERIFY EX5 LOCATION ==='

          Write-Host "Expected EX5:"
          Write-Host $ex5

          if (-not (Test-Path -LiteralPath $ex5 -PathType Leaf)) {
            throw 'EX5 verification failed.'
          }

          Write-Host 'EX5 verification PASS.'

          # ------------------------------------------------------------
          # 8. PREPARE TEST REPORT DIRECTORY
          # ------------------------------------------------------------

          Write-Host '=== PREPARE STRATEGY TESTER ==='

          $reportDir = Join-Path `
            $mt5Root `
            'reports'

          if (Test-Path -LiteralPath $reportDir) {

            Remove-Item `
              -LiteralPath $reportDir `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $reportDir `
            -Force | Out-Null

          # ------------------------------------------------------------
          # 9. CREATE AUTHENTICATED TESTER CONFIG
          # ------------------------------------------------------------

          Write-Host '=== CREATE MT5 TESTER CONFIGURATION ==='

          $config = Join-Path `
            $mt5Root `
            'KingsBot_Phase6_Tester.ini'

          $configLines = @(
            '[Common]'
            "Login=$env:MT5_LOGIN"
            "Server=$env:MT5_SERVER"
            "Password=$env:MT5_PASSWORD"
            'KeepPrivate=0'
            'NewsEnable=0'
            ''
            '[Experts]'
            'AllowLiveTrading=0'
            'AllowDllImport=0'
            'Enabled=1'
            'Account=0'
            'Profile=0'
            ''
            '[Tester]'
            'Expert=Experts\KingsBot\KingsBot_Phase6_Integration.ex5'
            "Login=$env:MT5_LOGIN"
            'Symbol=EURUSD'
            'Period=M15'
            'Model=4'
            'Optimization=0'
            'ExecutionMode=0'
            'FromDate=2025.01.01'
            'ToDate=2026.08.01'
            'Deposit=10000'
            'Currency=USD'
            'Leverage=1:100'
            'ForwardMode=0'
            'UseLocal=1'
            'UseRemote=0'
            'UseCloud=0'
            'Visual=0'
            'Report=reports\KingsBot_Phase6_Tester.htm'
            'ReplaceReport=1'
            'ShutdownTerminal=1'
          )

          Set-Content `
            -LiteralPath $config `
            -Value ($configLines -join [Environment]::NewLine) `
            -Encoding Unicode

          # ------------------------------------------------------------
          # 10. SAVE REDACTED CONFIG ONLY
          # ------------------------------------------------------------

          $redactedConfig = $configLines |
            ForEach-Object {

              if ($_ -like 'Password=*') {
                'Password=***REDACTED***'
              }
              else {
                $_
              }
            }

          Set-Content `
            -LiteralPath (Join-Path $evidence 'tester-config-redacted.ini') `
            -Value ($redactedConfig -join [Environment]::NewLine) `
            -Encoding Unicode

          Write-Host 'Tester configuration created.'
          Write-Host 'Password has NOT been printed or uploaded.'

          # ------------------------------------------------------------
          # 11. START MT5 STRATEGY TESTER
          # ------------------------------------------------------------

          Write-Host '=== START STRATEGY TESTER ==='

          $report = Join-Path `
            $reportDir `
            'KingsBot_Phase6_Tester.htm'

          Remove-Item `
            -LiteralPath $report `
            -Force `
            -ErrorAction SilentlyContinue

          $tester = Start-Process `
            -FilePath $terminalPath `
            -ArgumentList @(
              '/portable'
              "/config:$config"
            ) `
            -WorkingDirectory $mt5Root `
            -PassThru

          Write-Host "MT5 process ID: $($tester.Id)"

          # ------------------------------------------------------------
          # 12. WAIT FOR REPORT
          # ------------------------------------------------------------

          $deadline = (Get-Date).AddMinutes(25)
          $reportFound = $false

          while ((Get-Date) -lt $deadline) {

            if (Test-Path -LiteralPath $report -PathType Leaf) {

              $reportFound = $true

              Write-Host 'TESTER REPORT DETECTED.'

              break
            }

            $running = Get-Process `
              -Id $tester.Id `
              -ErrorAction SilentlyContinue

            if (-not $running) {

              Write-Host 'MT5 process exited before producing the report.'

              break
            }

            Start-Sleep -Seconds 10
          }

          # ------------------------------------------------------------
          # 13. DIAGNOSTICS IF TESTER FAILS
          # ------------------------------------------------------------

          if (-not $reportFound) {

            Write-Host '=== MT5 DIAGNOSTICS ==='

            $logRoots = @(
              (Join-Path $mt5Root 'Logs')
              (Join-Path $mt5Root 'Tester\logs')
              (Join-Path $mt5Root 'Tester')
            ) |
            Where-Object {
              Test-Path -LiteralPath $_
            } |
            Select-Object -Unique

            foreach ($logRoot in $logRoots) {

              Write-Host "Searching: $logRoot"

              $logs = Get-ChildItem `
                -Path $logRoot `
                -Recurse `
                -File `
                -ErrorAction SilentlyContinue |
                Where-Object {
                  $_.Extension -in @(
                    '.log'
                    '.xml'
                    '.htm'
                    '.html'
                  )
                }

              foreach ($log in $logs) {

                Write-Host ''
                Write-Host "===== $($log.FullName) ====="

                Get-Content `
                  -LiteralPath $log.FullName `
                  -ErrorAction SilentlyContinue

                Copy-Item `
                  -LiteralPath $log.FullName `
                  -Destination $evidence `
                  -Force `
                  -ErrorAction SilentlyContinue
              }
            }

            Write-Host '=== END MT5 DIAGNOSTICS ==='

            throw 'Strategy Tester did not produce a report.'
          }

          # ------------------------------------------------------------
          # 14. VERIFY REPORT
          # ------------------------------------------------------------

          if ((Get-Item -LiteralPath $report).Length -le 0) {
            throw 'Strategy Tester report exists but is empty.'
          }

          Write-Host ''
          Write-Host "STRATEGY TEST PASS - report size: $((Get-Item -LiteralPath $report).Length) bytes"

          Copy-Item `
            -LiteralPath $report `
            -Destination $evidence `
            -Force

          Write-Host ''
          Write-Host '=========================================='
          Write-Host ' PHASE 6 VALIDATION COMPLETE'
          Write-Host '=========================================='

      - name: Upload Phase 6 validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: KingsBot-Phase6-Final-Validation
          path: phase6-validation-evidence
          if-no-files-found: error
          retention-days: 14
