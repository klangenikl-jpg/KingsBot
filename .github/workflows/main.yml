name: Build King's Bot

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.mq5'
      - '**/*.mqh'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build:
    name: Build King's Bot
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout King's Bot
        uses: actions/checkout@v4

      - name: Locate or install MetaTrader 5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========================================"
          Write-Host "LOCATING / INSTALLING METATRADER 5"
          Write-Host "========================================"

          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          $installRoot = 'C:\MT5'

          $editorCandidates = @(
            'C:\Program Files\MetaTrader 5\MetaEditor64.exe',
            'C:\Program Files (x86)\MetaTrader 5\MetaEditor64.exe',
            "$installRoot\MetaEditor64.exe"
          )

          $metaEditor = $editorCandidates |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (-not $metaEditor) {
            Write-Host "MetaEditor not found. Downloading official MetaTrader 5 installer..."

            Invoke-WebRequest `
              -Uri 'https://download.terminal.free/cdn/web/metaquotes.ltd/mt5/mt5setup.exe' `
              -OutFile $installer

            if (-not (Test-Path $installer)) {
              throw 'MetaTrader 5 installer was not downloaded.'
            }

            $size = (Get-Item $installer).Length
            Write-Host "Installer size: $size bytes"

            if ($size -lt 100000) {
              throw "Downloaded installer is unexpectedly small: $size bytes."
            }

            if (Test-Path $installRoot) {
              Remove-Item $installRoot -Recurse -Force -ErrorAction SilentlyContinue
            }

            New-Item -ItemType Directory -Path $installRoot -Force | Out-Null

            Write-Host "Installing MT5 to $installRoot..."

            $process = Start-Process `
              -FilePath $installer `
              -ArgumentList @(
                '/auto',
                "/path:`"$installRoot`""
              ) `
              -Wait `
              -PassThru

            Write-Host "Installer exit code: $($process.ExitCode)"

            Start-Sleep -Seconds 5

            $metaEditor = @(
              "$installRoot\MetaEditor64.exe",
              'C:\Program Files\MetaTrader 5\MetaEditor64.exe',
              'C:\Program Files (x86)\MetaTrader 5\MetaEditor64.exe'
            ) |
              Where-Object { Test-Path $_ } |
              Select-Object -First 1
          }

          if (-not $metaEditor) {
            Write-Host "MetaEditor not found in expected locations."
            Write-Host "Searching the runner for MetaEditor64.exe..."

            $metaEditor = Get-ChildItem `
              -Path 'C:\Program Files','C:\Program Files (x86)','C:\MT5',$env:LOCALAPPDATA `
              -Filter 'MetaEditor64.exe' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1 |
              ForEach-Object { $_.FullName }
          }

          if (-not $metaEditor) {
            throw 'MetaEditor64.exe was not found after installation.'
          }

          Write-Host "MetaEditor found:"
          Write-Host $metaEditor

          "METAEDITOR=$metaEditor" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Locate standard MQL5 library
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========================================"
          Write-Host "LOCATING STANDARD MQL5 LIBRARY"
          Write-Host "========================================"

          $trade = $null

          $knownRoots = @(
            'C:\Program Files\MetaTrader 5',
            'C:\Program Files (x86)\MetaTrader 5',
            'C:\MT5',
            "$env:APPDATA\MetaQuotes\Terminal",
            "$env:LOCALAPPDATA\MetaQuotes\Terminal"
          )

          foreach ($root in $knownRoots) {
            if (Test-Path $root) {
              $candidate = Get-ChildItem `
                -Path $root `
                -Filter 'Trade.mqh' `
                -File `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Where-Object {
                  $_.FullName -match '[\\/]MQL5[\\/]Include[\\/]Trade[\\/]Trade\.mqh$'
                } |
                Select-Object -First 1

              if ($candidate) {
                $trade = $candidate.FullName
                break
              }
            }
          }

          if (-not $trade) {
            Write-Host "Trade.mqh not found in known MT5 locations."
            Write-Host "Searching the complete C: drive..."

            $candidate = Get-ChildItem `
              -Path 'C:\' `
              -Filter 'Trade.mqh' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.FullName -match '[\\/]MQL5[\\/]Include[\\/]Trade[\\/]Trade\.mqh$'
              } |
              Select-Object -First 1

            if ($candidate) {
              $trade = $candidate.FullName
            }
          }

          if (-not $trade) {
            throw 'Standard MQL5 Trade.mqh was not found.'
          }

          $includeRoot = Split-Path (Split-Path $trade -Parent) -Parent

          Write-Host "Trade.mqh found:"
          Write-Host $trade

          Write-Host "MQL5 Include root:"
          Write-Host $includeRoot

          "MQL5_INCLUDE=$includeRoot" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Prepare King's Bot source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $buildRoot = Join-Path $env:RUNNER_TEMP 'KingsBotBuild'
          $sourceRoot = Join-Path $buildRoot 'MQL5\Experts\KingsBot'

          if (Test-Path $buildRoot) {
            Remove-Item $buildRoot -Recurse -Force
          }

          New-Item -ItemType Directory -Path $sourceRoot -Force | Out-Null

          $sourcePath = Join-Path `
            $env:GITHUB_WORKSPACE `
            'MQL5\Experts\KingsBot'

          if (-not (Test-Path $sourcePath)) {
            throw "King's Bot source directory was not found: $sourcePath"
          }

          Copy-Item `
            "$sourcePath\*" `
            $sourceRoot `
            -Recurse `
            -Force

          "KINGSBOT_BUILD=$buildRoot" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          "KINGSBOT_SOURCE=$sourceRoot" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Normalize MQL5 headers
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $files = Get-ChildItem `
            -Path $env:KINGSBOT_SOURCE `
            -Include *.mq5,*.mqh `
            -File `
            -Recurse

          foreach ($file in $files) {

            $text = Get-Content `
              $file.FullName `
              -Raw

            $text = [regex]::Replace(
              $text,
              '(?m)^\s*#pragma\s+once\s*\r?\n?',
              ''
            )

            $text = $text -replace `
              '(?i)#include\s*[<"]\s*Include[\\/]+Trade[\\/]+Trade\.mqh\s*[>"]',
              '#include <Trade/Trade.mqh>'

            Set-Content `
              -Path $file.FullName `
              -Value $text `
              -Encoding UTF8
          }

      - name: Verify standard MQL5 library
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:MQL5_INCLUDE) {
            throw 'MQL5 Include directory was not detected.'
          }

          $trade = Join-Path `
            $env:MQL5_INCLUDE `
            'Trade\Trade.mqh'

          if (-not (Test-Path $trade)) {
            throw "Trade.mqh is missing: $trade"
          }

          Write-Host "Verified:"
          Write-Host $trade

      - name: Compile King's Bot
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $main = Join-Path `
            $env:KINGSBOT_SOURCE `
            'KingsBot_Phase6_Integration.mq5'

          if (-not (Test-Path $main)) {
            throw "
