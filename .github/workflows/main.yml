name: King's Bot - Phase 6 Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build King's Bot
    runs-on: windows-latest

    steps:
      - name: Checkout King's Bot
        uses: actions/checkout@v4

      - name: Locate MetaEditor and MT5 MQL5 library
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "LOCATING METATRADER 5 / METAEDITOR"
          Write-Host "========================================="

          $possibleMetaEditors = @(
            "C:\Program Files\MetaTrader 5\MetaEditor64.exe",
            "C:\Program Files (x86)\MetaTrader 5\MetaEditor64.exe",
            "C:\Program Files\MetaTrader 5\MetaEditor.exe",
            "C:\Program Files (x86)\MetaTrader 5\MetaEditor.exe",
            "$env:LOCALAPPDATA\Programs\MetaTrader 5\MetaEditor64.exe",
            "$env:APPDATA\MetaQuotes\Terminal\MetaEditor64.exe"
          )

          $metaEditor = $null

          foreach ($path in $possibleMetaEditors) {
            if (Test-Path $path) {
              $metaEditor = (Resolve-Path $path).Path
              break
            }
          }

          if (-not $metaEditor) {
            Write-Host "MetaEditor not found in standard locations."
            Write-Host "Downloading official MetaTrader 5 installer..."

            $installer = "$env:TEMP\mt5setup.exe"

            Invoke-WebRequest `
              -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" `
              -OutFile $installer

            if (-not (Test-Path $installer)) {
              throw "MetaTrader 5 installer could not be downloaded."
            }

            Write-Host "Installing MetaTrader 5..."

            $process = Start-Process `
              -FilePath $installer `
              -ArgumentList "/auto" `
              -Wait `
              -PassThru

            Write-Host "Installer exit code: $($process.ExitCode)"

            Start-Sleep -Seconds 10

            Write-Host "Searching for MetaEditor after installation..."

            $searchRoots = @(
              "C:\Program Files",
              "C:\Program Files (x86)",
              "$env:LOCALAPPDATA",
              "$env:APPDATA"
            )

            foreach ($root in $searchRoots) {
              if (Test-Path $root) {
                $found = Get-ChildItem `
                  -Path $root `
                  -Filter "MetaEditor64.exe" `
                  -File `
                  -Recurse `
                  -ErrorAction SilentlyContinue |
                  Select-Object -First 1

                if ($found) {
                  $metaEditor = $found.FullName
                  break
                }
              }
            }
          }

          if (-not $metaEditor) {
            throw "MetaEditor64.exe was not found after installation/search."
          }

          Write-Host ""
          Write-Host "MetaEditor found:"
          Write-Host $metaEditor

          $metaEditorDir = Split-Path $metaEditor -Parent

          Write-Host ""
          Write-Host "MetaEditor directory:"
          Write-Host $metaEditorDir

          "METAEDITOR_PATH=$metaEditor" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append

          "METAEDITOR_DIR=$metaEditorDir" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append

          Write-Host ""
          Write-Host "Searching for standard MQL5 library..."

          $tradeCandidates = @(
            "$metaEditorDir\MQL5\Include\Trade\Trade.mqh",
            "$metaEditorDir\Include\Trade\Trade.mqh",
            "$env:APPDATA\MetaQuotes\Terminal\*\MQL5\Include\Trade\Trade.mqh",
            "$env:LOCALAPPDATA\MetaQuotes\Terminal\*\MQL5\Include\Trade\Trade.mqh"
          )

          $tradeFile = $null

          foreach ($candidate in $tradeCandidates) {
            if ($candidate -match "\*") {
              $matches = Get-ChildItem `
                -Path $candidate `
                -File `
                -ErrorAction SilentlyContinue

              if ($matches) {
                $tradeFile = $matches[0].FullName
                break
              }
            }
            elseif (Test-Path $candidate) {
              $tradeFile = (Resolve-Path $candidate).Path
              break
            }
          }

          if (-not $tradeFile) {
            $tradeFile = Get-ChildItem `
              -Path "$env:APPDATA\MetaQuotes\Terminal" `
              -Filter "Trade.mqh" `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.FullName -match "\\MQL5\\Include\\Trade\\Trade\.mqh$"
              } |
              Select-Object -First 1 -ExpandProperty FullName
          }

          if (-not $tradeFile) {
            throw "Standard MQL5 Trade.mqh was not found."
          }

          Write-Host ""
          Write-Host "Standard MQL5 Trade.mqh found:"
          Write-Host $tradeFile

          "TRADE_MQH=$tradeFile" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append

          Write-Host ""
          Write-Host "MetaEditor and standard MQL5 library are ready."

      - name: Prepare King's Bot source
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Preparing King's Bot source..."

          $sourceRoot = Join-Path $env:GITHUB_WORKSPACE "MQL5"
          $buildRoot = Join-Path $env:RUNNER_TEMP "KingsBotBuild\MQL5"

          if (Test-Path $buildRoot) {
            Remove-Item $buildRoot -Recurse -Force
          }

          New-Item -ItemType Directory -Path $buildRoot -Force | Out-Null

          Copy-Item `
            -Path "$sourceRoot\*" `
            -Destination $buildRoot `
            -Recurse `
            -Force

          Write-Host "Source copied to:"
          Write-Host $buildRoot

      - name: Normalize MQL5 headers
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $root = Join-Path $env:RUNNER_TEMP "KingsBotBuild\MQL5"

          Get-ChildItem `
            -Path $root `
            -Recurse `
            -Include "*.mq5","*.mqh" |
            ForEach-Object {

              $content = Get-Content `
                -Path $_.FullName `
                -Raw

              $content = $content -replace '^\s*#pragma\s+once\s*$', '#ifndef KINGBOT_HEADER_GUARD' + "`r`n" + '#define KINGBOT_HEADER_GUARD'

              Set-Content `
                -Path $_.FullName `
                -Value $content `
                -Encoding UTF8
            }

          Write-Host "Header normalization completed."

      - name: Verify standard MQL5 library
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $buildInclude = Join-Path `
            $env:RUNNER_TEMP `
            "KingsBotBuild\MQL5\Include"

          $tradeDestination = Join-Path `
            $buildInclude `
            "Trade\Trade.mqh"

          New-Item `
            -ItemType Directory `
            -Path (Split-Path $tradeDestination -Parent) `
            -Force |
            Out-Null

          Copy-Item `
            -Path $env:TRADE_MQH `
            -Destination $tradeDestination `
            -Force

          if (-not (Test-Path $tradeDestination)) {
            throw "Trade.mqh could not be copied into the King's Bot build tree."
          }

          Write-Host "Trade.mqh available at:"
          Write-Host $tradeDestination

      - name: Compile King's Bot
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "COMPILING KING'S BOT"
          Write-Host "========================================="

          $source = Join-Path `
            $env:RUNNER_TEMP `
            "KingsBotBuild\MQL5\Experts\KingsBot\KingsBot_Phase6_Integration.mq5"

          if (-not (Test-Path $source)) {
            throw "King's Bot source file was not found: $source"
          }

          Write-Host "Source:"
          Write-Host $source

          Write-Host ""
          Write-Host "MetaEditor:"
          Write-Host $env:METAEDITOR_PATH

          & $env:METAEDITOR_PATH `
            "/compile:$source" `
            "/log"

          if ($LASTEXITCODE -ne 0) {
            throw "MetaEditor compilation failed with exit code $LASTEXITCODE."
          }

          Write-Host "Compilation command completed."

      - name: Find King's Bot EX5
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $buildRoot = Join-Path `
            $env:RUNNER_TEMP `
            "KingsBotBuild"

          $ex5 = Get-ChildItem `
            -Path $buildRoot `
            -Filter "KingsBot*.ex5" `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $ex5) {
            throw "King's Bot EX5 was not created."
          }

          Write-Host ""
          Write-Host "KING'S BOT EX5 CREATED:"
          Write-Host $ex5.FullName

          $artifactRoot = Join-Path `
            $env:GITHUB_WORKSPACE `
            "build-artifacts"

          New-Item `
            -ItemType Directory `
            -Path $artifactRoot `
            -Force |
            Out-Null

          Copy-Item `
            -Path $ex5.FullName `
            -Destination $artifactRoot `
            -Force

          Write-Host ""
          Write-Host "Artifact prepared."

      - name: Upload King's Bot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kings-bot-build
          path: build-artifacts
          if-no-files-found: error

      - name: Complete job
        shell: powershell
        run: |
          Write-Host "========================================="
          Write-Host "KING'S BOT BUILD JOB COMPLETE"
          Write-Host "========================================="
