name: King's Bot - Phase 6 Build

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.mq5'
      - '**/*.mqh'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build:
    name: Build King's Bot
    runs-on: windows-2022
    timeout-minutes: 30

    steps:

      - name: Checkout King's Bot
        uses: actions/checkout@v4

      - name: Locate MetaEditor
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "LOCATING METAEDITOR"
          Write-Host "========================================"

          $roots = @(
            "C:\Program Files\MetaTrader 5",
            "C:\Program Files (x86)\MetaTrader 5",
            "$env:LOCALAPPDATA\Programs\MetaTrader 5",
            "$env:APPDATA\MetaQuotes\Terminal"
          )

          $editors = @()

          foreach ($root in $roots) {
            if (Test-Path $root) {
              Write-Host "Searching: $root"

              $found = Get-ChildItem `
                -Path $root `
                -Recurse `
                -File `
                -ErrorAction SilentlyContinue |
                Where-Object {
                  $_.Name -ieq "MetaEditor64.exe" -or
                  $_.Name -ieq "MetaEditor.exe"
                }

              if ($found) {
                $editors += $found
              }
            }
          }

          $editors = $editors |
            Sort-Object FullName -Unique

          if ($editors.Count -eq 0) {
            throw "MetaEditor64.exe was not found."
          }

          $editor = $editors[0].FullName

          Write-Host ""
          Write-Host "MetaEditor found:"
          Write-Host $editor

          "METAEDITOR=$editor" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      - name: Prepare King's Bot source
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "PREPARING KING'S BOT SOURCE"
          Write-Host "========================================"

          $buildRoot = Join-Path $env:RUNNER_TEMP "KingsBotBuild"

          if (Test-Path $buildRoot) {
            Remove-Item $buildRoot -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $buildRoot `
            -Force | Out-Null

          $sources = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Recurse `
            -File `
            -Include *.mq5,*.mqh

          if ($sources.Count -eq 0) {
            throw "No MQL5 source files were found."
          }

          foreach ($file in $sources) {

            $relative = $file.FullName.Substring(
              $env:GITHUB_WORKSPACE.Length
            ).TrimStart('\')

            $destination = Join-Path `
              $buildRoot `
              $relative

            $destinationDir = Split-Path `
              $destination `
              -Parent

            New-Item `
              -ItemType Directory `
              -Path $destinationDir `
              -Force | Out-Null

            Copy-Item `
              -Path $file.FullName `
              -Destination $destination `
              -Force
          }

          "BUILD_ROOT=$buildRoot" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          Write-Host ""
          Write-Host "Build root:"
          Write-Host $buildRoot

      - name: Normalize MQL5 headers
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "NORMALIZING MQL5 HEADERS"
          Write-Host "========================================"

          $files = Get-ChildItem `
            -Path $env:BUILD_ROOT `
            -Recurse `
            -File `
            -Include *.mq5,*.mqh

          $changed = 0

          foreach ($file in $files) {

            $text = Get-Content `
              -Path $file.FullName `
              -Raw

            $newText = $text -replace `
              '(?m)^\s*#once\s*$', `
              '#pragma once'

            if ($newText -ne $text) {

              Set-Content `
                -Path $file.FullName `
                -Value $newText `
                -Encoding utf8

              Write-Host "Normalized: $($file.FullName)"
              $changed++
            }
          }

          Write-Host ""
          Write-Host "Headers normalized: $changed"

      - name: Prepare MQL5 Standard Library
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "PREPARING MQL5 STANDARD LIBRARY"
          Write-Host "========================================"

          $mql5Root = Join-Path `
            $env:BUILD_ROOT `
            "MQL5"

          $includeRoot = Join-Path `
            $mql5Root `
            "Include"

          if (!(Test-Path $includeRoot)) {
            New-Item `
              -ItemType Directory `
              -Path $includeRoot `
              -Force | Out-Null
          }

          $zip = Join-Path `
            $env:RUNNER_TEMP `
            "mt5-include.zip"

          $extract = Join-Path `
            $env:RUNNER_TEMP `
            "mt5-include"

          if (Test-Path $extract) {
            Remove-Item $extract -Recurse -Force
          }

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Write-Host "Downloading MQL5 Standard Library source..."

          Invoke-WebRequest `
            -Uri "https://github.com/gsemet/mt5-include/archive/refs/heads/master.zip" `
            -OutFile $zip `
            -UseBasicParsing

          Expand-Archive `
            -Path $zip `
            -DestinationPath $extract `
            -Force

          $libraryRoot = Get-ChildItem `
            -Path $extract `
            -Directory |
            Select-Object -First 1

          if ($null -eq $libraryRoot) {
            throw "Standard Library archive could not be extracted."
          }

          Write-Host "Library source:"
          Write-Host $libraryRoot.FullName

          $libraryFiles = Get-ChildItem `
            -Path $libraryRoot.FullName `
            -Recurse `
            -File `
            -Filter *.mqh

          if ($libraryFiles.Count -eq 0) {
            throw "No MQL5 Standard Library files were found."
          }

          foreach ($file in $libraryFiles) {

            $relative = $file.FullName.Substring(
              $libraryRoot.FullName.Length
            ).TrimStart('\')

            $destination = Join-Path `
              $includeRoot `
              $relative

            $destinationDir = Split-Path `
              $destination `
              -Parent

            New-Item `
              -ItemType Directory `
              -Path $destinationDir `
              -Force | Out-Null

            Copy-Item `
              -Path $file.FullName `
              -Destination $destination `
              -Force
          }

          $trade = Join-Path `
            $includeRoot `
            "Trade\Trade.mqh"

          if (!(Test-Path $trade)) {
            throw "Trade\Trade.mqh was not installed into the build include tree."
          }

          Write-Host ""
          Write-Host "Trade.mqh found:"
          Write-Host $trade

          Write-Host ""
          Write-Host "Standard Library is ready."

      - name: Verify standard MQL5 library
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "VERIFYING STANDARD MQL5 LIBRARY"
          Write-Host "========================================"

          $includeRoot = Join-Path `
            $env:BUILD_ROOT `
            "MQL5\Include"

          $required = @(
            "Object.mqh",
            "StdLibErr.mqh",
            "Trade\Trade.mqh",
            "Trade\SymbolInfo.mqh",
            "Trade\OrderInfo.mqh",
            "Trade\HistoryOrderInfo.mqh",
            "Trade\PositionInfo.mqh",
            "Trade\DealInfo.mqh"
          )

          foreach ($item in $required) {

            $path = Join-Path `
              $includeRoot `
              $item

            if (!(Test-Path $path)) {
              throw "Required MQL5 library file is missing: $item"
            }

            Write-Host "OK: $item"
          }

          Write-Host ""
          Write-Host "All required Standard Library files are present."

      - name: Compile King's Bot
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "COMPILING KING'S BOT"
          Write-Host "========================================"

          $editor = $env:METAEDITOR
          $buildRoot = $env:BUILD_ROOT
          $mql5Root = Join-Path $buildRoot "MQL5"

          $source = Join-Path `
            $buildRoot `
            "MQL5\Experts\KingsBot\KingsBot_Phase6_Integration.mq5"

          if (!(Test-Path $source)) {

            $source = Get-ChildItem `
              -Path $buildRoot `
              -Recurse `
              -File `
              -Filter "KingsBot_Phase6_Integration.mq5" |
              Select-Object -First 1 |
              Select-Object -ExpandProperty FullName
          }

          if ([string]::IsNullOrWhiteSpace($source)) {
            throw "KingsBot_Phase6_Integration.mq5 was not found."
          }

          Write-Host ""
          Write-Host "MetaEditor:"
          Write-Host $editor

          Write-Host ""
          Write-Host "MQL5 include root:"
          Write-Host $mql5Root

          Write-Host ""
          Write-Host "Source:"
          Write-Host $source

          Write-Host ""
          Write-Host "Starting compilation..."

          & $editor `
            "/portable" `
            "/compile:$source" `
            "/inc:$mql5Root" `
            "/log"

          $exitCode = $LASTEXITCODE

          Write-Host ""
          Write-Host "MetaEditor exit code: $exitCode"

          $logFile = [System.IO.Path]::ChangeExtension(
            $source,
            ".log"
          )

          if (Test-Path $logFile) {

            Write-Host ""
            Write-Host "========================================"
            Write-Host "COMPILER LOG"
            Write-Host "========================================"

            Get-Content $logFile
          }

          $ex5 = [System.IO.Path]::ChangeExtension(
            $source,
            ".ex5"
          )

          if (!(Test-Path $ex5)) {
            throw "KingsBot EX5 was not created."
          }

          Write-Host ""
          Write-Host "SUCCESS:"
          Write-Host $ex5

      - name: Prepare King's Bot artifacts
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "PREPARING ARTIFACTS"
          Write-Host "========================================"

          $artifactRoot = Join-Path `
            $env:RUNNER_TEMP `
            "build-artifacts"

          if (Test-Path $artifactRoot) {
            Remove-Item `
              $artifactRoot `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $artifactRoot `
            -Force | Out-Null

          $ex5Files = Get-ChildItem `
            -Path $env:BUILD_ROOT `
            -Recurse `
            -File `
            -Filter *.ex5

          if ($ex5Files.Count -eq 0) {
            throw "No EX5 files were produced."
          }

          foreach ($file in $ex5Files) {

            Copy-Item `
              -Path $file.FullName `
              -Destination $artifactRoot `
              -Force

            Write-Host "Artifact: $($file.Name)"
          }

          "ARTIFACT_ROOT=$artifactRoot" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      - name: Upload King's Bot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-Phase6-EX5
          path: ${{ runner.temp }}/build-artifacts/*
          if-no-files-found: error
          retention-days: 14
