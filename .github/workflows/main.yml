name: Build King's Bot

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile King's Bot
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout King's Bot
        uses: actions/checkout@v4

      - name: Download MetaTrader 5 installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          $url = 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe'

          Write-Host "Downloading MetaTrader 5 installer..."

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer

          if (-not (Test-Path $installer -PathType Leaf)) {
            throw "MetaTrader 5 installer was not downloaded."
          }

          Write-Host "Installer downloaded: $installer"

      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          $installPath = 'C:\MT5'

          New-Item `
            -ItemType Directory `
            -Path $installPath `
            -Force |
            Out-Null

          Write-Host "Installing MetaTrader 5 to $installPath..."

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList @(
              '/auto',
              "/path:`"$installPath`""
            ) `
            -Wait `
            -PassThru

          Write-Host "Installer exit code: $($process.ExitCode)"

          Start-Sleep -Seconds 5

          Write-Host "Searching for MetaEditor64.exe..."

          $searchRoots = @(
            $installPath,
            $env:APPDATA,
            $env:LOCALAPPDATA,
            'C:\Program Files',
            'C:\Program Files (x86)'
          )

          $metaEditor = $null

          foreach ($root in $searchRoots) {
            if (-not (Test-Path $root)) {
              continue
            }

            Write-Host "Searching: $root"

            $found = Get-ChildItem `
              -Path $root `
              -Filter 'MetaEditor64.exe' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if ($found) {
              $metaEditor = $found
              break
            }
          }

          if (-not $metaEditor) {
            throw "MetaEditor64.exe was not found. Installer exit code: $($process.ExitCode)"
          }

          $metaEditorPath = $metaEditor.FullName
          $terminalRoot = Split-Path $metaEditorPath -Parent
          $mql5Root = Join-Path $terminalRoot 'MQL5'

          if (-not (Test-Path $mql5Root -PathType Container)) {
            throw "MQL5 root was not found: $mql5Root"
          }

          Write-Host "MetaEditor found:"
          Write-Host $metaEditorPath

          Write-Host "MQL5 root:"
          Write-Host $mql5Root

          "METAEDITOR=$metaEditorPath" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          "MQL5_ROOT=$mql5Root" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      - name: Locate King's Bot source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter 'KingsBot_Phase6_Integration.mq5' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $source) {
            throw "KingsBot_Phase6_Integration.mq5 was not found in the repository."
          }

          Write-Host "Source found:"
          Write-Host $source.FullName

          "SOURCE=$($source.FullName)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      - name: Install King's Bot source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:MQL5_ROOT) {
            throw "MQL5_ROOT is not set."
          }

          Write-Host "Installing King's Bot source into:"
          Write-Host $env:MQL5_ROOT

          $sources = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Recurse `
            -File `
            -Include '*.mq5','*.mqh' `
            -ErrorAction SilentlyContinue

          if ($sources.Count -eq 0) {
            throw "No MQL5 source files were found in the repository."
          }

          foreach ($file in $sources) {
            $relative = $file.FullName.Substring(
              $env:GITHUB_WORKSPACE.Length
            ).TrimStart('\')

            $destination = Join-Path `
              $env:MQL5_ROOT `
              $relative

            $destinationDir = Split-Path `
              $destination `
              -Parent

            New-Item `
              -ItemType Directory `
              -Path $destinationDir `
              -Force |
              Out-Null

            Copy-Item `
              -Path $file.FullName `
              -Destination $destination `
              -Force

            Write-Host "Installed: $relative"
          }

          $installedSource = Join-Path `
            $env:MQL5_ROOT `
            'KingsBot_Phase6_Integration.mq5'

          if (-not (Test-Path $installedSource -PathType Leaf)) {
            throw "Installed Phase 6 source was not found: $installedSource"
          }

          "SOURCE=$installedSource" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      - name: Verify required Trade include
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:MQL5_ROOT) {
            throw "MQL5_ROOT is not set."
          }

          $tradeInclude = Join-Path `
            $env:MQL5_ROOT `
            'Include\Trade\Trade.mqh'

          Write-Host "Checking required Trade include:"
          Write-Host $tradeInclude

          if (-not (Test-Path $tradeInclude -PathType Leaf)) {
            Write-Host ""
            Write-Host "Trade include was not found."
            Write-Host "Available Include files:"

            $includeRoot = Join-Path `
              $env:MQL5_ROOT `
              'Include'

            if (Test-Path $includeRoot) {
              Get-ChildItem `
                -Path $includeRoot `
                -Recurse `
                -File `
                -ErrorAction SilentlyContinue |
                ForEach-Object {
                  Write-Host $_.FullName
                }
            }

            throw "Required Trade.mqh include was not found at $tradeInclude"
          }

          Write-Host "Trade.mqh found successfully."

      - name: Compile King's Bot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host ""
          Write-Host "========================================"
          Write-Host "COMPILING KING'S BOT"
          Write-Host "========================================"
          Write-Host ""

          Write-Host "MetaEditor:"
          Write-Host $env:METAEDITOR

          Write-Host ""
          Write-Host "MQL5 root:"
          Write-Host $env:MQL5_ROOT

          Write-Host ""
          Write-Host "Source:"
          Write-Host $env:SOURCE

          $sourceDirectory = Split-Path `
            $env:SOURCE `
            -Parent

          $before = @(
            Get-ChildItem `
              -Path $env:MQL5_ROOT `
              -Filter '*.ex5' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue
          )

          Write-Host ""
          Write-Host "EX5 files before compilation: $($before.Count)"

          Write-Host ""
          Write-Host "Starting MetaEditor..."

          $process = Start-Process `
            -FilePath $env:METAEDITOR `
            -ArgumentList @(
              "/compile:`"$($env:SOURCE)`"",
              '/log'
            ) `
            -WorkingDirectory $sourceDirectory `
            -Wait `
            -PassThru

          Write-Host ""
          Write-Host "MetaEditor exit code: $($process.ExitCode)"

          Start-Sleep -Seconds 3

          $after = @(
            Get-ChildItem `
              -Path $env:MQL5_ROOT `
              -Filter '*.ex5' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue
          )

          if ($after.Count -gt 0) {
            Write-Host ""
            Write-Host "EX5 files found:"

            $after |
              Sort-Object LastWriteTime -Descending |
              ForEach-Object {
                Write-Host $_.FullName
              }
          }

          $generated = $after |
            Where-Object {
              $_.LastWriteTime -gt $sourceDirectory
            } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $generated) {
            $logFiles = @(
              Get-ChildItem `
                -Path $env:MQL5_ROOT,$env:RUNNER_TEMP,$sourceDirectory `
                -Filter '*.log' `
                -File `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Sort-Object LastWriteTime -Descending
            )

            if ($logFiles.Count -gt 0) {
              Write-Host ""
              Write-Host "Recent compiler logs:"

              foreach ($log in $logFiles | Select-Object -First 5) {
                Write-Host ""
                Write-Host "===== $($log.FullName) ====="

                Get-Content `
                  -Path $log.FullName `
                  -ErrorAction SilentlyContinue
              }
            }

            throw "KingsBot compilation failed. No EX5 file was created."
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "SUCCESS: EX5 GENERATED"
          Write-Host "========================================"
          Write-Host $generated.FullName

          "EX5_PATH=$($generated.FullName)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      - name: Prepare King's Bot artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $package = Join-Path `
            $env:RUNNER_TEMP `
            'KingsBot_Phase6_Package'

          New-Item `
            -ItemType Directory `
            -Path $package `
            -Force |
            Out-Null

          Copy-Item `
            -Path $env:EX5_PATH `
            -Destination $package `
            -Force

          Write-Host "Package contents:"

          Get-ChildItem `
            -Path $package `
            -File |
            ForEach-Object {
              Write-Host $_.FullName
            }

          "PACKAGE=$package" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      - name: Upload Phase 6 EX5
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-Phase6
          path: ${{ env.PACKAGE }}
          if-no-files-found: error
