name: Build King's Bot

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build King's Bot
    runs-on: windows-latest

    steps:
      - name: Checkout King's Bot
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare MQL5 compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========================================"
          Write-Host "       PREPARING MQL5 COMPILER"
          Write-Host "========================================"

          $compilerDir = Join-Path $env:RUNNER_TEMP "MQL5Compiler"
          $compiler = Join-Path $compilerDir "mql64.exe"

          if (Test-Path $compilerDir) {
            Remove-Item -Path $compilerDir -Recurse -Force
          }

          New-Item -ItemType Directory -Path $compilerDir -Force | Out-Null

          Write-Host "Downloading official MQL5 x64 compiler..."
          Invoke-WebRequest `
            -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mql64.exe" `
            -OutFile $compiler

          if (-not (Test-Path $compiler)) {
            throw "MQL5 x64 compiler was not downloaded."
          }

          $size = (Get-Item $compiler).Length

          if ($size -le 0) {
            throw "Downloaded MQL5 compiler is empty."
          }

          Write-Host "Compiler:"
          Write-Host "  $compiler"
          Write-Host "Size:"
          Write-Host "  $size bytes"

          "KINGSBOT_COMPILER=$compiler" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8

      - name: Prepare King's Bot source tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========================================"
          Write-Host "       PREPARING KING'S BOT"
          Write-Host "========================================"

          $repoRoot = $env:GITHUB_WORKSPACE
          $buildRoot = Join-Path $env:RUNNER_TEMP "KingsBotBuild"
          $mql5Root = Join-Path $buildRoot "MQL5"
          $expertRoot = Join-Path $mql5Root "Experts\KingsBot"

          if (Test-Path $buildRoot) {
            Remove-Item -Path $buildRoot -Recurse -Force
          }

          New-Item -ItemType Directory -Path $expertRoot -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $mql5Root "Include") -Force | Out-Null

          $mainCandidates = @(
            Get-ChildItem `
              -Path $repoRoot `
              -Recurse `
              -File `
              -Filter "KingsBot_Phase6_Integration.mq5" `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.FullName -notmatch '\\.git\\' -and
                $_.FullName -notmatch '\\artifact\\'
              }
          )

          if ($mainCandidates.Count -eq 0) {
            throw "KingsBot_Phase6_Integration.mq5 was not found."
          }

          $sourceMain = $mainCandidates[0].FullName
          $sourceDir = $mainCandidates[0].Directory.FullName

          Write-Host "Repository source:"
          Write-Host "  $sourceMain"

          Copy-Item `
            -Path (Join-Path $sourceDir "*") `
            -Destination $expertRoot `
            -Recurse `
            -Force

          $compileSource = Join-Path $expertRoot "KingsBot_Phase6_Integration.mq5"

          if (-not (Test-Path $compileSource)) {
            throw "King's Bot source was not copied to the compiler tree."
          }

          $repoIncludeCandidates = @(
            Get-ChildItem `
              -Path $repoRoot `
              -Recurse `
              -Directory `
              -Filter "Include" `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.FullName -notmatch '\\.git\\' -and
                $_.FullName -ne (Join-Path $repoRoot ".github")
              }
          )

          foreach ($includeDir in $repoIncludeCandidates) {
            $items = Get-ChildItem `
              -Path $includeDir.FullName `
              -Force `
              -ErrorAction SilentlyContinue

            if ($items) {
              Copy-Item `
                -Path (Join-Path $includeDir.FullName "*") `
                -Destination (Join-Path $mql5Root "Include") `
                -Recurse `
                -Force `
                -ErrorAction SilentlyContinue
            }
          }

          Write-Host "Compiler source:"
          Write-Host "  $compileSource"
          Write-Host "MQL5 root:"
          Write-Host "  $mql5Root"

          "KINGSBOT_SOURCE=$compileSource" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8

          "KINGSBOT_MQL5=$mql5Root" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8

      - name: Compile King's Bot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========================================"
          Write-Host "          COMPILING KING'S BOT"
          Write-Host "========================================"

          $compiler = $env:KINGSBOT_COMPILER
          $source = $env:KINGSBOT_SOURCE
          $mql5 = $env:KINGSBOT_MQL5

          $expectedEx5 = [System.IO.Path]::ChangeExtension($source, ".ex5")
          $compileLog = [System.IO.Path]::ChangeExtension($source, ".log")

          if (Test-Path $expectedEx5) {
            Remove-Item -Path $expectedEx5 -Force
          }

          if (Test-Path $compileLog) {
            Remove-Item -Path $compileLog -Force
          }

          Write-Host "Compiler:"
          Write-Host "  $compiler"
          Write-Host "Source:"
          Write-Host "  $source"
          Write-Host "MQL5 working directory:"
          Write-Host "  $mql5"
          Write-Host ""

          & $compiler $source "/i:$mql5" *> $compileLog

          $compilerExit = $LASTEXITCODE

          Write-Host "Compiler exit code: $compilerExit"
          Write-Host ""

          if (Test-Path $compileLog) {
            Write-Host "========================================"
            Write-Host "             COMPILER LOG"
            Write-Host "========================================"
            Get-Content -Path $compileLog -ErrorAction SilentlyContinue
            Write-Host "========================================"
          }

          if (-not (Test-Path $expectedEx5)) {
            throw "No EX5 was produced. Compiler exit code: $compilerExit. See compiler log above."
          }

          $ex5Info = Get-Item $expectedEx5

          if ($ex5Info.Length -le 0) {
            throw "EX5 was created but is empty."
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "       EX5 BUILD SUCCESSFUL"
          Write-Host "========================================"
          Write-Host "EX5:"
          Write-Host "  $($ex5Info.FullName)"
          Write-Host "Size:"
          Write-Host "  $($ex5Info.Length) bytes"

          "KINGSBOT_EX5=$expectedEx5" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8

          "KINGSBOT_COMPILE_LOG=$compileLog" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8

      - name: Verify Phase 6 build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========================================"
          Write-Host "        VERIFYING PHASE 6 BUILD"
          Write-Host "========================================"

          if (-not $env:KINGSBOT_EX5) {
            throw "KINGSBOT_EX5 is missing."
          }

          if (-not (Test-Path $env:KINGSBOT_EX5)) {
            throw "EX5 does not exist: $env:KINGSBOT_EX5"
          }

          $ex5 = Get-Item $env:KINGSBOT_EX5

          if ($ex5.Length -le 0) {
            throw "EX5 is empty."
          }

          Write-Host "EX5 verification: PASS"
          Write-Host "Path: $($ex5.FullName)"
          Write-Host "Size: $($ex5.Length) bytes"

          if ($env:KINGSBOT_COMPILE_LOG -and (Test-Path $env:KINGSBOT_COMPILE_LOG)) {
            Write-Host "Compiler log verification: PASS"
          }

          Write-Host ""
          Write-Host "PHASE 6 BUILD VERIFICATION: PASS"

      - name: Stage Phase 6 artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $artifactRoot = Join-Path $env:GITHUB_WORKSPACE "artifact"

          if (Test-Path $artifactRoot) {
            Remove-Item -Path $artifactRoot -Recurse -Force
          }

          New-Item -ItemType Directory -Path $artifactRoot -Force | Out-Null

          Copy-Item `
            -Path $env:KINGSBOT_EX5 `
            -Destination (Join-Path $artifactRoot "KingsBot_Phase6_Integration.ex5") `
            -Force

          if ($env:KINGSBOT_COMPILE_LOG -and (Test-Path $env:KINGSBOT_COMPILE_LOG)) {
            Copy-Item `
              -Path $env:KINGSBOT_COMPILE_LOG `
              -Destination (Join-Path $artifactRoot "KingsBot_Phase6_Integration.log") `
              -Force
          }

          Write-Host "========================================"
          Write-Host "        ARTIFACT STAGED"
          Write-Host "========================================"

          Get-ChildItem -Path $artifactRoot -File |
            Format-Table Name, Length

      - name: Upload King's Bot artifact
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-Phase6-EX5
          path: artifact/*
          if-no-files-found: error
          overwrite: true
