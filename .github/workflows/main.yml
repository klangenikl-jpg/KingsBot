name: Build King's Bot

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build King's Bot
    runs-on: windows-latest
    timeout-minutes: 20

    steps:

      # ============================================================
      # 1. SET UP
      # ============================================================
      - name: Set up job
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "KING'S BOT BUILD"
          Write-Host "========================================="
          Write-Host "Runner: $env:RUNNER_OS"
          Write-Host "Architecture: $env:PROCESSOR_ARCHITECTURE"
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"


      # ============================================================
      # 2. CHECKOUT
      # ============================================================
      - name: Checkout King's Bot
        uses: actions/checkout@v4


      # ============================================================
      # 3. INSTALL / LOCATE METATRADER 5
      # ============================================================
      - name: Install and locate MetaTrader 5
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "LOCATING METATRADER 5"
          Write-Host "========================================="

          $candidates = @(
            "C:\Program Files\MetaTrader 5\metaeditor64.exe",
            "C:\Program Files\MetaTrader 5\MetaEditor64.exe",
            "C:\Program Files\MetaTrader 5\metaeditor.exe"
          )

          $metaEditor = $null

          foreach ($candidate in $candidates) {
            if (Test-Path -LiteralPath $candidate) {
              $metaEditor = $candidate
              break
            }
          }

          if (-not $metaEditor) {
            $found = Get-ChildItem `
              -Path "C:\Program Files" `
              -Filter "metaeditor64.exe" `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if ($found) {
              $metaEditor = $found.FullName
            }
          }

          if (-not $metaEditor) {
            throw "MetaEditor64.exe could not be located."
          }

          $mt5Root = Split-Path -Parent $metaEditor
          $mql5Root = Join-Path $mt5Root "MQL5"

          if (-not (Test-Path -LiteralPath $mql5Root)) {
            New-Item `
              -ItemType Directory `
              -Path $mql5Root `
              -Force |
              Out-Null
          }

          "METAEDITOR=$metaEditor" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append `
            -Encoding utf8

          "MT5_ROOT=$mt5Root" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append `
            -Encoding utf8

          Write-Host "MetaEditor: $metaEditor"
          Write-Host "MT5 root:   $mt5Root"
          Write-Host "MQL5 root:  $mql5Root"


      # ============================================================
      # 4. PREPARE KING'S BOT SOURCE
      # ============================================================
      - name: Prepare King's Bot source
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "PREPARING KING'S BOT SOURCE"
          Write-Host "========================================="

          $workspace = $env:GITHUB_WORKSPACE
          $mql5Root = Join-Path $env:MT5_ROOT "MQL5"
          $expertRoot = Join-Path $mql5Root "Experts\KingsBot"

          New-Item `
            -ItemType Directory `
            -Path $expertRoot `
            -Force |
            Out-Null

          Write-Host "Workspace:   $workspace"
          Write-Host "Expert root: $expertRoot"

          # ----------------------------------------------------------
          # Find the main EA source
          # ----------------------------------------------------------
          $source = Get-ChildItem `
            -Path $workspace `
            -Filter "KingsBot_Phase6_Integration.mq5" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $source) {
            throw "KingsBot_Phase6_Integration.mq5 was not found in the repository."
          }

          Write-Host "Main source: $($source.FullName)"

          # ----------------------------------------------------------
          # Copy ALL MQL5 source files into the MT5 Expert directory.
          # This preserves the include structure.
          # ----------------------------------------------------------
          $sourceFiles = Get-ChildItem `
            -Path $workspace `
            -Recurse `
            -File |
            Where-Object {
              $_.Extension -in @(".mq5", ".mqh")
            }

          if (-not $sourceFiles) {
            throw "No .mq5 or .mqh source files were found."
          }

          foreach ($file in $sourceFiles) {

            $relative = $file.FullName.Substring(
              $workspace.Length
            ).TrimStart('\','/')

            $destination = Join-Path `
              $expertRoot `
              $relative

            $destinationDirectory = Split-Path `
              -Parent `
              $destination

            New-Item `
              -ItemType Directory `
              -Path $destinationDirectory `
              -Force |
              Out-Null

            Copy-Item `
              -LiteralPath $file.FullName `
              -Destination $destination `
              -Force
          }

          # ----------------------------------------------------------
          # IMPORTANT MQL5 CLEANUP
          #
          # Remove unsupported #pragma once directives from every
          # copied MQL5 source file.
          #
          # MQL5 compiler error 109 = invalid/unknown preprocessor
          # command. #pragma once is the known cause in our source.
          # ----------------------------------------------------------
          $copiedFiles = Get-ChildItem `
            -Path $expertRoot `
            -Recurse `
            -File |
            Where-Object {
              $_.Extension -in @(".mq5", ".mqh")
            }

          foreach ($file in $copiedFiles) {

            $text = Get-Content `
              -LiteralPath $file.FullName `
              -Raw `
              -Encoding UTF8

            # Remove BOM if present.
            $text = $text -replace "^\uFEFF", ""

            # Remove C/C++ style pragma-once directives.
            $text = $text -replace "(?m)^\s*#pragma\s+once\s*\r?\n?", ""

            # Normalize CRLF line endings.
            $text = $text -replace "`r?`n", "`r`n"

            [System.IO.File]::WriteAllText(
              $file.FullName,
              $text,
              [System.Text.UTF8Encoding]::new($false)
            )
          }

          # ----------------------------------------------------------
          # Verify the cleanup actually happened.
          # ----------------------------------------------------------
          $remainingPragma = Get-ChildItem `
            -Path $expertRoot `
            -Recurse `
            -File |
            Where-Object {
              $_.Extension -in @(".mq5", ".mqh")
            } |
            Select-String `
              -Pattern '^\s*#pragma\s+once' `
              -ErrorAction SilentlyContinue

          if ($remainingPragma) {
            Write-Host "WARNING: #pragma once remains in:"
            $remainingPragma | ForEach-Object {
              Write-Host $_.Path
            }

            throw "Unsupported #pragma once directive remains in the prepared source."
          }

          # ----------------------------------------------------------
          # Confirm the main source exists in the MT5 tree.
          # ----------------------------------------------------------
          $preparedSource = Join-Path `
            $expertRoot `
            "KingsBot_Phase6_Integration.mq5"

          if (-not (Test-Path -LiteralPath $preparedSource)) {
            throw "Prepared main source was not created: $preparedSource"
          }

          Write-Host ""
          Write-Host "SOURCE PREPARATION COMPLETE"
          Write-Host "Prepared source:"
          Write-Host $preparedSource

          $count = (
            Get-ChildItem `
              -Path $expertRoot `
              -Recurse `
              -File |
              Where-Object {
                $_.Extension -in @(".mq5", ".mqh")
              }
          ).Count

          Write-Host "MQL source files prepared: $count"


      # ============================================================
      # 5. COMPILE KING'S BOT
      # ============================================================
      - name: Compile King's Bot
        shell: pwsh
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "COMPILING KING'S BOT"
          Write-Host "========================================="

          $source = Join-Path `
            $env:MT5_ROOT `
            "MQL5\Experts\KingsBot\KingsBot_Phase6_Integration.mq5"

          $includeRoot = Join-Path `
            $env:MT5_ROOT `
            "MQL5"

          $ex5 = [System.IO.Path]::ChangeExtension(
            $source,
            ".ex5"
          )

          $log = [System.IO.Path]::ChangeExtension(
            $source,
            ".log"
          )

          if (-not (Test-Path -LiteralPath $source)) {
            throw "Main source does not exist: $source"
          }

          if (Test-Path -LiteralPath $ex5) {
            Remove-Item `
              -LiteralPath $ex5 `
              -Force
          }

          if (Test-Path -LiteralPath $log) {
            Remove-Item `
              -LiteralPath $log `
              -Force
          }

          Write-Host "MetaEditor:"
          Write-Host $env:METAEDITOR
          Write-Host ""
          Write-Host "Source:"
          Write-Host $source
          Write-Host ""
          Write-Host "Include root:"
          Write-Host $includeRoot
          Write-Host ""
          Write-Host "Running MetaEditor compiler..."

          & $env:METAEDITOR `
            "/compile:$source" `
            "/include:$includeRoot" `
            "/log"

          $metaExit = $LASTEXITCODE

          Write-Host ""
          Write-Host "MetaEditor exit code: $metaExit"

          Write-Host ""
          Write-Host "========== COMPILATION LOG =========="

          if (Test-Path -LiteralPath $log) {
            Get-Content `
              -LiteralPath $log `
              -Raw |
              Write-Host
          }
          else {
            Write-Host "No MetaEditor log file was produced."
          }

          Write-Host ""
          Write-Host "====================================="

          # Do not trust MetaEditor's process exit code alone.
          # The real success condition is the EX5 artifact.
          if (-not (Test-Path -LiteralPath $ex5)) {
            throw "King's Bot compilation failed: EX5 artifact was not created."
          }

          Write-Host "EX5 artifact created successfully:"
          Write-Host $ex5


      # ============================================================
      # 6. VERIFY EX5 ARTIFACT
      # ============================================================
      - name: Verify King's Bot EX5 artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $ex5 = Join-Path `
            $env:MT5_ROOT `
            "MQL5\Experts\KingsBot\KingsBot_Phase6_Integration.ex5"

          if (-not (Test-Path -LiteralPath $ex5)) {
            throw "EX5 verification failed. Artifact not found."
          }

          $file = Get-Item -LiteralPath $ex5

          if ($file.Length -le 0) {
            throw "EX5 verification failed. Artifact is empty."
          }

          Write-Host "========================================="
          Write-Host "EX5 VERIFICATION PASSED"
          Write-Host "========================================="
          Write-Host "File: $($file.FullName)"
          Write-Host "Size: $($file.Length) bytes"


      # ============================================================
      # 7. PACKAGE BUILD ARTIFACTS
      # ============================================================
      - name: Post King's Bot build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-Phase6-Build
          path: |
            ${{ env.MT5_ROOT }}\MQL5\Experts\KingsBot\KingsBot_Phase6_Integration.ex5
            ${{ env.MT5_ROOT }}\MQL5\Experts\KingsBot\*.log
          if-no-files-found: error


      # ============================================================
      # 8. BUILD SUMMARY
      # ============================================================
      - name: Build summary
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "========================================="
          Write-Host "KING'S BOT BUILD SUMMARY"
          Write-Host "========================================="
          Write-Host "STATUS: SUCCESS"
          Write-Host "EX5:   KingsBot_Phase6_Integration.ex5"
          Write-Host "========================================="
      # ============================================================
      # 8. FINAL STATUS
      # ============================================================
      - name: Build summary
        if: always()
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "========================================="
          Write-Host "KING'S BOT BUILD SUMMARY"
          Write-Host "========================================="

          if ($env:KINGSBOT_EX5 -and (Test-Path $env:KINGSBOT_EX5)) {
              Write-Host "EX5 STATUS: SUCCESS"
              Write-Host "EX5 FILE: $env:KINGSBOT_EX5"
          }
          else {
              Write-Host "EX5 STATUS: NOT GENERATED"
          }

          if ($env:KINGSBOT_LOG -and (Test-Path $env:KINGSBOT_LOG)) {
              Write-Host "COMPILE LOG: AVAILABLE"
          }
          else {
              Write-Host "COMPILE LOG: NOT AVAILABLE"
          }

          Write-Host "========================================="
