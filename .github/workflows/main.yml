name: Build King's Bot

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build King's Bot
    runs-on: windows-latest

    env:
      BOT_NAME: KingsBot
      BOT_SOURCE_NAME: KingsBot_Phase6_Integration.mq5

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout King's Bot
        uses: actions/checkout@v4

      # ============================================================
      # 2. FIND MT5
      # ============================================================
      - name: Locate MetaTrader 5
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "LOCATING METATRADER 5"
          Write-Host "========================================="

          $roots = @(
            "C:\Program Files\MetaTrader 5",
            "C:\Program Files (x86)\MetaTrader 5",
            "$env:LOCALAPPDATA\Programs\MetaTrader 5"
          )

          $metaEditor = $null

          foreach ($root in $roots) {
            Write-Host "Searching: $root"

            if (Test-Path $root) {
              $found = Get-ChildItem `
                -Path $root `
                -Filter "metaeditor64.exe" `
                -File `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

              if ($found) {
                $metaEditor = $found.FullName
                break
              }
            }
          }

          if (-not $metaEditor) {
            Write-Host "MetaEditor not found."
            Write-Host "Downloading MetaTrader 5 installer..."

            $installer = Join-Path `
              $env:RUNNER_TEMP `
              "mt5setup.exe"

            Invoke-WebRequest `
              -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" `
              -OutFile $installer

            if (-not (Test-Path $installer)) {
              throw "MT5 installer download failed."
            }

            Start-Process `
              -FilePath $installer `
              -ArgumentList "/auto" `
              -Wait

            Start-Sleep -Seconds 5

            foreach ($root in $roots) {
              if (Test-Path $root) {
                $found = Get-ChildItem `
                  -Path $root `
                  -Filter "metaeditor64.exe" `
                  -File `
                  -Recurse `
                  -ErrorAction SilentlyContinue |
                  Select-Object -First 1

                if ($found) {
                  $metaEditor = $found.FullName
                  break
                }
              }
            }
          }

          if (-not $metaEditor) {
            throw "MetaEditor64.exe could not be located."
          }

          $installRoot = Split-Path `
            $metaEditor `
            -Parent

          Write-Host ""
          Write-Host "Original MT5 installation:"
          Write-Host $installRoot

          # Store original installation path temporarily.
          "MT5_INSTALL_ROOT=$installRoot" >> $env:GITHUB_ENV

      # ============================================================
      # 3. CREATE WRITABLE MT5 BUILD ENVIRONMENT
      # ============================================================
      - name: Create writable MT5 build environment
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "CREATING WRITABLE MT5 BUILD ENVIRONMENT"
          Write-Host "========================================="

          $buildRoot = Join-Path `
            $env:RUNNER_TEMP `
            "KingsBot-MT5"

          if (Test-Path $buildRoot) {
            Remove-Item `
              -Path $buildRoot `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $buildRoot `
            -Force |
            Out-Null

          Write-Host "Copying MT5 installation..."

          Copy-Item `
            -Path (Join-Path $env:MT5_INSTALL_ROOT "*") `
            -Destination $buildRoot `
            -Recurse `
            -Force

          $metaEditor = Join-Path `
            $buildRoot `
            "metaeditor64.exe"

          if (-not (Test-Path $metaEditor)) {
            throw "MetaEditor was not copied to writable build environment."
          }

          $mql5Root = Join-Path `
            $buildRoot `
            "MQL5"

          $expertRoot = Join-Path `
            $mql5Root `
            "Experts\KingsBot"

          New-Item `
            -ItemType Directory `
            -Path $expertRoot `
            -Force |
            Out-Null

          Write-Host ""
          Write-Host "Writable MT5 root:"
          Write-Host $buildRoot

          Write-Host ""
          Write-Host "Writable MetaEditor:"
          Write-Host $metaEditor

          "MT5_ROOT=$buildRoot" >> $env:GITHUB_ENV
          "METAEDITOR_PATH=$metaEditor" >> $env:GITHUB_ENV
          "KING_EXPERT_ROOT=$expertRoot" >> $env:GITHUB_ENV

      # ============================================================
      # 4. PREPARE KING'S BOT SOURCE
      # ============================================================
      - name: Prepare King's Bot source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "PREPARING KING'S BOT SOURCE"
          Write-Host "========================================="

          $source = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter $env:BOT_SOURCE_NAME `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $source) {
            throw "King's Bot source '$env:BOT_SOURCE_NAME' was not found."
          }

          Write-Host "Source found:"
          Write-Host $source.FullName

          Copy-Item `
            -Path $source.FullName `
            -Destination (Join-Path $env:KING_EXPERT_ROOT $env:BOT_SOURCE_NAME) `
            -Force

          $sourceDirectory = Split-Path `
            $source.FullName `
            -Parent

          $mqhFiles = Get-ChildItem `
            -Path $sourceDirectory `
            -Filter "*.mqh" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue

          foreach ($file in $mqhFiles) {
            Copy-Item `
              -Path $file.FullName `
              -Destination (Join-Path $env:KING_EXPERT_ROOT $file.Name) `
              -Force
          }

          Write-Host ""
          Write-Host "King's Bot files:"

          Get-ChildItem `
            -Path $env:KING_EXPERT_ROOT `
            -File |
            ForEach-Object {
              Write-Host " - $($_.Name)"
            }

      # ============================================================
      # 5. VALIDATE SOURCE
      # ============================================================
      - name: Validate MQL5 source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "VALIDATING MQL5 SOURCE"
          Write-Host "========================================="

          $files = Get-ChildItem `
            -Path $env:KING_EXPERT_ROOT `
            -File `
            -Recurse |
            Where-Object {
              $_.Extension -in ".mq5", ".mqh"
            }

          if ($files.Count -eq 0) {
            throw "No MQL5 source files found."
          }

          foreach ($file in $files) {
            if ($file.Length -eq 0) {
              throw "Empty source file: $($file.FullName)"
            }

            Write-Host "OK: $($file.Name)"
          }

          Write-Host ""
          Write-Host "MQL5 source validation completed."

      # ============================================================
      # 6. COMPILE KING'S BOT
      # ============================================================
      - name: Compile King's Bot
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "COMPILING KING'S BOT"
          Write-Host "========================================="

          $source = Join-Path `
            $env:KING_EXPERT_ROOT `
            $env:BOT_SOURCE_NAME

          $ex5 = [System.IO.Path]::ChangeExtension(
            $source,
            ".ex5"
          )

          $log = [System.IO.Path]::ChangeExtension(
            $source,
            ".log"
          )

          Write-Host ""
          Write-Host "MetaEditor:"
          Write-Host $env:METAEDITOR_PATH

          Write-Host ""
          Write-Host "Source:"
          Write-Host $source

          Write-Host ""
          Write-Host "Expected EX5:"
          Write-Host $ex5

          if (-not (Test-Path $source)) {
            throw "Source file does not exist."
          }

          if (Test-Path $ex5) {
            Remove-Item `
              -Path $ex5 `
              -Force
          }

          if (Test-Path $log) {
            Remove-Item `
              -Path $log `
              -Force
          }

          Write-Host ""
          Write-Host "Launching MetaEditor..."

          $arguments = @(
            "/portable"
            "/compile:$source"
            "/log"
          )

          $process = Start-Process `
            -FilePath $env:METAEDITOR_PATH `
            -ArgumentList $arguments `
            -WorkingDirectory $env:MT5_ROOT `
            -Wait `
            -PassThru

          Write-Host ""
          Write-Host "MetaEditor exit code: $($process.ExitCode)"

          Start-Sleep -Seconds 2

          Write-Host ""
          Write-Host "========================================="
          Write-Host "COMPILER LOG"
          Write-Host "========================================="

          if (Test-Path $log) {
            Get-Content $log
          }
          else {
            Write-Host "NO LOG CREATED."
          }

          Write-Host ""
          Write-Host "========================================="
          Write-Host "CHECKING EX5"
          Write-Host "========================================="

          if (-not (Test-Path $ex5)) {
            throw "King's Bot EX5 was not created."
          }

          $size = (Get-Item $ex5).Length

          if ($size -le 0) {
            throw "King's Bot EX5 is empty."
          }

          Write-Host ""
          Write-Host "EX5 CREATED SUCCESSFULLY"
          Write-Host "File: $ex5"
          Write-Host "Size: $size bytes"

          $artifact = Join-Path `
            $env:RUNNER_TEMP `
            "KingsBot.ex5"

          Copy-Item `
            -Path $ex5 `
            -Destination $artifact `
            -Force

          "KING_EX5=$artifact" >> $env:GITHUB_ENV

      # ============================================================
      # 7. VERIFY EX5
      # ============================================================
      - name: Verify King's Bot EX5
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "VERIFYING KING'S BOT EX5"
          Write-Host "========================================="

          if (-not $env:KING_EX5) {
            throw "KING_EX5 was not set."
          }

          if (-not (Test-Path $env:KING_EX5)) {
            throw "King's Bot EX5 was not found."
          }

          $file = Get-Item $env:KING_EX5

          if ($file.Length -le 0) {
            throw "King's Bot EX5 is empty."
          }

          Write-Host ""
          Write-Host "EX5 VERIFIED"
          Write-Host "File: $($file.FullName)"
          Write-Host "Size: $($file.Length) bytes"

      # ============================================================
      # 8. PREPARE ARTIFACT
      # ============================================================
      - name: Prepare build artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $artifactRoot = Join-Path `
            $env:GITHUB_WORKSPACE `
            "build-artifacts"

          New-Item `
            -ItemType Directory `
            -Path $artifactRoot `
            -Force |
            Out-Null

          Copy-Item `
            -Path $env:KING_EX5 `
            -Destination (Join-Path $artifactRoot "KingsBot.ex5") `
            -Force

          Write-Host "Artifact prepared."

          Get-ChildItem `
            -Path $artifactRoot `
            -File |
            ForEach-Object {
              Write-Host " - $($_.Name)"
            }

      # ============================================================
      # 9. UPLOAD ARTIFACT
      # ============================================================
      - name: Upload King's Bot build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-EX5
          path: build-artifacts/KingsBot.ex5
          if-no-files-found: error

      # ============================================================
      # 10. BUILD SUMMARY
      # ============================================================
      - name: Build summary
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "========================================="
          Write-Host "KING'S BOT BUILD COMPLETE"
          Write-Host "========================================="
          Write-Host ""
          Write-Host "EX5 artifact: KingsBot.ex5"
          Write-Host ""
          Write-Host "SUCCESS"
