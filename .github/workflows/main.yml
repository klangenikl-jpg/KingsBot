name: Build King's Bot

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build King's Bot
    runs-on: windows-latest

    steps:
      - name: Checkout King's Bot
        uses: actions/checkout@v4

      - name: Locate MetaEditor and MT5 MQL5 root
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "LOCATING METATRADER 5"
          Write-Host "========================================="

          $metaEditor = Get-ChildItem `
            -Path "C:\Program Files","C:\Program Files (x86)" `
            -Filter "metaeditor64.exe" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $metaEditor) {
            Write-Host "MetaEditor not found. Installing MT5..."

            $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"

            Invoke-WebRequest `
              -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" `
              -OutFile $installer

            Start-Process `
              -FilePath $installer `
              -ArgumentList "/auto" `
              -Wait

            Start-Sleep -Seconds 5

            $metaEditor = Get-ChildItem `
              -Path "C:\Program Files","C:\Program Files (x86)" `
              -Filter "metaeditor64.exe" `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }

          if (-not $metaEditor) {
            throw "MetaEditor64.exe could not be located."
          }

          $terminalRoot = Join-Path `
            $env:APPDATA `
            "MetaQuotes\Terminal"

          if (-not (Test-Path $terminalRoot)) {
            throw "MetaQuotes Terminal directory was not found: $terminalRoot"
          }

          $tradeHeader = Get-ChildItem `
            -Path $terminalRoot `
            -Filter "Trade.mqh" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FullName -match '\\MQL5\\Include\\Trade\\Trade\.mqh$'
            } |
            Select-Object -First 1

          if (-not $tradeHeader) {
            throw "Standard MQL5 Trade.mqh was not found."
          }

          $mql5Root = Split-Path `
            (Split-Path `
              (Split-Path $tradeHeader.FullName -Parent) `
              -Parent) `
            -Parent

          $includeRoot = Join-Path `
            $mql5Root `
            "Include"

          if (-not (Test-Path (Join-Path $includeRoot "Trade\Trade.mqh"))) {
            throw "MQL5 standard Include\Trade\Trade.mqh is missing."
          }

          Write-Host ""
          Write-Host "MetaEditor:"
          Write-Host $metaEditor.FullName

          Write-Host ""
          Write-Host "MQL5 root:"
          Write-Host $mql5Root

          Write-Host ""
          Write-Host "MQL5 include root:"
          Write-Host $includeRoot

          "METAEDITOR_PATH=$($metaEditor.FullName)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          "MT5_MQL5_ROOT=$mql5Root" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          "MT5_INCLUDE_ROOT=$includeRoot" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      - name: Prepare King's Bot source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $workspace = $env:GITHUB_WORKSPACE
          $buildRoot = Join-Path `
            $env:RUNNER_TEMP `
            "KingsBotBuild"

          $expertRoot = Join-Path `
            $buildRoot `
            "MQL5\Experts\KingsBot"

          New-Item `
            -ItemType Directory `
            -Path $expertRoot `
            -Force |
            Out-Null

          $source = Get-ChildItem `
            -Path $workspace `
            -Filter "KingsBot_Phase6_Integration.mq5" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $source) {
            throw "KingsBot_Phase6_Integration.mq5 was not found."
          }

          Copy-Item `
            -LiteralPath $source.FullName `
            -Destination (Join-Path `
              $expertRoot `
              "KingsBot_Phase6_Integration.mq5") `
            -Force

          $headers = Get-ChildItem `
            -Path $workspace `
            -Filter "*.mqh" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue

          foreach ($file in $headers) {
            Copy-Item `
              -LiteralPath $file.FullName `
              -Destination (Join-Path `
                $expertRoot `
                $file.Name) `
              -Force
          }

          Write-Host ""
          Write-Host "========================================="
          Write-Host "BUILD SOURCE"
          Write-Host "========================================="

          Get-ChildItem `
            -Path $expertRoot `
            -File |
            ForEach-Object {
              Write-Host $_.Name
            }

          "KING_BUILD_ROOT=$buildRoot" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          "KING_EXPERT_ROOT=$expertRoot" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      - name: Normalize MQL5 headers
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "NORMALIZING MQL5 HEADERS"
          Write-Host "========================================="

          $root = $env:KING_EXPERT_ROOT

          $files = Get-ChildItem `
            -Path $root `
            -Filter "*.mqh" `
            -File `
            -Recurse `
            -ErrorAction Stop

          foreach ($file in $files) {
            $content = Get-Content `
              -LiteralPath $file.FullName `
              -Raw `
              -Encoding UTF8

            $original = $content

            $guardName = (
              "KB_HEADER_" +
              [System.IO.Path]::GetFileNameWithoutExtension($file.Name) `
                .ToUpper() `
                -replace '[^A-Z0-9_]', '_'
            )

            $content = [regex]::Replace(
              $content,
              '(?m)^[ \t]*#once[ \t]*\r?\n?',
              ''
            )

            $content = $content.Replace(
              '#include <Include\Trade\Trade.mqh>',
              '#include <Trade\Trade.mqh>'
            )

            $content = $content.Replace(
              '#include <Include/Trade/Trade.mqh>',
              '#include <Trade/Trade.mqh>'
            )

            $content = "#ifndef $guardName`r`n" +
                       "#define $guardName`r`n" +
                       $content.Trim() +
                       "`r`n#endif`r`n"

            if ($content -ne $original) {
              Set-Content `
                -LiteralPath $file.FullName `
                -Value $content `
                -Encoding utf8NoBOM

              Write-Host "Normalized: $($file.Name)"
            }
          }

          Write-Host ""
          Write-Host "Header validation:"

          foreach ($file in $files) {
            $firstLines = Get-Content `
              -LiteralPath $file.FullName |
              Select-Object -First 4

            Write-Host ""
            Write-Host "----- $($file.Name) -----"
            $firstLines | ForEach-Object {
              Write-Host $_
            }
          }

      - name: Verify standard MQL5 library
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $tradeHeader = Join-Path `
            $env:MT5_INCLUDE_ROOT `
            "Trade\Trade.mqh"

          Write-Host "========================================="
          Write-Host "VERIFYING STANDARD MQL5 LIBRARY"
          Write-Host "========================================="

          if (-not (Test-Path $tradeHeader)) {
            throw "Trade.mqh not available at: $tradeHeader"
          }

          Write-Host "Trade.mqh found:"
          Write-Host $tradeHeader

          Write-Host ""
          Write-Host "Trade library directory:"
          Get-ChildItem `
            -Path (Split-Path $tradeHeader -Parent) `
            -File |
            ForEach-Object {
              Write-Host $_.Name
            }

      - name: Compile King's Bot
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "========================================="
          Write-Host "COMPILING KING'S BOT"
          Write-Host "========================================="

          $metaEditor = $env:METAEDITOR_PATH

          $source = Join-Path `
            $env:KING_EXPERT_ROOT `
            "KingsBot_Phase6_Integration.mq5"

          if (-not (Test-Path $source)) {
            throw "Integration source not found: $source"
          }

          $log = Join-Path `
            $env:KING_EXPERT_ROOT `
            "KingsBot_Phase6_Integration.log"

          $arguments = @(
            "/compile:$source"
            "/include:$env:MT5_MQL5_ROOT"
            "/log"
          )

          Write-Host ""
          Write-Host "MetaEditor:"
          Write-Host $metaEditor

          Write-Host ""
          Write-Host "Source:"
          Write-Host $source

          Write-Host ""
          Write-Host "Include root:"
          Write-Host $env:MT5_MQL5_ROOT

          Write-Host ""
          Write-Host "Starting MetaEditor compiler..."

          $process = Start-Process `
            -FilePath $metaEditor `
            -ArgumentList $arguments `
            -Wait `
            -PassThru `
            -WindowStyle Hidden

          Write-Host ""
          Write-Host "MetaEditor process exit code:"
          Write-Host $process.ExitCode

          Start-Sleep -Seconds 3

          Write-Host ""
          Write-Host "========================================="
          Write-Host "COMPILER LOG"
          Write-Host "========================================="

          if (Test-Path $log) {
            Get-Content -LiteralPath $log
          }
          else {
            Write-Host "No compiler log found."
          }

          Write-Host ""
          Write-Host "========================================="
          Write-Host "SEARCHING FOR EX5"
          Write-Host "========================================="

          $ex5 = Get-ChildItem `
            -Path $env:KING_BUILD_ROOT `
            -Filter "KingsBot_Phase6_Integration.ex5" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $ex5) {
            throw "KingsBot EX5 was not created."
          }

          Write-Host ""
          Write-Host "EX5 CREATED:"
          Write-Host $ex5.FullName

          Write-Host ""
          Write-Host "SIZE:"
          Write-Host "$($ex5.Length) bytes"

          "EX5_PATH=$($ex5.FullName)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      - name: Stage artifacts
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $artifactRoot = Join-Path `
            $env:GITHUB_WORKSPACE `
            "build-artifacts"

          New-Item `
            -ItemType Directory `
            -Path $artifactRoot `
            -Force |
            Out-Null

          if ($env:EX5_PATH -and (Test-Path $env:EX5_PATH)) {
            Copy-Item `
              -LiteralPath $env:EX5_PATH `
              -Destination (Join-Path `
                $artifactRoot `
                "KingsBot_Phase6_Integration.ex5") `
              -Force
          }

          $log = Join-Path `
            $env:KING_EXPERT_ROOT `
            "KingsBot_Phase6_Integration.log"

          if (Test-Path $log) {
            Copy-Item `
              -LiteralPath $log `
              -Destination (Join-Path `
                $artifactRoot `
                "KingsBot_Phase6_Integration.log") `
              -Force
          }

      - name: Upload King's Bot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-build
          path: build-artifacts
          if-no-files-found: warn
          retention-days: 14

      - name: Final verification
        shell: pwsh
        run: |
          if (-not $env:EX5_PATH) {
            throw "Final verification failed: EX5 was not created."
          }

          if (-not (Test-Path $env:EX5_PATH)) {
            throw "Final verification failed: EX5 path does not exist."
          }

          Write-Host ""
          Write-Host "========================================="
          Write-Host "KING'S BOT BUILD SUCCESSFUL"
          Write-Host "========================================="
          Write-Host "EX5: $env:EX5_PATH"
          Write-Host "Size: $((Get-Item $env:EX5_PATH).Length) bytes"
