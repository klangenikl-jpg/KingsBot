name: Build King's Bot

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build King's Bot
    runs-on: windows-latest

    steps:
      - name: Get King's Bot source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Locate King's Bot source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $main = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter 'KingsBot_Phase6_Integration.mq5' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $main) {
            throw "KingsBot_Phase6_Integration.mq5 was not found in the repository."
          }

          "KINGSBOT_SOURCE_FILE=$($main.FullName)" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8

          "KINGSBOT_SOURCE_ROOT=$($main.Directory.FullName)" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8

          Write-Host "Main source: $($main.FullName)"
          Write-Host "Source root: $($main.Directory.FullName)"

      - name: Locate or install MetaTrader 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $mt5Root = Join-Path $env:RUNNER_TEMP 'MetaTrader5'
          New-Item -ItemType Directory -Path $mt5Root -Force | Out-Null

          $searchRoots = @(
            'C:\Program Files',
            'C:\Program Files (x86)',
            $env:RUNNER_TEMP
          )

          $metaEditor = $null

          foreach ($root in $searchRoots) {
            if (-not (Test-Path $root)) {
              continue
            }

            $found = Get-ChildItem `
              -Path $root `
              -Filter 'metaeditor64.exe' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if ($found) {
              $metaEditor = $found
              break
            }
          }

          if (-not $metaEditor) {
            Write-Host "MetaEditor64 was not found. Installing MetaTrader 5..."

            $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'

            Invoke-WebRequest `
              -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' `
              -OutFile $installer

            $process = Start-Process `
              -FilePath $installer `
              -ArgumentList @('/auto', "/path:$mt5Root") `
              -Wait `
              -PassThru

            Write-Host "MT5 installer exit code: $($process.ExitCode)"

            if ($process.ExitCode -ne 0) {
              throw "MetaTrader 5 installer failed with exit code $($process.ExitCode)."
            }

            Start-Sleep -Seconds 5

            $metaEditor = Get-ChildItem `
              -Path $mt5Root `
              -Filter 'metaeditor64.exe' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }

          if (-not $metaEditor) {
            throw "MetaEditor64.exe could not be located after installation."
          }

          $metaEditorPath = $metaEditor.FullName
          $mt5InstallRoot = $metaEditor.Directory.FullName

          Write-Host "MetaEditor found:"
          Write-Host $metaEditorPath

          "METAEDITOR=$metaEditorPath" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8

          "MT5_INSTALL_ROOT=$mt5InstallRoot" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: Prepare clean MQL5 build tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $buildRoot = Join-Path `
            $env:RUNNER_TEMP `
            'KingsBotBuild'

          if (Test-Path $buildRoot) {
            Remove-Item `
              -Path $buildRoot `
              -Recurse `
              -Force
          }

          $mql5Root = Join-Path `
            $buildRoot `
            'MQL5'

          $expertRoot = Join-Path `
            $mql5Root `
            'Experts\KingsBot'

          $includeRoot = Join-Path `
            $mql5Root `
            'Include'

          New-Item `
            -ItemType Directory `
            -Path $expertRoot `
            -Force | Out-Null

          New-Item `
            -ItemType Directory `
            -Path $includeRoot `
            -Force | Out-Null

          $installedMql5 = Join-Path `
            $env:MT5_INSTALL_ROOT `
            'MQL5'

          if (Test-Path $installedMql5) {
            Write-Host "Copying installed MQL5 library..."

            Copy-Item `
              -Path (Join-Path $installedMql5 '*') `
              -Destination $mql5Root `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $includeRoot `
            -Force | Out-Null

          New-Item `
            -ItemType Directory `
            -Path $expertRoot `
            -Force | Out-Null

          Write-Host "Copying King's Bot source..."

          Copy-Item `
            -Path (Join-Path $env:KINGSBOT_SOURCE_ROOT '*') `
            -Destination $expertRoot `
            -Recurse `
            -Force

          $stagedMain = Join-Path `
            $expertRoot `
            'KingsBot_Phase6_Integration.mq5'

          if (-not (Test-Path $stagedMain)) {
            throw "The Phase 6 main source was not copied to the build tree."
          }

          "KINGSBOT_BUILD_ROOT=$buildRoot" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8

          "KINGSBOT_MQL5_ROOT=$mql5Root" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8

          "KINGSBOT_BUILD_FILE=$stagedMain" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8

          Write-Host "MQL5 root:"
          Write-Host $mql5Root

          Write-Host "Build source:"
          Write-Host $stagedMain

      - name: Compile King's Bot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $source = $env:KINGSBOT_BUILD_FILE
          $include = $env:KINGSBOT_MQL5_ROOT

          $log = Join-Path `
            $env:KINGSBOT_BUILD_ROOT `
            'KingsBot_Phase6_Integration.log'

          Write-Host ""
          Write-Host "========================================"
          Write-Host "COMPILING KING'S BOT"
          Write-Host "========================================"
          Write-Host "MetaEditor: $env:METAEDITOR"
          Write-Host "Source:     $source"
          Write-Host "Include:    $include"
          Write-Host ""

          if (-not (Test-Path $env:METAEDITOR)) {
            throw "MetaEditor64.exe does not exist at $env:METAEDITOR"
          }

          if (-not (Test-Path $source)) {
            throw "King's Bot source does not exist at $source"
          }

          if (-not (Test-Path $include)) {
            throw "MQL5 include root does not exist at $include"
          }

          if (Test-Path $log) {
            Remove-Item `
              -Path $log `
              -Force
          }

          & $env:METAEDITOR `
            "/compile:$source" `
            "/include:$include" `
            "/log"

          $compileExit = $LASTEXITCODE

          Write-Host ""
          Write-Host "MetaEditor exit code: $compileExit"

          if (Test-Path $log) {
            Write-Host ""
            Write-Host "========== COMPILER LOG =========="

            Get-Content `
              -Path $log `
              -ErrorAction SilentlyContinue

            Write-Host "=================================="
          }

          if ($compileExit -ne 0) {
            throw "MetaEditor compilation failed with exit code $compileExit."
          }

          "KINGSBOT_COMPILE_LOG=$log" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: Find compiled EX5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $expected = Join-Path `
            $env:KINGSBOT_BUILD_ROOT `
            'MQL5\Experts\KingsBot\KingsBot_Phase6_Integration.ex5'

          if (Test-Path $expected) {
            Write-Host ""
            Write-Host "SUCCESS: EX5 created:"
            Write-Host $expected

            "KINGSBOT_EX5=$expected" | Out-File `
              -FilePath $env:GITHUB_ENV -Encoding utf8

            exit 0
          }

          $found = Get-ChildItem `
            -Path $env:KINGSBOT_BUILD_ROOT `
            -Filter 'KingsBot_Phase6_Integration.ex5' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $found) {
            throw "KingsBot_Phase6_Integration.ex5 was not produced."
          }

          Write-Host ""
          Write-Host "EX5 created:"
          Write-Host $found.FullName

          "KINGSBOT_EX5=$($found.FullName)" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: Stage artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $stage = Join-Path `
            $env:RUNNER_TEMP `
            'KingsBotArtifact'

          if (Test-Path $stage) {
            Remove-Item `
              -Path $stage `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $stage `
            -Force | Out-Null

          Copy-Item `
            -Path $env:KINGSBOT_EX5 `
            -Destination $stage `
            -Force

          if (
            $env:KINGSBOT_COMPILE_LOG -and
            (Test-Path $env:KINGSBOT_COMPILE_LOG)
          ) {
            Copy-Item `
              -Path $env:KINGSBOT_COMPILE_LOG `
              -Destination $stage `
              -Force
          }

          Write-Host "Artifact staged at:"
          Write-Host $stage

      - name: Upload King's Bot artifact
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-Phase6-EX5
          path: ${{ runner.temp }}/KingsBotArtifact/*
          if-no-files-found: error
