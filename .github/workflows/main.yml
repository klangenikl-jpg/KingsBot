name: Build King's Bot

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build King's Bot
    runs-on: windows-latest

    env:
      BOT_NAME: KingsBot
      BOT_SOURCE_NAME: KingsBot_Phase6_Integration.mq5

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout King's Bot
        uses: actions/checkout@v4

      # ============================================================
      # 2. LOCATE / INSTALL MT5
      # ============================================================
      - name: Locate MetaEditor
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "LOCATING METATRADER 5 / METAEDITOR"
          Write-Host "========================================="

          $roots = @(
            "C:\Program Files\MetaTrader 5",
            "C:\Program Files (x86)\MetaTrader 5",
            "$env:LOCALAPPDATA\Programs\MetaTrader 5"
          )

          $metaEditor = $null

          foreach ($root in $roots) {
            Write-Host "Searching: $root"

            if (Test-Path $root) {
              $found = Get-ChildItem `
                -Path $root `
                -Filter "metaeditor64.exe" `
                -File `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

              if ($found) {
                $metaEditor = $found.FullName
                break
              }
            }
          }

          if (-not $metaEditor) {
            Write-Host "MetaEditor not found. Downloading MT5..."

            $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"

            Invoke-WebRequest `
              -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" `
              -OutFile $installer

            if (-not (Test-Path $installer)) {
              throw "MT5 installer download failed."
            }

            Start-Process `
              -FilePath $installer `
              -ArgumentList "/auto" `
              -Wait

            Start-Sleep -Seconds 3

            foreach ($root in $roots) {
              if (Test-Path $root) {
                $found = Get-ChildItem `
                  -Path $root `
                  -Filter "metaeditor64.exe" `
                  -File `
                  -Recurse `
                  -ErrorAction SilentlyContinue |
                  Select-Object -First 1

                if ($found) {
                  $metaEditor = $found.FullName
                  break
                }
              }
            }
          }

          if (-not $metaEditor) {
            throw "MetaEditor64.exe could not be located."
          }

          $mt5Root = Split-Path $metaEditor -Parent

          Write-Host ""
          Write-Host "MetaEditor:"
          Write-Host $metaEditor
          Write-Host ""
          Write-Host "MT5 Root:"
          Write-Host $mt5Root

          "METAEDITOR_PATH=$metaEditor" >> $env:GITHUB_ENV
          "MT5_ROOT=$mt5Root" >> $env:GITHUB_ENV

      # ============================================================
      # 3. PREPARE KING'S BOT SOURCE
      # ============================================================
      - name: Prepare King's Bot source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "PREPARING KING'S BOT SOURCE"
          Write-Host "========================================="

          $workspace = $env:GITHUB_WORKSPACE
          $mt5Root = $env:MT5_ROOT

          $expertRoot = Join-Path `
            $mt5Root `
            "MQL5\Experts\KingsBot"

          New-Item `
            -ItemType Directory `
            -Path $expertRoot `
            -Force |
            Out-Null

          $source = Get-ChildItem `
            -Path $workspace `
            -Filter $env:BOT_SOURCE_NAME `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $source) {
            throw "King's Bot source '$env:BOT_SOURCE_NAME' was not found."
          }

          Write-Host ""
          Write-Host "Source found:"
          Write-Host $source.FullName

          Copy-Item `
            -Path $source.FullName `
            -Destination (Join-Path $expertRoot $env:BOT_SOURCE_NAME) `
            -Force

          $sourceDirectory = Split-Path $source.FullName -Parent

          $mqhFiles = Get-ChildItem `
            -Path $sourceDirectory `
            -Filter "*.mqh" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue

          foreach ($file in $mqhFiles) {
            Copy-Item `
              -Path $file.FullName `
              -Destination (Join-Path $expertRoot $file.Name) `
              -Force
          }

          Write-Host ""
          Write-Host "Files prepared:"

          Get-ChildItem `
            -Path $expertRoot `
            -File |
            ForEach-Object {
              Write-Host " - $($_.Name)"
            }

          "KING_EXPERT_ROOT=$expertRoot" >> $env:GITHUB_ENV

      # ============================================================
      # 4. VALIDATE MQL5 SOURCE
      # ============================================================
      - name: Validate MQL5 source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "VALIDATING MQL5 SOURCE"
          Write-Host "========================================="

          $root = $env:KING_EXPERT_ROOT

          $files = Get-ChildItem `
            -Path $root `
            -File `
            -Recurse |
            Where-Object {
              $_.Extension -in ".mq5", ".mqh"
            }

          if ($files.Count -eq 0) {
            throw "No MQL5 source files were found."
          }

          foreach ($file in $files) {
            Write-Host "Checking: $($file.Name)"

            $content = Get-Content `
              -Path $file.FullName `
              -Raw `
              -Encoding UTF8

            if ([string]::IsNullOrWhiteSpace($content)) {
              throw "Empty MQL5 source file: $($file.FullName)"
            }
          }

          Write-Host ""
          Write-Host "MQL5 source validation completed successfully."

      # ============================================================
      # 5. COMPILE KING'S BOT
      # ============================================================
      - name: Compile King's Bot
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "COMPILING KING'S BOT"
          Write-Host "========================================="

          $metaEditor = $env:METAEDITOR_PATH
          $root = $env:KING_EXPERT_ROOT

          $source = Join-Path `
            $root `
            $env:BOT_SOURCE_NAME

          if (-not (Test-Path $metaEditor)) {
            throw "MetaEditor not found: $metaEditor"
          }

          if (-not (Test-Path $source)) {
            throw "Source file not found: $source"
          }

          Write-Host ""
          Write-Host "MetaEditor:"
          Write-Host $metaEditor

          Write-Host ""
          Write-Host "Source:"
          Write-Host $source

          Write-Host ""
          Write-Host "Starting MetaEditor in portable mode..."

          $arguments = @(
            "/portable"
            "/compile:$source"
            "/log"
          )

          $process = Start-Process `
            -FilePath $metaEditor `
            -ArgumentList $arguments `
            -WorkingDirectory $env:MT5_ROOT `
            -Wait `
            -PassThru

          Write-Host ""
          Write-Host "MetaEditor exit code: $($process.ExitCode)"

          Start-Sleep -Seconds 2

          Write-Host ""
          Write-Host "Searching for generated EX5 files..."

          $ex5Files = Get-ChildItem `
            -Path $env:MT5_ROOT `
            -Filter "*.ex5" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue

          if ($ex5Files.Count -eq 0) {
            Write-Host ""
            Write-Host "NO EX5 FILE WAS CREATED."

            Write-Host ""
            Write-Host "Searching for compile logs..."

            $logs = Get-ChildItem `
              -Path $env:MT5_ROOT `
              -Filter "*.log" `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue

            foreach ($log in $logs) {
              Write-Host ""
              Write-Host "LOG: $($log.FullName)"
              Get-Content `
                -Path $log.FullName `
                -ErrorAction SilentlyContinue |
                Select-Object -Last 100
            }

            throw "MetaEditor did not create an EX5 file."
          }

          Write-Host ""
          Write-Host "EX5 FILES CREATED:"

          foreach ($file in $ex5Files) {
            Write-Host " - $($file.FullName)"
          }

          $target = $ex5Files |
            Where-Object {
              $_.Name -eq "KingsBot_Phase6_Integration.ex5"
            } |
            Select-Object -First 1

          if (-not $target) {
            $target = $ex5Files |
              Select-Object -First 1
          }

          if (-not $target) {
            throw "Generated EX5 could not be selected."
          }

          $artifact = Join-Path `
            $env:RUNNER_TEMP `
            "KingsBot.ex5"

          Copy-Item `
            -Path $target.FullName `
            -Destination $artifact `
            -Force

          Write-Host ""
          Write-Host "KING EX5:"
          Write-Host $artifact

          "KING_EX5=$artifact" >> $env:GITHUB_ENV

      # ============================================================
      # 6. VERIFY EX5
      # ============================================================
      - name: Verify King's Bot EX5
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "VERIFYING KING'S BOT EX5"
          Write-Host "========================================="

          if (-not $env:KING_EX5) {
            throw "KING_EX5 variable was not created."
          }

          if (-not (Test-Path $env:KING_EX5)) {
            throw "King's Bot EX5 was not created."
          }

          $file = Get-Item $env:KING_EX5

          if ($file.Length -le 0) {
            throw "King's Bot EX5 is empty."
          }

          Write-Host ""
          Write-Host "EX5 VERIFIED SUCCESSFULLY"
          Write-Host ""
          Write-Host "File:"
          Write-Host $file.FullName
          Write-Host ""
          Write-Host "Size:"
          Write-Host "$($file.Length) bytes"

      # ============================================================
      # 7. PREPARE BUILD ARTIFACTS
      # ============================================================
      - name: Prepare build artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $artifactRoot = Join-Path `
            $env:GITHUB_WORKSPACE `
            "build-artifacts"

          New-Item `
            -ItemType Directory `
            -Path $artifactRoot `
            -Force |
            Out-Null

          Copy-Item `
            -Path $env:KING_EX5 `
            -Destination (Join-Path $artifactRoot "KingsBot.ex5") `
            -Force

          Write-Host "Build artifact prepared:"
          Get-ChildItem `
            -Path $artifactRoot `
            -File |
            ForEach-Object {
              Write-Host " - $($_.FullName)"
            }

      # ============================================================
      # 8. UPLOAD KING'S BOT ARTIFACT
      # ============================================================
      - name: Upload King's Bot build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-EX5
          path: build-artifacts/KingsBot.ex5
          if-no-files-found: error

      # ============================================================
      # 9. BUILD SUMMARY
      # ============================================================
      - name: Build summary
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "========================================="
          Write-Host "KING'S BOT BUILD SUMMARY"
          Write-Host "========================================="
          Write-Host ""
          Write-Host "Source:"
          Write-Host $env:BOT_SOURCE_NAME
          Write-Host ""
          Write-Host "EX5:"
          Write-Host $env:KING_EX5
          Write-Host ""
          Write-Host "BUILD PIPELINE COMPLETED"
          Write-Host "========================================="
