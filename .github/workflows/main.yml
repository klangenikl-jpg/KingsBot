name: Build King's Bot

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build King's Bot
    runs-on: windows-latest

    steps:
      - name: Checkout King's Bot
        uses: actions/checkout@v4

      - name: Locate MetaEditor
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = "Stop"

          $paths = @(
            "C:\Program Files\MetaTrader 5\metaeditor64.exe",
            "C:\Program Files (x86)\MetaTrader 5\metaeditor64.exe"
          )

          $metaEditor = $null

          foreach ($path in $paths) {
            if (Test-Path $path) {
              $metaEditor = $path
              break
            }
          }

          if (-not $metaEditor) {
            $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"

            Invoke-WebRequest `
              -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" `
              -OutFile $installer

            Start-Process `
              -FilePath $installer `
              -ArgumentList "/auto" `
              -Wait

            Start-Sleep -Seconds 5

            foreach ($path in $paths) {
              if (Test-Path $path) {
                $metaEditor = $path
                break
              }
            }
          }

          if (-not $metaEditor) {
            throw "MetaEditor64.exe could not be located."
          }

          Write-Host "MetaEditor:"
          Write-Host $metaEditor

          "METAEDITOR_PATH=$metaEditor" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append `
            -Encoding utf8

      - name: Prepare King's Bot source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $workspace = $env:GITHUB_WORKSPACE
          $buildRoot = Join-Path $env:RUNNER_TEMP "KingsBot-MT5"
          $mql5Root = Join-Path $buildRoot "MQL5"
          $expertRoot = Join-Path $mql5Root "Experts\KingsBot"

          New-Item -ItemType Directory -Path $expertRoot -Force | Out-Null

          $source = Get-ChildItem `
            -Path $workspace `
            -Filter "KingsBot_Phase6_Integration.mq5" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $source) {
            throw "KingsBot_Phase6_Integration.mq5 was not found."
          }

          Write-Host "Source found:"
          Write-Host $source.FullName

          Copy-Item `
            -Path $source.FullName `
            -Destination (Join-Path $expertRoot $source.Name) `
            -Force

          $sourceDirectory = $source.Directory.FullName

          $includeFiles = Get-ChildItem `
            -Path $sourceDirectory `
            -Filter "*.mqh" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue

          foreach ($file in $includeFiles) {
            $relative = $file.FullName.Substring(
              $sourceDirectory.Length
            ).TrimStart('\')

            $destination = Join-Path $expertRoot $relative
            $destinationDirectory = Split-Path $destination -Parent

            New-Item `
              -ItemType Directory `
              -Path $destinationDirectory `
              -Force |
              Out-Null

            Copy-Item `
              -Path $file.FullName `
              -Destination $destination `
              -Force
          }

          Write-Host ""
          Write-Host "Source prepared at:"
          Write-Host $expertRoot

      - name: Remove unsupported MQL5 preprocessor directives
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = Join-Path $env:RUNNER_TEMP "KingsBot-MT5\MQL5\Experts\KingsBot"

          if (-not (Test-Path $root)) {
            throw "King's Bot build directory was not found."
          }

          $files = Get-ChildItem `
            -Path $root `
            -Recurse `
            -File `
            -Include "*.mq5","*.mqh"

          foreach ($file in $files) {
            $lines = Get-Content -LiteralPath $file.FullName

            $changed = $false
            $output = New-Object System.Collections.Generic.List[string]

            foreach ($line in $lines) {
              if ($line.Trim() -match '^#pragma\s+once\s*$') {
                Write-Host "Removing #pragma once:"
                Write-Host $file.FullName
                $changed = $true
              }
              else {
                $output.Add($line)
              }
            }

            if ($changed) {
              Set-Content `
                -LiteralPath $file.FullName `
                -Value $output `
                -Encoding UTF8
            }
          }

          Write-Host ""
          Write-Host "MQL5 preprocessor cleanup completed."

      - name: Compile King's Bot
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = "Stop"

          $metaEditor = $env:METAEDITOR_PATH
          $source = Join-Path `
            $env:RUNNER_TEMP `
            "KingsBot-MT5\MQL5\Experts\KingsBot\KingsBot_Phase6_Integration.mq5"

          $log = Join-Path `
            $env:RUNNER_TEMP `
            "KingsBot_compile.log"

          if (-not (Test-Path $source)) {
            throw "King's Bot source was not found."
          }

          Write-Host "========================================="
          Write-Host "COMPILING KING'S BOT"
          Write-Host "========================================="

          Write-Host "MetaEditor:"
          Write-Host $metaEditor

          Write-Host ""
          Write-Host "Source:"
          Write-Host $source

          if (Test-Path $log) {
            Remove-Item $log -Force
          }

          $arguments = @(
            "/portable"
            "/compile:`"$source`""
            "/log:`"$log`""
          )

          $process = Start-Process `
            -FilePath $metaEditor `
            -ArgumentList $arguments `
            -Wait `
            -PassThru

          Write-Host ""
          Write-Host "MetaEditor exit code: $($process.ExitCode)"

          if (Test-Path $log) {
            Write-Host ""
            Write-Host "========================================="
            Write-Host "COMPILER LOG"
            Write-Host "========================================="

            Get-Content -LiteralPath $log
          }
          else {
            Write-Host "No compiler log was produced."
          }

          if ($process.ExitCode -ne 0) {
            throw "MetaEditor compilation process failed."
          }

      - name: Verify King's Bot EX5
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = Join-Path `
            $env:RUNNER_TEMP `
            "KingsBot-MT5\MQL5\Experts"

          Write-Host "========================================="
          Write-Host "VERIFYING KING'S BOT EX5"
          Write-Host "========================================="

          $ex5 = Get-ChildItem `
            -Path $root `
            -Filter "KingsBot_Phase6_Integration.ex5" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $ex5) {
            Write-Host ""
            Write-Host "Available EX5 files:"

            Get-ChildItem `
              -Path $root `
              -Filter "*.ex5" `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              ForEach-Object {
                Write-Host $_.FullName
              }

            throw "King's Bot EX5 was not created."
          }

          Write-Host ""
          Write-Host "EX5 CREATED:"
          Write-Host $ex5.FullName
          Write-Host ""
          Write-Host "Size:"
          Write-Host $ex5.Length

          "EX5_PATH=$($ex5.FullName)" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append `
            -Encoding utf8

      - name: Prepare build artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $artifactRoot = Join-Path `
            $env:GITHUB_WORKSPACE `
            "build-artifacts"

          $ex5 = Get-ChildItem `
            -Path $env:RUNNER_TEMP `
            -Filter "KingsBot_Phase6_Integration.ex5" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $ex5) {
            throw "EX5 artifact could not be located."
          }

          New-Item `
            -ItemType Directory `
            -Path $artifactRoot `
            -Force |
            Out-Null

          Copy-Item `
            -Path $ex5.FullName `
            -Destination (Join-Path `
              $artifactRoot `
              "KingsBot_Phase6_Integration.ex5") `
            -Force

          $log = Join-Path `
            $env:RUNNER_TEMP `
            "KingsBot_compile.log"

          if (Test-Path $log) {
            Copy-Item `
              -Path $log `
              -Destination (Join-Path `
                $artifactRoot `
                "KingsBot_compile.log") `
              -Force
          }

      - name: Upload King's Bot build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-build
          path: build-artifacts
          if-no-files-found: error

      - name: Build summary
        shell: pwsh
        run: |
          Write-Host "========================================="
          Write-Host "KING'S BOT BUILD COMPLETE"
          Write-Host "========================================="
          Write-Host "EX5 artifact: KingsBot-build"
