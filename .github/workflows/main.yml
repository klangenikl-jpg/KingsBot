name: KingsBot MQL5 Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Get KingsBot source
        uses: actions/checkout@v4

      - name: Show source files
        shell: powershell
        run: |
          Write-Host "=== SOURCE FILES ==="

          Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Recurse `
            -File |
            Select-Object FullName

      - name: Install MetaTrader 5
        shell: powershell
        run: |
          $installer = "$env:RUNNER_TEMP\mt5setup.exe"

          Write-Host "Downloading MetaTrader 5 installer..."

          Invoke-WebRequest `
            -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" `
            -OutFile $installer

          if (-not (Test-Path $installer)) {
            Write-Error "MetaTrader 5 installer was not downloaded."
            exit 1
          }

          Write-Host "Installing MetaTrader 5..."

          Start-Process `
            -FilePath $installer `
            -ArgumentList "/auto" `
            -Wait

          Write-Host "MetaTrader 5 installation finished."

      - name: Find MetaEditor
        id: metaeditor
        shell: powershell
        run: |
          Write-Host "=== SEARCHING FOR METAEDITOR ==="

          $roots = @(
            "$env:ProgramFiles",
            "${env:ProgramFiles(x86)}",
            "$env:APPDATA",
            "$env:LOCALAPPDATA"
          )

          $found = $null

          foreach ($root in $roots) {
            if (Test-Path $root) {
              Write-Host "Searching: $root"

              $found = Get-ChildItem `
                -Path $root `
                -Filter "metaeditor64.exe" `
                -Recurse `
                -File `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

              if ($found) {
                break
              }
            }
          }

          if (-not $found) {
            Write-Error "MetaEditor was not found."
            exit 1
          }

          Write-Host "MetaEditor found at:"
          Write-Host $found.FullName

          "path=$($found.FullName)" >> $env:GITHUB_OUTPUT

      - name: Find KingsBot source
        id: source
        shell: powershell
        run: |
          Write-Host "=== SEARCHING FOR KINGSBOT SOURCE ==="

          $source = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter "KingsBot_Phase6_Integration.mq5" `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $source) {
            Write-Error "KingsBot_Phase6_Integration.mq5 was not found."

            Write-Host "=== AVAILABLE MQ5 FILES ==="

            Get-ChildItem `
              -Path $env:GITHUB_WORKSPACE `
              -Filter "*.mq5" `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
              Select-Object FullName

            exit 1
          }

          Write-Host "KingsBot source found at:"
          Write-Host $source.FullName

          "path=$($source.FullName)" >> $env:GITHUB_OUTPUT

      - name: Compile KingsBot
        shell: powershell
        run: |
          $editor = "${{ steps.metaeditor.outputs.path }}"
          $source = "${{ steps.source.outputs.path }}"
          $log = Join-Path $env:GITHUB_WORKSPACE "compile.log"

          Write-Host "=== COMPILING KINGSBOT ==="
          Write-Host "MetaEditor: $editor"
          Write-Host "Source: $source"
          Write-Host "Log: $log"

          if (-not (Test-Path $editor)) {
            Write-Error "MetaEditor executable does not exist."
            exit 1
          }

          if (-not (Test-Path $source)) {
            Write-Error "KingsBot source file does not exist."
            exit 1
          }

          Write-Host "Starting MetaEditor compilation..."

          & $editor "/compile:$source" "/log:$log"

          if (Test-Path $log) {
            Write-Host "=== COMPILE LOG ==="
            Get-Content $log
          }
          else {
            Write-Error "MetaEditor did not create compile.log."
            exit 1
          }

          if ($LASTEXITCODE -ne 0) {
            Write-Error "MetaEditor returned exit code $LASTEXITCODE."
            exit 1
          }

      - name: Verify build
        shell: powershell
        run: |
          Write-Host "=== SEARCHING FOR EX5 FILES ==="

          $files = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter "*.ex5" `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue

          if (-not $files) {
            Write-Error "No .ex5 file was created."

            Write-Host "=== WORKSPACE CONTENTS ==="

            Get-ChildItem `
              -Path $env:GITHUB_WORKSPACE `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
              Select-Object FullName

            exit 1
          }

          Write-Host "=== EX5 FILES FOUND ==="

          $files |
            Select-Object FullName, Length, LastWriteTime

          Write-Host ""
          Write-Host "=== COMPILE LOG ==="

          $log = Join-Path $env:GITHUB_WORKSPACE "compile.log"

          if (Test-Path $log) {
            Get-Content $log
          }
          else {
            Write-Error "compile.log was not created."
            exit 1
          }

      - name: Prepare build artifacts
        shell: powershell
        run: |
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE "KingsBot-Build"

          New-Item `
            -ItemType Directory `
            -Path $artifactDir `
            -Force |
            Out-Null

          Write-Host "=== COPYING BUILD RESULTS ==="

          $log = Join-Path $env:GITHUB_WORKSPACE "compile.log"

          if (Test-Path $log) {
            Copy-Item `
              -Path $log `
              -Destination $artifactDir `
              -Force
          }

          $files = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter "*.ex5" `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue

          foreach ($file in $files) {
            Copy-Item `
              -Path $file.FullName `
              -Destination $artifactDir `
              -Force
          }

          Write-Host "=== ARTIFACT DIRECTORY ==="

          Get-ChildItem `
            -Path $artifactDir `
            -File |
            Select-Object FullName, Length

      - name: Upload build results
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-Phase6-Build
          path: KingsBot-Build
          if-no-files-found: error
