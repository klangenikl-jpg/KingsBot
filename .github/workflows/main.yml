name: KingsBot MQL5 Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Get KingsBot source
        uses: actions/checkout@v4

      - name: Show source files
        shell: powershell
        run: |
          Write-Host "=== SOURCE FILES ==="
          Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -File |
            Select-Object FullName

      - name: Install MetaTrader 5
        shell: powershell
        run: |
          $installer = "$env:RUNNER_TEMP\mt5setup.exe"

          Write-Host "Downloading MetaTrader 5 installer..."

          Invoke-WebRequest `
            -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" `
            -OutFile $installer

          if (-not (Test-Path $installer)) {
            Write-Error "MetaTrader 5 installer was not downloaded."
            exit 1
          }

          Write-Host "Installing MetaTrader 5..."

          Start-Process `
            -FilePath $installer `
            -ArgumentList "/auto" `
            -Wait

          Write-Host "MetaTrader 5 installation finished."

      - name: Find MetaEditor
        id: metaeditor
        shell: powershell
        run: |
          Write-Host "=== SEARCHING FOR METAEDITOR ==="

          $roots = @(
            "$env:ProgramFiles",
            "${env:ProgramFiles(x86)}",
            "$env:APPDATA",
            "$env:LOCALAPPDATA"
          )

          $found = $null

          foreach ($root in $roots) {
            if (Test-Path $root) {
              Write-Host "Searching: $root"

              $found = Get-ChildItem `
                -Path $root `
                -Filter "metaeditor64.exe" `
                -Recurse `
                -File `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

              if ($found) {
                break
              }
            }
          }

          if (-not $found) {
            Write-Error "MetaEditor was not found."
            exit 1
          }

          Write-Host "MetaEditor found at:"
          Write-Host $found.FullName

          "path=$($found.FullName)"
