name: King's Bot - Phase 6 Final Validation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase6-validation:
    name: Phase 6 Final Build and MT5 Validation
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout King's Bot
        uses: actions/checkout@v5

      - name: Locate Phase 6 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Recurse `
            -File `
            -Filter 'KingsBot_Phase6_Integration.mq5' |
            Select-Object -First 1

          if (-not $source) {
            throw "KingsBot_Phase6_Integration.mq5 was not found."
          }

          "KB_SOURCE=$($source.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "KB_SOURCE_ROOT=$($source.Directory.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "SOURCE:"
          Write-Host $source.FullName

      - name: Install and verify MetaTrader 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          $customRoot = Join-Path $env:RUNNER_TEMP 'KingsBot-MT5'

          Write-Host "Downloading official MetaTrader 5 web installer..."

          Invoke-WebRequest `
            -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' `
            -OutFile $installer `
            -UseBasicParsing

          if (-not (Test-Path $installer)) {
            throw "MetaTrader 5 installer was not downloaded."
          }

          if (Test-Path $customRoot) {
            Remove-Item $customRoot -Recurse -Force
          }

          New-Item -ItemType Directory -Path $customRoot -Force | Out-Null

          $install = Start-Process `
            -FilePath $installer `
            -ArgumentList @(
              '/auto',
              "/path:`"$customRoot`""
            ) `
            -Wait `
            -PassThru

          Write-Host "Custom-path installer exit code: $($install.ExitCode)"

          $searchRoots = @(
            $customRoot,
            'C:\Program Files',
            'C:\Program Files (x86)',
            (Join-Path $env:LOCALAPPDATA 'Programs'),
            (Join-Path $env:APPDATA 'MetaQuotes')
          ) | Where-Object {
            $_ -and (Test-Path $_)
          } | Select-Object -Unique

          $terminal = $null
          $editor = $null

          foreach ($root in $searchRoots) {
            if (-not $terminal) {
              $terminal = Get-ChildItem `
                -Path $root `
                -Recurse `
                -File `
                -Filter 'terminal64.exe' `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1
            }

            if (-not $editor) {
              $editor = Get-ChildItem `
                -Path $root `
                -Recurse `
                -File `
                -Filter 'metaeditor64.exe' `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1
            }

            if ($terminal -and $editor) {
              break
            }
          }

          if (-not $terminal -or -not $editor) {
            Write-Host "Custom-path installation did not produce both executables."
            Write-Host "Retrying official installer in standard automatic mode..."

            $retry = Start-Process `
              -FilePath $installer `
              -ArgumentList @('/auto') `
              -Wait `
              -PassThru

            Write-Host "Standard-path installer exit code: $($retry.ExitCode)"

            foreach ($root in @(
              'C:\Program Files',
              'C:\Program Files (x86)',
              (Join-Path $env:LOCALAPPDATA 'Programs'),
              (Join-Path $env:APPDATA 'MetaQuotes')
            ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique) {

              if (-not $terminal) {
                $terminal = Get-ChildItem `
                  -Path $root `
                  -Recurse `
                  -File `
                  -Filter 'terminal64.exe' `
                  -ErrorAction SilentlyContinue |
                  Select-Object -First 1
              }

              if (-not $editor) {
                $editor = Get-ChildItem `
                  -Path $root `
                  -Recurse `
                  -File `
                  -Filter 'metaeditor64.exe' `
                  -ErrorAction SilentlyContinue |
                  Select-Object -First 1
              }

              if ($terminal -and $editor) {
                break
              }
            }
          }

          if (-not $terminal -or -not $editor) {
            Write-Host "========== MT5 INSTALL DIAGNOSTICS =========="
            Write-Host "Custom installer exit code: $($install.ExitCode)"

            if ($retry) {
              Write-Host "Standard installer exit code: $($retry.ExitCode)"
            }

            Write-Host "Installed MT5-related executables found:"

            Get-ChildItem `
              'C:\Program Files',
              'C:\Program Files (x86)',
              $env:LOCALAPPDATA,
              $env:APPDATA `
              -Recurse `
              -File `
              -Include 'terminal*.exe','metaeditor*.exe' `
              -ErrorAction SilentlyContinue |
              Select-Object FullName, Length, LastWriteTime |
              Format-Table -AutoSize

            throw "MetaTrader 5 installation could not be verified."
          }

          $mt5Root = Split-Path $terminal.FullName -Parent

          "MT5_ROOT=$mt5Root" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "MT5_TERMINAL=$($terminal.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "METAEDITOR=$($editor.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "MT5 INSTALLATION VERIFIED"
          Write-Host "MT5 root:   $mt5Root"
          Write-Host "Terminal:   $($terminal.FullName)"
          Write-Host "MetaEditor: $($editor.FullName)"

      - name: Prepare clean KingsBot MT5 tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $target = 'C:\MT5\MQL5\Experts\KingsBot'

          if (Test-Path $target) {
            Remove-Item $target -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $target `
            -Force | Out-Null

          Copy-Item `
            -Path (Join-Path $env:KB_SOURCE_ROOT '*') `
            -Destination $target `
            -Recurse `
            -Force

          $compileSource = Join-Path `
            $target `
            'KingsBot_Phase6_Integration.mq5'

          if (-not (Test-Path $compileSource)) {
            throw "Prepared Phase 6 source was not found."
          }

          "KB_COMPILE_SOURCE=$compileSource" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Prepared source:"
          Write-Host $compileSource

      - name: Compile Phase 6
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $source = $env:KB_COMPILE_SOURCE
          $log = [IO.Path]::ChangeExtension($source, '.log')
          $ex5 = [IO.Path]::ChangeExtension($source, '.ex5')

          Remove-Item $log, $ex5 -Force -ErrorAction SilentlyContinue

          Write-Host "========================================"
          Write-Host "KING'S BOT PHASE 6 COMPILATION"
          Write-Host "========================================"

          $process = Start-Process `
            -FilePath $env:METAEDITOR `
            -ArgumentList @(
              "/compile:$source",
              "/log"
            ) `
            -WorkingDirectory (Split-Path $source -Parent) `
            -Wait `
            -PassThru

          Write-Host "MetaEditor exit code: $($process.ExitCode)"

          if (-not (Test-Path $log)) {
            throw "Compiler log was not produced."
          }

          Write-Host ""
          Write-Host "========== COMPILER LOG =========="
          Get-Content $log
          Write-Host "==================================="

          if (-not (Test-Path $ex5)) {
            throw "Compilation did not produce the Phase 6 EX5."
          }

          if ((Get-Item $ex5).Length -le 0) {
            throw "Phase 6 EX5 is empty."
          }

          $compilerErrors = Select-String `
            -Path $log `
            -Pattern '(?i)\berror\b' `
            -ErrorAction SilentlyContinue

          if ($compilerErrors) {
            Write-Host "Compiler error text detected:"

            $compilerErrors | ForEach-Object {
              Write-Host $_.Line
            }

            throw "Compiler log contains error text."
          }

          Write-Host ""
          Write-Host "PHASE 6 COMPILATION: PASS"
          Write-Host "EX5 SIZE: $((Get-Item $ex5).Length) bytes"

          "KB_EX5=$ex5" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "KB_COMPILE_LOG=$log" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Prepare Strategy Tester
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $reports = 'C:\MT5\reports'

          if (Test-Path $reports) {
            Remove-Item $reports -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $reports `
            -Force | Out-Null

          $config = 'C:\MT5\KingsBot_Phase6_Tester.ini'

          @"
[Common]
KeepPrivate=1

[Experts]
AllowLiveTrading=0
AllowDllImport=0
Enabled=1

[Tester]
Expert=KingsBot\KingsBot_Phase6_Integration.ex5
Symbol=EURUSD
Period=M15
Model=4
Optimization=0
ExecutionMode=0
FromDate=2025.01.01
ToDate=2026.08.01
Deposit=10000
Currency=USD
Leverage=1:100
UseLocal=1
UseRemote=0
UseCloud=0
Visual=0
Report=reports\KingsBot_Phase6_Tester.htm
ReplaceReport=1
ShutdownTerminal=1
"@ | Set-Content `
            -Path $config `
            -Encoding Unicode

          Write-Host "Strategy Tester configuration:"
          Get-Content $config

          "KB_TEST_CONFIG=$config" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run MT5 Strategy Tester
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host ""
          Write-Host "========================================"
          Write-Host "KING'S BOT PHASE 6 STRATEGY TEST"
          Write-Host "========================================"
          Write-Host "Model: Every Tick based on Real Ticks"
          Write-Host "Symbol: EURUSD"
          Write-Host "Period: M15"
          Write-Host ""

          $process = Start-Process `
            -FilePath $env:MT5_TERMINAL `
            -ArgumentList @(
              '/portable',
              "/config:$env:KB_TEST_CONFIG"
            ) `
            -WorkingDirectory 'C:\MT5' `
            -PassThru

          Write-Host "Tester process started: $($process.Id)"

          $finished = Wait-Process `
            -Id $process.Id `
            -Timeout 900 `
            -ErrorAction SilentlyContinue

          if (-not $finished) {
            Write-Host "Tester exceeded 15 minutes."

            Stop-Process `
              -Id $process.Id `
              -Force `
              -ErrorAction SilentlyContinue

            throw "Strategy Tester timed out."
          }

          Write-Host "Strategy Tester process finished."

      - name: Verify Strategy Tester result
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $report = 'C:\MT5\reports\KingsBot_Phase6_Tester.htm'

          Write-Host "Looking for tester report..."

          if (-not (Test-Path $report)) {
            Write-Host "Report was not produced."

            Write-Host ""
            Write-Host "MT5 logs:"

            Get-ChildItem `
              'C:\MT5' `
              -Recurse `
              -File `
              -Include '*.log' `
              -ErrorAction SilentlyContinue |
              Select-Object FullName, Length, LastWriteTime

            throw "Strategy Tester did not produce a report."
          }

          if ((Get-Item $report).Length -le 0) {
            throw "Strategy Tester report is empty."
          }

          Write-Host ""
          Write-Host "PHASE 6 STRATEGY TEST: REPORT PRODUCED"
          Write-Host "Report size: $((Get-Item $report).Length) bytes"

          $runtimeLogs = Get-ChildItem `
            'C:\MT5' `
            -Recurse `
            -File `
            -Include '*.log' `
            -ErrorAction SilentlyContinue

          if ($runtimeLogs) {
            $critical = $runtimeLogs |
              Select-String `
                -Pattern '(?i)array out of range|zero divide|cannot load|failed to load|invalid pointer|uninit|critical error' `
                -ErrorAction SilentlyContinue

            if ($critical) {
              Write-Host ""
              Write-Host "CRITICAL RUNTIME MESSAGES:"

              $critical | ForEach-Object {
                Write-Host "$($_.Path): $($_.Line)"
              }

              throw "Critical runtime messages were found."
            }
          }

          Write-Host ""
          Write-Host "PHASE 6 FINAL VALIDATION: PASS"

      - name: Package validation evidence
        if: always()
        shell: pwsh
        run: |
          $evidence = Join-Path `
            $env:GITHUB_WORKSPACE `
            'phase6-validation-evidence'

          New-Item `
            -ItemType Directory `
            -Path $evidence `
            -Force | Out-Null

          if ($env:KB_EX5 -and (Test-Path $env:KB_EX5)) {
            Copy-Item `
              $env:KB_EX5 `
              $evidence `
              -Force
          }

          if ($env:KB_COMPILE_LOG -and (Test-Path $env:KB_COMPILE_LOG)) {
            Copy-Item `
              $env:KB_COMPILE_LOG `
              $evidence `
              -Force
          }

          if (Test-Path 'C:\MT5\reports\KingsBot_Phase6_Tester.htm') {
            Copy-Item `
              'C:\MT5\reports\KingsBot_Phase6_Tester.htm' `
              $evidence `
              -Force
          }

          Get-ChildItem `
            'C:\MT5' `
            -Recurse `
            -File `
            -Include '*.log' `
            -ErrorAction SilentlyContinue |
            ForEach-Object {
              Copy-Item `
                $_.FullName `
                $evidence `
                -Force `
                -ErrorAction SilentlyContinue
            }

          Write-Host "Validation evidence:"

          Get-ChildItem $evidence |
            Select-Object Name, Length, LastWriteTime

      - name: Upload Phase 6 validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-Phase6-Final-Validation
          path: phase6-validation-evidence
          if-no-files-found: error
          retention-days: 14
