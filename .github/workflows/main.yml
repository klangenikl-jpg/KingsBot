name: Build King's Bot

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build King's Bot
    runs-on: windows-latest

    steps:
      - name: Checkout King's Bot
        uses: actions/checkout@v4

      - name: Prepare MT5 compiler
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "PREPARING MT5 COMPILER"
          Write-Host "========================================="

          $metaEditor = Get-ChildItem `
            -Path "C:\Program Files","C:\Program Files (x86)" `
            -Filter "MetaEditor64.exe" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $metaEditor) {
            throw "MetaEditor64.exe was not found on the runner."
          }

          Write-Host "MetaEditor:"
          Write-Host $metaEditor.FullName

          "METAEDITOR_PATH=$($metaEditor.FullName)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      - name: Prepare King's Bot source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "PREPARING KING'S BOT SOURCE"
          Write-Host "========================================="

          $workspace = $env:GITHUB_WORKSPACE
          $buildRoot = Join-Path $env:RUNNER_TEMP "KingsBot-MQL5"
          $includeRoot = Join-Path $buildRoot "Include"

          New-Item `
            -ItemType Directory `
            -Path $buildRoot `
            -Force |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Path $includeRoot `
            -Force |
           
