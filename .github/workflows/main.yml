name: King's Bot - Phase 6 Final Validation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase6-validation:
    name: Phase 6 Final Build and MT5 Validation
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout King's Bot
        uses: actions/checkout@v4

      - name: Build compile test and collect evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $evidence = Join-Path $env:GITHUB_WORKSPACE 'phase6-validation-evidence'

          New-Item `
            -ItemType Directory `
            -Path $evidence `
            -Force | Out-Null

          Write-Host '=== LOCATE PHASE 6 SOURCE ==='

          $source = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Recurse `
            -File `
            -Filter 'KingsBot_Phase6_Integration.mq5' |
            Select-Object -First 1

          if (-not $source) {
            throw 'KingsBot_Phase6_Integration.mq5 was not found.'
          }

          $sourceRoot = $source.Directory.FullName

          Write-Host "Phase 6 source: $($source.FullName)"

          Write-Host '=== INSTALL AND VERIFY METATRADER 5 ==='

          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          $customRoot = Join-Path $env:RUNNER_TEMP 'KingsBot-MT5'

          Invoke-WebRequest `
            -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' `
            -OutFile $installer `
            -UseBasicParsing

          if (-not (Test-Path $installer)) {
            throw 'MetaTrader 5 installer was not downloaded.'
          }

          if (Test-Path $customRoot) {
            Remove-Item `
              $customRoot `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $customRoot `
            -Force | Out-Null

          $install = Start-Process `
            -FilePath $installer `
            -ArgumentList @(
              '/auto',
              "/path:`"$customRoot`""
            ) `
            -Wait `
            -PassThru

          Write-Host "Custom installer exit code: $($install.ExitCode)"

          $searchRoots = @(
            $customRoot,
            'C:\Program Files',
            'C:\Program Files (x86)',
            (Join-Path $env:LOCALAPPDATA 'Programs'),
            (Join-Path $env:APPDATA 'MetaQuotes')
          ) |
            Where-Object {
              $_ -and (Test-Path $_)
            } |
            Select-Object -Unique

          $terminal = $null
          $editor = $null

          foreach ($root in $searchRoots) {

            if (-not $terminal) {
              $terminal = Get-ChildItem `
                -Path $root `
                -Recurse `
                -File `
                -Filter 'terminal64.exe' `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1
            }

            if (-not $editor) {
              $editor = Get-ChildItem `
                -Path $root `
                -Recurse `
                -File `
                -Filter 'metaeditor64.exe' `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1
            }

            if ($terminal -and $editor) {
              break
            }
          }

          if (-not $terminal -or -not $editor) {
            throw 'MetaTrader 5 installation could not be verified.'
          }

          $mt5Root = Split-Path `
            $terminal.FullName `
            -Parent

          Write-Host "MT5 root: $mt5Root"
          Write-Host "Terminal: $($terminal.FullName)"
          Write-Host "MetaEditor: $($editor.FullName)"

          Write-Host '=== PREPARE CLEAN KINGSBOT MT5 TREE ==='

          $target = Join-Path `
            $mt5Root `
            'MQL5\Experts\KingsBot'

          if (Test-Path $target) {
            Remove-Item `
              $target `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $target `
            -Force | Out-Null

          Copy-Item `
            -Path (Join-Path $sourceRoot '*') `
            -Destination $target `
            -Recurse `
            -Force

          $compileSource = Join-Path `
            $target `
            'KingsBot_Phase6_Integration.mq5'

          if (-not (Test-Path $compileSource)) {
            throw "Prepared Phase 6 source was not found: $compileSource"
          }

          Write-Host "Prepared source: $compileSource"

          Write-Host '=== COMPILE PHASE 6 ==='

          $compileLog = [IO.Path]::ChangeExtension(
            $compileSource,
            '.log'
          )

          $ex5 = [IO.Path]::ChangeExtension(
            $compileSource,
            '.ex5'
          )

          Remove-Item `
            $compileLog,
            $ex5 `
            -Force `
            -ErrorAction SilentlyContinue

          $compile = Start-Process `
            -FilePath $editor.FullName `
            -ArgumentList @(
              "/compile:$compileSource",
              '/log'
            ) `
            -WorkingDirectory (Split-Path $compileSource -Parent) `
            -Wait `
            -PassThru

          Write-Host "MetaEditor exit code: $($compile.ExitCode)"

          if (-not (Test-Path $compileLog)) {
            throw 'Compiler log was not produced.'
          }

          Get-Content $compileLog

          if (-not (Test-Path $ex5)) {
            throw 'Compilation did not produce KingsBot_Phase6_Integration.ex5.'
          }

          if ((Get-Item $ex5).Length -le 0) {
            throw 'Compiled EX5 is empty.'
          }

          $compilerErrors = Select-String `
            -Path $compileLog `
            -Pattern '(?i)\berror\b' `
            -ErrorAction SilentlyContinue

          if ($compilerErrors) {
            $compilerErrors |
              ForEach-Object {
                Write-Host $_.Line
              }

            throw 'Compiler log contains error text.'
          }

          Write-Host "COMPILE PASS - EX5 size: $((Get-Item $ex5).Length) bytes"

          Copy-Item `
            $ex5 `
            $evidence `
            -Force

          Copy-Item `
            $compileLog `
            $evidence `
            -Force

          Write-Host '=== VERIFY TESTER EA LOCATION ==='

          $testerEx5 = Join-Path `
            $mt5Root `
            'MQL5\Experts\KingsBot\KingsBot_Phase6_Integration.ex5'

          Write-Host "Tester EA expected at: $testerEx5"

          if (-not (Test-Path $testerEx5)) {
            throw "Tester EA was not found at expected location: $testerEx5"
          }

          Write-Host 'TESTER EA LOCATION PASS.'

          Write-Host '=== PREPARE STRATEGY TESTER ==='

          $reportDir = Join-Path `
            $mt5Root `
            'reports'

          if (Test-Path $reportDir) {
            Remove-Item `
              $reportDir `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $reportDir `
            -Force | Out-Null

          $config = Join-Path `
            $mt5Root `
            'KingsBot_Phase6_Tester.ini'

          $configLines = @(
            '[Common]'
            'KeepPrivate=1'
            ''
            '[Experts]'
            'AllowLiveTrading=0'
            'AllowDllImport=0'
            'Enabled=1'
            ''
            '[Tester]'
            'Expert=KingsBot\KingsBot_Phase6_Integration.ex5'
            'Symbol=EURUSD'
            'Period=M15'
            'Model=4'
            'Optimization=0'
            'ExecutionMode=0'
            'FromDate=2025.01.01'
            'ToDate=2026.08.01'
            'Deposit=10000'
            'Currency=USD'
            'Leverage=1:100'
            'UseLocal=1'
            'UseRemote=0'
            'UseCloud=0'
            'Visual=0'
            'Report=reports\KingsBot_Phase6_Tester.htm'
            'ReplaceReport=1'
            'ShutdownTerminal=1'
          )

          Set-Content `
            -Path $config `
            -Value ($configLines -join [Environment]::NewLine) `
            -Encoding Unicode

          Write-Host '=== TESTER CONFIGURATION ==='

          Get-Content $config

          Copy-Item `
            $config `
            $evidence `
            -Force

          Write-Host '=== START STRATEGY TESTER ==='

          $report = Join-Path `
            $reportDir `
            'KingsBot_Phase6_Tester.htm'

          Remove-Item `
            $report `
            -Force `
            -ErrorAction SilentlyContinue

          $tester = Start-Process `
            -FilePath $terminal.FullName `
            -ArgumentList @(
              '/portable',
              "/config:$config"
            ) `
            -WorkingDirectory $mt5Root `
            -PassThru

          Write-Host "MT5 process ID: $($tester.Id)"

          $deadline = (Get-Date).AddMinutes(15)
          $reportFound = $false

          while ((Get-Date) -lt $deadline) {

            if (Test-Path $report) {
              $reportFound = $true
              Write-Host 'TESTER REPORT DETECTED.'
              break
            }

            $running = Get-Process `
              -Id $tester.Id `
              -ErrorAction SilentlyContinue

            if (-not $running) {
              Write-Host 'MT5 process exited before producing the report.'
              break
            }

            Start-Sleep -Seconds 10
          }

          if ($reportFound) {

            if ((Get-Item $report).Length -le 0) {
              throw 'Strategy Tester report exists but is empty.'
            }

            Write-Host "STRATEGY TEST PASS - report size: $((Get-Item $report).Length) bytes"

            Copy-Item `
              $report `
              $evidence `
              -Force

          } else {

            Write-Host '=== MT5 DIAGNOSTICS ==='

            $logRoots = @(
              (Join-Path $mt5Root 'Logs'),
              (Join-Path $mt5Root 'Tester\logs'),
              (Join-Path $mt5Root 'Tester')
            ) |
              Where-Object {
                Test-Path $_
              } |
              Select-Object -Unique

            foreach ($logRoot in $logRoots) {

              Write-Host "Searching: $logRoot"

              Get-ChildItem `
                -Path $logRoot `
                -Recurse `
                -File `
                -ErrorAction SilentlyContinue |
                Where-Object {
                  $_.Extension -in @(
                    '.log',
                    '.xml',
                    '.htm',
                    '.html'
                  )
                } |
                ForEach-Object {

                  Write-Host "===== $($_.FullName) ====="

                  Get-Content `
                    $_.FullName `
                    -ErrorAction SilentlyContinue

                  Copy-Item `
                    $_.FullName `
                    $evidence `
                    -Force `
                    -ErrorAction SilentlyContinue
                }
            }

            Write-Host '=== END MT5 DIAGNOSTICS ==='

            throw 'Strategy Tester did not produce a report.'
          }

          Write-Host '=== PHASE 6 VALIDATION COMPLETE ==='

      - name: Upload Phase 6 validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-Phase6-Final-Validation
          path: phase6-validation-evidence
          if-no-files-found: warn
          retention-days: 14
