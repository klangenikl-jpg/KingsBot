name: Build King's Bot

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build King's Bot
    runs-on: windows-latest
    timeout-minutes: 30

    steps:

      # ============================================================
      # 1. SET UP
      # ============================================================
      - name: Set up job
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "KING'S BOT BUILD"
          Write-Host "========================================="
          Write-Host "Runner: $env:RUNNER_OS"
          Write-Host "Architecture: $env:PROCESSOR_ARCHITECTURE"
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"

      # ============================================================
      # 2. CHECKOUT
      # ============================================================
      - name: Checkout King's Bot
        uses: actions/checkout@v4

      # ============================================================
      # 3. INSTALL / LOCATE METATRADER 5
      # ============================================================
      - name: Install and locate MetaTrader 5
        shell: pwsh
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "INSTALLING / LOCATING METATRADER 5"
          Write-Host "========================================="

          $mt5Root = "C:\MT5"
          $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"

          # --------------------------------------------------------
          # Try to locate an existing MetaEditor first
          # --------------------------------------------------------
          $existingEditor = @(
            "C:\Program Files\MetaTrader 5\MetaEditor64.exe",
            "C:\Program Files\MetaTrader 5\MetaEditor.exe",
            "C:\Program Files (x86)\MetaTrader 5\MetaEditor64.exe",
            "C:\Program Files (x86)\MetaTrader 5\MetaEditor.exe"
          ) |
          Where-Object { Test-Path $_ } |
          Select-Object -First 1

          if ($existingEditor) {
            Write-Host "Existing MetaEditor found:"
            Write-Host $existingEditor

            $editorDir = Split-Path $existingEditor -Parent

            # Locate the terminal root from the editor directory.
            $foundRoot = $editorDir

            "MT5_ROOT=$foundRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "METAEDITOR_PATH=$existingEditor" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

            Write-Host "MT5_ROOT=$foundRoot"
            Write-Host "METAEDITOR_PATH=$existingEditor"
            exit 0
          }

          # --------------------------------------------------------
          # Download official MetaTrader 5 installer
          # --------------------------------------------------------
          Write-Host "Downloading official MetaTrader 5 installer..."

          Invoke-WebRequest `
            -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" `
            -OutFile $installer `
            -UseBasicParsing

          if (-not (Test-Path $installer)) {
            throw "MetaTrader 5 installer was not downloaded."
          }

          Write-Host "Installer downloaded:"
          Write-Host $installer

          # --------------------------------------------------------
          # Create installation directory
          # --------------------------------------------------------
          New-Item `
            -ItemType Directory `
            -Path $mt5Root `
            -Force |
            Out-Null

          # --------------------------------------------------------
          # Install automatically into C:\MT5
          # MetaQuotes documents /auto and /path for this.
          # --------------------------------------------------------
          Write-Host "Installing MetaTrader 5 to $mt5Root..."

          $arguments = "/auto /path:`"$mt5Root`""

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList $arguments `
            -Wait `
            -PassThru

          Write-Host "Installer exit code: $($process.ExitCode)"

          if ($process.ExitCode -ne 0) {
            Write-Host "Installation returned a non-zero exit code."
            Write-Host "Searching the runner for MetaEditor64.exe anyway..."
          }

          # --------------------------------------------------------
          # Locate MetaEditor after installation
          # --------------------------------------------------------
          $editorCandidates = @()

          if (Test-Path $mt5Root) {
            $editorCandidates += Get-ChildItem `
              -Path $mt5Root `
              -Filter "MetaEditor64.exe" `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue
          }

          $editorCandidates += Get-ChildItem `
            -Path "C:\Program Files" `
            -Filter "MetaEditor64.exe" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue

          $editorCandidates += Get-ChildItem `
            -Path "C:\Program Files (x86)" `
            -Filter "MetaEditor64.exe" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue
