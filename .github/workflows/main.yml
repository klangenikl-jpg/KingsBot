name: Build King's Bot

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build King's Bot
    runs-on: windows-latest

    env:
      MT5_ROOT: C:\MT5
      BOT_NAME: KingsBot
      BOT_SOURCE_NAME: KingsBot_Phase6_Integration.mq5

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout King's Bot
        uses: actions/checkout@v4

      # ============================================================
      # 2. LOCATE / INSTALL MT5
      # ============================================================
      - name: Install and locate MetaTrader 5
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "INSTALLING / LOCATING METATRADER 5"
          Write-Host "========================================="

          $root = $env:MT5_ROOT
          New-Item -ItemType Directory -Path $root -Force | Out-Null

          $possibleRoots = @(
            $root,
            "C:\Program Files\MetaTrader 5",
            "C:\Program Files (x86)\MetaTrader 5"
          )

          $metaEditor = $null

          foreach ($candidate in $possibleRoots) {
            if (Test-Path $candidate) {
              $found = Get-ChildItem `
                -Path $candidate `
                -Filter "metaeditor64.exe" `
                -File `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

              if ($found) {
                $metaEditor = $found.FullName
                break
              }
            }
          }

          if (-not $metaEditor) {
            Write-Host "MetaEditor not found locally."
            Write-Host "Downloading official MetaTrader 5 installer..."

            $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"

            Invoke-WebRequest `
              -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" `
              -OutFile $installer

            if (-not (Test-Path $installer)) {
              throw "MetaTrader 5 installer was not downloaded."
            }

            Write-Host "Installer downloaded."
            Write-Host "Starting installer..."

            $process = Start-Process `
              -FilePath $installer `
              -ArgumentList "/auto" `
              -Wait `
              -PassThru

            Write-Host "Installer exit code: $($process.ExitCode)"

            Start-Sleep -Seconds 5

            $searchRoots = @(
              "C:\Program Files",
              "C:\Program Files (x86)",
              "C:\MT5",
              $env:LOCALAPPDATA
            )

            foreach ($searchRoot in $searchRoots) {
              if (Test-Path $searchRoot) {
                $found = Get-ChildItem `
                  -Path $searchRoot `
                  -Filter "metaeditor64.exe" `
                  -File `
                  -Recurse `
                  -ErrorAction SilentlyContinue |
                  Select-Object -First 1

                if ($found) {
                  $metaEditor = $found.FullName
                  break
                }
              }
            }
          }

          if (-not $metaEditor) {
            throw "MetaEditor64.exe could not be located."
          }

          $terminalRoot = Split-Path $metaEditor -Parent

          Write-Host "MetaEditor:"
          Write-Host $metaEditor
          Write-Host ""
          Write-Host "MT5 root:"
          Write-Host $terminalRoot

          "METAEDITOR_PATH=$metaEditor" >> $env:GITHUB_ENV
          "MT5_ACTUAL_ROOT=$terminalRoot" >> $env:GITHUB_ENV

      # ============================================================
      # 3. PREPARE KING'S BOT SOURCE
      # ============================================================
      - name: Prepare King's Bot source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "PREPARING KING'S BOT SOURCE"
          Write-Host "========================================="

          $workspace = $env:GITHUB_WORKSPACE
          $mt5Root = $env:MT5_ACTUAL_ROOT

          $mql5Root = Join-Path $mt5Root "MQL5"
          $expertRoot = Join-Path $mql5Root "Experts\KingsBot"

          New-Item `
            -ItemType Directory `
            -Path $expertRoot `
            -Force |
            Out-Null

          $source = Get-ChildItem `
            -Path $workspace `
            -Filter $env:BOT_SOURCE_NAME `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $source) {
            throw "King's Bot source '$env:BOT_SOURCE_NAME' was not found."
          }

          Write-Host "Source found:"
          Write-Host $source.FullName

          Copy-Item `
            -Path $source.FullName `
            -Destination (Join-Path $expertRoot $source.Name) `
            -Force

          $sourceDirectory = Split-Path $source.FullName -Parent

          $mqhFiles = Get-ChildItem `
            -Path $sourceDirectory `
            -Filter "*.mqh" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue

          foreach ($file in $mqhFiles) {
            Copy-Item `
              -Path $file.FullName `
              -Destination (Join-Path $expertRoot $file.Name) `
              -Force
          }

          Write-Host ""
          Write-Host "King's Bot source files copied:"
          Get-ChildItem $expertRoot -File |
            ForEach-Object {
              Write-Host " - $($_.Name)"
            }

          "KING_SOURCE=$($source.FullName)" >> $env:GITHUB_ENV
          "KING_EXPERT_ROOT=$expertRoot" >> $env:GITHUB_ENV

      # ============================================================
      # 4. SANITIZE MQL5 PREPROCESSOR HEADERS
      # ============================================================
      - name: Validate and repair MQL5 source headers
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "VALIDATING MQL5 SOURCE HEADERS"
          Write-Host "========================================="

          $root = $env:KING_EXPERT_ROOT

          $validDirectives = @(
            "#property",
            "#include",
            "#define",
            "#undef",
            "#if",
            "#ifdef",
            "#ifndef",
            "#else",
            "#elif",
            "#endif",
            "#pragma",
            "#import",
            "#resource"
          )

          $files = Get-ChildItem `
            -Path $root `
            -File `
            -Include "*.mq5","*.mqh" `
            -Recurse

          $badLines = @()

          foreach ($file in $files) {

            $lines = Get-Content `
              -Path $file.FullName `
              -Encoding UTF8

            $changed = $false
            $output = New-Object System.Collections.Generic.List[string]

            for ($i = 0; $i -lt $lines.Count; $i++) {

              $line = $lines[$i]

              if ($line.TrimStart().StartsWith("#")) {

                $trimmed = $line.TrimStart()

                $valid = $false

                foreach ($directive in $validDirectives) {
                  if ($trimmed.StartsWith($directive)) {
                    $valid = $true
                    break
                  }
                }

                if (-not $valid) {
                  $badLines += [PSCustomObject]@{
                    File = $file.FullName
                    Line = $i + 1
                    Content = $line
                  }

                  Write-Host ""
                  Write-Host "INVALID PREPROCESSOR:"
                  Write-Host "File : $($file.FullName)"
                  Write-Host "Line : $($i + 1)"
                  Write-Host "Text : $line"

                  # Remove malformed preprocessor-only lines.
                  $output.Add("// KING'S BOT BUILD CLEANUP: removed invalid preprocessor line")
                  $changed = $true
                  continue
                }
              }

              $output.Add($line)
            }

            if ($changed) {
              Set-Content `
                -Path $file.FullName `
                -Value $output `
                -Encoding UTF8

              Write-Host ""
              Write-Host "Repaired: $($file.Name)"
            }
          }

          Write-Host ""
          Write-Host "========================================="
          Write-Host "HEADER VALIDATION COMPLETE"
          Write-Host "========================================="

          if ($badLines.Count -gt 0) {
            Write-Host "Invalid preprocessor lines repaired: $($badLines.Count)"
          }
          else {
            Write-Host "No invalid preprocessor directives found."
          }

          Write-Host ""
          Write-Host "SOURCE FILES:"
          Get-ChildItem $root -File |
            ForEach-Object {
              Write-Host $_.Name
            }

      # ============================================================
      # 5. COMPILE KING'S BOT
      # ============================================================
      - name: Compile King's Bot
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "COMPILING KING'S BOT"
          Write-Host "========================================="

          if (-not $env:METAEDITOR_PATH) {
            throw "METAEDITOR_PATH is not set."
          }

          if (-not $env:KING_EXPERT_ROOT) {
            throw "KING_EXPERT_ROOT is not set."
          }

          $sourcePath = Join-Path `
            $env:KING_EXPERT_ROOT `
            $env:BOT_SOURCE_NAME

          if (-not (Test-Path $sourcePath)) {
            throw "King's Bot source not found at: $sourcePath"
          }

          $logPath = Join-Path `
            $env:RUNNER_TEMP `
            "KingsBot_compile.log"

          Write-Host "MetaEditor:"
          Write-Host $env:METAEDITOR_PATH

          Write-Host ""
          Write-Host "Source:"
          Write-Host $sourcePath

          Write-Host ""
          Write-Host
