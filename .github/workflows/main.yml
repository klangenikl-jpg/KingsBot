name: Build King's Bot

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build King's Bot
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Checkout King's Bot
        uses: actions/checkout@v4

      - name: Install MT5 in controlled runner directory
        shell: pwsh
        timeout-minutes: 4
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host '========================================='
          Write-Host 'INSTALLING MT5 IN CONTROLLED DIRECTORY'
          Write-Host '========================================='

          $mt5Root = Join-Path $env:RUNNER_TEMP 'KingsBot-MT5'
          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'

          if (Test-Path $mt5Root) {
            Remove-Item $mt5Root -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $mt5Root `
            -Force |
            Out-Null

          Write-Host 'Downloading official MetaTrader 5 installer...'

          Invoke-WebRequest `
            -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' `
            -OutFile $installer `
            -UseBasicParsing

          if (-not (Test-Path $installer)) {
            throw 'MT5 installer download failed.'
          }

          Write-Host 'Installer downloaded.'

          Write-Host 'Launching installer...'

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList '/auto' `
            -PassThru

          if (-not $process.WaitForExit(90000)) {
            try {
              $process.Kill()
            }
            catch {}

            throw 'MT5 installer exceeded the 90-second timeout.'
          }

          Write-Host "Installer exit code: $($process.ExitCode)"

          Write-Host 'Searching only controlled and standard MT5 locations...'

          $candidateEditors = @(
            (Join-Path $mt5Root 'MetaEditor64.exe'),
            'C:\Program Files\MetaTrader 5\MetaEditor64.exe',
            'C:\Program Files (x86)\MetaTrader 5\MetaEditor64.exe',
            (Join-Path $env:LOCALAPPDATA 'Programs\MetaTrader 5\MetaEditor64.exe')
          )

          $metaEditor = $null

          foreach ($candidate in $candidateEditors) {
            if (Test-Path $candidate) {
              $metaEditor = $candidate
              break
            }
          }

          if (-not $metaEditor) {
            Write-Host 'MetaEditor was not found in expected locations.'

            Write-Host 'Checking installer output locations...'

            $limitedSearchRoots = @(
              'C:\Program Files\MetaTrader 5',
              'C:\Program Files (x86)\MetaTrader 5',
              "$env:LOCALAPPDATA\MetaQuotes",
              "$env:APPDATA\MetaQuotes"
            )

            foreach ($root in $limitedSearchRoots) {
              if (Test-Path $root) {
                $found = Get-ChildItem `
                  -Path $root `
                  -Filter 'MetaEditor64.exe' `
                  -File `
                  -Recurse `
                  -ErrorAction SilentlyContinue |
                  Select-Object -First 1

                if ($found) {
                  $metaEditor = $found.FullName
                  break
                }
              }
            }
          }

          if (-not $metaEditor) {
            throw 'MetaEditor64.exe could not be located after MT5 installation.'
          }

          Write-Host "MetaEditor found:"
          Write-Host $metaEditor

          $mt5Install = Split-Path `
            $metaEditor `
            -Parent

          Write-Host "MT5 installation directory:"
          Write-Host $mt5Install

          "METAEDITOR_PATH=$metaEditor" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "MT5_INSTALL=$mt5Install" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Prepare portable MT5 environment
        shell: pwsh
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host '========================================='
          Write-Host 'PREPARING PORTABLE MT5 ENVIRONMENT'
          Write-Host '========================================='

          $portableRoot = Join-Path `
            $env:RUNNER_TEMP `
            'KingsBot-Portable-MT5'

          if (Test-Path $portableRoot) {
            Remove-Item `
              $portableRoot `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $portableRoot `
            -Force |
            Out-Null

          Copy-Item `
            -Path "$env:MT5_INSTALL\*" `
            -Destination $portableRoot `
            -Recurse `
            -Force

          $portableEditor = Join-Path `
            $portableRoot `
            'MetaEditor64.exe'

          if (-not (Test-Path $portableEditor)) {
            throw 'MetaEditor64.exe was not copied to portable MT5 directory.'
          }

          $mql5Root = Join-Path `
            $portableRoot `
            'MQL5'

          New-Item `
            -ItemType Directory `
            -Path $mql5Root `
            -Force |
            Out-Null

          "PORTABLE_MT5=$portableRoot" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "MT5_MQL5_ROOT=$mql5Root" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "METAEDITOR_PORTABLE=$portableEditor" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Portable MT5:"
          Write-Host $portableRoot

      - name: Prepare King's Bot source
        shell: pwsh
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host '========================================='
          Write-Host "PREPARING KING'S BOT SOURCE"
          Write-Host '========================================='

          $source = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter 'KingsBot_Phase6_Integration.mq5' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $source) {
            throw 'KingsBot_Phase6_Integration.mq5 was not found in the repository.'
          }

          $experts = Join-Path `
            $env:MT5_MQL5_ROOT `
            'Experts\KingsBot'

          New-Item `
            -ItemType Directory `
            -Path $experts `
            -Force |
            Out-Null

          $target = Join-Path `
            $experts `
            'KingsBot_Phase6_Integration.mq5'

          Copy-Item `
            -Path $source.FullName `
            -Destination $target `
            -Force

          Write-Host "King's Bot source:"
          Write-Host $target

          $projectRoot = Join-Path `
            $env:GITHUB_WORKSPACE `
            'KingsBot-MQL5'

          if (Test-Path $projectRoot) {
            Write-Host 'Copying project MQL5 files...'

            Get-ChildItem `
              -Path $projectRoot `
              -File `
              -Recurse |
              ForEach-Object {

                $relative = $_.FullName.Substring(
                  $projectRoot.Length
                ).TrimStart('\')

                $destination = Join-Path `
                  $env:MT5_MQL5_ROOT `
                  $relative

                $destinationParent = Split-Path `
                  $destination `
                  -Parent

                New-Item `
                  -ItemType Directory `
                  -Path $destinationParent `
                  -Force |
                  Out-Null

                Copy-Item `
                  -Path $_.FullName `
                  -Destination $destination `
                  -Force
              }
          }

          "KINGSBOT_SOURCE=$target" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify standard MQL5 library
        shell: pwsh
        timeout-minutes: 1
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host '========================================='
          Write-Host 'VERIFYING MQL5 STANDARD LIBRARY'
          Write-Host '========================================='

          $trade = Join-Path `
            $env:MT5_MQL5_ROOT `
            'Include\Trade\Trade.mqh'

          if (-not (Test-Path $trade)) {
            Write-Host 'Trade.mqh is not present in the copied MT5 installation.'

            $standardCandidates = @(
              'C:\Program Files\MetaTrader 5\MQL5\Include\Trade\Trade.mqh',
              'C:\Program Files (x86)\MetaTrader 5\MQL5\Include\Trade\Trade.mqh'
            )

            foreach ($candidate in $standardCandidates) {
              if (Test-Path $candidate) {
                $trade = $candidate
                break
              }
            }
          }

          if (-not (Test-Path $trade)) {
            throw 'Standard MQL5 Include\Trade\Trade.mqh was not found.'
          }

          Write-Host "Trade.mqh verified:"
          Write-Host $trade

      - name: Compile King's Bot
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host '========================================='
          Write-Host "COMPILING KING'S BOT"
          Write-Host '========================================='

          $source = $env:KINGSBOT_SOURCE
          $sourceDir = Split-Path `
            $source `
            -Parent

          $log = [System.IO.Path]::ChangeExtension(
            $source,
            '.log'
          )

          $ex5 = [System.IO.Path]::ChangeExtension(
            $source,
            '.ex5'
          )

          if (-not (Test-Path $source)) {
            throw "Source does not exist: $source"
          }

          if (Test-Path $log) {
            Remove-Item `
              $log `
              -Force
          }

          if (Test-Path $ex5) {
            Remove-Item `
              $ex5 `
              -Force
          }

          Write-Host "MetaEditor:"
          Write-Host $env:METAEDITOR_PORTABLE

          Write-Host "Source:"
          Write-Host $source

          Write-Host "Include root:"
          Write-Host $env:MT5_MQL5_ROOT

          Push-Location $sourceDir

          try {
            & $env:METAEDITOR_PORTABLE `
              "/compile:$source" `
              "/include:$env:MT5_MQL5_ROOT" `
              '/log'

            $exitCode = $LASTEXITCODE
          }
          finally {
            Pop-Location
          }

          Write-Host "MetaEditor exit code: $exitCode"

          Start-Sleep -Seconds 3

          Write-Host '========================================='
          Write-Host 'CHECKING COMPILER OUTPUT'
          Write-Host '========================================='

          if (Test-Path $log) {
            Write-Host 'COMPILER LOG FOUND'
            Get-Content $log
          }
          else {
            Write-Host 'No compiler log was created beside the source.'
          }

          if (Test-Path $ex5) {
            Write-Host '========================================='
            Write-Host 'KING''S BOT EX5 CREATED SUCCESSFULLY'
            Write-Host '========================================='
            Write-Host $ex5

            "EX5_PATH=$ex5" |
              Out-File $env:GITHUB_ENV -Append -Encoding utf8
          }
          else {
            throw "No EX5 was produced. MetaEditor exit code: $exitCode"
          }

      - name: Prepare King's Bot artifact
        if: success()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $artifact = Join-Path `
            $env:RUNNER_TEMP `
            'KingsBot-artifact'

          New-Item `
            -ItemType Directory `
            -Path $artifact `
            -Force |
            Out-Null

          Copy-Item `
            -Path $env:EX5_PATH `
            -Destination $artifact `
            -Force

          Copy-Item `
            -Path $env:KINGSBOT_SOURCE `
            -Destination $artifact `
            -Force

          "ARTIFACT_DIR=$artifact" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload King's Bot artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-build
          path: ${{ env.ARTIFACT_DIR }}
          if-no-files-found: error
          retention-days: 14
