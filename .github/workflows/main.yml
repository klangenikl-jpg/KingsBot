name: Build King's Bot

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Compile King's Bot
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout King's Bot
        uses: actions/checkout@v4

      - name: Build King's Bot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========================================"
          Write-Host "BUILD KING'S BOT"
          Write-Host "========================================"

          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          $mt5Root = Join-Path $env:RUNNER_TEMP 'MT5'

          Write-Host "Downloading MetaTrader 5..."
          Invoke-WebRequest `
            -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' `
            -OutFile $installer

          if (-not (Test-Path $installer)) {
            throw 'MetaTrader 5 installer was not downloaded.'
          }

          Write-Host "Installing MetaTrader 5..."
          New-Item `
            -ItemType Directory `
            -Force `
            -Path $mt5Root |
            Out-Null

          $installProcess = Start-Process `
            -FilePath $installer `
            -ArgumentList @(
              '/auto',
              "/path:$mt5Root"
            ) `
            -Wait `
            -PassThru

          Write-Host "Installer exit code: $($installProcess.ExitCode)"

          if ($installProcess.ExitCode -ne 0) {
            throw "MetaTrader 5 installation failed with exit code $($installProcess.ExitCode)."
          }

          Write-Host "Locating MetaEditor..."

          $metaEditor = Get-ChildItem `
            -Path $env:RUNNER_TEMP `
            -Filter 'MetaEditor64.exe' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $metaEditor) {
            throw 'MetaEditor64.exe was not found.'
          }

          Write-Host "MetaEditor found:"
          Write-Host $metaEditor.FullName

          Write-Host "Locating King's Bot source..."

          $source = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter 'KingsBot_Phase6_Integration.mq5' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $source) {
            throw 'KingsBot_Phase6_Integration.mq5 was not found.'
          }

          Write-Host "Source found:"
          Write-Host $source.FullName

          Write-Host "Locating MQL5 include files..."

          $includes = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter '*.mqh' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue

          if ($includes) {
            foreach ($include in $includes) {
              Write-Host $include.FullName
            }
          }

          Write-Host "========================================"
          Write-Host "COMPILING KING'S BOT"
          Write-Host "========================================"

          $compileArguments = @(
            "/compile:$($source.FullName)",
            '/log'
          )

          $compileProcess = Start-Process `
            -FilePath $metaEditor.FullName `
            -ArgumentList $compileArguments `
            -Wait `
            -PassThru `
            -NoNewWindow

          Write-Host "MetaEditor exit code: $($compileProcess.ExitCode)"

          if ($compileProcess.ExitCode -ne 0) {
            throw "MetaEditor failed while compiling $($source.Name)."
          }

          $ex5 = [System.IO.Path]::ChangeExtension(
            $source.FullName,
            '.ex5'
          )

          if (-not (Test-Path $ex5)) {
            throw "Compilation finished but EX5 was not created: $ex5"
          }

          Write-Host "========================================"
          Write-Host "COMPILATION SUCCESSFUL"
          Write-Host "========================================"
          Write-Host $ex5

          $package = Join-Path $env:RUNNER_TEMP 'KingsBot_Package'

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $package |
            Out-Null

          Copy-Item `
            -Path $ex5 `
            -Destination $package `
            -Force

          Write-Host "Package prepared:"
          Get-ChildItem $package

      - name: Upload King's Bot package
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-Phase6
          path: ${{ runner.temp }}/KingsBot_Package
          if-no-files-found: error
