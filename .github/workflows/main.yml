name: King's Bot - Phase 6 Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MetaTrader 5
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          # Keep the existing installation logic here.
          # The runner must provide MetaEditor64.exe.
          if (-not $env:METAEDITOR) {
            Write-Host "METAEDITOR environment variable is not set."
            exit 1
          }

          Write-Host "MetaEditor: $env:METAEDITOR"

      - name: Prepare MQL5 source tree
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $sourceRoot = Join-Path $env:GITHUB_WORKSPACE "MQL5"

          if (-not (Test-Path $sourceRoot)) {
            New-Item `
              -ItemType Directory `
              -Path $sourceRoot `
              -Force | Out-Null
          }

          "SOURCE_ROOT=$sourceRoot" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

      - name: Normalize MQL5 headers
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $headers = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Recurse `
            -File `
            -Filter "*.mqh"

          foreach ($file in $headers) {
            Write-Host "Checking: $($file.Name)"

            $content = Get-Content `
              -Path $file.FullName `
              -Raw

            if ($null -eq $content) {
              continue
            }

            $content = $content.Replace(
              "`r`n",
              "`n"
            )

            $content = $content.Replace(
              "`r",
              "`n"
            )

            [System.IO.File]::WriteAllText(
              $file.FullName,
              $content,
              [System.Text.UTF8Encoding]::new($false)
            )
          }

          Write-Host "All MQL5 headers passed normalization check."

      - name: Compile King's Bot
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          $project = Join-Path `
            $env:SOURCE_ROOT `
            "Experts\KingsBot\KingsBot_Phase6_Integration.mq5"

          Write-Host "=========================================="
          Write-Host "COMPILING KINGSBOT PHASE 6"
          Write-Host "=========================================="
          Write-Host "Source: $project"
          Write-Host ""

          if (-not (Test-Path $project)) {
            Write-Host "ERROR: Integration file not found."
            exit 1
          }

          & $env:METAEDITOR `
            "/compile:$project" `
            "/log"

          $exitCode = $LASTEXITCODE

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "METAEDITOR EXIT CODE: $exitCode"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "===== COMPILER OUTPUT ====="

          $logFiles = Get-ChildItem `
            -Path $env:SOURCE_ROOT `
            -Recurse `
            -File `
            -Include "*.log","*.txt" `
            -ErrorAction SilentlyContinue

          foreach ($log in $logFiles) {
            Write-Host ""
            Write-Host "===== $($log.FullName) ====="
            Get-Content `
              -Path $log.FullName `
              -ErrorAction SilentlyContinue
          }

          Write-Host ""
          Write-Host "===== EX5 CHECK ====="

          $ex5Files = Get-ChildItem `
            -Path $env:SOURCE_ROOT `
            -Recurse `
            -File `
            -Filter "*.ex5" `
            -ErrorAction SilentlyContinue

          if ($ex5Files.Count -eq 0) {
            Write-Host "NO EX5 FILE CREATED."
            exit 1
          }

          foreach ($file in $ex5Files) {
            Write-Host "EX5 CREATED: $($file.FullName)"
          }

          exit 0

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-Phase6-build
          path: |
            ${{ env.SOURCE_ROOT }}/**/*.ex5
            ${{ env.SOURCE_ROOT }}/**/*.log
          if-no-files-found: warn
