name: King's Bot - Phase 6 Build

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.mq5'
      - '**/*.mqh'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build:
    name: Build King's Bot
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout King's Bot
        uses: actions/checkout@v4

      - name: Inspect repository
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========================================"
          Write-Host "KING'S BOT - REPOSITORY INSPECTION"
          Write-Host "========================================"

          $sources = @(
            Get-ChildItem `
              -Path $env:GITHUB_WORKSPACE `
              -Recurse `
              -File `
              -Include *.mq5,*.mqh `
              -ErrorAction SilentlyContinue
          )

          if ($sources.Count -eq 0) {
            throw "No .mq5 or .mqh files were found in the repository."
          }

          $sources | ForEach-Object {
            Write-Host $_.FullName
          }

          Write-Host ""
          Write-Host "Found $($sources.Count) MQL5 source files."

      - name: Prepare portable MT5 environment
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $mt5Root = Join-Path $env:RUNNER_TEMP 'KingsBot-MT5'
          $mql5Root = Join-Path $mt5Root 'MQL5'
          $sourceRoot = Join-Path $mql5Root 'Experts\KingsBot'
          $artifactRoot = Join-Path $env:RUNNER_TEMP 'KingsBot-artifacts'

          foreach ($path in @($mt5Root, $mql5Root, $sourceRoot, $artifactRoot)) {
            if (Test-Path $path) {
              Remove-Item $path -Recurse -Force
            }
            New-Item -ItemType Directory -Path $path -Force | Out-Null
          }

          "MT5_ROOT=$mt5Root" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "MQL5_ROOT=$mql5Root" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "SOURCE_ROOT=$sourceRoot" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ARTIFACT_ROOT=$artifactRoot" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "MT5_ROOT   = $mt5Root"
          Write-Host "MQL5_ROOT  = $mql5Root"
          Write-Host "SOURCE_ROOT= $sourceRoot"

      - name: Download official MetaTrader 5 installer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          $uri = 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe'

          Write-Host "Downloading official MetaTrader 5 installer..."

          Invoke-WebRequest `
            -Uri $uri `
            -OutFile $installer `
            -UseBasicParsing

          if (!(Test-Path $installer)) {
            throw "MetaTrader 5 installer was not downloaded."
          }

          $size = (Get-Item $installer).Length

          if ($size -lt 100000) {
            throw "Downloaded installer is unexpectedly small: $size bytes."
          }

          "MT5_INSTALLER=$installer" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Installer size: $size bytes."

      - name: Install MetaTrader 5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========================================"
          Write-Host "INSTALLING METATRADER 5"
          Write-Host "========================================"

          $process = Start-Process `
            -FilePath $env:MT5_INSTALLER `
            -ArgumentList @(
              '/auto',
              "/path:`"$env:MT5_ROOT`""
            ) `
            -WorkingDirectory $env:RUNNER_TEMP `
            -Wait `
            -PassThru

          Write-Host "Installer exit code: $($process.ExitCode)"

          if ($process.ExitCode -ne 0) {
            Write-Warning "Installer returned exit code $($process.ExitCode)."
            Write-Warning "The next step will verify the actual installed files."
          }

          if (!(Test-Path "$env:MT5_ROOT\MetaEditor64.exe")) {
            throw "MetaEditor64.exe was not installed at the requested MT5 path."
          }

      - name: Locate MetaEditor and report version
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $editorCandidates = @(
            "$env:MT5_ROOT\MetaEditor64.exe",
            'C:\Program Files\MetaTrader 5\MetaEditor64.exe',
            '
