name: Build King's Bot

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build King's Bot
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Checkout King's Bot
        uses: actions/checkout@v4

      - name: Locate or install MetaEditor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host '========================================='
          Write-Host 'LOCATING / INSTALLING METATRADER 5'
          Write-Host '========================================='

          $searchRoots = @(
            'C:\Program Files',
            'C:\Program Files (x86)',
            "$env:LOCALAPPDATA",
            "$env:APPDATA",
            "$env:RUNNER_TOOL_CACHE"
          ) | Where-Object { Test-Path $_ }

          $metaEditor = $null

          foreach ($root in $searchRoots) {
            $metaEditor = Get-ChildItem `
              -Path $root `
              -Filter 'MetaEditor64.exe' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if ($metaEditor) {
              break
            }
          }

          if (-not $metaEditor) {
            $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'

            $url = 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe'

            Write-Host 'MetaEditor not found.'
            Write-Host 'Downloading official MetaTrader 5 installer...'

            Invoke-WebRequest `
              -Uri $url `
              -OutFile $installer `
              -UseBasicParsing

            if (-not (Test-Path $installer)) {
              throw 'MetaTrader 5 installer was not downloaded.'
            }

            Write-Host 'Starting unattended MetaTrader 5 installation...'

            $process = Start-Process `
              -FilePath $installer `
              -ArgumentList '/auto' `
              -Wait `
              -PassThru

            Write-Host "Installer exit code: $($process.ExitCode)"

            Write-Host 'Waiting for MetaEditor installation to become visible...'

            for ($i = 1; $i -le 36; $i++) {
              Start-Sleep -Seconds 5

              foreach ($root in $searchRoots) {
                $metaEditor = Get-ChildItem `
                  -Path $root `
                  -Filter 'MetaEditor64.exe' `
                  -File `
                  -Recurse `
                  -ErrorAction SilentlyContinue |
                  Select-Object -First 1

                if ($metaEditor) {
                  break
                }
              }

              if ($metaEditor) {
                break
              }
            }
          }

          if (-not $metaEditor) {
            Write-Host 'MetaEditor64.exe was not found in the normal locations.'
            Write-Host 'Performing one final complete C:\ search...'

            $metaEditor = Get-ChildItem `
              -Path 'C:\' `
              -Filter 'MetaEditor64.exe' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }

          if (-not $metaEditor) {
            throw 'MetaEditor64.exe could not be installed or located on the GitHub runner.'
          }

          $metaEditorPath = $metaEditor.FullName
          $mt5Root = $metaEditor.Directory.FullName

          Write-Host "MetaEditor found: $metaEditorPath"
          Write-Host "MT5 install root: $mt5Root"

          "METAEDITOR_PATH=$metaEditorPath" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          "MT5_ROOT=$mt5Root" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      - name: Prepare King's Bot source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host '========================================='
          Write-Host "PREPARING KING'S BOT SOURCE"
          Write-Host '========================================='

          $source = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter 'KingsBot_Phase6_Integration.mq5' `
            -File `
            -Recurse |
            Select-Object -First 1

          if (-not $source) {
            throw 'KingsBot_Phase6_Integration.mq5 was not found in the repository.'
          }

          $mql5Root = Join-Path `
            $env:RUNNER_TEMP `
            'KingsBot-MQL5'

          if (Test-Path $mql5Root) {
            Remove-Item `
              $mql5Root `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $mql5Root `
            -Force |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Path (Join-Path $mql5Root 'Experts') `
            -Force |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Path (Join-Path $mql5Root 'Include') `
            -Force |
            Out-Null

          Copy-Item `
            -Path $source.FullName `
            -Destination (Join-Path $mql5Root 'Experts\KingsBot_Phase6_Integration.mq5') `
            -Force

          $repoMql5 = Join-Path `
            $env:GITHUB_WORKSPACE `
            'KingsBot-MQL5'

          if (Test-Path $repoMql5) {
            Get-ChildItem `
              -Path $repoMql5 `
              -Force |
              Copy-Item `
                -Destination $mql5Root `
                -Recurse `
                -Force
          }

          "MQL5_ROOT=$mql5Root" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          Write-Host "MQL5 root: $mql5Root"
          Write-Host "Source: $(Join-Path $mql5Root 'Experts\KingsBot_Phase6_Integration.mq5')"

      - name: Install standard MQL5 include library
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host '========================================='
          Write-Host 'VERIFYING STANDARD MQL5 LIBRARY'
          Write-Host '========================================='

          $trade = Join-Path `
            $env:MQL5_ROOT `
            'Include\Trade\Trade.mqh'

          if (-not (Test-Path $trade)) {
            Write-Host 'Trade.mqh is missing.'
            Write-Host 'Fetching the complete MQL5 standard include tree...'

            $stdlib = Join-Path `
              $env:RUNNER_TEMP `
              'mt5-include'

            if (Test-Path $stdlib) {
              Remove-Item `
                $stdlib `
                -Recurse `
                -Force
            }

            git clone `
              --depth 1 `
              https://github.com/gsemet/mt5-include.git `
              $stdlib

            if (-not (Test-Path $stdlib)) {
              throw 'The MQL5 standard include repository could not be obtained.'
            }

            Get-ChildItem `
              -Path $stdlib `
              -File `
              -Recurse |
              ForEach-Object {

                $relative = $_.FullName.Substring(
                  $stdlib.Length
                ).TrimStart('\')

                $destination = Join-Path `
                  (Join-Path $env:MQL5_ROOT 'Include') `
                  $relative

                $parent = Split-Path `
                  $destination `
                  -Parent

                New-Item `
                  -ItemType Directory `
                  -Path $parent `
                  -Force |
                  Out-Null

                Copy-Item `
                  $_.FullName `
                  $destination `
                  -Force
              }
          }

          if (-not (Test-Path $trade)) {
            throw 'Standard MQL5 Trade.mqh is still missing after library preparation.'
          }

          Write-Host "Trade.mqh found: $trade"

      - name: Compile King's Bot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host '========================================='
          Write-Host "COMPILING KING'S BOT"
          Write-Host '========================================='

          $source = Join-Path `
            $env:MQL5_ROOT `
            'Experts\KingsBot_Phase6_Integration.mq5'

          $log = Join-Path `
            $env:RUNNER_TEMP `
            'KingsBot_Phase6_Integration.log'

          $ex5 = Join-Path `
            $env:MQL5_ROOT `
            'Experts\KingsBot_Phase6_Integration.ex5'

          if (-not (Test-Path $source)) {
            throw "Source file not found: $source"
          }

          if (Test-Path $log) {
            Remove-Item `
              $log `
              -Force
          }

          if (Test-Path $ex5) {
            Remove-Item `
              $ex5 `
              -Force
          }

          Write-Host "MetaEditor: $env:METAEDITOR_PATH"
          Write-Host "Source: $source"
          Write-Host "Include root: $env:MQL5_ROOT"

          $arguments = "/compile:`"$source`" /include:`"$env:MQL5_ROOT`" /log"

          $process = Start-Process `
            -FilePath $env:METAEDITOR_PATH `
            -ArgumentList $arguments `
            -Wait `
            -PassThru

          Write-Host "MetaEditor exit code: $($process.ExitCode)"

          Start-Sleep -Seconds 2

          if (Test-Path $log) {
            Write-Host '===== COMPILER LOG ====='
            Get-Content $log
            Write-Host '===== END COMPILER LOG ====='
          }
          else {
            Write-Host 'MetaEditor did not create the expected compiler log.'
          }

          $generated = Get-ChildItem `
            -Path $env:MQL5_ROOT `
            -Filter 'KingsBot_Phase6_Integration.ex5' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $generated) {

            if (Test-Path $log) {
              throw "King's Bot compilation failed. No EX5 was produced. See compiler log above."
            }

            throw "King's Bot compilation failed and MetaEditor produced no EX5 or compiler log. Exit code: $($process.ExitCode)"
          }

          Write-Host "EX5 produced: $($generated.FullName)"

          "EX5_PATH=$($generated.FullName)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      - name: Prepare King's Bot artifact
        if: success()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $artifact = Join-Path `
            $env:RUNNER_TEMP `
            'KingsBot-artifact'

          if (Test-Path $artifact) {
            Remove-Item `
              $artifact `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $artifact `
            -Force |
            Out-Null

          Copy-Item `
            -Path $env:EX5_PATH `
            -Destination (Join-Path $artifact 'KingsBot_Phase6_Integration.ex5') `
            -Force

          $source = Join-Path `
            $env:MQL5_ROOT `
            'Experts\KingsBot_Phase6_Integration.mq5'

          if (Test-Path $source) {
            Copy-Item `
              -Path $source `
              -Destination (Join-Path $artifact 'KingsBot_Phase6_Integration.mq5') `
              -Force
          }

          "ARTIFACT_DIR=$artifact" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      - name: Upload King's Bot artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-build
          path: ${{ env.ARTIFACT_DIR }}
          if-no-files-found: error
          retention-days: 14
