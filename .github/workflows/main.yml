name: Build King's Bot

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Compile King's Bot
    runs-on: windows-latest
    timeout-minutes: 30

    steps:

      - name: Checkout King's Bot
        uses: actions/checkout@v4

      - name: Download MetaTrader 5 installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'

          Write-Host "Downloading MetaTrader 5 installer..."

          Invoke-WebRequest `
            -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' `
            -OutFile $installer

          if (-not (Test-Path -LiteralPath $installer)) {
            throw "MetaTrader 5 installer was not downloaded."
          }

          Write-Host "Installer downloaded successfully."

      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'

          Write-Host "Starting MetaTrader 5 installer..."

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList '/auto' `
            -Wait `
            -PassThru

          if ($null -eq $process) {
            throw "MetaTrader 5 installer process could not be started."
          }

          Write-Host "Installer exit code: $($process.ExitCode)"

          if ($process.ExitCode -notin @(0, 1)) {
            throw "Unexpected MetaTrader 5 installer exit code: $($process.ExitCode)"
          }

          Write-Host "MetaTrader 5 installer completed."

      - name: Locate MetaEditor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "Searching for MetaEditor..."

          $searchRoots = @(
            $env:APPDATA
            $env:LOCALAPPDATA
            $env:RUNNER_TEMP
            $env:ProgramFiles
            ${env:ProgramFiles(x86)}
          )

          $metaEditor = $null

          foreach ($root in $searchRoots) {

            if ([string]::IsNullOrWhiteSpace($root)) {
              continue
            }

            if (-not (Test-Path -LiteralPath $root)) {
              continue
            }

            $found = Get-ChildItem `
              -Path $root `
              -Filter 'metaeditor64.exe' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if ($found) {
              $metaEditor = $found.FullName
              break
            }

            $found = Get-ChildItem `
              -Path $root `
              -Filter 'metaeditor.exe' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if ($found) {
              $metaEditor = $found.FullName
              break
            }
          }

          if ([string]::IsNullOrWhiteSpace($metaEditor)) {
            Write-Host "MetaEditor was not found."

            Get-ChildItem `
              -Path 'C:\Users' `
              -Filter 'metaeditor64.exe' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 20 -ExpandProperty FullName

            throw "MetaEditor executable was not found."
          }

          Write-Host "MetaEditor found:"
          Write-Host $metaEditor

          "METAEDITOR=$metaEditor" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append

      - name: Locate King's Bot source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $workspace = $env:GITHUB_WORKSPACE

          $mq5Files = @(
            Get-ChildItem `
              -Path $workspace `
              -Filter '*.mq5' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue
          )

          if ($mq5Files.Count -eq 0) {
            throw "No MQ5 source files were found in the repository."
          }

          Write-Host "MQ5 files found:"

          foreach ($file in $mq5Files) {
            Write-Host " - $($file.FullName)"
          }

          "SOURCE_ROOT=$workspace" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append

      - name: Show MQL5 include files
        shell: pwsh
        run: |
          $mqhFiles = @(
            Get-ChildItem `
              -Path $env:SOURCE_ROOT `
              -Filter '*.mqh' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue
          )

          Write-Host "MQH files found: $($mqhFiles.Count)"

          foreach ($file in $mqhFiles) {
            Write-Host " - $($file.FullName)"
          }

      - name: Compile King's Bot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $mq5Files = @(
            Get-ChildItem `
              -Path $env:SOURCE_ROOT `
              -Filter '*.mq5' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue
          )

