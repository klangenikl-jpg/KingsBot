name: Build King's Bot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Compile King's Bot
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout King's Bot
        uses: actions/checkout@v4

      - name: Download MetaTrader 5 installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          $url = 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe'

          Write-Host "Downloading MetaTrader 5 installer..."
          Invoke-WebRequest -Uri $url -OutFile $installer

          if (-not (Test-Path $installer)) {
            throw 'MetaTrader 5 installer was not downloaded.'
          }

          Write-Host "Installer downloaded: $installer"

      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          $mt5Root = Join-Path $env:RUNNER_TEMP 'MT5'

          New-Item -ItemType Directory -Force -Path $mt5Root | Out-Null

          Write-Host "Installing MetaTrader 5..."
          Write-Host "Installation directory: $mt5Root"

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList @(
              '/auto',
              "/path:$mt5Root"
            ) `
            -Wait `
            -PassThru

          Write-Host "Installer exit code: $($process.ExitCode)"

          if ($process.ExitCode -ne 0) {
            throw "MetaTrader 5 installer returned exit code $($process.ExitCode)."
          }

      - name: Locate MetaEditor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $searchPaths = @(
            (Join-Path $env:RUNNER_TEMP 'MT5'),
            $env:RUNNER_TEMP
          )

          $metaEditor = $null

          foreach ($path in $searchPaths) {
            if (Test-Path $path) {
              $metaEditor = Get-ChildItem `
                -Path $path `
                -Filter 'MetaEditor64.exe' `
                -File `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

              if ($metaEditor) {
                break
              }
            }
          }

          if (-not $metaEditor) {
            throw 'MetaEditor64.exe was not found.'
          }

          Write-Host "MetaEditor found:"
          Write-Host $metaEditor.FullName

          "METAEDITOR=$($metaEditor.FullName)" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8

      - name: Locate King's Bot source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter 'KingsBot_Phase6_Integration.mq5' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $source) {
            throw 'KingsBot_Phase6_Integration.mq5 was not found.'
          }

          Write-Host "King's Bot source:"
          Write-Host $source.FullName

          "SOURCE=$($source.FullName)" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8

      - name: Show MQL5 include files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host 'MQL5 include files found in repository:'

          $includes = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter '*.mqh' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue

          if ($includes) {
            $includes | ForEach-Object {
              Write-Host $_.FullName
            }
          }
          else {
            Write-Host 'No MQL5 include files were found.'
          }

      - name: Compile King's Bot
        shell: pw
