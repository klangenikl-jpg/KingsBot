name: Build King's Bot

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build King's Bot
    runs-on: windows-latest

    steps:
      - name: Checkout King's Bot
        uses: actions/checkout@v4

      - name: Locate or install MetaEditor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $mt5Root = 'C:\Program Files\MetaTrader 5'
          $metaEditor = Join-Path $mt5Root 'MetaEditor64.exe'

          Write-Host '========================================='
          Write-Host 'LOCATING / INSTALLING METATRADER 5'
          Write-Host '========================================='

          $candidates = @(
            $metaEditor,
            'C:\Program Files\MetaTrader 5\MetaEditor64.exe',
            'C:\Program Files\MetaTrader 5\metaeditor64.exe'
          ) | Select-Object -Unique

          foreach ($candidate in $candidates) {
            if (Test-Path -LiteralPath $candidate -PathType Leaf) {
              $metaEditor = $candidate
              break
            }
          }

          if (-not (Test-Path -LiteralPath $metaEditor -PathType Leaf)) {
            $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'

            Write-Host 'MetaEditor not found.'
            Write-Host 'Downloading official MetaTrader 5 installer...'

            Invoke-WebRequest `
              -Uri 'https://download.terminal.free/cdn/web/metaquotes.ltd/mt5/mt5setup.exe' `
              -OutFile $installer

            Write-Host 'Installing MetaTrader 5 in unattended mode...'

            $process = Start-Process `
              -FilePath $installer `
              -ArgumentList @('/auto', "/path:$mt5Root") `
              -Wait `
              -PassThru

            Write-Host "MT5 installer exit code: $($process.ExitCode)"

            if ($process.ExitCode -ne 0) {
              throw "MetaTrader 5 installer failed with exit code $($process.ExitCode)."
            }
          }

          $metaEditor = Get-ChildItem `
            -Path 'C:\Program Files', 'C:\Program Files (x86)' `
            -Filter 'MetaEditor64.exe' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName

          if ([string]::IsNullOrWhiteSpace($metaEditor)) {
            throw 'MetaEditor64.exe was not found on the runner after MT5 installation.'
          }

          "METAEDITOR=$metaEditor" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8

          Write-Host "MetaEditor: $metaEditor"

      - name: Prepare King's Bot source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $stageRoot = Join-Path $env:RUNNER_TEMP 'KingsBot-MQL5'
          $includeRoot = Join-Path $stageRoot 'include'

          if (Test-Path -LiteralPath $stageRoot) {
            Remove-Item -LiteralPath $stageRoot -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $stageRoot `
            -Force | Out-Null

          New-Item `
            -ItemType Directory `
            -Path $includeRoot `
            -Force | Out-Null

          $source = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter 'KingsBot_Phase6_Integration.mq5' `
            -File `
            -Recurse |
            Select-Object -First 1 -ExpandProperty FullName

          if ([string]::IsNullOrWhiteSpace($source)) {
            throw 'KingsBot_Phase6_Integration.mq5 was not found in the repository.'
          }

          $sourceDir = Split-Path -Parent $source

          Copy-Item `
            -Path (Join-Path $sourceDir '*') `
            -Destination $stageRoot `
            -Recurse `
            -Force

          $stagedSource = Join-Path `
            $stageRoot `
            'KingsBot_Phase6_Integration.mq5'

          if (-not (Test-Path -LiteralPath $stagedSource -PathType Leaf)) {
            throw "Staged source was not created: $stagedSource"
          }

          "KB_STAGE_ROOT=$stageRoot" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          "KB_INCLUDE_ROOT=$includeRoot" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          "KB_SOURCE=$stagedSource" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Source: $stagedSource"
          Write-Host "Include root: $includeRoot"

      - name: Install standard MQL5 include library
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host '========================================='
          Write-Host 'INSTALLING MQL5 STANDARD INCLUDE LIBRARY'
          Write-Host '========================================='

          $libraryUrl = 'https://github.com/gsemet/mt5-include.git'

          if (Test-Path -LiteralPath $env:KB_INCLUDE_ROOT) {
            Remove-Item `
              -LiteralPath $env:KB_INCLUDE_ROOT `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $env:KB_INCLUDE_ROOT `
            -Force | Out-Null

          git clone `
            --depth 1 `
            $libraryUrl `
            $env:KB_INCLUDE_ROOT

          $gitDir = Join-Path `
            $env:KB_INCLUDE_ROOT `
            '.git'

          if (Test-Path -LiteralPath $gitDir) {
            Remove-Item `
              -LiteralPath $gitDir `
              -Recurse `
              -Force
          }

          $tradeMqh = Join-Path `
            $env:KB_INCLUDE_ROOT `
            'Trade\Trade.mqh'

          if (-not (Test-Path -LiteralPath $tradeMqh -PathType Leaf)) {
            throw "Trade.mqh was not installed: $tradeMqh"
          }

          Write-Host "Trade.mqh installed successfully: $tradeMqh"

      - name: Verify standard MQL5 library
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host '========================================='
          Write-Host 'VERIFYING MQL5 STANDARD LIBRARY'
          Write-Host '========================================='

          $tradeMqh = Join-Path `
            $env:KB_INCLUDE_ROOT `
            'Trade\Trade.mqh'

          if (-not (Test-Path -LiteralPath $tradeMqh -PathType Leaf)) {
            throw "Standard MQL5 Include\Trade\Trade.mqh is missing: $tradeMqh"
          }

          Write-Host 'OK: Include\Trade\Trade.mqh is present.'
          Write-Host "Library root: $env:KB_INCLUDE_ROOT"

      - name: Compile King's Bot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $source = $env:KB_SOURCE
          $includeRoot = $env:KB_INCLUDE_ROOT
          $metaEditor = $env:METAEDITOR

          $logFile = [System.IO.Path]::ChangeExtension(
            $source,
            '.log'
          )

          $ex5File = [System.IO.Path]::ChangeExtension(
            $source,
            '.ex5'
          )

          Write-Host '========================================='
          Write-Host "COMPILING KING'S BOT"
          Write-Host '========================================='
          Write-Host "MetaEditor: $metaEditor"
          Write-Host "Source: $source"
          Write-Host "Include root: $includeRoot"

          Remove-Item `
            -LiteralPath $logFile, $ex5File `
            -Force `
            -ErrorAction SilentlyContinue

          $arguments = @(
            "/compile:$source",
            "/include:$env:KB_STAGE_ROOT",
            '/log'
          )

          $process = Start-Process `
            -FilePath $metaEditor `
            -ArgumentList $arguments `
            -Wait `
            -PassThru `
            -NoNewWindow

          Write-Host "MetaEditor exit code: $($process.ExitCode)"

          Start-Sleep -Seconds 2

          if (Test-Path -LiteralPath $logFile -PathType Leaf) {
            Write-Host '========== COMPILER LOG =========='
            Get-Content -LiteralPath $logFile
            Write-Host '=================================='
          }
          else {
            Write-Host 'WARNING: MetaEditor did not create the expected compiler log.'
          }

          if (-not (Test-Path -LiteralPath $ex5File -PathType Leaf)) {
            if (Test-Path -LiteralPath $logFile -PathType Leaf) {
              throw "King's Bot compilation failed. No EX5 was produced. See compiler log above."
            }

            throw "King's Bot compilation failed. No EX5 or compiler log was produced. MetaEditor exit code: $($process.ExitCode)"
          }

          if ((Get-Item -LiteralPath $ex5File).Length -le 0) {
            throw "King's Bot produced an empty EX5: $ex5File"
          }

          Write-Host "SUCCESS: EX5 produced: $ex5File"

      - name: Prepare King's Bot artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $artifactDir = Join-Path `
            $env:RUNNER_TEMP `
            'KingsBot-artifact'

          New-Item `
            -ItemType Directory `
            -Path $artifactDir `
            -Force | Out-Null

          $ex5 = [System.IO.Path]::ChangeExtension(
            $env:KB_SOURCE,
            '.ex5'
          )

          $log = [System.IO.Path]::ChangeExtension(
            $env:KB_SOURCE,
            '.log'
          )

          Copy-Item `
            -LiteralPath $ex5 `
            -Destination $artifactDir `
            -Force

          if (Test-Path -LiteralPath $log -PathType Leaf) {
            Copy-Item `
              -LiteralPath $log `
              -Destination $artifactDir `
              -Force
          }

          "KB_ARTIFACT_DIR=$artifactDir" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      - name: Upload King's Bot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-Phase6-build
          path: ${{ env.KB_ARTIFACT_DIR }}
          if-no-files-found: error

      - name: Complete job
        shell: pwsh
        run: |
          Write-Host "King's Bot build completed successfully."
