name: Build King's Bot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Compile King's Bot
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout King's Bot
        uses: actions/checkout@v4

      - name: Download MetaTrader 5 installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          $url = 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe'

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer

          if (-not (Test-Path $installer)) {
            throw "MetaTrader 5 installer was not downloaded."
          }

      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList '/auto' `
            -Wait `
            -PassThru

          Write-Host "Installer exit code: $($process.ExitCode)"

          $searchRoots = @(
            $env:RUNNER_TEMP,
            $env:LOCALAPPDATA,
            'C:\Program Files',
            'C:\Program Files (x86)'
          )

          $metaEditor = $null

          foreach ($root in $searchRoots) {
            if (-not (Test-Path $root)) {
              continue
            }

            $found = Get-ChildItem `
              -Path $root `
              -Filter 'MetaEditor64.exe' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if ($found) {
              $metaEditor = $found
              break
            }
          }

          if (-not $metaEditor) {
            throw "MetaEditor64.exe was not found."
          }

          Write-Host "MetaEditor: $($metaEditor.FullName)"

          "METAEDITOR=$($metaEditor.FullName)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      - name: Locate King's Bot source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter 'KingsBot_Phase6_Integration.mq5' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $source) {
            throw "KingsBot_Phase6_Integration.mq5 was not found."
          }

          Write-Host "Source: $($source.FullName)"

          "SOURCE=$($source.FullName)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      - name: Compile King's Bot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $sourceDirectory = Split-Path -Parent $env:SOURCE

          Write-Host "========================================"
          Write-Host "COMPILING KING'S BOT"
          Write-Host "========================================"
          Write-Host "Source: $env:SOURCE"
          Write-Host "MetaEditor: $env:METAEDITOR"

          $process = Start-Process `
            -FilePath $env:METAEDITOR `
            -ArgumentList @(
              "/compile:`"$($env:SOURCE)`"",
              '/log'
            ) `
            -WorkingDirectory $sourceDirectory `
            -Wait `
            -PassThru

          Write-Host "MetaEditor exit code: $($process.ExitCode)"

          Start-Sleep -Seconds 3

          $after = @(
            Get-ChildItem `
              -Path $env:GITHUB_WORKSPACE `
              -Filter '*.ex5' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue
          )

          if ($after.Count -eq 0) {
            throw "KingsBot compilation failed. No EX5 file was created."
          }

          Write-Host "========================================"
          Write-Host "EX5 FILE FOUND"
          Write-Host "========================================"

          $generated = $after |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          Write-Host $generated.FullName

          "EX5_PATH=$($generated.FullName)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      - name: Prepare King's Bot artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $artifactDirectory = Join-Path `
            $env:RUNNER_TEMP `
            'KingsBotArtifact'

          New-Item `
            -ItemType Directory `
            -Path $artifactDirectory `
            -Force |
            Out-Null

          $artifactFile = Join-Path `
            $artifactDirectory `
            'KingsBot_Phase6_Integration.ex5'

          Copy-Item `
            -Path $env:EX5_PATH `
            -Destination $artifactFile `
            -Force

          if (-not (Test-Path $artifactFile)) {
            throw "Artifact file was not created."
          }

          Write-Host "Artifact:"
          Write-Host $artifactFile

          "ARTIFACT_FILE=$artifactFile" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      - name: Upload King's Bot artifact
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-Phase6
          path: ${{ env.ARTIFACT_FILE }}
          if-no-files-found: error
