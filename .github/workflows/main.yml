name: Build King's Bot

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build King's Bot
    runs-on: windows-latest

    steps:
      - name: Checkout King's Bot
        uses: actions/checkout@v4

      - name: Locate MetaEditor and MT5 MQL5 library
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "LOCATING METATRADER 5"
          Write-Host "========================================="

          $searchRoots = @(
            "C:\Program Files",
            "C:\Program Files (x86)",
            $env:USERPROFILE
          )

          $metaEditor = $null

          Write-Host "Searching for MetaEditor64.exe..."

          foreach ($root in $searchRoots) {
            if (Test-Path $root) {
              $metaEditor = Get-ChildItem `
                -Path $root `
                -Filter "metaeditor64.exe" `
                -File `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

              if ($metaEditor) {
                break
              }
            }
          }

          if (-not $metaEditor) {
            Write-Host "MetaEditor not found. Installing MT5..."

            $installer = Join-Path `
              $env:RUNNER_TEMP `
              "mt5setup.exe"

            Invoke-WebRequest `
              -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" `
              -OutFile $installer

            Start-Process `
              -FilePath $installer `
              -ArgumentList "/auto" `
              -Wait

            Start-Sleep -Seconds 10

            Write-Host "Searching again after installation..."

            foreach ($root in $searchRoots) {
              if (Test-Path $root) {
                $metaEditor = Get-ChildItem `
                  -Path $root `
                  -Filter "metaeditor64.exe" `
                  -File `
                  -Recurse `
                  -ErrorAction SilentlyContinue |
                  Select-Object -First 1

                if ($metaEditor) {
                  break
                }
              }
            }
          }

          if (-not $metaEditor) {
            throw "MetaEditor64.exe could not be located after MT5 installation."
          }

          Write-Host ""
          Write-Host "MetaEditor found:"
          Write-Host $metaEditor.FullName

          $metaEditorDirectory = Split-Path `
            $metaEditor.FullName `
            -Parent

          Write-Host ""
          Write-Host "MetaEditor directory:"
          Write-Host $metaEditorDirectory

          Write-Host ""
          Write-Host "Searching for standard MQL5 Trade.mqh..."

          $tradeHeader = $null

          $tradeSearchRoots = @(
            $metaEditorDirectory,
            (Split-Path $metaEditorDirectory -Parent),
            "$env:USERPROFILE\AppData\Roaming\MetaQuotes\Terminal",
            "C:\Program Files",
            "C:\Program Files (x86)"
          )

          foreach ($root in $tradeSearchRoots) {
            if (Test-Path $root) {
              $tradeHeader = Get-ChildItem `
                -Path $root `
                -Filter "Trade.mqh" `
                -File `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Where-Object {
                  $_.FullName -match "\\MQL5\\Include\\Trade\\Trade\.mqh$"
                } |
                Select-Object -First 1

              if ($tradeHeader) {
                break
              }
            }
          }

          if (-not $tradeHeader) {
            throw "Standard MQL5 Trade.mqh was not found."
          }

          $mql5Root = $tradeHeader.Directory.Parent.Parent.Parent.FullName

          Write-Host ""
          Write-Host "Standard Trade.mqh found:"
          Write-Host $tradeHeader.FullName

          Write-Host ""
          Write-Host "MQL5 include root:"
          Write-Host $mql5Root

          "METAEDITOR_PATH=$($metaEditor.FullName)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          "MQL5_ROOT=$mql5Root" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      - name: Prepare King's Bot source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "PREPARING KING'S BOT SOURCE"
          Write-Host "========================================="

          $workspace = $env:GITHUB_WORKSPACE
          $buildRoot = Join-Path `
            $env:RUNNER_TEMP `
            "KingsBotBuild"

          $expertRoot = Join-Path `
            $buildRoot `
            "MQL5\Experts\KingsBot"

          New-Item `
            -ItemType Directory `
            -Path $expertRoot `
            -Force |
            Out-Null

          $source = Get-ChildItem `
            -Path $workspace `
            -Filter "KingsBot_Phase6_Integration.mq5" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $source) {
            throw "KingsBot_Phase6_Integration.mq5 was not found."
          }

          Copy-Item `
            -LiteralPath $source.FullName `
            -Destination (Join-Path `
              $expertRoot `
              "KingsBot_Phase6_Integration.mq5") `
            -Force

          $headers = Get-ChildItem `
            -Path $workspace `
            -Filter "*.mqh" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue

          foreach ($file in $headers) {
            $destination = Join-Path `
              $expertRoot `
              $file.Name

            Copy-Item `
              -LiteralPath $file.FullName `
              -Destination $destination `
              -Force
          }

          Write-Host ""
          Write-Host "Build source files:"

          Get-ChildItem `
            -Path $expertRoot `
            -File |
            ForEach-Object {
              Write-Host $_.Name
            }

          "KING_BUILD_ROOT=$buildRoot" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          "KING_EXPERT_ROOT=$expertRoot" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      - name: Normalize MQL5 headers
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "NORMALIZING MQL5 SOURCE"
          Write-Host "========================================="

          $root = $env:KING_EXPERT_ROOT

          $files = Get-ChildItem `
            -Path $root `
            -Filter "*.mqh" `
            -File `
            -Recurse `
            -ErrorAction Stop

          foreach ($file in $files) {
            $content = Get-Content `
              -LiteralPath $file.FullName `
              -Raw `
              -Encoding UTF8

            $original = $content

            $content = [regex]::Replace(
              $content,
              '(?m)^\s*#once\s*$',
              '#pragma once'
            )

            $content = $content.Replace(
              '#include <Include\Trade\Trade.mqh>',
              '#include <Trade\Trade.mqh>'
            )

            if ($content -ne $original) {
              Set-Content `
                -LiteralPath $file.FullName `
                -Value $content `
                -Encoding UTF8

              Write-Host "Normalized: $($file.Name)"
            }
          }

          Write-Host ""
          Write-Host "Normalized source preview:"

          Get-ChildItem `
            -Path $root `
            -Filter "*.mqh" `
            -File |
            ForEach-Object {
              Write-Host ""
              Write-Host "----- $($_.Name) -----"

              Get-Content `
                -LiteralPath $_.FullName |
                Select-Object -First 3
            }

      - name: Verify standard MQL5 library
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "VERIFYING STANDARD MQL5 LIBRARY"
          Write-Host "========================================="

          $tradeHeader = Join-Path `
            $env:MQL5_ROOT `
            "Include\Trade\Trade.mqh"

          if (-not (Test-Path $tradeHeader)) {
            throw "Trade.mqh is missing from MQL5_ROOT: $tradeHeader"
          }

          Write-Host "Trade.mqh:"
          Write-Host $tradeHeader

          Write-Host ""
          Write-Host "MQL5_ROOT:"
          Write-Host $env:MQL5_ROOT

      - name: Compile King's Bot
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "========================================="
          Write-Host "COMPILING KING'S BOT"
          Write-Host "========================================="

          $metaEditor = $env:METAEDITOR_PATH

          $source = Join-Path `
            $env:KING_EXPERT_ROOT `
            "KingsBot_Phase6_Integration.mq5"

          $log = Join-Path `
            $env:KING_EXPERT_ROOT `
            "KingsBot_Phase6_Integration.log"

          if (-not (Test-Path $source)) {
            throw "Integration source not found: $source"
          }

          if (-not (Test-Path $metaEditor)) {
            throw "MetaEditor not found: $metaEditor"
          }

          if (-not (Test-Path $env:MQL5_ROOT)) {
            throw "MQL5_ROOT does not exist: $env:MQL5_ROOT"
          }

          Write-Host ""
          Write-Host "MetaEditor:"
          Write-Host $metaEditor

          Write-Host ""
          Write-Host "Source:"
          Write-Host $source

          Write-Host ""
          Write-Host "Include root:"
          Write-Host $env:MQL5_ROOT

          Write-Host ""
          Write-Host "========================================="
          Write-Host "METAEDITOR COMPILATION"
          Write-Host "========================================="

          $arguments = @(
            "/compile:$source"
            "/inc:$env:MQL5_ROOT"
            "/log"
          )

          $process = Start-Process `
            -FilePath $metaEditor `
            -ArgumentList $arguments `
            -Wait `
            -PassThru `
            -WindowStyle Hidden

          Start-Sleep -Seconds 3

          Write-Host ""
          Write-Host "Compiler exit code:"
          Write-Host $process.ExitCode

          Write-Host ""
          Write-Host "========================================="
          Write-Host "COMPILER LOG"
          Write-Host "========================================="

          if (Test-Path $log) {
            Get-Content `
              -LiteralPath $log
          }
          else {
            Write-Host "No compiler log found."
          }

          Write-Host ""
          Write-Host "Searching for EX5..."

          $ex5 = Get-ChildItem `
            -Path $env:KING_BUILD_ROOT `
            -Filter "KingsBot_Phase6_Integration.ex5" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $ex5) {
            throw "KingsBot EX5 was not created."
          }

          Write-Host ""
          Write-Host "========================================="
          Write-Host "EX5 CREATED"
          Write-Host "========================================="
          Write-Host $ex5.FullName
          Write-Host "SIZE: $($ex5.Length) bytes"

          "EX5_PATH=$($ex5.FullName)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      - name: Stage artifacts
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "========================================="
          Write-Host "STAGING BUILD ARTIFACTS"
          Write-Host "========================================="

          $artifactRoot = Join-Path `
            $env:GITHUB_WORKSPACE `
            "build-artifacts"

          New-Item `
            -ItemType Directory `
            -Path $artifactRoot `
            -Force |
            Out-Null

          if ($env:EX5_PATH -and (Test-Path $env:EX5_PATH)) {
            Copy-Item `
              -LiteralPath $env:EX5_PATH `
              -Destination (Join-Path `
                $artifactRoot `
                "KingsBot_Phase6_Integration.ex5") `
              -Force

            Write-Host "EX5 staged."
          }
          else {
            Write-Host "No EX5 available to stage."
          }

          if ($env:KING_EXPERT_ROOT) {
            $log = Join-Path `
              $env:KING_EXPERT_ROOT `
              "KingsBot_Phase6_Integration.log"

            if (Test-Path $log) {
              Copy-Item `
                -LiteralPath $log `
                -Destination (Join-Path `
                  $artifactRoot `
                  "KingsBot_Phase6_Integration.log") `
                -Force

              Write-Host "Compiler log staged."
            }
          }

          Write-Host ""
          Write-Host "Artifact directory:"
          Get-ChildItem `
            -Path $artifactRoot `
            -File |
            ForEach-Object {
              Write-Host $_.FullName
            }

      - name: Upload King's Bot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-build
          path: build-artifacts
          if-no-files-found: warn
          retention-days: 14

      - name: Final verification
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:EX5_PATH) {
            throw "Final verification failed: EX5 was not created."
          }

          if (-not (Test-Path $env:EX5_PATH)) {
            throw "Final verification failed: EX5 path does not exist."
          }

          $size = (Get-Item $env:EX5_PATH).Length

          if ($size -le 0) {
            throw "Final verification failed: EX5 file is empty."
          }

          Write-Host ""
          Write-Host "========================================="
          Write-Host "KING'S BOT BUILD SUCCESSFUL"
          Write-Host "========================================="
          Write-Host "EX5: $env:EX5_PATH"
          Write-Host "Size: $size bytes"
