name: Build King's Bot

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build King's Bot
    runs-on: windows-latest

    steps:
      - name: Get King's Bot source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build King's Bot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host ""
          Write-Host "========================================"
          Write-Host "        KING'S BOT - PHASE 6 BUILD"
          Write-Host "========================================"
          Write-Host ""

          $repoRoot = $env:GITHUB_WORKSPACE

          $mainCandidates = @(
            Get-ChildItem -Path $repoRoot -Recurse -File -Filter "KingsBot_Phase6_Integration.mq5" |
              Where-Object {
                $_.FullName -notmatch '\\.git\\' -and
                $_.FullName -notmatch '\\build\\'
              }
          )

          if ($mainCandidates.Count -eq 0) {
            throw "KingsBot_Phase6_Integration.mq5 was not found in the repository."
          }

          if ($mainCandidates.Count -gt 1) {
            Write-Host "Multiple Phase 6 main files found. Using the first one:"
          }

          $sourceFile = $mainCandidates[0].FullName
          $sourceRoot = $mainCandidates[0].Directory.FullName

          Write-Host "Source file:"
          Write-Host "  $sourceFile"
          Write-Host "Source directory:"
          Write-Host "  $sourceRoot"
          Write-Host ""

          $installRoot = Join-Path $env:RUNNER_TEMP "KingsBot-MT5"
          $metaEditor = $null

          $searchRoots = @(
            "C:\Program Files",
            "C:\Program Files (x86)",
            (Join-Path $env:LOCALAPPDATA ""),
            (Join-Path $env:APPDATA ""),
            $installRoot
          )

          foreach ($root in $searchRoots) {
            if (-not (Test-Path $root)) {
              continue
            }

            $found = Get-ChildItem -Path $root -Recurse -File -Filter "metaeditor64.exe" `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if ($found) {
              $metaEditor = $found.FullName
              break
            }
          }

          if (-not $metaEditor) {
            Write-Host "MetaEditor64 was not found."
            Write-Host "Installing MetaTrader 5 automatically..."

            $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"

            Invoke-WebRequest `
              -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" `
              -OutFile $installer

            if (-not (Test-Path $installer)) {
              throw "MetaTrader 5 installer was not downloaded."
            }

            if (Test-Path $installRoot) {
              Remove-Item -Path $installRoot -Recurse -Force
            }

            New-Item -ItemType Directory -Path $installRoot -Force | Out-Null

            Write-Host "Running MT5 installer in automatic mode..."

            $installProcess = Start-Process `
              -FilePath $installer `
              -ArgumentList "/auto", "/path:`"$installRoot`"" `
              -Wait `
              -PassThru

            Write-Host "Installer exit code: $($installProcess.ExitCode)"

            if ($installProcess.ExitCode -ne 0) {
              throw "MetaTrader 5 installer failed with exit code $($installProcess.ExitCode)."
            }

            Start-Sleep -Seconds 5

            $metaEditorFound = Get-ChildItem `
              -Path $installRoot `
              -Recurse `
              -File `
              -Filter "metaeditor64.exe" `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if ($metaEditorFound) {
              $metaEditor = $metaEditorFound.FullName
            }
          }

          if (-not $metaEditor) {
            throw "MetaEditor64.exe could not be located after installation."
          }

          Write-Host ""
          Write-Host "MetaEditor:"
          Write-Host "  $metaEditor"
          Write-Host ""

          $buildRoot = Join-Path $env:RUNNER_TEMP "KingsBot-Build"
          $expertRoot = Join-Path $buildRoot "MQL5\Experts\KingsBot"

          if (Test-Path $buildRoot) {
            Remove-Item -Path $buildRoot -Recurse -Force
          }

          New-Item -ItemType Directory -Path $expertRoot -Force | Out-Null

          Write-Host "Clean build tree:"
          Write-Host "  $expertRoot"
          Write-Host ""

          Copy-Item `
            -Path (Join-Path $sourceRoot "*") `
            -Destination $expertRoot `
            -Recurse `
            -Force

          $stagedMain = Join-Path $expertRoot "KingsBot_Phase6_Integration.mq5"

          if (-not (Test-Path $stagedMain)) {
            throw "The Phase 6 main source was not copied into the clean build tree."
          }

          $platformMql5 = $null

          $platformMql5Candidates = @(
            Join-Path $installRoot "MQL5",
            Join-Path $installRoot "MQL5\Include"
          )

          foreach ($candidate in $platformMql5Candidates) {
            if (Test-Path (Join-Path $candidate "Include")) {
              $platformMql5 = $candidate
              break
            }
          }

          if (-not $platformMql5) {
            $mql5Found = Get-ChildItem `
              -Path $installRoot `
              -Directory `
              -Filter "MQL5" `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if ($mql5Found) {
              $platformMql5 = $mql5Found.FullName
            }
          }

          if (-not $platformMql5) {
            throw "Installed MetaTrader 5 MQL5 directory could not be located."
          }

          Write-Host "Platform MQL5 directory:"
          Write-Host "  $platformMql5"
          Write-Host ""

          $expectedEx5 = [System.IO.Path]::ChangeExtension($stagedMain, ".ex5")
          $compileLog = [System.IO.Path]::ChangeExtension($stagedMain, ".log")

          if (Test-Path $expectedEx5) {
            Remove-Item -Path $expectedEx5 -Force
          }

          if (Test-Path $compileLog) {
            Remove-Item -Path $compileLog -Force
          }

          Write-Host "========================================"
          Write-Host "           COMPILING KING'S BOT"
          Write-Host "========================================"
          Write-Host "Source: $stagedMain"
          Write-Host ""

          $arguments = @(
            "/compile:`"$stagedMain`"",
            "/include:`"$platformMql5`"",
            "/log"
          )

          $compileProcess = Start-Process `
            -FilePath $metaEditor `
            -ArgumentList $arguments `
            -Wait `
            -PassThru

          Write-Host ""
          Write-Host "MetaEditor exit code: $($compileProcess.ExitCode)"
          Write-Host ""

          if (Test-Path $compileLog) {
            Write-Host "========================================"
            Write-Host "             COMPILER LOG"
            Write-Host "========================================"
            Get-Content -Path $compileLog -ErrorAction SilentlyContinue
            Write-Host ""
          }

          if ($compileProcess.ExitCode -ne 0) {
            throw "MetaEditor compilation failed with exit code $($compileProcess.ExitCode)."
          }

          "KINGSBOT_EX5=$expectedEx5" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8

          "KINGSBOT_COMPILE_LOG=$compileLog" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8

      - name: Verify Phase 6 build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========================================"
          Write-Host "        VERIFYING PHASE 6 BUILD"
          Write-Host "========================================"

          if (-not $env:KINGSBOT_EX5) {
            throw "KINGSBOT_EX5 environment value is missing."
          }

          if (-not (Test-Path $env:KINGSBOT_EX5)) {
            throw "Expected EX5 was not produced: $env:KINGSBOT_EX5"
          }

          $ex5Info = Get-Item $env:KINGSBOT_EX5

          if ($ex5Info.Length -le 0) {
            throw "The generated EX5 exists but is empty."
          }

          if ($env:KINGSBOT_COMPILE_LOG -and -not (Test-Path $env:KINGSBOT_COMPILE_LOG)) {
            throw "Expected compiler log was not produced: $env:KINGSBOT_COMPILE_LOG"
          }

          Write-Host "EX5 verified:"
          Write-Host "  Path: $($ex5Info.FullName)"
          Write-Host "  Size: $($ex5Info.Length) bytes"

          if ($env:KINGSBOT_COMPILE_LOG) {
            Write-Host "Compiler log verified:"
            Write-Host "  $env:KINGSBOT_COMPILE_LOG"
          }

          Write-Host ""
          Write-Host "PHASE 6 BUILD VERIFICATION: PASS"
          Write-Host ""

      - name: Stage Phase 6 artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $artifactRoot = Join-Path $env:GITHUB_WORKSPACE "artifact"

          if (Test-Path $artifactRoot) {
            Remove-Item -Path $artifactRoot -Recurse -Force
          }

          New-Item -ItemType Directory -Path $artifactRoot -Force | Out-Null

          if (-not $env:KINGSBOT_EX5) {
            throw "KINGSBOT_EX5 environment value is missing."
          }

          if (-not (Test-Path $env:KINGSBOT_EX5)) {
            throw "Verified EX5 does not exist at: $env:KINGSBOT_EX5"
          }

          Copy-Item `
            -Path $env:KINGSBOT_EX5 `
            -Destination (Join-Path $artifactRoot "KingsBot_Phase6_Integration.ex5") `
            -Force

          if ($env:KINGSBOT_COMPILE_LOG -and (Test-Path $env:KINGSBOT_COMPILE_LOG)) {
            Copy-Item `
              -Path $env:KINGSBOT_COMPILE_LOG `
              -Destination (Join-Path $artifactRoot "KingsBot_Phase6_Integration.log") `
              -Force
          }

          Write-Host "Phase 6 artifact staged:"
          Get-ChildItem -Path $artifactRoot -File | Format-Table Name, Length

      - name: Upload King's Bot artifact
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-Phase6-EX5
          path: artifact/*
          if-no-files-found: error
          overwrite: true
