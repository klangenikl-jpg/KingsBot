name: Build King's Bot

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build King's Bot
    runs-on: windows-latest

    steps:
      - name: Get King's Bot source
        uses: actions/checkout@v4

      - name: Locate King's Bot source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter 'KingsBot_Phase6_Integration.mq5' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $source) {
            throw "KingsBot_Phase6_Integration.mq5 was not found in the repository."
          }

          "KINGSBOT_SOURCE=$($source.FullName)" >> $env:GITHUB_ENV

          Write-Host "Source:"
          Write-Host $source.FullName

      - name: Locate or install MetaTrader 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Find-MetaEditor {
            $roots = @(
              'C:\Program Files',
              'C:\Program Files (x86)',
              "$env:LOCALAPPDATA",
              "$env:APPDATA"
            )

            foreach ($root in $roots) {
              if (-not (Test-Path -LiteralPath $root)) {
                continue
              }

              $found = Get-ChildItem `
                -Path $root `
                -Filter 'MetaEditor64.exe' `
                -File `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

              if ($null -ne $found) {
                return $found.FullName
              }
            }

            return $null
          }

          $metaEditor = Find-MetaEditor

          if ([string]::IsNullOrWhiteSpace($metaEditor)) {
            Write-Host "MetaEditor64 was not found."
            Write-Host "Downloading official MetaTrader 5 installer..."

            $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'

            Invoke-WebRequest `
              -Uri 'https://download.terminal.free/cdn/web/metaquotes.ltd/mt5/mt5setup.exe' `
              -OutFile $installer

            $installDir = Join-Path $env:RUNNER_TEMP 'MetaTrader5'

            if (Test-Path -LiteralPath $installDir) {
              Remove-Item -LiteralPath $installDir -Recurse -Force
            }

            New-Item `
              -ItemType Directory `
              -Path $installDir `
              -Force | Out-Null

            Write-Host "Starting MT5 automatic installation..."

            $process = Start-Process `
              -FilePath $installer `
              -ArgumentList "/auto", "/path:`"$installDir`"" `
              -PassThru

            Write-Host "Installer PID: $($process.Id)"

            $deadline = (Get-Date).AddMinutes(8)

            while ((Get-Date) -lt $deadline) {
              Start-Sleep -Seconds 10

              $candidate = Join-Path `
                $installDir `
                'MetaEditor64.exe'

              if (Test-Path -LiteralPath $candidate) {
                $metaEditor = $candidate
                break
              }

              $metaEditor = Find-MetaEditor

              if (-not [string]::IsNullOrWhiteSpace($metaEditor)) {
                break
              }

              Write-Host "Waiting for MetaEditor..."
            }

            if ($process.HasExited) {
              Write-Host "MT5 installer exit code: $($process.ExitCode)"
            }
          }

          if ([string]::IsNullOrWhiteSpace($metaEditor)) {
            throw "MetaEditor64.exe could not be located."
          }

          if (-not (Test-Path -LiteralPath $metaEditor)) {
            throw "MetaEditor path does not exist: $metaEditor"
          }

          "METAEDITOR=$metaEditor" >> $env:GITHUB_ENV

          Write-Host "MetaEditor found:"
          Write-Host $metaEditor

      - name: Prepare clean MQL5 build tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $buildRoot = Join-Path `
            $env:RUNNER_TEMP `
            'KingsBotBuild'

          if (Test-Path -LiteralPath $buildRoot) {
            Remove-Item `
              -LiteralPath $buildRoot `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $buildRoot `
            -Force | Out-Null

          $mql5Root = Join-Path `
            $buildRoot `
            'MQL5'

          New-Item `
            -ItemType Directory `
            -Path $mql5Root `
            -Force | Out-Null

          $repoMql5 = Join-Path `
            $env:GITHUB_WORKSPACE `
            'MQL5'

          if (Test-Path -LiteralPath $repoMql5) {
            Copy-Item `
              -Path "$repoMql5\*" `
              -Destination $mql5Root `
              -Recurse `
              -Force
          }

          $includeRoot = Join-Path `
            $mql5Root `
            'Include'

          if (-not (Test-Path -LiteralPath $includeRoot)) {
            New-Item `
              -ItemType Directory `
              -Path $includeRoot `
              -Force | Out-Null
          }

          $relativeSource = $env:KINGSBOT_SOURCE.Substring(
            $env:GITHUB_WORKSPACE.Length
          ).TrimStart('\')

          $buildSource = Join-Path `
            $mql5Root `
            $relativeSource

          New-Item `
            -ItemType Directory `
            -Path (Split-Path $buildSource -Parent) `
            -Force | Out-Null

          Copy-Item `
            -LiteralPath $env:KINGSBOT_SOURCE `
            -Destination $buildSource `
            -Force

          "KINGSBOT_BUILD_ROOT=$buildRoot" >> $env:GITHUB_ENV
          "KINGSBOT_MQL5_ROOT=$mql5Root" >> $env:GITHUB_ENV
          "KINGSBOT_INCLUDE_ROOT=$includeRoot" >> $env:GITHUB_ENV
          "KINGSBOT_BUILD_SOURCE=$buildSource" >> $env:GITHUB_ENV

          Write-Host "Build root:"
          Write-Host $buildRoot

          Write-Host "MQL5 root:"
          Write-Host $mql5Root

          Write-Host "Include root:"
          Write-Host $includeRoot

          Write-Host "Build source:"
          Write-Host $buildSource

      - name: Compile King's Bot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:METAEDITOR)) {
            throw "METAEDITOR is empty."
          }

          if (-not (Test-Path -LiteralPath $env:METAEDITOR)) {
            throw "MetaEditor does not exist: $env:METAEDITOR"
          }

          if ([string]::IsNullOrWhiteSpace($env:KINGSBOT_BUILD_SOURCE)) {
            throw "KINGSBOT_BUILD_SOURCE is empty."
          }

          if (-not (Test-Path -LiteralPath $env:KINGSBOT_BUILD_SOURCE)) {
            throw "King's Bot source does not exist: $env:KINGSBOT_BUILD_SOURCE"
          }

          if ([string]::IsNullOrWhiteSpace($env:KINGSBOT_INCLUDE_ROOT)) {
            throw "KINGSBOT_INCLUDE_ROOT is empty."
          }

          if (-not (Test-Path -LiteralPath $env:KINGSBOT_INCLUDE_ROOT)) {
            throw "MQL5 Include directory does not exist: $env:KINGSBOT_INCLUDE_ROOT"
          }

          Write-Host "========================================"
          Write-Host "COMPILING KING'S BOT"
          Write-Host "========================================"
          Write-Host "MetaEditor:"
          Write-Host $env:METAEDITOR
          Write-Host "Source:"
          Write-Host $env:KINGSBOT_BUILD_SOURCE
          Write-Host "Include:"
          Write-Host $env:KINGSBOT_INCLUDE_ROOT
          Write-Host "========================================"

          $logFile = [System.IO.Path]::ChangeExtension(
            $env:KINGSBOT_BUILD_SOURCE,
            '.log'
          )

          & $env:METAEDITOR `
            "/compile:$($env:KINGSBOT_BUILD_SOURCE)" `
            "/include:$($env:KINGSBOT_INCLUDE_ROOT)" `
            "/log:$logFile"

          $metaExit = $LASTEXITCODE

          Write-Host "MetaEditor exit code: $metaExit"

          if (Test-Path -LiteralPath $logFile) {
            Write-Host "===== COMPILER LOG ====="
            Get-Content -LiteralPath $logFile
            Write-Host "========================"
          }

          $ex5 = Get-ChildItem `
            -Path $env:KINGSBOT_BUILD_ROOT `
            -Filter 'KingsBot_Phase6_Integration.ex5' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $ex5) {
            throw "Compilation did not produce KingsBot_Phase6_Integration.ex5."
          }

          "KINGSBOT_EX5=$($ex5.FullName)" >> $env:GITHUB_ENV

          Write-Host "EX5 created:"
          Write-Host $ex5.FullName

      - name: Stage artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $artifactDir = Join-Path `
            $env:RUNNER_TEMP `
            'KingsBotArtifact'

          if (Test-Path -LiteralPath $artifactDir) {
            Remove-Item `
              -LiteralPath $artifactDir `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $artifactDir `
            -Force | Out-Null

          Copy-Item `
            -LiteralPath $env:KINGSBOT_EX5 `
            -Destination $artifactDir `
            -Force

          Write-Host "Artifact staged:"
          Get-ChildItem -LiteralPath $artifactDir

      - name: Upload King's Bot artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kings-Bot-EX5
          path: ${{ runner.temp }}/KingsBotArtifact/*
          if-no-files-found: error
