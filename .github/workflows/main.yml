name: King's Bot - Phase 6 Build

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.mq5'
      - '**/*.mqh'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build King's Bot
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Checkout King's Bot
        uses: actions/checkout@v4

      - name: Locate or install MetaTrader 5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $mt5Root = Join-Path $env:RUNNER_TEMP 'KingsBot-MT5'
          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'

          if (Test-Path $mt5Root) {
            Remove-Item $mt5Root -Recurse -Force
          }

          New-Item -ItemType Directory -Path $mt5Root -Force | Out-Null

          Write-Host 'Downloading official MetaTrader 5 installer...'

          Invoke-WebRequest `
            -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' `
            -OutFile $installer `
            -UseBasicParsing

          Write-Host 'Installing MetaTrader 5...'

          $p = Start-Process `
            -FilePath $installer `
            -ArgumentList @('/auto', "/path:`"$mt5Root`"") `
            -Wait `
            -PassThru

          Write-Host "Installer exit code: $($p.ExitCode)"

          $editor = Get-ChildItem `
            -Path $mt5Root `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -ieq 'metaeditor64.exe'
            } |
            Select-Object -First 1

          if (-not $editor) {
            $editor = Get-ChildItem `
              -Path 'C:\Program Files\MetaTrader 5' `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Name -ieq 'metaeditor64.exe'
              } |
              Select-Object -First 1
          }

          if (-not $editor) {
            throw 'MetaEditor64.exe was not found.'
          }

          Write-Host "MetaEditor: $($editor.FullName)"

          "METAEDITOR=$($editor.FullName)" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append `
            -Encoding utf8

      - name: Prepare MQL5 standard library
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $includeRoot = Join-Path $env:RUNNER_TEMP 'KingsBot-MQL5'
          $includeDir = Join-Path $includeRoot 'include'
          $trade = Join-Path $includeDir 'Trade\Trade.mqh'

          if (Test-Path $includeRoot) {
            Remove-Item $includeRoot -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $includeDir `
            -Force |
            Out-Null

          Write-Host 'Checking installed MT5 standard library...'

          $installedTrade = Get-ChildItem `
            -Path @(
              'C:\Program Files\MetaTrader 5',
              "$env:LOCALAPPDATA\Programs\MetaTrader 5",
              "$env:APPDATA\MetaQuotes\Terminal"
            ) `
            -Recurse `
            -File `
            -Filter Trade.mqh `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FullName -match `
                '[\\/]+MQL5[\\/]+Include[\\/]+Trade[\\/]+Trade\.mqh$'
            } |
            Select-Object -First 1

          if ($installedTrade) {

            $installedInclude = Split-Path `
              (Split-Path $installedTrade.FullName -Parent) `
              -Parent

            Write-Host "Using installed standard library:"
            Write-Host $installedInclude

            Copy-Item `
              -Path (Join-Path $installedInclude '*') `
              -Destination $includeDir `
              -Recurse `
              -Force
          }

          if (-not (Test-Path $trade)) {

            Write-Host ''
            Write-Host 'Installed standard library is incomplete.'
            Write-Host 'Using standard-library build fallback...'

            $mirror = Join-Path `
              $env:RUNNER_TEMP `
              'mt5-include'

            if (Test-Path $mirror) {
              Remove-Item `
                $mirror `
                -Recurse `
                -Force
            }

            git clone `
              --depth 1 `
              https://github.com/gsemet/mt5-include.git `
              $mirror

            Copy-Item `
              -Path (Join-Path $mirror '*') `
              -Destination $includeDir `
              -Recurse `
              -Force
          }

          if (-not (Test-Path $trade)) {
            throw 'Trade.mqh is still unavailable after standard-library fallback.'
          }

          Write-Host ''
          Write-Host "Trade.mqh ready:"
          Write-Host $trade

          "MQL5_INCLUDE_ROOT=$includeRoot" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append `
            -Encoding utf8

      - name: Compile King's Bot
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Join-Path `
            $env:GITHUB_WORKSPACE `
            'KingsBot_Phase6_Integration.mq5'

          if (-not (Test-Path $source)) {
            throw "Main King's Bot source was not found: $source"
          }

          Write-Host '========================================'
          Write-Host "COMPILING KING'S BOT"
          Write-Host '========================================'

          Write-Host "Source:"
          Write-Host $source

          Write-Host ''
          Write-Host 'MetaEditor:'
          Write-Host $env:METAEDITOR

          Write-Host ''
          Write-Host 'Include root:'
          Write-Host $env:MQL5_INCLUDE_ROOT

          & $env:METAEDITOR `
            "/compile:$source" `
            "/include:$env:MQL5_INCLUDE_ROOT" `
            '/log'

          $exitCode = $LASTEXITCODE

          $logFile = [System.IO.Path]::ChangeExtension(
            $source,
            '.log'
          )

          if (Test-Path $logFile) {
            Write-Host ''
            Write-Host 'COMPILER LOG'
            Write-Host '========================================'
            Get-Content $logFile
          }

          $ex5 = [System.IO.Path]::ChangeExtension(
            $source,
            '.ex5'
          )

          if ($exitCode -ne 0 -or -not (Test-Path $ex5)) {
            throw "King's Bot compilation failed. Exit code: $exitCode"
          }

          Write-Host ''
          Write-Host '========================================'
          Write-Host "KING'S BOT COMPILED SUCCESSFULLY"
          Write-Host '========================================'
          Write-Host $ex5

      - name: Upload King's Bot EX5
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-Phase6-EX5
          path: KingsBot_Phase6_Integration.ex5
          if-no-files-found: error
          retention-days: 14
