name: Build King's Bot

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build King's Bot
    runs-on: windows-latest
    timeout-minutes: 12

    steps:
      - name: Checkout King's Bot
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install and locate MetaTrader 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========================================"
          Write-Host "       PREPARING METATRADER 5"
          Write-Host "========================================"

          function Find-MetaEditor {
            $known = @(
              "C:\Program Files\MetaTrader 5\metaeditor64.exe",
              "C:\Program Files (x86)\MetaTrader 5\metaeditor64.exe"
            )

            foreach ($path in $known) {
              if (Test-Path $path) {
                return (Get-Item $path).FullName
              }
            }

            foreach ($root in @(
              "C:\Program Files",
              "C:\Program Files (x86)"
            )) {
              if (-not (Test-Path $root)) {
                continue
              }

              $found = Get-ChildItem `
                -Path $root `
                -Recurse `
                -File `
                -Filter "metaeditor64.exe" `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

              if ($found) {
                return $found.FullName
              }
            }

            return $null
          }

          $metaEditor = Find-MetaEditor

          if (-not $metaEditor) {
            $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"

            Write-Host "MetaEditor not found."
            Write-Host "Downloading official MetaTrader 5 installer..."

            Invoke-WebRequest `
              -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" `
              -OutFile $installer `
              -UseBasicParsing

            if (-not (Test-Path $installer)) {
              throw "MetaTrader 5 installer download failed."
            }

            Write-Host "Starting MT5 installer."
            Write-Host "Hard timeout: 180 seconds."

            $installerProcess = Start-Process `
              -FilePath $installer `
              -ArgumentList "/auto" `
              -PassThru

            $finished = $installerProcess.WaitForExit(180000)

            if (-not $finished) {
              Write-Host "Installer exceeded 180 seconds."
              Write-Host "Stopping installer instead of hanging the workflow."

              try {
                Stop-Process `
                  -Id $installerProcess.Id `
                  -Force `
                  -ErrorAction SilentlyContinue
              } catch {}

              throw "MetaTrader 5 installer timed out after 180 seconds."
            }

            Write-Host "Installer exit code: $($installerProcess.ExitCode)"
          }

          Write-Host "Waiting for MetaEditor..."

          for ($i = 1; $i -le 60; $i++) {
            $metaEditor = Find-MetaEditor

            if ($metaEditor) {
              break
            }

            Start-Sleep -Seconds 2
          }

          if (-not $metaEditor) {
            Write-Host "MetaEditor64.exe was not found."

            Get-ChildItem `
              -Path "C:\Program Files" `
              -Recurse `
              -File `
              -Filter "metaeditor*.exe" `
              -ErrorAction SilentlyContinue |
              Select-Object -First 20 -ExpandProperty FullName

            throw "MetaEditor64.exe is unavailable on the runner."
          }

          Write-Host ""
          Write-Host "MetaEditor FOUND:"
          Write-Host "  $metaEditor"

          "KINGSBOT_METAEDITOR=$metaEditor" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8

      - name: Prepare King's Bot source tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========================================"
          Write-Host "       PREPARING KING'S BOT SOURCE"
          Write-Host "========================================"

          $repoRoot = $env:GITHUB_WORKSPACE
          $buildRoot = Join-Path $env:RUNNER_TEMP "KingsBotBuild"
          $sourceRoot = Join-Path $buildRoot "MQL5"
          $expertRoot = Join-Path $sourceRoot "Experts\KingsBot"
          $includeRoot = Join-Path $sourceRoot "Include"

          if (Test-Path $buildRoot) {
            Remove-Item `
              -Path $buildRoot `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $expertRoot `
            -Force |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Path $includeRoot `
            -Force |
            Out-Null

          $mainCandidates = @(
            Get-ChildItem `
              -Path $repoRoot `
              -Recurse `
              -File `
              -Filter "KingsBot_Phase6_Integration.mq5" `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.FullName -notmatch '\\.git\\' -and
                $_.FullName -notmatch '\\artifact\\'
              }
          )

          if ($mainCandidates.Count -eq 0) {
            throw "KingsBot_Phase6_Integration.mq5 was not found."
          }

          $sourceMain = $mainCandidates[0].FullName
          $sourceDir = $mainCandidates[0].Directory.FullName

          Write-Host "Repository source:"
          Write-Host "  $sourceMain"

          Copy-Item `
            -Path (Join-Path $sourceDir "*") `
            -Destination $expertRoot `
            -Recurse `
            -Force

          $includeDirs = @(
            Get-ChildItem `
              -Path $repoRoot `
              -Recurse `
              -Directory `
              -Filter "Include" `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.FullName -notmatch '\\.git\\' -and
                $_.FullName -notmatch '\\artifact\\'
              }
          )

          foreach ($include
