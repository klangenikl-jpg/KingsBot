name: KingsBot Phase 7 Runtime and Strategy Tester

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase7:
    name: T5 Runtime and Strategy Tester
    runs-on: windows-2025
    timeout-minutes: 40

    env:
      MT5_DIR: C:\MT5
      BOT_SOURCE_NAME: KingsBot_Phase6_Integration.mq5
      TEST_SYMBOL: EURUSD
      TEST_PERIOD: M15
      TEST_FROM: "2025.01.01"
      TEST_TO: "2026.08.01"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate King's Bot source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter $env:BOT_SOURCE_NAME `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $source) {
            throw "Could not find $env:BOT_SOURCE_NAME"
          }

          Write-Host "Source: $($source.FullName)"

          "BOT_SOURCE=$($source.FullName)" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare evidence directory
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $evidence = Join-Path `
            $env:GITHUB_WORKSPACE `
            'phase7-evidence'

          New-Item `
            -ItemType Directory `
            -Path $evidence `
            -Force |
            Out-Null

          $testerEvidence = Join-Path `
            $evidence `
            'Tester'

          $logsEvidence = Join-Path `
            $evidence `
            'MT5-Logs'

          New-Item `
            -ItemType Directory `
            -Path $testerEvidence `
            -Force |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Path $logsEvidence `
            -Force |
            Out-Null

          "EVIDENCE_DIR=$evidence" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Evidence directory: $evidence"

      - name: Download MetaTrader 5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path `
            $env:RUNNER_TEMP `
            'mt5setup.exe'

          $url = 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe'

          $downloaded = $false

          for ($attempt = 1; $attempt -le 5; $attempt++) {

            Write-Host "MT5 download attempt $attempt of 5"

            try {

              Invoke-WebRequest `
                -Uri $url `
                -OutFile $installer `
                -UseBasicParsing `
                -TimeoutSec 120

              if (Test-Path -LiteralPath $installer) {

                $size = (Get-Item -LiteralPath $installer).Length

                Write-Host "Installer size: $size bytes"

                if ($size -gt 1000000) {
                  $downloaded = $true
                  break
                }
              }
            }
            catch {

              Write-Host "Download attempt failed:"
              Write-Host $_.Exception.Message
            }

            if ($attempt -lt 5) {
              Start-Sleep -Seconds 10
            }
          }

          if (-not $downloaded) {
            throw 'Unable to download MetaTrader 5 installer.'
          }

          "MT5_INSTALLER=$installer" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install MetaTrader 5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host 'Installing MetaTrader 5...'
          Write-Host "Target: $env:MT5_DIR"

          Remove-Item `
            -Path $env:MT5_DIR `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Path $env:MT5_DIR `
            -Force |
            Out-Null

          $arguments = "/auto /path:$env:MT5_DIR"

          $process = Start-Process `
            -FilePath $env:MT5_INSTALLER `
            -ArgumentList $arguments `
            -Wait `
            -PassThru `
            -NoNewWindow

          Write-Host "Installer exit code: $($process.ExitCode)"

          "MT5_INSTALLER_EXIT_CODE=$($process.ExitCode)" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          $terminal = Join-Path `
            $env:MT5_DIR `
            'terminal64.exe'

          $editor = Join-Path `
            $env:MT5_DIR `
            'metaeditor64.exe'

          if (-not (Test-Path -LiteralPath $terminal)) {

            $found = Get-ChildItem `
              -Path $env:MT5_DIR `
              -Filter 'terminal64.exe' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if ($null -ne $found) {
              $terminal = $found.FullName
            }
          }

