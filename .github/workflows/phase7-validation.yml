name: King's Bot - Phase 7 Runtime Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  phase7-runtime-validation:
    name: Phase 7 Runtime and Strategy Tester Validation
    runs-on: windows-latest
    timeout-minutes: 45

    steps:

      - name: Checkout King's Bot
        uses: actions/checkout@v4

      - name: Install MT5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          $installRoot = Join-Path $env:RUNNER_TEMP 'KingsBot-MT5'

          Invoke-WebRequest `
            -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' `
            -OutFile $installer `
            -UseBasicParsing

          Remove-Item $installRoot -Recurse -Force -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Path $installRoot `
            -Force |
            Out-Null

          $installerProcess = Start-Process `
            -FilePath $installer `
            -ArgumentList @(
              '/auto',
              "/path:$installRoot"
            ) `
            -Wait `
            -PassThru

          if ($installerProcess.ExitCode -ne 0) {
            throw "MT5 installer failed with exit code $($installerProcess.ExitCode)."
          }

          $terminal = Get-ChildItem `
            $installRoot `
            -Recurse `
            -File `
            -Filter 'terminal64.exe' `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          $metaEditor = Get-ChildItem `
            $installRoot `
            -Recurse `
            -File `
            -Filter 'metaeditor64.exe' `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $terminal) {
            throw 'terminal64.exe was not found.'
          }

          if (-not $metaEditor) {
            throw 'metaeditor64.exe was not found.'
          }

          $mt5Root = $terminal.Directory.FullName

          "MT5_ROOT=$mt5Root" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "MT5_TERMINAL=$($terminal.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "METAEDITOR=$($metaEditor.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "MT5_ROOT=$mt5Root"
          Write-Host "MT5_TERMINAL=$($terminal.FullName)"
          Write-Host "METAEDITOR=$($metaEditor.FullName)"

      - name: Prepare evidence directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          New-Item `
            -ItemType Directory `
            -Path "$env:GITHUB_WORKSPACE\phase7-validation-evidence" `
            -Force |
            Out-Null

      - name: Locate King's Bot source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Get-ChildItem `
            $env:GITHUB_WORKSPACE `
            -Recurse `
            -File `
            -Filter 'KingsBot_Phase6_Integration.mq5' `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FullName -notmatch '\\.git\\'
            } |
            Select-Object -First 1

          if (-not $source) {
            throw 'KingsBot_Phase6_Integration.mq5 was not found.'
          }

          "KINGSBOT_SOURCE=$($source.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Source: $($source.FullName)"

      - name: Prepare King's Bot source tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Get-Item $env:KINGSBOT_SOURCE
          $target = Join-Path $env:MT5_ROOT 'MQL5\Experts\KingsBot'

          New-Item `
            -ItemType Directory `
            -Path $target `
            -Force |
            Out-Null

          Get-ChildItem `
            $source.Directory.FullName `
            -Recurse `
            -File |
            Where-Object {
              $_.FullName -notmatch '\\.git\\'
            } |
            ForEach-Object {

              $relative = $_.FullName.Substring(
                $source.Directory.FullName.Length
              ).TrimStart('\')

              $destination = Join-Path $target $relative

              New-Item `
                -ItemType Directory `
                -Path (Split-Path $destination -Parent) `
                -Force |
                Out-Null

              Copy-Item `
                $_.FullName `
                $destination `
                -Force
            }

          Write-Host "Prepared: $target"

      - name: Compile King's Bot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $mq5 = Join-Path `
            $env:MT5_ROOT `
            'MQL5\Experts\KingsBot\KingsBot_Phase6_Integration.mq5'

          $ex5 = Join-Path `
            $env:MT5_ROOT `
            'MQL5\Experts\KingsBot\KingsBot_Phase6_Integration.ex5'

          if (-not (Test-Path $mq5)) {
            throw "MQ5 not found: $mq5"
          }

          Remove-Item `
            $ex5 `
            -Force `
            -ErrorAction SilentlyContinue

          $compile = Start-Process `
            -FilePath $env:METAEDITOR `
            -ArgumentList @(
              "/compile:$mq5",
              '/log'
            ) `
            -WorkingDirectory (Split-Path $mq5 -Parent) `
            -Wait `
            -PassThru

          Start-Sleep -Seconds 2

          Write-Host "MetaEditor exit code: $($compile.ExitCode)"

          if (-not (Test-Path $ex5)) {
            throw 'KingsBot_Phase6_Integration.ex5 was not produced.'
          }

          if ((Get-Item $ex5).Length -le 0) {
            throw 'KingsBot_Phase6_Integration.ex5 is empty.'
          }

          Copy-Item `
            $ex5 `
            "$env:GITHUB_WORKSPACE\phase7-validation-evidence\KingsBot_Phase6_Integration.ex5" `
            -Force

          Write-Host "EX5 verified: $ex5"

      - name: Initialize MT5 portable data directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $process = Start-Process `
            -FilePath $env:MT5_TERMINAL `
            -ArgumentList '/portable' `
            -WorkingDirectory $env:MT5_ROOT `
            -PassThru

          Write-Host "Initialization PID: $($process.Id)"

          Start-Sleep -Seconds 20

          if (-not $process.HasExited) {
            Stop-Process `
              -Id $process.Id `
              -Force `
              -ErrorAction SilentlyContinue
          }

          Start-Sleep -Seconds 3

      -
