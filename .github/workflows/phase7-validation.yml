name: KingsBot Phase 7 Artifact Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase7:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $evidence = Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence'

          New-Item -ItemType Directory -Path $evidence -Force | Out-Null

          Set-Content `
            -LiteralPath (Join-Path $evidence 'phase7.txt') `
            -Value "Phase 7 evidence created: $(Get-Date -Format o)" `
            -Encoding utf8

          Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Select-Object -First 100 FullName |
            Out-File `
              -FilePath (Join-Path $evidence 'repository-files.txt') `
              -Encoding utf8

      - name: Find KingsBot source
        shell: pwsh
        continue-on-error: true
        run: |
          $source = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Recurse `
            -File `
            -Filter 'KingsBot_Phase6_Integration.mq5' `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -ne $source) {
            Copy-Item `
              -LiteralPath $source.FullName `
              -Destination (Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence') `
              -Force

            Set-Content `
              -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence/source-location.txt') `
              -Value $source.FullName `
              -Encoding utf8
          }
          else {
            Set-Content `
              -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence/source-location.txt') `
              -Value 'KingsBot_Phase6_Integration.mq5 was not found.' `
              -Encoding utf8
          }

      - name: Collect diagnostics
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $evidence = Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence'

          Set-Content `
            -LiteralPath (Join-Path $evidence 'runner.txt') `
            -Value @(
              "Runner: $env:RUNNER_OS"
              "Workspace: $env:GITHUB_WORKSPACE"
              "Run ID: $env:GITHUB_RUN_ID"
              "Commit: $env:GITHUB_SHA"
              "Time: $(Get-Date -Format o)"
            ) `
            -Encoding utf8

      - name: Upload Phase 7 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-Phase7-Evidence
          path: ${{ github.workspace }}/phase7-evidence
          if-no-files-found: error
          retention-days: 14

      - name: Phase 7 complete
        shell: pwsh
        run: |
          Write-Host 'Phase 7 artifact pipeline completed.'
