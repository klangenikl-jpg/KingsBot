name: King's Bot - Phase 7 Runtime Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase7-runtime-validation:
    name: Phase 7 Runtime and Strategy Tester Validation
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout King's Bot
        uses: actions/checkout@v4

      - name: Initialize Phase 7 evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $Evidence = Join-Path $env:GITHUB_WORKSPACE 'phase7-artifacts'
          New-Item -ItemType Directory -Path $Evidence -Force | Out-Null

          Set-Content `
            -Path (Join-Path $Evidence 'PHASE7_STARTED.txt') `
            -Value "Phase 7 started: $(Get-Date -Format o)" `
            -Encoding UTF8

          "PHASE7_EVIDENCE=$Evidence" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify King's Bot source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $Source = Get-ChildItem `
            $env:GITHUB_WORKSPACE `
            -Recurse `
            -File `
            -Filter 'KingsBot_Phase6_Integration.mq5' `
            -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '\\.git\\' } |
            Select-Object -First 1

          if (-not $Source) {
            throw 'KingsBot_Phase6_Integration.mq5 was not found.'
          }

          Copy-Item `
            $Source.FullName `
            (Join-Path $env:PHASE7_EVIDENCE 'KingsBot_Phase6_Integration.mq5') `
            -Force

          "Source=$($Source.FullName)" |
            Out-File `
              (Join-Path $env:PHASE7_EVIDENCE 'source-result.txt') `
              -Encoding utf8

      - name: Verify MetaQuotes network
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $Connection = Test-NetConnection `
            -ComputerName 'download.mql5.com' `
            -Port 443 `
            -WarningAction SilentlyContinue

          $Connection |
            Format-List |
            Out-File `
              (Join-Path $env:PHASE7_EVIDENCE 'network-test.txt') `
              -Encoding utf8

          if (-not $Connection.TcpTestSucceeded) {
            throw 'HTTPS connectivity to download.mql5.com failed.'
          }

      - name: Download MT5 installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $Installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'

          $Url = 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe'

          Invoke-WebRequest `
            -Uri $Url `
            -OutFile $Installer `
            -UseBasicParsing `
            -TimeoutSec 180

          if (-not (Test-Path $Installer)) {
            throw 'MT5 installer was not downloaded.'
          }

          $File = Get-Item $Installer
          $Hash = Get-FileHash $Installer -Algorithm SHA256
          $Signature = Get-AuthenticodeSignature $Installer

          @(
            "URL=$Url"
            "Path=$Installer"
            "SizeBytes=$($File.Length)"
            "SHA256=$($Hash.Hash)"
            "SignatureStatus=$($Signature.Status)"
          ) |
            Out-File `
              (Join-Path $env:PHASE7_EVIDENCE 'mt5-installer.txt') `
              -Encoding utf8

          if ($File.Length -lt 100000) {
            throw "MT5 installer is unexpectedly small: $($File.Length) bytes."
          }

          if ($Signature.Status -ne 'Valid') {
            throw "MT5 installer signature is not valid: $($Signature.Status)"
          }

      - name: Install MT5
        id: install_mt5
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          # Deliberately use the known runner path.
          # Do not depend on GITHUB_ENV for the installer path.
          $Installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'

          $InstallRoot = Join-Path $env:RUNNER_TEMP 'KingsBot-MT5'

          $ResultFile = Join-Path `
            $env:PHASE7_EVIDENCE `
            'mt5-install-result.txt'

         
