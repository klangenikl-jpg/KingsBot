name: King's Bot - Phase 7 Runtime Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase7:
    name: Phase 7 Runtime and Strategy Tester
    runs-on: windows-2025
    timeout-minutes: 30

    env:
      MT5_DIR: C:\MT5
      BOT_SOURCE_NAME: KingsBot_Phase6_Integration.mq5
      EX5_NAME: KingsBot_Phase6_Integration.ex5

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Initialize evidence
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $evidence = "$env:GITHUB_WORKSPACE\phase7-evidence"

          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          New-Item -ItemType Directory -Path "$evidence\MT5-Logs" -Force | Out-Null
          New-Item -ItemType Directory -Path "$evidence\Tester-Logs" -Force | Out-Null

          Set-Content `
            -LiteralPath "$evidence\00-workflow-started.txt" `
            -Value "Phase 7 workflow started."

      - name: Validate MT5 credentials
        shell: powershell
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:MT5_LOGIN)) {
            throw 'MT5_LOGIN GitHub secret is missing.'
          }

          if ($env:MT5_LOGIN -notmatch '^[0-9]+$') {
            throw 'MT5_LOGIN must contain only the numeric account login.'
          }

          if ([string]::IsNullOrWhiteSpace($env:MT5_SERVER)) {
            throw 'MT5_SERVER GitHub secret is missing.'
          }

          if ([string]::IsNullOrWhiteSpace($env:MT5_PASSWORD)) {
            throw 'MT5_PASSWORD GitHub secret is missing.'
          }

          Write-Host "MT5 login supplied: $env:MT5_LOGIN"
          Write-Host "MT5 server supplied: $env:MT5_SERVER"
          Write-Host "MT5 password supplied: YES"

          Set-Content `
            -LiteralPath "$env:GITHUB_WORKSPACE\phase7-evidence\01-credentials-validated.txt" `
            -Value "Login supplied: YES`nServer supplied: YES`nPassword supplied: YES"

      - name: Locate King Bot source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter $env:BOT_SOURCE_NAME `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $source) {
            throw "Source file not found: $env:BOT_SOURCE_NAME"
          }

          Write-Host "SOURCE: $($source.FullName)"

          "BOT_SOURCE=$($source.FullName)" |
            Out-File "$env:GITHUB_ENV" -Encoding utf8

          Set-Content `
            -LiteralPath "$env:GITHUB_WORKSPACE\phase7-evidence\02-source-found.txt" `
            -Value $source.FullName

      - name: Download MT5 installer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = "$env:RUNNER_TEMP\mt5setup.exe"

          Invoke-WebRequest `
            -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' `
            -OutFile $installer `
            -UseBasicParsing

          if (-not (Test-Path -LiteralPath $installer)) {
            throw 'MT5 installer was not downloaded.'
          }

          $size = (Get-Item -LiteralPath $installer).Length

          if ($size -lt 100000) {
            throw 'MT5 installer is unexpectedly small.'
          }

          Write-Host "Installer size: $size bytes"

          "MT5_INSTALLER=$installer" |
            Out-File "$env:GITHUB_ENV" -Encoding utf8

      - name: Install MT5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $mt5 = $env:MT5_DIR
          $installer = $env:MT5_INSTALLER

          if (Test-Path -LiteralPath $mt5) {
            Remove-Item -LiteralPath $mt5 -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $mt5 `
            -Force |
            Out-Null

          Write-Host '========== INSTALLING MT5 =========='

          $p = Start-Process `
            -FilePath $installer `
            -ArgumentList '/auto', "/path:$mt5" `
            -Wait `
            -PassThru

          Write-Host "Installer exit code: $($p.ExitCode)"

          Start-Sleep -Seconds 10

          $terminal = Get-ChildItem `
            -Path $mt5 `
            -Filter 'terminal64.exe' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          $editor = Get-ChildItem `
            -Path $mt5 `
            -Filter 'metaeditor64.exe' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $terminal) {
            throw 'terminal64.exe was not found.'
          }

          if ($null -eq $editor) {
            throw 'metaeditor64.exe was not found.'
          }

          Write-Host "TERMINAL: $($terminal.FullName)"
          Write-Host "METAEDITOR: $($editor.FullName)"

          Set-Content `
            -LiteralPath "$env:GITHUB_WORKSPACE\phase7-evidence\03-mt5-verified.txt" `
            -Value "Terminal: $($terminal.FullName)`nMetaEditor: $($editor.FullName)"

      - name: Prepare King Bot
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $destination = "$env:MT5_DIR\MQL5\Experts\KingsBot"

          New-Item `
            -ItemType Directory `
            -Path $destination `
            -Force |
            Out-Null

          $sourceRoot = Split-Path -Path $env:BOT_SOURCE -Parent

          Copy-Item `
            -Path "$sourceRoot\*" `
            -Destination $destination `
            -Recurse `
            -Force

          $expert = "$destination\$env:BOT_SOURCE_NAME"

          if (-not (Test-Path -LiteralPath $expert)) {
            throw "Prepared source not found: $expert"
          }

          Write-Host "EXPERT: $expert"

      - name: Compile King Bot
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'

          $editor = Get-ChildItem `
            -Path $env:MT5_DIR `
            -Filter 'metaeditor64.exe' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $editor) {
            throw 'metaeditor64.exe was not found.'
          }

          $expert = "$env:MT5_DIR\MQL5\Experts\KingsBot\$env:BOT_SOURCE_NAME"
          $log = "$env:RUNNER_TEMP\KingsBot-compile.log"

          Write-Host '========== COMPILING KING BOT =========='

          $p = Start-Process `
            -FilePath $editor.FullName `
            -ArgumentList '/portable', "/compile:$expert", "/log:$log" `
            -WorkingDirectory $env:MT5_DIR `
            -Wait `
            -PassThru

          Write-Host "MetaEditor exit code: $($p.ExitCode)"

          if (Test-Path -LiteralPath $log) {
            Copy-Item `
              -LiteralPath $log `
              -Destination "$env:GITHUB_WORKSPACE\phase7-evidence\compile.log" `
              -Force

            Get-Content -
