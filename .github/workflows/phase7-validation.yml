name: King's Bot - Phase 7 Runtime Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase7:
    name: Phase 7 Runtime and Strategy Tester
    runs-on: windows-2025
    timeout-minutes: 30

    env:
      MT5_DIR: C:\MT5
      BOT_SOURCE_NAME: KingsBot_Phase6_Integration.mq5
      EX5_NAME: KingsBot_Phase6_Integration.ex5
      MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
      MT5_SERVER: ${{ secrets.MT5_SERVER }}
      MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Prepare evidence
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path "$env:GITHUB_WORKSPACE\phase7-evidence\MT5-Logs" -Force | Out-Null
          New-Item -ItemType Directory -Path "$env:GITHUB_WORKSPACE\phase7-evidence\Tester-Logs" -Force | Out-Null

      - name: Locate MT5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $terminal = Get-ChildItem -Path "$env:MT5_DIR" -Filter 'terminal64.exe' -File -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1

          $editor = Get-ChildItem -Path "$env:MT5_DIR" -Filter 'metaeditor64.exe' -File -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $terminal) {
            throw "terminal64.exe not found under $env:MT5_DIR"
          }

          if ($null -eq $editor) {
            throw "metaeditor64.exe not found under $env:MT5_DIR"
          }

          "MT5_TERMINAL=$($terminal.FullName)" | Out-File "$env:GITHUB_ENV" -Encoding utf8
          "MT5_EDITOR=$($editor.FullName)" | Out-File "$env:GITHUB_ENV" -Encoding utf8

          Write-Host "MT5 TERMINAL: $($terminal.FullName)"
          Write-Host "MT5 EDITOR: $($editor.FullName)"

      - name: Locate EA source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Get-ChildItem -Path "$env:GITHUB_WORKSPACE" -Filter "$env:BOT_SOURCE_NAME" -File -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $source) {
            throw "SOURCE NOT FOUND: $env:BOT_SOURCE_NAME"
          }

          "BOT_SOURCE=$($source.FullName)" | Out-File "$env:GITHUB_ENV" -Encoding utf8
          Write-Host "SOURCE: $($source.FullName)"

      - name: Prepare EA
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $expertDir = "$env:MT5_DIR\MQL5\Experts\KingsBot"
          New-Item -ItemType Directory -Path $expertDir -Force | Out-Null

          Copy-Item -Path "$(Split-Path $env:BOT_SOURCE -Parent)\*" -Destination $expertDir -Recurse -Force

          $expertSource = "$expertDir\$env:BOT_SOURCE_NAME"

          if (-not (Test-Path -LiteralPath $expertSource)) {
            throw "EA source was not copied to $expertSource"
          }

          Write-Host "EA SOURCE: $expertSource"

      - name: Compile EA
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $source = "$env:MT5_DIR\MQL5\Experts\KingsBot\$env:BOT_SOURCE_NAME"
          $log = "$env:GITHUB_WORKSPACE\phase7-evidence\compile.log"

          & "$env:MT5_EDITOR" /portable /compile:"$source" /log:"$log"
          $exitCode = $LASTEXITCODE

          Write-Host "MetaEditor exit code: $exitCode"

          if (Test-Path -LiteralPath $log) {
            Get-Content -LiteralPath $log
          }

          if ($exitCode -ne 0) {
            throw "MetaEditor compilation failed with exit code $exitCode"
          }

      - name: Verify EX5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $finalEx5 = "$env:MT5_DIR\MQL5\Experts\KingsBot\$env:EX5_NAME"

          $found = Get-ChildItem -Path "$env:MT5_DIR" -Filter "$env:EX5_NAME" -File -Recurse -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if ($null -eq $found) {
            throw "EX5 NOT FOUND: $env:EX5_NAME"
          }

          Write-Host "FOUND EX5: $($found.FullName)"
          Write-Host "SIZE: $($found.Length) bytes"

          if ([System.IO.Path]::GetFullPath($found.FullName) -ne [System.IO.Path]::GetFullPath($finalEx5)) {
            Copy-Item -LiteralPath $found.FullName -Destination $finalEx5 -Force
          }

          if (-not (Test-Path -LiteralPath $finalEx5)) {
            throw "Final EX5 not found: $finalEx5"
          }

      - name: Create tester configuration
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:MT5_LOGIN)) {
            throw 'MT5_LOGIN secret is missing.'
          }

          if ([string]::IsNullOrWhiteSpace($env:MT5_SERVER)) {
            throw 'MT5_SERVER secret is missing.'
          }

          if ([string]::IsNullOrWhiteSpace($env:MT5_PASSWORD)) {
            throw 'MT5_PASSWORD secret is missing.'
          }

          if ($env:MT5_LOGIN -notmatch '^[0-9]+$') {
            throw 'MT5_LOGIN must contain only the numeric MT5 account number.'
          }

          $config = "$env:MT5_DIR\KingsBot_Phase7_Tester.ini"

          $lines = @(
            '[Common]'
            "Login=$env:MT5_LOGIN"
            "Server=$env:MT5_SERVER"
            "Password=$env:MT5_PASSWORD"
            'KeepPrivate=1'
            'NewsEnable=0'
            ''
            '[Experts]'
            'AllowLiveTrading=0'
            'Enabled=1'
            ''
            '[Tester]'
            'Expert=KingsBot\KingsBot_Phase6_Integration.ex5'
            'Symbol=EURUSD'
            'Period=M15'
            "Login=$env:MT5_LOGIN"
            'Model=0'
            'Optimization=0'
            'FromDate=2025.01.01'
            'ToDate=2026.08.01'
            'ForwardMode=0'
            'Deposit=10000'
            'Currency=USD'
            'Leverage=1:100'
            'ExecutionMode=0'
            'Report=KingsBot_Phase7_Tester'
            'ReplaceReport=1'
            'ShutdownTerminal=1'
            'Visual=0'
            'UseCloud=0'
          )

          $lines | Set-Content -LiteralPath $config -Encoding ASCII

          Copy-Item `
            -LiteralPath $config `
            -Destination "$env:GITHUB_WORKSPACE\phase7-evidence\KingsBot_Phase7_Tester.ini" `
            -Force

          Write-Host '========== TESTER CONFIGURATION =========='
          Get-
