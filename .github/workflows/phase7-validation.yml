name: KingsBot Phase 7 Runtime Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase7:
    name: Phase 7 MT5 Runtime Validation
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create evidence directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path "$env:GITHUB_WORKSPACE\phase7-evidence" -Force | Out-Null

      - name: Verify source files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $source = "$env:GITHUB_WORKSPACE\KingsBot_Phase6_Integration.mq5"

          if (!(Test-Path -LiteralPath $source)) {
            throw "Missing source: $source"
          }

          $required = @(
            'KB_StrategySignal.mqh'
            'KingsBot_Strategy_Swing.mqh'
            'KingsBot_Strategy_Structure.mqh'
            'KingsBot_Strategy_Liquidity.mqh'
            'KingsBot_Strategy_OrderBlock.mqh'
            'KingsBot_Strategy_FVG.mqh'
            'KingsBot_DecisionEngine.mqh'
            'KingsBot_RiskManager.mqh'
          )

          foreach ($name in $required) {
            $path = "$env:GITHUB_WORKSPACE\$name"

            if (!(Test-Path -LiteralPath $path)) {
              throw "Missing required include: $name"
            }
          }

          Copy-Item $source "$env:GITHUB_WORKSPACE\phase7-evidence\" -Force

          Get-ChildItem "$env:GITHUB_WORKSPACE" -Filter "*.mqh" -File |
            Copy-Item -Destination "$env:GITHUB_WORKSPACE\phase7-evidence\" -Force

      - name: Download MT5 installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = "$env:RUNNER_TEMP\mt5setup.exe"

          Invoke-WebRequest `
            -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" `
            -OutFile $installer `
            -UseBasicParsing

          if (!(Test-Path -LiteralPath $installer)) {
            throw "MT5 installer download failed."
          }

          Write-Host "Installer size: $((Get-Item $installer).Length) bytes"

          "INSTALLER=$installer" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install MT5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $p = Start-Process `
            -FilePath $env:INSTALLER `
            -ArgumentList "/auto" `
            -Wait `
            -PassThru

          Write-Host "MT5 installer exit code: $($p.ExitCode)"

          "MT5 installer exit code: $($p.ExitCode)" |
            Set-Content "$env:GITHUB_WORKSPACE\phase7-evidence\installer.txt"

          Start-Sleep -Seconds 5

      - name: Locate MetaEditor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $roots = @(
            "C:\Program Files"
            "C:\Program Files (x86)"
            "C:\MT5"
            $env:LOCALAPPDATA
            $env:APPDATA
            $env:RUNNER_TEMP
          )

          $editor = $null
          $terminal = $null

          foreach ($root in $roots) {
            if (!(Test-Path -LiteralPath $root)) {
              continue
            }

            if ($null -eq $editor) {
              $editor = Get-ChildItem `
                -LiteralPath $root `
                -Filter "metaeditor64.exe" `
                -File `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1
            }

            if ($null -eq $terminal) {
              $terminal = Get-ChildItem `
                -LiteralPath $root `
                -Filter "terminal64.exe" `
                -File `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1
            }

            if ($null -ne $editor -and $null -ne $terminal) {
              break
            }
          }

          if ($null -eq $editor) {
            throw "metaeditor64.exe not found."
          }

          if ($null -eq $terminal) {
            throw "terminal64.exe not found."
          }

          Write-Host "MetaEditor: $($editor.FullName)"
          Write-Host "Terminal: $($terminal.FullName)"

          "METAEDITOR=$($editor.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "MT5_TERMINAL=$($terminal.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "MT5_ROOT=$($terminal.Directory.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Prepare MT5 source tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $experts = "$env:MT5_ROOT\MQL5\Experts\KingsBot"

          New-Item -ItemType Directory -Path $experts -Force | Out-Null

          Copy-Item `
            "$env:GITHUB_WORKSPACE\KingsBot_Phase6_Integration.mq5" `
            "$experts\KingsBot_Phase6_Integration.mq5" `
            -Force

          Get-ChildItem "$env:GITHUB_WORKSPACE" -Filter "*.mqh" -File |
            ForEach-Object {
              Copy-Item $_.FullName "$experts\" -Force
            }

          if (!(Test-Path "$experts\KingsBot_Phase6_Integration.mq5")) {
            throw "Prepared MQ5 source is missing."
          }

          "EXPERT=$experts\KingsBot_Phase6_Integration.mq5" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "EXPERTS=$experts" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Compile with MetaEditor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $log = "$env:GITHUB_WORKSPACE\phase7-evidence\metaeditor.log"
          $source = $env:EXPERT

          Write-Host "Compiling:"
          Write-Host $source
          Write-Host "Using:"
          Write-Host $env:METAEDITOR

          $arguments = "/compile:`"$source`" /log"

          $p = Start-Process `
            -FilePath $env:METAEDITOR `
            -ArgumentList $arguments `
            -WorkingDirectory $env:EXPERTS `
            -Wait `
            -PassThru

          Write-Host "MetaEditor exit code: $($p.ExitCode)"

          Start-Sleep -Seconds 5

          Get-ChildItem `
            -Path $env:MT5_ROOT `
            -Recurse `
            -File `
            -Filter "*.log" `
            -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 20 |
            ForEach-Object {
              Copy-Item $_.FullName $log -Force -ErrorAction SilentlyContinue
            }

          $candidates = Get-ChildItem `
            -Path $env:MT5_ROOT,$env:RUNNER_TEMP,$env:GITHUB_WORKSPACE `
            -Recurse `
            -File `
            -Filter "KingsBot_Phase6_Integration.ex5" `
            -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending

          if ($candidates.Count -eq 0) {
            Write-Host "No EX5 found."

            @(
              "MetaEditor exit code: $($p.ExitCode)"
              "Source: $source"
              "Search roots:"
              $env:MT5_ROOT
              $env:RUNNER_TEMP
              $env:GITHUB_WORKSPACE
            ) |
              Set-Content "$env:GITHUB_WORKSPACE\phase7-evidence\compile-result.txt"

            throw "MetaEditor returned $($p.ExitCode), but no KingsBot_Phase6_Integration.ex5 was found."
          }

          $ex5 = $candidates[0].FullName

          Write-Host "EX5 FOUND:"
          Write-Host $ex5

          Copy-Item `
            $ex5 `
            "$env:GITHUB_WORKSPACE\phase7-evidence\KingsBot_Phase6_Integration.ex5" `
            -Force

          "EX5=$ex5" |
            Set-Content "$env:GITHUB_WORKSPACE\phase7-evidence\compile-result.txt"

      - name: Verify MT5 credentials
        shell: pwsh
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:MT5_LOGIN)) {
            throw "MT5_LOGIN secret is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:MT5_PASSWORD)) {
            throw "MT5_PASSWORD secret is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:MT5_SERVER)) {
            throw "MT5_SERVER secret is missing."
          }

      - name: Create Strategy Tester configuration
        shell: pwsh
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
        run: |
          $ErrorActionPreference = 'Stop'

          $config = "$env:MT5_ROOT\KingsBot_Phase7_Tester.ini"

          @(
            "[Common]"
            "Login=$env:MT5_LOGIN"
            "Password=$env:MT5_PASSWORD"
            "Server=$env:MT5_SERVER"
            "KeepPrivate=1"
            "NewsEnable=0"
            ""
            "[Tester]"
            "Expert=KingsBot\KingsBot_Phase6_Integration.ex5"
            "Symbol=EURUSD"
            "Period=M15"
            "Model=4"
            "Optimization=0"
            "FromDate=2025.01.01"
            "ToDate=2026.08.01"
            "Deposit=10000"
            "Currency=USD"
            "Leverage=1:100"
            "Visual=0"
            "Report=KingsBot_Phase7_Tester.htm"
            "ReplaceReport=1"
            "ShutdownTerminal=1"
          ) |
            Set-Content $config -Encoding Unicode

          Copy-Item `
            $config `
            "$env:GITHUB_WORKSPACE\phase7-evidence\" `
            -Force

          "TESTER_CONFIG=$config" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run Strategy Tester
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $report = "$env:MT5_ROOT\KingsBot_Phase7_Tester.htm"

          Remove-Item $report -Force -ErrorAction SilentlyContinue

          $p = Start-Process `
            -FilePath $env:MT5_TERMINAL `
            -ArgumentList "/portable","/config:$env:TESTER_CONFIG" `
            -WorkingDirectory $env:MT5_ROOT `
            -PassThru

          Write-Host "MT5 PID: $($p.Id)"

          $deadline = (Get-Date).AddMinutes(20)

          while ((Get-Date) -lt $deadline) {
            if (Test-Path $report) {
              break
            }

            Start-Sleep -Seconds 10
          }

          if (!(Test-Path $report)) {
            throw "NO TESTER REPORT FOUND."
          }

          if ((Get-Item $report).Length -le 0) {
            throw "Strategy Tester report is empty."
          }

          Copy-Item `
            $report `
            "$env:GITHUB_WORKSPACE\phase7-evidence\" `
            -Force

      - name: Collect diagnostics
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $evidence = "$env:GITHUB_WORKSPACE\phase7-evidence"

          if ($env:MT5_ROOT -and (Test-Path $env:MT5_ROOT)) {
            Get-ChildItem `
              $env:MT5_ROOT `
              -Recurse `
              -File `
              -Include "*.log","*.ini","*.htm","*.html" `
              -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 100 |
              ForEach-Object {
                Copy-Item `
                  $_.FullName `
                  $evidence `
                  -Force `
                  -ErrorAction SilentlyContinue
              }
          }

          Get-Process terminal64 -ErrorAction SilentlyContinue |
            Select-Object Id,CPU,StartTime,Path |
            Out-File "$evidence\terminal-process.txt"

      - name: Upload Phase 7 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-Phase7-Evidence
          path: phase7-evidence
          if-no-files-found: warn
          retention-days: 14
