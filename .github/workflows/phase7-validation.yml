name: King's Bot - Phase 7 Runtime Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase7-runtime-validation:
    name: Phase 7 Runtime and Strategy Tester Validation
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout King's Bot
        uses: actions/checkout@v4

      - name: Initialize Phase 7 evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $Evidence = Join-Path $env:GITHUB_WORKSPACE 'phase7-artifacts'

          New-Item -ItemType Directory -Path $Evidence -Force | Out-Null

          Set-Content `
            -Path (Join-Path $Evidence 'PHASE7_STARTED.txt') `
            -Value "Phase 7 started: $(Get-Date -Format o)" `
            -Encoding UTF8

          Add-Content `
            -Path $env:GITHUB_ENV `
            -Value "PHASE7_EVIDENCE=$Evidence"

      - name: Record repository contents
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Get-ChildItem `
            $env:GITHUB_WORKSPACE `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FullName -notmatch '\\.git\\'
            } |
            Select-Object FullName, Length |
            Format-Table -AutoSize |
            Out-File `
              (Join-Path $env:PHASE7_EVIDENCE 'repository-files.txt') `
              -Encoding UTF8

      - name: Verify King's Bot source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $Source = Get-ChildItem `
            $env:GITHUB_WORKSPACE `
            -Recurse `
            -File `
            -Filter 'KingsBot_Phase6_Integration.mq5' |
            Where-Object {
              $_.FullName -notmatch '\\.git\\'
            } |
            Select-Object -First 1

          if (-not $Source) {
            throw 'KingsBot_Phase6_Integration.mq5 was not found.'
          }

          Write-Host "Source found: $($Source.FullName)"

          Add-Content `
            -Path $env:GITHUB_ENV `
            -Value "KINGSBOT_SOURCE=$($Source.FullName)"

          Copy-Item `
            $Source.FullName `
            (Join-Path $env:PHASE7_EVIDENCE 'KingsBot_Phase6_Integration.mq5') `
            -Force

      - name: Verify MetaQuotes connectivity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $Connection = Test-NetConnection `
            -ComputerName 'download.mql5.com' `
            -Port 443 `
            -WarningAction SilentlyContinue

          $Connection |
            Format-List |
            Out-File `
              (Join-Path $env:PHASE7_EVIDENCE 'network-test.txt') `
              -Encoding UTF8

          if (-not $Connection.TcpTestSucceeded) {
            throw 'HTTPS connectivity to download.mql5.com failed.'
          }

      - name: Download MT5 installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $Installer = Join-Path `
            $env:RUNNER_TEMP `
            'mt5setup.exe'

          $Url = 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe'

          Invoke-WebRequest `
            -Uri $Url `
            -OutFile $Installer `
            -UseBasicParsing `
            -TimeoutSec 180

          if (-not (Test-Path $Installer)) {
            throw 'MT5 installer was not downloaded.'
          }

          $File = Get-Item $Installer
          $Hash = Get-FileHash $Installer -Algorithm SHA256
          $Signature = Get-AuthenticodeSignature $Installer

          Set-Content `
            -Path (Join-Path $env:PHASE7_EVIDENCE 'mt5-installer.txt') `
            -Value "URL=$Url" `
            -Encoding UTF8

          Add-Content `
            -Path (Join-Path $env:PHASE7_EVIDENCE 'mt5-installer.txt') `
            -Value "SizeBytes=$($File.Length)"

          Add-Content `
            -Path (Join-Path $env:PHASE7_EVIDENCE 'mt5-installer.txt') `
            -Value "SHA256=$($Hash.Hash)"

          Add-Content `
            -Path (Join-Path $env:PHASE7_EVIDENCE 'mt5-installer.txt') `
            -Value "SignatureStatus=$($Signature.Status)"

          if ($File.Length -lt 100000) {
            throw "MT5 installer is unexpectedly small: $($File.Length) bytes."
          }

          if ($Signature.Status -ne 'Valid') {
            throw "MT5 installer signature is not valid: $($Signature.Status)"
          }

          Add-Content `
            -Path $env:GITHUB_ENV `
            -Value "MT5_INSTALLER=$Installer"

      - name: Install MT5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $InstallRoot = Join-Path `
            $env:RUNNER_TEMP `
            'KingsBot-MT5'

          Remove-Item `
            $InstallRoot `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Path $InstallRoot `
            -Force |
            Out-Null

          $Process = Start-Process `
            -FilePath $env:MT5_INSTALLER `
            -ArgumentList @(
              '/auto',
              "/path:$InstallRoot"
            ) `
            -WorkingDirectory $env:RUNNER_TEMP `
            -Wait `
            -PassThru

          Set-Content `
            -Path (Join-Path $env:PHASE7_EVIDENCE 'mt5-install-result.txt') `
            -Value "ExitCode=$($Process.ExitCode)" `
            -Encoding UTF8

          Add-Content `
            -Path (Join-Path $env:PHASE7_EVIDENCE 'mt5-install-result.txt') `
            -Value "InstallRoot=$InstallRoot"

          if ($Process.ExitCode -ne 0) {
            throw "MT5 installer failed with exit code $($Process.ExitCode)."
          }

          $Terminal = Get-ChildItem `
            $InstallRoot `
            -Recurse `
            -File `
            -Filter 'terminal64.exe' `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          $MetaEditor = Get-ChildItem `
            $InstallRoot `
            -Recurse `
            -File `
            -Filter 'metaeditor64.exe' `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $Terminal) {
            throw 'terminal64.exe was not found after MT5 installation.'
          }

          if (-not $MetaEditor) {
            throw 'metaeditor64.exe was not found after MT5 installation.'
          }

          Add-Content `
            -Path $env:GITHUB_ENV `
            -Value "MT5_ROOT=$InstallRoot"

          Add-Content `
            -Path $env:GITHUB_ENV `
            -Value "MT5_TERMINAL=$($Terminal.FullName)"

          Add-Content `
            -Path $env:GITHUB_ENV `
            -Value "METAEDITOR=$($MetaEditor.FullName)"

      - name: Prepare King's Bot for MT5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $Target = Join-Path `
            $env:MT5_ROOT `
            'MQL5\Experts\KingsBot'

          New-Item `
            -ItemType Directory `
            -Path $Target `
            -Force |
            Out-Null

          $Root = Split-Path `
            $env:KINGSBOT_SOURCE `
            -Parent

          Get-ChildItem `
            $Root `
            -Recurse `
            -File |
            ForEach-Object {

              $Relative = $_.FullName.Substring(
                $Root.Length
              ).TrimStart('\')

              $Destination = Join-Path `
                $Target `
                $Relative

              $DestinationDirectory = Split-Path `
                $Destination `
                -Parent

              New-Item `
                -ItemType Directory `
                -Path $DestinationDirectory `
                -Force |
                Out-Null

              Copy-Item `
                $_.FullName `
                $Destination `
                -Force
            }

      - name: Compile King's Bot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $Source = Join-Path `
            $env:MT5_ROOT `
            'MQL5\Experts\KingsBot\KingsBot_Phase6_Integration.mq5'

          $Output = Join-Path `
            $env:MT5_ROOT `
            'MQL5\Experts\KingsBot\KingsBot_Phase6_Integration.ex5'

          if (-not (Test-Path $Source)) {
            throw "MQ5 source not found: $Source"
          }

          Remove-Item `
            $Output `
            -Force `
            -ErrorAction SilentlyContinue

          $Process = Start-Process `
            -FilePath $env:METAEDITOR `
            -ArgumentList @(
              "/compile:$Source",
              '/log'
            ) `
            -WorkingDirectory (Split-Path $Source -Parent) `
            -Wait `
            -PassThru

          Set-Content `
            -Path (Join-Path $env:PHASE7_EVIDENCE 'compile-result.txt') `
            -Value "MetaEditorExitCode=$($Process.ExitCode)" `
            -Encoding UTF8

          if (-not (Test-Path $Output)) {
            throw 'EX5 was not generated.'
          }

          $Size = (Get-Item $Output).Length

          if ($Size -le 0) {
            throw 'EX5 was generated but is empty.'
          }

          Add-Content `
            -Path (Join-Path $env:PHASE7_EVIDENCE 'compile-result.txt') `
            -Value "EX5SizeBytes=$Size"

          Copy-Item `
            $Output `
            (Join-Path $env:PHASE7_EVIDENCE 'KingsBot_Phase6_Integration.ex5') `
            -Force

      - name: Create Strategy Tester configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $Config = Join-Path `
            $env:MT5_ROOT `
            'KingsBot_Phase7_Tester.ini'

          Set-Content `
            -Path $Config `
            -Value '[Tester]' `
            -Encoding ASCII

          Add-Content $Config 'Expert=KingsBot\KingsBot_Phase6_Integration.ex5'
          Add-Content $Config 'Symbol=EURUSD'
          Add-Content $Config 'Period=M15'
          Add-Content $Config 'Model=1'
          Add-Content $Config 'Optimization=0'
          Add-Content $Config 'FromDate=2026.01.01'
          Add-Content $Config 'ToDate=2026.08.01'
          Add-Content $Config 'ForwardMode=0'
          Add-Content $Config 'Deposit=10000'
          Add-Content $Config 'Currency=USD'
          Add-Content $Config 'Leverage=1:100'
          Add-Content $Config 'Visual=0'
          Add-Content $Config 'ReplaceReport=1'
          Add-Content $Config 'Report=KingsBot_Phase7_Tester'
          Add-Content $Config 'ShutdownTerminal=1'

          Copy-Item `
            $Config `
            (Join-Path $env:PHASE7_EVIDENCE 'KingsBot_Phase7_Tester.ini') `
            -Force

      - name: Run Strategy Tester
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $Config = Join-Path `
            $env:MT5_ROOT `
            'KingsBot_Phase7_Tester.ini'

          $Process = Start-Process `
            -FilePath $env:MT5_TERMINAL `
            -ArgumentList @(
              '/portable',
              "/config:$Config"
            ) `
            -WorkingDirectory $env:MT5_ROOT `
            -PassThru

          $Deadline = (Get-Date).AddMinutes(20)

          while ((Get-Date) -lt $Deadline) {

            $Report = Get-ChildItem `
              $env:MT5_ROOT `
              -Recurse `
              -File `
              -Include '*.htm','*.html' `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Name -match 'KingsBot_Phase7_Tester'
              } |
              Select-Object -First 1

            if ($Report -and $Report.Length -gt 0) {

              Copy-Item `
                $Report.FullName `
                (Join-Path $env:PHASE7_EVIDENCE 'KingsBot_Phase7_Tester.htm') `
                -Force

              if (-not $Process.HasExited) {
                Stop-Process `
                  -Id $Process.Id `
                  -Force `
                  -ErrorAction SilentlyContinue
              }

              exit 0
            }

            if ($Process.HasExited) {
              throw "MT5 exited before producing the tester report. Exit code: $($Process.ExitCode)"
            }

            Start-Sleep -Seconds 5
          }

          throw 'Strategy Tester timed out without producing a report.'

      - name: Collect diagnostics
        if: ${{ always() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $Evidence = $env:PHASE7_EVIDENCE

          if ($env:MT5_ROOT -and (Test-Path $env:MT5_ROOT)) {

            Get-ChildItem `
              $env:MT5_ROOT `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Extension -in @(
                  '.log',
                  '.ini',
                  '.htm',
                  '.html',
                  '.xml',
                  '.txt'
                )
              } |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 200 |
              ForEach-Object {

                Copy-Item `
                  $_.FullName `
                  (Join-Path $Evidence $_.Name) `
                  -Force `
                  -ErrorAction SilentlyContinue
              }
          }

          Get-ChildItem `
            $Evidence `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Select-Object FullName, Length, LastWriteTime |
            Format-Table -AutoSize |
            Out-File `
              (Join-Path $Evidence 'artifact-inventory.txt') `
              -Encoding UTF8

      - name: Upload Phase 7 evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-Phase7-Evidence-${{ github.run_number }}
          path: ${{ github.workspace }}/phase7-artifacts
          if-no-files-found: error
          retention-days: 14
