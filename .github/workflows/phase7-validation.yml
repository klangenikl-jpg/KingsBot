name: KingsBot Phase 7 Runtime and Strategy Tester Validation

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/phase7-validation.yml"
      - "**/*.mq5"
      - "**/*.mqh"

permissions:
  contents: read

jobs:
  phase7-validation:
    name: Phase 7 MT5 Runtime and Strategy Tester
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      MT5_ROOT: C:\MT5
      BOT_NAME: KingsBot
      BOT_SOURCE_NAME: KingsBot_Phase6_Integration.mq5
      TEST_SYMBOL: EURUSD
      TEST_PERIOD: M15
      TEST_FROM: "2025.01.01"
      TEST_TO: "2026.08.01"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate King’s Bot source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host 'Searching repository for King''s Bot source...'

          $source = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter $env:BOT_SOURCE_NAME `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $source) {
            throw "Could not find $env:BOT_SOURCE_NAME in the repository."
          }

          Write-Host "Source found: $($source.FullName)"

          "BOT_SOURCE=$($source.FullName)" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

      - name: Download MetaTrader 5 installer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          $url = 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe'

          Write-Host 'Downloading MetaTrader 5 installer...'

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer `
            -UseBasicParsing

          if (-not (Test-Path $installer)) {
            throw 'MetaTrader 5 installer was not downloaded.'
          }

          Write-Host "Installer: $installer"

      - name: Install MetaTrader 5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'

          if (Test-Path $env:MT5_ROOT) {
            Remove-Item `
              -Path $env:MT5_ROOT `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue
          }

          New-Item `
            -ItemType Directory `
            -Path $env:MT5_ROOT `
            -Force | Out-Null

          Write-Host 'Installing MetaTrader 5...'

          $arguments = @(
            '/auto'
            "/path:$env:MT5_ROOT"
          )

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList $arguments `
            -Wait `
            -PassThru

          Write-Host "MT5 installer exit code: $($process.ExitCode)"

          if ($process.ExitCode -ne 0) {
            throw "MetaTrader 5 installer failed with exit code $($process.ExitCode)."
          }

      - name: Locate MetaTrader executables
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $terminal = Get-ChildItem `
            -Path $env:MT5_ROOT `
            -Filter 'terminal64.exe' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          $editor = Get-ChildItem `
            -Path $env:MT5_ROOT `
            -Filter 'metaeditor64.exe' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $terminal) {
            throw 'terminal64.exe was not found after MetaTrader 5 installation.'
          }

          if ($null -eq $editor) {
            throw 'metaeditor64.exe was not found after MetaTrader 5 installation.'
          }

          Write-Host "Terminal: $($terminal.FullName)"
          Write-Host "MetaEditor: $($editor.FullName)"

          "MT5_TERMINAL=$($terminal.FullName)" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

          "MT5_EDITOR=$($editor.FullName)" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

      - name: Prepare King’s Bot MT5 files
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $terminalRoot = Split-Path `
            -Path $env:MT5_TERMINAL `
            -Parent

          $expertsDir = Join-Path `
            $terminalRoot `
            'MQL5\Experts\KingsBot'

          New-Item `
            -ItemType Directory `
            -Path $expertsDir `
            -Force | Out-Null

          $sourceRoot = Split-Path `
            -Path $env:BOT_SOURCE `
            -Parent

          Write-Host "Source directory: $sourceRoot"
          Write-Host "Experts directory: $expertsDir"

          Copy-Item `
            -Path (Join-Path $sourceRoot '*') `
            -Destination $expertsDir `
            -Recurse `
            -Force

          $copiedSource = Join-Path `
            $expertsDir `
            $env:BOT_SOURCE_NAME

          if (-not (Test-Path $copiedSource)) {
            throw "King's Bot source was not copied to $copiedSource."
          }

          Write-Host "Prepared source: $copiedSource"

          "EXPERT_DIR=$expertsDir" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

          "EXPERT_SOURCE=$copiedSource" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

      - name: Compile King’s Bot
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host 'Compiling King''s Bot...'
          Write-Host "MetaEditor: $env:MT5_EDITOR"
          Write-Host "Source: $env:EXPERT_SOURCE"

          & $env:MT5_EDITOR `
            "/compile:$env:EXPERT_SOURCE" `
            '/log'

          $editorExit = $LASTEXIT
