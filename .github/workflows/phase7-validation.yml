name: King's Bot - Phase 7 Runtime Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase7:
    name: Phase 7 Runtime and Strategy Tester Validation
    runs-on: windows-2022
    timeout-minutes: 60

    env:
      BOT_SOURCE: KingsBot_Phase6_Integration.mq5
      BOT_EX5: KingsBot_Phase6_Integration.ex5
      BOT_DIR: KingsBot
      TEST_SYMBOL: EURUSD
      TEST_PERIOD: M15

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. CREATE EVIDENCE DIRECTORY
      # ============================================================
      - name: Initialize Phase 7 evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $Evidence = Join-Path $env:GITHUB_WORKSPACE 'phase7-artifacts'

          New-Item `
            -ItemType Directory `
            -Path $Evidence `
            -Force | Out-Null

          Set-Content `
            -LiteralPath (Join-Path $Evidence 'phase7-started.txt') `
            -Value "Phase 7 started: $(Get-Date -Format o)" `
            -Encoding UTF8

          "EVIDENCE=$Evidence" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append `
            -Encoding UTF8

      # ============================================================
      # 3. VERIFY SOURCE
      # ============================================================
      - name: Verify King's Bot source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $Source = Join-Path `
            $env:GITHUB_WORKSPACE `
            $env:BOT_SOURCE

          if (-not (Test-Path -LiteralPath $Source -PathType Leaf)) {
            throw "King's Bot source was not found: $Source"
          }

          "SOURCE=$Source" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append `
            -Encoding UTF8

          Copy-Item `
            -LiteralPath $Source `
            -Destination $env:EVIDENCE `
            -Force

          Get-ChildItem `
            -LiteralPath $env:GITHUB_WORKSPACE `
            -File `
            -Filter '*.mqh' `
            -ErrorAction SilentlyContinue |
            ForEach-Object {
              Copy-Item `
                -LiteralPath $_.FullName `
                -Destination $env:EVIDENCE `
                -Force
            }

          Set-Content `
            -LiteralPath (Join-Path $env:EVIDENCE 'source-location.txt') `
            -Value $Source `
            -Encoding UTF8

      # ============================================================
      # 4. DOWNLOAD MT5
      # ============================================================
      - name: Download MetaTrader 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $Installer = Join-Path `
            $env:RUNNER_TEMP `
            'mt5setup.exe'

          Invoke-WebRequest `
            -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' `
            -OutFile $Installer `
            -UseBasicParsing

          if (-not (Test-Path -LiteralPath $Installer -PathType Leaf)) {
            throw 'MetaTrader 5 installer was not downloaded.'
          }

          $Hash = Get-FileHash `
            -LiteralPath $Installer `
            -Algorithm SHA256

          Set-Content `
            -LiteralPath (Join-Path $env:EVIDENCE 'mt5-installer-sha256.txt') `
            -Value $Hash.Hash `
            -Encoding UTF8

          "INSTALLER=$Installer" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append `
            -Encoding UTF8

      # ============================================================
      # 5. INSTALL / LOCATE MT5
      # ============================================================
      - name: Install and locate MetaTrader 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $InstallRoot = Join-Path `
            $env:RUNNER_TEMP `
            'KingsBot-MT5'

          Remove-Item `
            -LiteralPath $InstallRoot `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Path $InstallRoot `
            -Force | Out-Null

          $InstallerProcess = Start-Process `
            -FilePath $env:INSTALLER `
            -ArgumentList @(
              '/auto',
              "/path=$InstallRoot"
            ) `
            -Wait `
            -PassThru

          Set-Content `
            -LiteralPath (Join-Path $env:EVIDENCE 'mt5-installer-exit-code.txt') `
            -Value $InstallerProcess.ExitCode `
            -Encoding UTF8

          Start-Sleep -Seconds 10

          $Terminal = $null
          $Editor = $null

          $Terminal = Get-ChildItem `
            -LiteralPath $InstallRoot `
            -Recurse `
            -File `
            -Filter 'terminal64.exe' `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $Terminal) {
            $Terminal = Get-ChildItem `
              -Path 'C:\Program Files' `
              -Recurse `
              -File `
              -Filter 'terminal64.exe' `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }

          if ($null -eq $Terminal) {
            $Terminal = Get-ChildItem `
              -Path 'C:\Program Files (x86)' `
              -Recurse `
              -File `
              -Filter 'terminal64.exe' `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }

          if ($null -eq $Terminal) {
            throw 'MetaTrader 5 terminal64.exe could not be located.'
          }

          $TerminalRoot = $Terminal.Directory.FullName

          $Editor = Get-ChildItem `
            -LiteralPath $TerminalRoot `
            -Recurse `
            -File `
            -Filter 'metaeditor64.exe' `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $Editor) {
            $Editor = Get-ChildItem `
              -Path 'C:\Program Files' `
              -Recurse `
              -File `
              -Filter 'metaeditor64.exe' `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }

          if ($null -eq $Editor) {
            $Editor = Get-ChildItem `
              -Path 'C:\Program Files (x86)' `
              -Recurse `
              -File `
              -Filter 'metaeditor64.exe' `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }

          if ($null -eq $Editor) {
            throw 'MetaEditor metaeditor64.exe could not be located.'
          }

          "MT5ROOT=$TerminalRoot" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append `
            -Encoding UTF8

          "TERMINAL=$($Terminal.FullName)" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append `
            -Encoding UTF8

          "EDITOR=$($Editor.FullName)" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append `
            -Encoding UTF8

          Set-Content `
            -LiteralPath (Join-Path $env:EVIDENCE 'mt5-location.txt') `
            -Value @(
              "MT5ROOT=$TerminalRoot"
              "TERMINAL=$($Terminal.FullName)"
              "EDITOR=$($Editor.FullName)"
            ) `
            -Encoding UTF8

      # ============================================================
      # 6. PREPARE MQL5 SOURCE TREE
      # ============================================================
      - name: Prepare King's Bot source tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $Target = Join-Path `
            $env:MT5ROOT `
            'MQL5\Experts\KingsBot'

          New-Item `
            -ItemType Directory `
            -Path $Target `
            -Force | Out-Null

          $Mq5Files = @(
            Get-ChildItem `
              -LiteralPath $env:GITHUB_WORKSPACE `
              -File `
              -Filter '*.mq5' `
              -ErrorAction SilentlyContinue
          )

          $MqhFiles = @(
            Get-ChildItem `
              -LiteralPath $env:GITHUB_WORKSPACE `
              -File `
              -Filter '*.mqh' `
              -ErrorAction SilentlyContinue
          )

          if ($Mq5Files.Count -eq 0) {
            throw 'No MQ5 files were found in the repository root.'
          }

          foreach ($File in $Mq5Files) {
            Copy-Item `
              -LiteralPath $File.FullName `
              -Destination $Target `
              -Force
          }

          foreach ($File in $MqhFiles) {
            Copy-Item `
              -LiteralPath $File.FullName `
              -Destination $Target `
              -Force
          }

          $Compile = Join-Path `
            $Target `
            $env:BOT_SOURCE

          if (-not (Test-Path -LiteralPath $Compile -PathType Leaf)) {
            throw "Prepared source file does not exist: $Compile"
          }

          "COMPILE=$Compile" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append `
            -Encoding UTF8

          Get-ChildItem `
            -LiteralPath $Target `
            -File |
            Select-Object Name, Length, FullName |
            Format-Table -AutoSize |
            Out-String |
            Set-Content `
              -LiteralPath (Join-Path $env:EVIDENCE 'prepared-source-inventory.txt') `
              -Encoding UTF8

      # ============================================================
      # 7. COMPILE
      # ============================================================
      - name: Compile King's Bot
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'

          $CompileLog = Join-Path `
            $env:EVIDENCE `
            'metaeditor-compile.log'

          $CompileError = Join-Path `
            $env:EVIDENCE `
            'metaeditor-compile-error.log'

          Write-Host "MetaEditor: $env:EDITOR"
          Write-Host "Source: $env:COMPILE"

          & $env:EDITOR "/compile:$env:COMPILE" /log `
            1> $CompileLog `
            2> $CompileError

          $ExitCode = $LASTEXITCODE

          Set-Content `
            -LiteralPath (Join-Path $env:EVIDENCE 'compile-exit-code.txt') `
            -Value $ExitCode `
            -Encoding UTF8

          Write-Host "MetaEditor exit code: $ExitCode"

          Start-Sleep -Seconds 3

          # First check the expected EX5 location.
          $ExpectedEx5 = [System.IO.Path]::ChangeExtension(
            $env:COMPILE,
            '.ex5'
          )

          $Ex5 = $null

          if (Test-Path -LiteralPath $ExpectedEx5 -PathType Leaf) {
            $Ex5 = Get-Item -LiteralPath $ExpectedEx5
          }

          # If MetaEditor placed it elsewhere, search the MT5 tree.
          if ($null -eq $Ex5) {
            $Ex5 = Get-ChildItem `
              -LiteralPath $env:MT5ROOT `
              -Recurse `
              -File `
              -Filter $env:BOT_EX5 `
              -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1
          }

          if ($null -ne $Ex5) {

            Write-Host "EX5 FOUND: $($Ex5.FullName)"

            Copy-Item `
              -LiteralPath $Ex5.FullName `
              -Destination $env:EVIDENCE `
              -Force

            Set-Content `
              -LiteralPath (Join-Path $env:EVIDENCE 'compiled-ex5-location.txt') `
              -Value $Ex5.FullName `
              -Encoding UTF8

            "EX5=$($Ex5.FullName)" | Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding UTF8

            Set-Content `
              -LiteralPath (Join-Path $env:EVIDENCE 'EX5-FOUND.txt') `
              -Value "EX5 successfully produced: $($Ex5.FullName)" `
              -Encoding UTF8
          }
          else {

            Set-Content `
              -LiteralPath (Join-Path $env:EVIDENCE 'EX5-NOT-FOUND.txt') `
              -Value "MetaEditor did not produce $env:BOT_EX5. Exit code: $ExitCode" `
              -Encoding UTF8

            Write-Warning "EX5 was not produced."
          }

      # ============================================================
      # 8. CREATE TESTER CONFIG ONLY IF EX5 EXISTS
      # ============================================================
      - name: Create Strategy Tester configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:EX5)) {
            throw 'Cannot create tester configuration because EX5 was not produced.'
          }

          $Config = Join-Path `
            $env:MT5ROOT `
            'KingsBot_Phase7_Tester.ini'

          $ExpertRelative = "KingsBot\$env:BOT_EX5"

          $ConfigLines = @(
            '[Tester]'
            "Expert=$ExpertRelative"
            "Symbol=$env:TEST_SYMBOL"
            "Period=$env:TEST_PERIOD"
            'Model=1'
            'Optimization=0'
            'FromDate=2026.01.01'
            'ToDate=2026.08.01'
            'ForwardMode=0'
            'Deposit=10000'
            'Currency=USD'
            'Leverage=1:100'
            'Visual=0'
            'ReplaceReport=1'
            'Report=KingsBot_Phase7_Tester'
            'ShutdownTerminal=1'
          )

          Set-Content `
            -LiteralPath $Config `
            -Value $ConfigLines `
            -Encoding ASCII

          Copy-Item `
            -LiteralPath $Config `
            -Destination $env:EVIDENCE `
            -Force

          "CONFIG=$Config" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append `
            -Encoding UTF8

          Set-Content `
            -LiteralPath (Join-Path $env:EVIDENCE 'tester-config.txt') `
            -Value $ConfigLines `
            -Encoding UTF8

      # ============================================================
      # 9. RUN STRATEGY TESTER
      # ============================================================
      - name: Run Strategy Tester
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'

          if ([string]::IsNullOrWhiteSpace($env:CONFIG)) {
            Write-Warning 'Tester configuration was not created. Skipping tester.'
            exit 0
          }

          $StdOut = Join-Path `
            $env:EVIDENCE `
            'mt5-tester-stdout.log'

          $StdErr = Join-Path `
            $env:EVIDENCE `
            'mt5-tester-stderr.log'

          Write-Host "Terminal: $env:TERMINAL"
          Write-Host "Config: $env:CONFIG"

          & $env:TERMINAL "/config:$env:CONFIG" `
            1> $StdOut `
            2> $StdErr

          $ExitCode = $LASTEXITCODE

          Set-Content `
            -LiteralPath (Join-Path $env:EVIDENCE 'mt5-tester-exit-code.txt') `
            -Value $ExitCode `
            -Encoding UTF8

          Write-Host "MT5 tester exit code: $ExitCode"

      # ============================================================
      # 10. COLLECT RUNTIME EVIDENCE
      # ============================================================
      - name: Collect MT5 runtime evidence
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $Roots = @(
            $env:MT5ROOT,
            $env:RUNNER_TEMP,
            'C:\Program Files\MetaTrader 5',
            'C:\Program Files (x86)\MetaTrader 5'
          ) |
          Where-Object {
            $_ -and (Test-Path -LiteralPath $_)
          } |
          Select-Object -Unique

          foreach ($Root in $Roots) {

            Get-ChildItem `
              -LiteralPath $Root `
              -Recurse `
              -File `
              -Include '*.log','*.htm','*.html','*.xml' `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.LastWriteTime -gt (Get-Date).AddMinutes(-30)
              } |
              ForEach-Object {

                $SafeName = (
                  $_.FullName `
                    -replace '[:\\\/]', '_' `
                    -replace '[^a-zA-Z0-9_.-]', '_'
                )

                try {
                  Copy-Item `
                    -LiteralPath $_.FullName `
                    -Destination (
                      Join-Path $env:EVIDENCE $SafeName
                    ) `
                    -Force `
                    -ErrorAction SilentlyContinue
                }
                catch {
                }
              }
          }

      # ============================================================
      # 11. FIND TESTER REPORT
      # ============================================================
      - name: Find Strategy Tester report
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $Roots = @(
            $env:MT5ROOT,
            $env:RUNNER_TEMP,
            'C:\Program Files\MetaTrader 5',
            'C:\Program Files (x86)\MetaTrader 5'
          ) |
          Where-Object {
            $_ -and (Test-Path -LiteralPath $_)
          } |
          Select-Object -Unique

          $Reports = @(
            foreach ($Root in $Roots) {

              Get-ChildItem `
                -LiteralPath $Root `
                -Recurse `
                -File `
                -ErrorAction SilentlyContinue |
                Where-Object {
                  $_.Name -like 'KingsBot_Phase7_Tester*'
                }
            }
          ) |
          Sort-Object LastWriteTime -Descending

          if ($Reports.Count -gt 0) {

            $Report = $Reports | Select-Object -First 1

            Copy-Item `
              -LiteralPath $Report.FullName `
              -Destination $env:EVIDENCE `
              -Force

            Set-Content `
              -LiteralPath (Join-Path $env:EVIDENCE 'TESTER-REPORT-FOUND.txt') `
              -Value $Report.FullName `
              -Encoding UTF8

            "REPORT=$($Report.FullName)" | Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding UTF8

            $Reports |
              Select-Object FullName, Length, LastWriteTime |
              Format-Table -AutoSize |
              Out-String |
              Set-Content `
                -LiteralPath (Join-Path $env:EVIDENCE 'tester-report-discovery.txt') `
                -Encoding UTF8
          }
          else {

            Set-Content `
              -LiteralPath (Join-Path $env:EVIDENCE 'TESTER-REPORT-NOT-FOUND.txt') `
              -Value 'No KingsBot Phase 7 Strategy Tester report was found.' `
              -Encoding UTF8

            Set-Content `
              -LiteralPath (Join-Path $env:EVIDENCE 'tester-report-discovery.txt') `
              -Value 'NO REPORT FOUND' `
              -Encoding UTF8
          }

      # ============================================================
      # 12. CREATE FINAL EVIDENCE SUMMARY
      # ============================================================
      - name: Create Phase 7 evidence summary
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $Summary = @(
            "King's Bot Phase 7 Runtime Validation"
            "====================================="
            ""
            "Time: $(Get-Date -Format o)"
            "Source: $env:SOURCE"
            "MT5 Root: $env:MT5ROOT"
            "MetaEditor: $env:EDITOR"
            "Terminal: $env:TERMINAL"
            "Compile Target: $env:COMPILE"
            "EX5: $env:EX5"
            "Tester Config: $env:CONFIG"
            "Tester Report: $env:REPORT"
            ""
            "Evidence files:"
          )

          Get-ChildItem `
            -LiteralPath $env:EVIDENCE `
            -File `
            -ErrorAction SilentlyContinue |
            Sort-Object Name |
            ForEach-Object {
              $Summary += "  $($_.Name)"
            }

          Set-Content `
            -LiteralPath (Join-Path $env:EVIDENCE 'PHASE7-SUMMARY.txt') `
            -Value $Summary `
            -Encoding UTF8

      # ============================================================
      # 13. UPLOAD ARTIFACTS - ALWAYS
      # ============================================================
      - name: Upload Phase 7 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-Phase7-Runtime-Evidence
          path: phase7-artifacts
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # 14. FINAL VALIDATION
      # ============================================================
      - name: Final Phase 7 validation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $Ex5Evidence = Join-Path `
            $env:EVIDENCE `
            'EX5-FOUND.txt'

          if (-not (Test-Path -LiteralPath $Ex5Evidence -PathType Leaf)) {
            throw 'PHASE 7 FAILED: EX5 was not produced.'
          }

          $ReportEvidence = Join-Path `
            $env:EVIDENCE `
            'TESTER-REPORT-FOUND.txt'

          if (-not (Test-Path -LiteralPath $ReportEvidence -PathType Leaf)) {
            throw 'PHASE 7 FAILED: Strategy Tester report was not produced.'
          }

          Set-Content `
            -LiteralPath (Join-Path $env:EVIDENCE 'PHASE7-PASSED.txt') `
            -Value "Phase 7 passed: $(Get-Date -Format o)" `
            -Encoding UTF8

          Write-Host ''
          Write-Host '=========================================='
          Write-Host " KING'S BOT PHASE 7 PASSED"
          Write-Host '=========================================='
