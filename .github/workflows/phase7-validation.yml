name: King's Bot - Phase 7 Runtime Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  phase7-runtime-validation:
    name: Phase 7 Runtime and Strategy Tester Validation
    runs-on: windows-latest
    timeout-minutes: 35

    steps:

      - name: Checkout King's Bot
        uses: actions/checkout@v4

      - name: Install MT5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          $installRoot = Join-Path $env:RUNNER_TEMP 'KingsBot-MT5'

          Invoke-WebRequest `
            -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' `
            -OutFile $installer `
            -UseBasicParsing

          Remove-Item `
            $installRoot `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Path $installRoot `
            -Force |
            Out-Null

          $installerProcess = Start-Process `
            -FilePath $installer `
            -ArgumentList @(
              '/auto',
              ('/path:' + $installRoot)
            ) `
            -Wait `
            -PassThru

          Write-Host "MT5 installer exit code: $($installerProcess.ExitCode)"

          $terminal = Get-ChildItem `
            $installRoot `
            -Recurse `
            -File `
            -Filter 'terminal64.exe' `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          $metaEditor = Get-ChildItem `
            $installRoot `
            -Recurse `
            -File `
            -Filter 'metaeditor64.exe' `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $terminal) {
            throw 'terminal64.exe was not found after MT5 installation.'
          }

          if (-not $metaEditor) {
            throw 'metaeditor64.exe was not found after MT5 installation.'
          }

          "MT5_ROOT=$($terminal.Directory.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "METAEDITOR=$($metaEditor.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "MT5_ROOT=$($terminal.Directory.FullName)"
          Write-Host "METAEDITOR=$($metaEditor.FullName)"

      - name: Prepare validation evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $evidence = Join-Path `
            $env:GITHUB_WORKSPACE `
            'phase7-validation-evidence'

          New-Item `
            -ItemType Directory `
            -Path $evidence `
            -Force |
            Out-Null

      - name: Locate King's Bot source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Get-ChildItem `
            $env:GITHUB_WORKSPACE `
            -Recurse `
            -File `
            -Filter 'KingsBot_Phase6_Integration.mq5' `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FullName -notmatch '\\.git\\'
            } |
            Select-Object -First 1

          if (-not $source) {
            throw 'KingsBot_Phase6_Integration.mq5 was not found.'
          }

          "KINGSBOT_SOURCE=$($source.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Source: $($source.FullName)"

      - name: Prepare King's Bot source tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Get-Item $env:KINGSBOT_SOURCE

          $expertsRoot = Join-Path `
            $env:MT5_ROOT `
            'MQL5\Experts'

          $primaryTarget = Join-Path `
            $expertsRoot `
            'KingsBot'

          $compatibilityTarget = Join-Path `
            $expertsRoot `
            'Experts\KingsBot'

          New-Item `
            -ItemType Directory `
            -Path $primaryTarget `
            -Force |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Path $compatibilityTarget `
            -Force |
            Out-Null

          Write-Host "Primary EA directory:"
          Write-Host $primaryTarget

          Write-Host "Compatibility EA directory:"
          Write-Host $compatibilityTarget

          Get-ChildItem `
            $source.Directory.FullName `
            -Recurse `
            -File |
            Where-Object {
              $_.FullName -notmatch '\\.git\\'
            } |
            ForEach-Object {

              $relative = $_.FullName.Substring(
                $source.Directory.FullName.Length
              ).TrimStart('\')

              $primaryDestination = Join-Path `
                $primaryTarget `
                $relative

              $primaryDirectory = Split-Path `
                $primaryDestination `
                -Parent

              New-Item `
                -ItemType Directory `
                -Path $primaryDirectory `
                -Force |
                Out-Null

              Copy-Item `
                $_.FullName `
                $primaryDestination `
                -Force
            }

          Write-Host 'Source tree copied.'

      - name: Compile King's Bot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $evidence = Join-Path `
            $env:GITHUB_WORKSPACE `
            'phase7-validation-evidence'

          $mq5 = Join-Path `
            $env:MT5_ROOT `
            'MQL5\Experts\KingsBot\KingsBot_Phase6_Integration.mq5'

          $ex5 = Join-Path `
            $env:MT5_ROOT `
            'MQL5\Experts\KingsBot\KingsBot_Phase6_Integration.ex5'

          if (-not (Test-Path $mq5)) {
            throw "MQ5 not found: $mq5"
          }

          Remove-Item `
            $ex5 `
            -Force `
            -ErrorAction SilentlyContinue

          Write-Host "Compiling:"
          Write-Host $mq5

          $compileProcess = Start-Process `
            -FilePath $env:METAEDITOR `
            -ArgumentList @(
              ('/compile:' + $mq5),
              '/log'
            ) `
            -WorkingDirectory `
            (Split-Path $mq5 -Parent) `
            -Wait `
            -PassThru

          Start-Sleep -Seconds 2

          Write-Host "MetaEditor exit code: $($compileProcess.ExitCode)"

          $compileLog = Get-ChildItem `
            (Split-Path $mq5 -Parent) `
            -File `
            -Filter '*.log' `
            -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if ($compileLog) {

            Copy-Item `
              $compileLog.FullName `
              (Join-Path $evidence 'compiler.log') `
              -Force

            Write-Host '===== COMPILER LOG ====='
            Get-Content $compileLog.FullName
            Write-Host '========================'
          }

          if (-not (Test-Path $ex5)) {
            throw 'Compilation did not produce KingsBot_Phase6_Integration.ex5.'
          }

          if ((Get-Item $ex5).Length -le 0) {
            throw 'Generated EX5 is empty.'
          }

          Copy-Item `
            $ex5 `
            $evidence `
            -Force

          Write-Host "EX5 created successfully: $ex5"

      - name: Stage EA compatibility path
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $primary = Join-Path `
            $env:MT5_ROOT `
            'MQL5\Experts\KingsBot'

          $compatibility = Join-Path `
            $env:MT5_ROOT `
            'MQL5\Experts\Experts\KingsBot'

          New-Item `
            -ItemType Directory `
            -Path $compatibility `
            -Force |
            Out-Null

          Get-ChildItem `
            $primary `
            -Recurse `
            -File |
            ForEach-Object {

              $relative = $_.FullName.Substring(
                $primary.Length
              ).TrimStart('\')

              $destination = Join-Path `
                $compatibility `
                $relative

              $destinationDirectory = Split-Path `
                $destination `
                -Parent

              New-Item `
                -ItemType Directory `
                -Path $destinationDirectory `
                -Force |
                Out-Null

              Copy-Item `
                $_.FullName `
                $destination `
                -Force
            }

          $primaryEx5 = Join-Path `
            $primary `
            'KingsBot_Phase6_Integration.ex5'

          $compatibilityEx5 = Join-Path `
            $compatibility `
            'KingsBot_Phase6_Integration.ex5'

          if (-not (Test-Path $primaryEx5)) {
            throw 'Primary EX5 is missing.'
          }

          if (-not (Test-Path $compatibilityEx5)) {
            throw 'Compatibility EX5 is missing.'
          }

          Write-Host "Primary EX5: $primaryEx5"
          Write-Host "Compatibility EX5: $compatibilityEx5"

      - name: Prepare MT5 tester configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $evidence = Join-Path `
            $env:GITHUB_WORKSPACE `
            'phase7-validation-evidence'

          $config = Join-Path `
            $env:MT5_ROOT `
            'KingsBot_Phase7_Tester.ini'

          $testerFiles = Join-Path `
            $env:MT5_ROOT `
            'Tester'

          New-Item `
            -ItemType Directory `
            -Path $testerFiles `
            -Force |
            Out-Null

          $reportBase = 'KingsBot_Phase7_Tester'

          $lines = @(
            '[Tester]'
            'Expert=Experts\KingsBot\KingsBot_Phase6_Integration.ex5'
            'Symbol=EURUSD'
            'Period=M15'
            'Model=0'
            'Optimization=0'
            'OptimizationCriterion=0'
            'FromDate=2025.01.01'
            'ToDate=2026.08.01'
            'ForwardMode=0'
            'Deposit=10000'
            'Currency=USD'
            'Leverage=1:100'
            'ExecutionMode=0'
            'UseLocal=1'
            'UseRemote=0'
            'UseCloud=0'
            'Visual=0'
            'Report=KingsBot_Phase7_Tester'
            'ReplaceReport=1'
            'ShutdownTerminal=1'
          )

          [System.IO.File]::WriteAllLines(
            $config,
            $lines,
            [System.Text.UnicodeEncoding]::new($false,$true)
          )

          Copy-Item `
            $config `
            (Join-Path $evidence 'KingsBot_Phase7_Tester.ini') `
            -Force

          Write-Host '===== TESTER INI ====='
          Get-Content $config
          Write-Host '======================'

      - name: Verify tester configuration and files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $config = Join-Path `
            $env:MT5_ROOT `
            'KingsBot_Phase7_Tester.ini'

          $primaryEx5 = Join-Path `
            $env:MT5_ROOT `
            'MQL5\Experts\KingsBot\KingsBot_Phase6_Integration.ex5'

          $compatibilityEx5 = Join-Path `
            $env:MT5_ROOT `
            'MQL5\Experts\Experts\KingsBot\KingsBot_Phase6_Integration.ex5'

          $terminal = Join-Path `
            $env:MT5_ROOT `
            'terminal64.exe'

          if (-not (Test-Path $config)) {
            throw 'Tester INI does not exist.'
          }

          if (-not (Test-Path $primaryEx5)) {
            throw 'Primary EX5 does not exist.'
          }

          if (-not (Test-Path $compatibilityEx5)) {
            throw 'Compatibility EX5 does not exist.'
          }

          if (-not (Test-Path $terminal)) {
            throw 'terminal64.exe does not exist.'
          }

          $configText = Get-Content $config -Raw

          if ($configText -notmatch 'Expert=Experts\\KingsBot\\KingsBot_Phase6_Integration\.ex5') {
            throw 'Tester INI contains an unexpected Expert path.'
          }

          Write-Host 'Primary EX5 verified.'
          Write-Host 'Compatibility EX5 verified.'
          Write-Host 'Tester INI verified.'
          Write-Host 'Terminal verified.'

      - name: Launch MT5 Strategy Tester
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $evidence = Join-Path `
            $env:GITHUB_WORKSPACE `
            'phase7-validation-evidence'

          $terminal = Join-Path `
            $env:MT5_ROOT `
            'terminal64.exe'

          $config = Join-Path `
            $env:MT5_ROOT `
            'KingsBot_Phase7_Tester.ini'

          $reportName = 'KingsBot_Phase7_Tester'

          Write-Host '===== MT5 VERSION ====='

          $terminalInfo = Get-Item $terminal

          @(
            "FileVersion=$($terminalInfo.VersionInfo.FileVersion)"
            "ProductVersion=$($terminalInfo.VersionInfo.ProductVersion)"
            "ProductName=$($terminalInfo.VersionInfo.ProductName)"
          ) |
            Set-Content `
            (Join-Path $evidence 'mt5-version.txt') `
            -Encoding UTF8

          Get-Content `
            (Join-Path $evidence 'mt5-version.txt')

          Write-Host '========================'

          Write-Host '===== TESTER LAUNCH ====='
          Write-Host "Terminal: $terminal"
          Write-Host "Config: $config"
          Write-Host 'Expert: Experts\KingsBot\KingsBot_Phase6_Integration.ex5'
          Write-Host 'Symbol: EURUSD'
          Write-Host 'Period: M15'
          Write-Host 'Model: Every tick'
          Write-Host '========================='

          $process = Start-Process `
            -FilePath $terminal `
            -ArgumentList @(
              '/portable',
              ('/config:' + $config)
            ) `
            -WorkingDirectory $env:MT5_ROOT `
            -PassThru

          Write-Host "MT5 PID: $($process.Id)"

          $deadline = (Get-Date).AddMinutes(15)

          $report = $null

          while ((Get-Date) -lt $deadline) {

            $possibleReports = Get-ChildItem `
              $env:MT5_ROOT `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.BaseName -eq $reportName -and
                $_.Extension -in '.htm','.html','.xml'
              } |
              Sort-Object LastWriteTime -Descending

            if ($possibleReports) {
              $report = $possibleReports | Select-Object -First 1
              break
            }

            if ($process.HasExited) {
              Write-Host 'MT5 exited.'
              Write-Host "MT5 exit code: $($process.ExitCode)"
              break
            }

            Write-Host 'MT5 running; waiting for Strategy Tester report...'
            Start-Sleep -Seconds 10
          }

          $exitCode = $null

          if ($process.HasExited) {
            $exitCode = $process.ExitCode
          }

          @(
            "PID=$($process.Id)"
            "Exited=$($process.HasExited)"
            "ExitCode=$exitCode"
            "ReportFound=$([bool]$report)"
          ) |
            Set-Content `
            (Join-Path $evidence 'mt5-process-result.txt') `
            -Encoding UTF8

          if ($report) {

            Write-Host "===== REPORT FOUND ====="
            Write-Host $report.FullName
            Write-Host "Size: $($report.Length) bytes"
            Write-Host '========================'

            Copy-Item `
              $report.FullName `
              (Join-Path $evidence $report.Name) `
              -Force

            Write-Host 'PHASE 7 STRATEGY TESTER REPORT CREATED.'

          }
          else {

            Write-Host 'NO STRATEGY TESTER REPORT FOUND.'

            if ($process.HasExited) {
              Write-Host "MT5 exit code: $($process.ExitCode)"
            }

            throw 'MT5 did not produce a Strategy Tester report.'
          }

      - name: Capture Phase 7 diagnostics
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $evidence = Join-Path `
            $env:GITHUB_WORKSPACE `
            'phase7-validation-evidence'

          Write-Host '===== MT5 FILE TREE ====='

          Get-ChildItem `
            $env:MT5_ROOT `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Extension -in '.log','.htm','.html','.xml','.ini'
            } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 300 |
            ForEach-Object {

              Write-Host $_.FullName

              $safeName = $_.FullName.Substring(
                $env:MT5_ROOT.Length
              ).TrimStart('\') -replace '[\\/:*?"<>|]', '_'

              Copy-Item `
                $_.FullName `
                (Join-Path $evidence $safeName) `
                -Force `
                -ErrorAction SilentlyContinue
            }

          Write-Host '===== WINDOWS MT5 ERRORS ====='

          try {

            Get-WinEvent `
              -FilterHashtable @{
                LogName = 'Application'
                StartTime = (Get-Date).AddMinutes(-25)
              } `
              -ErrorAction Stop |
              Where-Object {
                $_.ProviderName -match 'Application Error|Windows Error Reporting' -and
                $_.Message -match 'terminal64|metatester|metaquotes'
              } |
              Select-Object -First 50 |
              Format-List `
                TimeCreated,
                ProviderName,
                Id,
                Message |
              Out-String |
              Set-Content `
                (Join-Path $evidence 'windows-mt5-errors.txt') `
                -Encoding UTF8

          }
          catch {

            "Windows event collection unavailable: $($_.Exception.Message)" |
              Set-Content `
              (Join-Path $evidence 'windows-mt5-errors.txt') `
              -Encoding UTF8
          }

          'PHASE7_DIAGNOSTICS_COMPLETE' |
            Set-Content `
            (Join-Path $evidence 'diagnostic-status.txt') `
            -Encoding UTF8

      - name: Upload Phase 7 validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-Phase7-Runtime-Validation
          path: phase7-validation-evidence
          if-no-files-found: warn
          retention-days: 14
