name: KingsBot Phase 7 Runtime Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase7:
    name: Phase 7 Runtime Validation
    runs-on: windows-2022
    timeout-minutes: 45

    env:
      MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
      MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
      MT5_SERVER: ${{ secrets.MT5_SERVER }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create evidence directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path "$env:GITHUB_WORKSPACE\phase7-evidence" -Force | Out-Null

      - name: Verify repository source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $source = "$env:GITHUB_WORKSPACE\KingsBot_Phase6_Integration.mq5"

          if (!(Test-Path -LiteralPath $source)) {
            throw "Missing source: $source"
          }

          $includes = @(
            'KB_StrategySignal.mqh'
            'KingsBot_Strategy_Swing.mqh'
            'KingsBot_Strategy_Structure.mqh'
            'KingsBot_Strategy_Liquidity.mqh'
            'KingsBot_Strategy_OrderBlock.mqh'
            'KingsBot_Strategy_FVG.mqh'
            'KingsBot_DecisionEngine.mqh'
            'KingsBot_RiskManager.mqh'
          )

          foreach ($include in $includes) {
            $path = "$env:GITHUB_WORKSPACE\$include"

            if (!(Test-Path -LiteralPath $path)) {
              throw "Missing include: $include"
            }
          }

          Get-ChildItem "$env:GITHUB_WORKSPACE" -File |
            Select-Object Name,Length,LastWriteTime |
            Format-Table -AutoSize |
            Out-String |
            Set-Content "$env:GITHUB_WORKSPACE\phase7-evidence\repository-files.txt"

      - name: Download MetaTrader 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = "$env:RUNNER_TEMP\mt5setup.exe"

          Invoke-WebRequest `
            -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" `
            -OutFile $installer `
            -UseBasicParsing

          if (!(Test-Path -LiteralPath $installer)) {
            throw "MT5 installer was not downloaded."
          }

          $size = (Get-Item -LiteralPath $installer).Length

          Write-Host "Installer size: $size bytes"

          if ($size -lt 1000000) {
            throw "MT5 installer appears invalid."
          }

          "Installer=$installer`nSize=$size" |
            Set-Content "$env:GITHUB_WORKSPACE\phase7-evidence\installer.txt"

          "MT5_INSTALLER=$installer" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $process = Start-Process `
            -FilePath $env:MT5_INSTALLER `
            -ArgumentList "/auto" `
            -Wait `
            -PassThru

          Write-Host "MT5 installer exit code: $($process.ExitCode)"

          "ExitCode=$($
