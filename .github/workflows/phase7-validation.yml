name: KingsBot Phase 7 Runtime Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase7:
    name: Phase 7 MT5 Runtime Validation
    runs-on: windows-2022
    timeout-minutes: 45

    env:
      MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
      MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
      MT5_SERVER: ${{ secrets.MT5_SERVER }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $evidence = Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence'

          New-Item `
            -ItemType Directory `
            -Path $evidence `
            -Force |
            Out-Null

          "Phase 7 started: $(Get-Date -Format o)" |
            Set-Content (Join-Path $evidence 'start.txt')

      - name: Verify KingsBot source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Join-Path `
            $env:GITHUB_WORKSPACE `
            'KingsBot_Phase6_Integration.mq5'

          if (!(Test-Path -LiteralPath $source)) {
            throw "KingsBot source not found: $source"
          }

          $required = @(
            'KB_StrategySignal.mqh'
            'KingsBot_Strategy_Swing.mqh'
            'KingsBot_Strategy_Structure.mqh'
            'KingsBot_Strategy_Liquidity.mqh'
            'KingsBot_Strategy_OrderBlock.mqh'
            'KingsBot_Strategy_FVG.mqh'
            'KingsBot_DecisionEngine.mqh'
            'KingsBot_RiskManager.mqh'
          )

          foreach ($name in $required) {
            $file = Join-Path `
              $env:GITHUB_WORKSPACE `
              $name

            if (!(Test-Path -LiteralPath $file)) {
              throw "Required include not found: $name"
            }
          }

          Write-Host 'KingsBot source and required includes verified.'

      - name: Download MT5 installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path `
            $env:RUNNER_TEMP `
            'mt5setup.exe'

          Write-Host 'Downloading official MetaTrader 5 installer...'

          Invoke-WebRequest `
            -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' `
            -OutFile $installer `
            -UseBasicParsing

          if (!(Test-Path -LiteralPath $installer)) {
            throw 'MT5 installer download failed.'
          }

          $size = (Get-Item -LiteralPath $installer).Length

          Write-Host "Installer size: $size bytes"

          if ($size -lt 1000000) {
            throw "Downloaded MT5 installer is invalid: $size bytes"
          }

          "Installer size: $size bytes" |
            Set-Content "$env:GITHUB_WORKSPACE\phase7-evidence\installer.txt"

          "INSTALLER=$installer" |
            Out-File $env:GITHUB_ENV `
            -Append `
            -Encoding utf8

      - name: Install MT5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host 'Starting MT5 unattended installation...'

          $process = Start-Process `
            -FilePath $env:INSTALLER `
            -ArgumentList '/auto' `
            -Wait `
            -PassThru

          Write-Host "MT5 installer exit code: $($process.ExitCode)"

          "MT5 installer exit code: $($process.ExitCode)" |
            Set-Content "$env:GITHUB_WORKSPACE\phase7-evidence\installer-exit.txt"

          Start-Sleep -Seconds 5

      - name: Locate MT5 executables
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $roots = @(
            'C:\Program Files'
            'C:\Program Files (x86)'
            'C:\MT5'
            $env:LOCALAPPDATA
            $env:APPDATA
            $env:RUNNER_TEMP
          )

          $metaEditor = $null
          $terminal = $null

          foreach ($root in $roots) {
            if (!(Test-Path -LiteralPath $root)) {
              continue
            }

            if ($null -eq $metaEditor) {
              $metaEditor = Get-ChildItem `
                -LiteralPath $root `
                -Filter 'metaeditor64.exe' `
                -File `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1
            }

            if ($null -eq $terminal) {
              $terminal = Get-ChildItem `
                -LiteralPath $root `
                -Filter 'terminal64.exe' `
                -File `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1
            }

            if ($null -ne $metaEditor -and $null -ne $terminal) {
              break
            }
          }

          if ($null -eq $metaEditor) {
            throw 'metaeditor64.exe was not found.'
          }

          if ($null -eq $terminal) {
            throw 'terminal64.exe was not found.'
          }

          $mt5Root = $terminal.Directory.FullName

          Write-Host "MetaEditor: $($metaEditor.FullName)"
          Write-Host "Terminal: $($terminal.FullName)"
          Write-Host "MT5 root: $mt5Root"

          "METAEDITOR=$($metaEditor.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "MT5_TERMINAL=$($terminal.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "MT5_ROOT=$mt5Root" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Prepare Expert source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $experts = Join-Path `
            $env:MT5_ROOT `
            'MQL5\Experts\KingsBot'

          New-Item `
            -ItemType Directory `
            -Path $experts `
            -Force |
            Out-Null

          Copy-Item `
            -LiteralPath "$env:GITHUB_WORKSPACE\KingsBot_Phase6_Integration.mq5" `
            -Destination "$experts\KingsBot_Phase6_Integration.mq5" `
            -Force

          Get-ChildItem `
            -LiteralPath $env:GITHUB_WORKSPACE `
            -Filter '*.mqh' `
            -File |
            ForEach-Object {
              Copy-Item `
                -LiteralPath $_.FullName `
                -Destination $experts `
                -Force
            }

          $expert = Join-Path `
            $experts `
            'KingsBot_Phase6_Integration.mq5'

          if (!(Test-Path -LiteralPath $expert)) {
            throw "Prepared MQ5 source is missing: $expert"
          }

          Write-Host "Prepared Expert: $expert"

          "EXPERT=$expert" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "EXPERTS=$experts" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Compile KingsBot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $evidence = "$env:GITHUB_WORKSPACE\phase7-evidence"
          $compileLog = "$evidence\metaeditor-output.txt"

          Write-Host "Compiling:"
          Write-Host $env:EXPERT

          $arguments = @(
            "/compile:$env:EXPERT"
            '/log'
          )

          $process = Start-Process `
            -FilePath $env:METAEDITOR `
            -ArgumentList $arguments `
            -WorkingDirectory $env:EXPERTS `
            -Wait `
            -PassThru

          Write-Host "MetaEditor exit code: $($process.ExitCode)"

          Start-Sleep -Seconds 5

          @(
            "MetaEditor: $env:METAEDITOR"
            "Source: $env:EXPERT"
            "Working directory: $env:EXPERTS"
            "Exit code: $($process.ExitCode)"
            ''
            'EX5 search follows.'
          ) |
            Set-Content $compileLog

          $searchRoots = @(
            $env:MT5_ROOT
            $env:RUNNER_TEMP
            $env:GITHUB_WORKSPACE
          )

          $matches = @()

          foreach ($root in $searchRoots) {
            if (Test-Path -LiteralPath $root) {
              $found = Get-ChildItem `
                -LiteralPath $root `
                -Filter 'KingsBot_Phase6_Integration.ex5' `
                -File `
                -Recurse `
                -ErrorAction SilentlyContinue

              if ($null -ne $found) {
                $matches += $found
              }
            }
          }

          $matches = @(
            $matches |
            Sort-Object LastWriteTime -Descending |
            Select-Object -Unique FullName
          )

          if ($matches.Count -eq 0) {
            Write-Host 'No KingsBot EX5 was found.'

            Get-ChildItem `
              -LiteralPath $env:MT5_ROOT `
              -Filter '*.log' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 20 |
              ForEach-Object {
                Add-Content $compileLog ''
                Add-Content $compileLog "===== $($_.FullName) ====="

                Get-Content `
                  -LiteralPath $_.FullName `
                  -ErrorAction SilentlyContinue |
                  Add-Content $compileLog
              }

            throw "MetaEditor exit code was $($process.ExitCode), but KingsBot_Phase6_Integration.ex5 was not found."
          }

          $ex5 = $matches[0].FullName

          Write-Host "EX5 FOUND: $ex5"

          Add-Content $compileLog ''
          Add-Content $compileLog "EX5 FOUND: $ex5"

          Copy-Item `
            -LiteralPath $ex5 `
            -Destination "$evidence\KingsBot_Phase6_Integration.ex5" `
            -Force

          "EX5=$ex5" |
            Set-Content "$evidence\ex5-location.txt"

      - name: Verify MT5 secrets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:MT5_LOGIN)) {
            throw 'GitHub Actions secret MT5_LOGIN is missing.'
          }

          if ([string]::IsNullOrWhiteSpace($env:MT5_PASSWORD)) {
            throw 'GitHub Actions secret MT5_PASSWORD is missing.'
          }

          if ([string]::IsNullOrWhiteSpace($env:MT5_SERVER)) {
            throw 'GitHub Actions secret MT5_SERVER is missing.'
          }

          Write-Host 'MT5 credentials are present.'

      - name: Create Strategy Tester configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $config = "$env:MT5_ROOT\KingsBot_Phase7_Tester.ini"

          $lines = @(
            '[Common]'
            "Login=$env:MT5_LOGIN"
            "Password=$env:MT5_PASSWORD"
            "Server=$env:MT5_SERVER"
            'KeepPrivate=1'
            'NewsEnable=0'
            ''
            '[Tester]'
            'Expert=KingsBot\KingsBot_Phase6_Integration.ex5'
            'Symbol=EURUSD'
            'Period=M15'
            'Model=4'
            'Optimization=0'
            'FromDate=2025.01.01'
            'ToDate=2026.08.01'
            'Deposit=10000'
            'Currency=USD'
            'Leverage=1:100'
            'Visual=0'
            'Report=KingsBot_Phase7_Tester.htm'
            'ReplaceReport=1'
            'ShutdownTerminal=1'
          )

          $lines |
            Set-Content `
              -LiteralPath $config `
              -Encoding Unicode

          if (!(Test-Path -LiteralPath $config)) {
            throw "Tester configuration was not created: $config"
          }

          Copy-Item `
            -LiteralPath $config `
            -Destination "$env:GITHUB_WORKSPACE\phase7-evidence\" `
            -Force

          "TESTER_CONFIG=$config" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run Strategy Tester
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $report = "$env:MT5_ROOT\KingsBot_Phase7_Tester.htm"

          Remove-Item `
            -LiteralPath $report `
            -Force `
            -ErrorAction SilentlyContinue

          Write-Host 'Launching MT5 Strategy Tester...'

          $process = Start-Process `
            -FilePath $env:MT5_TERMINAL `
            -ArgumentList @(
              '/portable'
              "/config:$env:TESTER_CONFIG"
            ) `
            -WorkingDirectory $env:MT5_ROOT `
            -PassThru

          Write-Host "MT5 PID: $($process.Id)"

          $deadline = (Get-Date).AddMinutes(20)

          while ((Get-Date) -lt $deadline) {
            if (Test-Path -LiteralPath $report) {
              break
            }

            Start-Sleep -Seconds 10
          }

          if (!(Test-Path -LiteralPath $report)) {
            throw 'NO TESTER REPORT FOUND.'
          }

          $size = (Get-Item -LiteralPath $report).Length

          if ($size -le 0) {
            throw 'Strategy Tester report is empty.'
          }

          Write-Host "Tester report found: $size bytes"

          Copy-Item `
            -LiteralPath $report `
            -Destination "$env:GITHUB_WORKSPACE\phase7-evidence\" `
            -Force

      - name: Collect diagnostics
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $evidence = "$env:GITHUB_WORKSPACE\phase7-evidence"

          if ($env:MT5_ROOT -and (Test-Path -LiteralPath $env:MT5_ROOT)) {
            Get-ChildItem `
              -LiteralPath $env:MT5_ROOT `
              -Recurse `
              -File `
              -Include '*.log','*.ini','*.htm','*.html' `
              -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 100 |
              ForEach-Object {
                Copy-Item `
                  -LiteralPath $_.FullName `
                  -Destination $evidence `
                  -Force `
                  -ErrorAction SilentlyContinue
              }
          }

          "Finished: $(Get-Date -Format o)" |
            Set-Content "$evidence\finish.txt"

      - name: Upload Phase 7 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-Phase7-Evidence
          path: phase7-evidence
          if-no-files-found: warn
          retention-days: 14
