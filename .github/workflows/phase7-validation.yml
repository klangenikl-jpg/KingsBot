name: King's Bot - Phase 7 Runtime Validation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase7-runtime-validation:
    name: Phase 7 Runtime and Strategy Tester Validation
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout King's Bot
        uses: actions/checkout@v4

      - name: Locate and install MT5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          $root = Join-Path $env:RUNNER_TEMP 'KingsBot-MT5'

          Invoke-WebRequest `
            -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' `
            -OutFile $installer `
            -UseBasicParsing

          if (Test-Path $root) {
            Remove-Item $root -Recurse -Force
          }

          New-Item -ItemType Directory -Path $root -Force | Out-Null

          $install = Start-Process `
            -FilePath $installer `
            -ArgumentList @('/auto',('/path:' + $root)) `
            -Wait `
            -PassThru

          Write-Host "MT5 installer exit code: $($install.ExitCode)"

          $terminal = Get-ChildItem `
            $root `
            -Recurse `
            -File `
            -Filter 'terminal64.exe' `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          $editor = Get-ChildItem `
            $root `
            -Recurse `
            -File `
            -Filter 'metaeditor64.exe' `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $terminal) {
            throw 'MetaTrader 5 terminal64.exe was not found.'
          }

          if (-not $editor) {
            throw 'MetaEditor metaeditor64.exe was not found.'
          }

          "MT5_ROOT=$($terminal.Directory.FullName)" |
            Out-File $env:GITHUB_ENV -Append

          "METAEDITOR=$($editor.FullName)" |
            Out-File $env:GITHUB_ENV -Append

          Write-Host "MT5_ROOT=$($terminal.Directory.FullName)"
          Write-Host "METAEDITOR=$($editor.FullName)"

      - name: Prepare Phase 7 evidence directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $evidence = Join-Path `
            $env:GITHUB_WORKSPACE `
            'phase7-validation-evidence'

          New-Item `
            -ItemType Directory `
            -Path $evidence `
            -Force |
            Out-Null

      - name: Compile King's Bot and verify EX5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $evidence = Join-Path `
            $env:GITHUB_WORKSPACE `
            'phase7-validation-evidence'

          $source = Get-ChildItem `
            $env:GITHUB_WORKSPACE `
            -Recurse `
            -File `
            -Filter 'KingsBot_Phase6_Integration.mq5' `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $source) {
            throw 'KingsBot_Phase6_Integration.mq5 was not found.'
          }

          $target = Join-Path `
            $env:MT5_ROOT `
            'MQL5\Experts\KingsBot'

          New-Item `
            -ItemType Directory `
            -Path $target `
            -Force |
            Out-Null

          Copy-Item `
            (Join-Path $source.Directory.FullName '*') `
            $target `
            -Recurse `
            -Force

          $mq5 = Join-Path `
            $target `
            'KingsBot_Phase6_Integration.mq5'

          $ex5 = Join-Path `
            $target `
            'KingsBot_Phase6_Integration.ex5'

          Remove-Item `
            $ex5 `
            -Force `
            -ErrorAction SilentlyContinue

          $compile = Start-Process `
            -FilePath $env:METAEDITOR `
            -ArgumentList @(
              ('/compile:' + $mq5),
              '/log'
            ) `
            -WorkingDirectory $target `
            -Wait `
            -PassThru

          Start-Sleep -Seconds 2

          Write-Host "MetaEditor exit code: $($compile.ExitCode)"

          $log = Get-ChildItem `
            $target `
            -File `
            -Filter '*.log' `
            -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if ($log) {
            Copy-Item `
              $log.FullName `
              (Join-Path $evidence 'compiler.log') `
              -Force

            Get-Content $log.FullName
          }

          if (-not (Test-Path $ex5)) {
            throw 'Compilation did not produce KingsBot_Phase6_Integration.ex5.'
          }

          $ex5Size = (Get-Item $ex5).Length

          if ($ex5Size -le 0) {
            throw 'Compiled EX5 is empty.'
          }

          Copy-Item `
            $ex5 `
            $evidence `
            -Force

          @(
            "METAEDITOR_EXIT_CODE=$($compile.ExitCode)"
            "EX5_SIZE_BYTES=$ex5Size"
            "SOURCE=$($source.FullName)"
            "EX5=$ex5"
          ) |
            Set-Content `
              (Join-Path $evidence 'build-summary.txt') `
              -Encoding ASCII

      - name: Prepare clean MT5 tester configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $evidence = Join-Path `
            $env:GITHUB_WORKSPACE `
            'phase7-validation-evidence'

          $config = Join-Path `
            $env:MT5_ROOT `
            'KingsBot_Phase7_Tester.ini'

          $reportRelative = 'phase7-report.htm'
          $reportAbsolute = Join-Path `
            $env:MT5_ROOT `
            $reportRelative

          Remove-Item `
            $reportAbsolute `
            -Force `
            -ErrorAction SilentlyContinue

          @(
            '[Tester]'
            'Expert=KingsBot\KingsBot_Phase6_Integration.ex5'
            'Symbol=EURUSD'
            'Period=M15'
            'Model=0'
            'Optimization=0'
            'FromDate=2025.01.01'
            'ToDate=2026.08.01'
            'Deposit=10000'
            'Currency=USD'
            'Leverage=1:100'
            'Visual=0'
            'Report=phase7-report'
            'ReplaceReport=1'
            'ShutdownTerminal=1'
          ) |
            Set-Content `
              $config `
              -Encoding ASCII

          Copy-Item `
            $config `
            (Join-Path $evidence 'KingsBot_Phase7_Tester.ini') `
            -Force

          Write-Host '===== PHASE 7 TESTER CONFIG ====='
          Get-Content $config
          Write-Host '=================================='

      - name: Run MT5 Strategy Tester
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $evidence = Join-Path `
            $env:GITHUB_WORKSPACE `
            'phase7-validation-evidence'

          $terminal = Get-ChildItem `
            (Join-Path $env:RUNNER_TEMP 'KingsBot-MT5') `
            -Recurse `
            -File `
            -Filter 'terminal64.exe' `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $terminal) {
            throw 'MT5 terminal64.exe was not found.'
          }

          $config = Join-Path `
            $env:MT5_ROOT `
            'KingsBot_Phase7_Tester.ini'

          $report = Join-Path `
            $env:MT5_ROOT `
            'phase7-report.htm'

          Write-Host "Terminal: $($terminal.FullName)"
          Write-Host "Config: $config"
          Write-Host "Expected report: $report"

          $tester = Start-Process `
            -FilePath $terminal.FullName `
            -ArgumentList @(
              '/portable',
              ('/config:' + $config)
            ) `
            -WorkingDirectory $env:MT5_ROOT `
            -PassThru

          Write-Host "MT5 tester process started with PID $($tester.Id)."

          $deadline = (Get-Date).AddMinutes(12)
          $reportFound = $false

          while ((Get-Date) -lt $deadline) {

            if (Test-Path $report) {
              $reportFound = $true
              break
            }

            if ($tester.HasExited) {
              Write-Host "MT5 terminal exited with code $($tester.ExitCode)."
              break
            }

            Write-Host "Waiting for Strategy Tester report..."
            Start-Sleep -Seconds 10
          }

          if ($reportFound) {

            $size = (Get-Item $report).Length

            if ($size -le 0) {
              throw 'Strategy Tester report exists but is empty.'
            }

            Copy-Item `
              $report `
              (Join-Path $evidence 'KingsBot_Phase7_Tester.htm') `
              -Force

            @(
              'TESTER_RESULT=REPORT_FOUND'
              "REPORT_SIZE_BYTES=$size"
              "MT5_PROCESS_EXITED=$($tester.HasExited)"
            ) |
              Set-Content `
                (Join-Path $evidence 'tester-result.txt') `
                -Encoding ASCII

            Write-Host "SUCCESS: Strategy Tester report found."
            Write-Host "Report size: $size bytes"

            if (-not $tester.HasExited) {
              Stop-Process `
                -Id $tester.Id `
                -Force `
                -ErrorAction SilentlyContinue
            }

          } else {

            @(
              'TESTER_RESULT=REPORT_NOT_FOUND'
              "MT5_PROCESS_EXITED=$($tester.HasExited)"
              "MT5_PROCESS_ID=$($tester.Id)"
              "EXPECTED_REPORT=$report"
            ) |
              Set-Content `
                (Join-Path $evidence 'tester-result.txt') `
                -Encoding ASCII

            Write-Host 'Strategy Tester report was not produced.'

            if (Test-Path $env:MT5_ROOT) {
              Get-ChildItem `
                $env:MT5_ROOT `
                -Recurse `
                -File `
                -ErrorAction SilentlyContinue |
                Where-Object {
                  $_.FullName -match 'Logs|Tester'
                } |
                Sort-Object LastWriteTime -Descending |
                Select-Object -First 30 |
                ForEach-Object {
                  Write-Host $_.FullName
                }
            }

            if (-not $tester.HasExited) {
              Stop-Process `
                -Id $tester.Id `
                -Force `
                -ErrorAction SilentlyContinue
            }

            throw 'MT5 started but did not produce the expected Strategy Tester report.'
          }

      - name: Collect MT5 and Strategy Tester logs
        if: always()
        shell: pwsh
        run: |
          $evidence = Join-Path `
            $env:GITHUB_WORKSPACE `
            'phase7-validation-evidence'

          $roots = @(
            $env:MT5_ROOT,
            (Join-Path $env:MT5_ROOT 'Logs'),
            (Join-Path $env:MT5_ROOT 'Tester')
          )

          foreach ($root in $roots) {

            if (Test-Path $root) {

              Get-ChildItem `
                $root `
                -Recurse `
                -File `
                -ErrorAction SilentlyContinue |
                Where-Object {
                  $_.Extension -in '.log','.htm','.html','.xml'
                } |
                Sort-Object LastWriteTime -Descending |
                Select-Object -First 50 |
                ForEach-Object {

                  $safeName = $_.Name

                  try {
                    Copy-Item `
                      $_.FullName `
                      (Join-Path $evidence $safeName) `
                      -Force `
                      -ErrorAction Stop
                  }
                  catch {
                    Write-Host "Could not copy $($_.FullName)"
                  }
                }
            }
          }

          'PHASE7_RUNTIME_EVIDENCE_COLLECTION=COMPLETE' |
            Set-Content `
              (Join-Path $evidence 'runtime-validation.txt') `
              -Encoding ASCII

      - name: Upload Phase 7 validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-Phase7-Runtime-Validation
          path: phase7-validation-evidence
          if-no-files-found: warn
          retention-days: 14
