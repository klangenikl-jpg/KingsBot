name: King's Bot - Phase 7 Runtime Validation

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  MT5_DIR: C:\MT5
  BOT_SOURCE_NAME: KingsBot_Phase6_Integration.mq5
  EX5_NAME: KingsBot_Phase6_Integration.ex5

jobs:
  phase7:
    name: Phase 7 Runtime and Strategy Tester
    runs-on: windows-latest
    timeout-minutes: 50

    env:
      MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
      MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
      MT5_SERVER: ${{ secrets.MT5_SERVER }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare evidence
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $evidence = Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence'

          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          New-Item -ItemType Directory -Path "$evidence\MT5-Logs" -Force | Out-Null
          New-Item -ItemType Directory -Path "$evidence\Tester-Logs" -Force | Out-Null

          Write-Host "Evidence directory: $evidence"

      - name: Verify MT5 secrets
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:MT5_LOGIN)) {
            throw 'MT5_LOGIN secret is missing.'
          }

          if ([string]::IsNullOrWhiteSpace($env:MT5_PASSWORD)) {
            throw 'MT5_PASSWORD secret is missing.'
          }

          if ([string]::IsNullOrWhiteSpace($env:MT5_SERVER)) {
            throw 'MT5_SERVER secret is missing.'
          }

          Write-Host 'MT5 credentials are present.'

      - name: Locate source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter $env:BOT_SOURCE_NAME `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $source) {
            throw "Source not found: $env:BOT_SOURCE_NAME"
          }

          Write-Host "SOURCE: $($source.FullName)"

          "BOT_SOURCE=$($source.FullName)" |
            Out-File $env:GITHUB_ENV -Encoding utf8

      - name: Download MT5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'

          Write-Host 'Downloading MetaTrader 5 installer...'

          Invoke-WebRequest -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' -OutFile $installer -UseBasicParsing -TimeoutSec 180

          if (-not (Test-Path -LiteralPath $installer)) {
            throw 'MT5 installer was not downloaded.'
          }

          $size = (Get-Item -LiteralPath $installer).Length

          Write-Host "Installer size: $size bytes"

          if ($size -lt 100000) {
            throw "MT5 installer is unexpectedly small: $size bytes"
          }

          "MT5_INSTALLER=$installer" |
            Out-File $env:GITHUB_ENV -Encoding utf8

      - name: Install MT5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Remove-Item `
            -LiteralPath $env:MT5_DIR `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Path $env:MT5_DIR `
            -Force |
            Out-Null

          Write-Host "Installing MT5 into $env:MT5_DIR"

          $p = Start-Process `
            -FilePath $env:MT5_INSTALLER `
            -ArgumentList "/auto /path:$env:MT5_DIR" `
            -Wait `
            -PassThru

          Write-Host "MT5 installer exit code: $($p.ExitCode)"

          Start-Sleep -Seconds 10

          $terminal = Get-ChildItem `
            -Path $env:MT5_DIR `
            -Filter 'terminal64.exe' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $terminal) {
            throw "terminal64.exe was not found under $env:MT5_DIR"
          }

          Write-Host "MT5 TERMINAL FOUND: $($terminal.FullName)"

          $editor = Get-ChildItem `
            -Path $env:MT5_DIR `
            -Filter 'metaeditor64.exe' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $editor) {
            throw "metaeditor64.exe was not found under $env:MT5_DIR"
          }

          Write-Host "METAEDITOR FOUND: $($editor.FullName)"

      - name: Prepare EA
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $expertDir = Join-Path `
            $env:MT5_DIR `
            'MQL5\Experts\KingsBot'

          New-Item `
            -ItemType Directory `
            -Path $expertDir `
            -Force |
            Out-Null

          $sourceRoot = Split-Path `
            $env:BOT_SOURCE `
            -Parent

          Copy-Item `
            -Path (Join-Path $sourceRoot '*') `
            -Destination $expertDir `
            -Recurse `
            -Force

          $expertSource = Join-Path `
            $expertDir `
            $env:BOT_SOURCE_NAME

          if (-not (Test-Path -LiteralPath $expertSource)) {
            throw "EA source was not copied: $expertSource"
          }

          Write-Host "EXPERT SOURCE: $expertSource"

          "EXPERT_SOURCE=$expertSource" |
            Out-File $env:GITHUB_ENV -Encoding utf8

      - name: Compile EA
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $editor = Get-ChildItem `
            -Path $env:MT5_DIR `
            -Filter 'metaeditor64.exe' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $editor) {
            throw "metaeditor64.exe not found under $env:MT5_DIR"
          }

          $evidence = Join-Path `
            $env:GITHUB_WORKSPACE `
            'phase7-evidence'

          $compileLog = Join-Path `
            $env:RUNNER_TEMP `
            'KingsBot-MetaEditor.log'

          Write-Host "EDITOR: $($editor.FullName)"
          Write-Host "SOURCE: $env:EXPERT_SOURCE"

          $p = Start-Process `
            -FilePath $editor.FullName `
            -ArgumentList @(
              '/portable'
              "/compile:$env:EXPERT_SOURCE"
              "/log:$compileLog"
            ) `
            -WorkingDirectory $env:MT5_DIR `
            -Wait `
            -PassThru

          Write-Host "MetaEditor exit code: $($p.ExitCode)"

          Start-Sleep -Seconds 5

          if (Test-Path -LiteralPath $compileLog) {
            Copy-Item `
              -LiteralPath $compileLog `
              -Destination (Join-Path $evidence 'compile.log') `
              -Force

            Get-Content `
              -LiteralPath $compileLog
          }

      - name: Verify EX5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $ex5 = Get-ChildItem `
            -Path $env:MT5_DIR `
            -Filter $env:EX5_NAME `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $ex5) {
            throw "Compiled EX5 not found: $env:EX5_NAME"
          }

          Write-Host "EX5: $($ex5.FullName)"
          Write-Host "SIZE: $($ex5.Length) bytes"

          if ($ex5.Length -lt 1000) {
            throw "EX5 is unexpectedly small."
          }

          Copy-Item `
            -LiteralPath $ex5.FullName `
            -Destination (Join-Path `
              $env:GITHUB_WORKSPACE `
              "phase7-evidence\$env:EX5_NAME") `
            -Force

      - name: Create tester configuration
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $config = Join-Path `
            $env:MT5_DIR `
            'KingsBot_Phase7_Tester.ini'

          @(
            '[Common]'
            "Login=$env:MT5_LOGIN"
            "Password=$env:MT5_PASSWORD"
            "Server=$env:MT5_SERVER"
            ''
            '[Tester]'
            'Expert=KingsBot\KingsBot_Phase6_Integration.ex5'
            'Symbol=EURUSD'
            'Period=M15'
            'Model=0'
            'Optimization=0'
            'FromDate=2025.01.01'
            'ToDate=2026.08.01'
            'ForwardMode=0'
            'Deposit=10000'
            'Currency=USD'
            'Leverage=1:100'
            'Report=KingsBot_Phase7_Tester'
            'ReplaceReport=1'
            'ShutdownTerminal=1'
            'Visual=0'
            'UseCloud=0'
          ) |
            Set-Content `
              -LiteralPath $config `
              -Encoding ASCII

          Copy-Item `
            -LiteralPath $config `
            -Destination (Join-Path `
              $env:GITHUB_WORKSPACE `
              'phase7-evidence\KingsBot_Phase7_Tester.ini') `
              -Force

          Write-Host "CONFIG: $config"

      - name: Run Phase 7 Tester
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $evidence = Join-Path `
            $env:GITHUB_WORKSPACE `
            'phase7-evidence'

          $testerEvidence = Join-Path `
            $evidence `
            'Tester-Logs'

          $mt5Evidence = Join-Path `
            $evidence `
            'MT5-Logs'

          # IMPORTANT:
          # Rediscover terminal64.exe here instead of relying on
          # an environment variable created by another step.
          $terminal = Get-ChildItem `
            -Path $env:MT5_DIR `
            -Filter 'terminal64.exe' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $terminal) {
            throw "terminal64.exe not found under $env:MT5_DIR"
          }

          $terminalPath = $terminal.FullName
          $terminalDir = Split-Path `
            -Path $terminalPath `
            -Parent

          Write-Host '========== PHASE 7 TESTER =========='
          Write-Host "MT5 TERMINAL: $terminalPath"
          Write-Host "MT5 DIRECTORY: $terminalDir"

          Get-Process `
            terminal64, `
            metatester64, `
            metatester `
            -ErrorAction SilentlyContinue |
            Stop-Process `
              -Force `
              -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 5

          $config = Join-Path `
            $env:MT5_DIR `
            'KingsBot_Phase7_Tester.ini'

          if (-not (Test-Path -LiteralPath $config)) {
            throw "Tester configuration not found: $config"
          }

          Write-Host '========== STARTING MT5 TESTER =========='

          $process = Start-Process `
            -FilePath $terminalPath `
            -ArgumentList @(
              '/portable'
              "/config:$config"
              "/login:$env:MT5_LOGIN"
            ) `
            -WorkingDirectory $terminalDir `
            -PassThru

          Write-Host "MT5 PID: $($process.Id)"

          $maxSeconds = 2400
          $interval = 10
          $elapsed = 0

          while ($elapsed -lt $maxSeconds) {

            Start-Sleep -Seconds $interval
            $elapsed += $interval

            $report = Get-ChildItem `
              -Path $env:MT5_DIR `
              -Filter 'KingsBot_Phase7_Tester*.htm' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1

            if ($null -ne $report -and $report.Length -gt 500) {

              Write-Host '========== TESTER REPORT FOUND =========='
              Write-Host "REPORT: $($report.FullName)"
              Write-Host "SIZE: $($report.Length) bytes"
              Write-Host "ELAPSED: $elapsed seconds"

              Copy-Item `
                -LiteralPath $report.FullName `
                -Destination (Join-Path `
                  $evidence `
                  'KingsBot_Phase7_Tester.htm') `
                -Force

              exit 0
            }

            $testerLog = Get-ChildItem `
              -Path "$env:MT5_DIR\Tester\logs" `
              -Filter '*.log' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1

            if ($null -ne $testerLog) {

              Copy-Item `
                -LiteralPath $testerLog.FullName `
                -Destination (Join-Path `
                  $testerEvidence `
                  'latest.log') `
                -Force

              $text = Get-Content `
                -LiteralPath $testerLog.FullName `
                -Raw `
                -ErrorAction SilentlyContinue

              if ($text -match 'invalid password|authorization failed') {
                throw 'MT5 Tester rejected the supplied credentials.'
              }

              if ($text -match 'account is not specified') {
                throw 'MT5 Tester rejected the account configuration.'
              }
            }

            $terminalLog = Get-ChildItem `
              -Path "$env:MT5_DIR\Logs" `
              -Filter '*.log' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1

            if ($null -ne $terminalLog) {
              Copy-Item `
                -LiteralPath $terminalLog.FullName `
                -Destination (Join-Path `
                  $mt5Evidence `
                  'latest.log') `
                -Force
            }

            $running = Get-Process `
              -Id $process.Id `
              -ErrorAction SilentlyContinue

            if ($null -eq $running) {
              throw 'MT5 exited before producing the Phase 7 Strategy Tester report.'
            }

            if (($elapsed % 60) -eq 0) {
              Write-Host "Tester running: $elapsed seconds"
            }
          }

          throw 'MT5 Strategy Tester did not produce a report within the 40-minute execution window.'

      - name: Capture final evidence
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'

          $evidence = Join-Path `
            $env:GITHUB_WORKSPACE `
            'phase7-evidence'

          New-Item `
            -ItemType Directory `
            -Path "$evidence\Tester-Logs" `
            -Force |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Path "$evidence\MT5-Logs" `
            -Force |
            Out-Null

          $testerLog = Get-ChildItem `
            -Path "$env:MT5_DIR\Tester\logs" `
            -Filter '*.log' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if ($null -ne $testerLog) {
            Copy-Item `
              -LiteralPath $testerLog.FullName `
              -Destination "$evidence\Tester-Logs\final-tester.log" `
              -Force
          }

          $terminalLog = Get-ChildItem `
            -Path "$env:MT5_DIR\Logs" `
            -Filter '*.log' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if ($null -ne $terminalLog) {
            Copy-Item `
              -LiteralPath $terminalLog.FullName `
              -Destination "$evidence\MT5-Logs\final-terminal.log" `
              -Force
          }

          Write-Host 'Final evidence captured.'

      - name: Stop MT5
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'

          Get-Process `
            terminal64, `
            metatester64, `
            metatester `
            -ErrorAction SilentlyContinue |
            Stop-Process `
              -Force `
              -ErrorAction SilentlyContinue

          Write-Host 'MT5 processes stopped.'

      - name: Upload Phase 7 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-Phase7-Evidence
          path: phase7-evidence/**
          if-no-files-found: warn
          retention-days: 14
