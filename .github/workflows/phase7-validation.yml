name: KingsBot Phase 7 Runtime Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase7:
    name: Phase 7 MT5 Runtime Validation
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence'
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          "Started $(Get-Date -Format o)" | Set-Content (Join-Path $evidence 'start.txt')

      - name: Verify KingsBot source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'KingsBot_Phase6_Integration.mq5'

          if (-not (Test-Path -LiteralPath $source)) {
            throw "Source not found: $source"
          }

          $required = @(
            'KB_StrategySignal.mqh'
            'KingsBot_Strategy_Swing.mqh'
            'KingsBot_Strategy_Structure.mqh'
            'KingsBot_Strategy_Liquidity.mqh'
            'KingsBot_Strategy_OrderBlock.mqh'
            'KingsBot_Strategy_FVG.mqh'
            'KingsBot_DecisionEngine.mqh'
            'KingsBot_RiskManager.mqh'
          )

          foreach ($name in $required) {
            $path = Join-Path $env:GITHUB_WORKSPACE $name

            if (-not (Test-Path -LiteralPath $path)) {
              throw "Required include not found: $name"
            }
          }

          $source | Set-Content (Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence\source.txt')

      - name: Download MT5 installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'

          Invoke-WebRequest `
            -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' `
            -OutFile $installer `
            -UseBasicParsing

          if (-not (Test-Path -LiteralPath $installer)) {
            throw 'MT5 installer download failed.'
          }

          $size = (Get-Item -LiteralPath $installer).Length

          if ($size -lt 1000000) {
            throw "MT5 installer is invalid or incomplete: $size bytes"
          }

          "Installer=$installer`nSize=$size" |
            Set-Content (Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence\installer.txt')

          "INSTALLER=$installer" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install MT5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $p = Start-Process `
            -FilePath $env:INSTALLER `
            -ArgumentList '/auto' `
            -Wait `
            -PassThru

          $code = $p.ExitCode

          Write-Host "MT5 installer exit code: $code"

          "MT5 installer exit code: $code" |
            Set-Content (Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence\installer-exit.txt')

          Start-Sleep -Seconds 5

      - name: Locate MT5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $roots = @(
            'C:\Program Files'
            'C:\Program Files (x86)'
            'C:\MT5'
            $env:LOCALAPPDATA
            $env:APPDATA
            $env:RUNNER_TEMP
          )

          $terminal = $null
          $editor = $null

          foreach ($root in $roots) {
            if (-not (Test-Path -LiteralPath $root)) {
              continue
            }

            if ($null -eq $terminal) {
              $terminal = Get-ChildItem `
                -LiteralPath $root `
                -Filter 'terminal64.exe' `
                -File `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1
            }

            if ($null -eq $editor) {
              $editor = Get-ChildItem `
                -LiteralPath $root `
                -Filter 'metaeditor64.exe' `
                -File `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1
            }

            if ($null -ne $terminal -and $null -ne $editor) {
              break
            }
          }

          if ($null -eq $terminal) {
            throw 'terminal64.exe was not found.'
          }

          if ($null -eq $editor) {
            throw 'metaeditor64.exe was not found.'
          }

          $root = $terminal.Directory.FullName

          "MT5_ROOT=$root" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "MT5_TERMINAL=$($terminal.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "METAEDITOR=$($editor.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          @(
            "MT5_ROOT=$root"
            "TERMINAL=$($terminal.FullName)"
            "METAEDITOR=$($editor.FullName)"
          ) |
            Set-Content (Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence\mt5.txt')

      - name: Prepare Expert
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $experts = Join-Path $env:MT5_ROOT 'MQL5\Experts\KingsBot'

          New-Item `
            -ItemType Directory `
            -Path $experts `
            -Force |
            Out-Null

          Copy-Item `
            -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'KingsBot_Phase6_Integration.mq5') `
            -Destination $experts `
            -Force

          Get-ChildItem `
            -LiteralPath $env:GITHUB_WORKSPACE `
            -Filter '*.mqh' `
            -File |
            ForEach-Object {
              Copy-Item `
                -LiteralPath $_.FullName `
                -Destination $experts `
                -Force
            }

          $expert = Join-Path `
            $experts `
            'KingsBot_Phase6_Integration.mq5'

          if (-not (Test-Path -LiteralPath $expert)) {
            throw "Expert source was not prepared: $expert"
          }

          "EXPERT=$expert" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "EXPERTS=$experts" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Compile KingsBot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $p = Start-Process `
            -FilePath $env:METAEDITOR `
            -ArgumentList "/compile:$env:EXPERT",'/log' `
            -WorkingDirectory $env:EXPERTS `
            -Wait `
            -PassThru

          Write-Host "MetaEditor exit code: $($p.ExitCode)"

          Start-Sleep -Seconds 3

          $ex5 = Join-Path `
            $env:EXPERTS `
            'KingsBot_Phase6_Integration.ex5'

          if (-not (Test-Path -LiteralPath $ex5)) {
            $found = Get-ChildItem `
              -LiteralPath $env:MT5_ROOT `
              -Filter 'KingsBot_Phase6_Integration.ex5' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if ($null -ne $found) {
              Copy-Item `
                -LiteralPath $found.FullName `
                -Destination $ex5 `
                -Force
            }
          }

          if (-not (Test-Path -LiteralPath $ex5)) {
            throw "Compilation did not produce KingsBot_Phase6_Integration.ex5. MetaEditor exit code: $($p.ExitCode)"
          }

          $size = (Get-Item -LiteralPath $ex5).Length

          if ($size -le 0) {
            throw 'KingsBot EX5 is empty.'
          }

          Copy-Item `
            -LiteralPath $ex5 `
            -Destination (Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence') `
            -Force

          "MetaEditorExit=$($p.ExitCode)`nEX5=$ex5`nSize=$size" |
            Set-Content (Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence\compile.txt')

      - name: Verify credentials
        shell: pwsh
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:MT5_LOGIN)) {
            throw 'MT5_LOGIN secret is missing.'
          }

          if ([string]::IsNullOrWhiteSpace($env:MT5_PASSWORD)) {
            throw 'MT5_PASSWORD secret is missing.'
          }

          if ([string]::IsNullOrWhiteSpace($env:MT5_SERVER)) {
            throw 'MT5_SERVER secret is missing.'
          }

      - name: Create tester configuration
        shell: pwsh
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
        run: |
          $ErrorActionPreference = 'Stop'

          $config = Join-Path `
            $env:MT5_ROOT `
            'KingsBot_Phase7_Tester.ini'

          $lines = @(
            '[Common]'
            "Login=$env:MT5_LOGIN"
            "Password=$env:MT5_PASSWORD"
            "Server=$env:MT5_SERVER"
            'KeepPrivate=1'
            'NewsEnable=0'
            ''
            '[Tester]'
            'Expert=KingsBot\KingsBot_Phase6_Integration.ex5'
            'Symbol=EURUSD'
            'Period=M15'
            'Model=4'
            'Optimization=0'
            'FromDate=2025.01.01'
            'ToDate=2026.08.01'
            'Deposit=10000'
            'Currency=USD'
            'Leverage=1:100'
            'Visual=0'
            'Report=KingsBot_Phase7_Tester.htm'
            'ReplaceReport=1'
            'ShutdownTerminal=1'
          )

          $lines |
            Set-Content `
              -LiteralPath $config `
              -Encoding Unicode

          if (-not (Test-Path -LiteralPath $config)) {
            throw 'Tester configuration was not created.'
          }

          Copy-Item `
            -LiteralPath $config `
            -Destination (Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence') `
            -Force

          "TESTER_CONFIG=$config" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run Strategy Tester
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $report = Join-Path `
            $env:MT5_ROOT `
            'KingsBot_Phase7_Tester.htm'

          Remove-Item `
            -LiteralPath $report `
            -Force `
            -ErrorAction SilentlyContinue

          $p = Start-Process `
            -FilePath $env:MT5_TERMINAL `
            -ArgumentList '/portable',"/config:$env:TESTER_CONFIG" `
            -WorkingDirectory $env:MT5_ROOT `
            -PassThru

          Write-Host "MT5 PID: $($p.Id)"

          $deadline = (Get-Date).AddMinutes(20)

          while ((Get-Date) -lt $deadline) {
            if (Test-Path -LiteralPath $report) {
              break
            }

            Start-Sleep -Seconds 10
          }

          if (-not (Test-Path -LiteralPath $report)) {
            throw 'NO TESTER REPORT FOUND.'
          }

          $size = (Get-Item -LiteralPath $report).Length

          if ($size -le 0) {
            throw 'Strategy Tester report is empty.'
          }

          Copy-Item `
            -LiteralPath $report `
            -Destination (Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence') `
            -Force

          Write-Host "TESTER REPORT FOUND: $size bytes"

      - name: Collect diagnostics
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $evidence = Join-Path `
            $env:GITHUB_WORKSPACE `
            'phase7-evidence'

          if ($env:MT5_ROOT -and (Test-Path -LiteralPath $env:MT5_ROOT)) {
            Get-ChildItem `
              -LiteralPath $env:MT5_ROOT `
              -Recurse `
              -File `
              -Include '*.log','*.ini','*.htm','*.html' `
              -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 100 |
              ForEach-Object {
                Copy-Item `
                  -LiteralPath $_.FullName `
                  -Destination $evidence `
                  -Force `
                  -ErrorAction SilentlyContinue
              }
          }

          Get-Process terminal64 -ErrorAction SilentlyContinue |
            Select-Object Id,CPU,StartTime,Path |
            Out-File (Join-Path $evidence 'terminal-process.txt')

          "Finished $(Get-Date -Format o)" |
            Set-Content (Join-Path $evidence 'finish.txt')

      - name: Upload Phase 7 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-Phase7-Evidence
          path: phase7-evidence
          if-no-files-found: warn
          retention-days: 14
