name: King's Bot - Phase 7 Runtime Validation

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  MT5_DIR: C:\MT5
  BOT_SOURCE_NAME: KingsBot_Phase6_Integration.mq5
  TEST_SYMBOL: EURUSD
  TEST_PERIOD: M15
  TEST_FROM: 2024.01.02
  TEST_TO: 2024.08.20

jobs:
  phase7:
    name: Phase 7 Runtime and Strategy Tester
    runs-on: windows-2025
    timeout-minutes: 35

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Locate King's Bot source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter $env:BOT_SOURCE_NAME `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $source) {
            throw "Could not find $env:BOT_SOURCE_NAME"
          }

          Write-Host "Source found:"
          Write-Host $source.FullName

          "BOT_SOURCE=$($source.FullName)" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare evidence directory
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $evidence = Join-Path `
            $env:GITHUB_WORKSPACE `
            'phase7-evidence'

          New-Item `
            -ItemType Directory `
            -Path $evidence `
            -Force |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Path (Join-Path $evidence 'MT5-Logs') `
            -Force |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Path (Join-Path $evidence 'Tester-Logs') `
            -Force |
            Out-Null

          Set-Content `
            -Path (Join-Path $evidence 'phase7-started.txt') `
            -Value "Phase 7 started: $(Get-Date -Format o)" `
            -Encoding UTF8

          "EVIDENCE_DIR=$evidence" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download MetaTrader 5 installer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path `
            $env:RUNNER_TEMP `
            'mt5setup.exe'

          $url = 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe'

          Write-Host 'Downloading MetaTrader 5 installer...'

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer `
            -UseBasicParsing `
            -TimeoutSec 180

          $item = Get-Item `
            -LiteralPath $installer `
            -ErrorAction SilentlyContinue

          if ($null -eq $item) {
            throw 'MT5 installer was not downloaded.'
          }

          if ($item.Length -lt 1000000) {
            throw "MT5 installer is unexpectedly small: $($item.Length) bytes"
          }

          Write-Host "Installer size: $($item.Length) bytes"

          "MT5_INSTALLER=$installer" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install MetaTrader 5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host 'Installing MetaTrader 5...'

          Remove-Item `
            -Path $env:MT5_DIR `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Path $env:MT5_DIR `
            -Force |
            Out-Null

          $arguments = @(
            '/auto'
            "/path:$env:MT5_DIR"
          )

          $process = Start-Process `
            -FilePath $env:MT5_INSTALLER `
            -ArgumentList $arguments `
            -Wait `
            -PassThru `
            -NoNewWindow

          $installerExit = $process.ExitCode

          Write-Host "MT5 installer exit code: $installerExit"

          Set-Content `
            -Path (Join-Path $env:EVIDENCE_DIR 'installer-exit-code.txt') `
            -Value $installerExit `
            -Encoding UTF8

          Start-Sleep -Seconds 5

          Write-Host 'Searching for installed MT5 executables...'

          $terminalItem = Get-ChildItem `
            -Path $env:MT5_DIR `
            -Filter 'terminal64.exe' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          $editorItem = Get-ChildItem `
            -Path $env:MT5_DIR `
            -Filter 'metaeditor64.exe' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $terminalItem) {
            Write-Host 'terminal64.exe NOT FOUND.'
          }
          else {
            Write-Host "terminal64.exe: $($terminalItem.FullName)"
          }

          if ($null -eq $editorItem) {
            Write-Host 'metaeditor64.exe NOT FOUND.'
          }
          else {
            Write-Host "metaeditor64.exe: $($editorItem.FullName)"
          }

          if ($null -eq $terminalItem -or $null -eq $editorItem) {

            Set-Content `
              -Path (Join-Path $env:EVIDENCE_DIR 'installation-result.txt') `
              -Value @(
                'MT5 INSTALLATION FAILED'
                "Installer exit code: $installerExit"
                'Required executables were not found.'
              ) `
              -Encoding UTF8

            throw `
              "MT5 installation failed. Exit code: $installerExit and required executables were not found."
          }

          Set-Content `
            -Path (Join-Path $env:EVIDENCE_DIR 'installation-result.txt') `
            -Value @(
              'MT5 INSTALLATION ACCEPTED'
              "Installer exit code: $installerExit"
              "Terminal: $($terminalItem.FullName)"
              "MetaEditor: $($editorItem.FullName)"
              'The installer exit code is accepted because the required executables exist.'
            ) `
            -Encoding UTF8

          "MT5_TERMINAL=$($terminalItem.FullName)" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "MT5_EDITOR=$($editorItem.FullName)" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host 'MT5 installation verified.'

      - name: Prepare King's Bot
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $expertDir = Join-Path `
            $env:MT5_DIR `
            'MQL5\Experts\KingsBot'

          $reportDir = Join-Path `
            $env:MT5_DIR `
            'Reports'

          $sourceRoot = Split-Path `
            $env:BOT_SOURCE `
            -Parent

          New-Item `
            -ItemType Directory `
            -Path $expertDir `
            -Force |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Path $reportDir `
            -Force |
            Out-Null

          Copy-Item `
            -Path (Join-Path $sourceRoot '*') `
            -Destination $expertDir `
            -Recurse `
            -Force

          $expertSource = Join-Path `
            $expertDir `
            $env:BOT_SOURCE_NAME

          if (-not (Test-Path -LiteralPath $expertSource)) {
            throw "Source copy failed: $expertSource"
          }

          "EXPERT_DIR=$expertDir" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "EXPERT_SOURCE=$expertSource" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "REPORT_DIR=$reportDir" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compile King's Bot
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $compileLog = Join-Path `
            $env:EVIDENCE_DIR `
            'metaeditor.log'

          Write-Host "MetaEditor: $env:MT5_EDITOR"
          Write-Host "Source: $env:EXPERT_SOURCE"

          $arguments = @(
            '/portable'
            "/compile:$env:EXPERT_SOURCE"
            "/log:$compileLog"
          )

          $process = Start-Process `
            -FilePath $env:MT5_EDITOR `
            -ArgumentList $arguments `
            -WorkingDirectory $env:MT5_DIR `
            -Wait `
            -PassThru `
            -NoNewWindow

          Write-Host "MetaEditor exit code: $($process.ExitCode)"

          Set-Content `
            -Path (Join-Path $env:EVIDENCE_DIR 'metaeditor-exit-code.txt') `
            -Value $process.ExitCode `
            -Encoding UTF8

          $ex5 = Join-Path `
            $env:EXPERT_DIR `
            'KingsBot_Phase6_Integration.ex5'

          $ex5Item = Get-Item `
            -LiteralPath $ex5 `
            -ErrorAction SilentlyContinue

          if ($null -eq $ex5Item) {
            throw "EX5 was not produced: $ex5"
          }

          if ($ex5Item.Length -lt 1000) {
            throw "EX5 is unexpectedly small: $($ex5Item.Length) bytes"
          }

          Write-Host "EX5 size: $($ex5Item.Length) bytes"

          "EXPERT_EX5=$ex5" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          Copy-Item `
            -LiteralPath $ex5 `
            -Destination (Join-Path $env:EVIDENCE_DIR 'KingsBot_Phase6_Integration.ex5') `
            -Force

      - name: Create MT5 connection configuration
        shell: powershell
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:MT5_LOGIN)) {
            throw 'MT5_LOGIN secret is missing.'
          }

          if ([string]::IsNullOrWhiteSpace($env:MT5_SERVER)) {
            throw 'MT5_SERVER secret is missing.'
          }

          if ([string]::IsNullOrWhiteSpace($env:MT5_PASSWORD)) {
            throw 'MT5_PASSWORD secret is missing.'
          }

          $config = Join-Path `
            $env:MT5_DIR `
            'KingsBot_Phase7_Connection.ini'

          @(
            '[Common]'
            "Login=$env:MT5_LOGIN"
            "Password=$env:MT5_PASSWORD"
            "Server=$env:MT5_SERVER"
            'KeepPrivate=0'
          ) |
            Set-Content `
              -Path $config `
              -Encoding ASCII

          @(
            '[Common]'
            "Login=$env:MT5_LOGIN"
            'Password=***'
            "Server=$env:MT5_SERVER"
            'KeepPrivate=0'
          ) |
            Set-Content `
              -Path (Join-Path $env:EVIDENCE_DIR 'Connection-Config.ini') `
              -Encoding UTF8

          "CONNECTION_CONFIG=$config" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Start MT5 and establish broker connection
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $arguments = @(
            '/portable'
            "/config:$env:CONNECTION_CONFIG"
          )

          $process = Start-Process `
            -FilePath $env:MT5_TERMINAL `
            -ArgumentList $arguments `
            -WorkingDirectory $env:MT5_DIR `
            -PassThru

          Write-Host "MT5 connection PID: $($process.Id)"

          $connected = $false
          $elapsed = 0
          $timeout = 300

          while ($elapsed -lt $timeout) {

            Start-Sleep -Seconds 10
            $elapsed += 10

            $logs = Get-ChildItem `
              -Path $env:MT5_DIR `
              -Filter '*.log' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 30

            $text = ''

            foreach ($log in $logs) {
              try {
                $text += "`n" + (
                  Get-Content `
                    -LiteralPath $log.FullName `
                    -Raw `
                    -ErrorAction SilentlyContinue
                )
              }
              catch {
              }
            }

            if ($text -match `
              '(?i)(authorized|connected|connection established|login.*successful|synchronized|synchronised)') {

              $connected = $true

              Write-Host `
                "Broker connection evidence detected after $elapsed seconds."

              break
            }

            if ($text -match `
              '(?i)(invalid account|authorization failed|authorisation failed|invalid password|account disabled)') {

              throw 'MT5 authentication failed. Check MT5_LOGIN, MT5_PASSWORD and MT5_SERVER.'
            }

            if ($process.HasExited) {
              throw `
                "MT5 exited during connection phase with code $($process.ExitCode)."
            }

            if (($elapsed % 30) -eq 0) {
              Write-Host `
                "Waiting for broker connection: $elapsed seconds"
            }
          }

          if (-not $connected) {
            throw `
              'Broker connection was not confirmed within 300 seconds.'
          }

          Set-Content `
            -Path (Join-Path $env:EVIDENCE_DIR 'connection-status.txt') `
            -Value "BROKER CONNECTION CONFIRMED after $elapsed seconds." `
            -Encoding UTF8

      - name: Allow MT5 history synchronization
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host "Preparing $env:TEST_SYMBOL history..."

          $elapsed = 0
          $timeout = 300
          $historySignal = $false

          while ($elapsed -lt $timeout) {

            Start-Sleep -Seconds 10
            $elapsed += 10

            $logs = Get-ChildItem `
              -Path $env:MT5_DIR `
              -Filter '*.log' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 40

            $text = ''

            foreach ($log in $logs) {
              try {
                $text += "`n" + (
                  Get-Content `
                    -LiteralPath $log.FullName `
                    -Raw `
                    -ErrorAction SilentlyContinue
                )
              }
              catch {
              }
            }

            if ($text -match `
              "(?i)($env:TEST_SYMBOL).*(history|bars|ticks|synchron|download)") {

              $historySignal = $true

              Write-Host `
                "History activity detected for $env:TEST_SYMBOL."

              break
            }

            if ($text -match `
              '(?i)(not synchronized with the trade server|not synchronised with the trade server|history download 0 %)') {

              Write-Host `
                'MT5 is still synchronizing history...'
            }

            if (($elapsed % 30) -eq 0) {
              Write-Host `
                "History preparation: $elapsed seconds"
            }
          }

          Set-Content `
            -Path (Join-Path $env:EVIDENCE_DIR 'history-synchronization.txt') `
            -Value @(
              "Symbol: $env:TEST_SYMBOL"
              "Waited: $elapsed seconds"
              "History activity detected: $historySignal"
              'Tester will perform its own final history preparation.'
            ) `
            -Encoding UTF8

      - name: Create Strategy Tester configuration
        shell: powershell
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          $config = Join-Path `
            $env:MT5_DIR `
            'KingsBot_Phase7_Tester.ini'

          @(
            '[Common]'
            "Login=$env:MT5_LOGIN"
            "Password=$env:MT5_PASSWORD"
            "Server=$env:MT5_SERVER"
            'KeepPrivate=0'
            ''
            '[Tester]'
            "Login=$env:MT5_LOGIN"
            "Password=$env:MT5_PASSWORD"
            "Server=$env:MT5_SERVER"
            'Expert=KingsBot\KingsBot_Phase6_Integration.ex5'
            "Symbol=$env:TEST_SYMBOL"
            "Period=$env:TEST_PERIOD"
            'Model=0'
            'Optimization=0'
            "FromDate=$env:TEST_FROM"
            "ToDate=$env:TEST_TO"
            'ForwardMode=0'
            'Deposit=10000'
            'Currency=USD'
            'Leverage=100'
            'ExecutionMode=0'
            'Report=Reports\KingsBot_Phase7_Tester.htm'
            'ReplaceReport=1'
            'ShutdownTerminal=1'
            'Visual=0'
            'UseLocal=1'
            'UseRemote=0'
            'UseCloud=0'
          ) |
            Set-Content `
              -Path $config `
              -Encoding ASCII

          @(
            '[Tester]'
            "Login=$env:MT5_LOGIN"
            'Password=***'
            "Server=$env:MT5_SERVER"
            'Expert=KingsBot\KingsBot_Phase6_Integration.ex5'
            "Symbol=$env:TEST_SYMBOL"
            "Period=$env:TEST_PERIOD"
            "FromDate=$env:TEST_FROM"
            "ToDate=$env:TEST_TO"
            'Report=Reports\KingsBot_Phase7_Tester.htm'
          ) |
            Set-Content `
              -Path (Join-Path $env:EVIDENCE_DIR 'Tester-Config.ini') `
              -Encoding UTF8

          "TESTER_CONFIG=$config" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run Strategy Tester
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'

          $report = Join-Path `
            $env:MT5_DIR `
            'Reports\KingsBot_Phase7_Tester.htm'

          Remove-Item `
            -Path $report `
            -Force `
            -ErrorAction SilentlyContinue

          $arguments = @(
            '/portable'
            "/config:$env:TESTER_CONFIG"
          )

          $process = Start-Process `
            -FilePath $env:MT5_TERMINAL `
            -ArgumentList $arguments `
            -WorkingDirectory $env:MT5_DIR `
            -PassThru

          Write-Host "Tester MT5 PID: $($process.Id)"

          $elapsed = 0
          $timeout = 1200
          $found = $false
          $errorText = ''

          while ($elapsed -lt $timeout) {

            Start-Sleep -Seconds 10
            $elapsed += 10

            $reportItem = Get-Item `
              -LiteralPath $report `
              -ErrorAction SilentlyContinue

            if ($null -ne $reportItem -and $reportItem.Length -gt 1000) {

              $found = $true

              Write-Host `
                "Strategy Tester report found after $elapsed seconds."

              break
            }

            $logs = Get-ChildItem `
              -Path $env:MT5_DIR `
              -Filter '*.log' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 50

            $text = ''

            foreach ($log in $logs) {
              try {
                $text += "`n" + (
                  Get-Content `
                    -LiteralPath $log.FullName `
                    -Raw `
                    -ErrorAction SilentlyContinue
                )
              }
              catch {
              }
            }

            if ($text -match `
              '(?i)(authorization failed|authorisation failed|invalid account|invalid password|cannot start testing|failed to start testing|cannot download history|failed to download history)') {

              $errorText = 'A Strategy Tester/MT5 fatal error was detected in the logs.'

              break
            }

            if ($text -match `
              '(?i)(not synchronized with the trade server|not synchronised with the trade server|history download 0 %)') {

              Write-Host `
                'Tester reports that market history is still synchronizing.'
            }

            if ($process.HasExited) {
              Write-Host `
                "MT5 exited with code $($process.ExitCode)."
            }

            if (($elapsed % 30) -eq 0) {
              Write-Host `
                "Tester running: $elapsed seconds"
            }
          }

          if (-not $found) {

            $result = @(
              'PHASE 7 TESTER REPORT NOT PRODUCED'
              ''
              "Elapsed: $elapsed seconds"
              "MT5 process exited: $($process.HasExited)"
              "MT5 exit code: $(if ($process.HasExited) { $process.ExitCode } else { 'RUNNING' })"
              $errorText
            ) -join "`r`n"

            Set-Content `
              -Path (Join-Path $env:EVIDENCE_DIR 'tester-result.txt') `
              -Value $result `
              -Encoding UTF8

            throw $result
          }

          Copy-Item `
            -LiteralPath $report `
            -Destination (Join-Path $env:EVIDENCE_DIR 'KingsBot_Phase7_Tester.htm') `
            -Force

          Set-Content `
            -Path (Join-Path $env:EVIDENCE_DIR 'tester-result.txt') `
            -Value @(
              'PHASE 7 TESTER REPORT PRODUCED'
              "Report: $report"
              "Size: $((Get-Item $report).Length) bytes"
              "Elapsed: $elapsed seconds"
            ) `
            -Encoding UTF8

      - name: Collect all MT5 evidence
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'

          $destination = Join-Path `
            $env:EVIDENCE_DIR `
            'MT5-Logs'

          New-Item `
            -ItemType Directory `
            -Path $destination `
            -Force |
            Out-Null

          if (Test-Path -LiteralPath $env:MT5_DIR) {

            $sources = @(
              (Join-Path $env:MT5_DIR 'Logs'),
              (Join-Path $env:MT5_DIR 'MQL5\Logs'),
              (Join-Path $env:MT5_DIR 'Tester'),
              (Join-Path $env:MT5_DIR 'Reports')
            )

            foreach ($source in $sources) {

              if (Test-Path -LiteralPath $source) {

                $name = Split-Path `
                  $source `
                  -Leaf

                $target = Join-Path `
                  $destination `
                  $name

                Copy-Item `
                  -Path $source `
                  -Destination $target `
                  -Recurse `
                  -Force `
                  -ErrorAction SilentlyContinue
              }
            }
          }

          Get-ChildItem `
            -Path $env:EVIDENCE_DIR `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object FullName,Length,LastWriteTime |
            Format-Table -AutoSize |
            Out-String |
            Set-Content `
              -Path (Join-Path $env:EVIDENCE_DIR 'evidence-inventory.txt') `
              -Encoding UTF8

      - name: Stop MT5 processes
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'

          Get-Process `
            -Name 'terminal64' `
            -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue

          Get-Process `
            -Name 'metatester64' `
            -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue

          Get-Process `
            -Name 'metaeditor64' `
            -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Upload Phase 7 evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: KingsBot-Phase7-Evidence-${{ github.run_number }}
          path: phase7-evidence
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
