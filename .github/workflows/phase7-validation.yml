name: King's Bot - Phase 7 Runtime Validation

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  MT5_DIR: C:\MT5
  BOT_SOURCE_NAME: KingsBot_Phase6_Integration.mq5
  EX5_NAME: KingsBot_Phase6_Integration.ex5

jobs:
  phase7:
    name: Phase 7 Runtime and Strategy Tester
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout KingsBot
        uses: actions/checkout@v4

      - name: Install MetaTrader 5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $mt5 = $env:MT5_DIR
          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'

          New-Item -ItemType Directory -Force -Path $mt5 | Out-Null

          Write-Host '========== DOWNLOADING MT5 =========='

          Invoke-WebRequest `
            -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' `
            -OutFile $installer `
            -UseBasicParsing

          if (-not (Test-Path -LiteralPath $installer)) {
            throw 'MT5 installer download failed.'
          }

          Write-Host '========== INSTALLING MT5 =========='

          $p = Start-Process `
            -FilePath $installer `
            -ArgumentList @('/auto', "/path:$mt5") `
            -Wait `
            -PassThru

          Write-Host "Installer exit code: $($p.ExitCode)"

          Start-Sleep -Seconds 10

          $terminal = Get-ChildItem `
            -Path $mt5 `
            -Filter 'terminal64.exe' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $terminal) {
            throw 'MT5 installation completed but terminal64.exe was not found.'
          }

          Write-Host "MT5 TERMINAL: $($terminal.FullName)"

      - name: Locate MetaEditor
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $editor = Get-ChildItem `
            -Path $env:MT5_DIR `
            -Filter 'metaeditor64.exe' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $editor) {
            throw 'metaeditor64.exe not found under C:\MT5.'
          }

          "MT5_EDITOR=$($editor.FullName)" >> $env:GITHUB_ENV

          Write-Host "MT5 EDITOR: $($editor.FullName)"

      - name: Locate King''s Bot source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter $env:BOT_SOURCE_NAME `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $source) {
            throw "Source file not found: $env:BOT_SOURCE_NAME"
          }

          "BOT_SOURCE=$($source.FullName)" >> $env:GITHUB_ENV

          Write-Host "SOURCE: $($source.FullName)"

      - name: Prepare King''s Bot source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $expertDir = Join-Path $env:MT5_DIR 'MQL5\Experts\KingsBot'

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $expertDir |
            Out-Null

          Copy-Item `
            -LiteralPath $env:BOT_SOURCE `
            -Destination (Join-Path $expertDir $env:BOT_SOURCE_NAME) `
            -Force

          $expertSource = Join-Path $expertDir $env:BOT_SOURCE_NAME

          if (-not (Test-Path -LiteralPath $expertSource)) {
            throw "Failed to copy source to $expertSource"
          }

          "EXPERT_SOURCE=$expertSource" >> $env:GITHUB_ENV

          Write-Host "EXPERT SOURCE: $expertSource"

      - name: Compile King''s Bot
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $compileLog = Join-Path $env:GITHUB_WORKSPACE 'phase7-compile.log'

          Write-Host '========== COMPILING KING''S BOT =========='
          Write-Host "EDITOR: $env:MT5_EDITOR"
          Write-Host "SOURCE: $env:EXPERT_SOURCE"

          & $env:MT5_EDITOR `
            '/portable' `
            "/compile:$env:EXPERT_SOURCE" `
            "/log:$compileLog"

          $exitCode = $LASTEXITCODE

          Write-Host "MetaEditor exit code: $exitCode"

          if (Test-Path -LiteralPath $compileLog) {
            Get-Content -LiteralPath $compileLog
          }

          if ($exitCode -ne 0) {
            throw "MetaEditor compilation failed with exit code $exitCode"
          }

      - name: Verify compiled EX5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $ex5 = Get-ChildItem `
            -Path $env:MT5_DIR `
            -Filter $env:EX5_NAME `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if ($null -eq $ex5) {
            throw "Compiled EX5 not found: $env:EX5_NAME"
          }

          Write-Host "COMPILED EX5: $($ex5.FullName)"
          Write-Host "SIZE: $($ex5.Length) bytes"

      - name: Run Phase 7 Tester
        shell: powershell
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          $runner = Join-Path `
            $env:GITHUB_WORKSPACE `
            'scripts\phase7-run.ps1'

          if (-not (Test-Path -LiteralPath $runner)) {
            throw "Phase 7 runner not found: $runner"
          }

          & $runner

      - name: Upload Phase 7 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-Phase7-Evidence
          path: |
            phase7-evidence/**
            phase7-compile.log
          if-no-files-found: warn
          retention-days: 14
