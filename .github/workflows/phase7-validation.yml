name: King's Bot - Phase 7 Runtime Validation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase7-runtime-validation:
    name: Phase 7 Runtime and Strategy Tester Validation
    runs-on: windows-latest
    timeout-minutes: 30

    steps:

      - name: Checkout King's Bot
        uses: actions/checkout@v4

      - name: Install MT5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          $root = Join-Path $env:RUNNER_TEMP 'KingsBot-MT5'

          Invoke-WebRequest `
            -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' `
            -OutFile $installer `
            -UseBasicParsing

          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Path $root `
            -Force |
            Out-Null

          $install = Start-Process `
            -FilePath $installer `
            -ArgumentList @(
              '/auto',
              ('/path:' + $root)
            ) `
            -Wait `
            -PassThru

          Write-Host "Installer exit code: $($install.ExitCode)"

          $terminal = Get-ChildItem `
            $root `
            -Recurse `
            -File `
            -Filter 'terminal64.exe' `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          $editor = Get-ChildItem `
            $root `
            -Recurse `
            -File `
            -Filter 'metaeditor64.exe' `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $terminal) {
            throw 'terminal64.exe was not found.'
          }

          if (-not $editor) {
            throw 'metaeditor64.exe was not found.'
          }

          $mt5Root = $terminal.Directory.FullName

          "MT5_ROOT=$mt5Root" |
            Out-File $env:GITHUB_ENV -Append

          "METAEDITOR=$($editor.FullName)" |
            Out-File $env:GITHUB_ENV -Append

          Write-Host "MT5_ROOT=$mt5Root"

      - name: Prepare Phase 7 evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $evidence = Join-Path `
            $env:GITHUB_WORKSPACE `
            'phase7-validation-evidence'

          New-Item `
            -ItemType Directory `
            -Path $evidence `
            -Force |
            Out-Null

      - name: Locate King's Bot source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Get-ChildItem `
            $env:GITHUB_WORKSPACE `
            -Recurse `
            -File `
            -Filter 'KingsBot_Phase6_Integration.mq5' `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FullName -notmatch '\\.git\\'
            } |
            Select-Object -First 1

          if (-not $source) {
            throw 'KingsBot_Phase6_Integration.mq5 was not found.'
          }

          "KINGSBOT_SOURCE=$($source.FullName)" |
            Out-File $env:GITHUB_ENV -Append

          Write-Host "Source: $($source.FullName)"

      - name: Compile King's Bot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $evidence = Join-Path `
            $env:GITHUB_WORKSPACE `
            'phase7-validation-evidence'

          $source = Get-Item $env:KINGSBOT_SOURCE

          $target = Join-Path `
            $env:MT5_ROOT `
            'MQL5\Experts\KingsBot'

          New-Item `
            -ItemType Directory `
            -Path $target `
            -Force |
           
