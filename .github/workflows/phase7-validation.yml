name: KingsBot Phase 7 Runtime and Strategy Tester

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase7:
    name: T5 Runtime and Strategy Tester
    runs-on: windows-2025
    timeout-minutes: 40

    env:
      MT5_DIR: C:\MT5
      BOT_SOURCE_NAME: KingsBot_Phase6_Integration.mq5
      TEST_SYMBOL: EURUSD
      TEST_PERIOD: M15
      TEST_FROM: "2025.01.01"
      TEST_TO: "2026.08.01"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate King's Bot source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter $env:BOT_SOURCE_NAME -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1

          if ($null -eq $source) {
            throw "Could not find $env:BOT_SOURCE_NAME"
          }

          Write-Host "Source: $($source.FullName)"
          "BOT_SOURCE=$($source.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare evidence directory
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $evidence = Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence'
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null

          New-Item -ItemType Directory -Path (Join-Path $evidence 'Tester') -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $evidence 'MT5-Logs') -Force | Out-Null

          "EVIDENCE_DIR=$evidence" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Evidence directory: $evidence"

      - name: Download MetaTrader 5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          $url = 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe'
          $downloaded = $false

          for ($attempt = 1; $attempt -le 5; $attempt++) {
            Write-Host "MT5 download attempt $attempt of 5"

            try {
              Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing -TimeoutSec 120

              if (Test-Path -LiteralPath $installer) {
                $size = (Get-Item -LiteralPath $installer).Length
                Write-Host "Installer size: $size bytes"

                if ($size -gt 1000000) {
                  $downloaded = $true
                  break
                }
              }
            }
            catch {
              Write-Host "Download failed: $($_.Exception.Message)"
            }

            if ($attempt -lt 5) {
              Start-Sleep -Seconds 10
            }
          }

          if (-not $downloaded) {
            throw 'Unable to download MetaTrader 5 installer.'
          }

          "MT5_INSTALLER=$installer" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install MetaTrader 5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host 'Installing MetaTrader 5...'
          Write-Host "Target: $env:MT5_DIR"

          Remove-Item -Path $env:MT5_DIR -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $env:MT5_DIR -Force | Out-Null

          $arguments = "/auto /path:$env:MT5_DIR"

          $process = Start-Process -FilePath $env:MT5_INSTALLER -ArgumentList $arguments -Wait -PassThru -NoNewWindow

          Write-Host "Installer exit code: $($process.ExitCode)"
          "MT5_INSTALLER_EXIT_CODE=$($process.ExitCode)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          $terminal = Join-Path $env:MT5_DIR 'terminal64.exe'
          $editor = Join-Path $env:MT5_DIR 'metaeditor64.exe'

          if (-not (Test-Path -LiteralPath $terminal)) {
            $terminalItem = Get-ChildItem -Path $env:MT5_DIR -Filter 'terminal64.exe' -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1

            if ($null -ne $terminalItem) {
              $terminal = $terminalItem.FullName
            }
          }

          if (-not (Test-Path -LiteralPath $editor)) {
            $editorItem = Get-ChildItem -Path $env:MT5_DIR -Filter 'metaeditor64.exe' -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1

            if ($null -ne $editorItem) {
              $editor = $editorItem.FullName
            }
          }

          if (-not (Test-Path -LiteralPath $terminal)) {
            throw 'terminal64.exe was not found.'
          }

          if (-not (Test-Path -LiteralPath $editor)) {
            throw 'metaeditor64.exe was not found.'
          }

          Write-Host "Terminal: $terminal"
          Write-Host "MetaEditor: $editor"

          "MT5_TERMINAL=$terminal" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "MT5_EDITOR=$editor" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare King's Bot
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $expertDir = Join-Path $env:MT5_DIR 'MQL5\Experts\KingsBot'
          $reportDir = Join-Path $env:MT5_DIR 'Reports'

          New-Item -ItemType Directory -Path $expertDir -Force | Out-Null
          New-Item -ItemType Directory -Path $reportDir -Force | Out-Null

          $sourceRoot = Split-Path $env:BOT_SOURCE -Parent

          Copy-Item -Path (Join-Path $sourceRoot '*') -Destination $expertDir -Recurse -Force

          $expertSource = Join-Path $expertDir $env:BOT_SOURCE_NAME

          if (-not (Test-Path -LiteralPath $expertSource)) {
            throw "Source copy failed: $expertSource"
          }

          Write-Host "Expert source: $expertSource"

          "EXPERT_DIR=$expertDir" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "EXPERT_SOURCE=$expertSource" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "REPORT_DIR=$reportDir" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compile King's Bot
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "MetaEditor: $env:MT5_EDITOR"
          Write-Host "Source: $env:EXPERT_SOURCE"

          $arguments = "/compile:$env:EXPERT_SOURCE /log"

          $process = Start-Process -FilePath $env:MT5_EDITOR -ArgumentList $arguments -WorkingDirectory $env:MT5_DIR -Wait -PassThru -NoNewWindow

          Write-Host "MetaEditor exit code: $($process.ExitCode)"
          "MT5_COMPILE_EXIT_CODE=$($process.ExitCode)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          $ex5 = Join-Path $env:EXPERT_DIR 'KingsBot_Phase6_Integration.ex5'

          if (-not (Test-Path -LiteralPath $ex5)) {
            throw "EX5 was not produced: $ex5"
          }

          $info = Get-Item -LiteralPath $ex5

          Write-Host "EX5 produced: $($info.Length) bytes"

          if ($info.Length -lt 1000) {
            throw 'EX5 is unexpectedly small.'
          }

          "EXPERT_EX5=$ex5" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create authenticated tester configuration
        shell: powershell
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:MT5_LOGIN)) {
            throw 'MT5_LOGIN secret is missing.'
          }

          if ([string]::IsNullOrWhiteSpace($env:MT5_SERVER)) {
            throw 'MT5_SERVER secret is missing.'
          }

          if ([string]::IsNullOrWhiteSpace($env:MT5_PASSWORD)) {
            throw 'MT5_PASSWORD secret is missing.'
          }

          $config = Join-Path $env:MT5_DIR 'KingsBot_Phase7_Tester.ini'

          $content = @"
          [Common]
          Login=$env:MT5_LOGIN
          Server=$env:MT5_SERVER
          Password=$env:MT5_PASSWORD
          KeepPrivate=0

          [Tester]
          Expert=KingsBot\KingsBot_Phase6_Integration.ex5
          Login=$env:MT5_LOGIN
          Server=$env:MT5_SERVER
          Password=$env:MT5_PASSWORD
          Symbol=$env:TEST_SYMBOL
          Period=$env:TEST_PERIOD
          Model=0
          Optimization=0
          FromDate=$env:TEST_FROM
          ToDate=$env:TEST_TO
          ForwardMode=0
          Deposit=10000
          Currency=USD
          Leverage=1:100
          Report=KingsBot_Phase7_Tester.htm
          ReplaceReport=1
          ShutdownTerminal=1
          Visual=0
          UseLocal=1
          UseRemote=0
          UseCloud=0
          "@

          Set-Content -Path $config -Value $content -Encoding ascii

          Write-Host 'Tester configuration created.'
          Write-Host "Server: $env:MT5_SERVER"
          Write-Host "Login: $env:MT5_LOGIN"
          Write-Host 'Password: ********'

          $safe = $content -replace '(?m)^Password=.*$', 'Password=REDACTED'

          Set-Content -Path (Join-Path $env:EVIDENCE_DIR 'KingsBot_Phase7_Tester.ini') -Value $safe -Encoding utf8

          "TESTER_CONFIG=$config" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Launch Phase 7 Strategy Tester
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $report = Join-Path $env:REPORT_DIR 'KingsBot_Phase7_Tester.htm'
          $testerLogs = Join-Path $env:MT5_DIR 'Tester\logs'
          $terminalLogs = Join-Path $env:MT5_DIR 'Logs'

          Remove-Item -Path $report -Force -ErrorAction SilentlyContinue

          Write-Host '========================================'
          Write-Host 'Launching Phase 7 Strategy Tester'
          Write-Host '========================================'
          Write-Host "Terminal: $env:MT5_TERMINAL"
          Write-Host "Config: $env:TESTER_CONFIG"
          Write-Host "Report: $report"

          $start = Get-Date

          $arguments = "/portable /config:$env:TESTER_CONFIG"

          $process = Start-Process -FilePath $env:MT5_TERMINAL -ArgumentList $arguments -WorkingDirectory $env:MT5_DIR -PassThru

          $pidValue = $process.Id

          Write-Host "MT5 PID: $pidValue"
          "MT5_PID=$pidValue" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          $elapsed = 0
          $timeout = 1800

          while ($elapsed -lt $timeout) {

            Start-Sleep -Seconds 10
            $elapsed += 10

            if (Test-Path -LiteralPath $report) {
              Write-Host "TESTER REPORT FOUND after $elapsed seconds."
              break
            }

            $running = Get-Process -Id $pidValue -ErrorAction SilentlyContinue

            if ($null -eq $running) {
              Write-Host 'MT5 process has exited.'
              break
            }

            if (($elapsed % 30) -eq 0) {
              Write-Host "Tester running: $elapsed seconds"

              if (Test-Path -LiteralPath $testerLogs) {
                $latest = Get-ChildItem -Path $testerLogs -File -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1

                if ($null -ne $latest) {
                  Write-Host "Latest tester log: $($latest.FullName)"
                  Get-Content -Path $latest.FullName -Tail 20 -ErrorAction SilentlyContinue
                }
              }
            }
          }

          $exitCode = 'UNKNOWN'

          if ($null -ne $process) {
            try {
              $process.Refresh()
              $exitCode = $process.ExitCode
            }
            catch {
              $exitCode = 'UNKNOWN'
            }
          }

          Write-Host "MT5 exit code: $exitCode"

          "MT5_EXIT_CODE=$exitCode" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          $result = @(
            'KingsBot Phase 7 Tester Execution'
            "Started: $start"
            "Finished: $(Get-Date)"
            "ElapsedSeconds: $elapsed"
            "MT5 PID: $pidValue"
            "MT5 ExitCode: $exitCode"
            "Report: $report"
            "ReportExists: $(Test-Path -LiteralPath $report)"
          )

          Set-Content -Path (Join-Path $env:EVIDENCE_DIR 'TESTER_EXECUTION.txt') -Value $result -Encoding utf8

          if (-not (Test-Path -LiteralPath $report)) {
            throw "Phase 7 tester report was not produced. MT5 exit code: $exitCode"
          }

          $reportInfo = Get-Item -LiteralPath $report

          Write-Host "Report size: $($reportInfo.Length) bytes"

          if ($reportInfo.Length -lt 1000) {
            throw 'Tester report exists but is too small.'
          }

          Copy-Item -Path $report -Destination (Join-Path $env:EVIDENCE_DIR 'KingsBot_Phase7_Tester.htm') -Force

      - name: Collect Phase 7 evidence
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'

          $testerDestination = Join-Path $env:EVIDENCE_DIR 'Tester'
          $logsDestination = Join-Path $env:EVIDENCE_DIR 'MT5-Logs'

          $testerRoot = Join-Path $env:MT5_DIR 'Tester'
          $logsRoot = Join-Path $env:MT5_DIR 'Logs'

          if (Test-Path -LiteralPath $testerRoot) {
            Copy-Item -Path $testerRoot -Destination $testerDestination -Recurse -Force -ErrorAction SilentlyContinue
          }

          if (Test-Path -LiteralPath $logsRoot) {
            Copy-Item -Path $logsRoot -Destination $logsDestination -Recurse -Force -ErrorAction SilentlyContinue
          }

          if ($env:EXPERT_EX5 -and (Test-Path -LiteralPath $env:EXPERT_EX5)) {
            Copy-Item -Path $env:EXPERT_EX5 -Destination (Join-Path $env:EVIDENCE_DIR 'KingsBot_Phase6_Integration.ex5') -Force -ErrorAction SilentlyContinue
          }

          $summary = @(
            'KingsBot Phase 7 Runtime Evidence'
            "InstallerExitCode=$env:MT5_INSTALLER_EXIT_CODE"
            "CompileExitCode=$env:MT5_COMPILE_EXIT_CODE"
            "MT5PID=$env:MT5_PID"
            "MT5ExitCode=$env:MT5_EXIT_CODE"
            "Symbol=$env:TEST_SYMBOL"
            "Period=$env:TEST_PERIOD"
            "From=$env:TEST_FROM"
            "To=$env:TEST_TO"
          )

          Set-Content -Path (Join-Path $env:EVIDENCE_DIR 'PHASE7_SUMMARY.txt') -Value $summary -Encoding utf8

          Write-Host 'Evidence collection completed.'

      - name: Upload Phase 7 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-Phase7-Evidence
          path: phase7-evidence
          if-no-files-found: error
          retention-days: 14

      - name: Confirm Phase 7 runtime validation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $report = Join-Path $env:EVIDENCE_DIR 'KingsBot_Phase7_Tester.htm'

          if (-not (Test-Path -LiteralPath $report)) {
            throw 'PHASE 7 FAILED: actual Strategy Tester report is missing.'
          }

          $size = (Get-Item -LiteralPath $report).Length

          if ($size -lt 1000) {
            throw 'PHASE 7 FAILED: tester report is too small.'
          }

          Write-Host '========================================'
          Write-Host 'PHASE 7 RUNTIME VALIDATION PASSED'
          Write-Host "Tester report size: $size bytes"
          Write-Host 'Evidence artifact was collected.'
          Write-Host '========================================'
