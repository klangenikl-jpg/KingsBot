- name: Prepare MT5 tester configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $evidence = Join-Path `
            $env:GITHUB_WORKSPACE `
            'phase7-validation-evidence'

          $config = Join-Path `
            $env:MT5_ROOT `
            'KingsBot_Phase7_Tester.ini'

          $reportDir = Join-Path `
            $env:MT5_ROOT `
            'reports'

          New-Item `
            -ItemType Directory `
            -Path $reportDir `
            -Force |
            Out-Null

          $report = Join-Path `
            $reportDir `
            'KingsBot_Phase7_Tester.htm'

          Remove-Item `
            $report `
            -Force `
            -ErrorAction SilentlyContinue

          $lines = @(
            '[Tester]'
            'Expert=KingsBot\KingsBot_Phase6_Integration.ex5'
            'Symbol=EURUSD'
            'Period=M15'
            'Model=0'
            'Optimization=0'
            'FromDate=2025.01.01'
            'ToDate=2026.08.01'
            'ForwardMode=0'
            'Deposit=10000'
            'Currency=USD'
            'Leverage=1:100'
            'Report=reports\KingsBot_Phase7_Tester.htm'
            'ReplaceReport=1'
            'ShutdownTerminal=1'
            'Visual=0'
            'UseCloud=0'
          )

          # MetaTrader configuration files are Unicode.
          $unicode = New-Object System.Text.UnicodeEncoding(
            $false,
            $false
          )

          [System.IO.File]::WriteAllLines(
            $config,
            $lines,
            $unicode
          )

          if (-not (Test-Path $config)) {
            throw 'MT5 tester configuration was not created.'
          }

          Copy-Item `
            $config `
            (Join-Path $evidence 'KingsBot_Phase7_Tester.ini') `
            -Force

          Write-Host '===== MT5 TESTER CONFIGURATION ====='
          Get-Content $config
          Write-Host '====================================='

          $bytes = [System.IO.File]::ReadAllBytes($config)

          Write-Host "Configuration size: $($bytes.Length) bytes"
          Write-Host "Unicode BOM: $($bytes[0] -eq 255 -and $bytes[1] -eq 254)"

          if (-not ($bytes[0] -eq 255 -and $bytes[1] -eq 254)) {
            throw 'MT5 configuration was not written as UTF-16LE Unicode.'
          }
