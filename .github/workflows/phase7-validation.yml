name: King's Bot - Phase 7 Runtime Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  phase7-runtime-validation:
    name: Phase 7 Runtime and Strategy Tester Validation
    runs-on: windows-latest
    timeout-minutes: 40

    steps:

      - name: Checkout King's Bot
        uses: actions/checkout@v4

      - name: Install MT5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          $installRoot = Join-Path $env:RUNNER_TEMP 'KingsBot-MT5'

          Invoke-WebRequest `
            -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' `
            -OutFile $installer `
            -UseBasicParsing

          Remove-Item `
            $installRoot `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Path $installRoot `
            -Force |
            Out-Null

          $p = Start-Process `
            -FilePath $installer `
            -ArgumentList @(
              '/auto',
              ('/path:' + $installRoot)
            ) `
            -Wait `
            -PassThru

          Write-Host "Installer exit code: $($p.ExitCode)"

          $terminal = Get-ChildItem `
            $installRoot `
            -Recurse `
            -File `
            -Filter 'terminal64.exe' `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          $metaEditor = Get-ChildItem `
            $installRoot `
            -Recurse `
            -File `
            -Filter 'metaeditor64.exe' `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          $tester = Get-ChildItem `
            $installRoot `
            -Recurse `
            -File `
            -Filter 'metatester64.exe' `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $terminal) {
            throw 'terminal64.exe was not found.'
          }

          if (-not $metaEditor) {
            throw 'metaeditor64.exe was not found.'
          }

          if (-not $tester) {
            Write-Warning 'metatester64.exe was not found as a standalone file; MT5 may manage the tester agent internally.'
          }

          $mt5Root = $terminal.Directory.FullName

          "MT5_ROOT=$mt5Root" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "METAEDITOR=$($metaEditor.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "MT5_TERMINAL=$($terminal.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "MT5_ROOT=$mt5Root"
          Write-Host "METAEDITOR=$($metaEditor.FullName)"
          Write-Host "TERMINAL=$($terminal.FullName)"

      - name: Prepare evidence directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $evidence = Join-Path `
            $env:GITHUB_WORKSPACE `
            'phase7-validation-evidence'

          New-Item `
            -ItemType Directory `
            -Path $evidence `
            -Force |
            Out-Null

      - name: Locate King's Bot source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Get-ChildItem `
            $env:GITHUB_WORKSPACE `
            -Recurse `
            -File `
            -Filter 'KingsBot_Phase6_Integration.mq5' `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FullName -notmatch '\\.git\\'
            } |
            Select-Object -First 1

          if (-not $source) {
            throw 'KingsBot_Phase6_Integration.mq5 was not found.'
          }

          "KINGSBOT_SOURCE=$($source.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Source: $($source.FullName)"

      - name: Prepare King's Bot source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Get-Item $env:KINGSBOT_SOURCE

          $target = Join-Path `
            $env:MT5_ROOT `
            'MQL5\Experts\KingsBot'

          New-Item `
            -ItemType Directory `
            -Path $target `
            -Force |
            Out-Null

          Get-ChildItem `
            $source.Directory.FullName `
            -Recurse `
            -File |
            Where-Object {
              $_.FullName -notmatch '\\.git\\'
            } |
            ForEach-Object {

              $relative = $_.FullName.Substring(
                $source.Directory.FullName.Length
              ).TrimStart('\')

              $destination = Join-Path `
                $target `
                $relative

              $destinationDirectory = Split-Path `
                $destination `
                -Parent

              New-Item `
                -ItemType Directory `
                -Path $destinationDirectory `
                -Force |
                Out-Null

              Copy-Item `
                $_.FullName `
                $destination `
                -Force
            }

          Write-Host "Source prepared at:"
          Write-Host $target

      - name: Compile King's Bot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $evidence = Join-Path `
            $env:GITHUB_WORKSPACE `
            'phase7-validation-evidence'

          $mq5 = Join-Path `
            $env:MT5_ROOT `
            'MQL5\Experts\KingsBot\KingsBot_Phase6_Integration.mq5'

          $ex5 = Join-Path `
            $env:MT5_ROOT `
            'MQL5\Experts\KingsBot\KingsBot_Phase6_Integration.ex5'

          if (-not (Test-Path $mq5)) {
            throw "MQ5 not found: $mq5"
          }

          Remove-Item `
            $ex5 `
            -Force `
            -ErrorAction SilentlyContinue

          $compile = Start-Process `
            -FilePath $env:METAEDITOR `
            -ArgumentList @(
              ('/compile:' + $mq5),
              '/log'
            ) `
            -WorkingDirectory `
            (Split-Path $mq5 -Parent) `
            -Wait `
            -PassThru

          Start-Sleep -Seconds 2

          Write-Host "MetaEditor exit code: $($compile.ExitCode)"

          $log = Get-ChildItem `
            (Split-Path $mq5 -Parent) `
            -File `
            -Filter '*.log' `
            -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if ($log) {
            Copy-Item `
              $log.FullName `
              (Join-Path $evidence 'compiler.log') `
              -Force

            Get-Content $log.FullName
          }

          if (-not (Test-Path $ex5)) {
            throw 'KingsBot EX5 was not created.'
          }

          if ((Get-Item $ex5).Length -le 0) {
            throw 'KingsBot EX5 is empty.'
          }

          Copy-Item `
            $ex5 `
            $evidence `
            -Force

          Write-Host "EX5 verified:"
          Write-Host $ex5

      - name: Initialize MT5 portable environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $terminal = $env:MT5_TERMINAL

          Write-Host '===== INITIALIZING MT5 ====='
          Write-Host $terminal

          $init = Start-Process `
            -FilePath $terminal `
            -ArgumentList @(
              '/portable'
            ) `
            -WorkingDirectory $env:MT5_ROOT `
            -PassThru

          Write-Host "Initialization PID: $($init.Id)"

          Start-Sleep -Seconds 20

          if (-not $init.HasExited) {
            Write-Host 'Closing initialization terminal.'

            Stop-Process `
              -Id $init.Id `
              -Force `
              -ErrorAction SilentlyContinue

            Start-Sleep -Seconds 3
          }

          Write-Host 'MT5 initialization stage complete.'

      - name: Verify MT5 tester environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host '===== MT5 ENVIRONMENT ====='

          $important = @(
            'terminal64.exe',
            'metatester64.exe'
          )

          foreach ($name in $important) {

            $found = Get-ChildItem `
              $env:MT5_ROOT `
              -Recurse `
              -File `
              -Filter $name `
              -ErrorAction SilentlyContinue

            if ($found) {
              foreach ($file in $found) {
                Write-Host "$name -> $($file.FullName)"
              }
            }
            else {
              Write-Host "$name -> not found"
            }
          }

          Write-Host '===== DIRECTORY CHECK ====='

          @(
            (Join-Path $env:MT5_ROOT 'MQL5')
            (Join-Path $env:MT5_ROOT 'MQL5\Experts')
            (Join-Path $env:MT5_ROOT 'Tester')
            (Join-Path $env:MT5_ROOT 'Logs')
          ) |
          ForEach-Object {
            Write-Host "$_ : $(Test-Path $_)"
          }

      - name: Prepare Strategy Tester configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $evidence = Join-Path `
            $env:GITHUB_WORKSPACE `
            'phase7-validation-evidence'

          $config = Join-Path `
            $env:MT5_ROOT `
            'KingsBot_Phase7_Tester.ini'

          $ex5 = Join-Path `
            $env:MT5_ROOT `
            'MQL5\Experts\KingsBot\KingsBot_Phase6_Integration.ex5'

          if (-not (Test-Path $ex5)) {
            throw 'EX5 missing before tester configuration.'
          }

          $lines = @(
            '[Tester]'
            'Expert=Experts\KingsBot\KingsBot_Phase6_Integration.ex5'
            'Symbol=EURUSD'
            'Period=M15'
            'Model=1'
            'Optimization=0'
            'FromDate=2026.01.01'
            'ToDate=2026.08.01'
            'ForwardMode=0'
            'Deposit=10000'
            'Currency=USD'
            'Leverage=1:100'
            'ExecutionMode=0'
            'OptimizationCriterion=0'
            'UseLocal=1'
            'UseRemote=0'
            'UseCloud=0'
            'Visual=0'
            'Report=KingsBot_Phase7_Tester'
            'ReplaceReport=1'
            'ShutdownTerminal=1'
          )

          [System.IO.File]::WriteAllLines(
            $config,
            $lines,
            [System.Text.UnicodeEncoding]::new($false,$true)
          )

          Copy-Item `
            $config `
            (Join-Path $evidence 'KingsBot_Phase7_Tester.ini') `
            -Force

          Write-Host '===== TESTER CONFIG ====='
          Get-Content $config
          Write-Host '========================='

      - name: Run Phase 7 Strategy Tester
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $evidence = Join-Path `
            $env:GITHUB_WORKSPACE `
            'phase7-validation-evidence'

          $terminal = $env:MT5_TERMINAL

          $config = Join-Path `
            $env:MT5_ROOT `
            'KingsBot_Phase7_Tester.ini'

          if (-not (Test-Path $terminal)) {
            throw 'MT5 terminal executable is missing.'
          }

          if (-not (Test-Path $config)) {
            throw 'Tester configuration is missing.'
          }

          Write-Host '===== FINAL PHASE 7 LAUNCH ====='
          Write-Host "Terminal: $terminal"
          Write-Host "Config: $config"
          Write-Host 'Expert: Experts\KingsBot\KingsBot_Phase6_Integration.ex5'
          Write-Host 'Symbol: EURUSD'
          Write-Host 'Period: M15'
          Write-Host 'Model: Control points'
          Write-Host '==============================='

          $process = Start-Process `
            -FilePath $terminal `
            -ArgumentList @(
              '/portable',
              ('/config:' + $config)
            ) `
            -WorkingDirectory $env:MT5_ROOT `
            -PassThru

          Write-Host "MT5 PID: $($process.Id)"

          $deadline = (Get-Date).AddMinutes(15)

          $report = $null

          while ((Get-Date) -lt $deadline) {

            $reports = Get-ChildItem `
              $env:MT5_ROOT `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.BaseName -eq 'KingsBot_Phase7_Tester' -and
                $_.Extension -in '.htm','.html','.xml'
              } |
              Sort-Object LastWriteTime -Descending

            if ($reports) {
              $report = $reports | Select-Object -First 1
              break
            }

            if ($process.HasExited) {
              Write-Host 'MT5 exited.'
              Write-Host "Exit code: $($process.ExitCode)"
              break
            }

            Write-Host 'Tester still running...'
            Start-Sleep -Seconds 10
          }

          if ($report) {

            Write-Host '======================================'
            Write-Host 'PHASE 7 TESTER REPORT FOUND'
            Write-Host $report.FullName
            Write-Host "Size: $($report.Length)"
            Write-Host '======================================'

            Copy-Item `
              $report.FullName `
              (Join-Path $evidence $report.Name) `
              -Force

          }
          else {

            $exitCode = $null

            if ($process.HasExited) {
              $exitCode = $process.ExitCode
            }

            Write-Host "NO TESTER REPORT."
            Write-Host "MT5 EXIT CODE: $exitCode"

            throw 'Phase 7 Strategy Tester did not produce a report.'
          }

      - name: Capture MT5 diagnostics
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $evidence = Join-Path `
            $env:GITHUB_WORKSPACE `
            'phase7-validation-evidence'

          Write-Host '===== MT5 LOGS ====='

          Get-ChildItem `
            $env:MT5_ROOT `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Extension -in '.log','.htm','.html','.xml','.ini'
            } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 300 |
            ForEach-Object {

              Write-Host $_.FullName

              $safe = $_.FullName.Substring(
                $env:MT5_ROOT.Length
              ).TrimStart('\') -replace '[\\/:*?"<>|]', '_'

              Copy-Item `
                $_.FullName `
                (Join-Path $evidence $safe) `
                -Force `
                -ErrorAction SilentlyContinue
            }

          Write-Host '===== WINDOWS MT5 ERRORS ====='

          try {

            Get-WinEvent `
              -FilterHashtable @{
                LogName = 'Application'
                StartTime = (Get-Date).AddMinutes(-30)
              } `
              -ErrorAction Stop |
              Where-Object {
                $_.ProviderName -match 'Application Error|Windows Error Reporting' -and
                $_.Message -match 'terminal64|metatester|metaquotes'
              } |
              Select-Object -First 50 |
              Format-List `
                TimeCreated,
                ProviderName,
                Id,
                Message |
              Out-String |
              Set-Content `
                (Join-Path $evidence 'windows-mt5-errors.txt') `
                -Encoding UTF8

          }
          catch {

            "Event collection unavailable: $($_.Exception.Message)" |
              Set-Content `
              (Join-Path $evidence 'windows-mt5-errors.txt') `
              -Encoding UTF8
          }

      - name: Upload Phase 7 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-Phase7-Runtime-Validation
          path: phase7-validation-evidence
          if-no-files-found: warn
          retention-days: 14
