name: King's Bot - Phase 7 Runtime Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase7:
    name: Phase 7 Runtime and Strategy Tester Validation
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create evidence directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Evidence = Join-Path $env:GITHUB_WORKSPACE 'phase7-artifacts'
          New-Item -ItemType Directory -Path $Evidence -Force | Out-Null
          Set-Content -Path (Join-Path $Evidence 'phase7-started.txt') -Value 'Phase 7 started' -Encoding UTF8
          'EVIDENCE=' + $Evidence | Out-File $env:GITHUB_ENV -Append -Encoding UTF8

      - name: Find source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Source = Get-ChildItem $env:GITHUB_WORKSPACE -Recurse -File -Filter 'KingsBot_Phase6_Integration.mq5' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $Source) { throw 'KingsBot_Phase6_Integration.mq5 not found.' }
          'SOURCE=' + $Source.FullName | Out-File $env:GITHUB_ENV -Append -Encoding UTF8
          Copy-Item $Source.FullName $env:EVIDENCE -Force

      - name: Download MT5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          Invoke-WebRequest 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' -OutFile $Installer -UseBasicParsing
          if (-not (Test-Path $Installer)) { throw 'MT5 download failed.' }
          $Hash = Get-FileHash -Path $Installer -Algorithm SHA256
          Set-Content (Join-Path $env:EVIDENCE 'mt5-download.txt') ('SHA256=' + $Hash.Hash) -Encoding UTF8
          'INSTALLER=' + $Installer | Out-File $env:GITHUB_ENV -Append -Encoding UTF8

      - name: Install MT5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $Root = Join-Path $env:RUNNER_TEMP 'KingsBot-MT5'
          Remove-Item $Root -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $Root -Force | Out-Null
          $P = Start-Process $env:INSTALLER -ArgumentList '/auto',('/path=' + $Root) -Wait -PassThru
          Set-Content (Join-Path $env:EVIDENCE 'installer-exit-code.txt') $P.ExitCode -Encoding UTF8
          Start-Sleep -Seconds 5
          $T = Get-ChildItem $env:RUNNER_TEMP -Recurse -File -Filter 'terminal64.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          $E = Get-ChildItem $env:RUNNER_TEMP -Recurse -File -Filter 'metaeditor64.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $T) { $T = Get-ChildItem 'C:\Program Files' -Recurse -File -Filter 'terminal64.exe' -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if ($null -eq $E) { $E = Get-ChildItem 'C:\Program Files' -Recurse -File -Filter 'metaeditor64.exe' -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if ($null -eq $T) { throw 'terminal64.exe not found.' }
          if ($null -eq $E) { throw 'metaeditor64.exe not found.' }
          'TERMINAL=' + $T.FullName | Out-File $env:GITHUB_ENV -Append -Encoding UTF8
          'EDITOR=' + $E.FullName | Out-File $env:GITHUB_ENV -Append -Encoding UTF8
          'MT5ROOT=' + $T.Directory.FullName | Out-File $env:GITHUB_ENV -Append -Encoding UTF8
          Set-Content (Join-Path $env:EVIDENCE 'mt5-location.txt') ('Terminal=' + $T.FullName + [Environment]::NewLine + 'MetaEditor=' + $E.FullName) -Encoding UTF8

      - name: Prepare source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Target = Join-Path $env:MT5ROOT 'MQL5\Experts\KingsBot'
          New-Item -ItemType Directory -Path $Target -Force | Out-Null
          Copy-Item (Split-Path $env:SOURCE -Parent)\* $Target -Recurse -Force
          $Compile = Join-Path $Target 'KingsBot_Phase6_Integration.mq5'
          if (-not (Test-Path $Compile)) { throw 'Prepared MQ5 file not found.' }
          'COMPILE=' + $Compile | Out-File $env:GITHUB_ENV -Append -Encoding UTF8

      - name: Compile
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $P = Start-Process $env:EDITOR -ArgumentList ('/compile:' + $env:COMPILE),'/log' -Wait -PassThru
          Set-Content (Join-Path $env:EVIDENCE 'compile-exit-code.txt') $P.ExitCode -Encoding UTF8
          $EX5 = [System.IO.Path]::ChangeExtension($env:COMPILE,'.ex5')
          if (-not (Test-Path $EX5)) { throw 'EX5 was not produced.' }
          Copy-Item $EX5 $env:EVIDENCE -Force

      - name: Create tester configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Config = Join-Path $env:MT5ROOT 'KingsBot_Phase7_Tester.ini'
          Set-Content $Config '[Tester]','Expert=KingsBot\KingsBot_Phase6_Integration.ex5','Symbol=EURUSD','Period=M15','Model=1','Optimization=0','FromDate=2026.01.01','ToDate=2026.08.01','ForwardMode=0','Deposit=10000','Currency=USD','Leverage=1:100','Visual=0','ReplaceReport=1','Report=KingsBot_Phase7_Tester','ShutdownTerminal=1' -Encoding ASCII
          Copy-Item $Config $env:EVIDENCE -Force
          'CONFIG=' + $Config | Out-File $env:GITHUB_ENV -Append -Encoding UTF8

      - name: Run tester
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $P = Start-Process $env:TERMINAL -ArgumentList '/portable',('/config=' + $env:CONFIG) -WorkingDirectory $env:MT5ROOT -PassThru
          $End = (Get-Date).AddMinutes(20)
          while ((Get-Date) -lt $End) {
            $R = Get-ChildItem $env:MT5ROOT -Recurse -File -Include '*.htm','*.html' -ErrorAction SilentlyContinue | Where-Object { $_.Name -match 'KingsBot_Phase7_Tester' } | Select-Object -First 1
            if ($R) {
              Copy-Item $R.FullName $env:EVIDENCE -Force
              if (-not $P.HasExited) { Stop-Process $P.Id -Force -ErrorAction SilentlyContinue }
              exit 0
            }
            if ($P.HasExited) {
              Set-Content (Join-Path $env:EVIDENCE 'tester-exit-code.txt') $P.ExitCode -Encoding UTF8
              exit 1
            }
            Start-Sleep 5
          }
          Set-Content (Join-Path $env:EVIDENCE 'tester-timeout.txt') 'No tester report produced.' -Encoding UTF8
          exit 1

      - name: Collect evidence
        if: ${{ always() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Path $env:EVIDENCE -Force | Out-Null

          if ($env:MT5ROOT -and (Test-Path $env:MT5ROOT)) {
            Get-ChildItem $env:MT5ROOT -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object { $_.Extension -in '.log','.htm','.html','.ini','.xml','.txt' } |
              Select-Object -First 200 |
              ForEach-Object {
                Copy-Item $_.FullName $env:EVIDENCE -Force -ErrorAction SilentlyContinue
              }
          }

          Set-Content `
            -Path (Join-Path $env:EVIDENCE 'artifact-proof.txt') `
            -Value ('Artifact directory: ' + $env:EVIDENCE + [Environment]::NewLine + 'Created: ' + (Get-Date).ToString('o')) `
            -Encoding UTF8

          Get-ChildItem $env:EVIDENCE -Recurse -File |
            Select-Object FullName,Length,LastWriteTime |
            Out-File (Join-Path $env:EVIDENCE 'artifact-inventory.txt') -Encoding UTF8

      - name: Upload Phase 7 artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-Phase7-Artifacts-${{ github.run_number }}
          path: ${{ env.EVIDENCE }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
