name: King's Bot - Phase 7 Runtime Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase7:
    name: Phase 7 Runtime Validation
    runs-on: windows-2022
    timeout-minutes: 60

    env:
      BOT_SOURCE: KingsBot_Phase6_Integration.mq5
      BOT_EX5: KingsBot_Phase6_Integration.ex5
      BOT_FOLDER: KingsBot
      SYMBOL: EURUSD
      PERIOD: M15

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create evidence directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $Evidence = Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence'

          New-Item -ItemType Directory -Path $Evidence -Force | Out-Null

          "EVIDENCE=$Evidence" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "Phase 7 started: $(Get-Date -Format o)" |
            Set-Content (Join-Path $Evidence 'phase7-started.txt') -Encoding utf8

      - name: Find source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $Source = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Recurse `
            -File `
            -Filter $env:BOT_SOURCE `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $Source) {
            throw "Could not find $env:BOT_SOURCE"
          }

          "SOURCE=$($Source.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Copy-Item `
            -LiteralPath $Source.FullName `
            -Destination $env:EVIDENCE `
            -Force

          Get-ChildItem `
            -Path $Source.Directory.FullName `
            -Recurse `
            -File `
            -Include '*.mqh','*.mq5' `
            -ErrorAction SilentlyContinue |
            ForEach-Object {
              $Relative = $_.FullName.Substring(
                $Source.Directory.FullName.Length
              ).TrimStart('\')

              $Destination = Join-Path `
                $env:EVIDENCE `
                $Relative

              $Parent = Split-Path $Destination -Parent

              New-Item `
                -ItemType Directory `
                -Path $Parent `
                -Force | Out-Null

              Copy-Item `
                -LiteralPath $_.FullName `
                -Destination $Destination `
                -Force
            }

      - name: Download MetaTrader 5
        shell: pwsh
        run: |
          $
