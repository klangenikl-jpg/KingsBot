$ErrorActionPreference = 'Stop'

$workspace = $env:GITHUB_WORKSPACE
$mt5Root = 'C:\MT5'
$evidence = Join-Path $workspace 'phase7-evidence'

New-Item -ItemType Directory -Force -Path $evidence | Out-Null
New-Item -ItemType Directory -Force -Path "$evidence\Tester-Logs" | Out-Null
New-Item -ItemType Directory -Force -Path "$evidence\MT5-Logs" | Out-Null

Write-Host '========== PHASE 7 TESTER =========='

# ------------------------------------------------------------
# FIND MT5
# ------------------------------------------------------------

$terminal = Get-ChildItem `
    -Path $mt5Root `
    -Filter 'terminal64.exe' `
    -File `
    -Recurse `
    -ErrorAction SilentlyContinue |
    Select-Object -First 1

if ($null -eq $terminal) {

    Write-Host 'MT5 not found under C:\MT5.'
    Write-Host 'Searching standard installation locations.'

    $locations = @(
        "$env:APPDATA\MetaQuotes\Terminal",
        "$env:LOCALAPPDATA\Programs",
        'C:\Program Files',
        'C:\Program Files (x86)'
    )

    foreach ($location in $locations) {

        if (Test-Path -LiteralPath $location) {

            $terminal = Get-ChildItem `
                -Path $location `
                -Filter 'terminal64.exe' `
                -File `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

            if ($null -ne $terminal) {
                break
            }
        }
    }
}

# ------------------------------------------------------------
# INSTALL MT5 IF NECESSARY
# ------------------------------------------------------------

if ($null -eq $terminal) {

    Write-Host 'MT5 installation not found.'
    Write-Host '========== INSTALLING MT5 =========='

    $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'

    Invoke-WebRequest `
        -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' `
        -OutFile $installer `
        -UseBasicParsing

    if (-not (Test-Path -LiteralPath $installer)) {
        throw 'MT5 installer was not downloaded.'
    }

    New-Item `
        -ItemType Directory `
        -Force `
        -Path $mt5Root |
        Out-Null

    $install = Start-Process `
        -FilePath $installer `
        -ArgumentList @('/auto', "/path:$mt5Root") `
        -Wait `
        -PassThru

    Write-Host "MT5 installer exit code: $($install.ExitCode)"

    Start-Sleep -Seconds 10

    $terminal = Get-ChildItem `
        -Path $mt5Root `
        -Filter 'terminal64.exe' `
        -File `
        -Recurse `
        -ErrorAction SilentlyContinue |
        Select-Object -First 1
}

if ($null -eq $terminal) {
    throw 'terminal64.exe could not be found after MT5 discovery and installation.'
}

$terminalPath = $terminal.FullName
$terminalDir = Split-Path -Path $terminalPath -Parent

Write-Host "MT5 TERMINAL: $terminalPath"

# ------------------------------------------------------------
# FIND METAEDITOR
# ------------------------------------------------------------

$editor = Get-ChildItem `
    -Path $terminalDir `
    -Filter 'metaeditor64.exe' `
    -File `
    -Recurse `
    -ErrorAction SilentlyContinue |
    Select-Object -First 1

if ($null -eq $editor) {
    $editor = Get-ChildItem `
        -Path $mt5Root `
        -Filter 'metaeditor64.exe' `
        -File `
        -Recurse `
        -ErrorAction SilentlyContinue |
        Select-Object -First 1
}

if ($null -eq $editor) {
    throw 'metaeditor64.exe could not be found.'
}

Write-Host "MT5 EDITOR: $($editor.FullName)"

# ------------------------------------------------------------
# FIND EA
# ------------------------------------------------------------

$ex5 = Get-ChildItem `
    -Path $workspace `
    -Filter 'KingsBot_Phase6_Integration.ex5' `
    -File `
    -Recurse `
    -ErrorAction SilentlyContinue |
    Select-Object -First 1

if ($null -eq $ex5) {

    $ex5 = Get-ChildItem `
        -Path $mt5Root `
        -Filter 'KingsBot_Phase6_Integration.ex5' `
        -File `
        -Recurse `
        -ErrorAction SilentlyContinue |
        Select-Object -First 1
}

if ($null -eq $ex5) {
    throw 'KingsBot_Phase6_Integration.ex5 could not be found.'
}

Write-Host "EA: $($ex5.FullName)"
Write-Host "EA SIZE: $($ex5.Length) bytes"

# ------------------------------------------------------------
# COPY EA TO MT5
# ------------------------------------------------------------

$expertDir = Join-Path $mt5Root 'MQL5\Experts\KingsBot'

New-Item `
    -ItemType Directory `
    -Force `
    -Path $expertDir |
    Out-Null

Copy-Item `
    -LiteralPath $ex5.FullName `
    -Destination (Join-Path $expertDir 'KingsBot_Phase6_Integration.ex5') `
    -Force

$finalEx5 = Join-Path $expertDir 'KingsBot_Phase6_Integration.ex5'

if (-not (Test-Path -LiteralPath $finalEx5)) {
    throw 'EA could not be copied to the MT5 Experts directory.'
}

# ------------------------------------------------------------
# ACCOUNT CHECK
# ------------------------------------------------------------

if ([string]::IsNullOrWhiteSpace($env:MT5_LOGIN)) {
    throw 'MT5_LOGIN secret is missing.'
}

if ([string]::IsNullOrWhiteSpace($env:MT5_SERVER)) {
    throw 'MT5_SERVER secret is missing.'
}

if ([string]::IsNullOrWhiteSpace($env:MT5_PASSWORD)) {
    throw 'MT5_PASSWORD secret is missing.'
}

# ------------------------------------------------------------
# TESTER CONFIG
# ------------------------------------------------------------

$config = Join-Path $mt5Root 'KingsBot_Phase7_Tester.ini'

@"
[Common]
Login=$env:MT5_LOGIN
Password=$env:MT5_PASSWORD
Server=$env:MT5_SERVER

[Tester]
Expert=KingsBot\KingsBot_Phase6_Integration.ex5
Symbol=EURUSD
Period=M15
Model=0
Optimization=0
FromDate=2025.01.01
ToDate=2026.08.01
ForwardMode=0
Deposit=10000
Currency=USD
Leverage=1:100
Report=KingsBot_Phase7_Tester
ReplaceReport=1
ShutdownTerminal=1
Visual=0
UseCloud=0
"@ | Set-Content -LiteralPath $config -Encoding ASCII

Copy-Item `
    -LiteralPath $config `
    -Destination "$evidence\KingsBot_Phase7_Tester.ini" `
    -Force

# ------------------------------------------------------------
# START MT5
# ------------------------------------------------------------

Write-Host '========== STARTING MT5 TESTER =========='

Get-Process terminal64,metatester64,metatester `
    -ErrorAction SilentlyContinue |
    Stop-Process -Force -ErrorAction SilentlyContinue

Start-Sleep -Seconds 3

$process = Start-Process `
    -FilePath $terminalPath `
    -ArgumentList @(
        '/portable'
        "/config:$config"
        "/login:$env:MT5_LOGIN"
    ) `
    -WorkingDirectory $terminalDir `
    -PassThru

Write-Host "MT5 PID: $($process.Id)"

# ------------------------------------------------------------
# WAIT FOR REPORT
# ------------------------------------------------------------

for ($i = 1; $i -le 120; $i++) {

    Start-Sleep -Seconds 10

    $report = Get-ChildItem `
        -Path $mt5Root `
        -Filter 'KingsBot_Phase7_Tester*.htm' `
        -File `
        -Recurse `
        -ErrorAction SilentlyContinue |
        Sort-Object LastWriteTime -Descending |
        Select-Object -First 1

    if ($null -ne $report -and $report.Length -gt 500) {

        Write-Host '========== TESTER REPORT FOUND =========='
        Write-Host "REPORT: $($report.FullName)"
        Write-Host "SIZE: $($report.Length) bytes"

        Copy-Item `
            -LiteralPath $report.FullName `
            -Destination "$evidence\KingsBot_Phase7_Tester.htm" `
            -Force

        if (Test-Path -LiteralPath "$mt5Root\Tester\logs") {
            Copy-Item `
                -Path "$mt5Root\Tester\logs\*" `
                -Destination "$evidence\Tester-Logs" `
                -Recurse `
                -Force `
                -ErrorAction SilentlyContinue
        }

        if (Test-Path -LiteralPath "$mt5Root\logs") {
            Copy-Item `
                -Path "$mt5Root\logs\*" `
                -Destination "$evidence\MT5-Logs" `
                -Recurse `
                -Force `
                -ErrorAction SilentlyContinue
        }

        Write-Host '========== PHASE 7 TESTER SUCCESS =========='
        exit 0
    }

    if (($i % 3) -eq 0) {

        Write-Host "Tester running: $($i * 10) seconds"

        $log = Get-ChildItem `
            -Path "$mt5Root\Tester\logs" `
            -Filter '*.log' `
            -File `
            -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

        if ($null -ne $log) {

            Copy-Item `
                -LiteralPath $log.FullName `
                -Destination "$evidence\Tester-Logs\latest.log" `
                -Force

            $text = Get-Content `
                -LiteralPath $log.FullName `
                -Raw `
                -ErrorAction SilentlyContinue

            if ($text -match 'account is not specified') {
                throw 'MT5 Tester rejected the configured account.'
            }

            if ($text -match 'invalid account|invalid password|authorization failed') {
                throw 'MT5 Tester rejected the supplied account credentials.'
            }
        }
    }
}

throw 'MT5 Strategy Tester did not produce a report within 20 minutes.'
