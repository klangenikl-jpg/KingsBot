name: King's Bot - Phase 7 Runtime Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase7:
    name: Phase 7 Runtime and Strategy Tester
    runs-on: windows-2025
    timeout-minutes: 35

    env:
      MT5_DIR: C:\MT5
      BOT_SOURCE_NAME: KingsBot_Phase6_Integration.mq5
      EX5_NAME: KingsBot_Phase6_Integration.ex5

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Initialize Phase 7 evidence
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $evidence = Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence'

          Remove-Item -LiteralPath $evidence -Recurse -Force -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $evidence 'MT5-Logs') -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $evidence 'Tester-Logs') -Force | Out-Null

          @(
            "King's Bot Phase 7 Evidence"
            "Repository: $env:GITHUB_REPOSITORY"
            "Run: $env:GITHUB_RUN_NUMBER"
            "Started: $(Get-Date -Format o)"
          ) | Set-Content `
            -LiteralPath (Join-Path $evidence 'PHASE7-EVIDENCE-STARTED.txt') `
            -Encoding UTF8

      - name: Locate King's Bot source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter $env:BOT_SOURCE_NAME `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $source) {
            throw "Source not found: $env:BOT_SOURCE_NAME"
          }

          Write-Host "Source found: $($source.FullName)"

          "BOT_SOURCE=$($source.FullName)" |
            Out-File $env:GITHUB_ENV -Encoding utf8

          @(
            "Source: $($source.FullName)"
            "Size: $($source.Length) bytes"
          ) | Set-Content `
            -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence\source.txt') `
            -Encoding UTF8

      - name: Download MetaTrader 5 installer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'

          Invoke-WebRequest `
            -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' `
            -OutFile $installer `
            -UseBasicParsing `
            -TimeoutSec 180

          if (-not (Test-Path -LiteralPath $installer)) {
            throw 'MT5 installer was not downloaded.'
          }

          "Installer: $installer" |
            Set-Content `
              -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence\installer.txt') `
              -Encoding UTF8

          "MT5_INSTALLER=$installer" |
            Out-File $env:GITHUB_ENV -Encoding utf8

      - name: Install MetaTrader 5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'

          Remove-Item `
            -LiteralPath $env:MT5_DIR `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Path $env:MT5_DIR `
            -Force |
            Out-Null

          $process = Start-Process `
            -FilePath $env:MT5_INSTALLER `
            -ArgumentList @(
              '/auto'
              "/path:$env:MT5_DIR"
            ) `
            -Wait `
            -PassThru

          Write-Host "MT5 installer exit code: $($process.ExitCode)"

          "Installer exit code: $($process.ExitCode)" |
            Set-Content `
              -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence\installer-result.txt') `
              -Encoding UTF8

          Start-Sleep -Seconds 5

          $terminal = Get-ChildItem `
            -Path $env:MT5_DIR `
            -Filter 'terminal64.exe' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          $editor = Get-ChildItem `
            -Path $env:MT5_DIR `
            -Filter 'metaeditor64.exe' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $terminal) {
            throw 'terminal64.exe was not found.'
          }

          if ($null -eq $editor) {
            throw 'metaeditor64.exe was not found.'
          }

          Write-Host "Terminal: $($terminal.FullName)"
          Write-Host "MetaEditor: $($editor.FullName)"

          "MT5_TERMINAL=$($terminal.FullName)" |
            Out-File $env:GITHUB_ENV -Encoding utf8

          "METAEDITOR=$($editor.FullName)" |
            Out-File $env:GITHUB_ENV -Encoding utf8

          @(
            "Terminal: $($terminal.FullName)"
            "MetaEditor: $($editor.FullName)"
          ) | Set-Content `
            -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence\mt5-paths.txt') `
            -Encoding UTF8

      - name: Prepare King's Bot
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $expertDir = Join-Path `
            $env:MT5_DIR `
            'MQL5\Experts\KingsBot'

          New-Item `
            -ItemType Directory `
            -Path $expertDir `
            -Force |
            Out-Null

          $sourceRoot = Split-Path `
            $env:BOT_SOURCE `
            -Parent

          Copy-Item `
            -Path (Join-Path $sourceRoot '*') `
            -Destination $expertDir `
            -Recurse `
            -Force

          $expertSource = Join-Path `
            $expertDir `
            $env:BOT_SOURCE_NAME

          if (-not (Test-Path -LiteralPath $expertSource)) {
            throw "EA source was not copied: $expertSource"
          }

          "EXPERT_DIR=$expertDir" |
            Out-File $env:GITHUB_ENV -Encoding utf8

          "EXPERT_SOURCE=$expertSource" |
            Out-File $env:GITHUB_ENV -Encoding utf8

          @(
            "Expert directory: $expertDir"
            "Expert source: $expertSource"
          ) | Set-Content `
            -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence\expert-paths.txt') `
            -Encoding UTF8

      - name: Compile King's Bot
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'

          $evidence = Join-Path `
            $env:GITHUB_WORKSPACE `
            'phase7-evidence'

          $compileLog = Join-Path `
            $env:RUNNER_TEMP `
            'KingsBot-MetaEditor.log'

          Remove-Item `
            -LiteralPath $compileLog `
            -Force `
            -ErrorAction SilentlyContinue

          Write-Host "MetaEditor: $env:METAEDITOR"
          Write-Host "Expert source: $env:EXPERT_SOURCE"

          $process = Start-Process `
            -FilePath $env:METAEDITOR `
            -ArgumentList @(
              '/portable'
              "/compile:$env:EXPERT_SOURCE"
              "/log:$compileLog"
            ) `
            -WorkingDirectory $env:MT5_DIR `
            -Wait `
            -PassThru `
            -NoNewWindow

          Write-Host "MetaEditor process exit code: $($process.ExitCode)"

          if (Test-Path -LiteralPath $compileLog) {
            Copy-Item `
              -LiteralPath $compileLog `
              -Destination (Join-Path $evidence 'compile.log') `
              -Force
          }
          else {
            'MetaEditor did not create a compile log.' |
              Set-Content `
                -LiteralPath (Join-Path $evidence 'compile.log') `
                -Encoding UTF8
          }

          @(
            "MetaEditor process exit code: $($process.ExitCode)"
            "Compile log: $compileLog"
          ) | Set-Content `
            -LiteralPath (Join-Path $evidence 'compile-result.txt') `
            -Encoding UTF8

          Write-Host '========== METAEDITOR OUTPUT =========='

          if (Test-Path -LiteralPath $compileLog) {
            Get-Content -LiteralPath $compileLog
          }

          Write-Host '========================================'

          Write-Host "Searching entire MT5 installation for $env:EX5_NAME ..."

          Start-Sleep -Seconds 3

          $ex5 = Get-ChildItem `
            -Path $env:MT5_DIR `
            -Filter $env:EX5_NAME `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if ($null -eq $ex5) {
            Write-Host 'EX5 was not found in the first search.'
            Write-Host 'Searching again after a delay...'

            Start-Sleep -Seconds 5

            $ex5 = Get-ChildItem `
              -Path $env:MT5_DIR `
              -Filter $env:EX5_NAME `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1
          }

          if ($null -eq $ex5) {
            Write-Host '===== ALL EX5 FILES FOUND ====='

            Get-ChildItem `
              -Path $env:MT5_DIR `
              -Filter '*.ex5' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 100 |
              ForEach-Object {
                Write-Host "$($_.FullName) | $($_.Length) bytes | $($_.LastWriteTime)"
              }

            Write-Host '===== END EX5 SEARCH ====='

            throw "Compilation completed but $env:EX5_NAME was not found anywhere under $env:MT5_DIR."
          }

          Write-Host "EX5 FOUND: $($ex5.FullName)"
          Write-Host "EX5 SIZE: $($ex5.Length) bytes"

          @(
            "EX5 found: $($ex5.FullName)"
            "Size: $($ex5.Length) bytes"
            "LastWriteTime: $($ex5.LastWriteTime)"
          ) | Set-Content `
            -LiteralPath (Join-Path $evidence 'ex5-result.txt') `
            -Encoding UTF8

          Copy-Item `
            -LiteralPath $ex5.FullName `
            -Destination (Join-Path $evidence $env:EX5_NAME) `
            -Force

      - name: Create Strategy Tester configuration
        shell: powershell
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          $config = Join-Path `
            $env:MT5_DIR `
            'KingsBot_Phase7_Tester.ini'

          @(
            '[Common]'
            "Login=$env:MT5_LOGIN"
            "Password=$env:MT5_PASSWORD"
            "Server=$env:MT5_SERVER"
            'KeepPrivate=0'
            ''
            '[Tester]'
            "Login=$env:MT5_LOGIN"
            "Password=$env:MT5_PASSWORD"
            "Server=$env:MT5_SERVER"
            'Expert=KingsBot\KingsBot_Phase6_Integration.ex5'
            'Symbol=EURUSD'
            'Period=M15'
            'Model=0'
            'Optimization=0'
            'FromDate=2025.01.01'
            'ToDate=2026.08.01'
            'ForwardMode=0'
            'Deposit=10000'
            'Currency=USD'
            'Leverage=100'
            'Visual=0'
            'UseCloud=0'
            'ReplaceReport=1'
            'ShutdownTerminal=1'
            'Report=Reports\KingsBot_Phase7_Tester.htm'
          ) | Set-Content `
            -LiteralPath $config `
            -Encoding ASCII

          Copy-Item `
            -LiteralPath $config `
            -Destination (Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence\Tester-Config.ini') `
            -Force

      - name: Run Strategy Tester
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'

          $report = Join-Path `
            $env:MT5_DIR `
            'Reports\KingsBot_Phase7_Tester.htm'

          Remove-Item `
            -LiteralPath $report `
            -Force `
            -ErrorAction SilentlyContinue

          $config = Join-Path `
            $env:MT5_DIR `
            'KingsBot_Phase7_Tester.ini'

          $process = Start-Process `
            -FilePath $env:MT5_TERMINAL `
            -ArgumentList @(
              '/portable'
              "/config:$config"
            ) `
            -WorkingDirectory $env:MT5_DIR `
            -PassThru

          Write-Host "Tester MT5 PID: $($process.Id)"

          $elapsed = 0
          $found = $false

          while ($elapsed -lt 1200) {
            Start-Sleep -Seconds 10
            $elapsed += 10

            $result = Get-Item `
              -LiteralPath $report `
              -ErrorAction SilentlyContinue

            if ($null -ne $result -and $result.Length -gt 1000) {
              $found = $true
              Write-Host "Tester report found after $elapsed seconds."
              break
            }

            if ($process.HasExited) {
              Write-Host "MT5 exited with code: $($process.ExitCode)"
            }
            else {
              Write-Host "Tester running: $elapsed seconds"
            }
          }

          @(
            "Elapsed seconds: $elapsed"
            "MT5 exited: $($process.HasExited)"
            "Expected report: $report"
          ) | Set-Content `
            -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence\tester-result.txt') `
            -Encoding UTF8

          if (-not $found) {
            throw 'Strategy Tester report was not produced.'
          }

          Copy-Item `
            -LiteralPath $report `
            -Destination (Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence\KingsBot_Phase7_Tester.htm') `
            -Force

      - name: Collect final evidence
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'

          $e
