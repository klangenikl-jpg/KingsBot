name: KingsBot Phase 7 Runtime and Strategy Tester

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase7:
    name: T5 Runtime and Strategy Tester
    runs-on: windows-2025
    timeout-minutes: 30

    env:
      MT5_DIR: C:\MT5
      BOT_SOURCE_NAME: KingsBot_Phase6_Integration.mq5
      TEST_SYMBOL: EURUSD
      TEST_PERIOD: M15
      TEST_FROM: "2025.01.01"
      TEST_TO: "2026.08.01"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate King's Bot source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter $env:BOT_SOURCE_NAME `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $source) {
            throw "Could not find $env:BOT_SOURCE_NAME"
          }

          Write-Host "Source: $($source.FullName)"

          "BOT_SOURCE=$($source.FullName)" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download MetaTrader 5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          $url = 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe'

          $downloaded = $false

          for ($attempt = 1; $attempt -le 5; $attempt++) {
            Write-Host "MT5 download attempt $attempt of 5"

            try {
              Invoke-WebRequest `
                -Uri $url `
                -OutFile $installer `
                -UseBasicParsing `
                -TimeoutSec 120

              if (Test-Path $installer) {
                $size = (Get-Item $installer).Length
                Write-Host "Installer size: $size bytes"

                if ($size -gt 1000000) {
                  $downloaded = $true
                  break
                }
              }
            }
            catch {
              Write-Host "Download failed: $($_.Exception.Message)"
            }

            if ($attempt -lt 5) {
              Start-Sleep -Seconds 10
            }
          }

          if (-not $downloaded) {
            throw 'Unable to download MetaTrader 5 installer'
          }

          "MT5_INSTALLER=$installer" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install MetaTrader 5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host 'Installing MetaTrader 5...'
          Write-Host "Target: $env:MT5_DIR"

          Remove-Item `
            -Path $env:MT5_DIR `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Path $env:MT5_DIR `
            -Force |
            Out-Null

          $installArgs = "/auto /path:$env:MT5_DIR"

          Write-Host "Installer: $env:MT5_INSTALLER"

          $p = Start-Process `
            -FilePath $env:MT5_INSTALLER `
            -ArgumentList $installArgs `
            -Wait `
            -PassThru `
            -NoNewWindow

          Write-Host "MT5 installer exit code: $($p.ExitCode)"

          "MT5_INSTALLER_EXIT_CODE=$($p.ExitCode)" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          $terminal = Join-Path $env:MT5_DIR 'terminal64.exe'
          $editor = Join-Path $env:MT5_DIR 'metaeditor64.exe'
          $tester = Join-Path $env:MT5_DIR 'metatester64.exe'

          Write-Host 'Searching for MT5 executables...'

          if (-not (Test-Path $terminal)) {
            $terminalFound = Get-ChildItem `
              -Path $env:MT5_DIR `
              -Filter 'terminal64.exe' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if ($terminalFound) {
              $terminal = $terminalFound.FullName
            }
          }

          if (-not (Test-Path $editor)) {
            $editorFound = Get-ChildItem `
              -Path $env:MT5_DIR `
              -Filter 'metaeditor64.exe' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if ($editorFound) {
              $editor = $editorFound.FullName
            }
          }

          if (-not (Test-Path $tester)) {
            $testerFound = Get-ChildItem `
              -Path $env:MT5_DIR `
              -Filter 'metatester64.exe' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if ($testerFound) {
              $tester = $testerFound.FullName
            }
          }

          if (-not (Test-Path $terminal)) {
            throw 'terminal64.exe was not installed'
          }

          if (-not (Test-Path $editor)) {
            throw 'metaeditor64.exe was not installed'
          }

          Write-Host "MetaTrader terminal: $terminal"
          Write-Host "MetaEditor: $editor"

          if (Test-Path $tester) {
            Write-Host "MetaTester: $tester"
          }
          else {
            Write-Host 'MetaTester executable not found directly; MT5 terminal tester will be used.'
          }

          "MT5_TERMINAL=$terminal" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "MT5_EDITOR=$editor" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare King's Bot
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $expertDir = Join-Path $env:MT5_DIR 'MQL5\Experts\KingsBot'
          $reportDir = Join-Path $env:MT5_DIR 'Reports'
          $testerDir = Join-Path $env:MT5_DIR 'Tester'

          New-Item -ItemType Directory -Path $expertDir -Force | Out-Null
          New-Item -ItemType Directory -Path $reportDir -Force | Out-Null
          New-Item -ItemType Directory -Path $testerDir -Force | Out-Null

          $sourceRoot = Split-Path $env:BOT_SOURCE -Parent

          Copy-Item `
            -Path (Join-Path $sourceRoot '*') `
            -Destination $expertDir `
            -Recurse `
            -Force

          $expertSource = Join-Path `
            $expertDir `
            $env:BOT_SOURCE_NAME

          if (-not (Test-Path $expertSource)) {
            throw "Source copy failed: $expertSource"
          }

          Write-Host "Expert source: $expertSource"

          "EXPERT_DIR=$expertDir" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "EXPERT_SOURCE=$expertSource" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "REPORT_DIR=$reportDir" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compile King's Bot
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "MetaEditor: $env:MT5_EDITOR"
          Write-Host "Source: $env:EXPERT_SOURCE"

          $compileArgs = "/compile:$env:EXPERT_SOURCE /log"

          $p = Start-Process `
            -FilePath $env:MT5_EDITOR `
            -ArgumentList $compileArgs `
            -WorkingDirectory $env:MT5_DIR `
            -Wait `
            -PassThru `
            -NoNewWindow

          Write-Host "MetaEditor process exit code: $($p.ExitCode)"

          "MT5_COMPILE_EXIT_CODE=$($p.ExitCode)" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          $ex5 = Join-Path `
            $env:EXPERT_DIR `
            'KingsBot_Phase6_Integration.ex5'

          if (-not (Test-Path $ex5)) {
            throw "EX5 was not produced: $ex5"
          }

          $info = Get-Item $ex5

          Write-Host 'EX5 was produced.'
          Write-Host "Size: $($info.Length) bytes"
          Write-Host "Last write: $($info.LastWriteTime)"

          if ($info.Length -lt 1000) {
            throw 'EX5 is unexpectedly small'
          }

          "EXPERT_EX5=$ex5" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create authenticated tester configuration
        shell: powershell
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:MT5_LOGIN)) {
            throw 'MT5_LOGIN secret is missing'
          }

          if ([string]::IsNullOrWhiteSpace($env:MT5_SERVER)) {
            throw 'MT5_SERVER secret is missing'
          }

          if ([string
