name: King's Bot - Phase 7 Runtime Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase7:
    name: Phase 7 Runtime and Strategy Tester
    runs-on: windows-2025
    timeout-minutes: 30

    env:
      MT5_DIR: C:\MT5
      BOT_SOURCE_NAME: KingsBot_Phase6_Integration.mq5
      EX5_NAME: KingsBot_Phase6_Integration.ex5
      MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
      MT5_SERVER: ${{ secrets.MT5_SERVER }}
      MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Create evidence directories
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          New-Item -ItemType Directory `
            -Path "$env:GITHUB_WORKSPACE\phase7-evidence" `
            -Force | Out-Null

          New-Item -ItemType Directory `
            -Path "$env:GITHUB_WORKSPACE\phase7-evidence\MT5-Logs" `
            -Force | Out-Null

          New-Item -ItemType Directory `
            -Path "$env:GITHUB_WORKSPACE\phase7-evidence\Tester-Logs" `
            -Force | Out-Null

          Write-Host "Phase 7 evidence directories ready."

      - name: Validate required secrets
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:MT5_LOGIN)) {
            throw 'MT5_LOGIN secret is missing.'
          }

          if ([string]::IsNullOrWhiteSpace($env:MT5_SERVER)) {
            throw 'MT5_SERVER secret is missing.'
          }

          if ([string]::IsNullOrWhiteSpace($env:MT5_PASSWORD)) {
            throw 'MT5_PASSWORD secret is missing.'
          }

          if ($env:MT5_LOGIN -notmatch '^[0-9]+$') {
            throw 'MT5_LOGIN must contain only digits.'
          }

          Write-Host "MT5 account login is present."
          Write-Host "MT5 server is present."

      - name: Locate King Bot source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Get-ChildItem `
            -Path "$env:GITHUB_WORKSPACE" `
            -Filter "$env:BOT_SOURCE_NAME" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $source) {
            throw "Could not find $env:BOT_SOURCE_NAME."
          }

          Write-Host "SOURCE: $($source.FullName)"

          "BOT_SOURCE=$($source.FullName)" |
            Out-File "$env:GITHUB_ENV" -Encoding utf8

      - name: Locate or install MT5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $terminal = Get-ChildItem `
            -Path "$env:MT5_DIR" `
            -Filter 'terminal64.exe' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $terminal) {

            Write-Host 'MT5 not found. Downloading installer.'

            $installer = "$env:RUNNER_TEMP\mt5setup.exe"

            Invoke-WebRequest `
              -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' `
              -OutFile $installer `
              -UseBasicParsing

            if (-not (Test-Path -LiteralPath $installer)) {
              throw 'MT5 installer download failed.'
            }

            New-Item `
              -ItemType Directory `
              -Path "$env:MT5_DIR" `
              -Force | Out-Null

            $arguments = @(
              '/auto'
              "/path:$env:MT5_DIR"
            )

            $installerProcess = Start-Process `
              -FilePath $installer `
              -ArgumentList $arguments `
              -Wait `
              -PassThru

            Write-Host "MT5 installer exit code: $($installerProcess.ExitCode)"

            Start-Sleep -Seconds 10

            $terminal = Get-ChildItem `
              -Path "$env:MT5_DIR" `
              -Filter 'terminal64.exe' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }

          if ($null -eq $terminal) {
            throw 'terminal64.exe could not be located.'
          }

          $editor = Get-ChildItem `
            -Path "$env:MT5_DIR" `
            -Filter 'metaeditor64.exe' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $editor) {
            throw 'metaeditor64.exe could not be located.'
          }

          Write-Host "MT5 TERMINAL: $($terminal.FullName)"
          Write-Host "MT5 EDITOR: $($editor.FullName)"

          "MT5_TERMINAL=$($terminal.FullName)" |
            Out-File "$env:GITHUB_ENV" -Encoding utf8

          "MT5_EDITOR=$($editor.FullName)" |
            Out-File "$env:GITHUB_ENV" -Encoding utf8

      - name: Prepare King Bot
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $expertDir = "$env:MT5_DIR\MQL5\Experts\KingsBot"

          New-Item `
            -ItemType Directory `
            -Path $expertDir `
            -Force | Out-Null

          $sourceDir = Split-Path `
            -Path "$env:BOT_SOURCE" `
            -Parent

          Copy-Item `
            -Path "$sourceDir\*" `
            -Destination $expertDir `
            -Recurse `
            -Force

          $expertSource = "$expertDir\$env:BOT_SOURCE_NAME"

          if (-not (Test-Path -LiteralPath $expertSource)) {
            throw 'King Bot source was not copied into MT5.'
          }

          Write-Host "EA SOURCE: $expertSource"

      - name: Compile King Bot
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $source = "$env:MT5_DIR\MQL5\Experts\KingsBot\$env:BOT_SOURCE_NAME"
          $compileLog = "$env:GITHUB_WORKSPACE\phase7-evidence\compile.log"

          $arguments = @(
            '/portable'
            "/compile:$source"
            "/log:$compileLog"
          )

          $compileProcess = Start-Process `
            -FilePath "$env:MT5_EDITOR" `
            -ArgumentList $arguments `
            -WorkingDirectory "$env:MT5_DIR" `
            -Wait `
            -PassThru

          Write-Host "MetaEditor exit code: $($compileProcess.ExitCode)"

          if (Test-Path -LiteralPath $compileLog) {
            Get-Content -LiteralPath $compileLog
          }

      - name: Verify EX5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $finalEx5 = "$env:MT5_DIR\MQL5\Experts\KingsBot\$env:EX5_NAME"

          $ex5 = Get-ChildItem `
            -Path "$env:MT5_DIR" `
            -Filter "$env:EX5_NAME" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

