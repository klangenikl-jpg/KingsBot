name: King's Bot - Phase 7 Runtime Validation

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  MT5_DIR: C:\MT5
  BOT_SOURCE_NAME: KingsBot_Phase6_Integration.mq5
  TEST_SYMBOL: EURUSD
  TEST_PERIOD: M15
  TEST_FROM: 2024.01.02
  TEST_TO: 2024.08.20

jobs:
  phase7:
    name: Phase 7 Runtime and Strategy Tester
    runs-on: windows-2025
    timeout-minutes: 35

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Locate King's Bot source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter $env:BOT_SOURCE_NAME `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $source) {
            throw "Could not find $env:BOT_SOURCE_NAME"
          }

          Write-Host "Source found:"
          Write-Host $source.FullName

          "BOT_SOURCE=$($source.FullName)" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare evidence directory
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $evidence = Join-Path `
            $env:GITHUB_WORKSPACE `
            'phase7-evidence'

          Remove-Item `
            -LiteralPath $evidence `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Path $evidence `
            -Force |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Path (Join-Path $evidence 'MT5-Logs') `
            -Force |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Path (Join-Path $evidence 'Tester-Logs') `
            -Force |
            Out-Null

          $marker = Join-Path $evidence 'PHASE7-EVIDENCE-STARTED.txt'

          @(
            "King's Bot Phase 7 Evidence"
            "Workflow: $env:GITHUB_WORKFLOW"
            "Run: $env:GITHUB_RUN_NUMBER"
            "Repository: $env:GITHUB_REPOSITORY"
            "Started: $(Get-Date -Format o)"
          ) |
            Set-Content `
              -LiteralPath $marker `
              -Encoding UTF8

          Write-Host "Evidence directory:"
          Write-Host $evidence

          Write-Host "Initial evidence contents:"
          Get-ChildItem `
            -LiteralPath $evidence `
            -Recurse `
            -Force |
            Select-Object FullName,Length

          "EVIDENCE_DIR=$evidence" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download MetaTrader 5 installer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path `
            $env:RUNNER_TEMP `
            'mt5setup.exe'

          $url = 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe'

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer `
            -UseBasicParsing `
            -TimeoutSec 180

          $item = Get-Item `
            -LiteralPath $installer `
            -ErrorAction SilentlyContinue

          if ($null -eq $item) {
            throw 'MT5 installer was not downloaded.'
          }

          if ($item.Length -lt 1000000) {
            throw "MT5 installer is unexpectedly small: $($item.Length) bytes"
          }

          Write-Host "Installer size: $($item.Length) bytes"

          "MT5_INSTALLER=$installer" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install MetaTrader 5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'

          Remove-Item `
            -Path $env:MT5_DIR `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Path $
