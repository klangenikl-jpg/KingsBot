name: KingsBot Phase 7 Runtime Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase7:
    name: Phase 7 MT5 Runtime Validation
    runs-on: windows-2022
    timeout-minutes: 45

    env:
      MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
      MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
      MT5_SERVER: ${{ secrets.MT5_SERVER }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create evidence directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          New-Item `
            -ItemType Directory `
            -Path "$env:GITHUB_WORKSPACE\phase7-evidence" `
            -Force |
            Out-Null

      - name: Find KingsBot source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Get-ChildItem `
            -LiteralPath $env:GITHUB_WORKSPACE `
            -Filter 'KingsBot_Phase6_Integration.mq5' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $source) {
            throw 'KingsBot_Phase6_Integration.mq5 was not found.'
          }

          Write-Host "Source found:"
          Write-Host $source.FullName

          "SOURCE=$($source.FullName)" |
            Out-File `
              $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      - name: Download MT5 installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path `
            $env:RUNNER_TEMP `
            'mt5setup.exe'

          Invoke-WebRequest `
            -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' `
            -OutFile $installer `
            -UseBasicParsing

          if (-not (Test-Path -LiteralPath $installer)) {
            throw 'MT5 installer download failed.'
          }

          $size = (Get-Item -LiteralPath $installer).Length

          Write-Host "Installer size: $size bytes"

          if ($size -lt 1000000) {
            throw 'MT5 installer is invalid or incomplete.'
          }

          "MT5_INSTALLER=$installer" |
            Out-File `
              $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      - name: Install MT5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $process = Start-Process `
            -FilePath $env:MT5_INSTALLER `
            -ArgumentList '/auto' `
            -Wait `
            -PassThru

          Write-Host "MT5 installer exit code: $($process.ExitCode)"

          Start-Sleep -Seconds 5

      - name: Locate MetaEditor and terminal
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $roots = @(
            'C:\Program Files',
            'C:\Program Files (x86)',
            'C:\MT5',
            $env:LOCALAPPDATA,
            $env:APPDATA,
            $env:RUNNER_TEMP
          )

          $metaEditor = $null
          $terminal = $null

          foreach ($root in $roots) {

            if (-not (Test-Path -LiteralPath $root)) {
              continue
            }

            if ($null -eq $metaEditor) {
              $metaEditor = Get-ChildItem `
                -LiteralPath $root `
                -Filter 'metaeditor64.exe' `
                -File `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1
            }

            if ($null -eq $terminal) {
              $terminal = Get-ChildItem `
                -LiteralPath $root `
                -Filter 'terminal64.exe' `
                -File `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1
            }

            if (($null -ne $metaEditor) -and ($null -ne $terminal)) {
              break
            }
          }

          if ($null -eq $metaEditor) {
            throw 'metaeditor64.exe was not found.'
          }

          if ($null -eq $terminal) {
            throw 'terminal64.exe was not found.'
          }

          $mt5Root = $terminal.Directory.FullName

          Write-Host "MetaEditor: $($metaEditor.FullName)"
          Write-Host "Terminal: $($terminal.FullName)"
          Write-Host "MT5 root: $mt5Root"

          "METAEDITOR=$($metaEditor.FullName)" |
            Out-File `
              $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          "MT5_TERMINAL=$($terminal.FullName)" |
            Out-File `
              $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          "MT5_ROOT=$mt5Root" |
            Out-File `
              $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      - name: Prepare KingsBot files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $expertDir = Join-Path `
            $env:MT5_ROOT `
            'MQL5\Experts\KingsBot'

          New-Item `
            -ItemType Directory `
            -Path $expertDir `
            -Force |
            Out-Null

          Copy-Item `
            -LiteralPath $env:SOURCE `
            -Destination "$expertDir\KingsBot_Phase6_Integration.mq5" `
            -Force

          $includes = @(
            'KB_StrategySignal.mqh',
            'KingsBot_Strategy_Swing.mqh',
            'KingsBot_Strategy_Structure.mqh',
            'KingsBot_Strategy_Liquidity.mqh',
            'KingsBot_Strategy_OrderBlock.mqh',
            'KingsBot_Strategy_FVG.mqh',
            'KingsBot_DecisionEngine.mqh',
            'KingsBot_RiskManager.mqh'
          )

          foreach ($name in $includes) {

            $file = Get-ChildItem `
              -LiteralPath $env:GITHUB_WORKSPACE `
              -Filter $name `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if ($null -eq $file) {
              throw "Required include missing: $name"
            }

            Copy-Item `
              -LiteralPath $file.FullName `
              -Destination "$expertDir\$name" `
              -Force
          }

          if (-not (Test-Path `
            -LiteralPath "$expertDir\KingsBot_Phase6_Integration.mq5")) {
            throw 'Prepared MQ5 source is missing.'
          }

          "EXPERT_DIR=$expertDir" |
            Out-File `
              $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          "EXPERT=$expertDir\KingsBot_Phase6_Integration.mq5" |
            Out-File `
              $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      - name: Compile KingsBot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $evidence = "$env:GITHUB_WORKSPACE\phase7-evidence"
          $log = "$evidence\metaeditor-output.txt"

          Set-Content `
            -LiteralPath $log `
            -Value 'KingsBot Phase 7 MetaEditor diagnostic'

          Add-Content $log "MetaEditor: $env:METAEDITOR"
          Add-Content $log "Source: $env:EXPERT"
          Add-Content $log "Expert directory: $env:EXPERT_DIR"

          Write-Host "Compiling:"
          Write-Host $env:EXPERT

          $arguments = "/compile:`"$env:EXPERT`" /log"

          $process = Start-Process `
            -FilePath $env:METAEDITOR `
            -ArgumentList $arguments `
            -WorkingDirectory $env:EXPERT_DIR `
            -Wait `
            -PassThru

          $exitCode = $process.ExitCode

          Write-Host "MetaEditor exit code: $exitCode"

          Add-Content $log "MetaEditor exit code: $exitCode"

          Start-Sleep -Seconds 5

          $matches = @()

          $searchRoots = @(
            $env:EXPERT_DIR,
            $env:MT5_ROOT,
            $env:GITHUB_WORKSPACE,
            $env:RUNNER_TEMP
          )

          foreach ($root in $searchRoots) {

            if (-not (Test-Path -LiteralPath $root)) {
              continue
            }

            $found = Get-ChildItem `
              -LiteralPath $root `
              -Filter 'KingsBot_Phase6_Integration.ex5' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue

            if ($null -ne $found) {
              $matches += $found
            }
          }

          if ($matches.Count -gt 0) {

            $ex5 = $matches |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1

            Write-Host "EX5 FOUND:"
            Write-Host $ex5.FullName

            Add-Content `
              $log `
              "EX5 FOUND: $($ex5.FullName)"

            Copy-Item `
              -LiteralPath $ex5.FullName `
              -Destination "$evidence\KingsBot_Phase6_Integration.ex5" `
              -Force

            Set-Content `
              -LiteralPath "$evidence\ex5-location.txt" `
              -Value $ex5.FullName
          }
          else {

            Write-Host 'NO EX5 FOUND.'

            Add-Content `
              $log `
              'NO EX5 FOUND.'

            $recentLogs = Get-ChildItem `
              -LiteralPath $env:MT5_ROOT `
              -Filter '*.log' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 20

            foreach ($item in $recentLogs) {

              Add-Content `
                $log `
                "===== $($item.FullName) ====="

              Get-Content `
                -LiteralPath $item.FullName `
                -ErrorAction SilentlyContinue |
                Add-Content $log
            }

            throw 'MetaEditor completed but no KingsBot EX5 was produced.'
          }

      - name: Check runtime credentials
        id: runtime
        shell: pwsh
        run: |
          $ready = (
            -not [string]::IsNullOrWhiteSpace($env:MT5_LOGIN) -and
            -not [string]::IsNullOrWhiteSpace($env:MT5_PASSWORD) -and
            -not [string]::IsNullOrWhiteSpace($env:MT5_SERVER)
          )

          if ($ready) {
            "READY=true" |
              Out-File `
                $env:GITHUB_OUTPUT `
                -Append `
                -Encoding utf8

            Write-Host 'MT5 runtime credentials are available.'
          }
          else {
            "READY=false" |
              Out-File `
                $env:GITHUB_OUTPUT `
                -Append `
                -Encoding utf8

            Write-Host 'MT5 runtime credentials are not configured.'
            Write-Host 'Strategy Tester will be skipped.'
          }

      - name: Create tester configuration
        if: steps.runtime.outputs.READY == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $config = Join-Path `
            $env:MT5_ROOT `
            'KingsBot_Phase7_Tester.ini'

          $lines = @(
            '[Common]',
            "Login=$env:MT5_LOGIN",
            "Password=$env:MT5_PASSWORD",
            "Server=$env:MT5_SERVER",
            'KeepPrivate=1',
            'NewsEnable=0',
            '',
            '[Tester]',
            'Expert=KingsBot\KingsBot_Phase6_Integration.ex5',
            'Symbol=EURUSD',
            'Period=M15',
            'Model=4',
            'Optimization=0',
            'FromDate=2025.01.01',
            'ToDate=2026.08.01',
            'Deposit=10000',
            'Currency=USD',
            'Leverage=1:100',
            'Visual=0',
            'Report=KingsBot_Phase7_Tester.htm',
            'ReplaceReport=1',
            'ShutdownTerminal=1'
          )

          $lines |
            Set-Content `
              -LiteralPath $config `
              -Encoding Unicode

          "TESTER_CONFIG=$config" |
            Out-File `
              $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          Copy-Item `
            -LiteralPath $config `
            -Destination "$env:GITHUB_WORKSPACE\phase7-evidence\" `
            -Force

      - name: Run Strategy Tester
        if: steps.runtime.outputs.READY == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $report = Join-Path `
            $env:MT5_ROOT `
            'KingsBot_Phase7_Tester.htm'

          Remove-Item `
            -LiteralPath $report `
            -Force `
            -ErrorAction SilentlyContinue

          $process = Start-Process `
            -FilePath $env:MT5_TERMINAL `
            -ArgumentList @(
              '/portable',
              "/config:$env:TESTER_CONFIG"
            ) `
            -WorkingDirectory $env:MT5_ROOT `
            -PassThru

          Write-Host "MT5 PID: $($process.Id)"

          $deadline = (Get-Date).AddMinutes(20)

          while ((Get-Date) -lt $deadline) {

            if (Test-Path -LiteralPath $report) {
              break
            }

            Start-Sleep -Seconds 10
          }

          if (-not (Test-Path -LiteralPath $report)) {
            throw 'NO TESTER REPORT FOUND.'
          }

          $size = (Get-Item -LiteralPath $report).Length

          if ($size -le 0) {
            throw 'Strategy Tester report is empty.'
          }

          Copy-Item `
            -LiteralPath $report `
            -Destination "$env:GITHUB_WORKSPACE\phase7-evidence\" `
            -Force

      - name: Record runtime status
        if: always()
        shell: pwsh
        run: |
          if ('${{ steps.runtime.outputs.READY }}' -eq 'true') {
            'Strategy Tester was enabled.' |
              Set-Content `
                "$env:GITHUB_WORKSPACE\phase7-evidence\runtime-status.txt"
          }
          else {
            'Strategy Tester was skipped because MT5 credentials were not configured.' |
              Set-Content `
                "$env:GITHUB_WORKSPACE\phase7-evidence\runtime-status.txt"
          }

      - name: Collect diagnostics
        if: always()
        shell: pwsh
        run: |
          $evidence = "$env:GITHUB_WORKSPACE\phase7-evidence"

          if ($env:MT5_ROOT -and (Test-Path -LiteralPath $env:MT5_ROOT)) {

            Get-ChildItem `
              -LiteralPath $env:MT5_ROOT `
              -Recurse `
              -File `
              -Include '*.log','*.ini','*.htm','*.html' `
              -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 100 |
              ForEach-Object {

                Copy-Item `
                  -LiteralPath $_.FullName `
                  -Destination $evidence `
                  -Force `
                  -ErrorAction SilentlyContinue
              }
          }

      - name: Upload Phase 7 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-Phase7-Evidence
          path: phase7-evidence
          if-no-files-found: warn
          retention-days: 14
