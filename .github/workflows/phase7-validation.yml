name: KingsBot Phase 7 Runtime Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase7-runtime:
    name: Phase 7 MT5 Runtime and Strategy Tester
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $evidence = Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence'

          New-Item -ItemType Directory -Path $evidence -Force | Out-Null

          "Phase 7 started: $(Get-Date -Format o)" |
            Set-Content -LiteralPath (Join-Path $evidence 'phase7-start.txt') -Encoding UTF8

      - name: Verify source files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Join-Path $env:GITHUB_WORKSPACE 'KingsBot_Phase6_Integration.mq5'

          if (-not (Test-Path -LiteralPath $source)) {
            throw "KingsBot_Phase6_Integration.mq5 not found: $source"
          }

          $required = @(
            'KB_StrategySignal.mqh'
            'KingsBot_Strategy_Swing.mqh'
            'KingsBot_Strategy_Structure.mqh'
            'KingsBot_Strategy_Liquidity.mqh'
            'KingsBot_Strategy_OrderBlock.mqh'
            'KingsBot_Strategy_FVG.mqh'
            'KingsBot_DecisionEngine.mqh'
            'KingsBot_RiskManager.mqh'
          )

          foreach ($name in $required) {
            $path = Join-Path $env:GITHUB_WORKSPACE $name

            if (-not (Test-Path -LiteralPath $path)) {
              throw "Required MQL5 include not found: $name"
            }
          }

          Write-Host "Source verified:"
          Write-Host $source

          @(
            "SOURCE=$source"
            "SOURCE_SIZE=$((Get-Item -LiteralPath $source).Length)"
            "REQUIRED_INCLUDE_COUNT=$($required.Count)"
          ) |
            Set-Content `
              -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence\source-verification.txt') `
              -Encoding UTF8

      - name: Download MT5 installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'

          Write-Host 'Downloading official MetaTrader 5 installer...'

          Invoke-WebRequest `
            -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' `
            -OutFile $installer `
            -UseBasicParsing

          if (-not (Test-Path -LiteralPath $installer)) {
            throw 'MT5 installer download failed.'
          }

          $size = (Get-Item -LiteralPath $installer).Length

          Write-Host "Installer size: $size bytes"

          if ($size -le 0) {
            throw 'MT5 installer is empty.'
          }

          "INSTALLER=$installer" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install and locate MT5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $evidence = Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence'

          Write-Host 'Starting MT5 unattended installation...'

          $installerProcess = Start-Process `
            -FilePath $env:INSTALLER `
            -ArgumentList @('/auto') `
            -PassThru

          $deadline = (Get-Date).AddMinutes(5)

          while ((Get-Date) -lt $deadline) {
            if ($installerProcess.HasExited) {
              break
            }

            Start-Sleep -Seconds 10
          }

          if (-not $installerProcess.HasExited) {
            Stop-Process `
             
