name: KingsBot Phase 7 Runtime Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase7-runtime:
    name: Phase 7 MT5 Runtime and Strategy Tester
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence'
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          "Phase 7 started: $(Get-Date -Format o)" |
            Set-Content -LiteralPath (Join-Path $evidence 'phase7-start.txt') -Encoding UTF8

      - name: Locate Phase 6 integration source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Recurse `
            -File `
            -Filter 'KingsBot_Phase6_Integration.mq5' `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $source) {
            throw 'KingsBot_Phase6_Integration.mq5 was not found.'
          }

          Write-Host ('SOURCE: ' + $source.FullName)

          $source.FullName |
            Set-Content `
              -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence\source-location.txt') `
              -Encoding UTF8

          "SOURCE_DIR=$($source.Directory.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Download MetaTrader 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'

          Invoke-WebRequest `
            -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' `
            -OutFile $installer `
            -UseBasicParsing

          if (-not (Test-Path -LiteralPath $installer)) {
            throw 'MT5 installer download failed.'
          }

          "INSTALLER=$installer" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host 'Installing MT5 using unattended standard installation.'

          $p = Start-Process `
            -FilePath $env:INSTALLER `
            -ArgumentList '/auto' `
            -Wait `
            -PassThru

          $exitCode = $p.ExitCode
          Write-Host ('MT5 installer exit code: ' + $exitCode)

          $
