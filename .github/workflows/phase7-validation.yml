name: KingsBot Phase 7 Runtime and Strategy Tester

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase7:
    name: T5 Runtime and Strategy Tester
    runs-on: windows-2025
    timeout-minutes: 30

    env:
      MT5_DIR: C:\MT5
      BOT_SOURCE_NAME: KingsBot_Phase6_Integration.mq5
      TEST_SYMBOL: EURUSD
      TEST_PERIOD: M15
      TEST_FROM: "2025.01.01"
      TEST_TO: "2026.08.01"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate King's Bot source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter $env:BOT_SOURCE_NAME `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $source) {
            throw "Could not find $env:BOT_SOURCE_NAME."
          }

          Write-Host "Source: $($source.FullName)"

          "BOT_SOURCE=$($source.FullName)" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download MetaTrader 5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'

          $url = 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe'

          $success = $false

          for ($attempt = 1; $attempt -le 5; $attempt++) {

            Write-Host "MT5 download attempt $attempt of 5"

            try {
              Invoke-WebRequest `
                -Uri $url `
                -OutFile $installer `
                -UseBasicParsing `
                -TimeoutSec 120

              if (Test-Path $installer) {
                $size = (Get-Item $installer).Length

                Write-Host "Downloaded installer size: $size bytes"

                if ($size -gt 1000000) {
                  $success = $true
                  break
                }
              }
            }
            catch {
              Write-Host "Download attempt failed: $($_.Exception.Message)"
            }

            if ($attempt -lt 5) {
              Start-Sleep -Seconds 10
            }
          }

          if (-not $success) {
            throw 'Unable to download the MetaTrader 5 installer.'
          }

          "MT5_INSTALLER=$installer" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install MetaTrader 5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Remove-Item `
            $env:MT5_DIR `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Path $env:MT5_DIR `
            -Force |
            Out-Null

          Write-Host "Installing MT5 into $env:MT5_DIR"

          $p = Start-Process `
            -FilePath $env:MT5_INSTALLER `
            -ArgumentList @(
              '/auto'
              "/path:$env:MT5_DIR"
            ) `
            -Wait `
            -PassThru `
            -NoNewWindow

          Write-Host "Installer exit code: $($p.ExitCode)"

          "MT5_INSTALLER_EXIT_CODE=$($p.ExitCode)" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          $terminal = Join-Path $env:MT5_DIR 'terminal64.exe'
          $editor = Join-Path $env:MT5_DIR 'metaeditor64.exe'
          $tester = Join-Path $env:MT5_DIR 'metatester64.exe'

          Write-Host 'Checking MT5 binaries...'

          Get-ChildItem `
            -Path $env:MT5_DIR `
            -Filter '*.exe' `
            -File `
            -ErrorAction SilentlyContinue |
            Select-Object Name, Length, LastWriteTime |
            Format-Table -AutoSize

          if (-not (Test-Path $terminal)) {
            throw "terminal64.exe not found."
          }

          if (-not (Test-Path $editor)) {
            throw "metaeditor64.exe not found."
          }

          if (-not (Test-Path $tester)) {
            throw "metatester64.exe not found."
          }

          Write-Host 'MT5 installation verified.'

          "MT5_TERMINAL=$terminal" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "MT5_EDITOR=$editor" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "MT5_TESTER=$tester" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "MT5_ROOT_ACTUAL=$env:MT5_DIR" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare portable MT5 environment
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $root = $env:MT5_ROOT_ACTUAL

          $expertDir = Join-Path $root 'MQL5\Experts\KingsBot'
          $reportDir = Join-Path $root 'Reports'
          $testerDir = Join-Path $root 'Tester'
          $logsDir = Join-Path $root 'Logs'

          New-Item -ItemType Directory -Path $expertDir -Force | Out-Null
          New-Item -ItemType Directory -Path $reportDir -Force | Out-Null
          New-Item -ItemType Directory -Path $testerDir -Force | Out-Null
          New-Item -ItemType Directory -Path $logsDir -Force | Out-Null

          $sourceRoot = Split-Path $env:BOT_SOURCE -Parent

          Copy-Item `
            -Path (Join-Path $sourceRoot '*') `
            -Destination $expertDir `
            -Recurse `
            -Force

          $expertSource = Join-Path `
            $expertDir `
            $env:BOT_SOURCE_NAME

          if (-not (Test-Path $expertSource)) {
            throw "Source copy failed: $expertSource"
          }

          Write-Host "Expert source: $expertSource"

          "EXPERT_DIR=$expertDir" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "EXPERT_SOURCE=$expertSource" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "REPORT_DIR=$reportDir" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compile King's Bot
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "MetaEditor: $env:MT5_EDITOR"
          Write-Host "Source: $env:EXPERT_SOURCE"

          $compiler = Start-Process `
            -FilePath $env:MT5_EDITOR `
            -ArgumentList @(
              "/compile:$env:EXPERT_SOURCE"
              '/log'
            ) `
            -WorkingDirectory $env:MT5_ROOT_ACTUAL `
            -Wait `
            -PassThru

          Write-Host "MetaEditor exit code: $($compiler.ExitCode)"

          "MT5_COMPILE_EXIT_CODE=$($compiler.ExitCode)" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          $ex5 = Join-Path `
            $env:EXPERT_DIR `
            'KingsBot_Phase6_Integration.ex5'

          if (-not (Test-Path $ex5)) {
            throw "Expected EX5 was not produced."
          }

          $info = Get-Item $ex5

          Write-Host "EX5 produced."
          Write-Host "Size: $($info.Length) bytes"
          Write-Host "Last write: $($info.LastWriteTime)"

          if ($info.Length -lt 1000) {
            throw 'EX5 is invalid or unexpectedly small.'
          }

          "EXPERT_EX5=$ex5" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Initialize MT5 portable runtime
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host 'Initializing portable MT5 runtime...'

          $process = Start-Process `
            -FilePath $env:MT5_TERMINAL `
            -ArgumentList @('/portable') `
            -WorkingDirectory $env:MT5_ROOT_ACTUAL `
            -PassThru

          Write-Host "Initialization PID: $($process.Id)"

          Start-Sleep -Seconds 15

          if (-not $process.HasExited) {
            Write-Host 'MT5 initialization process is running.'

            Stop-Process `
              -Id $process.Id `
              -Force `
              -ErrorAction SilentlyContinue

            Start-Sleep -Seconds 3
          }
          else {
            Write-Host "MT5 initialization exited with code $($process.ExitCode)"
          }

          Write-Host 'Portable runtime initialization complete.'

      - name: Create Phase 7 tester configuration
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $config = Join-Path `
            $env:MT5_ROOT_ACTUAL `
            'KingsBot_Phase7_Tester.ini'

          $lines = @(
            '[Tester]'
            'Expert=KingsBot\KingsBot_Phase6_Integration.ex5'
            "Symbol=$env:TEST_SYMBOL"
            "Period=$env:TEST_PERIOD"
            'Model=0'
            'Optimization=0'
            "FromDate=$env:TEST_FROM"
            "ToDate=$env:TEST_TO"
            'ForwardMode=0'
            'Deposit=10000'
            'Currency=USD'
            'Leverage=1:100'
            'Report=Reports\KingsBot_Phase7_Tester.htm'
            'ReplaceReport=1'
            'ShutdownTerminal=1'
            'Visual=0'
            'UseLocal=1'
            'UseRemote=0'
            'UseCloud=0'
          )

          [System.IO.File]::WriteAllLines(
            $config,
            $lines,
            [System.Text.Encoding]::ASCII
          )

          Write-Host '===== TESTER CONFIG ====='
          Get-Content $config
          Write-Host '========================='

          "TESTER_CONFIG=$config" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify tester infrastructure
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $agentExe = Join-Path `
            $env:MT5_ROOT_ACTUAL `
            'metatester64.exe'

          $testerRoot = Join-Path `
            $env:MT5_ROOT_ACTUAL `
            'Tester'

          $expert = Join-Path `
            $env:MT5_ROOT_ACTUAL `
            'MQL5\Experts\KingsBot\KingsBot_Phase6_Integration.ex5'

          if (-not (Test-Path $agentExe)) {
            throw 'metatester64.exe is missing.'
          }

          if (-not (Test-Path $testerRoot)) {
            New-Item `
              -ItemType Directory `
              -Path $testerRoot `
              -Force |
              Out-Null
          }

          if (-not (Test-Path $expert)) {
            throw "Tester EX5 missing: $expert"
          }

          Write-Host "MetaTester: $agentExe"
          Write-Host "Tester root: $testerRoot"
          Write-Host "EX5: $expert"

          Write-Host 'Existing tester infrastructure:'

          Get-ChildItem `
            -Path $testerRoot `
            -Force `
            -ErrorAction SilentlyContinue |
            Select-Object FullName, Length, LastWriteTime |
            Format-Table -AutoSize

      - name: Run Phase 7 Strategy Tester
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $report = Join-Path `
            $env:REPORT_DIR `
            'KingsBot_Phase7_Tester.htm'

          Remove-Item `
            $report `
            -Force `
            -ErrorAction SilentlyContinue

          Write-Host 'Launching Phase 7 Strategy Tester...'
          Write-Host "Terminal: $env:MT5_TERMINAL"
          Write-Host "Config: $env:TESTER_CONFIG"
          Write-Host "Report: $report"

          $process = Start-Process `
            -FilePath $env:MT5_TERMINAL `
            -ArgumentList @(
              '/portable'
              "/config:$env:TESTER_CONFIG"
            ) `
            -WorkingDirectory $env:MT5_ROOT_ACTUAL `
            -PassThru

          Write-Host "MT5 PID: $($process.Id)"

          $timeout = 900
          $elapsed = 0

          while (-not $process.HasExited) {

            Start-Sleep -Seconds 5
            $elapsed += 5

            if (($elapsed % 30) -eq 0) {
              Write-Host "MT5 running: ${elapsed}s"
            }

            if ($elapsed -ge $timeout) {

              Write-Host 'Tester timeout reached.'

              Stop-Process `
                -Id $process.Id `
                -Force `
                -ErrorAction SilentlyContinue

              throw 'Strategy Tester exceeded 15 minutes.'
            }
          }

          $exitCode = $process.ExitCode

          Write-Host "MT5 exit code: $exitCode"

          "MT5_EXIT_CODE=$exitCode" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          if (-not (Test-Path $report)) {

            Write-Host 'NO TESTER REPORT FOUND.'

            Write-Host '===== TESTER DIRECTORY ====='

            Get-ChildItem `
              -Path (Join-Path $env:MT5_ROOT_ACTUAL 'Tester') `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object FullName, Length, LastWriteTime |
              Format-Table -AutoSize

            Write-Host '===== MT5 LOG FILES ====='

            Get-ChildItem `
              -Path $env:MT5_ROOT_ACTUAL `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Extension -in '.log', '.ini'
              } |
              Select-Object FullName, Length, LastWriteTime |
              Format-Table -AutoSize

            throw "MT5 Strategy Tester failed with exit code $exitCode and produced no report."
          }

          $reportInfo = Get-Item $report

          Write-Host '================================'
          Write-Host 'PHASE 7 REPORT SUCCESSFULLY FOUND'
          Write-Host '================================'
          Write-Host "Report: $($reportInfo.FullName)"
          Write-Host "Size: $($reportInfo.Length) bytes"

          if ($reportInfo.Length -lt 1000) {
            throw 'Tester report is unexpectedly small.'
          }

          "TESTER_REPORT=$report" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Collect Phase 7 evidence
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'

          $evidence = Join-Path `
            $env:GITHUB_WORKSPACE `
            'phase7-evidence'

          New-Item `
            -ItemType Directory `
            -Path $evidence `
            -Force |
            Out-Null

          if ($env:TESTER_CONFIG -and (Test-Path $env:TESTER_CONFIG)) {
            Copy-Item `
              $env:TESTER_CONFIG `
              (Join-Path $evidence 'KingsBot_Phase7_Tester.ini') `
              -Force
          }

          if ($env:TESTER_REPORT -and (Test-Path $env:TESTER_REPORT)) {
            Copy-Item `
              $env:TESTER_REPORT `
              (Join-Path $evidence 'KingsBot_Phase7_Tester.htm') `
              -Force
          }

          if ($env:EXPERT_EX5 -and (Test-Path $env:EXPERT_EX5)) {
            Copy-Item `
              $env:EXPERT_EX5 `
              (Join-Path $evidence 'KingsBot_Phase6_Integration.ex5') `
              -Force
          }

          $testerRoot = Join-Path `
            $env:MT5_ROOT_ACTUAL `
            'Tester'

          if (Test-Path $testerRoot) {

            $destination = Join-Path `
              $evidence `
              'Tester'

            Copy-Item `
              $testerRoot `
              $destination `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue
          }

          $logDestination = Join-Path `
            $evidence `
            'MT5-Logs'

          New-Item `
            -ItemType Directory `
            -Path $logDestination `
            -Force |
            Out-Null

          Get-ChildItem `
            -Path $env:MT5_ROOT_ACTUAL `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Extension -in '.log', '.ini', '.htm', '.html'
            } |
            ForEach-Object {

              $safeName = $_.Name

              Copy-Item `
                $_.FullName `
                (Join-Path $logDestination $safeName) `
                -Force `
                -ErrorAction SilentlyContinue
            }

          $summary = @(
            'KingsBot Phase 7 Runtime and Strategy Tester'
            ''
            "Installer exit code: $env:MT5_INSTALLER_EXIT_CODE"
            "MetaEditor exit code: $env:MT5_COMPILE_EXIT_CODE"
            "MT5 runtime exit code: $env:MT5_EXIT_CODE"
            "Terminal: $env:MT5_TERMINAL"
            "MetaTester: $env:MT5_TESTER"
            "Tester config: $env:TESTER_CONFIG"
            "Tester report: $env:TESTER_REPORT"
            "Symbol: $env:TEST_SYMBOL"
            "Period: $env:TEST_PERIOD"
            "From: $env:TEST_FROM"
            "To: $env:TEST_TO"
          )

          Set-Content `
            -Path (Join-Path $evidence 'PHASE7_SUMMARY.txt') `
            -Value $summary `
            -Encoding utf8

          Write-Host '===== EVIDENCE CONTENT ====='

          Get-ChildItem `
            -Path $evidence `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object FullName, Length, LastWriteTime |
            Format-Table -AutoSize

      - name: Upload Phase 7 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-Phase7-Evidence
          path: phase7-evidence
          if-no-files-found: warn
          retention-days: 14
