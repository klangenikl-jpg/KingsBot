name: King's Bot - Phase 7 Runtime Validation

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  MT5_DIR: C:\MT5
  BOT_SOURCE_NAME: KingsBot_Phase6_Integration.mq5
  TEST_SYMBOL: EURUSD
  TEST_PERIOD: M15
  TEST_FROM: 2024.01.02
  TEST_TO: 2024.08.20

jobs:
  phase7:
    name: Phase 7 Runtime and Strategy Tester
    runs-on: windows-2025
    timeout-minutes: 35

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Initialize Phase 7 evidence
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $evidence = Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence'

          Remove-Item -LiteralPath $evidence -Recurse -Force -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $evidence 'MT5-Logs') -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $evidence 'Tester-Logs') -Force | Out-Null

          @(
            "King's Bot Phase 7 Evidence"
            "Repository: $env:GITHUB_REPOSITORY"
            "Workflow: $env:GITHUB_WORKFLOW"
            "Run: $env:GITHUB_RUN_NUMBER"
            "Started: $(Get-Date -Format o)"
          ) | Set-Content -LiteralPath (Join-Path $evidence 'PHASE7-EVIDENCE-STARTED.txt') -Encoding UTF8

          Write-Host "Evidence directory: $evidence"

      - name: Locate King's Bot source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter $env:BOT_SOURCE_NAME `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $source) {
            throw "Could not find $env:BOT_SOURCE_NAME"
          }

          Write-Host "Source found: $($source.FullName)"

          @(
            "Source: $($source.FullName)"
            "Size: $($source.Length) bytes"
          ) | Set-Content `
            -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence\source-info.txt') `
            -Encoding UTF8

          "BOT_SOURCE=$($source.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8

      - name: Download MetaTrader 5 installer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'

          Invoke-WebRequest `
            -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' `
            -OutFile $installer `
            -UseBasicParsing `
            -TimeoutSec 180

          if (-not (Test-Path -LiteralPath $installer)) {
            throw 'MT5 installer was not downloaded.'
          }

          $size = (Get-Item -LiteralPath $installer).Length

          Write-Host "Installer size: $size bytes"

          "Installer size: $size bytes" | Set-Content `
            -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence\installer-info.txt') `
            -Encoding UTF8

          "MT5_INSTALLER=$installer" | Out-File $env:GITHUB_ENV -Encoding utf8

      - name: Install MetaTrader 5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'

          Remove-Item -LiteralPath $env:MT5_DIR -Recurse -Force -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Path $env:MT5_DIR -Force | Out-Null

          $p = Start-Process `
            -FilePath $env:MT5_INSTALLER `
            -ArgumentList @(
              '/auto'
              "/path:$env:MT5_DIR"
            ) `
            -Wait `
            -PassThru

          Write-Host "MT5 installer exit code: $($p.ExitCode)"

          @(
            "Installer exit code: $($p.ExitCode)"
            "Completed: $(Get-Date -Format o)"
          ) | Set-Content `
            -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence\installer-result.txt') `
            -Encoding UTF8

          Start-Sleep -Seconds 5

          $terminal = Get-ChildItem `
            -Path $env:MT5_DIR `
            -Filter 'terminal64.exe' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          $editor = Get-ChildItem `
            -Path $env:MT5_DIR `
            -Filter 'metaeditor64.exe' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $terminal) {
            throw 'terminal64.exe was not found after MT5 installation.'
          }

          if ($null -eq $editor) {
            throw 'metaeditor64.exe was not found after MT5 installation.'
          }

          Write-Host "Terminal: $($terminal.FullName)"
          Write-Host "MetaEditor: $($editor.FullName)"

          @(
            "Terminal: $($terminal.FullName)"
            "MetaEditor: $($editor.FullName)"
          ) | Set-Content `
            -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence\mt5-paths.txt') `
            -Encoding UTF8

      - name: Prepare King's Bot
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $expertDir = Join-Path $env:MT5_DIR 'MQL5\Experts\KingsBot'
          $reportDir = Join-Path $env:MT5_DIR 'Reports'
          $sourceRoot = Split-Path $env:BOT_SOURCE -Parent

          New-Item -ItemType Directory -Path $expertDir -Force | Out-Null
          New-Item -ItemType Directory -Path $reportDir -Force | Out-Null

          Copy-Item `
            -Path (Join-Path $sourceRoot '*') `
            -Destination $expertDir `
            -Recurse `
            -Force

          $expertSource = Join-Path $expertDir $env:BOT_SOURCE_NAME

          if (-not (Test-Path -LiteralPath $expertSource)) {
            throw "EA source was not copied correctly: $expertSource"
          }

          @(
            "Expert directory: $expertDir"
            "Expert source: $expertSource"
          ) | Set-Content `
            -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence\expert-paths.txt') `
            -Encoding UTF8

      - name: Compile King's Bot
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'

          $evidence = Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence'
          $expertDir = Join-Path $env:MT5_DIR 'MQL5\Experts\KingsBot'
          $expertSource = Join-Path $expertDir $env:BOT_SOURCE_NAME

          $editor = Get-ChildItem `
            -Path $env:MT5_DIR `
            -Filter 'metaeditor64.exe' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $editor) {
            throw 'MetaEditor could not be found.'
          }

          if (-not (Test-Path -LiteralPath $expertSource)) {
            throw "EA source not found: $expertSource"
          }

          $compileLog = Join-Path $evidence 'metaeditor.log'

          Write-Host "MetaEditor: $($editor.FullName)"
          Write-Host "Source: $expertSource"

          $p = Start-Process `
            -FilePath $editor.FullName `
            -ArgumentList @(
              '/portable'
              "/compile:$expertSource"
              "/log:$compileLog"
            ) `
            -WorkingDirectory $env:MT5_DIR `
            -Wait `
            -PassThru `
            -NoNewWindow

          Write-Host "MetaEditor exit code: $($p.ExitCode)"

          "MetaEditor exit code: $($p.ExitCode)" | Set-Content `
            -LiteralPath (Join-Path $evidence 'metaeditor-exit-code.txt') `
            -Encoding UTF8

          if (Test-Path -LiteralPath $compileLog) {
            Copy-Item `
              -LiteralPath $compileLog `
              -Destination (Join-Path $evidence 'metaeditor-output.log') `
              -Force
          }

          $ex5 = Get-ChildItem `
            -Path $expertDir `
            -Filter 'KingsBot_Phase6_Integration.ex5' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $ex5) {
            Get-ChildItem `
              -Path $expertDir `
              -Filter '*.ex5' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object FullName,Length,LastWriteTime |
              Format-Table -AutoSize |
              Out-String |
              Set-Content `
                -LiteralPath (Join-Path $evidence 'ex5-discovery.txt') `
                -Encoding UTF8

            throw "KingsBot_Phase6_Integration.ex5 was not produced. MetaEditor exit code: $($p.ExitCode)"
          }

          Copy-Item `
            -LiteralPath $ex5.FullName `
            -Destination (Join-Path $evidence 'KingsBot_Phase6_Integration.ex5') `
            -Force

          @(
            "EX5: $($ex5.FullName)"
            "Size: $($ex5.Length) bytes"
            "Modified: $($ex5.LastWriteTime.ToString('o'))"
          ) | Set-Content `
            -LiteralPath (Join-Path $evidence 'ex5-result.txt') `
            -Encoding UTF8

      - name: Create MT5 connection configuration
        shell: powershell
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:MT5_LOGIN)) {
            throw 'MT5_LOGIN secret is missing.'
          }

          if ([string]::IsNullOrWhiteSpace($env:MT5_SERVER)) {
            throw 'MT5_SERVER secret is missing.'
          }

          if ([string]::IsNullOrWhiteSpace($env:MT5_PASSWORD)) {
            throw 'MT5_PASSWORD secret is missing.'
          }

          $config = Join-Path $env:MT5_DIR 'KingsBot_Phase7_Connection.ini'

          @(
            '[Common]'
            "Login=$env:MT5_LOGIN"
            "Password=$env:MT5_PASSWORD"
            "Server=$env:MT5_SERVER"
            'KeepPrivate=0'
          ) | Set-Content -LiteralPath $config -Encoding ASCII

          @(
            '[Common]'
            "Login=$env:MT5_LOGIN"
            'Password=***'
            "Server=$env:MT5_SERVER"
          ) | Set-Content `
            -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence\Connection-Config.ini') `
            -Encoding UTF8

      - name: Start MT5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $terminal = Get-ChildItem `
            -Path $env:MT5_DIR `
            -Filter 'terminal64.exe' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $terminal) {
            throw 'terminal64.exe could not be found.'
          }

          $config = Join-Path $env:MT5_DIR 'KingsBot_Phase7_Connection.ini'

          $p = Start-Process `
            -FilePath $terminal.FullName `
            -ArgumentList @(
              '/portable'
              "/config:$config"
            ) `
            -WorkingDirectory $env:MT5_DIR `
            -PassThru

          Write-Host "MT5 PID: $($p.Id)"

          @(
            "Terminal: $($terminal.FullName)"
            "PID: $($p.Id)"
            "Started: $(Get-Date -Format o)"
          ) | Set-Content `
            -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence\mt5-process.txt') `
            -Encoding UTF8

          Start-Sleep -Seconds 60

      - name: Create Strategy Tester configuration
        shell: powershell
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          MT5_PASSWORD: ${{
