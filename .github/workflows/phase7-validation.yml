name: KingsBot Phase 7 Runtime Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase7-runtime:
    name: Phase 7 MT5 Runtime and Strategy Tester
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create evidence directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path "$env:GITHUB_WORKSPACE\phase7-evidence" -Force | Out-Null

      - name: Locate Phase 6 integration source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Get-ChildItem `
            "$env:GITHUB_WORKSPACE" `
            -Recurse `
            -File `
            -Filter "KingsBot_Phase6_Integration.mq5" `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $source) {
            throw "KingsBot_Phase6_Integration.mq5 was not found."
          }

          Write-Host "SOURCE: $($source.FullName)"
          $source.FullName | Set-Content `
            "$env:GITHUB_WORKSPACE\phase7-evidence\source-location.txt"

          "SOURCE_DIR=$($source.Directory.FullName)" >> $env:GITHUB_ENV

      - name: Download MetaTrader 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = "$env:RUNNER_TEMP\mt5setup.exe"

          Invoke-WebRequest `
            -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" `
            -OutFile $installer `
            -UseBasicParsing

          if (-not (Test-Path $installer)) {
            throw "MT5 installer download failed."
          }

          "INSTALLER=$installer" >> $env:GITHUB_ENV

      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "Installing MT5 using unattended standard installation."

          $p = Start-Process `
            -FilePath $env:INSTALLER `
            -ArgumentList "/auto" `
            -Wait `
            -PassThru

          Write-Host "MT5 installer exit code: $($p.Exit
