name: KingsBot Phase 7 Runtime and Strategy Tester

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/phase7-validation.yml"
      - "**/*.mq5"
      - "**/*.mqh"

permissions:
  contents: read

jobs:
  phase7:
    name: T5 Runtime and Strategy Tester
    runs-on: windows-2025
    timeout-minutes: 30

    env:
      BOT_SOURCE_NAME: KingsBot_Phase6_Integration.mq5
      TEST_SYMBOL: EURUSD
      TEST_PERIOD: M15
      TEST_FROM: "2025.01.01"
      TEST_TO: "2026.08.01"
      MT5_DIR: C:\MT5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate King’s Bot source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter $env:BOT_SOURCE_NAME `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $source) {
            throw "Could not find $env:BOT_SOURCE_NAME."
          }

          Write-Host "Source found:"
          Write-Host $source.FullName

          "BOT_SOURCE=$($source.FullName)" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download MT5 installer with retries
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          $url = 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe'

          if (Test-Path $installer) {
            Remove-Item $installer -Force
          }

          Write-Host 'Downloading MetaTrader 5 installer...'

          $success = $false

          for ($attempt = 1; $attempt -le 5; $attempt++) {
            Write-Host "Download attempt $attempt of 5"

            & aria2c `
              --allow-overwrite=true `
              --auto-file-renaming=false `
              --check-integrity=true `
              --connect-timeout=30 `
              --timeout=60 `
              --max-tries=3 `
              --retry-wait=5 `
              --split=4 `
              --max-connection-per-server=4 `
              --file-allocation=none `
              --dir="$env:RUNNER_TEMP" `
              --out='mt5setup.exe' `
              "$url"

            if ($LASTEXITCODE -eq 0 -and (Test-Path $installer)) {
              $size = (Get-Item $installer).Length

              if ($size -gt 1000000) {
                Write-Host "MT5 installer downloaded successfully: $size bytes"
                $success = $true
                break
              }

              Write-Host "Downloaded file is too small: $size bytes"
            }
            else {
              Write-Host "aria2 exit code: $LASTEXITCODE"
            }

            if ($attempt -lt 5) {
              Start-Sleep -Seconds 10
            }
          }

          if (-not $success) {
            throw 'Unable to obtain a valid MetaTrader 5 installer after 5 attempts.'
          }

          "MT5_INSTALLER=$installer" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install MetaTrader 5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          if (Test-Path $env:MT5_DIR) {
            Remove-Item `
              -Path $env:MT5_DIR `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue
          }

          New-Item `
            -ItemType Directory `
            -Path $env:MT5_DIR `
            -Force |
            Out-Null

          Write-Host 'Installing MetaTrader 5...'

          $arguments = @(
            '/auto'
            "/path:$env:MT5_DIR"
          )

          $p = Start-Process `
            -FilePath $env:MT5_INSTALLER `
            -ArgumentList $arguments `
            -Wait `
            -PassThru

          Write-Host "Installer exit code: $($p.ExitCode)"

          if ($p.ExitCode -ne 0) {
            throw "MetaTrader 5 installer failed with exit code $($p.ExitCode)."
          }

      - name: Locate MT5 terminal and MetaEditor
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $terminal = Get-ChildItem `
            -Path $env:MT5_DIR `
            -Filter terminal64.exe `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          $editor = Get-ChildItem `
            -Path $env:MT5_DIR `
            -Filter metaeditor64.exe `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $terminal) {
            throw 'terminal64.exe was not found.'
          }

          if ($null -eq $editor) {
            throw 'metaeditor64.exe was not found.'
          }

          Write-Host "Terminal: $($terminal.FullName)"
          Write-Host "MetaEditor: $($editor.FullName)"

          "MT5_TERMINAL=$($terminal.FullName)" |
            Out-File
