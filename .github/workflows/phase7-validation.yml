name: King's Bot - Phase 7 Runtime Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase7:
    name: Phase 7 Runtime and Strategy Tester Validation
    runs-on: windows-2022
    timeout-minutes: 60

    env:
      BOT_SOURCE: KingsBot_Phase6_Integration.mq5
      BOT_FOLDER: KingsBot
      TEST_SYMBOL: EURUSD
      TEST_PERIOD: M15

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $Evidence = Join-Path $env:GITHUB_WORKSPACE 'phase7-artifacts'

          New-Item -ItemType Directory -Path $Evidence -Force | Out-Null

          Set-Content `
            -Path (Join-Path $Evidence 'phase7-started.txt') `
            -Value "Phase 7 started: $(Get-Date -Format o)" `
            -Encoding UTF8

          "EVIDENCE=$Evidence" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append `
            -Encoding UTF8

      - name: Locate King’s Bot source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $Source = Join-Path $env:GITHUB_WORKSPACE $env:BOT_SOURCE

          if (-not (Test-Path -LiteralPath $Source -PathType Leaf)) {
            throw "King's Bot source was not found: $Source"
          }

          "SOURCE=$Source" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append `
            -Encoding UTF8

          Copy-Item `
            -LiteralPath $Source `
            -Destination $env:EVIDENCE `
            -Force

          Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -File `
            -Filter '*.mqh' `
            -ErrorAction SilentlyContinue |
            ForEach-Object {
              Copy-Item `
                -LiteralPath $_.FullName `
                -Destination $env:EVIDENCE `
                -Force
            }

          Set-Content `
            -Path (Join-Path $env:EVIDENCE 'source-location.txt') `
            -Value $Source `
            -Encoding UTF8

      - name: Download MetaTrader 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $Installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'

          Invoke-WebRequest `
            -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' `
            -OutFile $Installer `
            -UseBasicParsing

          if (-not (Test-Path -LiteralPath $Installer -PathType Leaf)) {
            throw 'MetaTrader 5 installer download failed.'
          }

          $Hash = Get-FileHash `
            -Path $Installer `
            -Algorithm SHA256

          Set-Content `
            -Path (Join-Path $env:EVIDENCE 'mt5-installer-sha256.txt') `
            -Value $Hash.Hash `
            -Encoding UTF8

          "INSTALLER=$Installer" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append `
            -Encoding UTF8

      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $InstallRoot = Join-Path $env:RUNNER_TEMP 'KingsBot-MT5'

          Remove-Item `
            -LiteralPath $InstallRoot `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Path $InstallRoot `
            -Force | Out-Null

          $Process = Start-Process `
            -FilePath $env:INSTALLER `
            -ArgumentList @(
              '/auto',
              "/path=$InstallRoot"
            ) `
            -Wait `
            -PassThru

          Set-Content `
            -Path (Join-Path $env:EVIDENCE 'mt5-installer-exit-code.txt') `
            -Value $Process.ExitCode `
            -Encoding UTF8

          Start-Sleep -Seconds 8

          $Terminal = $null
          $Editor = $null

          $TerminalCandidates = @(
            (Join-Path $InstallRoot 'terminal64.exe'),
            (Join-Path $InstallRoot 'terminal.exe')
          )

          foreach ($Candidate in $TerminalCandidates) {
            if (Test-Path -LiteralPath $Candidate -PathType Leaf) {
              $Terminal = Get-Item -LiteralPath $Candidate
              break
            }
          }

          if ($null -eq $Terminal) {
            $Terminal = Get-ChildItem `
              -Path $InstallRoot `
              -Recurse `
              -File `
              -Filter 'terminal64.exe' `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }

          if ($null -eq $Terminal) {
            $Terminal = Get-ChildItem `
              -Path 'C:\Program Files' `
              -Recurse `
              -File `
              -Filter 'terminal64.exe' `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }

          if ($null -eq $Terminal) {
            $Terminal = Get-ChildItem `
              -Path 'C:\Program Files (x86)' `
              -Recurse `
              -File `
              -Filter 'terminal64.exe' `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }

          if ($null -eq $Terminal) {
            throw 'MetaTrader 5 terminal64.exe was not found after installation.'
          }

          $TerminalRoot = $Terminal.Directory.FullName

          $Editor = Get-ChildItem `
            -Path $TerminalRoot `
            -Recurse `
            -File `
            -Filter 'metaeditor64.exe' `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $Editor) {
            $Editor = Get-ChildItem `
              -Path 'C:\Program Files' `
              -Recurse `
              -File `
              -Filter 'metaeditor64.exe' `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }

          if ($null -eq $Editor) {
            $Editor = Get-ChildItem `
              -Path 'C:\Program Files (x86)' `
              -Recurse `
              -File `
              -Filter 'metaeditor64.exe' `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }

          if ($null -eq $Editor) {
            throw 'MetaEditor metaeditor64.exe was not found after installation.'
          }

          "TERMINAL=$($Terminal.FullName)" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append `
            -Encoding UTF8

          "EDITOR=$($Editor.FullName)" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append `
            -Encoding UTF8

          "MT5ROOT=$TerminalRoot" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append `
            -Encoding UTF8

          Set-Content `
            -Path (Join-Path $env:EVIDENCE 'mt5-location.txt') `
            -Value @(
              "Terminal=$($Terminal.FullName)"
              "MetaEditor=$($Editor.FullName)"
              "MT5Root=$TerminalRoot"
            ) `
            -Encoding UTF8

      - name: Prepare King’s Bot source tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $Target = Join-Path `
            $env:MT5ROOT `
            'MQL5\Experts\KingsBot'

          New-Item `
            -ItemType Directory `
            -Path $Target `
            -Force | Out-Null

          $Mq5Files = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -File `
            -Filter '*.mq5' `
            -ErrorAction SilentlyContinue

          $MqhFiles = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -File `
            -Filter '*.mqh' `
            -ErrorAction SilentlyContinue

          if ($Mq5Files.Count -eq 0) {
            throw 'No MQ5 source files were found in the repository root.'
          }

          foreach ($File in @($Mq5Files) + @($MqhFiles)) {
            Copy-Item `
              -LiteralPath $File.FullName `
              -Destination $Target `
              -Force
          }

          $Compile = Join-Path `
            $Target `
            $env:BOT_SOURCE

          if (-not (Test-Path -LiteralPath $Compile -PathType Leaf)) {
            throw "Prepared MQ5 file was not found: $Compile"
          }

          $SourceInventory = Get-ChildItem `
            -Path $Target `
            -File |
            Select-Object Name, Length, FullName

          $SourceInventory |
            Format-Table -AutoSize |
            Out-String |
            Set-Content `
              -Path (Join-Path $env:EVIDENCE 'prepared-source-inventory.txt') `
              -Encoding UTF8

          "COMPILE=$Compile" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append `
            -Encoding UTF8

      - name: Compile King’s Bot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $LogFile = Join-Path `
            $env:EVIDENCE `
            'metaeditor-compile.log'

          $Arguments = @(
            "/compile:$env:COMPILE",
            '/log'
          )

          $Process = Start-Process `
            -FilePath $env:EDITOR `
            -ArgumentList $Arguments `
            -Wait `
            -PassThru `
            -RedirectStandardOutput $LogFile `
            -RedirectStandardError (
              Join-Path $env:EVIDENCE 'metaeditor-compile-error.log'
            )

          Set-Content `
            -Path (Join-Path $env:EVIDENCE 'compile-exit-code.txt') `
            -Value $Process.ExitCode `
            -Encoding UTF8

          $EX5 = [System.IO.Path]::ChangeExtension(
            $env:COMPILE,
            '.ex5'
          )

          if (-not (Test-Path -LiteralPath $EX5 -PathType Leaf)) {
            throw "EX5 was not produced: $EX5"
          }

          Copy-Item `
            -LiteralPath $EX5 `
            -Destination $env:EVIDENCE `
            -Force

          Set-Content `
            -Path (Join-Path $env:EVIDENCE 'compiled-ex5-location.txt') `
            -Value $EX5 `
            -Encoding UTF8

      - name: Create Strategy Tester configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $Config = Join-Path `
            $env:MT5ROOT `
            'KingsBot_Phase7_Tester.ini'

          $Lines = @(
            '[Tester]'
            'Expert=KingsBot\KingsBot_Phase6_Integration.ex5'
            "Symbol=$env:TEST_SYMBOL"
            "Period=$env:TEST_PERIOD"
            'Model=1'
            'Optimization=0'
            'FromDate=2026.01.01'
            'ToDate=2026.08.01'
            'ForwardMode=0'
            'Deposit=10000'
            'Currency=USD'
            'Leverage=1:100'
            'Visual=0'
            'ReplaceReport=1'
            'Report=KingsBot_Phase7_Tester'
            'ShutdownTerminal=1'
          )

          Set-Content `
            -Path $Config `
            -Value $Lines `
            -Encoding ASCII

          Copy-Item `
            -LiteralPath $Config `
            -Destination $env:EVIDENCE `
            -Force

          "CONFIG=$Config" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append `
            -Encoding UTF8

      - name: Run Strategy Tester
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'

          $StdOut = Join-Path `
            $env:EVIDENCE `
            'mt5-tester-stdout.log'

          $StdErr = Join-Path `
            $env:EVIDENCE `
            'mt5-tester-stderr.log'

          $Process = Start-Process `
            -FilePath $env:TERMINAL `
            -ArgumentList @(
              "/config:$env:CONFIG"
            ) `
            -Wait `
            -PassThru `
            -RedirectStandardOutput $StdOut `
            -RedirectStandardError $StdErr

          Set-Content `
            -Path (Join-Path $env:EVIDENCE 'mt5-tester-exit-code.txt') `
            -Value $Process.ExitCode `
            -Encoding UTF8

      - name: Collect MT5 runtime evidence
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $Evidence = $env:EVIDENCE

          $SearchRoots = @(
            $env:MT5ROOT,
            $env:RUNNER_TEMP,
            'C:\Program Files\MetaTrader 5',
            'C:\Program Files (x86)\MetaTrader 5'
          ) |
          Where-Object {
            $_ -and (Test-Path -LiteralPath $_)
          } |
          Select-Object -Unique

          foreach ($Root in $SearchRoots) {

            Get-ChildItem `
              -Path $Root `
              -Recurse `
              -File `
              -Include '*.log','*.htm','*.html','*.xml' `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.LastWriteTime -gt (Get-Date).AddMinutes(-20)
              } |
              ForEach-Object {

                $SafeName = (
                  $_.FullName `
                    -replace '[:\\\/]', '_' `
                    -replace '[^a-zA-Z0-9_.-]', '_'
                )

                try {
                  Copy-Item `
                    -LiteralPath $_.FullName `
                    -Destination (Join-Path $Evidence $SafeName) `
                    -Force `
                    -ErrorAction SilentlyContinue
                }
                catch {
                }
              }
          }

          $Reports = Get-ChildItem `
            -Path $SearchRoots `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -match 'KingsBot_Phase7_Tester' -or
              $_.Name -match 'report'
            } |
            Sort-Object LastWriteTime -Descending

          if ($Reports) {
            $Reports |
              Select-Object FullName, Length, LastWriteTime |
              Format-Table -AutoSize |
              Out-String |
              Set-Content `
                -Path (Join-Path $Evidence 'tester-report-discovery.txt') `
                -Encoding UTF8
          }
          else {
            Set-Content `
              -Path (Join-Path $Evidence 'tester-report-discovery.txt') `
              -Value 'No tester report file discovered.' `
              -Encoding UTF8
          }

      - name: Locate Strategy Tester report
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $Report = Get-ChildItem `
            -Path @(
              $env:MT5ROOT,
              $env:RUNNER_TEMP,
              'C:\Program Files\MetaTrader 5',
              'C:\Program Files (x86)\MetaTrader 5'
            ) `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -match 'KingsBot_Phase7_Tester'
            } |
            Sort-Object LastWriteTime -Descending |
           
