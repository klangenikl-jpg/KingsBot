name: King's Bot - Phase 7 Runtime Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase7:
    name: Phase 7 Runtime and Strategy Tester Validation
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create evidence directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Evidence = Join-Path $env:GITHUB_WORKSPACE 'phase7-artifacts'
          New-Item -ItemType Directory -Path $Evidence -Force | Out-Null
          Set-Content -Path (Join-Path $Evidence 'phase7-started.txt') -Value 'Phase 7 started' -Encoding UTF8
          'EVIDENCE=' + $Evidence | Out-File $env:GITHUB_ENV -Append -Encoding UTF8

      - name: Find source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Source = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -File -Filter 'KingsBot_Phase6_Integration.mq5' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $Source) {
            throw 'KingsBot_Phase6_Integration.mq5 not found.'
          }
          'SOURCE=' + $Source.FullName | Out-File $env:GITHUB_ENV -Append -Encoding UTF8
          Copy-Item -LiteralPath $Source.FullName -Destination $env:EVIDENCE -Force

      - name: Download MT5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          Invoke-WebRequest -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' -OutFile $Installer -UseBasicParsing
          if (-not (Test-Path -LiteralPath $Installer)) {
            throw 'MT5 download failed.'
          }
          $Hash = Get-FileHash -Path $Installer -Algorithm SHA256
          Set-Content -Path (Join-Path $env:EVIDENCE 'mt5-download.txt') -Value ('SHA256=' + $Hash.Hash) -Encoding UTF8
          'INSTALLER=' + $Installer | Out-File $env:GITHUB_ENV -Append -Encoding UTF8

      - name: Install MT5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $Root = Join-Path $env:RUNNER_TEMP 'KingsBot-MT5'

          Remove-Item -LiteralPath $Root -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $Root -Force | Out-Null

          $P = Start-Process `
            -FilePath $env:INSTALLER `
            -ArgumentList '/auto',('/path=' + $Root) `
            -Wait `
            -PassThru

          Set-Content `
            -Path (Join-Path $env:EVIDENCE 'installer-exit-code.txt') `
            -Value $P.ExitCode `
            -Encoding UTF8

          Start-Sleep -Seconds 5

          $T = Get-ChildItem -Path $env:RUNNER_TEMP -Recurse -File -Filter 'terminal64.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          $E = Get-ChildItem -Path $env:RUNNER_TEMP -Recurse -File -Filter 'metaeditor64.exe' -ErrorAction SilentlyContinue | Select-Object -First 1

          if ($null -eq $T) {
            $T = Get-ChildItem -Path 'C:\Program Files' -Recurse -File -Filter 'terminal64.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          }

          if ($null -eq $E) {
            $E = Get-ChildItem -Path 'C:\Program Files' -Recurse -File -Filter 'metaeditor64.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          }

          if ($null -eq $T) {
            throw 'terminal64.exe not found.'
          }

          if ($null -eq $E) {
            throw 'metaeditor64.exe not found.'
          }

          'TERMINAL=' + $T.FullName | Out-File $env:GITHUB_ENV -Append -Encoding UTF8
          'EDITOR=' + $E.FullName | Out-File $env:GITHUB_ENV -Append -Encoding UTF8
          'MT5ROOT=' + $T.Directory.FullName | Out-File $env:GITHUB_ENV -Append -Encoding UTF8

          Set-Content `
            -Path (Join-Path $env:EVIDENCE 'mt5-location.txt') `
            -Value ('Terminal=' + $T.FullName + [Environment]::NewLine + 'MetaEditor=' + $E.FullName) `
            -Encoding UTF8

      - name: Prepare source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $Target = Join-Path -Path $env:MT5ROOT -ChildPath 'MQL5\Experts\KingsBot'
          New-Item -ItemType Directory -Path $Target -Force | Out-Null

          $SourceDirectory = Split-Path -Path $env:SOURCE -Parent

          if (-not (Test-Path -LiteralPath $SourceDirectory)) {
            throw 'King''s Bot source directory was not found.'
          }

          Get-ChildItem -LiteralPath $SourceDirectory -Force |
            Copy-Item -Destination $Target -Recurse -Force

          $Compile = Join-Path -Path $Target -ChildPath 'KingsBot_Phase6_Integration.mq5'

          if (-not (Test-Path -LiteralPath $Compile)) {
            throw 'Prepared MQ5 file not found.'
          }

          'COMPILE=' + $
