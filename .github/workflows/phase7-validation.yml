name: King's Bot - Phase 7 Runtime Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase7:
    name: Phase 7 Runtime and Strategy Tester
    runs-on: windows-2025
    timeout-minutes: 35

    env:
      MT5_DIR: C:\MT5
      BOT_SOURCE_NAME: KingsBot_Phase6_Integration.mq5
      EX5_NAME: KingsBot_Phase6_Integration.ex5

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Initialize evidence
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $evidence = Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence'

          Remove-Item $evidence -Recurse -Force -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          New-Item -ItemType Directory -Path "$evidence\Tester-Logs" -Force | Out-Null
          New-Item -ItemType Directory -Path "$evidence\MT5-Logs" -Force | Out-Null

      - name: Locate source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter $env:BOT_SOURCE_NAME `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $source) {
            throw "Source not found: $env:BOT_SOURCE_NAME"
          }

          Write-Host "SOURCE: $($source.FullName)"

          "BOT_SOURCE=$($source.FullName)" |
            Out-File $env:GITHUB_ENV -Encoding utf8

      - name: Download MT5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = "$env:RUNNER_TEMP\mt5setup.exe"

          Invoke-WebRequest `
            -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' `
            -OutFile $installer `
            -UseBasicParsing

          if (-not (Test-Path $installer)) {
            throw 'MT5 installer download failed.'
          }

          "MT5_INSTALLER=$installer" |
            Out-File $env:GITHUB_ENV -Encoding utf8

      - name: Install MT5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Remove-Item $env:MT5_DIR -Recurse -Force -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Path $env:MT5_DIR `
            -Force |
            Out-Null

          $p = Start-Process `
            -FilePath $env:MT5_INSTALLER `
            -ArgumentList @(
              '/auto'
              "/path:$env:MT5_DIR"
            ) `
            -Wait `
            -PassThru

          Write-Host "MT5 installer exit code: $($p.ExitCode)"

          Start-Sleep -Seconds 5

          $terminal = Get-ChildItem `
            -Path $env:MT5_DIR `
            -Filter 'terminal64.exe' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $terminal) {
            throw 'terminal64.exe was not found.'
          }

          $editor = Get-ChildItem `
            -Path $env:MT5_DIR `
            -Filter 'metaeditor64.exe' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $editor) {
            throw 'metaeditor64.exe was not found.'
          }

          Write-Host "TERMINAL: $($terminal.FullName)"
          Write-Host "METAEDITOR: $($editor.FullName)"

          "MT5_TERMINAL=$($terminal.FullName)" |
            Out-File $env:GITHUB_ENV -Encoding utf8

          "METAEDITOR=$($editor.FullName)" |
            Out-File $env:GITHUB_ENV -Encoding utf8

      - name: Prepare EA
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $expertDir = "$env:MT5_DIR\MQL5\Experts\KingsBot"

          New-Item `
            -ItemType Directory `
            -Path $expertDir `
            -Force |
            Out-Null

          $sourceRoot = Split-Path $env:BOT_SOURCE -Parent

          Copy-Item `
            -Path "$sourceRoot\*" `
            -Destination $expertDir `
            -Recurse `
            -Force

          $expertSource = "$expertDir\$env:BOT_SOURCE_NAME"

          if (-not (Test-Path $expertSource)) {
            throw "EA source missing: $expertSource"
          }

          "EXPERT_SOURCE=$expertSource" |
            Out-File $env:GITHUB_ENV -Encoding utf8

          Write-Host "EXPERT: $expertSource"

      - name: Compile EA
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'

          $log = "$env:RUNNER_TEMP\KingsBot-compile.log"

          $p = Start-Process `
            -FilePath $env:METAEDITOR `
            -ArgumentList @(
              '/portable'
              "/compile:$env:EXPERT_SOURCE"
              "/log:$log"
            ) `
            -WorkingDirectory $env:MT5_DIR `
            -Wait `
            -PassThru `
            -NoNewWindow

          Write-Host "MetaEditor exit code: $($p.ExitCode)"

          if (Test-Path $log) {
            Copy-Item `
              $log `
              "$env:GITHUB_WORKSPACE\phase7-evidence\compile.log" `
              -Force

            Get-Content $log
          }

          Start-Sleep -Seconds 5

          $ex5 = Get-ChildItem `
            -Path $env:MT5_DIR `
            -Filter $env:EX5_NAME `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if ($null -eq $ex5) {
            throw "EX5 was not produced: $env:EX5_NAME"
          }

          Write-Host "EX5: $($ex5.FullName)"
          Write-Host "EX5 SIZE: $($ex5.Length)"

      - name: Create tester configuration
        shell: powershell
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:MT5_LOGIN)) {
            throw 'MT5_LOGIN secret is empty.'
          }

          $config = "$env:MT5_DIR\KingsBot_Phase7_Tester.ini"

          $lines = @(
            '[Tester]'
            'Expert=KingsBot\KingsBot_Phase6_Integration.ex5'
            'Symbol=EURUSD'
            'Period=M15'
            'Model=0'
            'Optimization=0'
            'FromDate=2025.01.01'
            'ToDate=2026.08.01'
            'ForwardMode=0'
            "Login=$env:MT5_LOGIN"
            'Deposit=10000'
            'Currency=USD'
            'Leverage=1:100'
            'UseLocal=1'
            'UseRemote=0'
            'UseCloud=0'
            'Visual=0'
            'ReplaceReport=1'
            'Report=KingsBot_Phase7_Tester'
            'ShutdownTerminal=1'
          )

          # MT5 configuration files are written as UTF-16LE.
          [System.IO.File]::WriteAllLines(
            $config,
            $lines,
            [System.Text.UnicodeEncoding]::new($false,$false,$true)
          )

          Write-Host '========== TESTER CONFIG =========='
          Get-Content $config
          Write-Host '==================================='

          "TESTER_CONFIG=$config" |
            Out-File $env:GITHUB_ENV -Encoding utf8

          Copy-Item `
            $config `
            "$env:GITHUB_WORKSPACE\phase7-evidence\Tester-Config.ini" `
            -Force

      - name: Start Strategy Tester
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host '========== STARTING MT5 TESTER =========='

          # Remove stale terminal/tester processes.
          Get-Process terminal64,metatester64,metatester `
            -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 3

          $reportRoot = "$env:MT5_DIR\KingsBot_Phase7_Tester.htm"

          Remove-Item `
            $reportRoot `
            -Force `
            -ErrorAction SilentlyContinue

          $p = Start-Process `
            -FilePath $env:MT5_TERMINAL `
            -ArgumentList @(
              '/portable'
              "/config:$env:TESTER_CONFIG"
            ) `
            -WorkingDirectory $env:MT5_DIR `
            -PassThru

          if ($null -eq $p) {
            throw 'MT5 did not return a process object.'
          }

          Write-Host "MT5 PID: $($p.Id)"

          if ($p.Id -le 0) {
            throw 'Invalid MT5 PID.'
          }

          # Give MT5 time to initialize the tester.
          Start-Sleep -Seconds 15

          Write-Host '========== PROCESS CHECK =========='

          Get-Process `
            -Name terminal64,metatester64,metatester `
            -ErrorAction SilentlyContinue |
            Select-Object Id,ProcessName,Path,StartTime |
            Format-List

          $elapsed = 0
          $found = $false

          while ($elapsed -lt 1200) {

            Start-Sleep -Seconds 10
            $elapsed += 10

            $report = Get-ChildItem `
              -Path $env:MT5_DIR `
              -Filter 'KingsBot_Phase7_Tester*.htm' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1

            if ($null -ne $report -and $report.Length -gt 500) {

              Write-Host "REPORT FOUND: $($report.FullName)"
              Write-Host "REPORT SIZE: $($report.Length)"

              Copy-Item `
                $report.FullName `
                "$env:GITHUB_WORKSPACE\phase7-evidence\KingsBot_Phase7_Tester.htm" `
                -Force

              $found = $true
              break
            }

            if ($elapsed % 60 -eq 0) {

              Write-Host "Tester running: $elapsed seconds"

              $agents = Get-Process `
                -Name metatester64,metatester `
                -ErrorAction SilentlyContinue

              if ($null -eq $agents) {
                Write-Host 'WARNING: No MetaTester agent currently visible.'
              }
              else {
                Write-Host 'MetaTester agent detected.'
              }
            }
          }

          if (-not $found) {

            Write-Host '========== FINAL MT5 PROCESSES =========='

            Get-Process `
              -Name terminal64,metatester64,metatester `
              -ErrorAction SilentlyContinue |
              Select-Object Id,ProcessName,Path,StartTime |
              Format-List

            Write-Host '========== REPORT FILES =========='

            Get-ChildItem `
              -Path $env:MT5_DIR `
              -Filter '*.htm' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 50 |
              ForEach-Object {
                Write-Host "$($_.FullName) | $($_.Length) bytes"
              }

            Write-Host '========== TESTER DIRECTORY =========='

            if (Test-Path "$env:MT5_DIR\Tester") {
              Get-ChildItem `
                "$env:MT5_DIR\Tester" `
                -File `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object FullName,Length,LastWriteTime |
                Sort-Object LastWriteTime -Descending |
                Select-Object -First 100 |
                Format-Table -AutoSize
            }

            throw 'Strategy Tester report was not produced.'
          }

          Write-Host '========== PHASE 7 TESTER PASSED =========='

      - name: Upload Phase 7 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kingsbot-phase7-evidence
          path: phase7-evidence
          if-no-files-found: warn
          retention-days: 14
