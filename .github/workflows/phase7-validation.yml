name: King's Bot - Phase 7 Runtime Validation

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  MT5_DIR: C:\MT5
  BOT_SOURCE_NAME: KingsBot_Phase6_Integration.mq5
  TEST_SYMBOL: EURUSD
  TEST_PERIOD: M15
  TEST_FROM: 2024.01.02
  TEST_TO: 2024.08.20

jobs:
  phase7:
    name: Phase 7 Runtime and Strategy Tester
    runs-on: windows-2025
    timeout-minutes: 35

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Locate King's Bot source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter $env:BOT_SOURCE_NAME `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $source) {
            throw "Could not find $env:BOT_SOURCE_NAME"
          }

          Write-Host "Source found:"
          Write-Host $source.FullName

          "BOT_SOURCE=$($source.FullName)" |
            Out-File $env:GITHUB_ENV -Encoding utf8

      - name: Prepare evidence directory
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $evidence = Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence'

          Remove-Item `
            -LiteralPath $evidence `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Path $evidence `
            -Force |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Path (Join-Path $evidence 'MT5-Logs') `
            -Force |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Path (Join-Path $evidence 'Tester-Logs') `
            -Force |
            Out-Null

          @(
            "King's Bot Phase 7 Evidence"
            "Workflow: $env:GITHUB_WORKFLOW"
            "Run: $env:GITHUB_RUN_NUMBER"
            "Repository: $env:GITHUB_REPOSITORY"
            "Started: $(Get-Date -Format o)"
          ) |
            Set-Content `
              -LiteralPath (Join-Path $evidence 'PHASE7-EVIDENCE-STARTED.txt') `
              -Encoding UTF8

          Write-Host "Evidence directory:"
          Write-Host $evidence

          "EVIDENCE_DIR=$evidence" |
            Out-File $env:GITHUB_ENV -Encoding utf8

      - name: Download MetaTrader 5 installer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'

          $url = 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe'

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer `
            -UseBasicParsing `
            -TimeoutSec 180

          if (-not (Test-Path -LiteralPath $installer)) {
            throw 'MT5 installer was not downloaded.'
          }

          $item = Get-Item -LiteralPath $installer

          if ($item.Length -lt 1000000) {
            throw "MT5 installer is unexpectedly small: $($item.Length) bytes"
          }

          Write-Host "Installer size: $($item.Length) bytes"

          "MT5_INSTALLER=$installer" |
            Out-File $env:GITHUB_ENV -Encoding utf8

      - name: Install MetaTrader 5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'

          Remove-Item `
            -Path $env:MT5_DIR `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Path $env:MT5_DIR `
            -Force |
            Out-Null

          $process = Start-Process `
            -FilePath $env:MT5_INSTALLER `
            -ArgumentList @(
              '/auto'
              "/path:$env:MT5_DIR"
            ) `
            -Wait `
            -PassThru `
            -NoNewWindow

          $installerExit = $process.ExitCode

          Write-Host "MT5 installer exit code: $installerExit"

          Set-Content `
            -LiteralPath (Join-Path $env:EVIDENCE_DIR 'installer-exit-code.txt') `
            -Value $installerExit `
            -Encoding UTF8

          Start-Sleep -Seconds 5

          $terminal = Get-ChildItem `
            -Path $env:MT5_DIR `
            -Filter 'terminal64.exe' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          $editor = Get-ChildItem `
            -Path $env:MT5_DIR `
            -Filter 'metaeditor64.exe' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $terminal) {
            throw 'terminal64.exe was not found after MT5 installation.'
          }

          if ($null -eq $editor) {
            throw 'metaeditor64.exe was not found after MT5 installation.'
          }

          @(
            'MT5 INSTALLATION VERIFIED'
            "Installer exit code: $installerExit"
            "Terminal: $($terminal.FullName)"
            "MetaEditor: $($editor.FullName)"
          ) |
            Set-Content `
              -LiteralPath (Join-Path $env:EVIDENCE_DIR 'installation-result.txt') `
              -Encoding UTF8

          "MT5_TERMINAL=$($terminal.FullName)" |
            Out-File $env:GITHUB_ENV -Encoding utf8

          "MT5_EDITOR=$($editor.FullName)" |
            Out-File $env:GITHUB_ENV -Encoding utf8

      - name: Prepare King's Bot
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $expertDir = Join-Path `
            $env:MT5_DIR `
            'MQL5\Experts\KingsBot'

          $reportDir = Join-Path `
            $env:MT5_DIR `
            'Reports'

          $sourceRoot = Split-Path `
            $env:BOT_SOURCE `
            -Parent

          New-Item `
            -ItemType Directory `
            -Path $expertDir `
            -Force |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Path $reportDir `
            -Force |
            Out-Null

          Copy-Item `
            -Path (Join-Path $sourceRoot '*') `
            -Destination $expertDir `
            -Recurse `
            -Force

          $expertSource = Join-Path `
            $expertDir `
            $env:BOT_SOURCE_NAME

          if (-not (Test-Path -LiteralPath $expertSource)) {
            throw "Source copy failed: $expertSource"
          }

          Write-Host "Expert directory: $expertDir"
          Write-Host "Expert source: $expertSource"

          "EXPERT_DIR=$expertDir" |
            Out-File $env:GITHUB_ENV -Encoding utf8

          "EXPERT_SOURCE=$expertSource" |
            Out-File $env:GITHUB_ENV -Encoding utf8

          "REPORT_DIR=$reportDir" |
            Out-File $env:GITHUB_ENV -Encoding utf8

      - name: Compile King's Bot
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'

          # Reconstruct these paths locally.
          # Do not depend on EXpert_DIR / EXPERT_SOURCE being
          # inherited from an earlier workflow step.

          $expertDir = Join-Path `
            $env:MT5_DIR `
            'MQL5\Experts\KingsBot'

          $expertSource = Join-Path `
            $expertDir `
            $env:BOT_SOURCE_NAME

          $compileLog = Join-Path `
            $env:EVIDENCE_DIR `
            'metaeditor.log'

          Write-Host "MetaEditor: $env:MT5_EDITOR"
          Write-Host "Expert directory: $expertDir"
          Write-Host "Expert source: $expertSource"
          Write-Host "Compile log: $compileLog"

          if (-not (Test-Path -LiteralPath $env:MT5_EDITOR)) {
            throw "MetaEditor was not found: $env:MT5_EDITOR"
          }

          if (-not (Test-Path -LiteralPath $expertSource)) {
            throw "EA source was not found: $expertSource"
          }

          $process = Start-Process `
            -FilePath $env:MT5_EDITOR `
            -ArgumentList @(
              '/portable'
              "/compile:$expertSource"
              "/log:$compileLog"
            ) `
            -WorkingDirectory $env:MT5_DIR `
            -Wait `
            -PassThru `
            -NoNewWindow

          Write-Host "MetaEditor exit code: $($process.ExitCode)"

          Set-Content `
            -LiteralPath (Join-Path $env:EVIDENCE_DIR 'metaeditor-exit-code.txt') `
            -Value $process.ExitCode `
            -Encoding UTF8

          if (Test-Path -LiteralPath $compileLog) {
            Write-Host '========== METAEDITOR LOG =========='
            Get-Content -LiteralPath $compileLog -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host $_ }
            Write-Host '===================================='
          }
          else {
            Write-Host 'MetaEditor log was not created.'
          }

          $ex5Candidates = Get-ChildItem `
            -Path $expertDir `
            -Filter '*.ex5' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue

          Write-Host '========== EX5 DISCOVERY =========='

          if ($null -ne $ex5Candidates) {
            $ex5Candidates |
              Select-Object FullName,Length,LastWriteTime |
              Format-Table -AutoSize |
              Out-String |
              Write-Host
          }

          Write-Host '==================================='

          $ex5 = $ex5Candidates |
            Where-Object {
              $_.BaseName -eq 'KingsBot_Phase6_Integration'
            } |
            Select-Object -First 1

          if ($null -eq $ex5) {
            throw "EX5 was not produced. MetaEditor exit code: $($process.ExitCode)"
          }

          if ($ex5.Length -lt 1000) {
            throw "EX5 is unexpectedly small: $($ex5.Length) bytes"
          }

          Write-Host "EX5 produced: $($ex5.FullName)"
          Write-Host "EX5 size: $($ex5.Length) bytes"

          Copy-Item `
            -LiteralPath $ex5.FullName `
            -Destination (Join-Path $env:EVIDENCE_DIR 'KingsBot_Phase6_Integration.ex5') `
            -Force

      - name: Create MT5 connection configuration
        shell: powershell
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:MT5_LOGIN)) {
            throw 'MT5_LOGIN secret is missing.'
          }

          if ([string]::IsNullOrWhiteSpace($env:MT5_SERVER)) {
            throw 'MT5_SERVER secret is missing.'
          }

          if ([string]::IsNullOrWhiteSpace($env:MT5_PASSWORD)) {
            throw 'MT5_PASSWORD secret is missing.'
          }

          $config = Join-Path `
            $env:MT5_DIR `
            'KingsBot_Phase7_Connection.ini'

          @(
            '[Common]'
            "Login=$env:MT5_LOGIN"
            "Password=$env:MT5_PASSWORD"
            "Server=$env:MT5_SERVER"
            'KeepPrivate=0'
          ) |
            Set-Content `
              -LiteralPath $config `
              -Encoding ASCII

          @(
            '[Common]'
            "Login=$env:MT5_LOGIN"
            'Password=***'
            "Server=$env:MT5_SERVER"
            'KeepPrivate=0'
          ) |
            Set-Content `
              -LiteralPath (Join-Path $env:EVIDENCE_DIR 'Connection-Config.ini') `
              -Encoding UTF8

          "CONNECTION_CONFIG=$config" |
            Out-File $env:GITHUB_ENV -Encoding utf8

      - name: Start MT5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $process = Start-Process `
            -FilePath $env:MT5_TERMINAL `
            -ArgumentList @(
              '/portable'
              "/config:$env:CONNECTION_CONFIG"
            ) `
            -WorkingDirectory $env:MT5_DIR `
            -PassThru

          Write-Host "MT5 PID: $($process.Id)"

          @(
            "PID: $($process.Id)"
            "Started: $(Get-Date -Format o)"
          ) |
            Set-Content `
              -LiteralPath (Join-Path $env:EVIDENCE_DIR 'mt5-process.txt') `
              -Encoding UTF8

          Start-Sleep -Seconds 60

          if ($process.HasExited) {
            Write-Host "MT5 exited during initialization with code $($process.ExitCode)."
          }
          else {
            Write-Host 'MT5 is running.'
          }

      - name: Create Strategy Tester configuration
        shell: powershell
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          $config = Join-Path `
            $env:MT5_DIR `
            'KingsBot_Phase7_Tester.ini'

          @(
            '[Common]'
            "Login=$env:MT5_LOGIN"
            "Password=$env:MT5_PASSWORD"
            "Server=$env:MT5_SERVER"
            'KeepPrivate=0'
            ''
            '[Tester]'
            "Login=$env:MT5_LOGIN"
            "Password=$env:MT5_PASSWORD"
            "Server=$env:MT5_SERVER"
            'Expert=KingsBot\KingsBot_Phase6_Integration.ex5'
            "Symbol=$env:TEST_SYMBOL"
            "Period=$env:TEST_PERIOD"
            'Model=0'
            'Optimization=0'
            "FromDate=$env:TEST_FROM"
            "ToDate=$env:TEST_TO"
            'ForwardMode=0'
            'Deposit=10000'
            'Currency=USD'
            'Leverage=100'
            'ExecutionMode=0'
            'Visual
