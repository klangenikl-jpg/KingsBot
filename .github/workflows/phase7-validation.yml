name: KingsBot Phase 7 Runtime Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase7:
    name: Phase 7 MT5 Runtime Validation
    runs-on: windows-2022
    timeout-minutes: 45

    env:
      MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
      MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
      MT5_SERVER: ${{ secrets.MT5_SERVER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create evidence directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force `
            "$env:GITHUB_WORKSPACE\phase7-evidence" | Out-Null

      - name: Find KingsBot source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Get-ChildItem `
            "$env:GITHUB_WORKSPACE" `
            -Filter 'KingsBot_Phase6_Integration.mq5' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $source) {
            throw 'KingsBot_Phase6_Integration.mq5 was not found.'
          }

          "SOURCE=$($source.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "SOURCE=$($source.FullName)"

      - name: Download MT5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = "$env:RUNNER_TEMP\mt5setup.exe"

          Invoke-WebRequest `
            -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' `
            -OutFile $installer `
            -UseBasicParsing

          if (-not (Test-Path $installer)) {
            throw 'MT5 installer was not downloaded.'
          }

          "MT5_INSTALLER=$installer" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install MT5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $p = Start-Process `
            -FilePath $env:MT5_INSTALLER `
            -ArgumentList '/auto' `
            -Wait `
            -PassThru

          Write-Host "MT5 installer exit code: $($p.ExitCode)"

          Start-Sleep -Seconds 5

      - name: Locate MT5 terminal
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $terminal = Get-ChildItem `
            'C:\Program Files','C:\Program Files (x86)',`
            'C:\MT5',$env:LOCALAPPDATA,$env:APPDATA,$env:RUNNER_TEMP `
            -Filter 'terminal64.exe' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $terminal) {
            throw 'terminal64.exe was not found.'
          }

          $meta = Get-ChildItem `
            'C:\Program Files','C:\Program Files (x86)',`
            'C:\MT5',$env:LOCALAPPDATA,$env:APPDATA,$env:RUNNER_TEMP `
            -Filter 'metaeditor64.exe' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $meta) {
            throw 'metaeditor64.exe was not found.'
          }

          Write-Host "TERMINAL=$($terminal.FullName)"
          Write-Host "METAEDITOR=$($meta.FullName)"

          "MT5_TERMINAL=$($terminal.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "METAEDITOR=$($meta.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "MT5_ROOT=$($terminal.Directory.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Prepare KingsBot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $expertDir = "$env:MT5_ROOT\MQL5\Experts\KingsBot"

          New-Item -ItemType Directory -Force $expertDir | Out-Null

          Copy-Item `
            $env:SOURCE `
            "$expertDir
