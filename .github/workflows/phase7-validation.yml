name: King's Bot - Phase 7 Runtime Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase7:
    name: Phase 7 Runtime Validation
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $Evidence = Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence'
          New-Item -ItemType Directory -Path $Evidence -Force | Out-Null

          "EVIDENCE=$Evidence" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Locate source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $Source = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Recurse `
            -File `
            -Filter 'KingsBot_Phase6_Integration.mq5' `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $Source) {
            throw 'KingsBot_Phase6_Integration.mq5 was not found.'
          }

          "SOURCE=$($Source.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Copy-Item `
            -LiteralPath $Source.FullName `
            -Destination $env:EVIDENCE `
            -Force

      - name: Download MT5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $Installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'

          Invoke-WebRequest `
            -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' `
            -OutFile $Installer `
            -UseBasicParsing

          if (-not (Test-Path -LiteralPath $Installer)) {
            throw 'MT5 installer download failed.'
          }

          "INSTALLER=$Installer" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install MT5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $InstallRoot = Join-Path $env:RUNNER_TEMP 'KingsBot-MT5'

          New-Item `
            -ItemType Directory `
            -Path $InstallRoot `
            -Force | Out-Null

          $Process = Start-Process `
            -FilePath $env:INSTALLER `
            -ArgumentList @(
              '/auto',
              "/path=$InstallRoot"
            ) `
            -Wait `
            -PassThru

          Set-Content `
            -LiteralPath (Join-Path $env:EVIDENCE 'installer-exit-code.txt') `
            -Value ([string]$Process.ExitCode) `
            -Encoding utf8

          Start-Sleep -Seconds 10

          $Terminal = Get-ChildItem `
            -Path $InstallRoot,'C:\Program Files','C:\Program Files (x86)' `
            -Recurse `
            -File `
            -Filter 'terminal64.exe' `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $Terminal) {
            throw 'terminal64.exe was not found.'
          }

          $Editor = Get-ChildItem `
            -Path $Terminal.Directory.FullName `
            -Recurse `
            -File `
            -Filter 'metaeditor64.exe' `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $Editor) {
            $Editor = Get-ChildItem `
              -Path 'C:\Program Files','C:\Program Files (x86)' `
              -Recurse `
              -File `
              -Filter 'metaeditor64.exe' `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }

          if ($null -eq $Editor) {
            throw 'metaeditor64.exe was not found.'
          }

          "TERMINAL=$($Terminal.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          "EDITOR=$($Editor.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          "MT5ROOT=$($Terminal.Directory.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Prepare MT5 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $Target = Join-Path `
            $env:MT5ROOT `
            'MQL5\Experts\KingsBot'

          New-Item `
            -ItemType Directory `
            -Path $Target `
            -Force | Out-Null

          $SourceDirectory =
