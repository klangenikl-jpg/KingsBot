name: King's Bot - Phase 7 Runtime Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase7-runtime-validation:
    name: Phase 7 Runtime and Strategy Tester Validation
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout King's Bot
        uses: actions/checkout@v4

      - name: Prepare evidence directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $evidence = Join-Path $env:GITHUB_WORKSPACE 'phase7-validation-evidence'

          New-Item -ItemType Directory -Path $evidence -Force | Out-Null

          Write-Host "Evidence directory: $evidence"

      - name: Verify Windows environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host '===== WINDOWS ENVIRONMENT ====='

          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, BuildNumber, OSArchitecture |
            Format-List

          Write-Host '================================'

      - name: Verify MetaQuotes connectivity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $hostName = 'download.mql5.com'

          Write-Host "Resolving $hostName..."

          Resolve-DnsName $hostName -ErrorAction Stop |
            Select-Object -First 5 |
            Format-Table

          Write-Host 'Testing TCP 443...'

          $connection = Test-NetConnection `
            -ComputerName $hostName `
            -Port 443 `
            -WarningAction SilentlyContinue

          if (-not $connection.TcpTestSucceeded) {
            throw "HTTPS connectivity to $hostName failed."
          }

          Write-Host 'MetaQuotes HTTPS connectivity confirmed.'

      - name: Download MT5 installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'

          $uri = 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe'

          Remove-Item $installer -Force -ErrorAction SilentlyContinue

          Write-Host "Downloading:"
          Write-Host $uri

          Invoke-WebRequest `
            -Uri $uri `
            -OutFile $installer `
            -UseBasicParsing `
            -TimeoutSec 180

          if (-not (Test-Path $installer)) {
            throw 'MT5 installer was not downloaded.'
          }

          $info = Get-Item $installer

          Write-Host "Installer size: $($info.Length) bytes"

          if ($info.Length -lt 100000) {
            throw "Downloaded MT5 installer is invalid or incomplete. Size: $($info.Length) bytes"
          }

          $hash = Get-FileHash $installer -Algorithm SHA256

          $hash |
            Format-List |
            Out-File `
              "$env:GITHUB_WORKSPACE\phase7-validation-evidence\mt5-installer-sha256.txt"

          $signature = Get-AuthenticodeSignature $installer

          $signature |
            Format-List * |
            Out-File `
              "$env:GITHUB_WORKSPACE\phase7-validation-evidence\mt5-installer-signature.txt"

          Write-Host "Signature status: $($signature.Status)"

          "Installer=$installer" |
            Out-File $env:GITHUB_ENV -Append -
