name: King's Bot - Phase 7 Runtime Validation

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  MT5_DIR: C:\MT5
  BOT_SOURCE_NAME: KingsBot_Phase6_Integration.mq5
  EX5_NAME: KingsBot_Phase6_Integration.ex5

jobs:
  phase7:
    name: Phase 7 Runtime and Strategy Tester
    runs-on: windows-latest
    timeout-minutes: 30

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Initialize Phase 7 evidence
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $evidence = Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence'

          Remove-Item -LiteralPath $evidence -Recurse -Force -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          New-Item -ItemType Directory -Path "$evidence\MT5-Logs" -Force | Out-Null
          New-Item -ItemType Directory -Path "$evidence\Tester-Logs" -Force | Out-Null

          Write-Host "Evidence directory: $evidence"

      - name: Locate King's Bot source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter $env:BOT_SOURCE_NAME `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $source) {
            throw "Source file not found: $env:BOT_SOURCE_NAME"
          }

          Write-Host "SOURCE: $($source.FullName)"

          "BOT_SOURCE=$($source.FullName)" |
            Out-File $env:GITHUB_ENV -Encoding utf8

      - name: Download MetaTrader 5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'

          Invoke-WebRequest `
            -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' `
            -OutFile $installer `
            -UseBasicParsing `
            -TimeoutSec 180

          if (-not (Test-Path -LiteralPath $installer)) {
            throw 'MT5 installer was not downloaded.'
          }

          $size = (Get-Item -LiteralPath $installer).Length

          Write-Host "Installer size: $size bytes"

          if ($size -lt 100000) {
            throw "MT5 installer appears invalid or incomplete."
          }

          "MT5_INSTALLER=$installer" |
            Out-File $env:GITHUB_ENV -Encoding utf8

      - name: Install and verify MetaTrader 5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Remove-Item `
            -LiteralPath $env:MT5_DIR `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Path $env:MT5_DIR `
            -Force |
            Out-Null

          $process = Start-Process `
            -FilePath $env:MT5_INSTALLER `
            -ArgumentList @(
              '/auto'
              "/path:$env:MT5_DIR"
            ) `
            -Wait `
            -PassThru

          Write-Host "MT5 installer exit code: $($process.ExitCode)"

          Start-Sleep -Seconds 10

          $terminal = Get-ChildItem `
            -Path $env:MT5_DIR `
            -Filter 'terminal64.exe' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          $editor = Get-ChildItem `
            -Path $env:MT5_DIR `
            -Filter 'metaeditor64.exe' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $terminal) {
            throw "terminal64.exe was not found. Installer exit code: $($process.ExitCode)"
          }

          if ($null -eq $editor) {
            throw "metaeditor64.exe was not found. Installer exit code: $($process.ExitCode)"
          }

          Write-Host "TERMINAL: $($terminal.FullName)"
          Write-Host "METAEDITOR: $($editor.FullName)"

          "MT5_TERMINAL=$($terminal.FullName)" |
            Out-File $env:GITHUB_ENV -Encoding utf8

          "METAEDITOR=$($editor.FullName)" |
            Out-File $env:GITHUB_ENV -Encoding utf8

      - name: Prepare King's Bot
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $expertDir = Join-Path `
            $env:MT5_DIR `
            'MQL5\Experts\KingsBot'

          New-Item `
            -ItemType Directory `
            -Path $expertDir `
            -Force |
            Out-Null

          $sourceRoot = Split-Path `
            -Path $env:BOT_SOURCE `
            -Parent

          Copy-Item `
            -Path (Join-Path $sourceRoot '*') `
            -Destination $expertDir `
            -Recurse `
            -Force

          $expertSource = Join-Path `
            $expertDir `
            $env:BOT_SOURCE_NAME

