name: KingsBot Phase 7 Runtime Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase7:
    name: Phase 7 MT5 Runtime Validation
    runs-on: windows-2022
    timeout-minutes: 45

    env:
      MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
      MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
      MT5_SERVER: ${{ secrets.MT5_SERVER }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Phase 7 evidence directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $evidence = Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence'

          New-Item `
            -ItemType Directory `
            -Path $evidence `
            -Force |
            Out-Null

      - name: Locate KingsBot source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Get-ChildItem `
            -LiteralPath $env:GITHUB_WORKSPACE `
            -Filter 'KingsBot_Phase6_Integration.mq5' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $source) {
            throw 'KingsBot_Phase6_Integration.mq5 was not found in the repository.'
          }

          Write-Host "KingsBot source:"
          Write-Host $source.FullName

          "SOURCE=$($source.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Copy-Item `
            -LiteralPath $source.FullName `
            -Destination "$env:GITHUB_WORKSPACE\phase7-evidence\source-path.txt" `
            -Force

      - name: Download MetaTrader 5 installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path `
            $env:RUNNER_TEMP `
            'mt5setup.exe'

          Invoke-WebRequest `
            -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' `
            -OutFile $installer `
            -UseBasicParsing

          if (-not (Test-Path -LiteralPath $installer)) {
            throw 'MT5 installer was not downloaded.'
          }

          $size = (Get-Item -LiteralPath $installer).Length

          Write-Host "Installer size: $size bytes"

          if ($size -lt 1000000) {
            throw 'MT5 installer download appears invalid.'
          }

          "Installer size: $size bytes" |
            Set-Content `
              "$env:GITHUB_WORKSPACE\phase7-evidence\installer.txt"

          "MT5_INSTALLER=$installer" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $process = Start-Process `
            -FilePath $env:MT5_INSTALLER `
            -ArgumentList '/auto' `
            -Wait `
            -PassThru

          $exitCode = $process.ExitCode

          Write-Host "MT5 installer exit code: $exitCode"

          "Installer exit code: $exitCode" |
            Set-Content `
              "$env:GITHUB_WORKSPACE\phase7-evidence\installer-exit.txt"

          Start-Sleep -Seconds 5

      - name: Locate MetaEditor and MT5 terminal
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $roots = @(
            'C:\Program Files',
            'C:\Program Files (x86)',
            'C:\MT5',
            $env:LOCALAPPDATA,
            $env:APPDATA,
            $env:RUNNER_TEMP
          )

          $metaEditor = $null
          $terminal = $null

          foreach ($root in $roots) {
            if (-not (Test-Path -LiteralPath $root)) {
              continue
            }

            if ($null -eq $metaEditor) {
              $metaEditor = Get-ChildItem `
                -LiteralPath $root `
                -Filter 'metaeditor64.exe' `
                -File `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1
            }

            if ($null -eq $terminal) {
              $terminal = Get-ChildItem `
                -LiteralPath $root `
                -Filter 'terminal64.exe' `
                -File `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1
            }

            if (($null -ne $metaEditor) -and ($null -ne $terminal)) {
              break
            }
          }

          if ($null -eq $metaEditor) {
            throw 'metaeditor64.exe was not found.'
          }

          if ($null -eq $terminal) {
            throw 'terminal64.exe was not found.'
          }

          $mt5Root = $terminal.Directory.FullName

          Write-Host "MetaEditor: $($metaEditor.FullName)"
          Write-Host "Terminal: $($terminal.FullName)"
          Write-Host "MT5 root: $mt5Root"

          "METAEDITOR=$($metaEditor.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "MT5_TERMINAL=$($terminal.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "MT5_ROOT=$mt5Root" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Prepare complete MQL5 source tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $expertDir = Join-Path `
            $env:MT5_ROOT `
            'MQL5\Experts\KingsBot'

          New-Item `
            -ItemType Directory `
            -Path $expertDir `
            -Force |
            Out-Null

          $repo = $env:GITHUB_WORKSPACE

          Write-Host "Preparing MQL5 files from:"
          Write-Host $repo

          $mq5Files = Get-ChildItem `
            -LiteralPath $repo `
            -Filter '*.mq5' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue

          $mqhFiles = Get-ChildItem `
            -LiteralPath $repo `
            -Filter '*.mqh' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue

          if ($mq5Files.Count -eq 0) {
            throw 'No MQ5 files were found in the repository.'
          }

          if ($mqhFiles.Count -eq 0) {
            throw 'No MQH include files were found in the repository.'
          }

          foreach ($file in $mq5Files) {
            Copy-Item `
              -LiteralPath $file.FullName `
              -Destination $expertDir `
              -Force
          }

          foreach ($file in $mqhFiles) {
            Copy-Item `
              -LiteralPath $file.FullName `
              -Destination $expertDir `
              -Force
          }

          $preparedSource = Join-Path `
            $expertDir `
            'KingsBot_Phase6_Integration.mq5'

          if (-not (Test-Path -LiteralPath $preparedSource)) {
            throw 'Prepared KingsBot_Phase6_Integration.mq5 is missing.'
          }

          Write-Host "Prepared source:"
          Write-Host $preparedSource

          "EXPERT_DIR=$expertDir" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "EXPERT=$preparedSource" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Get-ChildItem `
            -LiteralPath $expertDir `
            -File |
            Select-Object Name, Length |
            Format-Table -AutoSize |
            Out-String |
            Set-Content `
              "$env:GITHUB_WORKSPACE\phase7-evidence\prepared-files.txt"

      - name: Compile KingsBot with MetaEditor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $evidence = "$env:GITHUB_WORKSPACE\phase7-evidence"
          $compileLog = "$evidence\metaeditor-output.txt"

          Set-Content `
            -LiteralPath $compileLog `
            -Value 'KingsBot Phase 7 MetaEditor diagnostic'

          Add-Content $compileLog ''
          Add-Content $compileLog "MetaEditor: $env:METAEDITOR"
          Add-Content $compileLog "Source: $env:EXPERT"
          Add-Content $compileLog "Expert directory: $env:EXPERT_DIR"

          Write-Host "Compiling:"
          Write-Host $env:EXPERT

          $arguments = '/compile:"' + $env:EXPERT + '" /log'

          $process = Start-Process `
            -FilePath $env:METAEDITOR `
            -ArgumentList $arguments `
            -WorkingDirectory $env:EXPERT_DIR `
            -Wait `
            -PassThru

          $compileExitCode = $process.ExitCode

          Write-Host "MetaEditor exit code: $compileExitCode"

          Add-Content `
            $compileLog `
            "MetaEditor exit code: $compileExitCode"

          Start-Sleep -Seconds 5

          Add-Content `
            $compileLog `
            ''
          Add-Content `
            $compileLog `
            '=== EX5 SEARCH ==='

          $searchRoots = @(
            $env:MT5_ROOT,
            $env:RUNNER_TEMP,
            $env:GITHUB_WORKSPACE,
            $env:LOCALAPPDATA,
            $env:APPDATA
          )

          $matches = @()

          foreach ($root in $searchRoots) {
            if (-not (Test-Path -LiteralPath $root)) {
              continue
            }

            $found = Get-ChildItem `
              -LiteralPath $root `
              -Filter 'KingsBot_Phase6_Integration.ex5' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue

            if ($null -ne $found) {
              $matches += $found
            }
          }

          $matches = @(
            $matches |
            Sort-Object LastWriteTime -Descending |
            Select-Object -Unique FullName
          )

          if ($matches.Count -gt 0) {
            $ex5 = $matches[0].FullName

            Write-Host "KingsBot EX5 found:"
            Write-Host $ex5

            Add-Content `
              $compileLog `
              "EX5 FOUND: $ex5"

            Copy-Item `
              -LiteralPath $ex5 `
              -Destination "$evidence\KingsBot_Phase6_Integration.ex5" `
              -Force

            Set-Content `
              "$evidence\ex5-location.txt" `
              $ex5
          }
          else {
            Write-Host 'No KingsBot EX5 was found.'

            Add-Content `
              $compileLog `
              'NO EX5 FOUND.'

            Add-Content `
              $compileLog `
              ''
            Add-Content `
              $compileLog `
              '=== RECENT LOG FILES ==='

            foreach ($root in $searchRoots) {
              if (-not (Test-Path -LiteralPath $root)) {
                continue
              }

              Get-ChildItem `
                -LiteralPath $root `
                -Filter '*.log' `
                -File `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Sort-Object LastWriteTime -Descending |
                Select-Object -First 20 |
                ForEach-Object {
                  Add-Content `
                    $compileLog `
                    ''
                  Add-Content `
                    $compileLog `
                    ('===== ' + $_.FullName + ' =====')

                  Get-Content `
                    -LiteralPath $_.FullName `
                    -ErrorAction SilentlyContinue |
                    Add-Content $compileLog
                }
            }

            throw 'MetaEditor completed without producing KingsBot_Phase6_Integration.ex5.'
          }

      - name: Verify MT5 credentials
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:MT5_LOGIN)) {
            throw 'MT5_LOGIN secret is missing.'
          }

          if ([string]::IsNullOrWhiteSpace($env:MT5_PASSWORD)) {
            throw 'MT5_PASSWORD secret is missing.'
          }

          if ([string]::IsNullOrWhiteSpace($env:MT5_SERVER)) {
            throw 'MT5_SERVER secret is missing.'
          }

          Write-Host 'MT5 credentials are present.'

      - name: Create Strategy Tester configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $config = Join-Path `
            $env:MT5_ROOT `
            'KingsBot_Phase7_Tester.ini'

          $lines = @(
            '[Common]',
            ('Login=' + $env:MT5_LOGIN),
            ('Password=' + $env:MT5_PASSWORD),
            ('Server=' + $env:MT5_SERVER),
            'KeepPrivate=1',
            'NewsEnable=0',
            '',
            '[Tester]',
            'Expert=KingsBot\KingsBot_Phase6_Integration.ex5',
            'Symbol=EURUSD',
            'Period=M15',
            'Model=4',
            'Optimization=0',
            'FromDate=2025.01.01',
            'ToDate=2026.08.01',
            'Deposit=10000',
            'Currency=USD',
            'Leverage=1:100',
            'Visual=0',
            'Report=KingsBot_Phase7_Tester.htm',
            'ReplaceReport=1',
            'ShutdownTerminal=1'
          )

          $lines |
            Set-Content `
              -LiteralPath $config `
              -Encoding Unicode

          Copy-Item `
            -LiteralPath $config `
            -Destination "$env:GITHUB_WORKSPACE\phase7-evidence\" `
            -Force

          "TESTER_CONFIG=$config" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run MT5 Strategy Tester
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $report = Join-Path `
            $env:MT5_ROOT `
            'KingsBot_Phase7_Tester.htm'

          Remove-Item `
            -LiteralPath $report `
            -Force `
            -ErrorAction SilentlyContinue

          Write-Host 'Launching MT5 Strategy Tester...'

          $process = Start-Process `
            -FilePath $env:MT5_TERMINAL `
            -ArgumentList @(
              '/portable',
              ('/config:' + $env:TESTER_CONFIG)
            ) `
            -WorkingDirectory $env:MT5_ROOT `
            -PassThru

          Write-Host ('MT5 PID: ' + $process.Id)

          $deadline = (Get-Date).AddMinutes(20)

          while ((Get-Date) -lt $deadline) {
            if (Test-Path -LiteralPath $report) {
              break
            }

            Start-Sleep -Seconds 10
          }

          if (-not (Test-Path -LiteralPath $report)) {
            throw 'NO TESTER REPORT FOUND.'
          }

          $reportSize = (Get-Item -LiteralPath $report).Length

          if ($reportSize -le 0) {
            throw 'Strategy Tester report is empty.'
          }

          Write-Host ('Tester report size: ' + $reportSize)

          Copy-Item `
            -LiteralPath $report `
            -Destination "$env:GITHUB_WORKSPACE\phase7-evidence\" `
            -Force

      - name: Collect Phase 7 diagnostics
        if: always()
        shell: pwsh
        run: |
          $evidence = "$env:GITHUB_WORKSPACE\phase7-evidence"

          if ($env:MT5_ROOT -and (Test-Path -LiteralPath $env:MT5_ROOT)) {
            Get-ChildItem `
              -LiteralPath $env:MT5_ROOT `
              -Recurse `
              -File `
              -Include '*.log','*.ini','*.htm','*.html' `
              -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 100 |
              ForEach-Object {
                Copy-Item `
                  -LiteralPath $_.FullName `
                  -Destination $evidence `
                  -Force `
                  -ErrorAction SilentlyContinue
              }
          }

          Set-Content `
            -LiteralPath "$evidence\finish.txt" `
            -Value ('Finished: ' + (Get-Date -Format o))

      - name: Upload Phase 7 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-Phase7-Evidence
          path: phase7-evidence
          if-no-files-found: warn
          retention-days: 14
