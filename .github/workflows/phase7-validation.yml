name: King's Bot - Phase 7 Runtime Validation

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  MT5_DIR: C:\MT5
  BOT_SOURCE_NAME: KingsBot_Phase6_Integration.mq5
  TEST_SYMBOL: EURUSD
  TEST_PERIOD: M15
  TEST_FROM: 2024.01.02
  TEST_TO: 2024.08.20

jobs:
  phase7:
    name: Phase 7 Runtime and Strategy Tester
    runs-on: windows-2025
    timeout-minutes: 35

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate King's Bot source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter $env:BOT_SOURCE_NAME `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $source) {
            throw "Could not find $env:BOT_SOURCE_NAME"
          }

          Write-Host "Source: $($source.FullName)"

          "BOT_SOURCE=$($source.FullName)" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare evidence directory
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $evidence = Join-Path `
            $env:GITHUB_WORKSPACE `
            'phase7-evidence'

          New-Item `
            -ItemType Directory `
            -Path $evidence `
            -Force |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Path (Join-Path $evidence 'MT5-Logs') `
            -Force |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Path (Join-Path $evidence 'Tester-Logs') `
            -Force |
            Out-Null

          Set-Content `
            -Path (Join-Path $evidence 'phase7-started.txt') `
            -Value 'Phase 7 validation started.' `
            -Encoding UTF8

          "EVIDENCE_DIR=$evidence" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download MetaTrader 5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path `
            $env:RUNNER_TEMP `
            'mt5setup.exe'

          $url = 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe'

          $downloaded = $false

          for ($attempt = 1; $attempt -le 5; $attempt++) {

            Write-Host "MT5 download attempt $attempt of 5"

            try {

              Invoke-WebRequest `
                -Uri $url `
                -OutFile $installer `
                -UseBasicParsing `
                -TimeoutSec 180

              $item = Get-Item `
                -LiteralPath $installer `
                -ErrorAction SilentlyContinue

              if ($null -ne $item -and $item.Length -gt 1000000) {

                Write-Host "Installer size: $($item.Length) bytes"

                $downloaded = $true

                break
              }

            }
            catch {

              Write-Host `
                "Download attempt failed: $($_.Exception.Message)"
            }

            if ($attempt -lt 5) {
              Start-Sleep -Seconds 10
            }
          }

          if (-not $downloaded) {
            throw 'Unable to download MetaTrader 5 installer.'
          }

          "MT5_INSTALLER=$installer" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          $hash = Get-FileHash `
            -Path $installer `
            -Algorithm SHA256

          Set-Content `
            -Path (Join-Path $env:EVIDENCE_DIR 'mt5-installer-sha256.txt') `
            -Value $hash.Hash `
            -Encoding UTF8

      - name: Install MetaTrader 5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host 'Installing MetaTrader 5...'
          Write-Host "Target: $env:MT5_DIR"

          Remove-Item `
            -Path $env:MT5_DIR `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Path $env:MT5_DIR `
            -Force |
            Out-Null

          $installerArguments = @(
            '/auto'
            "/path:$env:MT5_DIR"
          )

          $process = Start-Process `
            -FilePath $env:MT5_INSTALLER `
            -ArgumentList $installerArguments `
            -Wait `
            -PassThru `
            -NoNewWindow

          Write-Host "Installer exit code: $($process.ExitCode)"

          Set-Content `
            -Path (Join-Path $env:EVIDENCE_DIR 'installer-exit-code.txt') `
            -Value $process.ExitCode `
            -Encoding UTF8

          $terminalItem = Get-ChildItem `
            -Path $env:MT5_DIR `
            -Filter 'terminal64.exe' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          $editorItem = Get-ChildItem `
            -Path $env:MT5_DIR `
            -Filter 'metaeditor64.exe' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $terminalItem) {
            throw 'terminal64.exe was not found after MetaTrader 5 installation.'
          }

          if ($null -eq $editorItem) {
            throw 'metaeditor64.exe was not found after MetaTrader 5 installation.'
          }

          $terminal = $terminalItem.FullName
          $editor = $editorItem.FullName
