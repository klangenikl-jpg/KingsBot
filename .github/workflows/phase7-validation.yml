name: King's Bot - Phase 7 Runtime Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase7:
    name: Phase 7 Runtime and Strategy Tester Validation
    runs-on: windows-2022
    timeout-minutes: 60

    steps:

      - name: Checkout King's Bot
        uses: actions/checkout@v4

      - name: Create evidence directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Evidence = Join-Path $env:GITHUB_WORKSPACE 'phase7-artifacts'
          New-Item -ItemType Directory -Path $Evidence -Force | Out-Null
          Set-Content -Path (Join-Path $Evidence 'phase7-started.txt') -Value "Phase 7 started $(Get-Date -Format o)" -Encoding UTF8
          "EVIDENCE=$Evidence" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding UTF8

      - name: Find King's Bot source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Source = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -File -Filter 'KingsBot_Phase6_Integration.mq5' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $Source) {
            throw 'KingsBot_Phase6_Integration.mq5 was not found in the repository.'
          }
          "SOURCE=$($Source.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding UTF8
          Set-Content -Path (Join-Path $env:EVIDENCE 'source.txt') -Value $Source.FullName -Encoding UTF8
          Copy-Item -Path $Source.FullName -Destination $env:EVIDENCE -Force

      - name: Download MT5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          Invoke-WebRequest -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' -OutFile $Installer -UseBasicParsing
          if (-not (Test-Path -LiteralPath $Installer)) {
            throw 'MT5 installer download failed.'
          }
          $Size = (Get-Item -LiteralPath $Installer).Length
          $Hash = (Get-FileHash -Path $Installer -Algorithm SHA256).Hash
          Set-Content -Path (Join-Path $env:EVIDENCE 'mt5-download.txt') -Value "Size=$Size`nSHA256=$Hash" -Encoding UTF8
          "INSTALLER=$Installer" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding UTF8

      - name: Install MT5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $InstallRoot = Join-Path $env:RUNNER_TEMP 'KingsBot-MT5'
          Remove-Item -Path $InstallRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $InstallRoot -Force | Out-Null

          $Process = Start-Process -FilePath $env:INSTALLER -ArgumentList "/auto /path:$InstallRoot" -Wait -PassThru
          Set-Content -Path (Join-Path $env:EVIDENCE 'mt5-installer-exit-code.txt') -Value $Process.ExitCode -Encoding UTF8

          $Terminal = Get-ChildItem -Path $InstallRoot -Recurse -File -Filter 'terminal64.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          $Editor = Get-ChildItem -Path $InstallRoot -Recurse -File -Filter 'metaeditor64.exe' -ErrorAction SilentlyContinue | Select-Object -First 1

          if (-not $Terminal) {
            throw "MT5 terminal64.exe was not found. Installer exit code: $($Process.ExitCode)"
          }

          if (-not $Editor) {
            throw "MT5 metaeditor64.exe was not found. Installer exit code: $($Process.ExitCode)"
          }

          "MT5_ROOT=$InstallRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding UTF8
          "TERMINAL=$($Terminal.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding UTF8
          "EDITOR=$($
