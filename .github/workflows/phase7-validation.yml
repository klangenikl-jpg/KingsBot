name: KingsBot Phase 7 Runtime and Strategy Tester

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/phase7-validation.yml"
      - "**/*.mq5"
      - "**/*.mqh"

permissions:
  contents: read

jobs:
  phase7:
    name: T5 Runtime and Strategy Tester
    runs-on: windows-2025
    timeout-minutes: 30

    env:
      MT5_DIR: C:\MT5
      BOT_SOURCE_NAME: KingsBot_Phase6_Integration.mq5
      TEST_SYMBOL: EURUSD
      TEST_PERIOD: M15
      TEST_FROM: "2025.01.01"
      TEST_TO: "2026.08.01"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate King’s Bot source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter $env:BOT_SOURCE_NAME `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $source) {
            throw "Could not find $env:BOT_SOURCE_NAME."
          }

          Write-Host "SOURCE=$($source.FullName)"

          "BOT_SOURCE=$($source.FullName)" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download MT5 installer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path `
            $env:RUNNER_TEMP `
            'mt5setup.exe'

          $url = 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe'

          if (Test-Path $installer) {
            Remove-Item $installer -Force
          }

          Write-Host 'Downloading MT5 installer...'

          $downloaded = $false

          for ($attempt = 1; $attempt -le 5; $attempt++) {

            Write-Host "Download attempt $attempt of 5"

            & aria2c `
              --allow-overwrite=true `
              --auto-file-renaming=false `
              --check-integrity=true `
              --connect-timeout=30 `
              --timeout=60 `
              --max-tries=3 `
              --retry-wait=5 `
              --split=4 `
              --max-connection-per-server=4 `
              --file-allocation=none `
              --dir="$env:RUNNER_TEMP" `
              --out='mt5setup.exe' `
              "$url"

            if ($LASTEXITCODE -eq 0 -and (Test-Path $installer)) {

              $size = (Get-Item $installer).Length

              Write-Host "Installer size: $size bytes"

              if ($size -gt 1000000) {
                $downloaded = $true
                break
              }
            }

            if ($attempt -lt 5) {
              Start-Sleep -Seconds 10
            }
          }

          if (-not $downloaded) {
            throw 'MT5 installer could not be downloaded successfully.'
          }

          "MT5_INSTALLER=$installer" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install MetaTrader 5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          if (Test-Path $env:MT5_DIR) {
            Remove-Item `
              $env:MT5_DIR `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue
          }

          New-Item `
            -ItemType Directory `
            -Path $env:MT5_DIR `
            -Force |
            Out-Null

          Write-Host 'Installing MetaTrader 5...'
          Write-Host "Installer: $env:MT5_INSTALLER"
          Write-Host "Target: $env:MT5_DIR"

          $logFile = Join-Path `
            $env:RUNNER_TEMP `
            'mt5-install.log'

          $arguments = @(
            '/auto'
            "/path:$env:MT5_DIR"
          )

          $p = Start-Process `
            -FilePath $env:MT5_INSTALLER `
            -ArgumentList $arguments `
            -Wait `
            -PassThru `
            -NoNewWindow

          Write-Host "MT5 installer exit code: $($p.ExitCode)"

          if ($p.ExitCode -ne 0) {

            Write-Host 'Installer returned a non-zero exit code.'

            Write-Host 'Searching for terminal64.exe despite installer status...'

            $possible = Get-ChildItem `
              -Path 'C:\MT5', 'C:\Program Files', 'C:\Program Files (x86)' `
              -Filter 'terminal64.exe' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 10

            if ($possible) {
              $possible |
                Select-Object FullName, Length, LastWriteTime |
                Format-Table -AutoSize
            }

            throw "MetaTrader 5 installer failed with exit code $($p.ExitCode)."
          }

      - name: Locate installed MT5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $terminal = Get-ChildItem `
            -Path $env:MT5_DIR `
            -Filter 'terminal64.exe' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          $editor = Get-ChildItem `
            -Path $env:MT5_DIR `
            -Filter 'metaeditor64.exe' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $terminal) {
            throw 'terminal64.exe was not found in the MT5 installation.'
          }

          if ($null -eq $editor) {
            throw 'metaeditor64.exe was not found in the MT5 installation.'
          }

          Write-Host "TERMINAL=$($terminal.FullName)"
          Write-Host "EDITOR=$($editor.FullName)"

          "MT5_TERMINAL=$($terminal.FullName)" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "MT5_EDITOR=$($editor.FullName)" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare portable MT5 environment
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $terminalRoot = Split-Path `
            $env:MT5_TERMINAL `
            -Parent

          $expertDir = Join-Path `
            $terminalRoot `
            'MQL5\Experts\KingsBot'

          $reportDir = Join-Path `
            $terminalRoot `
            'Tester\reports'

          New-Item `
            -ItemType Directory `
            -Path $expertDir `
            -Force |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Path $reportDir `
            -Force |
            Out-Null

          $sourceRoot = Split-Path `
            $env:BOT_SOURCE `
