name: KingsBot Phase 7 Runtime and Strategy Tester

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/phase7-validation.yml"
      - "**/*.mq5"
      - "**/*.mqh"

permissions:
  contents: read

jobs:
  phase7:
    name: T5 Runtime and Strategy Tester
    runs-on: windows-2025
    timeout-minutes: 30

    env:
      MT5_DIR: C:\MT5
      BOT_SOURCE_NAME: KingsBot_Phase6_Integration.mq5
      TEST_SYMBOL: EURUSD
      TEST_PERIOD: M15
      TEST_FROM: "2025.01.01"
      TEST_TO: "2026.08.01"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate King’s Bot source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter $env:BOT_SOURCE_NAME `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $source) {
            throw "Could not find $env:BOT_SOURCE_NAME."
          }

          Write-Host "King's Bot source:"
          Write-Host $source.FullName

          "BOT_SOURCE=$($source.FullName)" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download MetaTrader 5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path `
            $env:RUNNER_TEMP `
            'mt5setup.exe'

          $url = 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe'

          Remove-Item `
            $installer `
            -Force `
            -ErrorAction SilentlyContinue

          $downloaded = $false

          for ($attempt = 1; $attempt -le 5; $attempt++) {

            Write-Host "MT5 download attempt $attempt of 5"

            & aria2c `
              --allow-overwrite=true `
              --auto-file-renaming=false `
              --check-integrity=true `
              --connect-timeout=30 `
              --timeout=60 `
              --max-tries=3 `
              --retry-wait=5 `
              --split=4 `
              --max-connection-per-server=4 `
              --file-allocation=none `
              --dir="$env:RUNNER_TEMP" `
              --out='mt5setup.exe' `
              "$url"

            if ($LASTEXITCODE -eq 0 -and (Test-Path $installer)) {

              $size = (Get-Item $installer).Length

              Write-Host "Installer size: $size bytes"

              if ($size -gt 1000000) {
                $downloaded = $true
                break
              }
            }

            if ($attempt -lt 5) {
              Start-Sleep -Seconds 10
            }
          }

          if (-not $downloaded) {
            throw 'MetaTrader 5 installer download failed.'
          }

          "MT5_INSTALLER=$installer" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install MetaTrader 5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Remove-Item `
            $env:MT5_DIR `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Path $env:MT5_DIR `
            -Force |
            Out-Null

          $arguments = @(
            '/auto'
            "/path:$env:MT5_DIR"
          )

          Write-Host 'Installing MetaTrader 5...'
          Write-Host "Installer: $env:MT5_INSTALLER"
          Write-Host "Target: $env:MT5_DIR"

          $process = Start-Process `
            -FilePath $env:MT5_INSTALLER `
            -ArgumentList $arguments `
            -Wait `
            -PassThru `
            -NoNewWindow

          $installerCode = $process.ExitCode

          Write-Host "MT5 installer exit code: $installerCode"

          "MT5_INSTALLER_EXIT_CODE=$installerCode" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          $terminal = Join-Path `
            $env:MT5_DIR `
            'terminal64.exe'

          $editor = Join-Path `
            $env:MT5_DIR `
            'metaeditor64.exe'

          if (-not (Test-Path $terminal)) {
            throw "MT5 installation verification failed: terminal64.exe was not found at $terminal."
          }

          if (-not (Test-Path $editor)) {
            throw "MT5 installation verification failed: metaeditor64.exe was not found at $editor."
          }

          $terminalInfo = Get-Item $terminal

          Write-Host 'MT5 installation verified.'
          Write-Host "Terminal: $terminal"
          Write-Host "Terminal size: $($terminalInfo.Length)"

          "MT5_TERMINAL=$terminal" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "MT5_EDITOR=$editor" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "MT5_ROOT_ACTUAL=$env:MT5_DIR" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare MT5 portable data directories
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $root = $env:MT5_ROOT_ACTUAL

          $expertDir = Join-Path `
            $root `
            'MQL5\Experts\KingsBot'

          $reportDir = Join-Path `
            $root `
            'Reports'

          $testerDir = Join-Path `
            $root `
            'Tester'

          $logsDir = Join-Path `
            $root `
            'Logs'

          New-Item `
            -ItemType Directory `
            -Path $expertDir `
            -Force |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Path $reportDir `
            -Force |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Path $testerDir `
            -Force |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Path $logsDir `
            -Force |
            Out-Null

          $sourceRoot = Split-Path `
            $env:BOT_SOURCE `
            -Parent

          Copy-Item `
            -Path (Join-Path $sourceRoot '*') `
            -Destination $expertDir `
            -Recurse `
            -Force

          $expertSource = Join-Path `
            $expertDir `
            $env:BOT_SOURCE_NAME

          if (-not (Test-Path $expertSource)) {
            throw "King's Bot source was not copied correctly: $expertSource"
          }

          Write-Host "Portable MT5 root: $root"
          Write-Host "Expert directory: $expertDir"
          Write-Host "Report directory: $reportDir"

          "EXPERT_DIR=$expertDir" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "EXPERT_SOURCE=$expertSource" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "REPORT_DIR=$reportDir" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compile King’s Bot
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "MetaEditor: $env:MT5_EDITOR"
          Write-Host "Source: $env:EXPERT_SOURCE"

          & $env:MT5_EDITOR `
            "/compile:$env:EXPERT_SOURCE" `
            '/log'

          $compileCode = $LASTEXITCODE

          Write-Host "MetaEditor exit code: $compileCode"

          "MT5_COMPILE_EXIT_CODE=$compileCode" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          $ex5 = Join-Path `
            $env:EXPERT_DIR `
            'KingsBot_Phase6_Integration.ex5'

          if ($compileCode -ne 0) {
            throw "King's Bot compilation failed with exit code $compileCode."
          }

          if (-not (Test-Path $ex5)) {
            throw "Compilation succeeded but EX5 was not found: $ex5."
          }

          $ex5Info = Get-Item $ex5

          if ($ex5Info.Length -lt 1000) {
            throw "EX5 is unexpectedly small: $($ex5Info.Length) bytes."
          }

          Write-Host 'EX5 verified.'
          Write-Host "Path: $ex5"
          Write-Host "Size: $($ex5Info.Length) bytes"

          "EXPERT_EX5=$ex5" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create Phase 7 tester configuration
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $config = Join-Path `
            $env:MT5_ROOT_ACTUAL `
            'KingsBot_Phase7_Tester.ini'

          $lines = @(
            '[Tester]'
            'Expert=KingsBot\KingsBot_Phase6_Integration.ex5'
            "Symbol=$env:TEST_SYMBOL"
            "Period=$env:TEST_PERIOD"
            'Model=0'
            'Optimization=0'
            "FromDate=$env:TEST_FROM"
            "ToDate=$env:TEST_TO"
            'ForwardMode=0'
            'Deposit=10000'
            'Currency=USD'
            'Leverage=1:100'
            'Report=Reports\KingsBot_Phase7_Tester.htm'
            'ReplaceReport
