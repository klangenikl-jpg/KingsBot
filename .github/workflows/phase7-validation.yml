name: King's Bot - Phase 7 Runtime Validation

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  MT5_DIR: C:\MT5
  BOT_SOURCE_NAME: KingsBot_Phase6_Integration.mq5
  EX5_NAME: KingsBot_Phase6_Integration.ex5

jobs:
  phase7:
    name: Phase 7 Runtime and Strategy Tester
    runs-on: windows-latest
    timeout-minutes: 50

    env:
      MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
      MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
      MT5_SERVER: ${{ secrets.MT5_SERVER }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare evidence
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $evidence = Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence'

          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          New-Item -ItemType Directory -Path "$evidence\MT5-Logs" -Force | Out-Null
          New-Item -ItemType Directory -Path "$evidence\Tester-Logs" -Force | Out-Null

          Write-Host "Evidence directory: $evidence"

      - name: Verify MT5 secrets
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:MT5_LOGIN)) {
            throw 'MT5_LOGIN secret is missing.'
          }

          if ([string]::IsNullOrWhiteSpace($env:MT5_PASSWORD)) {
            throw 'MT5_PASSWORD secret is missing.'
          }

          if ([string]::IsNullOrWhiteSpace($env:MT5_SERVER)) {
            throw 'MT5_SERVER secret is missing.'
          }

          Write-Host 'MT5_LOGIN: PRESENT'
          Write-Host 'MT5_PASSWORD: PRESENT'
          Write-Host 'MT5_SERVER: PRESENT'

      - name: Locate source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter $env:BOT_SOURCE_NAME `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $source) {
            throw "Source not found: $env:BOT_SOURCE_NAME"
          }

          Write-Host "SOURCE: $($source.FullName)"

          "BOT_SOURCE=$($source.FullName)" |
            Out-File $env:GITHUB_ENV -Encoding utf8

      - name: Download MT5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'

          Invoke-WebRequest `
            -Uri 'https://download.mql
