name: King's Bot - Phase 7 Runtime Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase7:
    name: Phase 7 Runtime and Strategy Tester Validation
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create evidence directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $Evidence = Join-Path $env:GITHUB_WORKSPACE 'phase7-artifacts'

          New-Item -ItemType Directory -Path $Evidence -Force | Out-Null

          Set-Content `
            -Path (Join-Path $Evidence 'phase7-started.txt') `
            -Value 'Phase 7 started' `
            -Encoding UTF8

          "EVIDENCE=$Evidence" |
            Out-File $env:GITHUB_ENV -Append -Encoding UTF8

      - name: Find King''s Bot source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $Source = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Recurse `
            -File `
            -Filter 'KingsBot_Phase6_Integration.mq5' `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $Source) {
            throw 'KingsBot_Phase6_Integration.mq5 not found in repository.'
          }

          "SOURCE=$($Source.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding UTF8

          Copy-Item `
            -LiteralPath $Source.FullName `
            -Destination $env:EVIDENCE `
            -Force

          Set-Content `
            -Path (Join-Path $env:EVIDENCE 'source-location.txt') `
            -Value $Source.FullName `
            -Encoding UTF8

      - name: Download MT5 installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $Installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'

          Invoke-WebRequest `
            -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' `
            -OutFile $Installer `
            -UseBasicParsing

          if (-not (Test-Path -LiteralPath $Installer)) {
            throw 'MT5 installer download failed.'
          }

          $Hash = Get-FileHash `
            -Path $Installer `
            -Algorithm SHA256

          Set-Content `
            -Path (Join-Path $env:EVIDENCE 'mt5-download.txt') `
            -Value "SHA256=$($Hash.Hash)" `
            -Encoding UTF8

          "INSTALLER=$Installer" |
            Out-File $env:GITHUB_ENV -Append -Encoding UTF8

      - name: Install MT5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $Root = Join-
