name: King's Bot - Phase 7 Runtime Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase7:
    name: Phase 7 Runtime and Strategy Tester
    runs-on: windows-2025
    timeout-minutes: 30

    env:
      MT5_DIR: C:\MT5
      BOT_SOURCE_NAME: KingsBot_Phase6_Integration.mq5
      EX5_NAME: KingsBot_Phase6_Integration.ex5
      MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
      MT5_SERVER: ${{ secrets.MT5_SERVER }}
      MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Initialize Phase 7 evidence
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          New-Item -ItemType Directory -Path "$env:GITHUB_WORKSPACE\phase7-evidence" -Force | Out-Null
          New-Item -ItemType Directory -Path "$env:GITHUB_WORKSPACE\phase7-evidence\MT5-Logs" -Force | Out-Null
          New-Item -ItemType Directory -Path "$env:GITHUB_WORKSPACE\phase7-evidence\Tester-Logs" -Force | Out-Null

          Write-Host "Phase 7 evidence directory created."

      - name: Validate MT5 credentials
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:MT5_LOGIN)) {
            throw "MT5_LOGIN secret is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:MT5_SERVER)) {
            throw "MT5_SERVER secret is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:MT5_PASSWORD)) {
            throw "MT5_PASSWORD secret is missing."
          }

          if ($env:MT5_LOGIN -notmatch '^[0-9]+$') {
            throw "MT5_LOGIN must be numeric."
          }

          Write-Host "MT5 login supplied: $env:MT5_LOGIN"
          Write-Host "MT5 server supplied: $env:MT5_SERVER"

      - name: Locate King Bot source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Get-ChildItem `
            -Path "$env:GITHUB_WORKSPACE" `
            -Filter "$env:BOT_SOURCE_NAME" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $source) {
            throw "Could not find $env:BOT_SOURCE_NAME in the repository."
          }

          Write-Host "SOURCE: $($source.FullName)"

          "BOT_SOURCE=$($source.FullName)" |
            Out-File "$env:GITHUB_ENV" -Encoding utf8

      - name: Download MT5 installer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = "$env:RUNNER_TEMP\mt5setup.exe"

          Invoke-WebRequest `
            -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" `
            -OutFile $installer `
            -UseBasicParsing

          if (-not (Test-Path -LiteralPath $installer)) {
            throw "MT5 installer was not downloaded."
          }

          "MT5_INSTALLER=$installer" |
            Out-File "$env:GITHUB_ENV" -Encoding utf8

          Write-Host "Installer downloaded."

      - name: Install MT5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          if (Test-Path -LiteralPath "$env:MT5_DIR") {
            Remove-Item -LiteralPath "$env:MT5_DIR" -Recurse -Force
          }

          New-Item -ItemType Directory -Path "$env:MT5_DIR" -Force | Out-Null

          $p = Start-Process `
            -FilePath "$env:MT5_INSTALLER" `
            -ArgumentList "/auto", "/path:$env:MT5_DIR" `
            -Wait `
            -PassThru

          Write-Host "MT5 installer exit code: $($p.ExitCode)"

          Start-Sleep -Seconds 10

          $terminal = Get-ChildItem `
            -Path "$env:MT5_DIR" `
            -Filter "terminal64.exe" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          $editor = Get-ChildItem `
            -Path "$env:MT5_DIR" `
            -Filter "metaeditor64.exe" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $terminal) {
            throw "terminal64.exe was not found."
          }

          if ($null -eq $editor) {
            throw "metaeditor64.exe was not found."
          }

          Write-Host "TERMINAL: $($terminal.FullName)"
          Write-Host "EDITOR: $($editor.FullName)"

          "MT5_TERMINAL=$($terminal.FullName)" |
            Out-File "$env:GITHUB_ENV" -Encoding utf8

          "MT5_EDITOR=$($editor.FullName)" |
            Out-File "$env:GITHUB_ENV" -Encoding utf8

      - name: Prepare EA
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $expertDir = "$env:MT5_DIR\MQL5\Experts\KingsBot"

          New-Item `
            -ItemType Directory `
            -Path $expertDir `
            -Force |
            Out-Null

          $sourceDir = Split-Path "$env:BOT_SOURCE" -Parent

          Copy-Item `
            -Path "$sourceDir\*" `
            -Destination $expertDir `
            -Recurse `
            -Force

          $expertSource = "$expertDir\$env:BOT_SOURCE_NAME"

          if (-not (Test-Path -LiteralPath $expertSource)) {
            throw "EA source was not copied to MT5."
          }

          Write-Host "EA SOURCE: $expertSource"

      - name: Compile King Bot
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $source = "$env:MT5_DIR\MQL5\Experts\KingsBot\$env:BOT_SOURCE_NAME"
          $compileLog = "$env:GITHUB_WORKSPACE\phase7-evidence\compile.log"

          $p = Start-Process `
            -FilePath "$env:MT5_EDITOR" `
            -ArgumentList "/portable", "/compile:$source", "/log:$compileLog" `
            -WorkingDirectory "$env:MT5_DIR" `
            -Wait `
            -PassThru

          Write-Host "MetaEditor exit code: $($p.ExitCode)"

          if (Test-Path -LiteralPath $compileLog) {
            Get-Content -LiteralPath $compileLog
          }

      -
