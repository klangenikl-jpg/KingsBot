name: King's Bot - Phase 7 Runtime Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase7:
    name: Phase 7 Runtime and Strategy Tester Validation
    runs-on: windows-2022
    timeout-minutes: 60

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Create evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Evidence = Join-Path $env:GITHUB_WORKSPACE 'phase7-artifacts'
          New-Item -ItemType Directory -Path $Evidence -Force | Out-Null
          'EVIDENCE=' + $Evidence | Out-File $env:GITHUB_ENV -Append -Encoding UTF8
          Set-Content (Join-Path $Evidence 'phase7-started.txt') 'Phase 7 started' -Encoding UTF8

      - name: Find source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Source = Get-ChildItem $env:GITHUB_WORKSPACE -Recurse -File -Filter 'KingsBot_Phase6_Integration.mq5' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $Source) { throw 'KingsBot_Phase6_Integration.mq5 not found.' }
          'SOURCE=' + $Source.FullName | Out-File $env:GITHUB_ENV -Append -Encoding UTF8
          Copy-Item $Source.FullName $env:EVIDENCE -Force

      - name: Download MT5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          Invoke-WebRequest 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' -OutFile $Installer -UseBasicParsing
          if (-not (Test-Path $Installer)) { throw 'MT5 download failed.' }
          $Hash = Get-FileHash -Path $Installer -Algorithm SHA256
          Set-Content (Join-Path $env:EVIDENCE 'mt5-download.txt') ('SHA256=' + $Hash.Hash) -Encoding UTF8
          'INSTALLER=' + $Installer | Out-File $env:GITHUB_ENV -Append -Encoding UTF8

      - name: Install MT5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $Root = Join-Path $env:RUNNER_TEMP 'KingsBot-MT5'
          Remove-Item $Root -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $Root -Force | Out-Null
          $P = Start-Process $env:INSTALLER -ArgumentList '/auto',('/path=' + $Root) -Wait -PassThru
          Set-Content (Join-Path $env:EVIDENCE 'installer-exit-code.txt') $P.ExitCode -Encoding UTF8
          Start-Sleep -Seconds 5
          $T = Get-ChildItem $env:RUNNER_TEMP -Recurse -File -Filter 'terminal64.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          $E = Get-ChildItem $env:RUNNER_TEMP -Recurse -File -Filter 'metaeditor64.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $T) { $T = Get-ChildItem 'C:\Program Files' -Recurse -File -Filter 'terminal64.exe' -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if ($null -eq $E) { $E = Get-ChildItem 'C:\Program Files' -Recurse -File -Filter 'metaeditor64.exe' -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if ($null -eq $T) { throw 'terminal64.exe not found.' }
          if ($null -eq $E) { throw 'metaeditor64.exe not found.' }
          'TERMINAL=' + $T.FullName | Out-File $env:GITHUB_ENV -Append -Encoding UTF8
          'EDITOR=' + $E.FullName | Out-File $env:GITHUB_ENV -Append -Encoding UTF8
          'MT5ROOT=' + $T.Directory.FullName | Out-File $env:GITHUB_ENV -Append -Encoding UTF8
          Set-Content (Join-Path $env:EVIDENCE 'mt5-location.txt') ('Terminal=' + $T.FullName + [Environment]::NewLine + 'MetaEditor=' + $E.FullName) -Encoding UTF8

      - name: Prepare source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Target =
