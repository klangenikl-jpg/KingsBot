name: KingsBot Phase 7 Runtime Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase7-runtime:
    name: Phase 7 MT5 Runtime and Strategy Tester
    runs-on: windows-2022
    timeout-minutes: 40

    steps:
      - name: Checkout KingsBot
        uses: actions/checkout@v4

      - name: Initialize Phase 7 evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $evidence = Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence'

          New-Item -ItemType Directory -Path $evidence -Force | Out-Null

          @(
            'KINGS BOT PHASE 7 RUNTIME VALIDATION'
            "Workflow run: $env:GITHUB_RUN_ID"
            "Commit: $env:GITHUB_SHA"
            "Runner: $env:RUNNER_OS"
            "Started: $(Get-Date -Format o)"
          ) | Set-Content `
            -LiteralPath (Join-Path $evidence 'runtime-start.txt') `
            -Encoding UTF8

      - name: Locate KingsBot Phase 6 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Recurse `
            -File `
            -Filter 'KingsBot_Phase6_Integration.mq5' `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $source) {
            throw 'KingsBot_Phase6_Integration.mq5 was not found in the repository.'
          }

          Write-Host "Source found:"
          Write-Host $source.FullName

          $source.FullName | Set-Content `
            -LiteralPath "$env:GITHUB_WORKSPACE\phase7-evidence\source-location.txt" `
            -Encoding UTF8

          Copy-Item `
            -LiteralPath $source.FullName `
            -Destination "$env:GITHUB_WORKSPACE\phase7-evidence\KingsBot_Phase6_Integration.mq5" `
            -Force

      - name: Download MetaTrader 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'

          Invoke-WebRequest `
            -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' `
            -OutFile $installer `
            -UseBasicParsing

          if (-not (Test-Path $installer)) {
            throw 'MetaTrader 5 installer was not downloaded.'
          }

          Write-Host "Installer:"
          Write-Host $installer

      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          $mt5Install = Join-Path $env:RUNNER_TEMP 'KingsBot-MT5'

          if (Test-Path $mt5Install) {
            Remove-Item $mt5Install -Recurse -Force
          }

          New-Item -ItemType Directory -Path $mt5Install -Force | Out-Null

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList "/auto /path:$mt5Install" `
            -Wait `
            -PassThru

          Write-Host "MT5 installer exit code: $($process.ExitCode)"

          $process.ExitCode | Set-Content `
            -LiteralPath "$env:GITHUB_WORKSPACE\phase7-evidence\mt5-installer-exit-code.txt" `
            -Encoding UTF8

          if ($process.ExitCode -ne 0) {
            throw "MetaTrader 5 installer failed with exit code $($process.ExitCode)."
          }

      - name: Locate MT5 terminal and MetaEditor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $mt5Install = Join-Path $env:RUNNER_TEMP 'KingsBot-MT5'

          $terminal = Get-ChildItem `
            -Path $mt5Install `
            -Recurse `
            -File `
            -Filter 'terminal64.exe' `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          $editor = Get-ChildItem `
            -Path $mt5Install `
            -Recurse `
            -File `
            -Filter 'metaeditor64.exe' `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $terminal) {
            throw 'terminal64.exe was not found.'
          }

          if ($null -eq $editor) {
            throw 'metaeditor64.exe was not found.'
          }

          $mt5Root = $terminal.Directory.FullName

          Write-Host "MT5 root: $mt5Root"
          Write-Host "Terminal: $($terminal.FullName)"
          Write-Host "MetaEditor: $($editor.FullName)"

          @(
            "MT5_ROOT=$mt5Root"
            "TERMINAL=$($terminal.FullName)"
            "METAEDITOR=$($editor.FullName)"
          ) | Set-Content `
            -LiteralPath "$env:GITHUB_WORKSPACE\phase7-evidence\mt5-location.txt" `
            -Encoding UTF8

          "MT5_ROOT=$mt5Root" | Out-File $env:GITHUB_ENV -Encoding utf8
          "MT5_TERMINAL=$($terminal.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "MT5_EDITOR=$($editor.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Prepare KingsBot for MT5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Recurse `
            -File `
            -Filter 'KingsBot_Phase6_Integration.mq5' `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $source) {
            throw 'KingsBot source disappeared before preparation.'
          }

          $target = Join-Path $env:MT5_ROOT 'MQL5\Experts\KingsBot'

          if (Test-Path $target) {
            Remove-Item $target -Recurse -Force
          }

          New-Item -ItemType Directory -Path $target -Force | Out-Null

          Copy-Item `
            -Path "$($source.Directory.FullName)\*" `
            -Destination $target `
            -Recurse `
            -Force

          $compileSource = Join-Path $target 'KingsBot_Phase6_Integration.mq5'

          if (-not (Test-Path $compileSource)) {
            throw "Prepared source was not found: $compileSource"
          }

          "Prepared source: $compileSource" | Set-Content `
            -LiteralPath "$env:GITHUB_WORKSPACE\phase7-evidence\prepared-source.txt" `
            -Encoding UTF8

          Write-Host "Prepared source:"
          Write-Host $compileSource

      - name: Compile KingsBot Phase 6 Integration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $compileSource = Join-Path `
            $env:MT5_ROOT `
            'MQL5\Experts\KingsBot\KingsBot_Phase6_Integration.mq5'

          $ex5 = Join-Path `
            $env:MT5_ROOT `
            'MQL5\Experts\KingsBot\KingsBot_Phase6_Integration.ex5'

          Remove-Item $ex5 -Force -ErrorAction SilentlyContinue

          Write-Host '=== COMPILING KINGSBOT ==='
          Write-Host $compileSource

          $process = Start-Process `
            -FilePath $env:MT5_EDITOR `
            -ArgumentList "/compile:$compileSource /log" `
            -WorkingDirectory $env:MT5_ROOT `
            -Wait `
            -PassThru

          Write-Host "MetaEditor exit code: $($process.ExitCode)"

          $process.ExitCode | Set-Content `
            -LiteralPath "$env:GITHUB_WORKSPACE\phase7-evidence\metaeditor-exit-code.txt" `
            -Encoding UTF8

          Start-Sleep -Seconds 3

          $logs = Get-ChildItem `
            -Path $env:MT5_ROOT `
            -Recurse `
            -File `
            -Filter '*.log' `
            -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending

          if ($logs.Count -gt 0) {
            Copy-Item `
              -LiteralPath $logs[0].FullName `
              -Destination "$env:GITHUB_WORKSPACE\phase7-evidence\compiler.log" `
              -Force
          }

          if (-not (Test-Path $ex5)) {
            throw 'Compilation completed but KingsBot_Phase6_Integration.ex5 was not produced.'
          }

          $size = (Get-Item $ex5).Length

          if ($size -le 0) {
            throw 'KingsBot_Phase6_Integration.ex5 is empty.'
          }

          Write-Host "COMPILE PASS"
          Write-Host "EX5 size: $size bytes"

          Copy-Item `
            -LiteralPath $ex5 `
            -Destination "$env:GITHUB_WORKSPACE\phase7-evidence\KingsBot_Phase6_Integration.ex5" `
            -Force

      - name: Create Phase 7 tester configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $config = @'
          [Tester]
          Expert=KingsBot\KingsBot_Phase6_Integration.ex5
          Symbol=EURUSD
          Period=M15
          Model=0
          Optimization=0
          FromDate=2025.01.01
          ToDate=2026.08.01
          ForwardMode=0
          Deposit=10000
          Currency=USD
          Leverage=1:100
          Report=\reports\KingsBot_Phase7_Tester.htm
          ReplaceReport=1
          ShutdownTerminal=1
          Visual=0
          UseCloud=0
          '@

          $configPath = Join-Path `
            $env:MT5_ROOT `
            'KingsBot_Phase7_Tester.ini'

          $config | Set-Content `
            -LiteralPath $configPath `
            -Encoding ASCII

          Copy-Item `
            -LiteralPath $configPath `
            -Destination "$env:GITHUB_WORKSPACE\phase7-evidence\KingsBot_Phase7_Tester.ini" `
            -Force

          Write-Host '=== TESTER CONFIGURATION ==='
          Get-Content $configPath

      - name: Run MT5 Strategy Tester
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $configPath = Join-Path `
            $env:MT5_ROOT `
            'KingsBot_Phase7_Tester.ini'

          if (-not (Test-Path $configPath)) {
            throw "Tester configuration not found: $configPath"
          }

          Write-Host '=========================================='
          Write-Host ' KINGS BOT PHASE 7 RUNTIME TEST'
          Write-Host '=========================================='
          Write-Host "Terminal: $env:MT5_TERMINAL"
          Write-Host "Config:   $configPath"

          $process = Start-Process `
            -FilePath $env:MT5_TERMINAL `
            -ArgumentList "/portable /config:$configPath" `
            -WorkingDirectory $env:MT5_ROOT `
            -PassThru

          Write-Host "MT5 PID: $($process.Id)"

          $pidInfo = @(
            "MT5 PID: $($process.Id)"
            "Started: $(Get-Date -Format o)"
            "Config: $configPath"
          )

          $pidInfo | Set-Content `
            -LiteralPath "$env:GITHUB_WORKSPACE\phase7-evidence\mt5-runtime.txt" `
            -Encoding UTF8

          $timeoutSeconds = 1800
          $elapsed = 0

          while (-not $process.HasExited -and $elapsed -lt $timeoutSeconds) {
            Start-Sleep -Seconds 10
            $elapsed += 10
            Write-Host "MT5 still running... elapsed ${elapsed}s"
          }

          if (-not $process.HasExited) {
            Write-Host 'MT5 did not exit within the timeout.'
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw 'MT5 Strategy Tester timed out after 30 minutes.'
          }

          Write-Host "MT5 exited."
          Write-Host "MT5 exit code: $($process.ExitCode)"

          $process.ExitCode | Set-Content `
            -LiteralPath "$env:GITHUB_WORKSPACE\phase7-evidence\mt5-exit-code.txt" `
            -Encoding UTF8

          if ($process.ExitCode -ne 0) {
            Write-Warning "MT5 returned exit code $($process.ExitCode). Report verification will determine final validation."
          }

      - name: Locate Strategy Tester report
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host '=== SEARCHING FOR PHASE 7 TEST REPORT ==='

          $reportCandidates = @(
            (Join-Path $env:MT5_ROOT 'reports\KingsBot_Phase7_Tester.htm')
            (Join-Path $env:MT5_ROOT 'reports\KingsBot_Phase7_Tester.html')
            (Join-Path $env:MT5_ROOT 'KingsBot_Phase7_Tester.htm')
            (Join-Path $env:MT5_ROOT 'KingsBot_Phase7_Tester.html')
          )

          $report = $null

          foreach ($candidate in $reportCandidates) {
            if (Test-Path $candidate) {
              $report = Get-Item $candidate
              break
            }
          }

          if ($null -eq $report) {
            $report = Get-ChildItem `
              -Path $env:MT5_ROOT `
              -Recurse `
              -File `
              -
