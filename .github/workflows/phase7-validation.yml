name: King's Bot - Phase 7 Runtime Validation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase7-runtime-validation:
    name: Phase 7 Runtime and Strategy Tester Validation
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout King's Bot
        uses: actions/checkout@v4

      - name: Install MT5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          $root = Join-Path $env:RUNNER_TEMP 'KingsBot-MT5'

          Invoke-WebRequest `
            -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' `
            -OutFile $installer `
            -UseBasicParsing

          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $root -Force | Out-Null

          $install = Start-Process `
            -FilePath $installer `
            -ArgumentList @('/auto',('/path:' + $root)) `
            -Wait `
            -PassThru

          Write-Host "Installer exit code: $($install.ExitCode)"

          $terminal = Get-ChildItem `
            $root `
            -Recurse `
            -File `
            -Filter 'terminal64.exe' `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          $editor = Get-ChildItem `
            $root `
            -Recurse `
            -File `
            -Filter 'metaeditor64.exe' `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $terminal) {
            throw 'terminal64.exe was not found.'
          }

          if (-not $editor) {
            throw 'metaeditor64.exe was not found.'
          }

          "MT5_ROOT=$($terminal.Directory.FullName)" |
            Out-File $env:GITHUB_ENV -Append

          "METAEDITOR=$($editor.FullName)" |
            Out-File $env:GITHUB_ENV -Append

          Write-Host "MT5_ROOT=$($terminal.Directory.FullName)"

      - name: Prepare evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $evidence = Join-Path `
            $env:GITHUB_WORKSPACE `
            'phase7-validation-evidence'

          New-Item `
            -ItemType Directory `
            -Path $evidence `
            -Force |
            Out-Null

      - name: Locate King's Bot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Get-ChildItem `
            $env:GITHUB_WORKSPACE `
            -Recurse `
            -File `
            -Filter 'KingsBot_Phase6_Integration.mq5' `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FullName -notmatch '\\.git\\'
            } |
            Select-Object -First 1

          if (-not $source) {
            throw 'KingsBot_Phase6_Integration.mq5 was not found.'
          }

          "KINGSBOT_SOURCE=$($source.FullName)" |
            Out-File $env:GITHUB_ENV -Append

          Write-Host "Source: $($source.FullName)"

      - name: Compile King's Bot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $evidence = Join-Path `
            $env:GITHUB_WORKSPACE `
            'phase7-validation-evidence'

          $source = Get-Item $env:KINGSBOT_SOURCE

          $target = Join-Path `
            $env:MT5_ROOT `
            'MQL5\Experts\KingsBot'

          New-Item `
            -ItemType Directory `
            -Path $target `
            -Force |
            Out-Null

          Get-ChildItem `
            $source.Directory.FullName `
            -Recurse `
            -File |
            Where-Object {
              $_.FullName -notmatch '\\.git\\'
            } |
            ForEach-Object {

              $relative = $_.FullName.Substring(
                $source.Directory.FullName.Length
              ).TrimStart('\')

              $destination = Join-Path $target $relative

              New-Item `
                -ItemType Directory `
                -Path (Split-Path $destination -Parent) `
                -Force |
                Out-Null

              Copy-Item `
                $_.FullName `
                $destination `
                -Force
            }

          $mq5 = Join-Path `
            $target `
            'KingsBot_Phase6_Integration.mq5'

          $ex5 = Join-Path `
            $target `
            'KingsBot_Phase6_Integration.ex5'

          Remove-Item `
            $ex5 `
            -Force `
            -ErrorAction SilentlyContinue

          $compile = Start-Process `
            -FilePath $env:METAEDITOR `
            -ArgumentList @(
              ('/compile:' + $mq5),
              '/log'
            ) `
            -WorkingDirectory $target `
            -Wait `
            -PassThru

          Start-Sleep -Seconds 2

          Write-Host "MetaEditor exit code: $($compile.ExitCode)"

          $log = Get-ChildItem `
            $target `
            -File `
            -Filter '*.log' `
            -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if ($log) {
            Copy-Item `
              $log.FullName `
              (Join-Path $evidence 'compiler.log') `
              -Force

            Get-Content $log.FullName
          }

          if (-not (Test-Path $ex5)) {
            throw 'EX5 was not created.'
          }

          if ((Get-Item $ex5).Length -le 0) {
            throw 'EX5 is empty.'
          }

          Copy-Item `
            $ex5 `
            $evidence `
            -Force

          Write-Host 'EX5 compilation verified.'

      - name: Prepare MT5 tester configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $evidence = Join-Path `
            $env:GITHUB_WORKSPACE `
            'phase7-validation-evidence'

          $config = Join-Path `
            $env:MT5_ROOT `
            'KingsBot_Phase7_Tester.ini'

          $reportDir = Join-Path `
            $env:MT5_ROOT `
            'reports'

          New-Item `
            -ItemType Directory `
            -Path $reportDir `
            -Force |
            Out-Null

          $lines = @(
            '[Tester]'
            'Expert=KingsBot\KingsBot_Phase6_Integration.ex5'
            'Symbol=EURUSD'
            'Period=M15'
            'Model=0'
            'Optimization=0'
            'FromDate=2025.01.01'
            'ToDate=2026.08.01'
            'ForwardMode=0'
            'Deposit=10000'
            'Currency=USD'
            'Leverage=1:100'
            'Report=reports\KingsBot_Phase7_Tester.htm'
            'ReplaceReport=1'
            'ShutdownTerminal=1'
            'Visual=0'
            'UseCloud=0'
          )

          $encoding = New-Object System.Text.UnicodeEncoding(
            $false,
            $false
          )

          [System.IO.File]::WriteAllLines(
            $config,
            $lines,
            $encoding
          )

          Copy-Item `
            $config `
            (Join-Path $evidence 'KingsBot_Phase7_Tester.ini') `
            -Force

          Write-Host '===== TESTER CONFIG ====='
          Get-Content $config
          Write-Host '========================='

      - name: Run MT5 tester
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $evidence = Join-Path `
            $env:GITHUB_WORKSPACE `
            'phase7-validation-evidence'

          $config = Join-Path `
            $env:MT5_ROOT `
            'KingsBot_Phase7_Tester.ini'

          $terminal = Join-Path `
            $env:MT5_ROOT `
            'terminal64.exe'

          if (-not (Test-Path $terminal)) {
            throw 'terminal64.exe was not found.'
          }

          Write-Host "Launching MT5:"
          Write-Host "$terminal /config:$config"

          $process = Start-Process `
            -FilePath $terminal `
            -ArgumentList @(
              "/config:$config"
            ) `
            -WorkingDirectory $env:MT5_ROOT `
            -PassThru

          Write-Host "MT5 PID: $($process.Id)"

          $deadline = (Get-Date).AddMinutes(12)
          $report = $null

          while ((Get-Date) -lt $deadline) {

            if ($process.HasExited) {
              Write-Host "MT5 EXITED."
              Write-Host "Exit code: $($process.ExitCode)"
              break
            }

            $reports = Get-ChildItem `
              $env:MT5_ROOT `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Name -like 'KingsBot_Phase7_Tester*' -and
                $_.Extension -in '.htm','.html','.xml'
              } |
              Sort-Object LastWriteTime -Descending

            if ($reports) {
              $report = $reports | Select-Object -First 1
              break
            }

            Write-Host 'MT5 running; waiting for tester...'
            Start-Sleep -Seconds 10
          }

          $exitCode = $null

          if ($process.HasExited) {
            $exitCode = $process.ExitCode
          }

          @(
            "MT5_PROCESS_ID=$($process.Id)"
            "MT5_PROCESS_EXITED=$($process.HasExited)"
            "MT5_EXIT_CODE=$exitCode"
          ) |
            Set-Content `
              (Join-Path $evidence 'mt5-process-result.txt') `
              -Encoding ASCII

          if ($report) {

            Copy-Item `
              $report.FullName `
              (Join-Path $evidence 'KingsBot_Phase7_Tester.htm') `
              -Force

            Write-Host "TESTER REPORT FOUND: $($report.FullName)"

          } else {

            Write-Host 'NO TESTER REPORT FOUND.'

            if ($process.HasExited) {
              Write-Host "MT5 exit code was $($process.ExitCode)."
            }

            throw 'MT5 did not produce a Strategy Tester report.'
          }

      - name: Capture MT5 crash and runtime diagnostics
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $evidence = Join-Path `
            $env:GITHUB_WORKSPACE `
            'phase7-validation-evidence'

          Write-Host '===== MT5 LOG FILES ====='

          Get-ChildItem `
            $env:MT5_ROOT `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Extension -in '.log','.htm','.html','.xml'
            } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 100 |
            ForEach-Object {

              Write-Host $_.FullName

              Copy-Item `
                $_.FullName `
                (Join-Path $evidence $_.Name) `
                -Force `
                -ErrorAction SilentlyContinue
            }

          Write-Host '===== WINDOWS APPLICATION ERRORS ====='

          try {

            Get-WinEvent `
              -FilterHashtable @{
                LogName='Application'
                StartTime=(Get-Date).AddMinutes(-15)
              } `
              -ErrorAction Stop |
              Where-Object {
                $_.ProviderName -match 'Application Error|Windows Error Reporting' -and
                $_.Message -match 'terminal64|metatester'
              } |
              Select-Object -First 20 |
              Format-List TimeCreated,ProviderName,Id,Message |
              Out-String |
              Set-Content `
                (Join-Path $evidence 'windows-mt5-errors.txt') `
                -Encoding UTF8

          }
          catch {
            "Windows event collection unavailable: $($_.Exception.Message)" |
              Set-Content `
                (Join-Path $evidence 'windows-mt5-errors.txt') `
                -Encoding UTF8
          }

          Write-Host '===== TESTER DIRECTORY ====='

          $testerDir = Join-Path $env:MT5_ROOT 'Tester'

          if (Test-Path $testerDir) {

            Get-ChildItem `
              $testerDir `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 100 |
              ForEach-Object {

                Write-Host $_.FullName

                Copy-Item `
                  $_.FullName `
                  (Join-Path $evidence $_.Name) `
                  -Force `
                  -ErrorAction SilentlyContinue
              }
          }

          'PHASE7_DIAGNOSTICS_COMPLETE' |
            Set-Content `
              (Join-Path $evidence 'diagnostic-status.txt') `
              -Encoding ASCII

      - name: Upload Phase 7 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-Phase7-Runtime-Validation
          path: phase7-validation-evidence
          if-no-files-found: warn
          retention-days: 14
