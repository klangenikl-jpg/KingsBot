name: King's Bot - Phase 7 Runtime Validation

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  MT5_DIR: C:\MT5
  BOT_SOURCE_NAME: KingsBot_Phase6_Integration.mq5
  EX5_NAME: KingsBot_Phase6_Integration.ex5

jobs:
  phase7:
    name: Phase 7 Runtime and Strategy Tester
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
      MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
      MT5_SERVER: ${{ secrets.MT5_SERVER }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare evidence
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $evidence = Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence'

          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          New-Item -ItemType Directory -Path "$evidence\MT5-Logs" -Force | Out-Null
          New-Item -ItemType Directory -Path "$evidence\Tester-Logs" -Force | Out-Null

      - name: Locate source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter $env:BOT_SOURCE_NAME `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $source) {
            throw "Source not found: $env:BOT_SOURCE_NAME"
          }

          Write-Host "SOURCE: $($source.FullName)"
          "BOT_SOURCE=$($source.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8

      - name: Download MT5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'

          Invoke-WebRequest `
            -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' `
            -OutFile $installer `
            -UseBasicParsing `
            -TimeoutSec 180

          if (-not (Test-Path -LiteralPath $installer)) {
            throw 'MT5 installer was not downloaded.'
          }

          "MT5_INSTALLER=$installer" | Out-File $env:GITHUB_ENV -Encoding utf8

      - name: Install MT5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Remove-Item `
            -LiteralPath $env:MT5_DIR `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Path $env:MT5_DIR `
            -Force | Out-Null

          $p = Start-Process `
            -FilePath $env:MT5_INSTALLER `
            -ArgumentList "/auto","/path:$env:MT5_DIR" `
            -Wait `
            -PassThru

          Write-Host "Installer exit code: $($p.ExitCode)"

          Start-Sleep -Seconds 10

          $terminal = Get-ChildItem `
            -Path $env:MT5_DIR `
            -Filter 'terminal64.exe' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          $editor = Get-ChildItem `
            -Path $env:MT5_DIR `
            -Filter 'metaeditor64.exe' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $terminal) {
            throw "terminal64.exe not found under $env:MT5_DIR"
          }

          if ($null -eq $editor) {
            throw "metaeditor64.exe not found under $env:MT5_DIR"
          }

          Write-Host "TERMINAL: $($terminal.FullName)"
          Write-Host "EDITOR: $($editor.FullName)"

          "MT5_TERMINAL=$($terminal.FullName)" |
            Out-File $env:GITHUB_ENV -Encoding utf8

          "METAEDITOR=$($editor.FullName)" |
            Out-File $env:GITHUB_ENV -Encoding utf8

      - name: Prepare EA
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $expertDir = Join-Path `
            $env:MT5_DIR `
            'MQL5\Experts\KingsBot'

          New-Item `
            -ItemType Directory `
            -Path $expertDir `
            -Force | Out-Null

          $sourceRoot = Split-Path $env:BOT_SOURCE -Parent

          Copy-Item `
            -Path (Join-Path $sourceRoot '*') `
            -Destination $expertDir `
            -Recurse `
            -Force

          $expertSource = Join-Path `
            $expertDir `
            $env:BOT_SOURCE_NAME

          if (-not (Test-Path -LiteralPath $expertSource)) {
            throw "EA source was not copied: $expertSource"
          }

          "EXPERT_DIR=$expertDir" |
            Out-File $env:GITHUB_ENV -Encoding utf8

          "EXPERT_SOURCE=$expertSource" |
            Out-File $env:GITHUB_ENV -Encoding utf8

          Write-Host "EXPERT SOURCE: $expertSource"

      - name: Compile EA
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $evidence = Join-Path `
            $env:GITHUB_WORKSPACE `
            'phase7-evidence'

          $compileLog = Join-Path `
            $env:RUNNER_TEMP `
            'KingsBot-MetaEditor.log'

          Remove-Item `
            -LiteralPath $compileLog `
            -Force `
            -ErrorAction SilentlyContinue

          Write-Host '========== COMPILING KING''S BOT =========='
          Write-Host "EDITOR: $env:METAEDITOR"
          Write-Host "SOURCE: $env:EXPERT_SOURCE"

          $p = Start-Process `
            -FilePath $env:METAEDITOR `
            -ArgumentList "/portable","/compile:$env:EXPERT_SOURCE","/log:$compileLog" `
            -WorkingDirectory $env:MT5_DIR `
            -Wait `
            -PassThru

          Write-Host "MetaEditor process exit code: $($p.ExitCode)"

          Start-Sleep -Seconds 5

          if (Test-Path -LiteralPath $compileLog) {
            Copy-Item `
              -LiteralPath $compileLog `
              -Destination (Join-Path $evidence 'compile.log') `
              -Force

            Get-Content -LiteralPath $compileLog
          }

      - name: Verify compiled EX5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host '========== VERIFYING COMPILED EX5 =========='

          $ex5 = Join-Path `
            $env:MT5_DIR `
            'MQL5\Experts\KingsBot\KingsBot_Phase6_Integration.ex5'

          if (-not (Test-Path -LiteralPath $ex5)) {
            Write-Host 'Expected EX5 was not found.'

            Get-ChildItem `
              -Path $env:MT5_DIR `
              -Filter '*.ex5' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object FullName,Length,LastWriteTime |
              Format-Table -AutoSize

            throw "Compiled EX5 not found: $ex5"
          }

          $size = (Get-Item -LiteralPath $ex5).Length

          Write-Host "EX5 FOUND: $ex5"
          Write-Host "EX5 SIZE: $size bytes"

          if ($size -lt 100
