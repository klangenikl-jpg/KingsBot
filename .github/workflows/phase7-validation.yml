name: King's Bot - Phase 7 Runtime Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  phase7-runtime-validation:
    name: Phase 7 Runtime and Strategy Tester Validation
    runs-on: windows-latest
    timeout-minutes: 40

    steps:

      - name: Checkout King's Bot
        uses: actions/checkout@v4

      - name: Install MT5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          $installRoot = Join-Path $env:RUNNER_TEMP 'KingsBot-MT5'

          Invoke-WebRequest `
            -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' `
            -OutFile $installer `
            -UseBasicParsing

          Remove-Item `
            $installRoot `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Path $installRoot `
            -Force |
            Out-Null

          $installerProcess = Start-Process `
            -FilePath $installer `
            -ArgumentList @(
              '/auto',
              ('/path:' + $installRoot)
            ) `
            -Wait `
            -PassThru

          Write-Host "MT5 installer exit code: $($installerProcess.ExitCode)"

          $terminal = Get-ChildItem `
            $installRoot `
            -Recurse `
            -File `
            -Filter 'terminal64.exe' `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          $metaEditor = Get-ChildItem `
            $installRoot `
            -Recurse `
            -File `
            -Filter 'metaeditor64.exe' `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $terminal) {
            throw 'terminal64.exe was not found after MT5 installation.'
          }

          if (-not $metaEditor) {
            throw 'metaeditor64.exe was not found after MT5 installation.'
          }

          $mt5Root = $terminal.Directory.FullName

          "MT5_ROOT=$mt5Root" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "METAEDITOR=$($metaEditor.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "MT5_TERMINAL=$($terminal.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "MT5_ROOT=$mt5Root"
          Write-Host "METAEDITOR=$($metaEditor.FullName)"
          Write-Host "TERMINAL=$($terminal.FullName)"

      - name: Prepare Phase 7 evidence directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          New-Item `
            -ItemType Directory `
            -Path "$env:GITHUB_WORKSPACE\phase7-validation-evidence" `
            -Force |
            Out-Null

      - name: Locate King's Bot source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Get-ChildItem `
            $env:GITHUB_WORKSPACE `
            -Recurse `
            -File `
            -Filter 'KingsBot_Phase6_Integration.mq5' `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FullName -notmatch '\\.git\\'
            } |
            Select-Object -First 1

          if (-not $source) {
            throw 'KingsBot_Phase6_Integration.mq5 was not found.'
          }

          "KINGSBOT_SOURCE=$($source.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "KingsBot source:"
          Write-Host $source.FullName

      - name: Prepare King's Bot source tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Get-Item $env:KINGSBOT_SOURCE

          $target = Join-Path `
            $env:MT5_ROOT `
            'MQL5\Experts\KingsBot'

          New-Item `
            -ItemType Directory `
            -Path $target `
            -Force |
            Out-Null

          Get-ChildItem `
            $source.Directory.FullName `
            -Recurse `
            -File |
            Where-Object {
              $_.FullName -notmatch '\\.git\\'
            } |
            ForEach-Object {

              $relative = $_.FullName.Substring(
                $source.Directory.FullName.Length
              ).TrimStart('\')

              $destination = Join-Path `
                $target `
                $relative

              $destinationDirectory = Split-Path `
                $destination `
                -Parent

              New-Item `
                -ItemType Directory `
                -Path $destinationDirectory `
                -Force |
                Out-Null

              Copy-Item `
                $_.FullName `
                $destination `
                -Force
            }

          Write-Host "Source tree prepared:"
          Write-Host $target

      - name: Compile King's Bot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $evidence = Join-Path `
            $env:GITHUB_WORKSPACE `
            'phase7-validation-evidence'

          $mq5 = Join-Path `
            $env:MT5_ROOT `
            'MQL5\Experts\KingsBot\KingsBot_Phase6_Integration.mq5'

          $ex5 = Join-Path `
            $env:MT5_ROOT `
            'MQL5\Experts\KingsBot\KingsBot_Phase6_Integration.ex5'

          if (-not (Test-Path $mq5)) {
            throw "MQ5 not found: $mq5"
          }

          Remove-Item `
            $ex5 `
            -Force `
            -ErrorAction SilentlyContinue

          Write-Host "Compiling:"
          Write-Host $mq5

          $compileProcess = Start-Process `
            -FilePath $env:METAEDITOR `
            -ArgumentList @(
              ('/compile:' + $mq5),
              '/log'
            ) `
            -WorkingDirectory `
            (Split-Path $mq5 -Parent) `
            -Wait `
            -PassThru

          Start-Sleep -Seconds 2

          Write-Host "MetaEditor exit code: $($compileProcess.ExitCode)"

          $compileLog = Get-ChildItem `
            (Split-Path $mq5 -Parent) `
            -File `
            -Filter '*.log' `
            -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if ($compileLog) {
            Copy-Item `
              $compileLog.FullName `
              (Join-Path $evidence 'compiler.log') `
              -Force

            Write-Host '===== COMPILER LOG ====='
            Get-Content $compileLog.FullName
            Write-Host '========================'
          }

          if (-not (Test-Path $ex5)) {
            throw 'Compilation did not produce KingsBot_Phase6_Integration.ex5.'
          }

          if ((Get-Item $ex5).Length -le 0) {
            throw 'Generated EX5 is empty.'
          }

          Copy-Item `
            $ex5 `
            $evidence `
            -Force

          Write-Host "EX5 verified:"
          Write-Host $ex5

      - name: Initialize MT5 portable environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host '===== INITIALIZING MT5 ====='

          $initProcess = Start-Process `
            -FilePath $env:MT5_TERMINAL `
            -ArgumentList @('/portable') `
            -WorkingDirectory $env:MT5_ROOT `
            -PassThru

          Write-Host "Initialization PID: $($initProcess.Id)"

          Start-Sleep -Seconds 15

          if (-not $initProcess.HasExited) {
            Stop-Process `
              -Id $initProcess.Id `
              -Force `
              -ErrorAction SilentlyContinue
          }

          Start-Sleep -Seconds 3

          Write-Host 'MT5 portable environment initialized.'

      - name: Verify EA location
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $ex5 = Join-Path `
            $env:MT5_ROOT `
            'MQL5\Experts\KingsBot\KingsBot_Phase6_Integration.ex5'

          if (-not (Test-Path $ex5)) {
            throw "Expected EA was not found: $ex5"
          }

          Write-Host '===== EA LOCATION ====='
          Write-Host $ex5
          Write-Host "Size: $((Get-Item $ex5).Length) bytes"
          Write-Host '======================='

      - name: Create Strategy Tester configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $evidence = Join-Path `
            $env:GITHUB_WORKSPACE `
            'phase7-validation-evidence'

          $config = Join-Path `
            $env:MT5_ROOT `
            'KingsBot_Phase7_Tester.ini'

          $lines = @(
            '[Tester]'
            'Expert=KingsBot\KingsBot_Phase6_Integration.ex5'
            'Symbol=EURUSD'
            'Period=M15'
            'Model=1'
            'Optimization=0'
            'OptimizationCriterion=0'
            'FromDate=2026.01.01'
            'ToDate=2026.08.01'
            'ForwardMode=0'
            'Deposit=10000'
            'Currency=USD'
            'Leverage=1:100'
            'ExecutionMode=0'
            'UseLocal=1'
            'UseRemote=0'
            'UseCloud=0'
            'Visual=0'
            'Report=KingsBot_Phase7_Tester'
            'ReplaceReport=1'
            'ShutdownTerminal=1'
          )

          [System.IO.File]::WriteAllLines(
            $config,
            $lines,
            [System.Text.UnicodeEncoding]::new($false,$true)
          )

          Copy-Item `
            $config `
            (Join-Path $evidence 'KingsBot_Phase7_Tester.ini') `
            -Force

          Write-Host '===== FINAL TESTER CONFIG ====='
          Get-Content $config
          Write-Host '================================'

      - name: Verify tester configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $config = Join-Path `
            $env:MT5_ROOT `
            'KingsBot_Phase7_Tester.ini'

          $expected = 'Expert=KingsBot\KingsBot_Phase6_Integration.ex5'

          $text = Get-Content `
            $config `
            -Raw

          if ($text -notmatch [regex]::Escape($expected)) {
            throw "Tester Expert path is incorrect. Expected: $expected"
          }

          Write-Host 'Tester Expert path is CORRECT.'
          Write-Host $expected

      - name: Launch Phase 7 Strategy Tester
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $evidence = Join-Path `
            $env:GITHUB_WORKSPACE `
            'phase7-validation-evidence'

          $config = Join-Path `
            $env:MT5_ROOT `
            'KingsBot_Phase7_Tester.ini'

          Write-Host '======================================'
          Write-Host 'KING''S BOT PHASE 7 TESTER'
          Write-Host '======================================'
          Write-Host "Terminal: $env:MT5_TERMINAL"
          Write-Host "Config:   $config"
          Write-Host 'Expert:   KingsBot\KingsBot_Phase6_Integration.ex5'
          Write-Host 'Symbol:   EURUSD'
          Write-Host 'Period:   M15'
          Write-Host 'Model:    1 Minute OHLC'
          Write-Host '======================================'

          $process = Start-Process `
            -FilePath $env:MT5_TERMINAL `
            -ArgumentList @(
              '/portable',
              ('/config:' + $config)
            ) `
            -WorkingDirectory $env:MT5_ROOT `
            -PassThru

          Write-Host "MT5 PID: $($process.Id)"

          $deadline = (Get-Date).AddMinutes(15)
          $report = $null

          while ((Get-Date) -lt $deadline) {

            $reports = Get-ChildItem `
              $env:MT5_ROOT `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.BaseName -eq 'KingsBot_Phase7_Tester' -and
                $_.Extension -in '.htm','.html','.xml'
              } |
              Sort-Object LastWriteTime -Descending

            if ($reports) {
              $report = $reports | Select-Object -First 1
              break
            }

            if ($process.HasExited) {
              Write-Host 'MT5 exited.'
              Write-Host "Exit code: $($process.ExitCode)"
              break
            }

            Write-Host 'Strategy Tester running...'
            Start-Sleep -Seconds 5
          }

          if (-not $report) {
            $exitCode = $null

            if ($process.HasExited) {
              $exitCode = $process.ExitCode
            }

            Write-Host "MT5 exit code: $exitCode"
            throw 'Phase 7 Strategy Tester did not produce a report.'
          }

          Write-Host '======================================'
          Write-Host 'PHASE 7 TESTER REPORT FOUND'
          Write-Host $report.FullName
          Write-Host "Size: $($report.Length) bytes"
          Write-Host '======================================'

          Copy-Item `
            $report.FullName `
            (Join-Path $evidence $report.Name) `
            -Force

      - name: Capture MT5 diagnostics
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $evidence = Join-Path `
            $env:GITHUB_WORKSPACE `
            'phase7-validation-evidence'

          Write-Host '===== MT5 LOG FILES ====='

          Get-ChildItem `
            $env:MT5_ROOT `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Extension -in '.log','.htm','.html','.xml','.ini'
            } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 300 |
            ForEach-Object {

              Write-Host $_.FullName

              $safeName = $_.FullName.Substring(
                $env:MT5_ROOT.Length
              ).TrimStart('\') -replace '[\\/:*?"<>|]', '_'

              Copy-Item `
                $_.FullName `
                (Join-Path $evidence $safeName) `
                -Force `
                -ErrorAction SilentlyContinue
            }

          Write-Host '===== WINDOWS APPLICATION ERRORS ====='

          try {
            Get-WinEvent `
              -FilterHashtable @{
                LogName = 'Application'
                StartTime = (Get-Date).AddMinutes(-30)
              } `
              -ErrorAction Stop |
              Where-Object {
                $_.Message -match 'terminal64|metatester|metaquotes'
              } |
              Select-Object -First 50 |
              Format-List `
                TimeCreated,
                ProviderName,
                Id,
                Message |
              Out-String |
              Set-Content `
                (Join-Path $evidence 'windows-mt5-errors.txt') `
                -Encoding UTF8
          }
          catch {
            "Event collection unavailable: $($_.Exception.Message)" |
              Set-Content `
              (Join-Path $evidence 'windows-mt5-errors.txt') `
              -Encoding UTF8
          }

      - name: Upload Phase 7 validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-Phase7-Runtime-Validation
          path: phase7-validation-evidence
          if-no-files-found: warn
          retention-days: 14
