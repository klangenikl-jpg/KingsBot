name: King's Bot - Phase 7 Runtime Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase7-runtime-validation:
    name: Phase 7 Runtime and Strategy Tester Validation
    runs-on: windows-2022
    timeout-minutes: 60

    steps:

      - name: Checkout King's Bot
        uses: actions/checkout@v4

      - name: Create Phase 7 artifact directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $artifactRoot = Join-Path $env:GITHUB_WORKSPACE 'phase7-artifacts'

          New-Item `
            -ItemType Directory `
            -Path $artifactRoot `
            -Force |
            Out-Null

          Set-Content `
            -Path (Join-Path $artifactRoot 'phase7-start.txt') `
            -Value "Phase 7 started: $(Get-Date -Format o)" `
            -Encoding UTF8

      - name: Verify King's Bot source tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $required = @(
            'KingsBot_Phase6_Integration.mq5',
            'KB_StrategySignal.mqh',
            'KingsBot_Strategy_Swing.mqh',
            'KingsBot_Strategy_Structure.mqh',
            'KingsBot_Strategy_Liquidity.mqh',
            'KingsBot_Strategy_OrderBlock.mqh',
            'KingsBot_Strategy_FVG.mqh',
            'KingsBot_DecisionEngine.mqh',
            'KingsBot_RiskManager.mqh'
          )

          $missing = @()

          foreach ($name in $required) {
            $path = Join-Path $env:GITHUB_WORKSPACE $name

            if (-not (Test-Path $path)) {
              $missing += $name
            }
            else {
              Write-Host "FOUND: $name"
            }
          }

          if ($missing.Count -gt 0) {
            throw "Required King's Bot source files are missing: $($missing -join ', ')"
          }

          Copy-Item `
            (Join-Path $env:GITHUB_WORKSPACE 'KingsBot_Phase6_Integration.mq5') `
            (Join-Path $env:GITHUB_WORKSPACE 'phase7-artifacts\KingsBot_Phase6_Integration.mq5') `
            -Force

      - name: Verify Windows environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, BuildNumber, OSArchitecture |
            Format-List |
            Out-File `
              "$env:GITHUB_WORKSPACE\phase7-artifacts\windows-environment.txt" `
              -Encoding UTF8

      - name: Verify MetaQuotes network
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Resolve-DnsName `
            download.mql5.com `
            -ErrorAction Stop |
            Select-Object -First 10 |
            Out-File `
              "$env:GITHUB_WORKSPACE\phase7-artifacts\metaquotes-dns.txt" `
              -Encoding UTF8

          $test = Test-NetConnection `
            download.mql5.com `
            -Port 443 `
            -WarningAction SilentlyContinue

          $test |
            Format-List |
            Out-File `
              "$env:GITHUB_WORKSPACE\phase7-artifacts\metaquotes-network.txt" `
              -Encoding UTF8

          if (-not $test.TcpTestSucceeded) {
            throw 'HTTPS connection to download.mql5.com failed.'
          }

      - name: Download and validate MT5 installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path `
            $env:RUNNER_TEMP `
            'mt5setup.exe'

          $url = 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe'

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer `
            -UseBasicParsing `
            -TimeoutSec 180

          if (-not (Test-Path $installer)) {
            throw 'MT5 installer was not downloaded.'
          }

          $file = Get-Item $installer

          if ($file.Length -lt 100000) {
            throw "MT5 installer is unexpectedly small: $($file.Length) bytes"
          }

          $hash = Get-FileHash `
            $installer `
            -Algorithm SHA256

          $signature = Get-AuthenticodeSignature `
            $installer

          "URL=$url" |
            Set-Content `
              "$env:GITHUB_WORKSPACE\phase7-artifacts\mt5-installer.txt" `
              -Encoding UTF8

          "SizeBytes=$($file.Length)" |
            Add-Content `
              "$env:GITHUB_WORKSPACE\phase7-artifacts\mt5-installer.txt"

          "SHA256=$($hash.Hash)" |
            Add-Content `
              "$env:GITHUB_WORKSPACE\phase7-artifacts\mt5-installer.txt"

          "SignatureStatus=$($signature.Status)" |
            Add-Content `
              "$env:GITHUB_WORKSPACE\phase7-artifacts\mt5-installer.txt"

          if ($signature.Status -ne 'Valid') {
            throw "MT5 installer signature is not valid: $($signature.Status)"
          }

          Add-Content `
            -Path $env:GITHUB_ENV `
            -Value "MT5_INSTALLER=$installer"

          Write-Host "MT5 installer validated: $($file.Length) bytes"

      - name: Install MT5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = $env:MT5_INSTALLER

          if (-not (Test-Path $installer)) {
            throw "MT5 installer not found: $installer"
          }

          $mt5Root = Join-Path `
            $env:RUNNER_TEMP `
            'KingsBot-MT5'

          Remove-Item `
            $mt5Root `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Path $mt5Root `
            -Force |
            Out-Null

          $start = Get-Date

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList @(
              '/auto',
              "/path:$mt5Root"
            ) `
            -WorkingDirectory $env:RUNNER_TEMP `
            -Wait `
            -PassThru
