name: King's Bot - Phase 7 Runtime Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase7:
    name: Phase 7 Runtime and Strategy Tester
    runs-on: windows-2025
    timeout-minutes: 35

    env:
      MT5_DIR: C:\MT5
      BOT_SOURCE_NAME: KingsBot_Phase6_Integration.mq5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Initialize evidence
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $E = Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence'
          New-Item -ItemType Directory -Path $E -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $E 'MT5-Logs') -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $E 'Tester-Logs') -Force | Out-Null
          "Phase 7 evidence started: $(Get-Date -Format o)" | Set-Content (Join-Path $E 'PHASE7-EVIDENCE-STARTED.txt')

      - name: Locate source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Get-ChildItem $env:GITHUB_WORKSPACE -Filter $env:BOT_SOURCE_NAME -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $src) { throw "Source not found: $env:BOT_SOURCE_NAME" }
          "Source=$($src.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8
          "Source: $($src.FullName)" | Set-Content (Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence\source.txt')

      - name: Install MT5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          Invoke-WebRequest 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' -OutFile $installer -UseBasicParsing
          New-Item -ItemType Directory -Path $env:MT5_DIR -Force | Out-Null
          $p = Start-Process $installer -ArgumentList "/auto","/path:$env:MT5_DIR" -Wait -PassThru
          "Installer exit code: $($p.ExitCode)" | Set-Content (Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence\installer.txt')

          $terminal = Get-ChildItem $env:MT5_DIR -Filter terminal64.exe -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          $editor = Get-ChildItem $env:MT5_DIR -Filter metaeditor64.exe -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1

          if ($null -eq $terminal) { throw 'terminal64.exe not found.' }
          if ($null -eq $editor) { throw 'metaeditor64.exe not found.' }

          "MT5_TERMINAL=$($terminal.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8
          "METAEDITOR=$($editor.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8

      - name: Prepare EA
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $expertDir = Join-Path $env:MT5_DIR 'MQL5\Experts\KingsBot'
          New-Item -ItemType Directory -Path $expertDir -Force | Out-Null
          $root = Split-Path $env:Source -Parent
          Copy-Item (Join-Path $root '*') $expertDir -Recurse -Force
          $ea = Join-Path $expertDir $env:BOT_SOURCE_NAME
          if (-not (Test-Path $ea)) { throw "EA source missing: $ea" }
          "EXPERT_DIR=$expertDir" | Out-File $env:GITHUB_ENV -Encoding utf8
          "EXPERT_SOURCE=$ea" | Out-File $env:GITHUB_ENV -Encoding utf8

      - name: Compile EA
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $log = Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence\compile.log'
          $p = Start-Process $env:METAEDITOR -ArgumentList "/portable","/compile:$env:EXPERT_SOURCE","/log:$log" -WorkingDirectory $env:MT5_DIR -Wait -PassThru
          "MetaEditor exit code: $($p.ExitCode)" | Set-Content (Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence\compile-result.txt')

          if (Test-Path $log) {
            Copy-Item $log (Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence\compile.log') -Force
          }

          $ex5 = Get-ChildItem $env:EXPERT_DIR -Filter 'KingsBot_Phase6_Integration.ex5' -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $ex5) {
            throw "EX5 was not produced. MetaEditor exit code: $($p.ExitCode)"
          }

          Copy-Item $ex5.FullName (Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence\KingsBot_Phase6_Integration.ex5') -Force

      - name: Create tester configuration
        shell: powershell
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $config = Join-Path $env:MT5_DIR 'KingsBot_Phase7_Tester.ini'

          @(
            '[Common]'
            "Login=$env:MT5_LOGIN"
            "Password=$env:MT5_PASSWORD"
            "Server=$env:MT5_SERVER"
            ''
            '[Tester]'
            'Expert=KingsBot\KingsBot_Phase6_Integration.ex5'
            'Symbol=EURUSD'
            'Period=M15'
            'Model=0'
            'Optimization=0'
            'FromDate=2025.01.01'
            'ToDate=2026.08.01'
            'ForwardMode=0'
            'Deposit=10000'
            'Currency=USD'
            'Leverage=100'
            'Visual=0'
            'UseCloud=0'
            'ReplaceReport=1'
            'ShutdownTerminal=1'
            'Report=Reports\KingsBot_Phase7_Tester.htm'
          ) | Set-Content $config -Encoding ASCII

          Copy-Item $config (Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence\Tester-Config.ini') -Force

      - name: Run Strategy Tester
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $report = Join-Path $env:MT5_DIR 'Reports\KingsBot_Phase7_Tester.htm'
          Remove-Item $report -Force -ErrorAction SilentlyContinue

          $p = Start-Process $env:MT5_TERMINAL -ArgumentList '/portable',"/config:$env:MT5_DIR\KingsBot_Phase7_Tester.ini" -WorkingDirectory $env:MT5_DIR -PassThru

          $elapsed = 0
          $found = $false

          while ($elapsed -lt 1200) {
            Start-Sleep 10
            $elapsed += 10
            $r = Get-Item $report -ErrorAction SilentlyContinue

            if ($null -ne $r -and $r.Length -gt 1000) {
              $found = $true
              break
            }

            Write-Host "Tester running: $elapsed seconds"
          }

          "Elapsed seconds: $elapsed" | Set-Content (Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence\tester-result.txt')

          if ($found) {
            Copy-Item $report (Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence\KingsBot_Phase7_Tester.htm') -Force
          }
          else {
            throw 'Strategy Tester report was not produced.'
          }

      - name: Collect evidence
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $E = Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence'

          if (Test-Path $env:MT5_DIR) {
            Get-ChildItem $env:MT5_DIR -File -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.Extension -in '.log','.htm','.html','.xml' } |
              Select-Object -First 100 |
              ForEach-Object {
                Copy-Item $_.FullName (Join-Path $E 'MT5-Logs') -Force -ErrorAction SilentlyContinue
              }
          }

          Get-ChildItem $E -File -Recurse -ErrorAction SilentlyContinue |
            ForEach-Object { "$($_.FullName) | $($_.Length) bytes" } |
            Set-Content (Join-Path $E 'evidence-inventory.txt')

      - name: Stop MT5
        if: always()
        shell: powershell
        run: |
          Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process metatester64 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process metaeditor64 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Create evidence ZIP
        if: always()
        shell: powershell
        run: |
          $E = Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence'
          $Z = Join-Path $env:GITHUB_WORKSPACE 'KingsBot-Phase7-Evidence.zip'

          if (-not (Test-Path $E)) {
            New-Item -ItemType Directory -Path $E -Force | Out-Null
          }

          if ((Get-ChildItem $E -File -Recurse -ErrorAction SilentlyContinue).Count -eq 0) {
            'No evidence was produced.' | Set-Content (Join-Path $E 'NO-EVIDENCE.txt')
          }

          Remove-Item $Z -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path (Join-Path $E '*') -DestinationPath $Z -Force

      - name: Upload Phase 7 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-Phase7-Evidence-${{ github.run_number }}
          path: |
            phase7-evidence
            KingsBot-Phase7-Evidence.zip
          if-no-files-found: warn
          retention-days: 14
