name: King's Bot - Phase 7 Runtime Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase7:
    name: Phase 7 Runtime and Strategy Tester
    runs-on: windows-2025
    timeout-minutes: 35

    env:
      MT5_DIR: C:\MT5
      BOT_SOURCE_NAME: KingsBot_Phase6_Integration.mq5
      EX5_NAME: KingsBot_Phase6_Integration.ex5

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Initialize Phase 7 evidence
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $evidence = Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence'

          Remove-Item -LiteralPath $evidence -Recurse -Force -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $evidence 'MT5-Logs') -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $evidence 'Tester-Logs') -Force | Out-Null

          @(
            "King's Bot Phase 7 Evidence"
            "Repository: $env:GITHUB_REPOSITORY"
            "Run: $env:GITHUB_RUN_NUMBER"
            "Started: $(Get-Date -Format o)"
          ) | Set-Content `
            -LiteralPath (Join-Path $evidence 'PHASE7-EVIDENCE-STARTED.txt') `
            -Encoding UTF8

      - name: Locate King's Bot source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter $env:BOT_SOURCE_NAME `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $source) {
            throw "Source not found: $env:BOT_SOURCE_NAME"
          }

          Write-Host "Source found: $($source.FullName)"

          "BOT_SOURCE=$($source.FullName)" |
            Out-File $env:GITHUB_ENV -Encoding utf8

          @(
            "Source: $($source.FullName)"
            "Size: $($source.Length) bytes"
          ) | Set-Content `
            -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence\source.txt') `
            -Encoding UTF8

      - name: Download MetaTrader 5 installer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'

          Invoke-WebRequest `
            -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' `
            -OutFile $installer `
            -UseBasicParsing `
            -TimeoutSec 180

          if (-not (Test-Path -LiteralPath $installer)) {
            throw 'MT5 installer was not downloaded.'
          }

          Write-Host "Installer downloaded: $installer"

          "MT5_INSTALLER=$installer" |
            Out-File $env:GITHUB_ENV -Encoding utf8

          "Installer: $installer" |
            Set-Content `
              -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence\installer.txt') `
              -Encoding UTF8

      - name: Install MetaTrader 5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Remove-Item `
            -LiteralPath $env:MT5_DIR `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Path $env:MT5_DIR `
            -Force |
            Out-Null

          Write-Host "Installing MT5 into $env:MT5_DIR"

          $process = Start-Process `
            -FilePath $env:MT5_INSTALLER `
            -ArgumentList @(
              '/auto'
              "/path:$env:MT5_DIR"
            ) `
            -Wait `
            -PassThru

          Write-Host "MT5 installer exit code: $($process.ExitCode)"

          @(
            "Installer exit code: $($process.ExitCode)"
            "Requested install directory: $env:MT5_DIR"
          ) | Set-Content `
            -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence\installer-result.txt') `
            -Encoding UTF8

          Start-Sleep -Seconds 5

          Write-Host 'Searching for terminal64.exe...'

          $terminal = Get-ChildItem `
            -Path $env:MT5_DIR `
            -Filter 'terminal64.exe' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $terminal) {
            Write-Host 'terminal64.exe was not found under C:\MT5.'
            Write-Host 'Searching runner locations...'

            $searchRoots = @(
              'C:\Program Files\MetaTrader 5'
              'C:\Program Files\MetaTrader 5 Terminal'
              'C:\Program Files (x86)\MetaTrader 5'
              'C:\Program Files (x86)\MetaTrader 5 Terminal'
              "$env:APPDATA\MetaQuotes\Terminal"
              "$env:LOCALAPPDATA\Programs"
            )

            foreach ($root in $searchRoots) {
              if (Test-Path -LiteralPath $root) {
                $terminal = Get-ChildItem `
                  -Path $root `
                  -Filter 'terminal64.exe' `
                  -File `
                  -Recurse `
                  -ErrorAction SilentlyContinue |
                  Select-Object -First 1

                if ($null -ne $terminal) {
                  break
                }
              }
            }
          }

          if ($null -eq $terminal) {
            Write-Host '===== terminal64.exe SEARCH FAILURE ====='

            Get-ChildItem `
              -Path 'C:\' `
              -Filter 'terminal64.exe' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 50 |
              ForEach-Object {
                Write-Host $_.FullName
              }

            throw 'terminal64.exe could not be located after MT5 installation.'
          }

          Write-Host "MT5 TERMINAL FOUND:"
          Write-Host $terminal.FullName

          $terminalPath = $terminal.FullName

          "MT5_TERMINAL=$terminalPath" |
            Out-File $env:GITHUB_ENV -Encoding utf8

          "Terminal: $terminalPath" |
            Set-Content `
              -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence\mt5-terminal.txt') `
              -Encoding UTF8

          Write-Host 'Searching for metaeditor64.exe...'

          $editor = Get-ChildItem `
            -Path $env:MT5_DIR `
            -Filter 'metaeditor64.exe' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $editor) {
            $editor = Get-ChildItem `
              -Path (Split-Path $terminalPath -Parent) `
              -Filter 'metaeditor64.exe' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }

          if ($null -eq $editor) {
            throw 'metaeditor64.exe could not be located.'
          }

          Write-Host "METAEDITOR FOUND:"
          Write-Host $editor.FullName

          "METAEDITOR=$($editor.FullName)" |
            Out-File $env:GITHUB_ENV -Encoding utf8

          @(
            "Terminal: $terminalPath"
            "MetaEditor: $($editor.FullName)"
          ) | Set-Content `
            -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence\mt5-paths.txt') `
            -Encoding UTF8

      - name: Prepare King's Bot
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $expertDir = Join-Path `
            $env:MT5_DIR `
            'MQL5\Experts\KingsBot'

          New-Item `
            -ItemType Directory `
            -Path $expertDir `
            -Force |
            Out-Null

          $sourceRoot = Split-Path `
            $env:BOT_SOURCE `
            -Parent

          Copy-Item `
            -Path (Join-Path $sourceRoot '*') `
            -Destination $expertDir `
            -Recurse `
            -Force

          $expertSource = Join-Path `
            $expertDir `
            $env:BOT_SOURCE_NAME

          if (-not (Test-Path -LiteralPath $expertSource)) {
            throw "EA source was not copied: $expertSource"
          }

          "EXPERT_DIR=$expertDir" |
            Out-File $env:GITHUB_ENV -Encoding utf8

          "EXPERT_SOURCE=$expertSource" |
            Out-File $env:GITHUB_ENV -Encoding utf8

          @(
            "Expert directory: $expertDir"
            "Expert source: $expertSource"
          ) | Set-Content `
            -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence\expert-paths.txt') `
            -Encoding UTF8

      - name: Compile King's Bot
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'

          $evidence = Join-Path `
            $env:GITHUB_WORKSPACE `
            'phase7-evidence'

          $compileLog = Join-Path `
            $env:RUNNER_TEMP `
            'KingsBot-MetaEditor.log'

          if ([string]::IsNullOrWhiteSpace($env:METAEDITOR)) {
            throw 'METAEDITOR environment variable is empty.'
          }

          if (-not (Test-Path -LiteralPath $env:METAEDITOR)) {
            throw "MetaEditor executable does not exist: $env:METAEDITOR"
          }

          if (-not (Test-Path -LiteralPath $env:EXPERT_SOURCE)) {
            throw "EA source does not exist: $env:EXPERT_SOURCE"
          }

          Write-Host "MetaEditor: $env:METAEDITOR"
          Write-Host "Expert source: $env:EXPERT_SOURCE"

          $process = Start-Process `
            -FilePath $env:METAEDITOR `
            -ArgumentList @(
              '/portable'
              "/compile:$env:EXPERT_SOURCE"
              "/log:$compileLog"
            ) `
            -WorkingDirectory $env:MT5_DIR `
            -Wait `
            -PassThru `
            -NoNewWindow

          Write-Host "MetaEditor process exit code: $($process.ExitCode)"

          if (Test-Path -LiteralPath $compileLog) {
            Copy-Item `
              -LiteralPath $compileLog `
              -Destination (Join-Path $evidence 'compile.log') `
              -Force

            Write-Host '========== METAEDITOR OUTPUT =========='
            Get-Content -LiteralPath $compileLog
            Write-Host '========================================'
          }
          else {
            'MetaEditor did not create a compile log.' |
              Set-Content `
                -LiteralPath (Join-Path $evidence 'compile.log') `
                -Encoding UTF8
          }

          @(
            "MetaEditor process exit code: $($process.ExitCode)"
            "Compile log: $compileLog"
          ) | Set-Content `
            -LiteralPath (Join-Path $evidence 'compile-result.txt') `
            -Encoding UTF8

          Start-Sleep -Seconds 3

          $ex5 = Get-ChildItem `
            -Path $env:MT5_DIR `
            -Filter $env:EX5_NAME `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if ($null -eq $ex5) {
            Start-Sleep -Seconds 5

            $ex5 = Get-ChildItem `
              -Path $env:MT5_DIR `
              -Filter $env:EX5_NAME `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1
          }

          if ($null -eq $ex5) {
            Write-Host '===== ALL EX5 FILES FOUND ====='

            Get-ChildItem `
              -Path $env:MT5_DIR `
              -Filter '*.ex5' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 100 |
              ForEach-Object {
                Write-Host "$($_.FullName) | $($_.Length) bytes | $($_.LastWriteTime)"
              }

            Write-Host '===== END EX5 SEARCH ====='

            throw "Compilation completed but $env:EX5_NAME was not found."
          }

          Write-Host "EX5 FOUND: $($ex5.FullName)"
          Write-Host "EX5 SIZE: $($ex5.Length) bytes"

          @(
            "EX5 found: $($ex5.FullName)"
            "Size: $($ex5.Length) bytes"
            "LastWriteTime: $($ex5.LastWriteTime)"
          ) | Set-Content `
            -LiteralPath (Join-Path $evidence 'ex5-result.txt') `
            -Encoding UTF8

          Copy-Item `
            -LiteralPath $ex5.FullName `
            -Destination (Join-Path $evidence $env:EX5_NAME) `
            -Force

      - name: Create Strategy Tester configuration
        shell: powershell
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:MT5_LOGIN)) {
            throw 'MT5_LOGIN secret is empty.'
          }

          if ([string]::IsNullOrWhiteSpace($env:MT5_SERVER)) {
            throw 'MT5_SERVER secret is empty.'
          }

          if ([string]::IsNullOrWhiteSpace($env:MT5_PASSWORD)) {
            throw 'MT5_PASSWORD secret is empty.'
          }

          $config = Join-Path `
            $env:MT5_DIR `
            'KingsBot_Phase7_Tester.ini'

          $reportsDir = Join-Path `
            $env:MT5_DIR `
            'Reports'

          New-Item `
            -ItemType Directory `
            -Path $reportsDir `
            -Force |
            Out-Null

          @(
            '[Common]'
            "Login=$env:MT5_LOGIN"
            "Password=$env:MT5_PASSWORD"
            "Server=$env:MT5_SERVER"
            'KeepPrivate=0'
            ''
            '[Tester]'
            "Login=$env:MT5_LOGIN"
            "Password=$env:MT5_PASSWORD"
            "Server=$env:MT5_SERVER"
            'Expert=KingsBot\KingsBot_Phase6_Integration.ex5'
            'Symbol=EURUSD'
            'Period=M15'
            'Model=0'
            'Optimization=0'
            'FromDate=2025.01.01'
            'ToDate=2026.08.01'
            'ForwardMode=0'
            'Deposit=10000'
            'Currency=USD'
            'Leverage=100'
            'Visual=0'
            'UseCloud=0'
            'ReplaceReport=1'
            'ShutdownTerminal=1'
            'Report=Reports\KingsBot_Phase7_Tester.htm'
          ) | Set-Content `
            -LiteralPath $config `
            -Encoding ASCII

          Copy-Item `
            -LiteralPath $config `
            -Destination (Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence\Tester-Config.ini') `
            -Force

          Write-Host "Tester configuration created:"
          Write-Host $config

      - name: Run Strategy Tester
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host '========== PHASE 7 TESTER START =========='

          $terminal = $null

          if (-not [string]::IsNullOrWhiteSpace($env:MT5_TERMINAL)) {
            if (Test-Path -LiteralPath $env:MT5_TERMINAL) {
              $terminal = Get-Item -LiteralPath $env:MT5_TERMINAL
            }
          }

          if ($null -eq $terminal) {
            Write-Host 'MT5_TERMINAL variable was unavailable or invalid.'
            Write-Host 'Rediscovering terminal64.exe directly...'

            $terminal = Get-ChildItem `
              -Path $env:MT5_DIR `
              -Filter 'terminal64.exe' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }

          if ($null -eq $terminal) {
            throw 'CRITICAL: terminal64.exe could not be located before Strategy Tester launch.'
          }

          $terminalPath = $terminal.FullName

          Write-Host "Verified MT5 executable:"
          Write-Host $terminalPath

          $config = Join-Path `
            $env:MT5_DIR `
            'KingsBot_Phase7_Tester.ini'

          if (-not (Test-Path -LiteralPath $config)) {
            throw "Tester configuration does not exist: $config"
          }

          $report = Join-Path `
            $env:MT5_DIR `
            'Reports\KingsBot_Phase7_Tester.htm'

          $reportDir = Split-Path `
            $report `
            -Parent

          New-Item `
            -ItemType Directory `
            -Path $reportDir `
            -Force |
            Out-Null

          Remove-Item `
            -LiteralPath $report `
            -Force `
            -ErrorAction SilentlyContinue

          Write-Host "Terminal executable: $terminalPath"
          Write-Host "Tester config: $config"
          Write-Host "Expected report: $report"

          Write-Host 'Launching MT5...'

          $process = Start-Process `
            -FilePath $terminalPath `
            -ArgumentList @(
              '/portable'
              "/config:$config"
            ) `
            -WorkingDirectory $env:MT5_DIR `
            -PassThru

          if ($null -eq $process) {
            throw 'CRITICAL: Start-Process returned no process object.'
          }

          if ($process.Id -le 0) {
            throw "CRITICAL: MT5 returned an invalid process ID: $($process.Id)"
          }

          Write-Host "Tester MT5 PID: $($process.Id)"

          $elapsed = 0
          $found = $false

          while ($elapsed -lt 1200) {
            Start-Sleep -Seconds 10
            $elapsed += 10

            $result = Get-Item `
              -LiteralPath $report `
              -ErrorAction SilentlyContinue

            if ($null -ne $result -and $result.Length -gt 1000) {
              $found = $true
              Write-Host "Tester report found after $elapsed seconds."
              Write-Host "Report size: $($result.Length) bytes"
              break
            }

            if ($process.HasExited) {
              Write-Host "MT5 exited with code: $($process.ExitCode)"

              if (-not (Test-Path -LiteralPath $report)) {
                Write-Host 'MT5 exited before producing the expected report.'
                break
              }
            }
            else {
              Write-Host "Tester running: $elapsed seconds"
            }
          }

          @(
            "Terminal: $terminalPath"
            "PID: $($process.Id)"
            "Elapsed seconds: $elapsed"
            "MT5 exited: $($process.HasExited)"
            "MT5 exit code: $(if ($process.HasExited) { $process.ExitCode } else { 'RUNNING' })"
            "Expected report: $report"
            "Report exists: $(Test-Path -LiteralPath $report)"
          ) | Set-Content `
            -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence\tester-result.txt') `
            -Encoding UTF8

          if (-not $found) {
            Write-Host '===== MT5 PROCESS DIAGNOSTICS ====='

            Get-Process `
              -Name 'terminal64' `
              -ErrorAction SilentlyContinue |
              Select-Object Id, ProcessName, Path, StartTime |
              Format-List

            Write-Host '===== REPORT SEARCH ====='

            Get-ChildItem `
              -Path $env:MT5_DIR `
              -Filter '*.htm' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 50 |
              ForEach-Object {
                Write-Host "$($_.FullName) | $($_.Length) bytes | $($_.LastWriteTime)"
              }

            Write-Host '===== END DIAGNOSTICS ====='

            throw 'Strategy Tester report was not produced.'
          }

          Copy-Item `
            -LiteralPath $report `
            -Destination (Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence\KingsBot_Phase7_Tester.htm') `
            -Force

          Write-Host '========== PHASE 7 TESTER SUCCESS =========='

      - name: Collect final evidence
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'

          $evidence = Join-Path `
            $env:GITHUB_WORKSPACE `
            'phase7-evidence'

          if (-not (Test-Path -LiteralPath $evidence)) {
            New-Item `
              -ItemType Directory `
              -Path $evidence `
              -Force |
              Out-Null
          }

          @(
            "King's Bot Phase 7 Evidence Collection"
            "Collected: $(Get-Date -Format o)"
            "Repository: $env:GITHUB_REPOSITORY"
            "Run: $env:GITHUB_RUN_NUMBER"
          ) | Set-Content `
            -LiteralPath (Join-Path $evidence 'PHASE7-EVIDENCE-END.txt') `
            -Encoding UTF8

          Write-Host '========== FINAL MT5 FILE CHECK =========='

          if (Test-Path -LiteralPath $env:MT5_DIR) {
            Get-ChildItem `
              -Path $env:MT5_DIR `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object FullName, Length, LastWriteTime |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 200 |
              Format-Table -AutoSize
          }

          Write-Host '========== FINAL PROCESS CHECK =========='

          Get-Process `
            -Name 'terminal64' `
            -ErrorAction SilentlyContinue |
            Select-Object Id, ProcessName, Path, StartTime |
            Format-List

      - name: Upload Phase 7 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kingsbot-phase7-evidence
          path: phase7-evidence
          if-no-files-found: warn
          retention-days: 14
