name: King's Bot - Phase 7 Runtime Validation

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  MT5_DIR: C:\MT5
  BOT_SOURCE_NAME: KingsBot_Phase6_Integration.mq5
  TEST_SYMBOL: EURUSD
  TEST_PERIOD: M15
  TEST_FROM: 2024.01.02
  TEST_TO: 2024.08.20

jobs:
  phase7:
    name: Phase 7 Runtime and Strategy Tester
    runs-on: windows-2025
    timeout-minutes: 35

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      # ------------------------------------------------------------
      # CREATE EVIDENCE FIRST.
      # Everything after this point can fail and the artifact
      # upload will still have a real directory to upload.
      # ------------------------------------------------------------
      - name: Initialize Phase 7 evidence
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $evidence = Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence'

          Remove-Item $evidence -Recurse -Force -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $evidence 'MT5-Logs') -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $evidence 'Tester-Logs') -Force | Out-Null

          @(
            "King's Bot Phase 7 Evidence"
            "Repository: $env:GITHUB_REPOSITORY"
            "Workflow: $env:GITHUB_WORKFLOW"
            "Run: $env:GITHUB_RUN_NUMBER"
            "Started: $(Get-Date -Format o)"
          ) | Set-Content `
            -LiteralPath (Join-Path $evidence 'PHASE7-EVIDENCE-STARTED.txt') `
            -Encoding UTF8

          Write-Host "Evidence directory: $evidence"

      - name: Locate King's Bot source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter $env:BOT_SOURCE_NAME `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $source) {
            throw "Could not find $env:BOT_SOURCE_NAME"
          }

          Write-Host "Source found: $($source.FullName)"

          Copy-Item `
            -LiteralPath $source.FullName `
            -Destination (Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence\source-located.txt') `
            -Force

          @(
            "Source: $($source.FullName)"
            "Size: $($source.Length) bytes"
          ) | Set-Content `
            -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence\source-info.txt') `
            -Encoding UTF8

          "BOT_SOURCE=$($source.FullName)" |
            Out-File $env:GITHUB_ENV -Encoding utf8

      - name: Download MetaTrader 5 installer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'

          Invoke-WebRequest `
            -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' `
            -OutFile $installer `
            -UseBasicParsing `
            -TimeoutSec 180

          if (-not (Test-Path $installer)) {
            throw 'MT5 installer was not downloaded.'
          }

          $size = (Get-Item $installer).Length

          Write-Host "Installer size: $size bytes"

          "Installer size: $size bytes" |
            Set-Content `
              -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence\installer-info.txt') `
              -Encoding UTF8

          "MT5_INSTALLER=$installer" |
            Out-File $env:GITHUB_ENV -Encoding utf8

      - name: Install MetaTrader 5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'

          Remove-Item `
            -Path $env:MT5_DIR `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Path $env:MT5_DIR `
            -Force |
            Out-Null

          $p = Start-Process `
            -FilePath $env:MT5_INSTALLER `
            -ArgumentList @(
              '/auto'
              "/path:$env:MT5_DIR"
            ) `
            -Wait `
            -PassThru

          Write-Host "MT5 installer exit code: $($p.ExitCode)"

          @(
            "Installer exit code: $($p.ExitCode)"
            "Completed: $(Get-Date -Format o)"
          ) | Set-Content `
            -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence\installer-result.txt') `
            -Encoding UTF8

          Start-Sleep -Seconds 5

          $terminals = Get-ChildItem `
            -Path $env:MT5_DIR `
            -Filter 'terminal64.exe' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue

          $editors = Get-ChildItem `
            -Path $env:MT5_DIR `
            -Filter 'metaeditor64.exe' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue

          if ($terminals.Count -eq 0) {
            throw 'terminal64.exe was not found after MT5 installation.'
          }

          if ($editors.Count -eq 0) {
            throw 'metaeditor64.exe was not found after MT5 installation.'
          }

          $terminal = $terminals | Select-Object -First 1
          $editor = $editors | Select-Object -First 1

          Write-Host "MT5 terminal: $($terminal.FullName)"
          Write-Host "MetaEditor: $($editor.FullName)"

          @(
            "Terminal: $($terminal.FullName)"
            "MetaEditor: $($editor.FullName)"
          ) | Set-Content `
            -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence\mt5-paths.txt') `
            -Encoding UTF8

      - name: Prepare King's Bot
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $expertDir = Join-Path `
            $env:MT5_DIR `
            'MQL5\Experts\KingsBot'

          $reportDir = Join-Path `
            $env:MT5_DIR `
            'Reports'

          New-Item `
            -ItemType Directory `
            -Path $expertDir `
            -Force |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Path $reportDir `
            -Force |
            Out-Null

          $sourceRoot = Split-Path `
            $env:BOT_SOURCE `
            -Parent

          Copy-Item `
            -Path (Join-Path $sourceRoot '*') `
            -Destination $expertDir `
            -Recurse `
            -Force

          $expertSource = Join-Path `
            $expertDir `
            $env:BOT_SOURCE_NAME

          if (-not (Test-Path $expertSource)) {
            throw "EA source was not copied correctly: $expertSource"
          }

          Write-Host "Expert source: $expertSource"

          @(
            "Expert directory: $expertDir"
            "Expert source: $expertSource"
          ) | Set-Content `
            -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'phase7-evidence\expert-paths.txt') `
            -Encoding UTF8

      # ------------------------------------------------------------
      # IMPORTANT:
      # MetaEditor is rediscovered here.
      # No dependency on MT5_TERMINAL or EXPERT_DIR from another step.
      # ------------------------------------------------------------
      - name: Compile King's Bot
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'

          $evidence = Join-Path `
            $env:GITHUB_WORKSPACE `
            'phase7-evidence'

          $expertDir = Join-Path `
            $env:MT5_DIR `
            'MQL5\Experts\KingsBot'

          $expertSource = Join-Path `
            $expertDir `
            $env:BOT_SOURCE_NAME

          $editor = Get-ChildItem `
            -Path $env:MT5_DIR `
            -Filter 'metaeditor64.exe' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $editor) {
            throw 'MetaEditor could not be rediscovered.'
          }

          if (-
