name: King's Bot - Phase 7 Runtime Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase7:
    name: Phase 7 Runtime and Strategy Tester
    runs-on: windows-2025
    timeout-minutes: 35

    env:
      MT5_DIR: C:\MT5
      BOT_SOURCE_NAME: KingsBot_Phase6_Integration.mq5
      EX5_NAME: KingsBot_Phase6_Integration.ex5

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Initialize evidence
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = "$env:GITHUB_WORKSPACE\phase7-evidence"
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          New-Item -ItemType Directory -Path "$evidence\MT5-Logs" -Force | Out-Null
          New-Item -ItemType Directory -Path "$evidence\Tester-Logs" -Force | Out-Null
          Set-Content "$evidence\00-workflow-started.txt" "Phase 7 workflow started."

      - name: Locate King Bot source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter $env:BOT_SOURCE_NAME -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1

          if ($null -eq $source) {
            throw "Source file not found: $env:BOT_SOURCE_NAME"
          }

          Write-Host "SOURCE: $($source.FullName)"

          "BOT_SOURCE=$($source.FullName)" | Out-File "$env:GITHUB_ENV" -Encoding utf8

          Set-Content "$env:GITHUB_WORKSPACE\phase7-evidence\01-source-found.txt" $source.FullName

      - name: Download MT5 installer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = "$env:RUNNER_TEMP\mt5setup.exe"

          Invoke-WebRequest -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' -OutFile $installer -UseBasicParsing

          if (-not (Test-Path -LiteralPath $installer)) {
            throw 'MT5 installer was not downloaded.'
          }

          $size = (Get-Item -LiteralPath $installer).Length

          Write-Host "Installer size: $size bytes"

          if ($size -lt 100000) {
            throw 'MT5 installer is unexpectedly small.'
          }

          "MT5_INSTALLER=$installer" | Out-File "$env:GITHUB_ENV" -Encoding utf8

          Set-Content "$env:GITHUB_WORKSPACE\phase7-evidence\02-installer-downloaded.txt" "Installer downloaded. Size: $size bytes"

      - name: Install MT5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $mt5 = $env:MT5_DIR
          $installer = $env:MT5_INSTALLER

          if (Test-Path -LiteralPath $mt5) {
            Remove-Item -LiteralPath $mt5 -Recurse -Force
          }

          New-Item -ItemType Directory -Path $mt5 -Force | Out-Null

          Write-Host '========== INSTALLING MT5 =========='

          $p = Start-Process -FilePath $installer -ArgumentList '/auto', "/path:$mt5" -Wait -PassThru

          Write-Host "MT5 installer exit code: $($p.ExitCode)"

          Start-Sleep -Seconds 10

          $terminal = Get-ChildItem -Path $mt5 -Filter 'terminal64.exe' -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1

          $editor = Get-ChildItem -Path $mt5 -Filter 'metaeditor64.exe' -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1

          if ($null -eq $terminal) {
            throw "terminal64.exe was not found. Installer exit code: $($p.ExitCode)"
          }

          if ($null -eq $editor) {
            throw "metaeditor64.exe was not found. Installer exit code: $($p.ExitCode)"
          }

          Write-Host "TERMINAL: $($terminal.FullName)"
          Write-Host "METAEDITOR: $($editor.FullName)"

          "MT5_TERMINAL=$($terminal.FullName)" | Out-File "$env:GITHUB_ENV" -Encoding utf8
          "METAEDITOR=$($editor.FullName)" | Out-File "$env:GITHUB_ENV" -Encoding utf8

          Set-Content "$env:GITHUB_WORKSPACE\phase7-evidence\03-mt5-verified.txt" "Terminal: $($terminal.FullName)`nMetaEditor: $($editor.FullName)"

      - name: Prepare King Bot
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $destination = "$env:MT5_DIR\MQL5\Experts\KingsBot"

          New-Item -ItemType Directory -Path $destination -Force | Out-Null

          $sourceRoot = Split-Path -Path $env:BOT_SOURCE -Parent

          Copy-Item -Path "$sourceRoot\*" -Destination $destination -Recurse -Force

          $expert = "$destination\$env:BOT_SOURCE_NAME"

          if (-not (Test-Path -LiteralPath $expert)) {
            throw "Prepared source was not found: $expert"
          }

          Write-Host "EXPERT: $expert"

          "EXPERT_SOURCE=$expert" | Out-File "$env:GITHUB_ENV" -Encoding utf8

          Set-Content "$env:GITHUB_WORKSPACE\phase7-evidence\04-ea-prepared.txt" $expert

      - name: Compile King Bot
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'

          $log = "$env:RUNNER_TEMP\KingsBot-compile.log"

          Write-Host '========== COMPILING KING BOT =========='

          $p = Start-Process -FilePath $env:METAEDITOR -ArgumentList '/portable', "/compile:$env:EXPERT_SOURCE", "/log:$log" -WorkingDirectory $env:MT5_DIR -Wait -PassThru

          Write-Host "MetaEditor exit code: $($p.ExitCode)"

          if (Test-Path -LiteralPath $log) {
            Copy-Item -LiteralPath $log -Destination "$env:GITHUB_WORKSPACE\phase7-evidence\compile.log" -Force
            Get-Content -LiteralPath $log
          }

          Set-Content "$env:GITHUB_WORKSPACE\phase7-evidence\05-compile-complete.txt" "MetaEditor exit code: $($p.ExitCode)"

      - name: Locate and verify EX5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host '========== SEARCHING FOR EX5 =========='

          $files = Get-ChildItem -Path $env:MT5_DIR -Filter $env:EX5_NAME -File -Recurse -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending

          if ($null -eq $files) {
            Write-Host 'No expected EX5 found.'

            Get-ChildItem -Path $env:MT5_DIR -Filter '*.ex5' -File -Recurse -ErrorAction SilentlyContinue |
              Select-Object FullName, Length, LastWriteTime |
              Format-Table -AutoSize

            throw "EX5 not found: $env:EX5_NAME"
          }

          $ex5 = $files | Select-Object -First 1

          Write-Host "FOUND EX5: $($ex5.FullName)"
          Write-Host "SIZE: $($ex5.Length) bytes"

          if ($ex5.Length -lt 1000) {
            throw 'EX5 is unexpectedly small.'
          }

          $final = "$env:MT5_DIR\MQL5\Experts\KingsBot\$env:EX5_NAME"

          $sourceFull = [System.IO.Path]::GetFullPath($ex5.FullName)
          $finalFull = [System.IO.Path]::GetFullPath($final)

          if ($sourceFull -eq $finalFull) {
            Write-Host 'EX5 is already in the required location.'
            Write-Host 'No copy required.'
          }
          else {
            Write-Host "Copying EX5 from: $sourceFull"
            Write-Host "Copying EX5 to:   $finalFull"
            Copy-Item -LiteralPath $ex5.FullName -Destination $final -Force
          }

          if (-not (Test-Path -LiteralPath $final)) {
            throw "Final EX5 was not found: $final"
          }

          $finalSize = (Get-Item -LiteralPath $final).Length

          Write-Host "FINAL EX5: $final"
          Write-Host "FINAL SIZE: $finalSize bytes"

          Set-Content "$env:GITHUB_WORKSPACE\phase7-evidence\06-ex5-found.txt" "EX5: $final`nSize: $finalSize bytes"

      - name: Create tester configuration
        shell: powershell
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:MT5_LOGIN)) {
            throw 'MT5_LOGIN secret is empty.'
          }

          $config = "$env:MT5_DIR\KingsBot_Phase7_Tester.ini"

          $lines = @(
            '[Tester]'
            'Expert=KingsBot\KingsBot_Phase6_Integration.ex5'
            'Symbol=EURUSD'
            'Period=M15'
            'Model=0'
            'Optimization=0'
            'FromDate=2025.01.01'
            'ToDate=2026.08.01'
            'ForwardMode=0'
            "Login=$env:MT5_LOGIN"
            'Deposit=10000'
            'Currency=USD'
            'Leverage=1:100'
            'UseLocal=1'
            'UseRemote=0'
            'UseCloud=0'
            'Visual=0'
            'ReplaceReport=1'
            'Report=KingsBot_Phase7_Tester.htm'
            'ShutdownTerminal=1'
          )

          Set-Content -LiteralPath $config -Value $lines -Encoding Unicode

          if (-not (Test-Path -LiteralPath $config)) {
            throw 'Tester configuration was not created.'
          }

          Write-Host '========== TESTER CONFIGURATION =========='
          Get-Content -LiteralPath $config

          Copy-Item -LiteralPath $config -Destination "$env:GITHUB_WORKSPACE\phase7-evidence\Tester-Config.ini" -Force

          "TESTER_CONFIG=$config" | Out-File "$env:GITHUB_ENV" -Encoding utf8

          Set-Content "$env:GITHUB_WORKSPACE\phase7-evidence\07-tester-configured.txt" "Tester configuration created: $config"

      - name: Start Strategy Tester
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host '========== STARTING MT5 TESTER =========='

          $terminal = $env:MT5_TERMINAL

          if ([string]::IsNullOrWhiteSpace($terminal)) {
            throw 'MT5_TERMINAL environment variable is empty.'
          }

          if (-not (Test-Path -LiteralPath $terminal)) {
            throw "MT5 terminal not found: $terminal"
          }

          $config = $env:TESTER_CONFIG

          if ([string]::IsNullOrWhiteSpace($config)) {
            throw 'TESTER_CONFIG environment variable is empty.'
          }

          if (-not (Test-Path -LiteralPath $config)) {
            throw "Tester configuration not found: $config"
          }

          $expert = "$env:MT5_DIR\MQL5\Experts\KingsBot\$env:EX5_NAME"

          if (-not (Test-Path -LiteralPath $expert)) {
            throw "EA EX5 not found: $expert"
          }

          Get-Process -Name terminal64,metatester64,metatester -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 3

          Get-ChildItem -Path $env:MT5_DIR -Filter 'KingsBot_Phase7_Tester*.htm' -File -Recurse -ErrorAction SilentlyContinue |
            Remove-Item -Force -ErrorAction SilentlyContinue

          Write-Host "MT5 TERMINAL: $terminal"
          Write-Host "TESTER CONFIG: $config"
          Write-Host "EA: $expert"

          $p = Start-Process -FilePath $terminal -ArgumentList '/portable', "/config:$config" -WorkingDirectory $env:MT5_DIR -PassThru

          if ($null -eq $p) {
            throw 'MT5 could not be started.'
          }

          Write-Host "MT5 PID: $($p.Id)"

          Set-Content "$env:GITHUB_WORKSPACE\phase7-evidence\08-tester-started.txt" "MT5 started.`nPID: $($p.Id)`nTerminal: $terminal`nConfig: $config"

          $elapsed = 0
          $found = $false

          while ($elapsed -lt 1200) {

            Start-Sleep -Seconds 10
            $elapsed += 10

            $report = Get-ChildItem -Path $env:MT5_DIR -Filter 'KingsBot_Phase7_Tester*.htm' -File -Recurse -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1

            if ($null -ne $report -and $report.Length -gt 500) {

              Write-Host "REPORT FOUND: $($report.FullName)"
              Write-Host "REPORT SIZE: $($report.Length) bytes"

              Copy-Item -LiteralPath $report.FullName -Destination "$env:GITHUB_WORKSPACE\phase7-evidence\KingsBot_Phase7_Tester.htm" -Force

              Set-Content "$env:GITHUB_WORKSPACE\phase7-evidence\09-tester-report.txt" "Report: $($report.FullName)`nSize: $($report.Length) bytes"

              $found = $true
              break
            }

            if ($elapsed % 60 -eq 0) {

              Write-Host "Tester running: $elapsed seconds"

              $terminalProcess = Get-Process -Name terminal64 -ErrorAction SilentlyContinue
              $agents = Get-Process -Name metatester64,metatester -ErrorAction SilentlyContinue

              if ($null -eq $terminalProcess) {
                Write-Host 'WARNING: terminal64.exe is not running.'
              }
              else {
                Write-Host 'terminal64.exe is running.'
              }

              if ($null -eq $agents) {
                Write-Host 'WARNING: No MetaTester agent visible.'
              }
              else {
                Write-Host 'MetaTester agent detected.'
              }
            }
          }

          Write-Host '========== FINAL MT5 STATE =========='

          Get-Process -Name terminal64,metatester64,metatester -ErrorAction SilentlyContinue |
            Select-Object Id, ProcessName, Path, StartTime |
            Format-List

          if (-not $found) {

            Write-Host '========== TESTER LOGS =========='

            if (Test-Path -LiteralPath "$env:MT5_DIR\Tester\logs") {

              Get-ChildItem -Path "$env:MT5_DIR\Tester\logs" -File -Recurse -ErrorAction SilentlyContinue |
                Sort-Object LastWriteTime -Descending |
                Select-Object -First 20 |
                ForEach-Object {
                  Write-Host "LOG: $($_.FullName)"
                  Write-Host "SIZE: $($_.Length)"
                  Get-Content -LiteralPath $_.FullName -ErrorAction SilentlyContinue
                }
            }

            throw 'Strategy Tester report was not produced.'
          }

          Write-Host '========== PHASE 7 TESTER PASSED =========='

      - name: Collect evidence
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'

          $evidence = "$env:GITHUB_WORKSPACE\phase7-evidence"

          New-Item -ItemType Directory -Path "$evidence\MT5-Logs" -Force | Out-Null
          New-Item -ItemType Directory -Path "$evidence\Tester-Logs" -Force | Out-Null

          if (Test-Path -LiteralPath "$env:MT5_DIR\logs") {
            Copy-Item -Path "$env:MT5_DIR\logs\*" -Destination "$evidence\MT5-Logs" -Recurse -Force -ErrorAction SilentlyContinue
          }

          if (Test-Path -LiteralPath "$env:MT5_DIR\Tester\logs") {
            Copy-Item -Path "$env:MT5_DIR\Tester\logs\*" -Destination "$evidence\Tester-Logs" -Recurse -Force -ErrorAction SilentlyContinue
          }

          Write-Host '========== EVIDENCE =========='

          Get-ChildItem -Path $evidence -File -Recurse -ErrorAction SilentlyContinue |
            Select-Object FullName, Length, LastWriteTime |
            Format-Table -AutoSize

      - name: Upload Phase 7 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kingsbot-phase7-evidence
          path: phase7-evidence
          if-no-files-found: warn
          retention-days: 14
