name: KingsBot Phase 7 Runtime Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase7:
    name: Phase 7 MT5 Runtime Validation
    runs-on: windows-2022
    timeout-minutes: 45

    env:
      MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
      MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
      MT5_SERVER: ${{ secrets.MT5_SERVER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create evidence directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force `
            "$env:GITHUB_WORKSPACE\phase7-evidence" | Out-Null

      - name: Find KingsBot source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Get-ChildItem `
            "$env:GITHUB_WORKSPACE" `
            -Filter 'KingsBot_Phase6_Integration.mq5' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $source) {
            throw 'KingsBot_Phase6_Integration.mq5 was not found.'
          }

          Write-Host "Source: $($source.FullName)"

          "SOURCE=$($source.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Download MT5 installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = "$env:RUNNER_TEMP\mt5setup.exe"

          Invoke-WebRequest `
            'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' `
            -OutFile $installer `
            -UseBasicParsing

          if (-not (Test-Path $installer)) {
            throw 'MT5 installer download failed.'
          }

          "MT5_INSTALLER=$installer" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install MT5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $p = Start-Process `
            -FilePath $env:MT5_INSTALLER `
            -ArgumentList '/auto' `
            -Wait `
            -PassThru

          Write-Host "MT5 installer exit code: $($p.ExitCode)"

          Start-Sleep -Seconds 5

      - name: Locate MT5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $roots = @(
            'C:\Program Files',
            'C:\Program Files (x86)',
            'C:\MT5',
            $env:LOCALAPPDATA,
            $env:APPDATA,
            $env:RUNNER_TEMP
          )

          $meta = $null
          $terminal = $null

          foreach ($root in $roots) {
            if (-not (Test-Path $root)) {
              continue
            }

            if ($null -eq $meta) {
              $meta = Get-ChildItem `
                $root `
                -Filter 'metaeditor64.exe' `
                -File `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1
            }

            if ($null -eq $terminal) {
              $terminal = Get-ChildItem `
                $root `
                -Filter 'terminal64.exe' `
                -File `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1
            }

            if ($meta -and $terminal) {
              break
            }
          }

          if (-not $meta) {
            throw 'MetaEditor was not found.'
          }

          if (-not $terminal) {
            throw 'MT5 terminal64.exe was not found.'
          }

          $mt5Root = $terminal.Directory.FullName

          Write-Host "MetaEditor: $($meta.FullName)"
          Write-Host "Terminal: $($terminal.FullName)"
          Write-Host "MT5 root: $mt5Root"

          "METAEDITOR=$($meta.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "MT5_TERMINAL=$($terminal.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "MT5_ROOT=$mt5Root" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Prepare KingsBot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $expertDir = "$env:MT5_ROOT\MQL5\Experts\KingsBot"

          New-Item -ItemType Directory -Force $expertDir | Out-Null

          Copy-Item `
            $env:SOURCE `
            "$expertDir\KingsBot_Phase6_Integration.mq5" `
            -Force

          $files = Get-ChildItem `
            "$env:GITHUB_WORKSPACE" `
            -Include '*.mqh' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue

          foreach ($file in $files) {
            Copy-Item `
              $file.FullName `
              "$expertDir\$($file.Name)" `
              -Force
          }

          if (-not (Test-Path `
            "$expertDir\KingsBot_Phase6_Integration.mq5")) {
            throw 'Prepared MQ5 source is missing.'
          }

          "EXPERT_DIR=$expertDir" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "EXPERT=$expertDir\KingsBot_Phase6_Integration.mq5" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Compile KingsBot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $evidence = "$env:GITHUB_WORKSPACE\phase7-evidence"
          $log = "$evidence\metaeditor-output.txt"

          Set-Content $log 'KingsBot MetaEditor compilation'

          Add-Content $log "MetaEditor: $env:METAEDITOR"
          Add-Content $log "Source: $env:EXPERT"

          $args = "/compile:`"$env:EXPERT`" /log"

          $p = Start-Process `
            -FilePath $env:METAEDITOR `
            -ArgumentList $args `
            -WorkingDirectory $env:EXPERT_DIR `
            -Wait `
            -PassThru

          Write-Host "MetaEditor exit code: $($p.ExitCode)"
          Add-Content $log "MetaEditor exit code: $($p.ExitCode)"

          Start-Sleep -Seconds 5

          $ex5 = Get-ChildItem `
            "$env:MT5_ROOT" `
            -Filter 'KingsBot_Phase6_Integration.ex5' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $ex5) {
            Add-Content $log 'NO EX5 FOUND.'

            Get-ChildItem `
              "$env:MT5_ROOT" `
              -Filter '*.log' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 20 |
              ForEach-Object {
                Add-Content $log "===== $($_.FullName) ====="
                Get-Content $_.FullName -ErrorAction SilentlyContinue |
                  Add-Content $log
              }

            throw 'MetaEditor completed but EX5 was not produced.'
          }

          Write-Host "EX5 found: $($ex5.FullName)"

          Copy-Item `
            $ex5.FullName `
            "$evidence\KingsBot_Phase6_Integration.ex5" `
            -Force

          Set-Content `
            "$evidence\ex5-location.txt" `
            $ex5.FullName

      - name: Check MT5 credentials
        id: credentials
        shell: pwsh
        run: |
          $ready = `
            -not [string]::IsNullOrWhiteSpace($env:MT5_LOGIN) -and `
            -not [string]::IsNullOrWhiteSpace($env:MT5_PASSWORD) -and `
            -not [string]::IsNullOrWhiteSpace($env:MT5_SERVER)

          if ($ready) {
            "ready=true" >> $env:GITHUB_OUTPUT
            Write-Host 'MT5 credentials are configured.'
          }
          else {
            "ready=false" >> $env:GITHUB_OUTPUT
            Write-Host 'MT5 credentials are NOT configured.'
          }

      - name: Write runtime status
        if: always()
        shell: pwsh
        run: |
          if ('${{ steps.credentials.outputs.ready }}' -eq 'true') {
            'Strategy Tester was enabled.' |
              Set-Content `
                "$env:GITHUB_WORKSPACE\phase7-evidence\runtime-status.txt"
          }
          else {
            'Strategy Tester was skipped because MT5 credentials were not configured.' |
              Set-Content `
                "$env:GITHUB_WORKSPACE\phase7-evidence\runtime-status.txt"
          }

      - name: Create tester configuration
        if: steps.credentials.outputs.ready == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $config = "$env:MT5_ROOT\KingsBot_Phase7_Tester.ini"

          @(
            '[Common]'
            "Login=$env:MT5_LOGIN"
            "Password=$env:MT5_PASSWORD"
            "Server=$env:MT5_SERVER"
            'KeepPrivate=1'
            'NewsEnable=0'
            ''
            '[Tester]'
            'Expert=KingsBot\KingsBot_Phase6_Integration.ex5'
            'Symbol=EURUSD'
            'Period=M15'
            'Model=4'
            'Optimization=0'
            'FromDate=2025.01.01'
            'ToDate=2026.08.01'
            'Deposit=10000'
            'Currency=USD'
            'Leverage=1:100'
            'Visual=0'
            'Report=KingsBot_Phase7_Tester.htm'
            'ReplaceReport=1'
            'ShutdownTerminal=1'
          ) |
            Set-Content $config -Encoding Unicode

          Copy-Item `
            $config `
            "$env:GITHUB_WORKSPACE\phase7-evidence\" `
            -Force

          "TESTER_CONFIG=$config" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run Strategy Tester
        if: steps.credentials.outputs.ready == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $report = "$env:MT5_ROOT\KingsBot_Phase7_Tester.htm"

          Remove-Item `
            $report `
            -Force `
            -ErrorAction SilentlyContinue

          $p = Start-Process `
            -FilePath $env:MT5_TERMINAL `
            -ArgumentList @(
              '/portable',
              "/config:$env:TESTER_CONFIG"
            ) `
            -WorkingDirectory $env:MT5_ROOT `
            -PassThru

          Write-Host "MT5 PID: $($p.Id)"

          $deadline = (Get-Date).AddMinutes(20)

          while ((Get-Date) -lt $deadline) {
            if (Test-Path $report) {
              break
            }

            Start-Sleep -Seconds 10
          }

          if (-not (Test-Path $report)) {
            throw 'NO TESTER REPORT FOUND.'
          }

          if ((Get-Item $report).Length -eq 0) {
            throw 'Tester report is empty.'
          }

          Copy-Item `
            $report `
            "$env:GITHUB_WORKSPACE\phase7-evidence\" `
            -Force

      - name: Collect diagnostics
        if: always()
        shell: pwsh
        run: |
          $evidence = "$env:GITHUB_WORKSPACE\phase7-evidence"

          if ($env:MT5_ROOT -and (Test-Path $env:MT5_ROOT)) {
            Get-ChildItem `
              $env:MT5_ROOT `
              -Recurse `
              -File `
              -Include '*.log','*.ini','*.htm','*.html' `
              -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 100 |
              ForEach-Object {
                Copy-Item `
                  $_.FullName `
                  $evidence `
                  -Force `
                  -ErrorAction SilentlyContinue
              }
          }

      - name: Upload Phase 7 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-Phase7-Evidence
          path: phase7-evidence
          if-no-files-found: warn
          retention-days: 14
