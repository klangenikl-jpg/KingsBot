name: King’s Bot Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Get KingsBot source
        uses: actions/checkout@v4

      - name: Compile KingsBot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "=== KING'S BOT COMPILER DIAGNOSTIC ==="

          # Source path used by the previous failed run.
          $source = Join-Path $env:GITHUB_WORKSPACE 'KingsBot\KingsBot_Phase6_Integration.mq5'

          # Locate MetaEditor instead of assuming one installation path.
          $candidates = @(
            'C:\Program Files\MetaTrader 5\MetaEditor64.exe',
            'C:\Program Files\MetaTrader 5\MetaEditor.exe'
          )

          $editor = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $editor) {
            $editor = Get-ChildItem 'C:\Program Files','C:\Program Files (x86)' `
              -Filter 'MetaEditor64.exe' -File -Recurse -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName -First 1
          }

          if (-not $editor) {
            Write-Host "ERROR: MetaEditor executable was not found."
            Write-Host "Installed MetaTrader/MetaEditor locations:"
            Get-ChildItem 'C:\Program Files','C:\Program Files (x86)' `
              -Filter '*MetaEditor*.exe' -File -Recurse -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName
            throw "MetaEditor64.exe was not found."
          }

          if (-not (Test-Path $source)) {
            Write-Host "ERROR: Source file was not found:"
            Write-Host $source
            Write-Host "Repository tree:"
            Get-ChildItem $env:GITHUB_WORKSPACE -Recurse -File |
              Select-Object -ExpandProperty FullName
            throw "KingsBot_Phase6_Integration.mq5 was not found."
          }

          $sourceDir = Split-Path $source -Parent
          $baseName = [IO.Path]::GetFileNameWithoutExtension($source)
          $log = Join-Path $sourceDir "$baseName.log"
          $ex5 = Join-Path $sourceDir "$baseName.ex5"

          Remove-Item $log,$ex5 -Force -ErrorAction SilentlyContinue

          Write-Host "MetaEditor: $editor"
          Write-Host "Source:     $source"
          Write-Host "Log:        $log"
          Write-Host "EX5:        $ex5"
          Write-Host ""
          Write-Host "Starting MetaEditor compilation..."

          $arguments = @("/compile:`"$source`"", "/log")
          $process = Start-Process -FilePath $editor `
            -ArgumentList $arguments `
            -WorkingDirectory $sourceDir `
            -Wait `
            -PassThru

          Write-Host "MetaEditor process exit code: $($process.ExitCode)"

          # MetaEditor may not provide a useful process exit code, so the
          # compiler log and resulting EX5 are the authoritative checks.
          if (-not (Test-Path $log)) {
            Write-Host "ERROR: Compiler log was not created."
            Write-Host "Files next to source:"
            Get-ChildItem $sourceDir -File |
              Select-Object Name,Length,LastWriteTime
            throw "MetaEditor did not create the expected compile log."
          }

          Write-Host ""
          Write-Host "========== COMPILER LOG =========="
          Get-Content $log -Raw
          Write-Host "======== END COMPILER LOG ========"
          Write-Host ""

          if (-not (Test-Path $ex5)) {
            throw "Compilation did not produce $ex5. See the compiler log above."
          }

          $ex5Info = Get-Item $ex5
          if ($ex5Info.Length -le 0) {
            throw "EX5 was created but is empty."
          }

          Write-Host "COMPILATION SUCCESS"
          Write-Host "EX5: $($ex5Info.FullName)"
          Write-Host "Size: $($ex5Info.Length) bytes"

      - name: Verify build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'KingsBot\KingsBot_Phase6_Integration.mq5'
          $sourceDir = Split-Path $source -Parent
          $baseName = [IO.Path]::GetFileNameWithoutExtension($source)
          $ex5 = Join-Path $sourceDir "$baseName.ex5"
          $log = Join-Path $sourceDir "$baseName.log"

          if (-not (Test-Path $ex5)) {
            throw "VERIFY FAILED: EX5 does not exist: $ex5"
          }

          if ((Get-Item $ex5).Length -le 0) {
            throw "VERIFY FAILED: EX5 is empty."
          }

          if (-not (Test-Path $log)) {
            throw "VERIFY FAILED: compile log does not exist."
          }

          Write-Host "=== BUILD VERIFIED ==="
          Get-Item $ex5,$log | Select-Object FullName,Length,LastWriteTime

      - name: Prepare build artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Join-Path $env:GITHUB_WORKSPACE 'KingsBot\KingsBot_Phase6_Integration.mq5'
          $sourceDir = Split-Path $source -Parent
          $baseName = [IO.Path]::GetFileNameWithoutExtension($source)
          $ex5 = Join-Path $sourceDir "$baseName.ex5"
          $log = Join-Path $sourceDir "$baseName.log"

          $artifactDir = Join-Path $env:GITHUB_WORKSPACE 'build-artifacts'
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null

          Copy-Item $ex5 $artifactDir -Force
          Copy-Item $log $artifactDir -Force

          if (-not (Test-Path (Join-Path $artifactDir "$baseName.ex5"))) {
            throw "Artifact preparation failed: EX5 was not copied."
          }

          Write-Host "=== ARTIFACT DIRECTORY ==="
          Get-ChildItem $artifactDir | Select-Object Name,Length,LastWriteTime

      - name: Upload build results
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-Phase6-build
          path: build-artifacts
          if-no-files-found: error
          retention-days: 14
