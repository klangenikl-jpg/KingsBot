name: King's Bot Build - MT5

on:
  workflow_dispatch:
  push:
    paths:
      - 'KingsBot/**'
      - '.github/workflows/KingsBot_build_MT5.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Get King's Bot source
        uses: actions/checkout@v4

      - name: Install MetaTrader 5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          $installDir = 'C:\MT5'

          Write-Host '========================================'
          Write-Host ' INSTALLING METATRADER 5'
          Write-Host '========================================'

          Invoke-WebRequest `
            -Uri 'https://download.terminal.free/cdn/web/metaquotes.ltd/mt5/mt5setup.exe' `
            -OutFile $installer

          if (!(Test-Path $installer)) {
            throw 'MetaTrader 5 installer was not downloaded.'
          }

          Write-Host "Installer downloaded: $installer"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $installDir | Out-Null

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList '/auto', "/path:`"$installDir`"" `
            -Wait `
            -PassThru

          Write-Host "MT5 installer exit code: $($process.ExitCode)"

          if ($process.ExitCode -ne 0) {
            throw "MetaTrader 5 installation failed with exit code $($process.ExitCode)."
          }

          Write-Host 'MetaTrader 5 installation completed.'

      - name: Locate and verify MetaEditor
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host '========================================'
          Write-Host ' LOCATING METAEDITOR'
          Write-Host '========================================'

          $searchRoots = @(
            'C:\MT5',
            'C:\Program Files\MetaTrader 5',
            'C:\Program Files (x86)\MetaTrader 5'
          )

          $editor = $null

          foreach ($root in $searchRoots) {
            if (Test-Path $root) {

              Write-Host "Searching: $root"

              $editor = Get-ChildItem `
                -Path $root `
                -Filter 'metaeditor64.exe' `
                -File `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -ExpandProperty FullName -First 1

              if ($editor) {
                break
              }
            }
          }

          if (-not $editor) {
            Write-Host ''
            Write-Host 'MetaEditor64.exe was NOT found.'
            Write-Host ''
            Write-Host 'Files found under C:\MT5:'

            if (Test-Path 'C:\MT5') {
              Get-ChildItem `
                -Path 'C:\MT5' `
                -Recurse `
                -File `
                -ErrorAction SilentlyContinue |
                Select-Object -First 200 FullName
            }

            throw 'MetaEditor64.exe was not found after MetaTrader 5 installation.'
          }

          Write-Host ''
          Write-Host "METAEDITOR FOUND: $editor"
          Write-Host ''

          "METAEDITOR=$editor" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8

      - name: Find King's Bot source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host '========================================'
          Write-Host ' FINDING KING''S BOT SOURCE'
          Write-Host '========================================'

          $expected = Join-Path `
            $env:GITHUB_WORKSPACE `
            'KingsBot\KingsBot_Phase6_Integration.mq5'

          if (Test-Path $expected) {

            Write-Host "SOURCE FOUND: $expected"

            "SOURCE_FILE=$expected" |
              Out-File `
                -FilePath $env:GITHUB_ENV `
                -Append `
                -Encoding utf8

          }
          else {

            Write-Host 'Expected source was not found.'
            Write-Host ''
            Write-Host 'Searching repository for all MQ5 files:'

            $mq5Files = Get-ChildItem `
              -Path $env:GITHUB_WORKSPACE `
              -Filter '*.mq5' `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue

            if (-not $mq5Files) {
              throw 'No MQ5 source files were found anywhere in the repository.'
            }

            $mq5Files |
              Select-Object FullName

            $match = $mq5Files |
              Where-Object {
                $_.Name -eq 'KingsBot_Phase6_Integration.mq5'
              } |
              Select-Object -First 1

            if (-not $match) {
              throw 'KingsBot_Phase6_Integration.mq5 was not found anywhere in the repository.'
            }

            Write-Host "SOURCE FOUND: $($match.FullName)"

            "SOURCE_FILE=$($match.FullName)" |
              Out-File `
                -FilePath $env:GITHUB_ENV `
                -Append `
                -Encoding utf8
          }

      - name: Prepare MT5 source tree
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host '========================================'
          Write-Host ' PREPARING MT5 SOURCE TREE'
          Write-Host '========================================'

          $destination = 'C:\MT5\MQL5\Experts\KingsBot'

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $destination | Out-Null

          $sourceDirectory = Split-Path `
            -Path $env:SOURCE_FILE `
            -Parent

          Write-Host "Source directory: $sourceDirectory"
          Write-Host "Destination: $destination"

          Copy-Item `
            -Path "$sourceDirectory\*" `
            -Destination $destination `
            -Recurse `
            -Force

          $compileSource = Join-Path `
            $destination `
            'KingsBot_Phase6_Integration.mq5'

          if (!(Test-Path $compileSource)) {
            throw "Prepared source was not found at: $compileSource"
          }

          Write-Host "COMPILE SOURCE: $compileSource"

          "COMPILE_SOURCE=$compileSource" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      - name: Compile King's Bot
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host '========================================'
          Write-Host ' KING''S BOT COMPILATION'
          Write-Host '========================================'

          Write-Host "MetaEditor:"
          Write-Host $env:METAEDITOR

          Write-Host ''
          Write-Host "Source:"
          Write-Host $env:COMPILE_SOURCE

          if (!(Test-Path $env:METAEDITOR)) {
            throw 'MetaEditor executable is missing.'
          }

          if (!(Test-Path $env:COMPILE_SOURCE)) {
            throw 'King''s Bot source file is missing.'
          }

          $sourceDirectory = Split-Path `
            -Path $env:COMPILE_SOURCE `
            -Parent

          $logFile = Join-Path `
            $sourceDirectory `
            '
