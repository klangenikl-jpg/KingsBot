name: King's Bot - MT5 Artifact Build

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.mq5'
      - '**/*.mqh'
      - '**/*.ex5'
      - '.github/workflows/KingsBot_MT5_Artifact_Build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Package King's Bot
    runs-on: windows-2025
    timeout-minutes: 15

    steps:

      # ---------------------------------------------------------
      # 1. GET KING'S BOT SOURCE
      # ---------------------------------------------------------
      - name: Get King's Bot source
        uses: actions/checkout@v4


      # ---------------------------------------------------------
      # 2. LOCATE ALL MQL5 SOURCE FILES
      # ---------------------------------------------------------
      - name: Locate King's Bot source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========================================"
          Write-Host " LOCATING KING'S BOT SOURCE"
          Write-Host "========================================"

          $workspace = $env:GITHUB_WORKSPACE

          $mq5Files = @(
            Get-ChildItem `
              -Path $workspace `
              -Recurse `
              -File `
              -Filter "*.mq5" `
              -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FullName -notmatch '\\.git\\'
            }
          )

          $mqhFiles = @(
            Get-ChildItem `
              -Path $workspace `
              -Recurse `
              -File `
              -Filter "*.mqh" `
              -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FullName -notmatch '\\.git\\'
            }
          )

          Write-Host ""
          Write-Host "MQ5 files found: $($mq5Files.Count)"
          Write-Host "MQH files found: $($mqhFiles.Count)"
          Write-Host ""

          foreach ($file in $mq5Files) {
            Write-Host "MQ5: $($file.FullName)"
          }

          foreach ($file in $mqhFiles) {
            Write-Host "MQH: $($file.FullName)"
          }

          if ($mq5Files.Count -eq 0) {
            throw "NO .mq5 FILES FOUND IN THE REPOSITORY."
          }

          "MQ5_COUNT=$($mq5Files.Count)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          "MQH_COUNT=$($mqhFiles.Count)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8


      # ---------------------------------------------------------
      # 3. VALIDATE SOURCE FILES
      # ---------------------------------------------------------
      - name: Validate MQL5 source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========================================"
          Write-Host " VALIDATING MQL5 SOURCE"
          Write-Host "========================================"

          $workspace = $env:GITHUB_WORKSPACE

          $files = @(
            Get-ChildItem `
              -Path $workspace `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
            Where-Object {
              ($_.Extension -eq '.mq5' -or
               $_.Extension -eq '.mqh') -and
              $_.FullName -notmatch '\\.git\\'
            }
          )

          foreach ($file in $files) {

            Write-Host ""
            Write-Host "Checking:"
            Write-Host $file.FullName

            $content = Get-Content `
              -LiteralPath $file.FullName `
              -Raw

            if ([string]::IsNullOrWhiteSpace($content)) {
              throw "EMPTY SOURCE FILE: $($file.FullName)"
            }

            if ($content.Contains([char]0)) {
              throw "INVALID NULL BYTE FOUND IN: $($file.FullName)"
            }
          }

          Write-Host ""
          Write-Host "SOURCE VALIDATION PASSED."


      # ---------------------------------------------------------
      # 4. FIND ANY EXISTING EX5 FILES
      # ---------------------------------------------------------
      - name: Locate existing EX5 files
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========================================"
          Write-Host " LOCATING EXISTING EX5 FILES"
          Write-Host "========================================"

          $workspace = $env:GITHUB_WORKSPACE

          $ex5Files = @(
            Get-ChildItem `
              -Path $workspace `
              -Recurse `
              -File `
              -Filter "*.ex5" `
              -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FullName -notmatch '\\.git\\'
            }
          )

          Write-Host ""
          Write-Host "EX5 files found: $($ex5Files.Count)"
          Write-Host ""

          foreach ($file in $ex5Files) {
            Write-Host "EX5: $($file.FullName)"
          }

          "EX5_COUNT=$($ex5Files.Count)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8


      # ---------------------------------------------------------
      # 5. PREPARE ARTIFACT DIRECTORY
      # ---------------------------------------------------------
      - name: Prepare build artifacts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========================================"
          Write-Host " PREPARING ARTIFACTS"
          Write-Host "========================================"

          $artifactRoot = Join-Path `
            $env:GITHUB
