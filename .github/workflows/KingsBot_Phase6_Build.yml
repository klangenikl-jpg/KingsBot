name: Build King's Bot

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.mq5'
      - '**/*.mqh'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build:
    name: Build King's Bot
    runs-on: windows-2025
    timeout-minutes: 30

    steps:

      - name: Get King's Bot source
        uses: actions/checkout@v4

      - name: Show repository contents
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host ""
          Write-Host "========================================"
          Write-Host "KING'S BOT SOURCE CHECK"
          Write-Host "========================================"

          Write-Host "GitHub workspace:"
          Write-Host $env:GITHUB_WORKSPACE

          if (!(Test-Path $env:GITHUB_WORKSPACE)) {
              throw "GitHub workspace does not exist."
          }

          Write-Host ""
          Write-Host "MQ5 files found:"

          $mq5Files = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter *.mq5 `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue

          if (!$mq5Files) {
              throw "No MQ5 source files were found in the repository."
          }

          foreach ($file in $mq5Files) {
              Write-Host $file.FullName
          }

      - name: Install MetaTrader 5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host ""
          Write-Host "========================================"
          Write-Host "INSTALLING METATRADER 5"
          Write-Host "========================================"

          $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"
          $mt5Root = Join-Path $env:RUNNER_TEMP "MetaTrader5"

          if (Test-Path $mt5Root) {
              Remove-Item $mt5Root -Recurse -Force -ErrorAction SilentlyContinue
          }

          New-Item -ItemType Directory -Path $mt5Root -Force | Out-Null

          $downloadUrl = "https://download.terminal.free/cdn/web/metaquotes.ltd/mt5/mt5setup.exe"

          Write-Host "Downloading MetaTrader 5 installer..."

          Invoke-WebRequest `
            -Uri $downloadUrl `
            -OutFile $installer `
            -UseBasicParsing

          if (!(Test-Path $installer)) {
              throw "MetaTrader 5 installer was not downloaded."
          }

          Write-Host "Installer downloaded successfully."
          Write-Host "Installer: $installer"
          Write-Host "Target: $mt5Root"

          Write-Host ""
          Write-Host "Starting unattended installation..."

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList @(
              "/auto",
              "/path:`"$mt5Root`""
            ) `
            -Wait `
            -PassThru

          Write-Host "Installer exit code: $($process.ExitCode)"

          if ($process.ExitCode -ne 0) {
              Write-Host ""
              Write-Host "WARNING: Installer returned a non-zero exit code."
              Write-Host "We will NOT fail yet."
              Write-Host "Checking whether MetaTrader 5 was actually installed..."
          }

          Start-Sleep -Seconds 5

          Write-Host ""
          Write-Host "Searching for MetaEditor64.exe..."

          $searchRoots = @(
              $mt5Root,
              "$env:RUNNER_TEMP",
              "C:\Program Files",
              "C:\Program Files (x86)",
              $env:LOCALAPPDATA,
              $env:APPDATA
          )

          $metaEditor = $null

          foreach ($root in $searchRoots) {

              if (!(Test-Path $root)) {
                  continue
              }

              Write-Host "Checking: $root"

              $found = Get-ChildItem `
                -Path $root `
                -Filter metaeditor64.exe `
                -File `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

              if ($found) {
                  $metaEditor = $found.FullName
                  break
              }
          }

          if (!$metaEditor) {

              Write-Host ""
              Write-Host "MetaEditor64.exe was not found."
              Write-Host ""
              Write-Host "Contents of target directory:"

              if (Test-Path $mt5Root) {
                  Get-ChildItem `
                    -Path $mt5Root `
                    -Recurse `
                    -ErrorAction SilentlyContinue |
                    Select-Object FullName
              }

              Write-Host ""
              Write-Host "Retrying MetaTrader 5 installation using standard path..."

              $retry = Start-Process `
                -FilePath $installer `
                -ArgumentList @("/auto") `
                -Wait `
                -PassThru

              Write-Host "Retry installer exit code: $($retry.ExitCode)"

              Start-Sleep -Seconds 5

              foreach ($root in @(
                  "C:\Program Files",
                  "C:\Program Files (x86)",
                  $env:LOCALAPPDATA,
                  $env:APPDATA
              )) {

                  if (!(Test-Path $root)) {
                      continue
                  }

                  $found = Get-ChildItem `
                    -Path $root `
                    -Filter metaeditor64.exe `
                    -File `
                    -Recurse `
                    -ErrorAction SilentlyContinue |
                    Select-Object -First 1

                  if ($found) {
                      $metaEditor = $found.FullName
                      break
                  }
              }
          }

          if (!$metaEditor) {
              throw "MetaTrader 5 installation could not be verified: metaeditor64.exe was not found."
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "METATRADER 5 VERIFIED"
          Write-Host "========================================"
          Write-Host "MetaEditor:"
          Write-Host $metaEditor

          "METAEDITOR_PATH=$metaEditor" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8

      - name: Locate King's Bot source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host ""
          Write-Host "========================================"
          Write-Host "LOCATING KING'S BOT SOURCE"
          Write-Host "========================================"

          $sourceFiles = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter "KingsBot_Phase6_Integration.mq5" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue

          if (!$sourceFiles) {

              Write-Host ""
              Write-Host "Target file was not found."
              Write-Host ""
              Write-Host "Available MQ5 files:"

              Get-ChildItem `
                -Path $env:GITHUB_WORKSPACE `
                -Filter *.mq5 `
                -File `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object FullName

              throw "KingsBot_Phase6_Integration.mq5 was not found."
          }

          $sourceFile = $sourceFiles |
            Select-Object -First 1

          Write-Host "Source found:"
          Write-Host $sourceFile.FullName

          "KINGSBOT_SOURCE=$($sourceFile.FullName)" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8

      - name: Compile King's Bot
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host ""
          Write-Host "========================================"
          Write-Host "COMPILING KING'S BOT"
          Write-Host "========================================"

          Write-Host "MetaEditor:"
          Write-Host $env:METAEDITOR_PATH

          Write-Host ""
          Write-Host "Source:"
          Write-Host $env:KINGSBOT_SOURCE

          if (!(Test-Path $env:METAEDITOR_PATH)) {
              throw "MetaEditor executable does not exist."
          }

          if (!(Test-Path $env:KINGSBOT_SOURCE)) {
              throw "King's Bot MQ5 source does not exist."
          }

          $sourceDirectory = Split-Path `
            -Parent `
            $env:KINGSBOT_SOURCE

          $logFile = [System.IO.Path]::ChangeExtension(
            $env:KINGSBOT_SOURCE,
            ".log"
          )

          Write-Host ""
          Write-Host "Running MetaEditor compiler..."

          $compile = Start-Process `
            -FilePath $env:METAEDITOR_PATH `
            -ArgumentList @(
              "/compile:`"$($env:KINGSBOT_SOURCE)`"",
              "/include:`"$sourceDirectory`"",
              "/log"
            ) `
            -WorkingDirectory $sourceDirectory `
            -Wait `
            -PassThru

          Write-Host ""
          Write-Host "MetaEditor exit code: $($compile.ExitCode)"

          Start-Sleep -Seconds 2

          Write-Host ""
          Write-Host "Compilation log:"
          Write-Host "----------------------------------------"

          if (Test-Path $logFile) {
              Get-Content $logFile
          }
          else {
              Write-Host "No compiler log was generated."
          }

          Write-Host "----------------------------------------"

          $expectedEx5 = [System.IO.Path]::ChangeExtension(
            $env:KINGSBOT_SOURCE,
            ".ex5"
          )

          Write-Host ""
          Write-Host "Checking for EX5:"
          Write-Host $expectedEx5

          if (!(Test-Path $expectedEx5)) {

              Write-Host ""
              Write-Host "No EX5 was produced."

              Write-Host ""
              Write-Host "Nearby files:"
              Get-ChildItem `
                -Path $sourceDirectory `
                -File `
                -ErrorAction SilentlyContinue |
                Select-Object Name, Length

              throw "Compilation failed: no EX5 file was produced."
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "COMPILATION SUCCESSFUL"
          Write-Host "========================================"
          Write-Host $expectedEx5

          "KINGSBOT_EX5=$expectedEx5" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8

      - name: Prepare build artifacts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host ""
          Write-Host "========================================"
          Write-Host "PREPARING BUILD ARTIFACTS"
          Write-Host "========================================"

          $artifactDir = Join-Path `
            $env:RUNNER_TEMP `
            "KingsBot_Release"

          if (Test-Path $artifactDir) {
              Remove-Item `
                $artifactDir `
                -Recurse `
                -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $artifactDir `
            -Force |
            Out-Null

          Copy-Item `
            -Path $env:KINGSBOT_EX5 `
            -Destination $artifactDir `
            -Force

          if (Test-Path $env:KINGSBOT_SOURCE) {
              Copy-Item `
                -Path $env:KINGSBOT_SOURCE `
                -Destination $artifactDir `
                -Force
          }

          Write-Host ""
          Write-Host "Release files:"
          Get-ChildItem `
            -Path $artifactDir `
            -File |
            Select-Object Name, Length

          "KINGSBOT_ARTIFACT_DIR=$artifactDir" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8

      - name: Upload King's Bot build
        uses: actions/upload-artifact@v4
        with:
          name: KingsBot-Phase6-Build
          path: ${{ env.KINGSBOT_ARTIFACT_DIR }}
          if-no-files-found: error
          retention-days: 30
